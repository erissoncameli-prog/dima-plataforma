<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Acervo de Produtos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes do Acervo (js/acervo.js; catálogo vem das views) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/acervo.css" rel="stylesheet">
</head>
<body class="dgm">

<div id="app"></div>

<!-- Janelas FORA do #app (armadilha 11); .ac-ov = escopo do tema. <i data-ic> vira ícone SVG. -->
<div class="modal-overlay ac-ov" id="modal-ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-cab">
  <div class="modal acv-ficha">
    <div class="modal-header">
      <div class="modal-title" id="ficha-cab" style="flex:1;min-width:0">Produto</div>
      <button type="button" class="modal-close" onclick="fecharFicha()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="ficha-body" style="max-height:70vh;overflow-y:auto"></div>
    <div class="modal-footer" id="ficha-footer"></div>
  </div>
</div>

<div class="modal-overlay ac-ov" id="modal-pub" role="dialog" aria-modal="true" aria-labelledby="pub-tit">
  <div class="modal acv-conf">
    <div class="modal-header">
      <div style="flex:1;min-width:0"><div class="modal-title" id="pub-tit">Liberar no portal público?</div><div class="acv-conf-arq" id="pub-arq"></div></div>
      <button type="button" class="modal-close" onclick="fecharConfPub(false)" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body">
      <p class="acv-texto" style="margin:0">Só arquivos marcados aparecem no portal. A autoria (nome do consultor) será exibida; valor e Nota Técnica não.</p>
      <div class="acv-aviso acv-aviso-info"><i data-ic="cadeado"></i><span>Confira antes se o documento não traz <strong>CPF, dados bancários</strong> ou outro dado pessoal além da autoria.</span></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="fecharConfPub(false)">Cancelar</button>
      <button type="button" class="btn btn-primary" id="pub-ok" onclick="fecharConfPub(true)"><i data-ic="globo"></i>Liberar</button>
    </div>
  </div>
</div>

<div class="acv-viewer-overlay" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-nome">
  <div class="acv-viewer-barra">
    <div style="min-width:0;flex:1">
      <div class="acv-viewer-nome" id="viewer-nome"></div>
      <div class="acv-viewer-sub" id="viewer-sub"></div>
    </div>
    <button class="acv-vbtn" id="viewer-abrir" type="button"><i data-ic="externo"></i>Abrir em nova aba</button>
    <button class="acv-vbtn x" type="button" onclick="fecharViewer()" aria-label="Fechar (Esc)"><i data-ic="x"></i></button>
  </div>
  <div class="acv-viewer-corpo" id="viewer-corpo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/acervo-capas.js"></script>
<script src="../js/acervo.js"></script>
</body>
</html>
