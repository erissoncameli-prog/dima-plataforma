<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Manual do sistema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa + componentes do manual (css/ajuda.css, prefixo aj-) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/ajuda.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/logos.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/administracao.js"></script>
<script>
// ── Manual do sistema ───────────────────────────────────────────────────
// Conteúdo em AJUDA (js/ajuda.js), o mesmo do painel "?" de cada página. Guia aberta: ?guia=<id> ou a última vista.
;(async function () {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }

  // Mesmos grupos do menu lateral (layout.js)
  const GRUPOS = [
    ['Projeto', ['dashboard', 'tarefas']],
    ['Planejamento', ['atividades', 'tdrs', 'matriz', 'remanejamentos']],
    ['Execução', ['fornecedores', 'contratos', 'produtos', 'acervo', 'financeiro', 'diagnostico']],
    ['Apoio', ['viagens', 'relatorios', 'mapa', 'repositorio', 'auditoria', 'pulso']],
    ['Referência', ['glossario']],
  ];
  const ORDEM = GRUPOS.flatMap(g => g[1]).filter(id => AJUDA[id]);
  const HREF = { dashboard: 'dashboard.html', tarefas: 'tarefas.html', atividades: 'atividades.html', tdrs: 'tdrs.html', matriz: 'matriz.html',
    remanejamentos: 'remanejamentos.html', fornecedores: 'fornecedores.html', contratos: 'contratos.html', produtos: 'produtos.html',
    acervo: 'acervo.html', financeiro: 'financeiro.html', diagnostico: 'diagnostico.html', viagens: 'viagens.html',
    relatorios: 'relatorios.html', mapa: 'mapa.html', repositorio: 'repositorio.html', auditoria: 'auditoria.html', pulso: 'pulso.html' };
  const T = {
    pt: { titulo: 'Manual do sistema', sub: 'Como cada guia funciona, quem pode fazer o quê e o que significam os números.', busca: 'Buscar em todo o manual', ir: 'Ir para', nada: 'Nenhum trecho com', abrir: 'Abrir guia', trechos: (n, g) => `${n} ${n === 1 ? 'trecho' : 'trechos'} em ${g} ${g === 1 ? 'guia' : 'guias'}` },
    en: { titulo: 'System manual', sub: 'How each section works, who can do what and what the numbers mean.', busca: 'Search the whole manual', ir: 'Go to', nada: 'Nothing found for', abrir: 'Open section', trechos: (n, g) => `${n} ${n === 1 ? 'match' : 'matches'} in ${g} ${g === 1 ? 'section' : 'sections'}` },
    es: { titulo: 'Manual del sistema', sub: 'Cómo funciona cada sección, quién puede hacer qué y qué significan los números.', busca: 'Buscar en todo el manual', ir: 'Ir a', nada: 'Nada encontrado para', abrir: 'Abrir sección', trechos: (n, g) => `${n} ${n === 1 ? 'resultado' : 'resultados'} en ${g} ${g === 1 ? 'sección' : 'secciones'}` },
  };
  const lang = () => _ajudaIdioma();
  const tx = () => T[lang()] || T.pt;
  const mod = id => AJUDA[id]?.[lang()] || AJUDA[id]?.pt;
  const e = s => _ajudaEsc(s);
  let guia = new URLSearchParams(location.search).get('guia');
  if (!AJUDA[guia]) { try { guia = localStorage.getItem('ajuda_tab_ativo'); } catch (x) { guia = null; } }
  if (!AJUDA[guia]) guia = 'dashboard';

  document.getElementById('app').innerHTML = gerarLayout(tx().titulo, 'ajuda') + `
    <div class="fade-in aj">
      <div class="aj-topo"><h2>${e(tx().titulo)}</h2><p>${e(tx().sub)}</p></div>
      <label class="aj-busca">${adIc('busca')}<input id="aj-q" type="search" autocomplete="off" placeholder="${e(tx().busca)}" aria-label="${e(tx().busca)}"><span class="aj-cont" id="aj-cont" aria-live="polite"></span></label>
      <div id="aj-res" class="aj-res" hidden></div>
      <div class="aj-grade" id="aj-grade">
        <nav class="aj-nav" id="aj-nav" aria-label="Guias do manual"></nav>
        <div class="aj-corpo" id="aj-corpo"></div>
      </div>
    </div>` + '</div></div></div>';
  adSeletorTema(); carregarLogosSidebar();

  function nav() {
    document.getElementById('aj-nav').innerHTML = GRUPOS.map(([g, ids]) => {
      const bs = ids.filter(id => AJUDA[id]).map(id => `<button type="button" data-g="${id}" aria-current="${id === guia}">${e(mod(id).titulo)}</button>`).join('');
      return bs ? `<span class="g">${e(g)}</span>${bs}` : '';
    }).join('');
  }
  function corpo() {
    const m = mod(guia);
    document.getElementById('aj-corpo').innerHTML = `
      <h3>${e(m.titulo)}</h3>
      ${m.intro ? `<div class="aj-intro">${e(m.intro)}</div>` : ''}
      ${(m.secoes || []).map((s, i) => `<section class="aj-sec">
        <button type="button" aria-expanded="${i === 0}" aria-controls="aj-s${i}">${adIc('doc', 'p')}${e(s.titulo)}${adIc('cv', 'aj-cv')}</button>
        <ul id="aj-s${i}" ${i === 0 ? '' : 'hidden'}>${s.itens.map(it => `<li>${e(it)}</li>`).join('')}</ul></section>`).join('')}
      ${HREF[guia] ? `<a class="btn btn-secondary aj-ir" href="${HREF[guia]}">${e(tx().ir)} ${e(m.titulo)} ${adIc('seta', 'p')}</a>` : ''}`;
  }
  function abrir(id, rolar) {
    guia = id; try { localStorage.setItem('ajuda_tab_ativo', id); } catch (x) {}
    const u = new URL(location.href); u.searchParams.set('guia', id); history.replaceState(null, '', u);
    nav(); corpo();
    if (innerWidth < 760) document.querySelector('#aj-nav [aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (rolar) document.getElementById('aj-corpo').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('aj-nav').addEventListener('click', ev => { const b = ev.target.closest('[data-g]'); if (b) abrir(b.dataset.g, innerWidth < 760); });
  document.getElementById('aj-corpo').addEventListener('click', ev => {
    const b = ev.target.closest('.aj-sec > button'); if (!b) return;
    const ul = document.getElementById(b.getAttribute('aria-controls')); const ab = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', String(ab)); ul.hidden = !ab;
  });

  // Busca em todo o manual (sem acento/maiúscula); destaque só no texto
  let tm;
  document.getElementById('aj-q').addEventListener('input', ev => { clearTimeout(tm); tm = setTimeout(() => buscar(ev.target.value), 180); });
  function buscar(q) {
    const n = _norm(q).trim(), res = document.getElementById('aj-res'), grade = document.getElementById('aj-grade'), cont = document.getElementById('aj-cont');
    if (!n) { res.hidden = true; grade.hidden = false; cont.textContent = ''; return; }
    const grupos = [];
    ORDEM.forEach(id => {
      const m = mod(id); const ach = [];
      if (_norm(m.intro).includes(n)) ach.push({ s: '', it: m.intro });
      (m.secoes || []).forEach(s => s.itens.forEach(it => { if (_norm(it).includes(n) || _norm(s.titulo).includes(n)) ach.push({ s: s.titulo, it }); }));
      if (ach.length) grupos.push({ id, m, ach });
    });
    const total = grupos.reduce((a, g) => a + g.ach.length, 0);
    cont.textContent = total ? tx().trechos(total, grupos.length) : '';
    grade.hidden = true; res.hidden = false;
    res.innerHTML = grupos.length ? grupos.map(g => `<div class="aj-grp"><h4>${e(g.m.titulo)}<button type="button" data-abrir="${g.id}">${e(tx().abrir)}</button></h4>
      <ul>${g.ach.map(a => `<li>${ajudaMarcar(a.it, q)}${a.s ? ` <small>· ${ajudaMarcar(a.s, q)}</small>` : ''}</li>`).join('')}</ul></div>`).join('')
      : `<div class="aj-vazio">${e(tx().nada)} “${e(q)}”.</div>`;
  }
  document.getElementById('aj-res').addEventListener('click', ev => {
    const b = ev.target.closest('[data-abrir]'); if (!b) return;
    document.getElementById('aj-q').value = ''; buscar(''); abrir(b.dataset.abrir, true);
  });

  abrir(guia, false);
})();
</script>
</body>
</html>
