<!DOCTYPE html>
<html lang="pt-BR">
<head>

<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes de Atividades -->

</head>
<body class="dgm">
<div id="app"><div class="empty-state" role="status"><div class="spinner"></div><div class="empty-state-msg">Carregando atividades…</div></div></div>

<!-- Janelas fora do #app; .at-ov = escopo do tema (css/atividades.css) -->
<div class="at-ov senha" id="modal-senha" role="dialog" aria-modal="true" aria-labelledby="senha-titulo">
  <div class="at-modal">
    <div class="at-mh"><div><span class="at-eyebrow">Confirmação</span><h2 id="senha-titulo">Confirmar ação</h2><p id="senha-sub">Digite sua senha para confirmar</p></div></div>
    <div class="at-mb">
      <label class="at-f" for="senha-input">Sua senha
        <input id="senha-input" type="password" autocomplete="current-password" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')confirmarSenha()">
      </label>
      <div class="at-erro" id="senha-erro" role="alert" hidden><i data-ic="alerta"></i>Senha incorreta. Tente novamente.</div>
    </div>
    <div class="at-mf">
      <button type="button" class="at-btn" onclick="fecharSenha()">Cancelar</button>
      <button type="button" class="at-btn pri" id="senha-btn-ok" onclick="confirmarSenha()">Confirmar</button>
    </div>
  </div>
</div>

<div class="at-ov" id="modal-atividade" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="at-modal">
    <div class="at-mh">
      <div><span class="at-eyebrow" id="modal-eyebrow">Editar</span><h2 id="modal-titulo">Atividade</h2></div>
      <button type="button" class="at-btn ic" onclick="fecharModal()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="at-mb" id="modal-body"></div>
    <div class="at-mf">
      <button type="button" class="at-btn" onclick="fecharModal()">Cancelar</button>
      <button type="button" id="btn-salvar-atividade" class="at-btn pri" onclick="salvarAtividade()">Salvar alterações</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/logos.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/ajuda.js"></script>

<script>
let todasAtividades = [];
let ativFiltradas = [];
let ativEditando = null;
let resultadosMap = {};
let tdrsPorAtividade = {};
let tdrsAbertos = {};
let painelAberto = {};
let todosUsuarios = [];
let respPorAtividade = {};
let senhaCallback = null;
let todosMatrizItens = []; // cache dos indicadores da matriz
let matrizPorAtividade = {}; // cache de vínculos atividade_matriz
let filtroResultado = '';

// ── Ícones (SVG, sem emoji) ───────────────────────────────
const AT_IC = {
  lista:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  moeda:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>',
  doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>',
  alerta:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  busca:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  lapis:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  olho:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  clipe:'<path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
  seta:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  mais:'<path d="M12 5v14M5 12h14"/>',
  cadeado:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  pessoa:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  alvo:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  lua:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
function atIc(n, cls){ return `<svg class="at-ic${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true">${AT_IC[n]||''}</svg>`; }
document.querySelectorAll('i[data-ic]').forEach(e => { e.outerHTML = atIc(e.dataset.ic); });

// ── Vocabulário (cores = tokens de css/atividades.css) ────
const FASES_ATV = ['A_INICIAR','ELABORACAO','LICITACAO','ELABORADO','CONTRATADO','CONCLUIDO'];
function pillFase(f){ return `<span class="at-pill at-pf" style="--c:var(--at-f-${String(f||'a_iniciar').toLowerCase()})">${esc(t('fases',f)||f||'—')}</span>`; }
// Nomes antigos de status de TDR → atuais (mesmo mapeamento de tdrs.html)
const TDR_NORM = {enviado_unesco:'em_revisao_unesco',retorno_unesco:'em_revisao_unesco',revisao_interna:'submetido',ajustes:'pendente_correcao'};
const TDR_FASE = {
  rascunho:['Rascunho','rascunho'], submetido:['Submetido','submetido'], pendente_correcao:['Pendente de correção','pendente'],
  em_avaliacao:['Em avaliação','avaliacao'], em_revisao_unesco:['Revisão UNESCO','unesco'], aprovado:['Aprovado','aprovado'],
  em_licitacao:['Em licitação','licitacao'], contratado:['Contratado','contratado'], cancelado:['Cancelado','cancelado']
};
function pillTDR(s){ const f = TDR_FASE[TDR_NORM[s]||s] || [s||'—','rascunho']; return `<span class="at-pill at-pf" style="--c:var(--at-t-${f[1]})">${esc(f[0])}</span>`; }
function resTok(cod){ const m=/^R([1-4])$/.exec(cod||''); return m ? `--at-r${m[1]}` : '--at-rx'; }
function usdc(v){ v=parseFloat(v||0); const a=Math.abs(v); if(a>=1e6) return 'US$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi'; if(a>=1e3) return 'US$ '+Math.round(v/1e3)+' mil'; return 'US$ '+Math.round(v); }
function usd(v){ return (v==null||v==='') ? '—' : 'US$ '+Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0}); }
function iniciais(nome){ return (nome||'?').split(' ').filter(Boolean).slice(0,2).map(n=>n[0]).join('').toUpperCase(); }

(async () => {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }

  document.getElementById('app').innerHTML =
    gerarLayout('Atividades', 'atividades') +
    `<div class="fade-in at-pagina">
      <div class="at-kpis" id="stats-row"></div>
      <div id="aviso-resp"></div>

      <div class="at-filtros" role="group" aria-label="Filtros">
        <label class="at-busca">${atIc('busca','p')}<input type="search" id="busca" placeholder="Código ou nome da atividade" aria-label="Buscar atividade" oninput="filtrar()"></label>
        <div class="at-seg" role="group" aria-label="Resultado" id="fil-resultado">
          ${['','R1','R2','R3','R4'].map(r=>`<button type="button" data-r="${r}" aria-pressed="${r===''}" onclick="filtrarResultado('${r}')">${r||'Todos'}</button>`).join('')}
        </div>
        <select id="fil-fase" onchange="filtrar()" aria-label="Fase">
          <option value="">Todas as fases</option>
          ${FASES_ATV.map(f=>`<option value="${f}">${t('fases',f)}</option>`).join('')}
        </select>
        <select id="fil-tdr-sit" onchange="filtrar()" aria-label="Situação dos TDRs e responsáveis">
          <option value="">TDRs: todos</option>
          <option value="com">Com TDR cadastrado</option>
          <option value="sem">Sem TDR</option>
          <option value="alerta">TDR sem arquivo</option>
          <option value="semresp">Sem responsável</option>
        </select>
        <span id="contador" class="at-cont"></span>
        ${PODE.editarAtividade() ? `<button type="button" class="at-btn pri" onclick="novaAtividade()">${atIc('mais','p')}Nova atividade</button>` : ''}
      </div>

      <div class="at-card">
        <div class="at-tbl-w">
          <table class="at-tbl">
            <thead>
              <tr>
                <th style="width:84px">Código</th>
                <th>Atividade</th>
                <th style="width:130px">Fase</th>
                <th class="n" style="width:120px">Orçamento</th>
                <th style="width:210px">Execução <span style="font-weight:400;text-transform:none;letter-spacing:0">(pago · comprometido)</span></th>
                <th style="width:150px">Responsáveis</th>
                <th style="width:120px">TDRs</th>
                ${PODE.editarAtividade() || PODE.verAtividade?.() ? `<th style="width:52px"><span class="sr-only">Ações</span></th>` : ''}
              </tr>
            </thead>
            <tbody id="tbody-atividades">
              <tr><td colspan="8" style="text-align:center;padding:32px;color:var(--txt-3)">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>` +
    `</div></div></div>`;
  carregarLogosSidebar();
  seletorTema();
  await carregarDados();
})();

// Tema claro/escuro: mesmo 'diag_tema' da mesa do Diagnóstico, de TDRs e da Visão Geral (componente .dgm-tema)
function seletorTema(){
  const tb=document.querySelector('.topbar'); if(!tb||tb.querySelector('.dgm-tema')||typeof DiagTema==='undefined')return;
  const d=document.createElement('div');
  d.className='dgm-tema'; d.setAttribute('role','group'); d.setAttribute('aria-label','Tema');
  d.innerHTML=[['claro','sol','Claro'],['escuro','lua','Escuro']].map(([tm,ic,r])=>
    `<button type="button" data-tema="${tm}" aria-pressed="${DiagTema.atual()===tm}">${atIc(ic)}${r}</button>`).join('');
  const bc=tb.querySelector('.topbar-breadcrumb');
  if(bc)bc.parentNode.insertBefore(d,bc); else tb.appendChild(d);
  d.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-tema]'); if(!b)return;
    DiagTema.definir(b.dataset.tema);
    d.querySelectorAll('[data-tema]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  });
}

async function carregarDados() {
  try {
    const [
      { data: atividades },
      { data: resultados },
      { data: saldos },
      { data: tdrsData },
      { data: usuarios },
      { data: respData }
    ] = await Promise.all([
      db.from('atividades').select('*').order('codigo'),
      db.from('resultados').select('*').order('codigo'),
      db.from('vw_saldo_atividade').select('*'),
      db.from('tdrs').select('id,numero,atividade_id,tipo,objeto_pt,valor_brl,valor_usd,status,arquivo_url,arquivo_nome,prioridade,elaborador_id'),
      db.from('usuarios').select('id,nome_completo,perfil,email').eq('ativo',true).order('nome_completo'),
      db.from('atividade_responsaveis').select('*').eq('ativo',true)
    ]);

    todosUsuarios = usuarios || [];

    // Carregar indicadores da matriz e vínculos existentes em paralelo
    const [{ data: matrizItens }, { data: matrizLinks }] = await Promise.all([
      db.from('matriz_itens').select('id,resultado,produto_codigo,produto_titulo,indicador,meta_numerica,unidade,meta_descricao').eq('ativo',true).order('ordem'),
      db.from('atividade_matriz').select('atividade_id,matriz_item_id')
    ]);
    todosMatrizItens = matrizItens || [];
    matrizPorAtividade = {};
    (matrizLinks||[]).forEach(l => {
      if (!matrizPorAtividade[l.atividade_id]) matrizPorAtividade[l.atividade_id] = [];
      matrizPorAtividade[l.atividade_id].push(l.matriz_item_id);
    });

    resultados?.forEach(r => { resultadosMap[r.id] = r; });

    const saldoMap = {};
    (saldos||[]).forEach(s => { saldoMap[s.id] = s; });

    tdrsPorAtividade = {};
    (tdrsData||[]).filter(t=>t.status!=='cancelado').forEach(t => {
      if (!tdrsPorAtividade[t.atividade_id]) tdrsPorAtividade[t.atividade_id] = [];
      tdrsPorAtividade[t.atividade_id].push(t);
      if (t.arquivo_url) tdrsAbertos[t.id] = t.arquivo_url;
    });

    respPorAtividade = {};
    (respData||[]).forEach(r => {
      if (!respPorAtividade[r.atividade_id]) respPorAtividade[r.atividade_id] = [];
      const u = todosUsuarios.find(u=>u.id===r.usuario_id);
      respPorAtividade[r.atividade_id].push({...r, usuario: u});
    });

    todasAtividades = (atividades||[]).map(a => {
      const tdrs = tdrsPorAtividade[a.id] || [];
      const semArquivo = tdrs.filter(t => !t.arquivo_url).length;
      return {
        ...a,
        saldo: saldoMap[a.id] || null,
        resultado_codigo: resultadosMap[a.resultado_id]?.codigo || '',
        tdrs_count: tdrs.length,
        tdrs_valor_usd: tdrs.reduce((s,t)=>s+parseFloat(t.valor_usd||0),0),
        tdrs_sem_arquivo: semArquivo,
        responsaveis: respPorAtividade[a.id] || [],
        tem_responsavel: (respPorAtividade[a.id]||[]).length > 0,
      };
    });

    renderStats();
    filtrar();
  } catch(e) {
    console.error(e);
    toast('Erro ao carregar atividades.', 'error');
  }
}

function renderStats() {
  const total = todasAtividades.length;
  const contratadas = todasAtividades.filter(a => a.fase === 'CONTRATADO').length;
  const concluidas = todasAtividades.filter(a => a.fase === 'CONCLUIDO').length;
  const comTdr = todasAtividades.filter(a => a.tdrs_count > 0).length;
  const semArq = todasAtividades.filter(a => a.tdrs_sem_arquivo > 0).length;
  const orcTotal = todasAtividades.reduce((s,a)=>s+parseFloat(a.orcamento_usd||0),0);
  const compTotal = todasAtividades.reduce((s,a)=>s+parseFloat(a.saldo?.comprometido_usd||0),0);
  const pagoTotal = todasAtividades.reduce((s,a)=>s+parseFloat(a.saldo?.pago_usd||0),0);
  const emExecucao = todasAtividades.filter(a=>['ELABORADO','CONTRATADO'].includes(a.fase)).length;
  const semResp = todasAtividades.filter(a => !a.tem_responsavel).length;
  const pPago = orcTotal>0 ? pagoTotal/orcTotal*100 : 0;
  const pComp = orcTotal>0 ? Math.min(compTotal/orcTotal*100,100) : 0;
  const nRes = new Set(todasAtividades.map(a=>a.resultado_codigo).filter(Boolean)).size;

  document.getElementById('stats-row').innerHTML = `
    <div class="at-kpi"><div class="at-kpi-l">${atIc('lista')}Atividades</div><div class="at-kpi-v">${total}</div><div class="at-kpi-s">${contratadas} contratadas · ${concluidas} concluídas</div></div>
    <div class="at-kpi"><div class="at-kpi-l">${atIc('moeda')}Orçamento</div><div class="at-kpi-v">${usdc(orcTotal)}</div>
      <div class="at-meter"><i style="width:${Math.min(pPago,100).toFixed(1)}%;background:var(--at-pago)"></i><i style="width:${Math.max(0,pComp-pPago).toFixed(1)}%;background:var(--at-comp)"></i></div>
      <div class="at-kpi-s">${Math.round(pPago)}% pago · ${Math.round(orcTotal>0?compTotal/orcTotal*100:0)}% comprometido · ${nRes} resultados</div></div>
    <div class="at-kpi"><div class="at-kpi-l">${atIc('doc')}Com TDR</div><div class="at-kpi-v">${comTdr} / ${total}</div>
      <div class="at-meter"><i style="width:${total?(comTdr/total*100).toFixed(1):0}%;background:var(--pri-600)"></i></div>
      <div class="at-kpi-s">${semArq ? semArq+' com TDR sem arquivo' : 'todos os TDRs com arquivo'}</div></div>
    <div class="at-kpi"><div class="at-kpi-l">${atIc('play')}Em execução</div><div class="at-kpi-v">${emExecucao}</div><div class="at-kpi-s">elaborado + contratado</div></div>`;

  document.getElementById('aviso-resp').innerHTML = semResp>0 ? `
    <div class="at-aviso" role="status">
      ${atIc('alerta')}
      <div class="tx"><b>${semResp} atividade${semResp>1?'s':''} sem responsável</b>Sem responsável a atividade não pode ter TDR cadastrado.</div>
      <button type="button" class="at-btn perigo peq" onclick="mostrarSemResponsavel()">Mostrar só essas</button>
    </div>` : '';
}

function mostrarSemResponsavel(){
  document.getElementById('busca').value='';
  document.getElementById('fil-fase').value='';
  document.getElementById('fil-tdr-sit').value='semresp';
  filtrarResultado('');
}
function filtrarResultado(r){
  filtroResultado = r;
  document.querySelectorAll('#fil-resultado button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.r===r)));
  filtrar();
}

function filtrar() {
  const busca = document.getElementById('busca').value.toLowerCase();
  const res = filtroResultado;
  const fase = document.getElementById('fil-fase').value;
  const tdrSit = document.getElementById('fil-tdr-sit').value;

  ativFiltradas = todasAtividades.filter(a => {
    const nome = campo(a,'nome').toLowerCase();
    if (busca && !a.codigo.toLowerCase().includes(busca) && !nome.includes(busca)) return false;
    if (res && a.resultado_codigo !== res) return false;
    if (fase && a.fase !== fase) return false;
    if (tdrSit === 'com' && a.tdrs_count === 0) return false;
    if (tdrSit === 'sem' && a.tdrs_count > 0) return false;
    if (tdrSit === 'alerta' && a.tdrs_sem_arquivo === 0) return false;
    if (tdrSit === 'semresp' && a.tem_responsavel) return false;
    return true;
  });

  document.getElementById('contador').textContent =
    `${ativFiltradas.length} de ${todasAtividades.length} atividades`;
  renderTabela();
}

// Coluna Execução: pago em destaque, barra (pago + comprometido) e saldo livre
function celExecucao(a){
  const s = a.saldo;
  const orc = parseFloat(s?.orcamento_usd ?? a.orcamento_usd ?? 0);
  const comp = parseFloat(s?.comprometido_usd||0);
  const pago = parseFloat(s?.pago_usd||0);
  const pct = s ? parseFloat(s.pct_comprometido||0) : 0;
  const pPago = orc>0 ? Math.min(pago/orc*100,100) : 0;
  const pComp = Math.min(pct,100);
  const livre = s?.saldo_livre_usd ?? orc;
  const acima = livre < 0;
  return `<div class="at-exec">
    <div class="pago"><span>Pago</span><b>${pago>0?usdc(pago):'—'}</b><span>${pago>0?Math.round(pPago)+'% do orçamento':''}</span></div>
    <div class="at-meter" role="img" aria-label="${Math.round(pPago)}% pago, ${Math.round(pct)}% comprometido">
      <i style="width:${pPago.toFixed(1)}%;background:var(--at-pago)"></i><i style="width:${Math.max(0,pComp-pPago).toFixed(1)}%;background:var(${acima?'--at-exc':'--at-comp'})"></i>
    </div>
    <div class="ln"><span>comp. <b>${comp>0?usdc(comp):'—'}</b></span><b>${Math.round(pct)}%</b></div>
    <div class="ln">${acima ? `<span class="acima">${atIc('alerta','p')} ${usdc(Math.abs(livre))} acima do orçamento</span>` : `<span>${usdc(livre)} livre</span>`}</div>
  </div>`;
}

function celResponsaveis(a){
  if (!a.responsaveis.length) return `<span class="at-pill at-p-er">${atIc('alerta','p')}Sem responsável</span>`;
  const r0 = a.responsaveis[0];
  return `<div class="at-av">${a.responsaveis.slice(0,3).map(r=>`<span class="at-ini${r.papel==='substituto'?' sub':''}" title="${esc((r.usuario?.nome_completo||'')+(r.papel==='substituto'?' (substituto)':' (responsável)'))}">${esc(iniciais(r.usuario?.nome_completo))}</span>`).join('')}
    <em>${esc((r0.usuario?.nome_completo||'').split(' ')[0])}${a.responsaveis.length>1?' +'+(a.responsaveis.length-1):''}</em></div>`;
}

function renderTabela() {
  const tbody = document.getElementById('tbody-atividades');
  const podEditar = PODE.editarAtividade();
  const podVer = PODE.verAtividade?.() ?? false;
  const nCols = (podEditar||podVer) ? 8 : 7;
  if (!ativFiltradas.length) {
    tbody.innerHTML = `<tr><td colspan="${nCols}"><div class="at-vazio">Nenhuma atividade encontrada com esses filtros.</div></td></tr>`;
    return;
  }

  tbody.innerHTML = ativFiltradas.map(a => {
    const rCod = a.resultado_codigo||'';
    const tdrsAtiv = tdrsPorAtividade[a.id]||[];
    const temAlerta = a.tdrs_sem_arquivo > 0;
    const painelId = `painel-${a.id}`;
    const aberto = !!painelAberto[a.id];
    const tdrClass = a.tdrs_count===0?'zero':temAlerta?'al':'';
    const tdrTxt = a.tdrs_count===0 ? 'Sem TDR' : `${a.tdrs_count} TDR${a.tdrs_count!==1?'s':''}`;

    const linhaAtiv = `<tr class="at-lin${aberto?' aberta':''}" id="row-${a.id}">
      <td><span class="at-cod">${esc(a.codigo)}</span></td>
      <td class="c-nome">
        <div class="at-nm">${rCod?`<span class="at-rtag" style="background:var(${resTok(rCod)})">${esc(rCod)}</span>`:''}${esc(campo(a,'nome'))}</div>
        ${a.wbs_unesco?`<div class="at-wbs">${esc(a.wbs_unesco)}</div>`:''}
      </td>
      <td>${pillFase(a.fase)}</td>
      <td class="c-orc"><div class="at-num">${usd(a.orcamento_usd)}</div></td>
      <td class="c-exec">${celExecucao(a)}</td>
      <td>${celResponsaveis(a)}</td>
      <td>
        <button type="button" class="at-tdrb ${tdrClass}" aria-expanded="${aberto}" aria-controls="${painelId}" onclick="togglePainel('${a.id}')"
          title="${temAlerta?a.tdrs_sem_arquivo+' TDR(s) sem arquivo':'Ver os TDRs da atividade'}">${temAlerta?atIc('alerta','p'):''}${tdrTxt}${atIc('chev','p chev')}</button>
        ${a.tdrs_valor_usd>0?`<div class="at-tdrv">${usdc(a.tdrs_valor_usd)}</div>`:''}
      </td>
      ${podEditar?`<td><button type="button" class="at-btn ic" aria-label="Editar ${esc(a.codigo)}" title="Editar" onclick="abrirModal('${a.id}')">${atIc('lapis')}</button></td>`
        :podVer?`<td><button type="button" class="at-btn ic" aria-label="Ver ${esc(a.codigo)}" title="Ver" onclick="abrirModal('${a.id}',true)">${atIc('olho')}</button></td>`:''}
    </tr>`;

    const painelTdrs = `<tr class="at-painel" id="${painelId}"${aberto?'':' hidden'}>
      <td colspan="${nCols}">
        <div class="at-painel-in">
          <div class="at-painel-hd">TDRs da atividade ${esc(a.codigo)}
            ${temAlerta?`<span class="at-pill at-p-al">${atIc('alerta','p')}${a.tdrs_sem_arquivo} sem arquivo</span>`:''}
            <a href="tdrs.html" class="at-btn peq">Abrir em TDRs${atIc('seta','p')}</a>
          </div>
          ${tdrsAtiv.length ? tdrsAtiv.map(tdr => {
            const semArq = !tdr.arquivo_url;
            return `<div class="at-tdrc${semArq?' sem':''}">
              <div style="min-width:0">
                <div class="tp"><span class="at-cod">${esc(tdr.numero)}</span>${tdr.tipo?`<span class="at-pill at-p-ne">${esc(tdr.tipo)}</span>`:''}${pillTDR(tdr.status)}${semArq?`<span class="at-pill at-p-al">${atIc('alerta','p')}Sem arquivo no sistema</span>`:''}</div>
                <div class="ob">${esc((tdr.objeto_pt||'—').substring(0,140))}${(tdr.objeto_pt||'').length>140?'…':''}</div>
                <div class="vs"><span>R$ <b>${fmtBRL(tdr.valor_brl).replace('R$','').trim()}</b></span><span>US$ <b>${tdr.valor_usd!=null?Number(tdr.valor_usd).toLocaleString('pt-BR',{maximumFractionDigits:0}):'—'}</b></span>${tdr.prioridade?`<span>Prioridade <b>${esc(tdr.prioridade)}</b></span>`:''}</div>
              </div>
              <div class="ac">${tdr.arquivo_url
                ? `<button type="button" class="at-btn pri peq" onclick="abrirArquivoTDR('${tdr.id}',tdrsAbertos['${tdr.id}'])">${atIc('clipe','p')}Abrir TDR</button>`
                : `<button type="button" class="at-btn peq" disabled>${atIc('clipe','p')}Sem arquivo</button>`}</div>
            </div>`;
          }).join('') :
          `<div class="at-vazio">Nenhum TDR cadastrado para esta atividade.
            ${PODE.editarTDR()?`<a href="tdrs.html" class="at-btn pri peq">${atIc('mais','p')}Criar TDR</a>`:''}
          </div>`}
        </div>
      </td>
    </tr>`;

    return linhaAtiv + painelTdrs;
  }).join('');
}

function togglePainel(ativId) {
  const el = document.getElementById(`painel-${ativId}`);
  if (!el) return;
  const aberto = el.hidden;
  el.hidden = !aberto;
  painelAberto[ativId] = aberto;
  document.getElementById(`row-${ativId}`)?.classList.toggle('aberta', aberto);
  document.querySelector(`#row-${ativId} .at-tdrb`)?.setAttribute('aria-expanded', String(aberto));
}

async function abrirArquivoTDR(tdrId, url) {
  if (!url) { toast('Este TDR não tem arquivo vinculado.','warning'); return; }
  try {
    // Verificar se é arquivo do Storage interno (não é link do Drive)
    const isDrive = url.includes('drive.google.com') || url.includes('docs.google.com');
    if (!isDrive) {
      await abrirDoc(url);
      toast('Link gerado — válido por 1 hora.','success');
    } else {
      window.open(url, '_blank');
      toast('Arquivo no Google Drive — para editar no sistema, abra o editor e faça o upload do .docx.','info');
    }
  } catch(e) { window.open(url,'_blank'); }
}

async function adicionarResponsavel(ativId) {
  const usuarioId = document.getElementById('novo-resp-usuario').value;
  const papel = document.getElementById('novo-resp-papel').value;
  if (!usuarioId) { toast('Escolha a pessoa.','error'); return; }

  const jaExiste = (respPorAtividade[ativId]||[]).find(r=>r.usuario_id===usuarioId&&r.ativo);
  if (jaExiste) { toast('Esta pessoa já é responsável por esta atividade.','warning'); return; }

  try {
    const { data, error } = await db.from('atividade_responsaveis').insert({
      atividade_id: ativId,
      usuario_id: usuarioId,
      papel: papel,
      designado_por: appState.usuario.id,
    }).select().single();
    if (error) throw error;

    const u = todosUsuarios.find(u=>u.id===usuarioId);
    if (!respPorAtividade[ativId]) respPorAtividade[ativId]=[];
    respPorAtividade[ativId].push({...data, usuario:u});

    const atv = todasAtividades.find(a=>a.id===ativId);
    if (atv) { atv.responsaveis = respPorAtividade[ativId]; atv.tem_responsavel=true; }

    toast('Responsável adicionado.','success');
    renderStats(); filtrar();
    abrirModal(ativId);
  } catch(e) { toast('Erro ao adicionar: '+(e.message||''),'error'); }
}

async function removerResponsavel(respId, ativId) {
  if (!PODE.gerirUsuarios()) return;
  try {
    await db.from('atividade_responsaveis').update({ativo:false,dt_fim:new Date().toISOString().split('T')[0]}).eq('id',respId);
    if (respPorAtividade[ativId]) {
      respPorAtividade[ativId] = respPorAtividade[ativId].filter(r=>r.id!==respId);
    }
    const atv = todasAtividades.find(a=>a.id===ativId);
    if (atv) { atv.responsaveis=respPorAtividade[ativId]||[]; atv.tem_responsavel=atv.responsaveis.length>0; }
    toast('Responsável removido.','info');
    renderStats(); filtrar();
    abrirModal(ativId);
  } catch(e) { toast('Erro ao remover.','error'); }
}

function fecharModal() {
  const ov = document.getElementById('modal-atividade');
  ov.classList.remove('aberto');
  atModalFechou(ov);
  ativEditando = null;
}

async function salvarAtividade() {
  if (!ativEditando) return;

  const resps = respPorAtividade[ativEditando.id]||[];
  if (resps.length === 0) {
    toast('Adicione ao menos um responsável antes de salvar.','error');
    return;
  }

  // Capturar valores ANTES de pedir senha (evita perda de referência DOM)
  const getChecked = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(el=>el.value);
  const updates = {
    fase: document.getElementById('ed-fase')?.value,
    ano1_usd: parseFloat(document.getElementById('ed-ano1')?.value)||0,
    ano2_usd: parseFloat(document.getElementById('ed-ano2')?.value)||0,
    nome_pt: document.getElementById('ed-nome-pt')?.value.trim(),
    eixo: document.getElementById('ed-eixo')?.value.trim()||null,
    ods: getChecked('ed-ods'),
    metas_km: getChecked('ed-km'),
  };
  const matrizSelecionados = getChecked('ed-matriz');
  const ativId = ativEditando.id;

  pedirSenha('Confirmar alterações na atividade', `Atividade ${ativEditando.codigo}`, async () => {
    try {
      const { error } = await db.from('atividades').update(updates).eq('id', ativId);
      if (error) throw error;

      // Atualizar vínculos com a Matriz de Resultados
      await db.from('atividade_matriz').delete().eq('atividade_id', ativId);
      if (matrizSelecionados.length > 0) {
        await db.from('atividade_matriz').insert(
          matrizSelecionados.map(mid => ({ atividade_id: ativId, matriz_item_id: mid }))
        );
      }
      matrizPorAtividade[ativId] = matrizSelecionados;

      const atv = todasAtividades.find(a=>a.id===ativId);
      if (atv) Object.assign(atv, updates);
      fecharModal();
      renderStats();
      filtrar();
      toast('Atividade atualizada.', 'success');
    } catch(e) { toast('Erro ao salvar: '+(e.message||''), 'error'); }
  });
}

// ── Confirmação por senha ─────────────────────────────────
function pedirSenha(titulo, subtitulo, callback) {
  document.getElementById('senha-titulo').textContent = titulo;
  document.getElementById('senha-sub').textContent = subtitulo;
  document.getElementById('senha-input').value = '';
  document.getElementById('senha-erro').hidden = true;
  // Sempre resetar o botão ao abrir — evita ficar travado em "Verificando…"
  const btn = document.getElementById('senha-btn-ok');
  btn.textContent = 'Confirmar';
  btn.disabled = false;
  senhaCallback = callback;
  const ov = document.getElementById('modal-senha');
  ov.classList.add('aberto');
  atModalAbriu(ov);
  setTimeout(()=>document.getElementById('senha-input').focus(), 100);
}

async function confirmarSenha() {
  const senha = document.getElementById('senha-input').value;
  if (!senha) { toast('Digite sua senha.','error'); return; }

  const btn = document.getElementById('senha-btn-ok');
  btn.textContent = 'Verificando…';
  btn.disabled = true;

  try {
    // Verificar senha via Supabase reautenticação
    const { error } = await db.auth.signInWithPassword({
      email: appState.usuario.email,
      password: senha
    });

    if (error) {
      document.getElementById('senha-erro').hidden = false;
      document.getElementById('senha-input').value = '';
      document.getElementById('senha-input').focus();
      btn.textContent = 'Confirmar';
      btn.disabled = false;
      return;
    }

    const cb = senhaCallback;
    fecharSenha();
    if (cb) await cb();
  } catch(e) {
    toast('Erro na verificação. Tente novamente.','error');
    btn.textContent = 'Confirmar';
    btn.disabled = false;
  }
}

function fecharSenha() {
  const ov = document.getElementById('modal-senha');
  ov.classList.remove('aberto');
  atModalFechou(ov);
  document.getElementById('senha-input').value = '';
  document.getElementById('senha-erro').hidden = true;
  const btn = document.getElementById('senha-btn-ok');
  if (btn) { btn.textContent = 'Confirmar'; btn.disabled = false; }
  senhaCallback = null;
}

function novaAtividade() { toast('Cadastro de nova atividade — em breve!','info'); }

// ── Foco nas janelas: Esc fecha a de cima, Tab fica preso nela, o foco volta ao sair ──
const AT_FOCAVEIS='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const atPilha=[];
function atModalAbriu(el){
  if(atPilha.some(x=>x.el===el))return;
  atPilha.push({el,volta:document.activeElement});
  requestAnimationFrame(()=>{ (el.querySelector('.at-mb :is(input:not([type=checkbox]):not([disabled]),select:not([disabled]))')||el.querySelector(AT_FOCAVEIS))?.focus({preventScroll:true}); });
}
function atModalFechou(el){
  const i=atPilha.findIndex(x=>x.el===el); if(i<0)return;
  const [{volta}]=atPilha.splice(i,1);
  if(volta&&document.contains(volta))volta.focus({preventScroll:true});
}
document.addEventListener('keydown', e => {
  const topo=atPilha[atPilha.length-1]?.el; if(!topo)return;
  if(e.key==='Escape'){ e.preventDefault(); topo.id==='modal-senha'?fecharSenha():fecharModal(); }
  else if(e.key==='Tab'){
    const f=[...topo.querySelectorAll(AT_FOCAVEIS)].filter(x=>x.offsetParent!==null);
    if(!f.length)return;
    const pri=f[0], ult=f[f.length-1];
    if(!topo.contains(document.activeElement)){e.preventDefault();pri.focus();}
    else if(e.shiftKey&&document.activeElement===pri){e.preventDefault();ult.focus();}
    else if(!e.shiftKey&&document.activeElement===ult){e.preventDefault();pri.focus();}
  }
});
</script>
