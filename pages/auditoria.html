<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/assets/marca/icone.svg" type="image/svg+xml">
<link rel="icon" href="/assets/marca/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/marca/apple-touch-icon-180.png">
<meta name="author" content="Erisson Cameli Santiago">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Auditoria IA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes da Auditoria IA (js/auditoria.js) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/auditoria.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"></div>

<!-- Janela de resolver/ignorar — fora do #app (armadilha 11); .au-ov = escopo do tema. <i data-ic> vira ícone SVG. -->
<div class="modal-overlay au-ov" id="au-modal" role="dialog" aria-modal="true" aria-labelledby="au-modal-tit">
  <div class="modal au-modal">
    <div class="modal-header">
      <div style="flex:1;min-width:0"><div class="modal-title" id="au-modal-tit">Resolver achado</div><div class="au-modal-sub" id="au-modal-sub"></div></div>
      <button type="button" class="modal-close" onclick="fecharModal()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body">
      <label class="au-lbl" for="au-modal-txt" id="au-modal-lbl">O que foi feito para corrigir? *</label>
      <textarea class="au-txt" id="au-modal-txt"></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="au-modal-ok" onclick="confirmarModal()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Painel do assistente (não bloqueia a página; Esc fecha). Lógica em js/auditoria-assistente.js -->
<aside class="au-chat au-ov" id="chat-panel" aria-label="Assistente de auditoria" aria-hidden="true">
  <nav class="ach-lado" aria-label="Conversas">
    <button type="button" class="ach-nova" onclick="novaConversaChat()"><i data-ic="mais"></i>Nova conversa</button>
    <div class="ach-hist" id="chat-hist"><div class="ach-vazio">Suas conversas aparecem aqui.</div></div>
    <div class="ach-uso" id="chat-uso"></div>
  </nav>
  <div class="ach-main">
    <div class="ach-topo">
      <button type="button" class="ach-ic so-estreito" id="chat-btn-hist" onclick="alternarHistChat()" aria-label="Conversas anteriores" aria-expanded="false" title="Conversas"><i data-ic="lista"></i></button>
      <div class="ach-tit"><b>Assistente</b><span id="chat-header-sub">Sem auditoria carregada</span></div>
      <button type="button" class="ach-ic so-estreito" onclick="novaConversaChat()" aria-label="Nova conversa" title="Nova conversa"><i data-ic="mais"></i></button>
      <button type="button" class="ach-ic so-largo" id="chat-btn-exp" onclick="expandirChat()" aria-label="Expandir o painel" title="Expandir"><i data-ic="expandir"></i></button>
      <button type="button" class="ach-ic" onclick="toggleChat(false)" aria-label="Fechar o assistente" title="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="ach-msgs" id="chat-msgs" aria-live="polite">
      <div class="ach-boas" id="chat-welcome">
        <h3 class="ach-ola" id="chat-ola">Olá</h3>
        <p class="ach-sub">Como posso ajudar na gestão hoje?</p>
        <div class="ach-cards">
          <button type="button" class="ach-card" data-sug="Quais são os achados mais críticos da auditoria e o que devo resolver primeiro?"><span>O que resolver primeiro na auditoria?</span><span class="ach-card-ic c-al"><i data-ic="alerta"></i></span></button>
          <button type="button" class="ach-card" data-sug="Quais tarefas da equipe estão atrasadas? Agrupe por responsável."><span>Tarefas atrasadas da equipe</span><span class="ach-card-ic c-ta"><i data-ic="tarefa"></i></span></button>
          <button type="button" class="ach-card" data-sug="Quais atividades estão com saldo em alerta e por quê?"><span>Atividades com saldo em alerta</span><span class="ach-card-ic c-sa"><i data-ic="moeda"></i></span></button>
          <button type="button" class="ach-card" data-sug="Há pedidos de remanejamento em aprovação? Em que etapa estão?"><span>Remanejamentos em aprovação</span><span class="ach-card-ic c-re"><i data-ic="troca"></i></span></button>
        </div>
      </div>
    </div>
    <div class="ach-entrada">
      <div class="ach-caixa">
        <textarea class="ach-input" id="chat-input" rows="1" placeholder="Pergunte sobre contratos, TDRs, saldo, tarefas…" aria-label="Mensagem ao assistente"></textarea>
        <div class="ach-caixa-pe">
          <button type="button" class="ach-cmd" data-sug="/auditar" title="Rodar a auditoria completa agora">/auditar</button>
          <button type="button" class="ach-enviar" id="chat-send" onclick="enviarMensagemChat()" aria-label="Enviar"><i data-ic="seta-cima"></i></button>
        </div>
      </div>
      <p class="ach-aviso">O assistente só lê os dados que você já vê. Confira valores antes de decidir.</p>
    </div>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/autoria.js"></script>
<script src="../js/logos.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/guia-app.js"></script>
<script src="../js/guias-plataforma.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/auditoria.js"></script>
<script src="../js/auditoria-assistente.js"></script>
</body>
</html>
