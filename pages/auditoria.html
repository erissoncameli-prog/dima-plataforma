<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Auditoria IA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes da Auditoria IA (js/auditoria.js) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/auditoria.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"></div>

<!-- Janela de resolver/ignorar — fora do #app (armadilha 11); .au-ov = escopo do tema. <i data-ic> vira ícone SVG. -->
<div class="modal-overlay au-ov" id="au-modal" role="dialog" aria-modal="true" aria-labelledby="au-modal-tit">
  <div class="modal au-modal">
    <div class="modal-header">
      <div style="flex:1;min-width:0"><div class="modal-title" id="au-modal-tit">Resolver achado</div><div class="au-modal-sub" id="au-modal-sub"></div></div>
      <button type="button" class="modal-close" onclick="fecharModal()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body">
      <label class="au-lbl" for="au-modal-txt" id="au-modal-lbl">O que foi feito para corrigir? *</label>
      <textarea class="au-txt" id="au-modal-txt"></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="au-modal-ok" onclick="confirmarModal()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Painel do assistente (não bloqueia a página; Esc fecha) -->
<aside class="au-chat au-ov" id="chat-panel" aria-label="Assistente de auditoria" aria-hidden="true">
  <div class="au-chat-h">
    <span class="au-chat-av"><i data-ic="ia"></i></span>
    <div class="au-chat-t"><b>Assistente de auditoria</b><span id="chat-header-sub">Sem auditoria carregada</span></div>
    <button type="button" class="au-x" onclick="toggleChat(false)" aria-label="Fechar o assistente"><i data-ic="x"></i></button>
  </div>
  <div class="chat-msgs" id="chat-msgs" aria-live="polite">
    <div class="chat-welcome" id="chat-welcome">
      <span class="au-chat-av"><i data-ic="ia"></i></span>
      <b>Assistente de auditoria</b>
      <p>Pergunte sobre os achados, rode uma nova auditoria ou peça ajuda para resolver uma inconsistência.</p>
      <div class="chat-sugestoes">
        <button type="button" class="chat-sugestao cmd" data-sug="/auditar">/auditar — rodar a auditoria completa agora</button>
        <button type="button" class="chat-sugestao" data-sug="Quais são os achados mais críticos e o que devo resolver primeiro?">O que resolver primeiro?</button>
        <button type="button" class="chat-sugestao" data-sug="Resuma os problemas encontrados na auditoria por domínio">Resumo por domínio</button>
        <button type="button" class="chat-sugestao" data-sug="Quais contratos têm problemas com TDR ou documentação?">Contratos com problemas</button>
        <button type="button" class="chat-sugestao" data-sug="Há algum problema no orçamento (saldo, cobertura de contrato, remanejamento) que precise de atenção?">Orçamento</button>
      </div>
    </div>
  </div>
  <div class="chat-chips-bar">
    <button type="button" class="chat-chip cmd" data-sug="/auditar" title="Rodar auditoria completa">/auditar</button>
    <button type="button" class="chat-chip" data-sug="Quais são os achados mais críticos e o que devo resolver primeiro?">Prioridade</button>
    <button type="button" class="chat-chip" data-sug="Resuma os problemas encontrados na auditoria por domínio">Por domínio</button>
    <button type="button" class="chat-chip" data-sug="Quais contratos têm problemas com TDR ou documentação?">Contratos</button>
    <button type="button" class="chat-chip" data-sug="Há algum risco financeiro imediato que precise de atenção urgente?">Financeiro</button>
    <button type="button" class="chat-chip" data-sug="Há algum problema no orçamento (saldo, cobertura de contrato, remanejamento) que precise de atenção?">Orçamento</button>
    <button type="button" class="chat-chip" data-sug="Quais produtos ainda estão pendentes de aprovação ou com prazo vencido?">Produtos</button>
    <button type="button" class="chat-chip" data-sug="Há viagens com retorno vencido sem conclusão registrada?">Viagens</button>
    <button type="button" class="chat-chip" data-sug="Me ajude a redigir um comentário de resolução para um achado">Redigir resolução</button>
  </div>
  <div class="chat-input-area">
    <div class="chat-input-row">
      <textarea class="chat-input" id="chat-input" placeholder="Pergunte sobre os achados ou use /auditar…" aria-label="Mensagem ao assistente" rows="1"></textarea>
      <button type="button" class="chat-send" id="chat-send" onclick="enviarMensagemChat()" aria-label="Enviar"><i data-ic="enviar"></i></button>
    </div>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/auditoria.js"></script>
</body>
</html>
