<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Armazenamento em Nuvem</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
.bd-wrap{max-width:960px;margin:0 auto;padding:28px 24px;}
.bd-header{display:flex;align-items:center;gap:10px;margin-bottom:28px;flex-wrap:wrap;}
.bd-header h2{font-size:17px;font-weight:600;color:var(--cinza-900);margin:0;}
.bd-plano-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:#DBEAFE;color:#1D4ED8;letter-spacing:.05em;}
.bd-ts{font-size:11px;color:var(--cinza-400);font-family:var(--font-mono);margin-left:auto;}
.bd-btn-refresh{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--borda);border-radius:var(--raio);background:var(--branco);font-size:12px;font-family:var(--font-sans);color:var(--cinza-600);cursor:pointer;transition:all .15s;}
.bd-btn-refresh:hover{background:var(--cinza-50);color:var(--cinza-900);}
.bd-btn-refresh:disabled{opacity:.5;cursor:not-allowed;}
.bd-gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px;}
.bd-gauge-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.bd-gauge-label{font-size:13px;font-weight:600;color:var(--cinza-700);}
.bd-gauge-sub{font-size:11px;color:var(--cinza-500);font-family:var(--font-mono);text-align:center;line-height:1.5;}
.bd-alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:var(--raio);margin-bottom:12px;font-size:12px;line-height:1.6;}
.bd-alert.aviso{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;}
.bd-alert.critico{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;}
.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.bd-gauges,.bd-grid{grid-template-columns:1fr;}}
.bd-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.bd-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--cinza-500);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--borda);}
.bd-bucket-item{padding:8px 0;border-bottom:1px solid var(--cinza-50);}
.bd-bucket-item:last-child{border-bottom:none;}
.bd-bucket-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bd-bucket-name{font-size:12px;font-weight:500;color:var(--cinza-700);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bd-bucket-meta{font-size:10px;color:var(--cinza-400);font-family:var(--font-mono);white-space:nowrap;flex-shrink:0;}
.bd-bar-track{height:6px;background:var(--cinza-100);border-radius:99px;overflow:hidden;}
.bd-bar-fill{height:100%;border-radius:99px;transition:width .5s ease;}
.bd-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.bd-tbl th{text-align:left;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;border-bottom:1px solid var(--borda);}
.bd-tbl td{padding:6px 8px;color:var(--cinza-700);border-bottom:1px solid var(--cinza-50);}
.bd-tbl td.mono{font-family:var(--font-mono);color:var(--cinza-500);}
.bd-tbl tr:last-child td{border-bottom:none;}
.bd-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:80px 0;color:var(--cinza-400);}
.bd-spin{width:28px;height:28px;border:3px solid var(--borda);border-top-color:var(--verde-medio);border-radius:50%;animation:spin .7s linear infinite;}
.bd-empty{text-align:center;padding:32px;color:var(--cinza-400);font-size:12px;}
.bd-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 100%);border:1px solid #BFDBFE;border-radius:var(--raio-lg);padding:24px 28px;margin-bottom:24px;}
.bd-hero-info{flex:1;min-width:0;}
.bd-hero-title{font-size:18px;font-weight:700;color:#1E3A5F;margin:0 0 4px;}
.bd-hero-sub{font-size:12px;color:#3B82F6;margin:0 0 14px;}
.bd-hero-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bd-hero-img{flex-shrink:0;}
@media(max-width:600px){.bd-hero{flex-direction:column;text-align:center;}.bd-hero-controls{justify-content:center;}}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'DM Sans',sans-serif;color:#6B7280">
    <div style="text-align:center">
      <div style="width:32px;height:32px;border:3px solid #E5E7EB;border-top-color:#2D6A4F;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      Carregando...
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/ajuda.js"></script>
<script>
// ── Planos Supabase ───────────────────────────────────────────
// Para migrar para Pro: altere planoAtual para 'pro'
const PLANOS = {
  free: { nome: 'Free', db_bytes: 500  * 1024 * 1024,       storage_bytes: 1   * 1024 * 1024 * 1024 },
  pro:  { nome: 'Pro',  db_bytes: 8    * 1024 * 1024 * 1024, storage_bytes: 100 * 1024 * 1024 * 1024 },
  team: { nome: 'Team', db_bytes: 8    * 1024 * 1024 * 1024, storage_bytes: 100 * 1024 * 1024 * 1024 },
};
let planoAtual = 'free';
let monitoramento = null;
let monCarregando = false;

// ── Init ──────────────────────────────────────────────────────
(async () => {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }
  if (appState.perfil !== 'super_admin') { window.location.href = 'dashboard.html'; return; }

  document.getElementById('app').innerHTML =
    gerarLayout('Armazenamento em Nuvem', 'banco_dados') + '</div></div></div>';

  iniciarSino();
  await carregarMonitoramento();
})();

// ── Carregar dados ────────────────────────────────────────────
async function carregarMonitoramento() {
  monCarregando = true;
  renderPagina();
  try {
    const { data, error } = await db.rpc('get_monitoramento_banco');
    if (error) throw error;
    monitoramento = data;
  } catch(e) {
    monitoramento = { erro: e.message || 'Erro desconhecido' };
  } finally {
    monCarregando = false;
    renderPagina();
  }
}

async function recarregarMonitoramento() {
  const btn = document.getElementById('btn-refresh');
  if (btn) { btn.disabled = true; btn.textContent = '↻  Atualizando...'; }
  monitoramento = null;
  await carregarMonitoramento();
}

// ── Render ────────────────────────────────────────────────────
function renderPagina() {
  const pb = document.getElementById('page-body');
  if (!pb) return;
  pb.innerHTML = `<div class="bd-wrap fade-in">${renderConteudo()}</div>`;
}

function renderConteudo() {
  if (monCarregando) return `
    <div class="bd-loading">
      <div class="bd-spin"></div>
      <span>Consultando métricas do banco...</span>
    </div>`;

  if (!monitoramento) return `<div class="bd-empty">Nenhum dado carregado.</div>`;

  if (monitoramento.erro) return `
    <div class="bd-alert critico" style="margin-top:8px">
      ⚠ Erro ao consultar: ${esc(monitoramento.erro)}
    </div>`;

  const plano = PLANOS[planoAtual];
  const { db_size_bytes, storage_buckets, tabelas, consultado_em } = monitoramento;
  const storageTotal = (storage_buckets || []).reduce((s, b) => s + (b.tamanho_bytes || 0), 0);
  const dbPct  = Math.min(Math.round(db_size_bytes / plano.db_bytes * 100), 100);
  const stPct  = Math.min(Math.round(storageTotal  / plano.storage_bytes * 100), 100);
  const hora   = new Date(consultado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  return `
    <div class="bd-hero">
      <div class="bd-hero-info">
        <h2 class="bd-hero-title">☁ Armazenamento em Nuvem</h2>
        <p class="bd-hero-sub">Monitoramento de uso do banco de dados e arquivos no Supabase</p>
        <div class="bd-hero-controls">
          <span class="bd-plano-badge">${plano.nome}</span>
          <button class="bd-btn-refresh" id="btn-refresh" onclick="recarregarMonitoramento()">↻ Atualizar</button>
          <span class="bd-ts">Consultado às ${hora}</span>
        </div>
      </div>
      <div class="bd-hero-img">
        <svg width="130" height="110" viewBox="0 0 130 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Cloud shape -->
          <ellipse cx="65" cy="52" rx="52" ry="32" fill="#BFDBFE" opacity=".7"/>
          <ellipse cx="42" cy="58" rx="28" ry="20" fill="#BFDBFE" opacity=".7"/>
          <ellipse cx="88" cy="58" rx="28" ry="20" fill="#BFDBFE" opacity=".7"/>
          <ellipse cx="65" cy="62" rx="52" ry="22" fill="#DBEAFE"/>
          <!-- DB cylinder bottom -->
          <ellipse cx="65" cy="88" rx="22" ry="7" fill="#1D4ED8" opacity=".3"/>
          <rect x="43" y="70" width="44" height="18" fill="#2563EB"/>
          <ellipse cx="65" cy="70" rx="22" ry="7" fill="#3B82F6"/>
          <!-- DB cylinder top -->
          <ellipse cx="65" cy="57" rx="22" ry="7" fill="#1D4ED8" opacity=".3"/>
          <rect x="43" y="40" width="44" height="17" fill="#1D4ED8"/>
          <ellipse cx="65" cy="40" rx="22" ry="7" fill="#2563EB"/>
          <!-- Horizontal lines on cylinders (disk feel) -->
          <line x1="43" y1="47" x2="87" y2="47" stroke="#3B82F6" stroke-width="1" opacity=".5"/>
          <line x1="43" y1="52" x2="87" y2="52" stroke="#3B82F6" stroke-width="1" opacity=".5"/>
          <line x1="43" y1="76" x2="87" y2="76" stroke="#60A5FA" stroke-width="1" opacity=".5"/>
          <line x1="43" y1="81" x2="87" y2="81" stroke="#60A5FA" stroke-width="1" opacity=".5"/>
          <!-- LED indicator -->
          <circle cx="80" cy="44" r="3.5" fill="#34D399"/>
          <circle cx="80" cy="44" r="2" fill="#6EE7B7"/>
          <!-- Upload arrow -->
          <path d="M65 18 L65 8 M65 8 L60 13 M65 8 L70 13" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Floating data dots -->
          <circle cx="20" cy="40" r="3" fill="#60A5FA" opacity=".6"/>
          <circle cx="110" cy="35" r="2.5" fill="#93C5FD" opacity=".7"/>
          <circle cx="15" cy="65" r="2" fill="#3B82F6" opacity=".5"/>
          <circle cx="115" cy="60" r="3" fill="#60A5FA" opacity=".5"/>
        </svg>
      </div>
    </div>

    <div class="bd-gauges">
      ${bdGaugeCard('PostgreSQL DB', db_size_bytes, plano.db_bytes, dbPct)}
      ${bdGaugeCard('Storage Total',  storageTotal,  plano.storage_bytes, stPct)}
    </div>

    ${dbPct >= 80 ? bdAlerta(dbPct, 'banco de dados', plano.nome) : ''}
    ${stPct >= 80 ? bdAlerta(stPct, 'storage',        plano.nome) : ''}

    <div class="bd-grid">
      ${bdStorageBuckets(storage_buckets || [], storageTotal)}
      ${bdTabelasStats(tabelas || [], db_size_bytes)}
    </div>`;
}

// ── Gauge SVG ─────────────────────────────────────────────────
function bdGaugeCard(label, usado, total, pct) {
  const cor  = pct < 60 ? '#22c55e' : pct < 80 ? '#f59e0b' : '#ef4444';
  const r    = 52, cx = 58, cy = 58;
  const circ = 2 * Math.PI * r;
  const arc  = circ * 0.75;
  const fill = arc * (pct / 100);
  const svg  = `<svg width="116" height="116" viewBox="0 0 116 116">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="9"
      stroke-dasharray="${arc.toFixed(1)} ${(circ-arc).toFixed(1)}"
      stroke-linecap="round" transform="rotate(135 ${cx} ${cy})"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cor}" stroke-width="9"
      stroke-dasharray="${fill.toFixed(1)} ${(circ-fill).toFixed(1)}"
      stroke-linecap="round" transform="rotate(135 ${cx} ${cy})"/>
    <text x="${cx}" y="55" text-anchor="middle" font-size="20" font-weight="600" fill="#111827"
      font-family="DM Sans,sans-serif">${pct}%</text>
    <text x="${cx}" y="71" text-anchor="middle" font-size="10" fill="#6B7280"
      font-family="DM Sans,sans-serif">utilizado</text>
  </svg>`;
  return `<div class="bd-gauge-card">
    ${svg}
    <div class="bd-gauge-label">${label}</div>
    <div class="bd-gauge-sub">${bdFmtBytes(usado)} de ${bdFmtBytes(total)} usados</div>
  </div>`;
}

// ── Alerta ────────────────────────────────────────────────────
function bdAlerta(pct, recurso, plano) {
  const critico = pct >= 95;
  const cls = critico ? 'critico' : 'aviso';
  const msg = critico
    ? `🔴 <strong>${pct}% do ${recurso}</strong> utilizado — limite crítico. Considere migrar para o plano Pro.`
    : `⚠️ <strong>${pct}% do ${recurso}</strong> utilizado — acima de 80% do plano ${plano}.`;
  return `<div class="bd-alert ${cls}">${msg}</div>`;
}

// ── Storage por bucket ────────────────────────────────────────
function bdStorageBuckets(buckets, totalStorage) {
  if (!buckets.length) return `<div class="bd-card"><div class="bd-card-title">Storage por Bucket</div>
    <div class="bd-empty">Nenhum bucket encontrado.</div></div>`;

  const itens = buckets.map(b => {
    const pct = totalStorage > 0 ? Math.round(b.tamanho_bytes / totalStorage * 100) : 0;
    return `<div class="bd-bucket-item">
      <div class="bd-bucket-row">
        <span style="font-size:14px;flex-shrink:0">📁</span>
        <span class="bd-bucket-name" title="${esc(b.bucket_id)}">${esc(b.bucket_id)}</span>
        <span class="bd-bucket-meta">${bdFmtBytes(b.tamanho_bytes)} · ${b.total_arquivos} arq.</span>
      </div>
      <div class="bd-bar-track">
        <div class="bd-bar-fill" style="width:${pct}%;background:#60a5fa"></div>
      </div>
    </div>`;
  }).join('');

  return `<div class="bd-card">
    <div class="bd-card-title">Storage por Bucket</div>
    ${itens}
  </div>`;
}

// ── Tabelas ───────────────────────────────────────────────────
function bdTabelasStats(tabelas, dbTotal) {
  if (!tabelas.length) return `<div class="bd-card"><div class="bd-card-title">Tabelas</div>
    <div class="bd-empty">Nenhuma tabela encontrada.</div></div>`;

  const linhas = tabelas.slice(0, 15).map(tb => {
    const pct = dbTotal > 0 ? (tb.tamanho_bytes / dbTotal * 100).toFixed(1) : '0.0';
    return `<tr>
      <td>${esc(tb.tabela)}</td>
      <td class="mono">${Number(tb.linhas).toLocaleString('pt-BR')}</td>
      <td class="mono">${bdFmtBytes(tb.tamanho_bytes)}</td>
      <td class="mono">${pct}%</td>
    </tr>`;
  }).join('');

  return `<div class="bd-card">
    <div class="bd-card-title">Tabelas</div>
    <table class="bd-tbl">
      <thead><tr><th>Tabela</th><th>Linhas</th><th>Tamanho</th><th>%</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>
  </div>`;
}

// ── Helpers ───────────────────────────────────────────────────
function bdFmtBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0, v = bytes;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + ' ' + u[i];
}
</script>
</body>
</html>
