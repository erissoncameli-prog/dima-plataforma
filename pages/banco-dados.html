<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Armazenamento</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa + componentes de Administração (css/administracao.css, prefixo ad-) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/administracao.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="ad-carrega" role="status"><span class="ad-spin"></span>Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/administracao.js"></script>
<script>
// ── Armazenamento (super_admin) ─────────────────────────────────────────
// Só leitura: get_monitoramento_banco() (SECURITY DEFINER, confere super_admin no banco).
// Limites do plano Supabase: para migrar para Pro, troque planoAtual para 'pro'.
const PLANOS = {
  free: { nome: 'Free', db_bytes: 500 * 1024 * 1024, storage_bytes: 1 * 1024 * 1024 * 1024 },
  pro:  { nome: 'Pro',  db_bytes: 8 * 1024 * 1024 * 1024, storage_bytes: 100 * 1024 * 1024 * 1024 },
  team: { nome: 'Team', db_bytes: 8 * 1024 * 1024 * 1024, storage_bytes: 100 * 1024 * 1024 * 1024 },
};
let planoAtual = 'free';
let monitoramento = null, monCarregando = false, todasTabelas = false;

(async () => {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }
  if (appState.perfil !== 'super_admin') { window.location.href = 'dashboard.html'; return; }
  document.getElementById('app').innerHTML = gerarLayout('Armazenamento', 'banco_dados') + '</div></div></div>';
  adSeletorTema();
  iniciarSino();
  await carregarMonitoramento();
})();

async function carregarMonitoramento() {
  monCarregando = true; renderPagina();
  try {
    const { data, error } = await db.rpc('get_monitoramento_banco');
    if (error) throw error;
    monitoramento = data;
  } catch (e) {
    monitoramento = { erro: e.message || 'Erro desconhecido' };
  } finally { monCarregando = false; renderPagina(); }
}
function recarregarMonitoramento() { monitoramento = null; carregarMonitoramento(); }

function renderPagina() {
  const pb = document.getElementById('page-body'); if (!pb) return;
  pb.innerHTML = `<div class="fade-in">${renderConteudo()}</div>`;
}

function renderConteudo() {
  const topo = (extra) => `<div class="ad-topo"><div><h2>Armazenamento</h2><p>Quanto o banco de dados e os arquivos ocupam no Supabase, contra o limite do plano.</p></div>${extra || ''}</div>`;
  if (monCarregando) return topo() + `<div class="ad-carrega" style="min-height:30vh" role="status"><span class="ad-spin"></span>Consultando o banco…</div>`;
  if (!monitoramento) return topo() + '<div class="ad-card ad-vazio">Nenhum dado carregado.</div>';
  if (monitoramento.erro) return topo(botaoAtualizar()) + `<div class="ad-aviso er">${adIc('alerta', 'p')}<span>Erro ao consultar: ${esc(monitoramento.erro)}</span></div>`;

  const plano = PLANOS[planoAtual];
  const { db_size_bytes, storage_buckets, tabelas, consultado_em } = monitoramento;
  const storageTotal = (storage_buckets || []).reduce((s, b) => s + (b.tamanho_bytes || 0), 0);
  const dbPct = Math.min(Math.round(db_size_bytes / plano.db_bytes * 100), 100);
  const stPct = Math.min(Math.round(storageTotal / plano.storage_bytes * 100), 100);
  const hora = consultado_em ? new Date(consultado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';

  return topo(`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="ad-pill ad-ne">Plano ${esc(plano.nome)}</span>
      <span class="ad-kpi-s">consultado às ${esc(hora)}</span>${botaoAtualizar()}</div>`) + `
    <div class="ad-arm">
      ${medidor('banco', 'Banco de dados', db_size_bytes, plano.db_bytes, dbPct)}
      ${medidor('nuvem', 'Arquivos', storageTotal, plano.storage_bytes, stPct)}
    </div>
    ${dbPct >= 80 ? alerta(dbPct, 'do banco de dados', plano.nome) : ''}
    ${stPct >= 80 ? alerta(stPct, 'dos arquivos', plano.nome) : ''}
    ${pastas(storage_buckets || [], storageTotal)}
    ${tabelasHtml(tabelas || [], db_size_bytes)}`;
}
const botaoAtualizar = () => `<button type="button" class="btn btn-secondary" onclick="recarregarMonitoramento()">${adIc('trocar', 'p')}Atualizar</button>`;
const faixa = pct => pct >= 95 ? 'er' : pct >= 80 ? 'al' : '';

function medidor(ic, rotulo, usado, total, pct) {
  return `<div class="ad-card ad-med">
    <div class="ad-med-l"><b>${adIc(ic, 'p')}${rotulo}</b><span class="ad-mono">${fmtBytes(usado)} de ${fmtBytes(total)}</span></div>
    <div class="ad-med-v">${pct}% <small>usado</small></div>
    <div class="ad-trilho ${faixa(pct)}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${rotulo}: ${pct}% usado"><i style="width:${pct}%"></i></div>
  </div>`;
}
function alerta(pct, recurso, plano) {
  const crit = pct >= 95;
  return `<div class="ad-aviso ${crit ? 'er' : ''}">${adIc('alerta', 'p')}<span><b>${pct}% ${recurso}</b> ${crit ? '— limite quase atingido. Planeje limpeza ou a mudança para o plano Pro.' : `— acima de 80% do plano ${esc(plano)}.`}</span></div>`;
}
function pastas(buckets, total) {
  const ord = buckets.slice().sort((a, b) => (b.tamanho_bytes || 0) - (a.tamanho_bytes || 0));
  const max = ord.length ? (ord[0].tamanho_bytes || 0) : 0;
  const itens = ord.length ? ord.map(b => {
    const pct = max > 0 ? Math.round((b.tamanho_bytes || 0) / max * 100) : 0;
    return `<div class="ad-bk"><span class="ad-mono" style="text-align:left;color:var(--txt)">${esc(b.bucket_id)}</span>
      <div class="ad-trilho fino"><i style="width:${pct}%;background:var(--pri-600)"></i></div>
      <span class="ad-mono">${fmtBytes(b.tamanho_bytes)}</span><span class="ad-mono ad-n-arq">${Number(b.total_arquivos || 0).toLocaleString('pt-BR')} arq.</span></div>`;
  }).join('') : '<div class="ad-vazio">Nenhuma pasta encontrada.</div>';
  return `<div class="ad-card" style="margin-bottom:14px"><div class="ad-sec-h">${adIc('pasta', 'p')}<span style="flex:1">Arquivos por pasta</span><small>${fmtBytes(total)} no total</small></div>${itens}</div>`;
}
function tabelasHtml(tabelas, dbTotal) {
  if (!tabelas.length) return '<div class="ad-card ad-vazio">Nenhuma tabela encontrada.</div>';
  const lista = todasTabelas ? tabelas : tabelas.slice(0, 15);
  const linhas = lista.map(tb => {
    const pct = dbTotal > 0 ? (tb.tamanho_bytes / dbTotal * 100).toFixed(1).replace('.', ',') : '0';
    return `<tr><td class="ad-mono" style="color:var(--txt)">${esc(tb.tabela)}</td><td class="ad-mono">${Number(tb.linhas || 0).toLocaleString('pt-BR')}</td><td class="ad-mono">${fmtBytes(tb.tamanho_bytes)}</td><td class="ad-mono">${pct}%</td></tr>`;
  }).join('');
  return `<div class="ad-card"><div class="ad-sec-h">${adIc('tabela', 'p')}<span style="flex:1">Maiores tabelas</span>
      ${tabelas.length > 15 ? `<button type="button" class="btn btn-secondary" onclick="todasTabelas=!todasTabelas;renderPagina()">${todasTabelas ? 'Mostrar só as 15 maiores' : 'Mostrar todas (' + tabelas.length + ')'}</button>` : ''}</div>
    <div class="ad-tab-wrap"><table class="ad-tab ad-tab-num"><thead><tr><th>Tabela</th><th>Linhas</th><th>Tamanho</th><th>% do banco</th></tr></thead><tbody>${linhas}</tbody></table></div></div>`;
}
function fmtBytes(bytes) {
  if (!bytes) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0, v = bytes;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1).replace('.', ',') + ' ' + u[i];
}
</script>
</body>
</html>
