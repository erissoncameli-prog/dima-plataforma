<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Dados do sistema</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa + componentes de Administração (css/administracao.css, prefixo ad-) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/administracao.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="ad-carrega" role="status"><span class="ad-spin"></span>Carregando configurações…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/administracao.js"></script>
<script>
// ── Estado ───────────────────────────────────────────────────
let cfg = {
  projeto_id: 'default', projeto_nome: '', projeto_codigo: '',
  projeto_localizacao: '', cor_primaria: '#1F4E2C',
  logos_topo: [], logo_projeto: { url: '', alt: '' },
  logos_parceiros: [], fotos: []
};
let tabAtual = 'identidade';
let salvando = false;
let fotoPreviewIdx = 0;
let fotoTimer;
let sujo = false; // alteração ainda não salva
const COR_PADRAO = '#1F4E2C';
const corValida = v => /^#[0-9A-Fa-f]{6}$/.test(v || '') ? v : COR_PADRAO;
function marcarSujo(v = true) {
  sujo = v;
  const el = document.getElementById('cfg-pendente'); if (el) el.hidden = !v;
}
window.addEventListener('beforeunload', e => { if (sujo) { e.preventDefault(); e.returnValue = ''; } });
// qualquer digitação ou troca no editor conta como alteração
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('.ad-cfg-ed')) marcarSujo(); });
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('.ad-cfg-ed') && e.target.type !== 'file') marcarSujo(); });


// ── Init ─────────────────────────────────────────────────────
(async () => {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }
  if (appState.perfil !== 'super_admin') { window.location.href = 'dashboard.html'; return; }

  document.getElementById('app').innerHTML =
    gerarLayout('Dados do sistema', 'configuracoes') + '</div></div></div>';
  adSeletorTema();

  await carregarConfig();
  renderPagina();
  window.addEventListener('resize', ajustarPreview);
  iniciarSino();
})();

// ── Carregar config ───────────────────────────────────────────
async function carregarConfig() {
  const { data } = await db.from('configuracoes_sistema')
    .select('*').eq('projeto_id', 'default').single();
  if (data) {
    cfg = {
      projeto_id: data.projeto_id || 'default',
      projeto_nome: data.projeto_nome || '',
      projeto_codigo: data.projeto_codigo || '',
      projeto_localizacao: data.projeto_localizacao || '',
      cor_primaria: corValida(data.cor_primaria),
      logos_topo: data.logos_topo || [],
      logo_projeto: data.logo_projeto || { url: '', alt: '' },
      logos_parceiros: data.logos_parceiros || [],
      fotos: data.fotos || []
    };
  }
}

// ── Render página ─────────────────────────────────────────────
function renderPagina() {
  document.getElementById('page-body').innerHTML = `
  <div class="fade-in">
    <div class="ad-topo"><div><h2>Dados do sistema</h2><p>Nome, cor, fotos e logos da tela de entrada da plataforma. A prévia ao lado mostra o resultado antes de salvar.</p></div></div>
    <div class="ad-cfg">
      <div class="ad-card ad-cfg-ed">
        <div class="ad-seg" role="tablist" aria-label="Seções">
          <button type="button" role="tab" class="tab-btn" aria-pressed="true" onclick="setTab('identidade',this)">${adIc('paleta','p')} Identidade</button>
          <button type="button" role="tab" class="tab-btn" aria-pressed="false" onclick="setTab('fotos',this)">${adIc('imagem','p')} Fotos e vídeos</button>
          <button type="button" role="tab" class="tab-btn" aria-pressed="false" onclick="setTab('logos',this)">${adIc('globo','p')} Logos</button>
        </div>
        <div class="ad-cfg-corpo">
          ${renderTabIdentidade()}
          ${renderTabFotos()}
          ${renderTabLogos()}
        </div>
        <div class="ad-cfg-pe">
          <span class="ad-pendente" id="cfg-pendente" hidden>${adIc('alerta','p')}Alterações não salvas</span>
          <span class="ad-sp"></span>
          <button type="button" class="btn btn-primary" id="btn-salvar" onclick="salvarConfig()">${adIc('salvar','p')}Salvar alterações</button>
        </div>
      </div>
      <div class="ad-prev-wrap">
        <div class="ad-prev-cab"><b>Prévia</b><span>como a tela de entrada vai aparecer · igual nos dois temas</span></div>
        <div id="preview-outer">${renderPreviewHTML()}</div>
      </div>
    </div>
  </div>`;

  initDragDrop('lista-fotos', sincronizarFotosDOM);
  initDragDrop('lista-logos-topo', sincronizarTopoDOM);
  initDragDrop('lista-parceiros', sincronizarParceirosDOM);
  iniciarTimerFotos();
  ajustarPreview();
}

// ── Tab: Identidade ───────────────────────────────────────────
function renderTabIdentidade() {
  return `
  <div id="tab-identidade" class="tab-content ativo">
    <div class="form-group">
      <label class="form-label">Nome do projeto</label>
      <input class="form-control" value="${esc(cfg.projeto_nome)}"
        oninput="cfg.projeto_nome=this.value;pvTextos()"
        placeholder="Nome completo do projeto">
    </div>
    <div class="form-group">
      <label class="form-label">Código do projeto</label>
      <input class="form-control" value="${esc(cfg.projeto_codigo)}"
        oninput="cfg.projeto_codigo=this.value;pvTextos()"
        placeholder="Ex: 218BRA2001 · UNESCO/MPTF">
    </div>
    <div class="form-group">
      <label class="form-label">Localização / subtítulo</label>
      <input class="form-control" value="${esc(cfg.projeto_localizacao)}"
        oninput="cfg.projeto_localizacao=this.value;pvTextos()"
        placeholder="Ex: Rio Branco, Acre — Fundo Multipartes">
    </div>
    <div class="form-group">
      <label class="form-label">Cor principal</label>
      <div class="color-row">
        <div class="color-swatch" id="cor-swatch" style="background:${corValida(cfg.cor_primaria)}"></div>
        <input class="form-control" id="inp-cor-hex" value="${esc(corValida(cfg.cor_primaria))}"
          maxlength="7" placeholder="#1F4E2C" aria-label="Cor principal em hexadecimal"
          oninput="onHexInput(this.value)" style="font-family:var(--font-mono);font-size:13px">
        <span class="ad-cor"><input type="color" value="${corValida(cfg.cor_primaria)}" aria-label="Escolher a cor"
          onchange="aplicarCor(this.value)"></span>
      </div>
    </div>
  </div>`;
}

function onHexInput(v) {
  if (/^#[0-9A-Fa-f]{6}$/.test(v)) aplicarCor(v);
}
function aplicarCor(v) {
  v = corValida(v); cfg.cor_primaria = v;
  const s = document.getElementById('cor-swatch');
  const h = document.getElementById('inp-cor-hex');
  if (s) s.style.background = v;
  if (h) h.value = v;
  const btn = document.querySelector('#pv-dir .pv-btn');
  if (btn) btn.style.background = v;
}

// ── Tab: Fotos ────────────────────────────────────────────────
function renderTabFotos() {
  const n = cfg.fotos.length;
  return `
  <div id="tab-fotos" class="tab-content">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px">
      <p class="ad-cfg-txt">
        Slideshow da tela de login. Fotos e vídeos podem ser misturados e reordenados.<br>
        <strong>Foto:</strong> JPG/JPEG · máx <strong>5 MB</strong> · mín 1280×720 px, paisagem<br>
        <strong>Vídeo:</strong> MP4/WEBM · máx <strong>40 MB</strong> · recomendado até 15s
      </p>
      <span class="limit-badge ${n>=15?'warn':''}">${n}/15</span>
    </div>
    <div id="lista-fotos">
      ${cfg.fotos.map((f, i) => renderFotoItem(f, i)).join('')}
    </div>
    ${n < 15 ? `
    <button class="btn-add-item" onclick="document.getElementById('inp-foto').click()">
      ${adIc('mais','p')} Adicionar foto ou vídeo
    </button>
    <input type="file" id="inp-foto" accept=".jpg,.jpeg,.mp4,.webm" style="display:none"
      onchange="handleUploadFoto(this.files)">
    ` : `<p class="ad-cfg-txt" style="text-align:center;margin-top:8px">Limite de 15 itens atingido</p>`}
  </div>`;
}

function renderFotoItem(f, i) {
  const nomeArq = (f.url || '').split('/').pop().split('?')[0];
  const shortUrl = nomeArq.length > 36 ? '…' + nomeArq.slice(-33) : nomeArq;
  const isVideo = f.tipo === 'video';
  const thumb = isVideo
    ? `<div class="sort-thumb" style="position:relative;background:#111">
         <video src="${esc(imgUrl(f.url))}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block"></video>
         <span style="position:absolute;inset:0;display:grid;place-items:center;color:#fff">${adIc('play','p')}</span>
       </div>`
    : `<img class="sort-thumb" src="${esc(imgUrl(f.url))}" alt="" onerror="this.style.opacity='.2'">`;
  return `
  <div class="sort-item" draggable="true" data-idx="${i}">
    <span class="drag-handle" title="Arrastar para reordenar" aria-hidden="true">${adIc('alca','p')}</span>
    ${thumb}
    <div class="sort-info">
      <input class="caption-input" value="${esc(f.legenda || '')}" placeholder="Legenda" aria-label="Legenda"
        oninput="cfg.fotos[${i}].legenda=this.value" onclick="event.stopPropagation()">
      <div class="alt-input" style="cursor:default">${isVideo ? 'vídeo · ' : 'foto · '}${esc(shortUrl)}</div>
    </div>
    <div class="sort-actions">
      <button type="button" class="btn-icon-sm danger" onclick="removerFoto(${i})" title="Remover" aria-label="Remover">${adIc('x','p')}</button>
    </div>
  </div>`;
}

async function handleUploadFoto(files) {
  if (!files.length) return;
  const file = files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  const isVideo = ['mp4','webm'].includes(ext);
  const isFoto  = ['jpg','jpeg'].includes(ext);
  if (!isVideo && !isFoto) { toast('Apenas JPG/JPEG (foto) ou MP4/WEBM (vídeo).', 'error'); return; }
  const maxBytes = isVideo ? 40 * 1024 * 1024 : 5 * 1024 * 1024;
  const maxLabel = isVideo ? '40 MB' : '5 MB';
  if (file.size > maxBytes) { toast(`Tamanho máximo: ${maxLabel}.`, 'error'); return; }
  if (cfg.fotos.length >= 15) { toast('Limite de 15 itens atingido.', 'error'); return; }
  toast(isVideo ? 'Enviando vídeo...' : 'Enviando foto...', 'info');
  try {
    const url = await uploadArquivo(file, 'fotos');
    cfg.fotos.push({ url, legenda: '', ordem: cfg.fotos.length, tipo: isVideo ? 'video' : 'foto' });
    reRenderTab('fotos');
    initDragDrop('lista-fotos', sincronizarFotosDOM);
    pvFotos(); marcarSujo();
    toast((isVideo ? 'Vídeo adicionado' : 'Foto adicionada') + '. Salve para publicar.', 'success');
  } catch(e) { toast('Erro ao enviar: ' + e.message, 'error'); }
}

async function removerFoto(i) {
  const f = cfg.fotos[i]; if (!f) return;
  const ok = await adConfirmar({ titulo: f.tipo === 'video' ? 'Remover o vídeo?' : 'Remover a foto?', texto: 'Sai do slideshow da tela de entrada quando você salvar.', ok: 'Remover', perigo: true });
  if (!ok) return;
  cfg.fotos.splice(i, 1); marcarSujo();
  cfg.fotos.forEach((f, idx) => f.ordem = idx);
  reRenderTab('fotos');
  initDragDrop('lista-fotos', sincronizarFotosDOM);
  pvFotos();
}

function sincronizarFotosDOM() {
  const items = [...document.querySelectorAll('#lista-fotos .sort-item')];
  const nova = items.map(el => cfg.fotos[parseInt(el.dataset.idx)]).filter(Boolean);
  cfg.fotos = nova.map((f, i) => ({ ...f, ordem: i })); marcarSujo();
  reRenderTab('fotos');
  initDragDrop('lista-fotos', sincronizarFotosDOM);
  pvFotos();
}

// ── Tab: Logos ────────────────────────────────────────────────
function renderTabLogos() {
  return `
  <div id="tab-logos" class="tab-content">

    <div class="ad-zona">
      <div class="section-label">
        Zona A — Topo Esquerdo <span class="line"></span>
        <span class="limit-badge ${cfg.logos_topo.length>=3?'warn':''}">${cfg.logos_topo.length}/3</span>
      </div>
      <p class="ad-cfg-txt" style="margin-bottom:10px">
        Logos na caixa branca superior · <strong>PNG/SVG</strong> · máx <strong>500 KB</strong>
      </p>
      <div id="lista-logos-topo">
        ${cfg.logos_topo.map((l, i) => renderLogoItem(l, i, 'topo')).join('')}
      </div>
      ${cfg.logos_topo.length < 3 ? `
        <button class="btn-add-item" onclick="document.getElementById('inp-logo-topo').click()">
          ${adIc('mais','p')} Adicionar logo
        </button>
        <input type="file" id="inp-logo-topo" accept=".png,.svg" style="display:none"
          onchange="handleUploadLogo(this.files,'topo')">
      ` : ''}
    </div>

    <div class="ad-zona">
      <div class="section-label">Zona B — Logo do Projeto <span class="line"></span></div>
      <p class="ad-cfg-txt" style="margin-bottom:10px">
        Destaque no canto superior direito · <strong>PNG/SVG</strong> · máx <strong>500 KB</strong>
      </p>
      <div id="logo-projeto-slot">
        ${cfg.logo_projeto?.url ? `
        <div class="sort-item" style="margin-bottom:6px">
          <img class="sort-thumb-logo" src="${esc(imgUrl(cfg.logo_projeto.url))}" alt="" onerror="this.style.opacity='.2'">
          <div class="sort-info">
            <input class="alt-input" value="${esc(cfg.logo_projeto.alt||'')}"
              placeholder="Texto alternativo" aria-label="Texto alternativo"
              oninput="cfg.logo_projeto.alt=this.value">
          </div>
          <div class="sort-actions">
            <button type="button" class="btn-icon-sm" onclick="document.getElementById('inp-logo-projeto').click()" title="Trocar" aria-label="Trocar">${adIc('trocar','p')}</button>
            <button type="button" class="btn-icon-sm danger" onclick="removerLogoProjeto()" title="Remover" aria-label="Remover">${adIc('x','p')}</button>
          </div>
        </div>` : `
        <button class="btn-add-item" onclick="document.getElementById('inp-logo-projeto').click()">
          ${adIc('mais','p')} Adicionar logo do projeto
        </button>`}
        <input type="file" id="inp-logo-projeto" accept=".png,.svg" style="display:none"
          onchange="handleUploadLogo(this.files,'projeto')">
      </div>
    </div>

    <div>
      <div class="section-label">
        Zona C — Parceiros <span class="line"></span>
        <span class="limit-badge ${cfg.logos_parceiros.length>=8?'warn':''}">${cfg.logos_parceiros.length}/8</span>
      </div>
      <p class="ad-cfg-txt" style="margin-bottom:10px">
        Seção "Realização e Parceiros" · <strong>PNG/SVG</strong> · máx <strong>1 MB</strong>
      </p>
      <div id="lista-parceiros">
        ${cfg.logos_parceiros.map((l, i) => renderLogoItem(l, i, 'parceiro')).join('')}
      </div>
      ${cfg.logos_parceiros.length < 8 ? `
        <button class="btn-add-item" onclick="document.getElementById('inp-logo-parceiro').click()">
          ${adIc('mais','p')} Adicionar parceiro
        </button>
        <input type="file" id="inp-logo-parceiro" accept=".png,.svg" style="display:none"
          onchange="handleUploadLogo(this.files,'parceiro')">
      ` : ''}
    </div>
  </div>`;
}

function renderLogoItem(l, i, tipo) {
  const sizeSel = tipo === 'parceiro' ? `
    <select class="size-select" onchange="setTamanho(${i},this.value)" onclick="event.stopPropagation()" aria-label="Tamanho">
      <option value="pequeno" ${l.tamanho==='pequeno'?'selected':''}>Peq.</option>
      <option value="medio"   ${(!l.tamanho||l.tamanho==='medio')?'selected':''}>Méd.</option>
      <option value="grande"  ${l.tamanho==='grande'?'selected':''}>Gde.</option>
    </select>` : '';
  return `
  <div class="sort-item" draggable="true" data-idx="${i}">
    <span class="drag-handle" title="Arrastar para reordenar" aria-hidden="true">${adIc('alca','p')}</span>
    <img class="sort-thumb-logo" src="${esc(imgUrl(l.url))}" alt="" onerror="this.style.opacity='.2'">
    <div class="sort-info">
      <input class="alt-input" value="${esc(l.alt||'')}" placeholder="Nome / texto alternativo" aria-label="Nome do logo"
        oninput="setAlt('${tipo}',${i},this.value)" onclick="event.stopPropagation()">
    </div>
    ${sizeSel}
    <div class="sort-actions">
      <button type="button" class="btn-icon-sm" onclick="trocarLogo('${tipo}',${i})" title="Trocar imagem" aria-label="Trocar imagem">${adIc('trocar','p')}</button>
      <button type="button" class="btn-icon-sm danger" onclick="removerLogo('${tipo}',${i})" title="Remover" aria-label="Remover">${adIc('x','p')}</button>
    </div>
  </div>
  <input type="file" id="inp-troca-${tipo}-${i}" accept=".png,.svg" style="display:none"
    onchange="handleTrocarLogo(this.files,'${tipo}',${i})">`;
}

function setAlt(tipo, i, val) {
  if (tipo === 'topo') cfg.logos_topo[i].alt = val;
  else if (tipo === 'parceiro') cfg.logos_parceiros[i].alt = val;
  pvLogos();
}
function setTamanho(i, val) {
  cfg.logos_parceiros[i].tamanho = val;
  pvLogos();
}
function trocarLogo(tipo, i) {
  document.getElementById(`inp-troca-${tipo}-${i}`)?.click();
}
async function removerLogoProjeto() {
  const ok = await adConfirmar({ titulo: 'Remover o logo do projeto?', texto: 'Sai da tela de entrada quando você salvar.', ok: 'Remover', perigo: true });
  if (!ok) return;
  cfg.logo_projeto = { url: '', alt: '' }; marcarSujo();
  reRenderTab('logos');
  initDragDrop('lista-logos-topo', sincronizarTopoDOM);
  initDragDrop('lista-parceiros', sincronizarParceirosDOM);
  pvLogos();
}
async function removerLogo(tipo, i) {
  const ok = await adConfirmar({ titulo: tipo === 'topo' ? 'Remover este logo?' : 'Remover este parceiro?', texto: 'Sai da tela de entrada quando você salvar.', ok: 'Remover', perigo: true });
  if (!ok) return;
  marcarSujo();
  if (tipo === 'topo') cfg.logos_topo.splice(i, 1);
  else cfg.logos_parceiros.splice(i, 1);
  reRenderTab('logos');
  initDragDrop('lista-logos-topo', sincronizarTopoDOM);
  initDragDrop('lista-parceiros', sincronizarParceirosDOM);
  pvLogos();
}

async function handleUploadLogo(files, zona) {
  if (!files.length) return;
  const file = files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['png','svg'].includes(ext)) { toast('Apenas PNG ou SVG para logos.', 'error'); return; }
  const maxBytes = zona === 'parceiro' ? 1024*1024 : 512*1024;
  const maxLabel = zona === 'parceiro' ? '1 MB' : '500 KB';
  if (file.size > maxBytes) { toast(`Tamanho máximo: ${maxLabel}.`, 'error'); return; }
  toast('Enviando logo...', 'info');
  try {
    const url = await uploadArquivo(file, 'logos');
    const item = { url, alt: file.name.replace(/\.[^.]+$/, ''), ordem: 0 };
    if (zona === 'topo') cfg.logos_topo.push({ ...item, ordem: cfg.logos_topo.length });
    else if (zona === 'projeto') cfg.logo_projeto = item;
    else cfg.logos_parceiros.push({ ...item, tamanho: 'medio', ordem: cfg.logos_parceiros.length });
    reRenderTab('logos');
    initDragDrop('lista-logos-topo', sincronizarTopoDOM);
    initDragDrop('lista-parceiros', sincronizarParceirosDOM);
    pvLogos(); marcarSujo();
    toast('Logo adicionado. Salve para publicar.', 'success');
  } catch(e) { toast('Erro ao enviar: ' + e.message, 'error'); }
}

async function handleTrocarLogo(files, tipo, i) {
  if (!files.length) return;
  const file = files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['png','svg'].includes(ext)) { toast('Apenas PNG ou SVG.', 'error'); return; }
  const maxBytes = tipo === 'parceiro' ? 1024*1024 : 512*1024;
  if (file.size > maxBytes) { toast('Arquivo muito grande.', 'error'); return; }
  toast('Trocando...', 'info');
  try {
    const url = await uploadArquivo(file, 'logos');
    if (tipo === 'topo') cfg.logos_topo[i].url = url;
    else cfg.logos_parceiros[i].url = url;
    reRenderTab('logos');
    initDragDrop('lista-logos-topo', sincronizarTopoDOM);
    initDragDrop('lista-parceiros', sincronizarParceirosDOM);
    pvLogos(); marcarSujo();
    toast('Logo trocado. Salve para publicar.', 'success');
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

function sincronizarTopoDOM() {
  const items = [...document.querySelectorAll('#lista-logos-topo .sort-item')];
  cfg.logos_topo = items.map(el => cfg.logos_topo[parseInt(el.dataset.idx)]).filter(Boolean)
    .map((l, i) => ({ ...l, ordem: i })); marcarSujo();
  reRenderTab('logos');
  initDragDrop('lista-logos-topo', sincronizarTopoDOM);
  initDragDrop('lista-parceiros', sincronizarParceirosDOM);
  pvLogos();
}

function sincronizarParceirosDOM() {
  const items = [...document.querySelectorAll('#lista-parceiros .sort-item')];
  cfg.logos_parceiros = items.map(el => cfg.logos_parceiros[parseInt(el.dataset.idx)]).filter(Boolean)
    .map((l, i) => ({ ...l, ordem: i })); marcarSujo();
  reRenderTab('logos');
  initDragDrop('lista-logos-topo', sincronizarTopoDOM);
  initDragDrop('lista-parceiros', sincronizarParceirosDOM);
  pvLogos();
}

// ── Tabs ──────────────────────────────────────────────────────
function setTab(nome, btn) {
  tabAtual = nome;
  document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('ativo'));
  document.getElementById('tab-' + nome)?.classList.add('ativo');
}

function reRenderTab(nome) {
  const el = document.getElementById('tab-' + nome);
  if (!el) return;
  const ativo = el.classList.contains('ativo');
  const map = { identidade: renderTabIdentidade, fotos: renderTabFotos, logos: renderTabLogos };
  el.outerHTML = map[nome]();
  if (ativo) document.getElementById('tab-' + nome)?.classList.add('ativo');
}

// ── Preview ───────────────────────────────────────────────────
function renderPreviewHTML() {
  const primeiro = cfg.fotos[0];
  const ehVideo = primeiro?.tipo === 'video';
  const pvMidia = ehVideo
    ? `<video id="pv-foto" src="${esc(imgUrl(primeiro.url))}" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`
    : `<div id="pv-foto" style="background-image:url('${esc(imgUrl(primeiro?.url || ''))}')"></div>`;
  return `
  <div id="preview-frame">
    <div id="pv-esq">
      ${pvMidia}
      <div id="pv-overlay"></div>
      <div id="pv-conteudo">
        <div><div id="pv-logos-topo">${pvHtmlLogosTopo()}</div></div>
        <div id="pv-logo-projeto-wrap">
          <div id="pv-logo-projeto-box">${pvHtmlLogoProjeto()}</div>
        </div>
        <div>
          <div id="pv-proj-info">
            <div id="pv-proj-badge"><div class="pv-dot"></div>${esc(cfg.projeto_codigo)}</div>
            <div id="pv-proj-nome">${esc(cfg.projeto_nome)}</div>
            <div id="pv-proj-local">${esc(cfg.projeto_localizacao)}</div>
            <div id="pv-dots" style="display:flex;gap:4px;margin-top:8px">${pvHtmlDots()}</div>
          </div>
          <div id="pv-parceiros-wrap">
            <span class="pv-parceiros-label-left">Realização e parceiros</span>
            <div id="pv-parceiros-logos">${pvHtmlParceiros()}</div>
          </div>
        </div>
      </div>
      <div class="pv-foto-contador">${cfg.fotos.length ? '1 / ' + cfg.fotos.length : ''}</div>
      <div class="pv-foto-legenda">${esc(cfg.fotos[0]?.legenda || 'APAs · Rio Branco, Acre')}</div>
    </div>
    <div id="pv-dir">
      <div id="pv-login-box">
        <div class="pv-lang-row">
          <div class="pv-lang-btn ativo">PT</div>
          <div class="pv-lang-btn">EN</div>
          <div class="pv-lang-btn">ES</div>
        </div>
        <div class="pv-titulo">Entrar na plataforma</div>
        <div class="pv-sub">Acesse com suas credenciais institucionais</div>
        <div class="pv-label">E-mail</div><div class="pv-input"></div>
        <div class="pv-label">Senha</div><div class="pv-input"></div>
        <div class="pv-btn" style="background:${corValida(cfg.cor_primaria)}"></div>
      </div>
    </div>
  </div>`;
}

function pvHtmlLogosTopo() {
  if (!cfg.logos_topo.length)
    return '<span style="font-size:10px;color:rgba(255,255,255,.4)">Sem logos</span>';
  const alturas = { pequeno:'40px', medio:'63px', grande:'95px' };
  return cfg.logos_topo.map((l, i) =>
    `${i > 0 ? '<div style="width:1px;height:81px;background:rgba(0,0,0,.15);flex-shrink:0"></div>' : ''}
     <img src="${esc(imgUrl(l.url))}" alt="${esc(l.alt||'')}" style="height:${alturas[l.tamanho] || alturas.medio};width:auto;object-fit:contain" onerror="this.style.opacity='.2'">`
  ).join('');
}

function pvHtmlLogoProjeto() {
  if (!cfg.logo_projeto?.url)
    return '';
  return `<img src="${esc(imgUrl(cfg.logo_projeto.url))}" alt=""
    style="height:96px;width:auto;display:block" onerror="this.style.opacity='.2'">`;
}

function pvHtmlParceiros() {
  if (!cfg.logos_parceiros.length)
    return '<span style="font-size:9px;color:rgba(255,255,255,.4)">Sem parceiros</span>';
  return cfg.logos_parceiros.map(l =>
    `<img src="${esc(imgUrl(l.url))}" alt="${esc(l.alt||'')}"
      style="height:${l.tamanho==='grande'?'100px':'60px'};width:${l.tamanho==='grande'?'100px':'150px'};object-fit:contain;object-position:center;opacity:.95"
      onerror="this.style.opacity='.2'">`
  ).join('');
}

function pvHtmlDots() {
  return cfg.fotos.map((_, i) =>
    `<div style="width:${i===fotoPreviewIdx?'14':'5'}px;height:4px;border-radius:2px;
      background:${i===fotoPreviewIdx?'#F4D35E':'rgba(255,255,255,.3)'}"></div>`
  ).join('');
}

// Atualizações parciais do preview
function pvTextos() {
  const badge = document.getElementById('pv-proj-badge');
  const nome  = document.getElementById('pv-proj-nome');
  const local = document.getElementById('pv-proj-local');
  if (badge) badge.innerHTML = `<div class="pv-dot"></div>${esc(cfg.projeto_codigo)}`;
  if (nome)  nome.textContent  = cfg.projeto_nome;
  if (local) local.textContent = cfg.projeto_localizacao;
}

function pvFotos() {
  fotoPreviewIdx = Math.min(fotoPreviewIdx, Math.max(0, cfg.fotos.length - 1));
  const pvAntigo = document.getElementById('pv-foto');
  const dots     = document.getElementById('pv-dots');
  const contador = document.querySelector('.pv-foto-contador');
  const legenda  = document.querySelector('.pv-foto-legenda');
  const item     = cfg.fotos[fotoPreviewIdx];
  if (pvAntigo && item) {
    const ehVideo = item.tipo === 'video';
    const html = ehVideo
      ? `<video id="pv-foto" src="${esc(imgUrl(item.url))}" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`
      : `<div id="pv-foto" style="position:absolute;inset:0;background-size:cover;background-position:center;background-image:url('${esc(imgUrl(item.url))}')"></div>`;
    pvAntigo.outerHTML = html;
  }
  if (dots) dots.innerHTML = pvHtmlDots();
  if (contador) contador.textContent = cfg.fotos.length ? (fotoPreviewIdx + 1) + ' / ' + cfg.fotos.length : '';
  if (legenda)  legenda.textContent  = item?.legenda || 'APAs · Rio Branco, Acre';
  iniciarTimerFotos();
}

function pvLogos() {
  const topo = document.getElementById('pv-logos-topo');
  const proj = document.getElementById('pv-logo-projeto-box');
  const parc = document.getElementById('pv-parceiros-logos');
  if (topo) topo.innerHTML = pvHtmlLogosTopo();
  if (proj) proj.innerHTML = pvHtmlLogoProjeto();
  if (parc) parc.innerHTML = pvHtmlParceiros();
}

function iniciarTimerFotos() {
  clearTimeout(fotoTimer);
  clearInterval(fotoTimer);
  if (cfg.fotos.length <= 1) return;
  const avancar = () => { fotoPreviewIdx = (fotoPreviewIdx + 1) % cfg.fotos.length; pvFotos(); };
  const item = cfg.fotos[fotoPreviewIdx];
  if (item?.tipo === 'video') {
    const video = document.getElementById('pv-foto');
    if (video) video.addEventListener('ended', avancar, { once: true });
  } else {
    fotoTimer = setTimeout(avancar, 3000);
  }
}

function ajustarPreview() {
  const outer = document.getElementById('preview-outer');
  const frame = document.getElementById('preview-frame');
  if (!outer || !frame) return;
  const availW = outer.clientWidth - 32;
  const scale  = Math.max(0.1, Math.min(availW / 1280, 1));
  frame.style.transform = `scale(${scale})`;
  frame.style.marginBottom = (720 * scale - 720) + 'px';
  frame.style.marginInline = ((1280 * scale - 1280) / 2) + 'px';
}

// ── Upload Storage ────────────────────────────────────────────
async function uploadArquivo(file, pasta) {
  const ext  = file.name.split('.').pop().toLowerCase();
  const nome = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { data, error } = await db.storage
    .from('plataforma-assets')
    .upload(`${pasta}/${nome}`, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  const { data: urlData } = db.storage.from('plataforma-assets').getPublicUrl(data.path);
  return urlData.publicUrl;
}

// ── Salvar ────────────────────────────────────────────────────
async function salvarConfig() {
  if (salvando) return;
  salvando = true;
  const btn = document.getElementById('btn-salvar');
  if (btn) btn.disabled = true;
  try {
    cfg.fotos           = cfg.fotos.map((f, i) => ({ ...f, ordem: i }));
    cfg.logos_topo      = cfg.logos_topo.map((l, i) => ({ ...l, ordem: i }));
    cfg.logos_parceiros = cfg.logos_parceiros.map((l, i) => ({ ...l, ordem: i }));

    const { error } = await db.from('configuracoes_sistema').upsert({
      projeto_id: cfg.projeto_id, projeto_nome: cfg.projeto_nome,
      projeto_codigo: cfg.projeto_codigo, projeto_localizacao: cfg.projeto_localizacao,
      cor_primaria: cfg.cor_primaria, logos_topo: cfg.logos_topo,
      logo_projeto: cfg.logo_projeto, logos_parceiros: cfg.logos_parceiros,
      fotos: cfg.fotos, atualizado_em: new Date().toISOString(),
      atualizado_por: appState.usuario?.id
    }, { onConflict: 'projeto_id' });

    if (error) throw error;
    marcarSujo(false);
    toast('Configurações salvas. A tela de entrada já mostra as mudanças.', 'success');
  } catch(e) {
    toast('Erro ao salvar: ' + e.message, 'error');
  } finally {
    salvando = false;
    if (btn) btn.disabled = false;
  }
}

// ── Drag and Drop ─────────────────────────────────────────────
function initDragDrop(containerId, onReorder) {
  const container = document.getElementById(containerId);
  if (!container) return;
  let dragSrc = null;

  container.addEventListener('dragstart', e => {
    const item = e.target.closest('[draggable]');
    if (!item) return;
    dragSrc = item;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  container.addEventListener('dragend', () => {
    container.querySelectorAll('.dragging,.drag-over').forEach(el => {
      el.classList.remove('dragging', 'drag-over');
    });
    dragSrc = null;
  });
  container.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('[draggable]');
    if (!item || item === dragSrc) return;
    container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    item.classList.add('drag-over');
  });
  container.addEventListener('dragleave', e => {
    const item = e.target.closest('[draggable]');
    if (item) item.classList.remove('drag-over');
  });
  container.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('[draggable]');
    if (!item || !dragSrc || item === dragSrc) return;
    item.classList.remove('drag-over');
    const all = [...container.querySelectorAll('[draggable]')];
    if (all.indexOf(dragSrc) < all.indexOf(item)) item.after(dragSrc);
    else item.before(dragSrc);
    onReorder();
  });
}

// ── Util ──────────────────────────────────────────────────────
function imgUrl(url) {
  if (!url) return '';
  return url.startsWith('http') ? url : '../' + url;
}
