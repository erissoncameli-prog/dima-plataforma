<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Configurações</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
.config-wrap{display:flex;height:100%;overflow:hidden;}
.config-editor{width:420px;flex-shrink:0;border-right:1px solid var(--borda);background:var(--branco);display:flex;flex-direction:column;overflow:hidden;}
.editor-header{padding:14px 20px;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px;}
.editor-header h2{font-size:14px;font-weight:600;color:var(--cinza-900);white-space:nowrap;}
.editor-body{flex:1;overflow-y:auto;}
.tab-nav{display:flex;border-bottom:1px solid var(--borda);padding:0 20px;flex-shrink:0;}
.tab-btn{padding:10px 14px;font-size:13px;font-weight:500;color:var(--cinza-500);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font-sans);transition:all .15s;}
.tab-btn.ativo{color:var(--verde-medio);border-bottom-color:var(--verde-medio);}
.tab-btn:hover:not(.ativo){color:var(--cinza-700);}
.tab-content{display:none;padding:20px;}
.tab-content.ativo{display:block;}
.upload-zone{border:2px dashed var(--borda);border-radius:var(--raio-lg);padding:16px;text-align:center;cursor:pointer;transition:all .15s;background:var(--cinza-50);}
.upload-zone:hover{border-color:var(--verde-claro);background:#F0FDF4;}
.sort-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:6px;cursor:default;transition:border-color .15s;}
.sort-item.dragging{opacity:.35;}
.sort-item.drag-over{border-color:var(--verde-claro);background:#F0FDF4;box-shadow:0 0 0 2px rgba(82,183,136,.2);}
.drag-handle{cursor:grab;color:var(--cinza-300);font-size:16px;flex-shrink:0;padding:2px 3px;border-radius:4px;line-height:1;transition:color .1s;}
.drag-handle:hover{color:var(--cinza-500);}
.sort-thumb{width:40px;height:30px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--cinza-100);}
.sort-thumb-logo{width:50px;height:32px;object-fit:contain;border-radius:4px;flex-shrink:0;background:var(--cinza-50);border:1px solid var(--borda);padding:3px;}
.sort-info{flex:1;min-width:0;}
.caption-input{font-size:11px;border:none;background:transparent;width:100%;color:var(--cinza-700);font-family:var(--font-sans);font-weight:500;padding:0;outline:none;border-bottom:1px dashed transparent;transition:border-color .15s;}
.caption-input:focus{border-bottom-color:var(--verde-claro);}
.alt-input{font-size:10px;border:none;background:transparent;width:100%;color:var(--cinza-400);font-family:var(--font-mono);padding:0;outline:none;border-bottom:1px dashed transparent;transition:border-color .15s;}
.alt-input:focus{border-bottom-color:var(--verde-claro);}
.sort-actions{display:flex;gap:4px;flex-shrink:0;}
.btn-icon-sm{width:26px;height:26px;border-radius:4px;border:1px solid var(--borda);background:var(--branco);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--cinza-500);transition:all .15s;font-family:var(--font-sans);}
.btn-icon-sm:hover{background:var(--cinza-50);color:var(--cinza-700);}
.btn-icon-sm.danger:hover{background:#FEF2F2;border-color:#FECACA;color:#DC2626;}
.size-select{font-size:11px;padding:2px 6px;border:1px solid var(--borda);border-radius:4px;background:var(--branco);color:var(--cinza-700);font-family:var(--font-sans);cursor:pointer;flex-shrink:0;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza-500);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-label span.line{flex:1;height:1px;background:var(--borda);}
.limit-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--cinza-100);color:var(--cinza-500);font-family:var(--font-mono);flex-shrink:0;}
.limit-badge.warn{background:#FEF3C7;color:#92400E;}
.btn-add-item{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px dashed var(--borda);border-radius:var(--raio);background:none;color:var(--cinza-400);font-size:12px;font-family:var(--font-sans);cursor:pointer;width:100%;justify-content:center;transition:all .15s;margin-top:4px;}
.btn-add-item:hover{border-color:var(--verde-claro);color:var(--verde-medio);background:#F0FDF4;}
.color-row{display:flex;align-items:center;gap:8px;}
.color-swatch{width:32px;height:32px;border-radius:6px;border:1px solid var(--borda);flex-shrink:0;}

/* ── Monitoramento Banco de Dados ── */
.mon-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.mon-plano-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;background:#DBEAFE;color:#1D4ED8;letter-spacing:.05em;}
.mon-ts{font-size:11px;color:var(--cinza-400);margin-left:auto;font-family:var(--font-mono);}
.mon-gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.mon-gauge-card{background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.mon-gauge-label{font-size:11px;font-weight:600;color:var(--cinza-700);text-align:center;}
.mon-gauge-sub{font-size:10px;color:var(--cinza-500);font-family:var(--font-mono);text-align:center;line-height:1.4;}
.mon-alert{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:var(--raio);margin-bottom:10px;font-size:12px;line-height:1.5;}
.mon-alert.aviso{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;}
.mon-alert.critico{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;}
.mon-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza-500);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--borda);}
.mon-bucket-item{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--cinza-50);}
.mon-bucket-row{display:flex;align-items:center;gap:6px;}
.mon-bucket-name{font-size:12px;font-weight:500;color:var(--cinza-700);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mon-bucket-meta{font-size:10px;color:var(--cinza-400);font-family:var(--font-mono);white-space:nowrap;flex-shrink:0;}
.mon-bar-track{height:5px;background:var(--cinza-100);border-radius:99px;overflow:hidden;}
.mon-bar-fill{height:100%;border-radius:99px;transition:width .4s ease;}
.mon-table-wrap{overflow:hidden;}
.mon-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.mon-tbl th{text-align:left;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.05em;padding:5px 6px;border-bottom:1px solid var(--borda);}
.mon-tbl td{padding:5px 6px;color:var(--cinza-700);border-bottom:1px solid var(--cinza-50);}
.mon-tbl td.mono{font-family:var(--font-mono);color:var(--cinza-500);}
.mon-tbl tr:last-child td{border-bottom:none;}
.mon-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 0;color:var(--cinza-400);font-size:13px;}
.mon-empty{text-align:center;padding:32px 0;color:var(--cinza-400);font-size:12px;}
.mon-erro{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:var(--raio);padding:12px;font-size:12px;margin-top:8px;}

/* Preview panel */
.config-preview-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#ECEEF1;}
.preview-header{padding:10px 20px;background:var(--branco);border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.preview-header-title{font-size:13px;font-weight:600;color:var(--cinza-700);}
.live-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;background:#DCFCE7;color:#166534;letter-spacing:.05em;}
#preview-outer{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;}
#preview-frame{width:1280px;height:720px;display:flex;overflow:hidden;border-radius:10px;box-shadow:0 16px 56px rgba(0,0,0,.3);transform-origin:top center;flex-shrink:0;}

/* Preview: esquerdo */
#pv-esq{flex:1;position:relative;overflow:hidden;}
#pv-foto{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .8s;}
#pv-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,45,22,.88) 0%,rgba(15,45,22,.52) 30%,rgba(15,45,22,.52) 70%,rgba(8,28,14,.92) 100%);}
#pv-conteudo{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:22px 28px;}
#pv-logos-topo{display:flex;align-items:center;gap:12px;width:fit-content;}
#pv-logo-projeto-wrap{position:absolute;top:12px;right:12px;z-index:5;}
#pv-logo-projeto-box{display:flex;align-items:center;justify-content:center;}
#pv-parceiros-wrap{margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.15);}
.pv-parceiros-label-left{font-size:8px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;display:block;}
#pv-parceiros-logos{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;}
.pv-foto-contador{position:absolute;bottom:12px;left:14px;z-index:3;font-size:10px;color:rgba(255,255,255,.35);font-family:monospace;}
.pv-foto-legenda{position:absolute;bottom:12px;right:14px;z-index:3;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.04em;}
#pv-proj-info{background:rgba(0,0,0,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 16px;}
#pv-proj-badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#F4D35E;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.pv-dot{width:5px;height:5px;border-radius:50%;background:#F4D35E;flex-shrink:0;}
#pv-proj-nome{font-size:11px;font-weight:600;color:#fff;margin-bottom:3px;line-height:1.4;}
#pv-proj-local{font-size:9px;color:rgba(255,255,255,.55);margin-bottom:8px;}
#pv-dots{display:flex;gap:4px;align-items:center;}

/* Preview: direito */
#pv-dir{width:440px;flex-shrink:0;background:#fff;padding:36px 32px;display:flex;align-items:center;justify-content:center;}
#pv-login-box{width:100%;max-width:360px;}
.pv-lang-row{display:flex;gap:4px;margin-bottom:14px;}
.pv-lang-btn{flex:1;padding:4px;border-radius:5px;border:1px solid #E5E7EB;font-size:9px;text-align:center;color:#6B7280;}
.pv-lang-btn.ativo{background:#2D6A4F;color:#fff;border-color:#2D6A4F;}
.pv-titulo{font-size:16px;font-weight:600;color:#111827;margin-bottom:4px;}
.pv-sub{font-size:10px;color:#6B7280;margin-bottom:14px;}
.pv-label{font-size:9px;font-weight:600;color:#374151;margin-bottom:3px;}
.pv-input{height:30px;border:1px solid #E5E7EB;border-radius:6px;margin-bottom:9px;width:100%;}
.pv-btn{height:34px;border-radius:6px;width:100%;margin-bottom:14px;border:none;}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'DM Sans',sans-serif;color:#6B7280">
    <div style="text-align:center">
      <div style="width:32px;height:32px;border:3px solid #E5E7EB;border-top-color:#2D6A4F;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      Carregando configurações...
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script>
// ── Estado ───────────────────────────────────────────────────
let cfg = {
  projeto_id: 'default', projeto_nome: '', projeto_codigo: '',
  projeto_localizacao: '', cor_primaria: '#1F4E2C',
  logos_topo: [], logo_projeto: { url: '', alt: '' },
  logos_parceiros: [], fotos: []
};
let tabAtual = 'identidade';
let salvando = false;
let fotoPreviewIdx = 0;
let fotoTimer;

// ── Monitoramento — planos Supabase ───────────────────────────
// Para migrar para Pro: altere planoAtual para 'pro'
const PLANOS = {
  free: { nome: 'Free',  db_bytes: 500  * 1024 * 1024,         storage_bytes: 1   * 1024 * 1024 * 1024 },
  pro:  { nome: 'Pro',   db_bytes: 8    * 1024 * 1024 * 1024,   storage_bytes: 100 * 1024 * 1024 * 1024 },
  team: { nome: 'Team',  db_bytes: 8    * 1024 * 1024 * 1024,   storage_bytes: 100 * 1024 * 1024 * 1024 },
};
let planoAtual = 'free';
let monitoramento = null;
let monCarregando = false;

// ── Init ─────────────────────────────────────────────────────
(async () => {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }
  if (appState.perfil !== 'super_admin') { window.location.href = 'dashboard.html'; return; }

  document.getElementById('app').innerHTML =
    gerarLayout('Configurações', 'configuracoes') + '</div></div></div>';

  const pb = document.getElementById('page-body');
  pb.style.padding = '0';
  pb.style.overflow = 'hidden';

  await carregarConfig();
  renderPagina();
  window.addEventListener('resize', ajustarPreview);
  iniciarSino();
})();

// ── Carregar config ───────────────────────────────────────────
async function carregarConfig() {
  const { data } = await db.from('configuracoes_sistema')
    .select('*').eq('projeto_id', 'default').single();
  if (data) {
    cfg = {
      projeto_id: data.projeto_id || 'default',
      projeto_nome: data.projeto_nome || '',
      projeto_codigo: data.projeto_codigo || '',
      projeto_localizacao: data.projeto_localizacao || '',
      cor_primaria: data.cor_primaria || '#1F4E2C',
      logos_topo: data.logos_topo || [],
      logo_projeto: data.logo_projeto || { url: '', alt: '' },
      logos_parceiros: data.logos_parceiros || [],
      fotos: data.fotos || []
    };
  }
}

// ── Render página ─────────────────────────────────────────────
function renderPagina() {
  document.getElementById('page-body').innerHTML = `
  <div class="config-wrap fade-in">
    <div class="config-editor">
      <div class="editor-header">
        <h2>⚙ Configurações</h2>
        <button class="btn btn-primary btn-sm" id="btn-salvar" onclick="salvarConfig()">Salvar alterações</button>
      </div>
      <div class="tab-nav">
        <button class="tab-btn ativo" onclick="setTab('identidade',this)">Identidade</button>
        <button class="tab-btn" onclick="setTab('fotos',this)">Fotos</button>
        <button class="tab-btn" onclick="setTab('logos',this)">Logos</button>
        <button class="tab-btn" onclick="setTab('banco',this)">Banco de Dados</button>
      </div>
      <div class="editor-body">
        ${renderTabIdentidade()}
        ${renderTabFotos()}
        ${renderTabLogos()}
        ${renderTabBancoDados()}
      </div>
    </div>
    <div class="config-preview-panel">
      <div class="preview-header">
        <span class="preview-header-title">Pré-visualização</span>
        <span class="live-badge">● AO VIVO</span>
        <span style="font-size:11px;color:var(--cinza-400);margin-left:auto">Mudanças refletem aqui antes de salvar</span>
      </div>
      <div id="preview-outer">${renderPreviewHTML()}</div>
    </div>
  </div>`;

  initDragDrop('lista-fotos', sincronizarFotosDOM);
  initDragDrop('lista-logos-topo', sincronizarTopoDOM);
  initDragDrop('lista-parceiros', sincronizarParceirosDOM);
  iniciarTimerFotos();
  ajustarPreview();
}

// ── Tab: Identidade ───────────────────────────────────────────
function renderTabIdentidade() {
  return `
  <div id="tab-identidade" class="tab-content ativo">
    <div class="form-group">
      <label class="form-label">Nome do Projeto</label>
      <input class="form-control" value="${esc(cfg.projeto_nome)}"
        oninput="cfg.projeto_nome=this.value;pvTextos()"
        placeholder="Nome completo do projeto">
    </div>
    <div class="form-group">
      <label class="form-label">Código do Projeto</label>
      <input class="form-control" value="${esc(cfg.projeto_codigo)}"
        oninput="cfg.projeto_codigo=this.value;pvTextos()"
        placeholder="Ex: 218BRA2001 · UNESCO/MPTF">
    </div>
    <div class="form-group">
      <label class="form-label">Localização / Subtítulo</label>
      <input class="form-control" value="${esc(cfg.projeto_localizacao)}"
        oninput="cfg.projeto_localizacao=this.value;pvTextos()"
        placeholder="Ex: Rio Branco, Acre — Fundo Multipartes">
    </div>
    <div class="form-group">
      <label class="form-label">Cor Principal</label>
      <div class="color-row">
        <div class="color-swatch" id="cor-swatch" style="background:${cfg.cor_primaria}"></div>
        <input class="form-control" id="inp-cor-hex" value="${cfg.cor_primaria}"
          maxlength="7" placeholder="#1F4E2C"
          oninput="onHexInput(this.value)" style="font-family:var(--font-mono);font-size:13px">
        <input type="color" value="${cfg.cor_primaria}"
          onchange="aplicarCor(this.value)"
          style="width:36px;height:36px;padding:2px;border:1px solid var(--borda);border-radius:6px;cursor:pointer;flex-shrink:0">
      </div>
    </div>
  </div>`;
}

function onHexInput(v) {
  if (/^#[0-9A-Fa-f]{6}$/.test(v)) aplicarCor(v);
}
function aplicarCor(v) {
  cfg.cor_primaria = v;
  const s = document.getElementById('cor-swatch');
  const h = document.getElementById('inp-cor-hex');
  if (s) s.style.background = v;
  if (h) h.value = v;
  const btn = document.querySelector('#pv-dir .pv-btn');
  if (btn) btn.style.background = v;
}

// ── Tab: Fotos ────────────────────────────────────────────────
function renderTabFotos() {
  const n = cfg.fotos.length;
  return `
  <div id="tab-fotos" class="tab-content">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px">
      <p style="font-size:12px;color:var(--cinza-500);line-height:1.6">
        Slideshow da tela de login.<br>
        <strong>JPG/JPEG</strong> · máx <strong>5 MB</strong> · mín <strong>1280×720 px</strong> · orientação paisagem
      </p>
      <span class="limit-badge ${n>=15?'warn':''}">${n}/15</span>
    </div>
    <div id="lista-fotos">
      ${cfg.fotos.map((f, i) => renderFotoItem(f, i)).join('')}
    </div>
    ${n < 15 ? `
    <button class="btn-add-item" onclick="document.getElementById('inp-foto').click()">
      <span style="font-size:14px">+</span> Adicionar foto
    </button>
    <input type="file" id="inp-foto" accept=".jpg,.jpeg" style="display:none"
      onchange="handleUploadFoto(this.files)">
    ` : `<p style="font-size:11px;color:var(--cinza-400);text-align:center;margin-top:8px">Limite de 15 fotos atingido</p>`}
  </div>`;
}

function renderFotoItem(f, i) {
  const shortUrl = f.url.length > 36 ? '...' + f.url.slice(-33) : f.url;
  return `
  <div class="sort-item" draggable="true" data-idx="${i}">
    <span class="drag-handle" title="Arrastar para reordenar">⠿</span>
    <img class="sort-thumb" src="${imgUrl(f.url)}" alt="" onerror="this.style.opacity='.2'">
    <div class="sort-info">
      <input class="caption-input" value="${esc(f.legenda)}" placeholder="Legenda"
        oninput="cfg.fotos[${i}].legenda=this.value" onclick="event.stopPropagation()">
      <div class="alt-input" style="cursor:default;user-select:all">${shortUrl}</div>
    </div>
    <div class="sort-actions">
      <button class="btn-icon-sm danger" onclick="removerFoto(${i})" title="Remover">✕</button>
    </div>
  </div>`;
}

async function handleUploadFoto(files) {
  if (!files.length) return;
  const file = files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['jpg','jpeg'].includes(ext)) { toast('Apenas JPG/JPEG para fotos.', 'error'); return; }
  if (file.size > 5 * 1024 * 1024) { toast('Tamanho máximo: 5 MB.', 'error'); return; }
  if (cfg.fotos.length >= 15) { toast('Limite de 15 fotos atingido.', 'error'); return; }
  toast('Enviando foto...', 'info');
  try {
    const url = await uploadArquivo(file, 'fotos');
    cfg.fotos.push({ url, legenda: '', ordem: cfg.fotos.length });
    reRenderTab('fotos');
    initDragDrop('lista-fotos', sincronizarFotosDOM);
    pvFotos();
    toast('Foto adicionada!', 'success');
  } catch(e) { toast('Erro ao enviar: ' + e.message, 'error'); }
}

function removerFoto(i) {
  cfg.fotos.splice(i, 1);
  cfg.fotos.forEach((f, idx) => f.ordem = idx);
  reRenderTab('fotos');
  initDragDrop('lista-fotos', sincronizarFotosDOM);
  pvFotos();
}

function sincronizarFotosDOM() {

async function handleUploadLogo(files, zona) {
  if (!files.length) return;
  const file = files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['png','svg'].includes(ext)) { toast('Apenas PNG ou SVG para logos.', 'error'); return; }
  const maxBytes = zona === 'parceiro' ? 1024*1024 : 512*1024;
  const maxLabel = zona === 'parceiro' ? '1 MB' : '500 KB';
  if (file.size > maxBytes) { toast(`Tamanho máximo: ${maxLabel}.`, 'error'); return; }
  toast('Enviando logo...', 'info');
  try {
    const url = await uploadArquivo(file, 'logos');
    const item = { url, alt: file.name.replace(/\.[^.]+$/, ''), ordem: 0 };
    if (zona === 'topo') cfg.logos_topo.push({ ...item, ordem: cfg.logos_topo.length });
    else if (zona === 'projeto') cfg.logo_projeto = item;
    else cfg.logos_parceiros.push({ ...item, tamanho: 'medio', ordem: cfg.logos_parceiros.length });
    reRenderTab('logos');
    initDragDrop('lista-logos-topo', sincronizarTopoDOM);
    initDragDrop('lista-parceiros', sincronizarParceirosDOM);
    pvLogos();
    toast('Logo adicionada!', 'success');
  } catch(e) { toast('Erro ao enviar: ' + e.message, 'error'); }
}

async function handleTrocarLogo(files, tipo, i) {
  if (!files.length) return;
  const file = files[0];
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['png','svg'].includes(ext)) { toast('Apenas PNG ou SVG.', 'error'); return; }
  const maxBytes = tipo === 'parceiro' ? 1024*1024 : 512*1024;
  if (file.size > maxBytes) { toast('Arquivo muito grande.', 'error'); return; }
  toast('Trocando...', 'info');
  try {
    const url = await uploadArquivo(file, 'logos');
    if (tipo === 'topo') cfg.logos_topo[i].url = url;
    else cfg.logos_parceiros[i].url = url;
    reRenderTab('logos');
    initDragDrop('lista-logos-topo', sincronizarTopoDOM);
    initDragDrop('lista-parceiros', sincronizarParceirosDOM);
    pvLogos();
    toast('Logo atualizada!', 'success');
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

// ── Upload Storage ────────────────────────────────────────────
async function uploadArquivo(file, pasta) {
  const ext  = file.name.split('.').pop().toLowerCase();
  const nome = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { data, error } = await db.storage
    .from('plataforma-assets')
    .upload(`${pasta}/${nome}`, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  const { data: urlData } = db.storage.from('plataforma-assets').getPublicUrl(data.path);
  return urlData.publicUrl;
}

// ── Drag and Drop ─────────────────────────────────────────────
function initDragDrop(containerId, onReorder) {
  const container = document.getElementById(containerId);
  if (!container) return;
  let dragSrc = null;

  container.addEventListener('dragstart', e => {
    const item = e.target.closest('[draggable]');
    if (!item) return;
    dragSrc = item;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  container.addEventListener('dragend', () => {
    container.querySelectorAll('.dragging,.drag-over').forEach(el => {
      el.classList.remove('dragging', 'drag-over');
    });
    dragSrc = null;
  });
  container.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('[draggable]');
    if (!item || item === dragSrc) return;
    container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    item.classList.add('drag-over');
  });
  container.addEventListener('dragleave', e => {
    const item = e.target.closest('[draggable]');
    if (item) item.classList.remove('drag-over');
  });
  container.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('[draggable]');
    if (!item || !dragSrc || item === dragSrc) return;
    item.classList.remove('drag-over');
    const all = [...container.querySelectorAll('[draggable]')];
    if (all.indexOf(dragSrc) < all.indexOf(item)) item.after(dragSrc);
    else item.before(dragSrc);
    onReorder();
  });
}

    <div class="mon-gauges">

    </div>

    ${stPct >= 80 ? monAlerta(stPct, 'storage', plano.nome) : ''}

function monGaugeCard(label, usado, total, pct) {
  const cor = pct < 60 ? '#22c55e' : pct < 80 ? '#f59e0b' : '#ef4444';
  const r = 36, cx = 44, cy = 44;
  const circ = 2 * Math.PI * r;
  const arc  = circ * 0.75;
  const fill = arc * (pct / 100);
  const svg = `<svg width="88" height="88" viewBox="0 0 88 88">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="8"
      stroke-dasharray="${arc.toFixed(1)} ${(circ - arc).toFixed(1)}"
      stroke-linecap="round" transform="rotate(135 ${cx} ${cy})"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cor}" stroke-width="8"
      stroke-dasharray="${fill.toFixed(1)} ${(circ - fill).toFixed(1)}"
      stroke-linecap="round" transform="rotate(135 ${cx} ${cy})"/>
    <text x="${cx}" y="41" text-anchor="middle" font-size="15" font-weight="600" fill="#111827"
      font-family="DM Sans,sans-serif">${pct}%</text>
    <text x="${cx}" y="54" text-anchor="middle" font-size="9" fill="#6B7280"
      font-family="DM Sans,sans-serif">utilizado</text>
  </svg>`;
  return `<div class="mon-gauge-card">
    ${svg}
    <div class="mon-gauge-label">${label}</div>
    <div class="mon-gauge-sub">${monFmtBytes(usado)} / ${monFmtBytes(total)}</div>
  </div>`;
}

function monAlerta(pct, recurso, plano) {
  const critico = pct >= 95;
  const cls = critico ? 'critico' : 'aviso';
  const icon = critico ? '🔴' : '⚠️';
  const msg = critico
    ? `${icon} <strong>${pct}% do ${recurso} utilizado.</strong> Limite crítico atingido — considere migrar para o plano Pro.`
    : `${icon} <strong>${pct}% do ${recurso} utilizado.</strong> Você está se aproximando do limite do plano ${plano}.`;
  return `<div class="mon-alert ${cls}">${msg}</div>`;
}

function monStorageBuckets(buckets, totalStorage) {
  if (!buckets.length) return `<div class="mon-empty" style="padding:16px 0">Nenhum bucket encontrado.</div>`;
  const itens = buckets.map(b => {
    const pct = totalStorage > 0 ? Math.round(b.tamanho_bytes / totalStorage * 100) : 0;
    const cor = '#60a5fa';
    return `<div class="mon-bucket-item">
      <div class="mon-bucket-row">
        <span style="font-size:13px;flex-shrink:0">📁</span>
        <span class="mon-bucket-name" title="${esc(b.bucket_id)}">${esc(b.bucket_id)}</span>
        <span class="mon-bucket-meta">${monFmtBytes(b.tamanho_bytes)} · ${b.total_arquivos} arq.</span>
      </div>
      <div class="mon-bar-track">
        <div class="mon-bar-fill" style="width:${pct}%;background:${cor}"></div>
      </div>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:16px">
    <div class="mon-section-title">Storage por Bucket</div>
    ${itens}
  </div>`;
}

function monTabelasStats(tabelas, dbTotal) {
  if (!tabelas.length) return '';
  const top = tabelas.slice(0, 12);
  const linhas = top.map(tb => {
    const pct = dbTotal > 0 ? (tb.tamanho_bytes / dbTotal * 100).toFixed(1) : '0.0';
    return `<tr>
      <td>${esc(tb.tabela)}</td>
      <td class="mono">${Number(tb.linhas).toLocaleString('pt-BR')}</td>
      <td class="mono">${monFmtBytes(tb.tamanho_bytes)}</td>
      <td class="mono">${pct}%</td>
    </tr>`;
  }).join('');
  return `<div class="mon-table-wrap">
    <div class="mon-section-title">Tabelas</div>
    <table class="mon-tbl">
      <thead><tr><th>Tabela</th><th>Linhas</th><th>Tamanho</th><th>%</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>
  </div>`;
}

function monFmtBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0, v = bytes;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

async function carregarMonitoramento() {
  monCarregando = true;
  reRenderTab('banco');
  try {
    const { data, error } = await db.rpc('get_monitoramento_banco');
    if (error) throw error;
    monitoramento = data;
  } catch(e) {
    monitoramento = { erro: e.message || 'Erro desconhecido' };
  } finally {
    monCarregando = false;
    reRenderTab('banco');
  }
}

async function recarregarMonitoramento() {
  monitoramento = null;
  await carregarMonitoramento();
}

// ── Util ──────────────────────────────────────────────────────
function imgUrl(url) {
  if (!url) return '';
  return url.startsWith('http') ? url : '../' + url;
}
