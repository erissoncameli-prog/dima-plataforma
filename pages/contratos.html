<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Contratos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<link href="../css/sidebar.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;user-select:none;transition:box-shadow .15s,border-color .15s,transform .08s;}
.stat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px);}
.stat-card:active{transform:scale(.95);box-shadow:0 1px 2px rgba(0,0,0,.12) inset;}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;z-index:3;}
.sc-g::after{background:var(--verde-claro)}.sc-b::after{background:var(--azul-medio)}.sc-a::after{background:var(--aviso)}.sc-r::after{background:var(--erro)}
.stat-card.ativo{border-color:transparent;box-shadow:0 0 0 2px currentColor inset;}
.sc-g.ativo{color:var(--verde-claro)}
.sc-b.ativo{color:var(--azul-medio)}
.sc-a.ativo{color:var(--aviso)}
.sc-r.ativo{color:var(--erro)}
.stat-lbl{font-size:10px;color:var(--cinza-700);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:600;}
.stat-val{font-size:20px;font-weight:700;color:var(--cinza-900);}
.stat-sub{font-size:11px;color:var(--cinza-500);margin-top:3px;}
.stat-card>*{position:relative;z-index:2;}
.wc-inner{position:absolute;left:0;right:0;bottom:0;height:0%;transition:height 1.1s cubic-bezier(.4,0,.2,1);z-index:0;overflow:visible;opacity:.5;}
.wc-wavewrap{position:absolute;left:0;right:0;bottom:100%;height:14px;overflow:hidden;}
.wc-wave-svg{position:absolute;top:0;left:0;width:200%;height:100%;animation:wcwave 4.5s linear infinite;}
.wc-wave-svg.w2{animation-duration:6.5s;animation-direction:reverse;opacity:.6;}
@keyframes wcwave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tbl-wrap{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{padding:9px 10px;font-size:10px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--borda);background:var(--cinza-50);text-align:left;white-space:nowrap;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--borda);color:var(--cinza-700);vertical-align:middle;}
.tbl tbody tr.main-row:hover td{background:var(--cinza-50);}
.tbl tbody tr.main-row.aberto td{background:#F0FDF4;}
.tbl tbody tr.detail-row td{padding:0;border-bottom:1px solid var(--borda);}
.xbtn{width:22px;height:22px;border-radius:4px;border:1px solid var(--borda);background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--cinza-400,#9CA3AF);transition:all .15s;}
.xbtn:hover{background:var(--verde-bg);border-color:var(--verde-medio);color:var(--verde-medio);}
.xbtn.aberto{background:var(--verde-bg);border-color:var(--verde-medio);color:var(--verde-medio);}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;}
.b-vigente{background:#ECFDF5;color:#065F46}.b-encerrado{background:#F3F4F6;color:#374151}.b-suspenso{background:#FEF2F2;color:#991B1B}
.mono{font-family:var(--font-mono);font-size:11px;}
.pdf-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.detail-inner{padding:14px 16px;background:var(--cinza-50);}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.detail-item{display:flex;flex-direction:column;gap:2px;}
.detail-lbl{font-size:10px;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.04em;}
.detail-val{font-size:12px;color:var(--cinza-900);font-weight:500;}
.pdf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.pdf-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio);padding:10px 12px;display:flex;align-items:center;gap:10px;}
.pdf-card-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.pdf-card-info{flex:1;min-width:0;}
.pdf-card-nome{font-size:12px;font-weight:500;color:var(--cinza-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pdf-card-meta{font-size:10px;color:var(--cinza-500);margin-top:1px;}
.pdf-card-btns{display:flex;gap:4px;flex-shrink:0;}
.btn-xs{height:26px;padding:0 8px;font-size:10px;border-radius:4px;border:1px solid var(--borda);background:none;cursor:pointer;color:var(--cinza-600,#4B5563);white-space:nowrap;font-family:var(--font-sans);text-decoration:none;display:inline-flex;align-items:center;}
.btn-xs:hover{background:var(--cinza-50);}
.btn-xs-prim{background:var(--verde-bg);color:var(--verde-escuro);border-color:#9FE1CB;}
.btn-xs-prim:hover{background:#9FE1CB;}
.saldo-bar{height:4px;background:var(--cinza-100);border-radius:2px;overflow:hidden;margin-top:3px;}
.saldo-fill{height:100%;border-radius:2px;}
.modal-lg{max-width:700px;}
.upload-zone{border:1.5px dashed var(--borda-forte);border-radius:var(--raio);padding:18px;text-align:center;cursor:pointer;transition:all .15s;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--verde-medio);background:var(--verde-bg);}
.upload-zone input{display:none;}
.traduz-info{background:var(--azul-bg);border:1px solid #B5D4F4;border-radius:var(--raio);padding:10px 12px;font-size:11px;color:var(--azul-medio);display:flex;align-items:flex-start;gap:8px;margin-top:8px;line-height:1.5;}
.sec-label{font-size:11px;font-weight:600;color:var(--cinza-700);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--borda);}
.prog-bar{height:3px;background:var(--cinza-100);border-radius:2px;overflow:hidden;margin-top:6px;display:none;}
.prog-fill{height:100%;background:var(--verde-medio);border-radius:2px;transition:width .3s;}
.det-tabs{display:flex;gap:0;border-bottom:1px solid var(--borda);margin-bottom:12px;}
.det-tab{padding:6px 14px;font-size:11px;font-weight:600;color:var(--cinza-500);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font-sans);transition:all .15s;}
.det-tab.ativo{color:var(--verde-medio);border-bottom-color:var(--verde-medio);}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:4px;}
.prod-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio);padding:10px 12px;}
.prod-card.pend{border-left:3px solid var(--aviso);}
.prod-card.pago{border-left:3px solid var(--sucesso);}
.prod-card.venc{border-left:3px solid var(--erro);}
.prod-card.cancel{border-left:3px solid var(--cinza-300);opacity:.65;}
.prod-num{font-size:9px;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.prod-desc{font-size:12px;font-weight:500;color:var(--cinza-900);margin-bottom:5px;line-height:1.35;}
.prod-valor{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--verde-medio);}
.prod-venc{font-size:10px;color:var(--cinza-500);margin-top:2px;}
.prod-sit{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;display:inline-block;margin-top:5px;}
.ps-pendente{background:#FFFBEB;color:#92400E}.ps-em_analise{background:#EFF6FF;color:#1E40AF}
.ps-aprovado{background:#F0FDF4;color:#166534;border:1px solid #86EFAC}
.ps-pago{background:#ECFDF5;color:#065F46}.ps-cancelado{background:#F3F4F6;color:#6B7280}
/* ── Histórico de Entregas ── */
.ent-bloco{margin-bottom:12px;border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden;}
.ent-prod-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--cinza-50);border-bottom:1px solid var(--borda);}
.ent-prod-title{font-size:12px;font-weight:600;color:var(--cinza-900);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ent-item{background:var(--branco);padding:10px 12px;border-top:1px solid var(--borda);}
.ent-item:first-child{border-top:none;}
.ent-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.ent-num{font-size:10px;font-weight:700;color:var(--cinza-400);font-family:var(--font-mono);}
.ent-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;}
.ent-quem{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
.ent-quem-item{display:flex;align-items:baseline;gap:4px;font-size:11px;color:var(--cinza-700);}
.ent-quem-lbl{font-size:9px;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.04em;}
.ent-quem-data{font-size:10px;color:var(--cinza-400);}
.ent-links{display:flex;flex-wrap:wrap;gap:4px;}
.ent-link{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--borda);background:var(--branco);color:var(--cinza-700);text-decoration:none;white-space:nowrap;}
.ent-link:hover{background:var(--cinza-50);}
.ent-link-desp{border-color:#BFDBFE;background:#EFF6FF;color:#1E40AF;}
.ent-link-nt{border-color:#BBF7D0;background:#F0FDF4;color:#166534;}
.ent-vazia{padding:10px 12px;font-size:11px;color:var(--cinza-400);font-style:italic;}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-overlay" id="modal-contrato">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="m-titulo">Contrato</div>
        <div style="font-size:11px;color:var(--cinza-500);margin-top:2px" id="m-sub"></div>
      </div>
      <button class="modal-close" onclick="fecharModal()">&#x2715;</button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-footer" id="m-footer"></div>
  </div>
</div>
<!-- MODAL PRODUTOS DO CONTRATO -->
<div class="modal-overlay" id="modal-produtos">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="mp-titulo">Produtos / Entregas</div>
        <div style="font-size:11px;color:var(--cinza-500);margin-top:2px" id="mp-sub"></div>
      </div>
      <button class="modal-close" onclick="fecharModalProd()"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>#x2715;</button>
    </div>
    <div class="modal-body" id="mp-body"></div>
    <div class="modal-footer" id="mp-footer"></div>
  </div>
</div>
<!-- MODAL ENCERRAMENTO COM SALDO NÃO EXECUTADO -->
<div class="modal-overlay" id="modal-encerramento">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <div>
        <div class="modal-title">&#x26A0; Encerrar contrato com saldo não executado</div>
        <div style="font-size:11px;color:var(--cinza-500);margin-top:2px" id="me-sub"></div>
      </div>
      <button class="modal-close" onclick="fecharModalEncerramento()">&#x2715;</button>
    </div>
    <div class="modal-body" id="me-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModalEncerramento()">Cancelar</button>
      <button class="btn" style="background:#DC2626;color:#fff" onclick="confirmarEncerramento()">&#x26A0; Confirmar encerramento e liberar saldo</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/ajuda.js"></script>
<script>
(function(){
var todosContratos=[],atividades=[],fornecedores=[],tdrs=[];
var contratoEditando=null,filePDF=null;
var expandidos={};
var SL={vigente:'Vigente',encerrado:'Encerrado',suspenso:'Suspenso'};
var TIPOS=['Servico','Consultoria','Consumo','Diaria','Passagens','Obra'];

(async function(){
  var u=await carregarUsuario();
  if(!u){window.location.href='../index.html';return;}
  document.getElementById('app').innerHTML=gerarLayout('Contratos','contratos')+
  '<div class="fade-in">'+
  '<div class="stat-row" id="stats"></div>'+
  '<div class="filter-bar" style="margin-bottom:14px">'+
  '<input class="form-control" type="text" id="busca" style="width:240px" placeholder="Buscar numero, objeto ou fornecedor..." oninput="filtrar()">'+
  '<select class="form-control" id="fil-status" onchange="filtrar()" style="width:140px">'+
  '<option value="">Todos os status</option>'+
  '<option value="vigente">Vigente</option>'+
  '<option value="encerrado">Encerrado</option>'+
  '<option value="suspenso">Suspenso</option>'+
  '</select>'+
  '<select class="form-control" id="fil-pdf" onchange="filtrar()" style="width:150px">'+
  '<option value="">Todos</option>'+
  '<option value="com">Com PDF</option>'+
  '<option value="sem">Sem PDF</option>'+
  '</select>'+
  '<select class="form-control" id="fil-ativ" onchange="filtrar()" style="width:180px">'+
  '<option value="">Todas as atividades</option>'+
  '</select>'+
  '<select class="form-control" id="fil-forn" onchange="filtrar()" style="width:170px">'+
  '<option value="">Todos os fornecedores</option>'+
  '</select>'+
  '<span id="cont" style="font-size:12px;color:var(--cinza-500);margin-left:auto"></span>'+
  (PODE.verFinanceiro()?'<button class="btn btn-primary btn-sm" onclick="abrirNovo()">+ Novo contrato</button>':'')+
  '</div>'+
  '<div class="tbl-wrap">'+
  '<table class="tbl">'+
  '<thead><tr>'+
  '<th style="width:32px"></th>'+
  '<th>Numero</th><th>Objeto</th><th>Fornecedor</th>'+
  '<th>Valor total</th><th>Vigencia</th><th>Status</th>'+
  '<th style="width:50px" title="PDF: verde=presente, vermelho=ausente, azul=traducao PT">PDF</th>'+
  '<th style="width:60px">Acoes</th>'+
  '</tr></thead>'+
  '<tbody id="tbody"></tbody>'+
  '</table>'+
  '<div id="tbl-empty"></div>'+
  '</div></div>'+fecharLayout();
  await carregar();
})();

async function carregar(){
  var rs=await Promise.all([
    db.from('contratos').select('*,fornecedores(id,nome,tipo),atividades(id,codigo,nome_pt),tdrs(id,numero)').order('criado_em',{ascending:false}),
    db.from('atividades').select('id,codigo,nome_pt').order('codigo'),
    db.from('fornecedores').select('id,nome,tipo').order('nome'),
    db.from('tdrs').select('id,numero,objeto_pt,atividade_id').neq('status','cancelado').order('numero')
  ]);
  todosContratos=rs[0].data||[];
  atividades=rs[1].data||[];
  fornecedores=rs[2].data||[];
  tdrs=rs[3].data||[];

  // Preencher filtro de atividades — só as que têm ao menos um contrato
  var filAtiv=document.getElementById('fil-ativ');
  if(filAtiv){
    var atvsComContrato=new Map();
    todosContratos.forEach(function(c){
      if(c.atividade_id&&c.atividades&&!atvsComContrato.has(c.atividade_id)){
        atvsComContrato.set(c.atividade_id,c.atividades);
      }
    });
    // Ordenar por código
    Array.from(atvsComContrato.values())
      .sort(function(a,b){return (a.codigo||'').localeCompare(b.codigo||'');})
      .forEach(function(a){
        var o=document.createElement('option');
        o.value=a.id;
        o.textContent=(a.codigo||'')+' — '+(a.nome_pt||'').substring(0,38);
        filAtiv.appendChild(o);
      });
  }

  // Preencher filtro de fornecedores — só os que têm ao menos um contrato
  var filForn=document.getElementById('fil-forn');
  if(filForn){
    var fornsComContrato=new Map();
    todosContratos.forEach(function(c){
      if(c.fornecedor_id&&c.fornecedores&&!fornsComContrato.has(c.fornecedor_id)){
        fornsComContrato.set(c.fornecedor_id,c.fornecedores.nome||'—');
      }
    });
    Array.from(fornsComContrato.entries())
      .sort(function(a,b){return a[1].localeCompare(b[1]);})
      .forEach(function(entry){
        var o=document.createElement('option');
        o.value=entry[0];
        o.textContent=entry[1].substring(0,45);
        filForn.appendChild(o);
      });
  }

  renderStats();filtrar();
}

let filtroCardCont='';
function clicarCardCont(card){
  filtroCardCont=(filtroCardCont===card)?'':card;
  renderStats();filtrar();
}

function waterHTML(color,pct){
  return '<div class="wc-inner" data-alvo="'+pct+'" style="background:'+color+'">'
    +'<div class="wc-wavewrap">'
    +'<svg class="wc-wave-svg" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 12 Q25 4 50 12 T100 12 T150 12 T200 12 V20 H0 Z" style="fill:'+color+'"></path></svg>'
    +'<svg class="wc-wave-svg w2" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q25 18 50 10 T100 10 T150 10 T200 10 V20 H0 Z" style="fill:'+color+'"></path></svg>'
    +'</div></div>';
}
function animarAgua(){
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    document.querySelectorAll('.wc-inner[data-alvo]').forEach(function(el){
      el.style.height=el.dataset.alvo+'%';
    });
  });});
}

function renderStats(){
  var vig=todosContratos.filter(function(c){return c.status==='vigente';});
  var totC=vig.reduce(function(s,c){return s+parseFloat(c.valor_total_brl||0);},0);
  var totU=vig.reduce(function(s,c){return s+parseFloat(c.valor_utilizado_brl||0);},0);
  var semPDF=todosContratos.filter(function(c){return !c.contrato_assinado_url;}).length;
  var ativo=function(c){return filtroCardCont===c?' ativo':'';};
  var denTotal=todosContratos.length||1;
  document.getElementById('stats').innerHTML=
    '<div class="stat-card sc-g'+ativo('vigente')+'" onclick="clicarCardCont(\'vigente\')">'+waterHTML('var(--verde-claro)',Math.round(vig.length/denTotal*100))+'<div class="stat-lbl">Vigentes</div><div class="stat-val">'+vig.length+'</div><div class="stat-sub">de '+todosContratos.length+' totais</div></div>'+
    '<div class="stat-card sc-b'+ativo('total')+'" onclick="clicarCardCont(\'total\')">'+waterHTML('var(--azul-medio)',100)+'<div class="stat-lbl">Total contratado</div><div class="stat-val" style="font-size:15px">'+fmtBRL(totC)+'</div></div>'+
    '<div class="stat-card sc-a'+ativo('utilizado')+'" onclick="clicarCardCont(\'utilizado\')">'+waterHTML('var(--aviso)',totC>0?Math.round(totU/totC*100):0)+'<div class="stat-lbl">Total utilizado</div><div class="stat-val" style="font-size:15px">'+fmtBRL(totU)+'</div><div class="stat-sub">'+(totC>0?Math.round(totU/totC*100):0)+'% do contratado</div></div>'+
    '<div class="stat-card '+(semPDF>0?'sc-r':'sc-g')+ativo('sem_pdf')+'" onclick="clicarCardCont(\'sem_pdf\')">'+waterHTML(semPDF>0?'var(--erro)':'var(--verde-claro)',Math.round(semPDF/denTotal*100))+'<div class="stat-lbl">Sem PDF</div><div class="stat-val" style="color:'+(filtroCardCont==='sem_pdf'?'':(semPDF>0?'var(--erro)':'var(--sucesso)'))+'">'+semPDF+'</div><div class="stat-sub">contratos sem documento</div></div>';
  animarAgua();
}

function filtrar(){
  var b=(document.getElementById('busca').value||'').toLowerCase();
  var s=document.getElementById('fil-status').value;
  var fp=document.getElementById('fil-pdf').value;
  var fa=document.getElementById('fil-ativ')?.value||'';
  var ff=document.getElementById('fil-forn')?.value||'';
  var fil=todosContratos.filter(function(c){
    if(s&&c.status!==s)return false;
    if(fp==='com'&&!c.contrato_assinado_url)return false;
    if(fp==='sem'&&c.contrato_assinado_url)return false;
    if(fa&&c.atividade_id!==fa)return false;
    if(ff&&c.fornecedor_id!==ff)return false;
    if(b&&!((c.numero+' '+(c.objeto_pt||'')+' '+(c.fornecedores?c.fornecedores.nome:'')).toLowerCase()).includes(b))return false;
    if(filtroCardCont==='vigente'&&c.status!=='vigente')return false;
    if(filtroCardCont==='utilizado'&&!(parseFloat(c.valor_utilizado_brl||0)>0))return false;
    if(filtroCardCont==='sem_pdf'&&c.contrato_assinado_url)return false;
    return true;
  });
  document.getElementById('cont').textContent=fil.length+' de '+todosContratos.length+' contratos';
  var tbody=document.getElementById('tbody');
  var empty=document.getElementById('tbl-empty');
  if(!fil.length){

function renderLinha(c){
  var total=parseFloat(c.valor_total_brl||0);
  var usado=parseFloat(c.valor_utilizado_brl||0);
  var pct=total>0?Math.min(usado/total*100,100):0;
  var critico=pct>90;
  var vencido=c.dt_fim&&new Date(c.dt_fim)<new Date()&&c.status==='vigente';
  var temPDF=!!c.contrato_assinado_url;
  var temTrad=!!c.contrato_pt_url;
  var aberto=!!expandidos[c.id];
  var obj=(c.objeto_pt||'').substring(0,55)+(c.objeto_pt&&c.objeto_pt.length>55?'...':'');

  var main='<tr class="main-row '+(aberto?'aberto':'')+'">'
    +'<td><button class="xbtn '+(aberto?'aberto':'')+'" id="xb-'+c.id+'" onclick="toggleDet(\''+c.id+'\')">'+(aberto?'&#9660;':'&#9658;')+'</button></td>'
    +'<td><span class="mono" style="font-weight:600">'+c.numero+'</span></td>'
    +'<td style="max-width:200px"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+(c.objeto_pt||'')+'" >'+obj+'</div>'
      +(vencido?'<span style="font-size:9px;background:var(--erro-bg);color:var(--erro);padding:1px 5px;border-radius:3px;font-weight:600">Vencido</span>':critico?'<span style="font-size:9px;background:var(--aviso-bg);color:var(--aviso);padding:1px 5px;border-radius:3px;font-weight:600">Critico</span>':'')
    +'</td>'
    +'<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(c.fornecedores?c.fornecedores.nome:'--')+'</td>'
    +'<td><div class="mono" style="font-weight:600">'+fmtBRL(total)+'</div>'
      +'<div class="saldo-bar"><div class="saldo-fill" style="width:'+pct+'%;background:'+(critico?'var(--erro)':'var(--verde-claro)')+'"></div></div></td>'
    +'<td style="white-space:nowrap;font-size:11px">'+(c.dt_inicio?fmtData(c.dt_inicio):'--')+' &#x2192; '+(c.dt_fim?fmtData(c.dt_fim):'--')+'</td>'
    +'<td><span class="badge b-'+c.status+'">'+(SL[c.status]||c.status)+'</span></td>'
    +'<td style="text-align:center">'
      +'<span class="pdf-dot" style="background:'+(temPDF?'#059669':'#EF4444')+'" title="'+(temPDF?'PDF EN presente':'PDF ausente')+'"></span>'
      +(temTrad?'<span class="pdf-dot" style="background:#2563EB;margin-left:3px" title="Traducao PT disponivel"></span>':'')
    +'</td>'
    +'<td>'+(PODE.verFinanceiro()?'<button class="btn-xs" onclick="event.stopPropagation();abrirEditar(\''+c.id+'\')" title="Editar">&#x270F;</button>':'')+'</td>'
    +'</tr>';

  var det='<tr class="detail-row" id="det-'+c.id+'" style="display:'+(aberto?'table-row':'none')+'">'
    +'<td colspan="9"><div class="detail-inner" id="inner-'+c.id+'">'+(aberto?buildDet(c):'')+'</div></td>'
    +'</tr>';

  return main+det;
}

window.toggleDet=function(id){
  expandidos[id]=!expandidos[id];
  var det=document.getElementById('det-'+id);
  var inner=document.getElementById('inner-'+id);
  var xb=document.getElementById('xb-'+id);
  var mainRow=det?det.previousElementSibling:null;
  if(!det){expandidos[id]=!expandidos[id];return;}
  if(expandidos[id]){
    det.style.display='table-row';
    var c=todosContratos.find(function(x){return x.id===id;});
    if(inner&&c)inner.innerHTML=buildDet(c);
    if(xb){xb.className='xbtn aberto';xb.innerHTML='&#9660;';}
    if(mainRow)mainRow.classList.add('aberto');
  } else {
    det.style.display='none';
    if(xb){xb.className='xbtn';xb.innerHTML='&#9658;';}
    if(mainRow)mainRow.classList.remove('aberto');
  }
};

window.uploadDireto=async function(id,file,lang){
  if(!file)return;
  toast('Enviando PDF...','info');
  var path='contratos/'+id+'/'+(lang==='en'?'original':'traduzido')+'_'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  var up=await db.storage.from('contratos-docs').upload(path,file,{upsert:true});
  if(up.error){toast('Erro upload: '+up.error.message,'error');return;}
  var url=db.storage.from('contratos-docs').getPublicUrl(path).data.publicUrl;
  var upd=lang==='en'
    ?{contrato_assinado_url:url,contrato_assinado_nome:file.name,contrato_assinado_data:new Date().toISOString().split('T')[0]}
    :{contrato_pt_url:url,contrato_pt_nome:file.name,contrato_pt_data:new Date().toISOString()};
  await db.from('contratos').update(upd).eq('id',id);
  var c=todosContratos.find(function(x){return x.id===id;});
  if(c)Object.assign(c,upd);
  toast('PDF enviado!','success');
  expandidos[id]=false;toggleDet(id);
};

function gerarPdfTraducao(txt,c){
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  var pageW=210,pageH=297,mL=20,mR=20,mT=20,mB=28;
  var cW=pageW-mL-mR;
  var dataHoje=new Date().toLocaleDateString('pt-BR');
  var rodape='Tradução gerada por Inteligência Artificial Claude (Anthropic) em '+dataHoje+' — documento não oficial, sujeito a revisão.';

  function addHeader(pg){
    doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(140);
    doc.text('UNESCO · DIMA · 218BRA2001  |  Contrato Nº '+(c.numero||''),mL,11);
    doc.text('TRADUÇÃO PARA O PORTUGUÊS',pageW/2,11,{align:'center'});
    doc.text('Página '+pg,pageW-mR,11,{align:'right'});
    doc.setDrawColor(180);doc.setLineWidth(0.25);
    doc.line(mL,14,pageW-mR,14);
    doc.setTextColor(0);
  }

  function addFooter(){
    doc.setDrawColor(180);doc.setLineWidth(0.25);
    doc.line(mL,pageH-mB+4,pageW-mR,pageH-mB+4);
    doc.setFontSize(7);doc.setFont('helvetica','italic');doc.setTextColor(130);
    doc.text(rodape,pageW/2,pageH-mB+10,{align:'center',maxWidth:cW});
    doc.setTextColor(0);
  }

  var pg=1;
  addHeader(pg);

  // Bloco título
  doc.setFontSize(13);doc.setFont('helvetica','bold');doc.setTextColor(20);
  doc.text('TRADUÇÃO — '+(c.numero||''),pageW/2,26,{align:'center'});
  doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(80);
  var forn=c.fornecedores&&c.fornecedores.nome?c.fornecedores.nome:'';
  if(forn)doc.text('Fornecedor: '+forn,pageW/2,32,{align:'center'});
  doc.setDrawColor(34,139,84);doc.setLineWidth(0.6);
  doc.line(mL,36,pageW-mR,36);

  var y=42,lh=5.5;
  var paras=txt.split(/\n+/);
  for(var i=0;i<paras.length;i++){
    var para=paras[i].trim();
    if(!para){y+=2;continue;}
    var isHead=/^[A-ZÁÉÍÓÚÀÃÕÂÊÎÔÛÇ0-9][A-ZÁÉÍÓÚÀÃÕÂÊÎÔÛÇ0-9\s\.\-:,\/]{2,79}$/.test(para)&&para===para.toUpperCase()&&para.length<100;
    if(isHead){doc.setFont('helvetica','bold');doc.setFontSize(10);}
    else{doc.setFont('helvetica','normal');doc.setFontSize(9.5);}
    doc.setTextColor(20);
    var lines=doc.splitTextToSize(para,cW);
    var bH=lines.length*lh+(isHead?4:3);
    if(y+bH>pageH-mB){
      addFooter();doc.addPage();pg++;addHeader(pg);y=mT+4;
    }
    if(isHead)y+=2;
    doc.text(lines,mL,y);
    y+=lines.length*lh+(isHead?4:3);
  }
  addFooter();
  return doc.output('arraybuffer');
}

window.traduzir=async function(id){
  var c=todosContratos.find(function(x){return x.id===id;});
  if(!c||!c.contrato_assinado_url){toast('PDF original nao encontrado.','error');return;}
  var btn=document.getElementById('btn-tr-'+id);
  if(btn){btn.textContent='Traduzindo...';btn.disabled=true;}
  toast('Traduzindo com IA -- aguarde ate 30 segundos...','info',30000);
  try{
    var SB_URL='https://wfymnmlinonvdqfucjya.supabase.co';
    var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmeW1ubWxpbm9udmRxZnVjanlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MzM1NzksImV4cCI6MjA5MDMwOTU3OX0.eC6T9VQ6OzF9mISEGy_pgbIbrOAnG4xp2z6WN-sCMt8';
    var efResp=await fetch(SB_URL+'/functions/v1/traduzir-contrato',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify({pdf_url:c.contrato_assinado_url})
    });
    var efData=await efResp.json();
    if(!efData.ok)throw new Error(efData.erro||'Erro na traducao');
    var txt=efData.traducao||'';
    if(!txt||txt.trim().length<50)throw new Error('Traducao retornada vazia.');

    // Gerar PDF formatado com rodape IA
    var pdfBuffer=gerarPdfTraducao(txt,c);
    var nomeBase=(c.contrato_assinado_nome||'contrato').replace(/\.(pdf|docx)$/i,'');
    var nomeTrad=nomeBase+'_PT_traduzido.pdf';
    var blobTrad=new Blob([pdfBuffer],{type:'application/pdf'});
    var path='contratos/'+id+'/'+nomeTrad;
    var upR=await db.storage.from('contratos-docs').upload(path,blobTrad,{upsert:true,contentType:'application/pdf'});
    if(upR.error)throw new Error('Erro upload: '+upR.error.message);
    var urlTrad=db.storage.from('contratos-docs').getPublicUrl(path).data.publicUrl;

    var dbR=await db.from('contratos').update({
      contrato_pt_url:urlTrad,
      contrato_pt_nome:nomeTrad,
      contrato_pt_data:new Date().toISOString()
    }).eq('id',id);
    if(dbR.error)throw new Error('Erro banco: '+dbR.error.message);

    Object.assign(c,{contrato_pt_url:urlTrad,contrato_pt_nome:nomeTrad,contrato_pt_data:new Date().toISOString()});
    toast('Contrato traduzido e salvo como PDF!','success');
    expandidos[id]=false;toggleDet(id);
  }catch(e){
    console.error('Erro traducao:',e);
    toast('Erro: '+e.message,'error',8000);
    if(btn){btn.textContent='Traduzir';btn.disabled=false;}
  }
};

window.preencherAtiv=function(){
  var tId=document.getElementById('f-tdr').value;
  if(!tId)return;
  var t=tdrs.find(function(x){return x.id===tId;});
  if(!t||!t.atividade_id)return;
  document.getElementById('f-ativ').value=t.atividade_id;
};
window.selPDF=function(files){
  if(!files||!files[0])return;
  filePDF=files[0];
  document.getElementById('pdf-prev').innerHTML=
    '<div style="background:var(--verde-bg);border:1px solid #9FE1CB;border-radius:var(--raio);padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:12px">'+
    '<span style="font-size:16px">&#x1F4C4;</span><span style="font-weight:500">'+filePDF.name+'</span>'+
    '<span style="color:var(--cinza-500)">('+Math.round(filePDF.size/1024)+'KB)</span></div>';
};
window.dropPDF=function(e){selPDF(e.dataTransfer.files);};

window.salvar=async function(){
  var num=(document.getElementById('f-num').value||'').trim();
  var fornId=document.getElementById('f-forn').value;
  var total=parseFloat(document.getElementById('f-total').value)||0;
  var sei=(document.getElementById('f-sei').value||'').trim();
  if(!num||!fornId||!total){toast('Preencha numero, fornecedor e valor total.','error');return;}
  if(!sei){toast('Preencha o Número SEI.','error');document.getElementById('f-sei').focus();return;}
  var dados={
    numero:num,fornecedor_id:fornId,
    tdr_id:document.getElementById('f-tdr').value||null,
    atividade_id:document.getElementById('f-ativ').value||null,
    objeto_pt:document.getElementById('f-objeto').value.trim()||null,
    tipo:document.getElementById('f-tipo').value||null,
    valor_total_brl:total,
    valor_utilizado_brl:parseFloat(document.getElementById('f-usado').value)||0,
    dt_inicio:document.getElementById('f-inicio').value||null,
    dt_fim:document.getElementById('f-fim').value||null,
    elemento_despesa:document.getElementById('f-elem').value.trim()||null,
    status:document.getElementById('f-status').value,
    numero_sei:sei||null,
  };
  // saldo_brl é GENERATED ALWAYS no banco, não enviar

  // Encerrando um contrato que ainda tem produtos não entregues/aprovados:
  // exige justificativa formal antes de liberar o saldo não executado para a atividade.
  if(contratoEditando&&dados.status==='encerrado'&&contratoEditando.status!=='encerrado'){
    var todosProds=await carregarProdutos(contratoEditando.id);
    var afetados=todosProds.filter(function(p){return ['pendente','em_analise','entrega_parcial','devolvido'].includes(p.situacao);});
    if(afetados.length){
      abrirModalEncerramento(dados,afetados);
      return;
    }
  }

  await executarSalvarContrato(dados);
};

async function executarSalvarContrato(dados){
  var prog=document.getElementById('prog-bar');
  var fill=document.getElementById('prog-fill');
  if(prog)prog.style.display='block';
  if(fill)fill.style.width='20%';
  try{
    var cId;
    if(!contratoEditando){
      var ins=await db.from('contratos').insert(Object.assign({},dados,{criado_por:appState.usuario.id})).select('*,fornecedores(id,nome,tipo),atividades(id,codigo,nome_pt),tdrs(id,numero)').single();
      if(ins.error)throw ins.error;
      todosContratos.unshift(ins.data);cId=ins.data.id;
      toast('Contrato '+ins.data.numero+' criado!','success');
    } else {
      var upd2=await db.from('contratos').update(dados).eq('id',contratoEditando.id);
      if(upd2.error)throw upd2.error;
      cId=contratoEditando.id;
      var f2=fornecedores.find(function(f){return f.id===dados.fornecedor_id;});
      var a2=atividades.find(function(a){return a.id===dados.atividade_id;});
      Object.assign(contratoEditando,dados,{fornecedores:f2||null,atividades:a2||null});
      toast('Contrato atualizado!','success');
    }
    if(fill)fill.style.width='60%';
    if(filePDF&&cId){
      var path='contratos/'+cId+'/original_'+Date.now()+'_'+filePDF.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      var up=await db.storage.from('contratos-docs').upload(path,filePDF,{upsert:true});
      if(!up.error){
        var url=db.storage.from('contratos-docs').getPublicUrl(path).data.publicUrl;
        await db.from('contratos').update({contrato_assinado_url:url,contrato_assinado_nome:filePDF.name,contrato_assinado_data:new Date().toISOString().split('T')[0]}).eq('id',cId);
        var c2=todosContratos.find(function(x){return x.id===cId;});
        if(c2){c2.contrato_assinado_url=url;c2.contrato_assinado_nome=filePDF.name;}
      } else toast('Aviso: erro no upload do PDF -- '+up.error.message,'error');
    }
    if(fill)fill.style.width='100%';
    fecharModal();renderStats();filtrar();
    return cId;
  }catch(e){
    if(e.code==='23505')toast('Numero de contrato ja cadastrado.','error');
    else toast('Erro: '+(e.message||''),'error');
    if(prog)prog.style.display='none';
    throw e;
  }
}

// ── ENCERRAMENTO COM SALDO NÃO EXECUTADO ─────────────────────
var dadosEncerramentoPendente=null,produtosEncerramentoPendente=null;

function calcNaoExecutado(p){
  return Math.max(0,parseFloat(p.valor_brl||0)-parseFloat(p.valor_aprovado||0));
}

window.abrirModalEncerramento=function(dados,afetados){
  dadosEncerramentoPendente=dados;
  produtosEncerramentoPendente=afetados;
  document.getElementById('me-sub').textContent='Contrato '+contratoEditando.numero+' -- '+(contratoEditando.fornecedores?contratoEditando.fornecedores.nome:'');

  var SIT_LBL={pendente:'Pendente',em_analise:'Em avaliação',entrega_parcial:'Parcial',devolvido:'Devolvido'};
  var linhas=afetados.map(function(p,i){
    var naoExec=calcNaoExecutado(p);
    return '<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--borda)">'
      +'<input type="checkbox" class="chk-prod-enc" data-idx="'+i+'" checked onchange="recalcLiberado()" style="margin-top:3px">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:12px;font-weight:600;color:var(--cinza-900)">Produto '+(p.numero_produto||'?')+' -- '+esc((p.descricao||'').substring(0,70))+'</div>'
      +'<div style="font-size:11px;color:var(--cinza-500);margin-top:2px">Situação atual: '+(SIT_LBL[p.situacao]||p.situacao)+' · Não executado: <strong style="color:#DC2626">'+fmtBRL(naoExec)+'</strong></div>'
      +'</div></div>';
  }).join('');

  document.getElementById('me-body').innerHTML=
    '<div style="background:#FEF2F2;border:1px solid #FCA5A5;border-radius:var(--raio);padding:10px 12px;margin-bottom:14px;font-size:12px;color:#991B1B">'
    +'Este contrato está sendo encerrado com <strong>'+afetados.length+' produto(s)</strong> ainda não entregue(s)/aprovado(s). '
    +'Desmarque abaixo os que <u>não</u> devem ser cancelados. O valor não executado dos itens marcados será liberado de volta para o saldo da atividade vinculada, permitindo nova contratação.'
    +'</div>'
    +'<div style="margin-bottom:14px">'+linhas+'</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;background:var(--cinza-50);border-radius:var(--raio);padding:10px 12px;margin-bottom:14px">'
    +'<span style="font-size:12px;font-weight:600;color:var(--cinza-700)">Valor total a liberar para a atividade</span>'
    +'<span id="me-valor-liberado" style="font-size:15px;font-weight:700;font-family:var(--font-mono);color:#DC2626"></span>'
    +'</div>'
    +'<div class="form-group"><label class="form-label">Justificativa do encerramento <span class="obrig">*</span></label>'
    +'<textarea class="form-control" id="me-motivo" rows="3" placeholder="Ex: Fornecedor não entregou os produtos 03, 04 e 05 dentro do prazo contratual (encerrado em DD/MM/AAAA). Saldo remanescente liberado para nova contratação na mesma atividade."></textarea>'
    +'<div class="form-hint">Mínimo 20 caracteres -- fica registrado permanentemente no histórico do contrato.</div></div>';

  recalcLiberado();
  document.getElementById('modal-encerramento').classList.add('aberto');
};

window.recalcLiberado=function(){
  var total=0;
  document.querySelectorAll('.chk-prod-enc').forEach(function(chk){
    if(chk.checked){
      var p=produtosEncerramentoPendente[parseInt(chk.dataset.idx)];
      total+=calcNaoExecutado(p);
    }
  });
  var el=document.getElementById('me-valor-liberado');
  if(el)el.textContent=fmtBRL(total);
};

window.fecharModalEncerramento=function(){
  document.getElementById('modal-encerramento').classList.remove('aberto');
  dadosEncerramentoPendente=null;produtosEncerramentoPendente=null;
};

window.confirmarEncerramento=async function(){
  var motivo=(document.getElementById('me-motivo').value||'').trim();
  if(!motivo||motivo.length<20){toast('Descreva a justificativa do encerramento (mínimo 20 caracteres).','error');return;}

  var selecionados=[];
  document.querySelectorAll('.chk-prod-enc').forEach(function(chk){
    if(chk.checked)selecionados.push(produtosEncerramentoPendente[parseInt(chk.dataset.idx)]);
  });

  var valorLiberadoBrl=selecionados.reduce(function(s,p){return s+calcNaoExecutado(p);},0);
  var cot=await obterCotacao();
  var valorLiberadoUsd=cot&&cot.cotacao?valorLiberadoBrl/parseFloat(cot.cotacao):null;

  var dados=dadosEncerramentoPendente;
  var atividadeId=dados.atividade_id;
  var contratoId=contratoEditando.id;

  try{
    await executarSalvarContrato(dados);

    if(selecionados.length){
      var ids=selecionados.map(function(p){return p.id;});
      var updProd=await db.from('contratos_produtos').update({situacao:'cancelado',atualizado_em:new Date().toISOString()}).in('id',ids);
      if(updProd.error)throw updProd.error;
    }

    var snapshot=selecionados.map(function(p){
      return {id:p.id,numero_produto:p.numero_produto,descricao:p.descricao,valor_brl:parseFloat(p.valor_brl||0),valor_aprovado:parseFloat(p.valor_aprovado||0),valor_nao_executado:calcNaoExecutado(p),situacao_anterior:p.situacao};
    });
    var insEnc=await db.from('contrato_encerramentos').insert({
      contrato_id:contratoId,atividade_id:atividadeId||null,
      valor_liberado_brl:valorLiberadoBrl,valor_liberado_usd:valorLiberadoUsd,
      motivo:motivo,produtos_afetados:snapshot,autorizado_por:appState.usuario.id
    });
    if(insEnc.error)throw insEnc.error;

    toast('Contrato encerrado. '+fmtBRL(valorLiberadoBrl)+' liberado(s) para a atividade.','success',7000);
    fecharModalEncerramento();
    await recarregarDet(contratoId);
  }catch(e){
    toast('Erro ao encerrar contrato: '+(e.message||''),'error');
  }
};

// ── ESTADO PRODUTOS / ENTREGAS ────────────────────────────────
var produtosPorContrato={};
var entregasPorContrato={};
var detTabAtiva={};
var contratoModalProdId=null;

async function carregarProdutos(contratoId){
  var r=await db.from('contratos_produtos').select('*').eq('contrato_id',contratoId).order('numero_produto',{ascending:true});
  produtosPorContrato[contratoId]=r.data||[];
  return produtosPorContrato[contratoId];
}

window.mudarDetTab=async function(contratoId,tab){
  detTabAtiva[contratoId]=tab;
  if(tab==='prods'&&!produtosPorContrato[contratoId])await carregarProdutos(contratoId);
  if(tab==='entregas'){
    if(!produtosPorContrato[contratoId])await carregarProdutos(contratoId);
    await carregarEntregas(contratoId);
  }
  var c=todosContratos.find(function(x){return x.id===contratoId;});
  var inner=document.getElementById('inner-'+contratoId);
  if(inner&&c)inner.innerHTML=buildDet(c);
};

async function recarregarDet(contratoId){
  await carregarProdutos(contratoId);
  if(entregasPorContrato[contratoId]!==undefined)await carregarEntregas(contratoId);
  var c=todosContratos.find(function(x){return x.id===contratoId;});
  var inner=document.getElementById('inner-'+contratoId);
  if(inner&&c)inner.innerHTML=buildDet(c);
}

async function carregarEntregas(contratoId){
  var prods=produtosPorContrato[contratoId]||[];
  if(!prods.length){entregasPorContrato[contratoId]=[];return [];}
  var ids=prods.map(function(p){return p.id;});
  var r=await db.from('contratos_produtos_entregas')
    .select('*,criado_por_u:usuarios!contratos_produtos_entregas_criado_por_fkey(nome_completo),despachado_por_u:usuarios!contratos_produtos_entregas_despachado_por_fkey(nome_completo),lancamento:execucao_financeira!contratos_produtos_entregas_lancamento_id_fkey(id,situacao,valor_brl,dt_pagamento,pago_por_u:usuarios!execucao_financeira_pago_por_fkey(nome_completo)),documentos:entrega_documentos(*)')
    .in('produto_id',ids)
    .order('criado_em',{ascending:true});
  if(r.error){console.error('[carregarEntregas]',r.error);entregasPorContrato[contratoId]=[];return [];}
  entregasPorContrato[contratoId]=r.data||[];
  return entregasPorContrato[contratoId];
}

function buildTabEntregas(c){
  if(!entregasPorContrato[c.id]){
    setTimeout(async function(){
      if(!produtosPorContrato[c.id])await carregarProdutos(c.id);
      await carregarEntregas(c.id);
      var inner=document.getElementById('inner-'+c.id);
      if(inner)inner.innerHTML=buildDet(c);
    },0);
    return '<div style="padding:20px;text-align:center;font-size:12px;color:var(--cinza-400)">Carregando entregas...</div>';
  }
  var prods=produtosPorContrato[c.id]||[];
  var entregas=entregasPorContrato[c.id]||[];
  var SIT_PROD={pendente:'Pendente',em_analise:'Em análise',aprovado:'Aprovado',pago:'Pago',cancelado:'Cancelado',entrega_parcial:'Parcial',devolvido:'Devolvido'};
  var COR_PROD={pendente:'background:#FFFBEB;color:#92400E',em_analise:'background:#EFF6FF;color:#1E40AF',aprovado:'background:#F0FDF4;color:#166534',pago:'background:#ECFDF5;color:#065F46',cancelado:'background:#F3F4F6;color:#6B7280',entrega_parcial:'background:#FFF7ED;color:#9A3412',devolvido:'background:#FEF2F2;color:#991B1B'};
  var SIT_ENT={pendente:'Pendente',em_analise:'Em análise',aprovada:'Aprovada',devolvida:'Devolvida'};
  var COR_ENT={pendente:'background:#FFFBEB;color:#92400E',em_analise:'background:#EFF6FF;color:#1E40AF',aprovada:'background:#F0FDF4;color:#166534',devolvida:'background:#FEF2F2;color:#991B1B'};

  if(!prods.length)return '<div class="ent-vazia">Nenhum produto cadastrado.</div>';

  var h='<div style="font-size:11px;color:var(--cinza-500);margin-bottom:10px">'+
    (entregas.length?'<strong>'+entregas.length+'</strong> entrega(s) registrada(s) neste contrato.':'Nenhuma entrega registrada ainda.')+
    '</div>';

  prods.forEach(function(p){
    var pe=entregas.filter(function(e){return e.produto_id===p.id;});
    var corProd=COR_PROD[p.situacao]||'background:#F3F4F6;color:#6B7280';
    h+='<div class="ent-bloco">';
    h+='<div class="ent-prod-header">'
      +'<span style="font-size:10px;font-weight:700;color:var(--cinza-400);font-family:var(--font-mono)">#'+p.numero_produto+'</span>'
      +'<span class="ent-prod-title" title="'+escHtml(p.descricao)+'">'+escHtml(p.descricao)+'</span>'
      +'<span class="mono" style="font-size:11px;color:var(--verde-medio);flex-shrink:0">'+fmtBRL(parseFloat(p.valor_brl||0))+'</span>'
      +'<span class="ent-badge" style="'+corProd+';flex-shrink:0">'+(SIT_PROD[p.situacao]||p.situacao)+'</span>'
      +'</div>';
    if(!pe.length){
      h+='<div class="ent-vazia">Nenhuma entrega registrada.</div>';
    } else {
      pe.forEach(function(e,ei){
        var corEnt=COR_ENT[e.situacao]||'background:#F3F4F6;color:#6B7280';
        h+='<div class="ent-item">';
        // Linha topo: número, data, status, pct
        h+='<div class="ent-row">'
          +'<span class="ent-num">Entrega '+(ei+1)+'</span>'
          +(e.dt_entrega?'<span style="font-size:11px;color:var(--cinza-700)">'+fmtData(e.dt_entrega)+'</span>':'')
          +'<span class="ent-badge" style="'+corEnt+'">'+(SIT_ENT[e.situacao]||e.situacao)+'</span>'
          +(e.pct_entregue&&e.pct_entregue<100?'<span style="font-size:10px;color:var(--cinza-500)">'+e.pct_entregue+'%</span>':'')
          +'</div>';
        // Quem fez o quê
        var temQuem=e.criado_por_u||e.despachado_por_u||(e.lancamento&&e.lancamento.dt_pagamento);
        if(temQuem){
          h+='<div class="ent-quem">';
          if(e.criado_por_u&&e.criado_por_u.nome_completo){
            h+='<div class="ent-quem-item"><span class="ent-quem-lbl">Carregou</span><span>'+escHtml(e.criado_por_u.nome_completo)+'</span></div>';
          }
          if(e.despachado_por_u&&e.despachado_por_u.nome_completo){
            var lblDesp=e.situacao==='devolvida'?'Devolveu':e.situacao==='em_analise'?'Enviou para análise':'Aprovou';
            h+='<div class="ent-quem-item"><span class="ent-quem-lbl">'+lblDesp+'</span><span>'+escHtml(e.despachado_por_u.nome_completo)+'</span>'
              +(e.despacho_data?'<span class="ent-quem-data">em '+fmtData(e.despacho_data)+'</span>':'')
              +'</div>';
          }
          if(e.lancamento&&e.lancamento.dt_pagamento){
            var pagNome=e.lancamento.pago_por_u&&e.lancamento.pago_por_u.nome_completo?e.lancamento.pago_por_u.nome_completo:'';
            h+='<div class="ent-quem-item"><span class="ent-quem-lbl">Pagamento</span>'
              +(pagNome?'<span>'+escHtml(pagNome)+'</span>':'')
              +'<span class="ent-quem-data">em '+fmtData(e.lancamento.dt_pagamento)+'</span></div>';
          }
          h+='</div>';
        }
        // Links
        var temLinks=e.despacho_numero||e.nota_tecnica_url||(e.documentos&&e.documentos.length);
        if(temLinks){
          h+='<div class="ent-links">';
          if(e.despacho_numero){
            h+='<span class="ent-link ent-link-desp">📋 Despacho '+escHtml(e.despacho_numero)
              +(e.despacho_data?' · '+fmtData(e.despacho_data):'')+'</span>';
          }
          if(e.nota_tecnica_url){
            h+='<a href="'+e.nota_tecnica_url+'" target="_blank" rel="noopener" class="ent-link ent-link-nt">📄 '
              +escHtml(e.nota_tecnica_nome||'Nota Técnica')+'</a>';
          }
          if(e.documentos&&e.documentos.length){
            e.documentos.forEach(function(d){
              if(d.arquivo_url){
                h+='<a href="'+d.arquivo_url+'" target="_blank" rel="noopener" class="ent-link">📎 '
                  +escHtml(d.tipo_documento||d.arquivo_nome||'Documento')+'</a>';
              }
            });
          }
          h+='</div>';
        }
        h+='</div>'; // ent-item
      });
    }
    h+='</div>'; // ent-bloco
  });
  return h;
}

window.abrirModalProd=async function(contratoId){
  contratoModalProdId=contratoId;
  var c=todosContratos.find(function(x){return x.id===contratoId;});
  if(!c)return;
  document.getElementById('mp-titulo').textContent='Produtos / Entregas — '+c.numero;
  document.getElementById('mp-sub').textContent=(c.fornecedores?c.fornecedores.nome:'')+(c.objeto_pt?' | '+c.objeto_pt.substring(0,60):'');
  document.getElementById('mp-footer').innerHTML='<button class="btn btn-secondary" onclick="fecharModalProd()">Fechar</button><button class="btn btn-primary" onclick="salvarProdutos()">Salvar produtos</button>';
  var prods=produtosPorContrato[contratoId];
  if(!prods)prods=await carregarProdutos(contratoId);
  renderFormProd(c,prods);
  document.getElementById('modal-produtos').classList.add('aberto');
};

var linhasProd=[];

function renderFormProd(c,prods){
  linhasProd=prods.length
    ?prods.map(function(p){return{id:p.id,num:p.numero_produto,desc:p.descricao,val:p.valor_brl,venc:p.dt_vencimento||'',entrega:p.dt_entrega||'',sit:p.situacao,obs:p.observacoes||''};})
    :[{id:null,num:1,desc:'',val:'',venc:'',entrega:'',sit:'pendente',obs:''}];
  var total=parseFloat(c.valor_total_brl||0);
  document.getElementById('mp-body').innerHTML=
    '<div style="background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio);padding:10px 14px;margin-bottom:14px;display:flex;gap:24px;font-size:12px">'
    +'<span>Valor do contrato: <strong class="mono">'+fmtBRL(total)+'</strong></span>'
    +'<span id="mp-soma">Soma dos produtos: <strong class="mono">--</strong></span>'
    +'<span id="mp-diff"></span></div>'
    +'<div id="prod-linhas"></div>'
    +'<button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="addLinhaProd()">+ Adicionar produto</button>';
  renderLinhasProd();
  calcSoma(total);
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

function renderLinhasProd(){
  var container=document.getElementById('prod-linhas');
  if(!container)return;
  var SIT=['pendente','em_analise','aprovado','cancelado'];
  var SLBL={pendente:'Pendente',em_analise:'Em análise',aprovado:'Aprovado',pago:'Pago',cancelado:'Cancelado'};

  container.innerHTML=linhasProd.map(function(p,i){
    var isPago    = p.sit==='pago';
    var isAprovado= p.sit==='aprovado';
    var travado   = isPago || isAprovado;

    if(travado){
      var bgCard = isPago ? 'background:#ECFDF5;border-color:#86EFAC' : 'background:#F0FDF4;border-color:#BBF7D0';
      var icone  = isPago ? '&#x1F512;' : '&#x2705;';
      var txtSit = isPago ? 'Pago &#8212; bloqueado para edição' : 'Aprovado &#8212; aguardando pagamento no financeiro';
      var corSit = isPago ? '#065F46' : '#166534';
      return '<div style="border:1px solid var(--borda);border-radius:var(--raio);padding:12px 14px;margin-bottom:8px;'+bgCard+'">'
        +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
        +'<span style="font-family:var(--font-mono);font-size:12px;font-weight:700;background:var(--verde-medio);color:#fff;padding:2px 8px;border-radius:4px">Produto '+p.num+'</span>'
        +'<span style="font-size:11px;font-weight:600;color:'+corSit+'">'+icone+' '+txtSit+'</span>'
        +'</div>'
        +'<div style="display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center">'
        +'<div style="font-size:13px;font-weight:500;color:var(--cinza-900)">'+escHtml(p.desc)+'</div>'
        +'<div style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--verde-medio)">'+fmtBRL(parseFloat(p.val||0))+'</div>'
        +(p.venc?'<div style="font-size:11px;color:var(--cinza-500)">Venc: '+fmtData(p.venc)+'</div>':'<div></div>')
        +'</div></div>';
    }

    var bgCard=p.sit==='cancelado'?'background:var(--cinza-50);opacity:.7':'';
    return '<div style="border:1px solid var(--borda);border-radius:var(--raio);padding:12px 14px;margin-bottom:8px;'+bgCard+'">'
      +'<div style="display:grid;grid-template-columns:52px 1fr 140px 140px 32px;gap:8px;align-items:end;margin-bottom:8px">'
      +'<div><label class="form-label" style="font-size:10px">N\u00ba</label><input class="form-control" type="number" min="1" value="'+p.num+'" oninput="updProd('+i+',\'num\',this.value)" style="font-family:var(--font-mono);text-align:center"></div>'
      +'<div><label class="form-label" style="font-size:10px">Descri\u00e7\u00e3o <span class="obrig">*</span></label><input class="form-control" type="text" value="'+escHtml(p.desc)+'" placeholder="Ex: Relat\u00f3rio t\u00e9cnico" oninput="updProd('+i+',\'desc\',this.value)"></div>'
      +'<div><label class="form-label" style="font-size:10px">Valor R$ <span class="obrig">*</span></label><input class="form-control" type="number" step="0.01" value="'+p.val+'" placeholder="0,00" oninput="updProd('+i+',\'val\',this.value);calcSoma()"></div>'
      +'<div><label class="form-label" style="font-size:10px">Situa\u00e7\u00e3o</label><select class="form-control" onchange="updProd('+i+',\'sit\',this.value);renderLinhasProd()">'
      +SIT.map(function(s){return '<option value="'+s+'" '+(p.sit===s?'selected':'')+'>'+SLBL[s]+'</option>';}).join('')+'</select></div>'
      +'<div><label class="form-label" style="font-size:10px">&nbsp;</label>'
      +(linhasProd.length>1?'<button onclick="remLinhaProd('+i+')" style="width:32px;height:36px;border:1px solid #FCA5A5;border-radius:var(--raio);background:#FEF2F2;color:var(--erro);cursor:pointer;font-size:14px">&#x2715;</button>':'<div style="width:32px"></div>')
      +'</div></div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
      +'<div><label class="form-label" style="font-size:10px">Vencimento previsto</label><input class="form-control" type="date" value="'+p.venc+'" oninput="updProd('+i+',\'venc\',this.value)"></div>'
      +'<div><label class="form-label" style="font-size:10px">Data de entrega</label><input class="form-control" type="date" value="'+p.entrega+'" oninput="updProd('+i+',\'entrega\',this.value)"></div>'
      +'<div><label class="form-label" style="font-size:10px">Observa\u00e7\u00f5es</label><input class="form-control" type="text" value="'+escHtml(p.obs)+'" placeholder="Opcional" oninput="updProd('+i+',\'obs\',this.value)"></div>'
      +'</div></div>';
  }).join('');
}

window.updProd=function(i,campo,val){linhasProd[i][campo]=val;};
window.addLinhaProd=function(){
  var maxNum=linhasProd.reduce(function(m,p){return Math.max(m,parseInt(p.num)||0);},0);
  linhasProd.push({id:null,num:maxNum+1,desc:'',val:'',venc:'',entrega:'',sit:'pendente',obs:''});
  renderLinhasProd();
};
window.remLinhaProd=function(i){linhasProd.splice(i,1);renderLinhasProd();calcSoma();};

function calcSoma(){
  var c=todosContratos.find(function(x){return x.id===contratoModalProdId;});
  var total=c?parseFloat(c.valor_total_brl||0):0;
  var soma=linhasProd.reduce(function(s,p){return s+parseFloat(p.val||0);},0);
  var el=document.getElementById('mp-soma');
  var elD=document.getElementById('mp-diff');
  if(el)el.innerHTML='Soma dos produtos: <strong class="mono">'+fmtBRL(soma)+'</strong>';
  if(elD){
    var diff=total-soma;
    if(Math.abs(diff)<0.01){elD.innerHTML='<span style="color:var(--sucesso);font-weight:600">&#x2714; Valores conferem</span>';}
    else{elD.innerHTML='<span style="color:'+(diff<0?'var(--erro)':'var(--aviso)')+';font-weight:600">'+(diff<0?'Excedido':'Restante')+': '+fmtBRL(Math.abs(diff))+'</span>';}
  }
}

window.salvarProdutos=async function(){
  if(!contratoModalProdId)return;
  // Filtrar apenas os editáveis (excluir pago e aprovado)
  var editaveis=linhasProd.filter(function(p){return p.sit!=='pago'&&p.sit!=='aprovado';});
  var invalidos=editaveis.filter(function(p){return !p.desc.trim()||!p.val;});
  if(invalidos.length){toast('Preencha descrição e valor em todos os produtos.','error');return;}
  toast('Salvando produtos...','info');
  try{
    for(var i=0;i<linhasProd.length;i++){
      var p=linhasProd[i];
      // Pular produtos travados — não enviar update para o banco
      if(p.sit==='pago'||p.sit==='aprovado') continue;
      var dados={contrato_id:contratoModalProdId,numero_produto:parseInt(p.num)||i+1,descricao:p.desc.trim(),valor_brl:parseFloat(p.val)||0,dt_vencimento:p.venc||null,dt_entrega:p.entrega||null,situacao:p.sit,observacoes:p.obs.trim()||null,criado_por:appState.usuario.id};
      if(p.id){var upd=await db.from('contratos_produtos').update(dados).eq('id',p.id);if(upd.error)throw upd.error;}
      else{var ins=await db.from('contratos_produtos').insert(dados).select('id').single();if(ins.error)throw ins.error;linhasProd[i].id=ins.data.id;}
    }
    toast('Produtos salvos!','success');
    var idSalvo=contratoModalProdId;
    fecharModalProd();
    detTabAtiva[idSalvo]='prods';
    await recarregarDet(idSalvo);
  }catch(e){toast('Erro ao salvar: '+(e.message||''),'error');}
};

window.fecharModalProd=function(){
  document.getElementById('modal-produtos').classList.remove('aberto');
  contratoModalProdId=null;
};

window.fecharModal=function(){
  document.getElementById('modal-contrato').classList.remove('aberto');
  contratoEditando=null;filePDF=null;
};
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharModal();});
})();
</script>
