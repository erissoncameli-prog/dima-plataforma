function diasAte(d){if(!d)return null;var h=new Date();h.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-h)/86400000);}

// Tema claro/escuro: mesmo 'diag_tema' da mesa do Diagnóstico, de TDRs, Atividades e Visão Geral (componente .dgm-tema)
function seletorTema(){
  var tb=document.querySelector('.topbar'); if(!tb||tb.querySelector('.dgm-tema')||typeof DiagTema==='undefined')return;
  var d=document.createElement('div');
  d.className='dgm-tema'; d.setAttribute('role','group'); d.setAttribute('aria-label','Tema');
  d.innerHTML=[['claro','sol','Claro'],['escuro','lua','Escuro']].map(function(x){
    return '<button type="button" data-tema="'+x[0]+'" aria-pressed="'+(DiagTema.atual()===x[0])+'">'+ctIc(x[1])+x[2]+'</button>';}).join('');
  var bc=tb.querySelector('.topbar-breadcrumb');
  if(bc)bc.parentNode.insertBefore(d,bc); else tb.appendChild(d);
  d.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-tema]'); if(!b)return;
    DiagTema.definir(b.dataset.tema);
    d.querySelectorAll('[data-tema]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });
}

async function carregar(){
  var rs=await Promise.all([
    db.from('contratos').select('*,fornecedores(id,nome,tipo),atividades(id,codigo,nome_pt),tdrs(id,numero)').order('criado_em',{ascending:false}),
    db.from('atividades').select('id,codigo,nome_pt').order('codigo'),
    db.from('fornecedores').select('id,nome,tipo').order('nome'),
    db.from('tdrs').select('id,numero,objeto_pt,atividade_id').neq('status','cancelado').order('numero')
  ]);
  todosContratos=rs[0].data||[];
  atividades=rs[1].data||[];
  fornecedores=rs[2].data||[];
  tdrs=rs[3].data||[];

  // Preencher filtro de atividades — só as que têm ao menos um contrato
  var filAtiv=document.getElementById('fil-ativ');
  if(filAtiv){
    var atvsComContrato=new Map();
    todosContratos.forEach(function(c){
      if(c.atividade_id&&c.atividades&&!atvsComContrato.has(c.atividade_id)){
        atvsComContrato.set(c.atividade_id,c.atividades);
      }
    });
    // Ordenar por código
    Array.from(atvsComContrato.values())
      .sort(function(a,b){return (a.codigo||'').localeCompare(b.codigo||'');})
      .forEach(function(a){
        var o=document.createElement('option');
        o.value=a.id;
        o.textContent=(a.codigo||'')+' — '+(a.nome_pt||'').substring(0,38);
        filAtiv.appendChild(o);
      });
  }

  // Preencher filtro de fornecedores — só os que têm ao menos um contrato
  var filForn=document.getElementById('fil-forn');
  if(filForn){
    var fornsComContrato=new Map();
    todosContratos.forEach(function(c){
      if(c.fornecedor_id&&c.fornecedores&&!fornsComContrato.has(c.fornecedor_id)){
        fornsComContrato.set(c.fornecedor_id,c.fornecedores.nome||'—');
      }
    });
    Array.from(fornsComContrato.entries())
      .sort(function(a,b){return a[1].localeCompare(b[1]);})
      .forEach(function(entry){
        var o=document.createElement('option');
        o.value=entry[0];
        o.textContent=entry[1].substring(0,45);
        filForn.appendChild(o);
      });
  }

  renderStats();filtrar();
}

let filtroCardCont='';
function clicarCardCont(card){
  filtroCardCont=(filtroCardCont===card)?'':card;
  renderStats();filtrar();
}
window.clicarCardCont=clicarCardCont;

function renderStats(){
  var vig=todosContratos.filter(function(c){return c.status==='vigente';});
  var totC=vig.reduce(function(s,c){return s+parseFloat(c.valor_total_brl||0);},0);
  var totU=vig.reduce(function(s,c){return s+parseFloat(c.valor_utilizado_brl||0);},0);
  var totComp=vig.reduce(function(s,c){return s+parseFloat(c.valor_comprometido_brl||c.valor_utilizado_brl||0);},0);
  var semPDF=todosContratos.filter(function(c){return !c.contrato_assinado_url;}).length;
  var trav=todosContratos.filter(function(c){return c.status==='aguardando_cobertura';});
  var pPago=totC>0?Math.min(totU/totC*100,100):0, pApagar=totC>0?Math.max(0,Math.min(totComp/totC*100,100)-pPago):0;
  function kpi(chave,ic,lbl,val,sub,extra,cls,vcls){
    return '<button type="button" class="ct-kpi'+(cls?' '+cls:'')+'" aria-pressed="'+(filtroCardCont===chave)+'" onclick="clicarCardCont(\''+chave+'\')" title="Clique para filtrar a lista">'
      +'<span class="ct-kpi-l">'+ctIc(ic)+lbl+'</span><span class="ct-kpi-v'+(vcls?' '+vcls:'')+'">'+val+'</span>'+(extra||'')+'<span class="ct-kpi-s">'+sub+'</span></button>';
  }
  document.getElementById('stats').innerHTML=
    kpi('vigente','contrato','Vigentes',vig.length,'de '+todosContratos.length+' contratos')+
    kpi('total','moeda','Contratado (vigentes)',brlc(totC),'soma dos valores totais')+
    kpi('utilizado','check','Pago',brlc(totU),Math.round(pPago)+'% pago · '+Math.round(pApagar)+'% a pagar',
      '<span class="ct-meter"><i style="width:'+pPago.toFixed(1)+'%;background:var(--ct-pago)"></i><i style="width:'+pApagar.toFixed(1)+'%;background:var(--ct-comp)"></i></span>','','ok')+
    kpi('sem_pdf','alerta','Sem PDF assinado',semPDF,semPDF?'clique para ver quais':'todos com PDF',null,semPDF?'alerta':'',semPDF?'erro':'');

  // Faixa dos contratos travados aguardando cobertura do orçamento
  var el=document.getElementById('ct-travados');
  if(el) el.innerHTML=trav.length?'<div class="ct-travado" role="status">'+ctIc('cadeado')
    +'<div class="tx"><b>'+trav.length+' contrato'+(trav.length>1?'s':'')+' aguardando cobertura</b>'
    +esc(trav.slice(0,4).map(function(c){return c.numero;}).join(', ')+(trav.length>4?' e mais '+(trav.length-4):''))
    +(trav.length>1?' passaram':' passou')+' do TDR e o saldo livre da atividade não cobre. Sem produtos, pagamentos ou PDF até liberar.</div>'
    +'<div class="acoes"><button type="button" class="ct-btn peq" onclick="clicarCardCont(\'travado\')" aria-pressed="'+(filtroCardCont==='travado')+'">'+(filtroCardCont==='travado'?'Mostrar todos':'Mostrar')+'</button>'
    +'<a class="ct-btn pri peq" href="remanejamentos.html'+(trav.length===1?'?cobertura='+encodeURIComponent(trav[0].id):'')+'">Pedir cobertura'+ctIc('seta','p')+'</a></div></div>':'';
}

function filtrar(){
  var b=(document.getElementById('busca').value||'').toLowerCase();
  var s=document.getElementById('fil-status').value;
  var fp=document.getElementById('fil-pdf').value;
  var fa=document.getElementById('fil-ativ')?.value||'';
  var ff=document.getElementById('fil-forn')?.value||'';
  var fil=todosContratos.filter(function(c){
    if(s&&c.status!==s)return false;
    if(fp==='com'&&!c.contrato_assinado_url)return false;
    if(fp==='sem'&&c.contrato_assinado_url)return false;
    if(fa&&c.atividade_id!==fa)return false;
    if(ff&&c.fornecedor_id!==ff)return false;
    if(b&&!((c.numero+' '+(c.objeto_pt||'')+' '+(c.fornecedores?c.fornecedores.nome:'')).toLowerCase()).includes(b))return false;
    if(filtroCardCont==='vigente'&&c.status!=='vigente')return false;
    if(filtroCardCont==='utilizado'&&!(parseFloat(c.valor_utilizado_brl||0)>0))return false;
    if(filtroCardCont==='sem_pdf'&&c.contrato_assinado_url)return false;
    if(filtroCardCont==='travado'&&c.status!=='aguardando_cobertura')return false;
    return true;
  });
  document.getElementById('cont').textContent=fil.length+' de '+todosContratos.length+' contratos';
  var tbody=document.getElementById('tbody');
  var empty=document.getElementById('tbl-empty');
  if(!fil.length){
    tbody.innerHTML='';
    empty.innerHTML='<div class="ct-vazio">Nenhum contrato encontrado com esses filtros.</div>';
    return;
  }
  empty.innerHTML='';
  tbody.innerHTML=fil.map(function(c){return renderLinha(c);}).join('');
}
window.filtrar=filtrar;

function renderLinha(c){
  var total=parseFloat(c.valor_total_brl||0);
  var usado=parseFloat(c.valor_utilizado_brl||0);          // apenas PAGO
  var comp=parseFloat(c.valor_comprometido_brl||usado);     // pago + a pagar
  var pPago=total>0?Math.min(usado/total*100,100):0;
  var pComp=total>0?Math.min(comp/total*100,100):0;
  var dias=diasAte(c.dt_fim);
  var vencido=dias!==null&&dias<0&&c.status==='vigente';
  var temPDF=!!c.contrato_assinado_url;
  var temTrad=!!c.contrato_pt_url;
  var aberto=!!expandidos[c.id];
  var vigTxt=c.status!=='vigente'||dias===null?'':(vencido?'vencido há '+Math.abs(dias)+' dia'+(Math.abs(dias)!==1?'s':''):dias===0?'vence hoje':'vence em '+dias+' dia'+(dias!==1?'s':''));
  var vigCls=vencido?'vencido':(dias!==null&&dias<=30&&c.status==='vigente'?'perto':'');

  var main='<tr class="main-row'+(aberto?' aberto':'')+'">'
    +'<td><button type="button" class="xbtn'+(aberto?' aberto':'')+'" id="xb-'+c.id+'" onclick="toggleDet(\''+c.id+'\')" aria-expanded="'+aberto+'" aria-controls="det-'+c.id+'" aria-label="Detalhes do contrato '+esc(c.numero)+'">'+ctIc('chev')+'</button></td>'
    +'<td><span class="ct-cod">'+esc(c.numero)+'</span>'+(c.numero_sei?'<div class="ct-sei" title="Processo SEI">SEI '+esc(c.numero_sei)+'</div>':'')+'</td>'
    +'<td class="c-obj"><div class="ct-obj" title="'+esc(c.objeto_pt||'')+'">'+esc(c.objeto_pt||'—')+'</div>'
      +(vencido||pPago>90?'<div class="ct-selos">'+(vencido?'<span class="ct-pill ct-p-er">'+ctIc('relogio','p')+'Vencido</span>':'')

  return main+det;

function cardDoc(cls,ic,nome,meta,url){
  return '<div class="pdf-card"><div class="pdf-card-icon '+cls+'">'+ctIc(ic)+'</div>'
    +'<div style="min-width:0"><div class="pdf-card-nome" title="'+esc(nome)+'">'+esc(nome)+'</div><div class="pdf-card-meta">'+meta+'</div></div>'
    +'<div class="pdf-card-btns"><a href="#" class="ct-btn ic" data-arquivo="'+esc(url)+'" title="Abrir" aria-label="Abrir '+esc(nome)+'">'+ctIc('olho','p')+'</a></div></div>';

function buildDet(c){
  var total=parseFloat(c.valor_total_brl||0);
  var usado=parseFloat(c.valor_utilizado_brl||0);      // apenas PAGO
  var comprometido=parseFloat(c.valor_comprometido_brl||0); // pago + a_pagar
  var saldo=parseFloat(c.saldo_brl||(total-usado));
  var prods=produtosPorContrato[c.id]||[];
  var qtdProd=prods.length;
  var qtdPend=prods.filter(function(p){return p.situacao==='pendente'||p.situacao==='em_analise';}).length;
  var tabAtiva=detTabAtiva[c.id]||'docs';
  var qtdEnt=(entregasPorContrato[c.id]||[]).length;

  var h='<div class="det-tabs" role="tablist">'
    +'<button type="button" role="tab" aria-selected="'+(tabAtiva==='docs')+'" class="det-tab'+(tabAtiva==='docs'?' ativo':'')+'" onclick="mudarDetTab(\''+c.id+'\',\'docs\')">Detalhes e documentos</button>'
    +'<button type="button" role="tab" aria-selected="'+(tabAtiva==='prods')+'" class="det-tab'+(tabAtiva==='prods'?' ativo':'')+'" onclick="mudarDetTab(\''+c.id+'\',\'prods\')">Produtos'+(qtdProd?' <span class="n">'+qtdProd+'</span>':'')+'</button>'
    +'<button type="button" role="tab" aria-selected="'+(tabAtiva==='entregas')+'" class="det-tab'+(tabAtiva==='entregas'?' ativo':'')+'" onclick="mudarDetTab(\''+c.id+'\',\'entregas\')">Histórico de entregas'+(qtdEnt?' <span class="n">'+qtdEnt+'</span>':'')+'</button>'
    +'</div>';

  if(tabAtiva==='entregas'){
    h+=buildTabEntregas(c);
  } else if(tabAtiva==='docs'){
    h+='<div class="detail-grid">'
      +'<div class="detail-item"><span class="detail-lbl">TDR vinculado</span><span class="detail-val">'+esc(c.tdrs?c.tdrs.numero:'—')+'</span></div>'
      +'<div class="detail-item"><span class="detail-lbl">Atividade</span><span class="detail-val">'+esc(c.atividades?c.atividades.codigo:'—')+'</span></div>'
      +'<div class="detail-item"><span class="detail-lbl">Tipo</span><span class="detail-val" style="font-family:var(--font-sans)">'+esc(c.tipo||'—')+'</span></div>'
      +'<div class="detail-item"><span class="detail-lbl">Pago (efetivado)</span><span class="detail-val ok">'+fmtBRL(usado)+'</span></div>'
      +'<div class="detail-item"><span class="detail-lbl" title="Pago + a pagar">Comprometido (pago + a pagar)</span><span class="detail-val">'+fmtBRL(comprometido)+'</span></div>'
      +'<div class="detail-item"><span class="detail-lbl">Saldo disponível</span><span class="detail-val'+(saldo<0?' erro':'')+'">'+fmtBRL(saldo)+'</span></div>'
      +'<div class="detail-item"><span class="detail-lbl">Elemento de despesa</span><span class="detail-val">'+esc(c.elemento_despesa||'—')+'</span></div>'
      +'</div>';
    h+='<div class="ct-eyebrow">Documentos</div><div class="pdf-row">';
    if(c.contrato_assinado_url){
      h+=cardDoc('en','doc',c.contrato_assinado_nome||'Contrato EN','Original EN'+(c.contrato_assinado_data?' · '+fmtData(c.contrato_assinado_data):''),c.contrato_assinado_url);
    } else {
      h+='<div class="pdf-card falta"><div class="pdf-card-icon vazio">'+ctIc('doc')+'</div>'
        +'<div style="min-width:0"><div class="pdf-card-nome">PDF original (EN) ausente</div><div class="pdf-card-meta">Contrato assinado pela UNESCO</div></div>'
        +(c.status==='aguardando_cobertura'
          ?'<span class="ct-pill ct-p-er" title="Só depois da cobertura">'+ctIc('cadeado','p')+'Travado</span>'
          :'<label class="ct-btn peq" tabindex="0" style="cursor:pointer">'+ctIc('upload','p')+'Enviar<input type="file" accept=".pdf" style="display:none" onchange="uploadDireto(\''+c.id+'\',this.files[0],\'en\')"></label>')
        +'</div>';
    }
    if(c.contrato_pt_url){
      h+=cardDoc('pt','globo',c.contrato_pt_nome||'Contrato PT','Tradução automática PT'+(c.contrato_pt_data?' · '+new Date(c.contrato_pt_data).toLocaleDateString('pt-BR'):''),c.contrato_pt_url);
    } else if(c.contrato_assinado_url){
      h+='<div class="pdf-card falta"><div class="pdf-card-icon pt">'+ctIc('globo')+'</div>'
        +'<div style="min-width:0"><div class="pdf-card-nome">Tradução PT não gerada</div><div class="pdf-card-meta">A IA traduz o contrato do inglês para o português</div></div>'
        +'<button type="button" class="ct-btn pri peq" id="btn-tr-'+c.id+'" onclick="traduzir(\''+c.id+'\')">'+ctIc('globo','p')+'Traduzir</button>'
        +'</div>';
    } else {
      h+='<div class="pdf-card falta apagado"><div class="pdf-card-icon vazio">'+ctIc('globo')+'</div>'
        +'<div style="min-width:0"><div class="pdf-card-nome">Tradução PT</div><div class="pdf-card-meta">Disponível depois do envio do PDF em inglês</div></div><span></span></div>';
    }
    h+='</div>';
    if(c.objeto_pt)h+='<div class="ct-objeto"><strong>Objeto:</strong> '+esc(c.objeto_pt)+'</div>';
  } else {
    // ABA PRODUTOS
    h+='<div class="ct-prods-hd"><div>';
    if(qtdProd){
      var totProd=prods.reduce(function(s,p){return s+parseFloat(p.valor_brl||0);},0);
      var totPago=prods.filter(function(p){return p.situacao==='pago';}).reduce(function(s,p){return s+parseFloat(p.valor_brl||0);},0);
      h+='<strong>'+qtdProd+' produto(s)</strong> · Total <span class="mono">'+fmtBRL(totProd)+'</span> · Pago <span class="mono" style="color:var(--ok)">'+fmtBRL(totPago)+'</span>';
      if(qtdPend) h+=' · <span class="ct-pill ct-p-al">'+qtdPend+' pendente(s)</span>';
    } else {
      h+='Nenhum produto cadastrado ainda.';
    }
    h+='</div>';
    if(PODE.verFinanceiro()) h+='<button type="button" class="ct-btn pri peq" onclick="abrirModalProd(\''+c.id+'\')">'+ctIc('lapis','p')+'Gerenciar produtos</button>';
    h+='</div>';

    if(qtdProd){
      h+='<div class="prod-grid">';
      prods.forEach(function(p){
        var vencido=p.situacao==='pendente'&&p.dt_vencimento&&new Date(p.dt_vencimento)<new Date();
        var cor=vencido?'--erro':((PROD_SIT[p.situacao]||[])[2]||'--lin-forte');
        h+='<div class="prod-card'+(p.situacao==='cancelado'?' cancel':'')+'" style="--c:var('+cor+')">'
          +'<span class="prod-num">Produto '+esc(p.numero_produto)+'</span>'
          +'<span class="prod-desc">'+esc(p.descricao)+'</span>'
          +'<span class="prod-valor">'+fmtBRL(parseFloat(p.valor_brl||0))+'</span>'
          +(p.dt_vencimento?'<span class="prod-venc">Vencimento '+fmtData(p.dt_vencimento)+'</span>':'')
          +(p.dt_entrega?'<span class="prod-venc">Entregue '+fmtData(p.dt_entrega)+'</span>':'')
          +(vencido?'<span class="ct-pill ct-p-er">'+ctIc('relogio','p')+'Vencido</span>':pillProd(p.situacao))
          +'</div>';
      });
      h+='</div>';
    } else {
      h+='<div class="ct-vazio">Use "Gerenciar produtos" para cadastrar as entregas previstas neste contrato.</div>';
    }
  }
  return h;
}

window.toggleDet=function(id){
  expandidos[id]=!expandidos[id];
  var det=document.getElementById('det-'+id);
  var inner=document.getElementById('inner-'+id);
  var xb=document.getElementById('xb-'+id);
  var mainRow=det?det.previousElementSibling:null;
  if(!det){expandidos[id]=!expandidos[id];return;}
  det.hidden=!expandidos[id];
  if(expandidos[id]){
    var c=todosContratos.find(function(x){return x.id===id;});
    if(inner&&c)inner.innerHTML=buildDet(c);
  }
  if(xb){xb.classList.toggle('aberto',!!expandidos[id]);xb.setAttribute('aria-expanded',String(!!expandidos[id]));}
  if(mainRow)mainRow.classList.toggle('aberto',!!expandidos[id]);
};

window.uploadDireto=async function(id,file,lang){
  if(!file)return;
  toast('Enviando PDF...','info');
  var path='contratos/'+id+'/'+(lang==='en'?'original':'traduzido')+'_'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  var up=await db.storage.from('contratos-docs').upload(path,file,{upsert:true});
  if(up.error){toast('Erro upload: '+up.error.message,'error');return;}
  var url=db.storage.from('contratos-docs').getPublicUrl(path).data.publicUrl;
  var upd=lang==='en'
    ?{contrato_assinado_url:url,contrato_assinado_nome:file.name,contrato_assinado_data:new Date().toISOString().split('T')[0]}
    :{contrato_pt_url:url,contrato_pt_nome:file.name,contrato_pt_data:new Date().toISOString()};
  var rUp=await db.from('contratos').update(upd).eq('id',id);
  if(rUp.error){toast('Erro: '+rUp.error.message,'error',8000);return;}
  var c=todosContratos.find(function(x){return x.id===id;});
  if(c)Object.assign(c,upd);
  toast('PDF enviado!','success');
  expandidos[id]=false;toggleDet(id);
};

function gerarPdfTraducao(txt,c){
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  var pageW=210,pageH=297,mL=20,mR=20,mT=20,mB=28;
  var cW=pageW-mL-mR;
  var dataHoje=new Date().toLocaleDateString('pt-BR');
  var rodape='Tradução gerada por Inteligência Artificial Claude (Anthropic) em '+dataHoje+' — documento não oficial, sujeito a revisão.';

  function addHeader(pg){
    doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(140);
    doc.text('UNESCO · DIMA · 218BRA2001  |  Contrato Nº '+(c.numero||''),mL,11);
    doc.text('TRADUÇÃO PARA O PORTUGUÊS',pageW/2,11,{align:'center'});
    doc.text('Página '+pg,pageW-mR,11,{align:'right'});
    doc.setDrawColor(180);doc.setLineWidth(0.25);
    doc.line(mL,14,pageW-mR,14);
    doc.setTextColor(0);
  }

  function addFooter(){
    doc.setDrawColor(180);doc.setLineWidth(0.25);
    doc.line(mL,pageH-mB+4,pageW-mR,pageH-mB+4);
    doc.setFontSize(7);doc.setFont('helvetica','italic');doc.setTextColor(130);
    doc.text(rodape,pageW/2,pageH-mB+10,{align:'center',maxWidth:cW});
    doc.setTextColor(0);
  }

  var pg=1;
  addHeader(pg);

  // Bloco título
  doc.setFontSize(13);doc.setFont('helvetica','bold');doc.setTextColor(20);
  doc.text('TRADUÇÃO — '+(c.numero||''),pageW/2,26,{align:'center'});
  doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(80);
  var forn=c.fornecedores&&c.fornecedores.nome?c.fornecedores.nome:'';
  if(forn)doc.text('Fornecedor: '+forn,pageW/2,32,{align:'center'});
  doc.setDrawColor(34,139,84);doc.setLineWidth(0.6);
  doc.line(mL,36,pageW-mR,36);

  var y=42,lh=5.5;
  var paras=txt.split(/\n+/);
  for(var i=0;i<paras.length;i++){
    var para=paras[i].trim();
    if(!para){y+=2;continue;}
    var isHead=/^[A-ZÁÉÍÓÚÀÃÕÂÊÎÔÛÇ0-9][A-ZÁÉÍÓÚÀÃÕÂÊÎÔÛÇ0-9\s\.\-:,\/]{2,79}$/.test(para)&&para===para.toUpperCase()&&para.length<100;
    if(isHead){doc.setFont('helvetica','bold');doc.setFontSize(10);}
    else{doc.setFont('helvetica','normal');doc.setFontSize(9.5);}
    doc.setTextColor(20);
    var lines=doc.splitTextToSize(para,cW);
    var bH=lines.length*lh+(isHead?4:3);
    if(y+bH>pageH-mB){
      addFooter();doc.addPage();pg++;addHeader(pg);y=mT+4;
    }
    if(isHead)y+=2;
    doc.text(lines,mL,y);
    y+=lines.length*lh+(isHead?4:3);
  }
  addFooter();
  return doc.output('arraybuffer');
}

window.traduzir=async function(id){
  var c=todosContratos.find(function(x){return x.id===id;});
  if(!c||!c.contrato_assinado_url){toast('PDF original nao encontrado.','error');return;}
  var btn=document.getElementById('btn-tr-'+id);
  if(btn){btn.textContent='Traduzindo...';btn.disabled=true;}
  toast('Traduzindo com IA -- aguarde ate 30 segundos...','info',30000);
  try{
    var SB_URL='https://wfymnmlinonvdqfucjya.supabase.co';
    var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmeW1ubWxpbm9udmRxZnVjanlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MzM1NzksImV4cCI6MjA5MDMwOTU3OX0.eC6T9VQ6OzF9mISEGy_pgbIbrOAnG4xp2z6WN-sCMt8';
    var efResp=await fetch(SB_URL+'/functions/v1/traduzir-contrato',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify({pdf_url:c.contrato_assinado_url})
    });
    var efData=await efResp.json();
    if(!efData.ok)throw new Error(efData.erro||'Erro na traducao');
    var txt=efData.traducao||'';
    if(!txt||txt.trim().length<50)throw new Error('Traducao retornada vazia.');

    // Gerar PDF formatado com rodape IA
    var pdfBuffer=gerarPdfTraducao(txt,c);
    var nomeBase=(c.contrato_assinado_nome||'contrato').replace(/\.(pdf|docx)$/i,'');
    var nomeTrad=nomeBase+'_PT_traduzido.pdf';
    var blobTrad=new Blob([pdfBuffer],{type:'application/pdf'});
    var path='contratos/'+id+'/'+nomeTrad;
    var upR=await db.storage.from('contratos-docs').upload(path,blobTrad,{upsert:true,contentType:'application/pdf'});
    if(upR.error)throw new Error('Erro upload: '+upR.error.message);
    var urlTrad=db.storage.from('contratos-docs').getPublicUrl(path).data.publicUrl;

    var dbR=await db.from('contratos').update({
      contrato_pt_url:urlTrad,
      contrato_pt_nome:nomeTrad,
      contrato_pt_data:new Date().toISOString()
    }).eq('id',id);
    if(dbR.error)throw new Error('Erro banco: '+dbR.error.message);

    Object.assign(c,{contrato_pt_url:urlTrad,contrato_pt_nome:nomeTrad,contrato_pt_data:new Date().toISOString()});
    toast('Contrato traduzido e salvo como PDF!','success');
    expandidos[id]=false;toggleDet(id);
  }catch(e){
    console.error('Erro traducao:',e);
    toast('Erro: '+e.message,'error',8000);
    if(btn){btn.textContent='Traduzir';btn.disabled=false;}
  }
};

window.preencherAtiv=function(){
  var tId=document.getElementById('f-tdr').value;
  if(!tId)return;
  var t=tdrs.find(function(x){return x.id===tId;});
  if(!t||!t.atividade_id)return;
  document.getElementById('f-ativ').value=t.atividade_id;
};
window.selPDF=function(files){
  if(!files||!files[0])return;
  filePDF=files[0];
  document.getElementById('pdf-prev').innerHTML=
    '<div class="ct-arq">'+ctIc('doc','p')+'<span style="font-weight:600">'+esc(filePDF.name)+'</span>'+
    '<span>('+Math.round(filePDF.size/1024)+' KB)</span></div>';
};
window.dropPDF=function(e){selPDF(e.dataTransfer.files);};

window.salvar=async function(){
  var num=(document.getElementById('f-num').value||'').trim();
  var fornId=document.getElementById('f-forn').value;
  var total=parseFloat(document.getElementById('f-total').value)||0;
  var sei=(document.getElementById('f-sei').value||'').trim();
  if(!num||!fornId||!total){toast('Preencha numero, fornecedor e valor total.','error');return;}
  if(!sei){toast('Preencha o Número SEI.','error');document.getElementById('f-sei').focus();return;}
  var dados={
    numero:num,fornecedor_id:fornId,
    tdr_id:document.getElementById('f-tdr').value||null,
    atividade_id:document.getElementById('f-ativ').value||null,
    objeto_pt:document.getElementById('f-objeto').value.trim()||null,
    tipo:document.getElementById('f-tipo').value||null,
    valor_total_brl:total,
    dt_inicio:document.getElementById('f-inicio').value||null,
    dt_fim:document.getElementById('f-fim').value||null,
    elemento_despesa:document.getElementById('f-elem').value.trim()||null,
    status:document.getElementById('f-status').value,
    numero_sei:sei||null,
  };
  // saldo_brl é GENERATED ALWAYS no banco, não enviar
  // valor_utilizado_brl vem dos lançamentos do Financeiro: a tela não grava (só leitura); contrato novo nasce com 0
  if(!contratoEditando)dados.valor_utilizado_brl=0;

  // Encerrando um contrato que ainda tem produtos não entregues/aprovados:
  // exige justificativa formal antes de liberar o saldo não executado para a atividade.
  if(contratoEditando&&dados.status==='encerrado'&&contratoEditando.status!=='encerrado'){
    var todosProds=await carregarProdutos(contratoEditando.id);
    var afetados=todosProds.filter(function(p){return ['pendente','em_analise','entrega_parcial','devolvido'].includes(p.situacao);});
    if(afetados.length){
      abrirModalEncerramento(dados,afetados);
      return;
    }
  }

  await executarSalvarContrato(dados);
};

// Contrato travado: dispara já o e-mail do aviso (rem_11); o cron reenvia o que falhar.
async function enviarAvisoCobertura(){
  try{
    const {data:{session}}=await db.auth.getSession();
    fetch(SUPABASE_URL+'/functions/v1/assinar-remanejamento',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session?.access_token||''),'apikey':SUPABASE_ANON_KEY},
      body:JSON.stringify({acao:'drenar'})}).catch(function(){});
  }catch(e){}
}

async function executarSalvarContrato(dados){
  var prog=document.getElementById('prog-bar');
  var fill=document.getElementById('prog-fill');
  if(prog)prog.style.display='block';
  if(fill)fill.style.width='20%';
  try{
    var cId;
    if(!contratoEditando){
      var ins=await db.from('contratos').insert(Object.assign({},dados,{criado_por:appState.usuario.id})).select('*,fornecedores(id,nome,tipo),atividades(id,codigo,nome_pt),tdrs(id,numero)').single();
      if(ins.error)throw ins.error;
      todosContratos.unshift(ins.data);cId=ins.data.id;
      if(ins.data.status==='aguardando_cobertura'){
        toast('Contrato '+ins.data.numero+' criado, mas TRAVADO: o valor acima do TDR não cabe no saldo da atividade. Peça cobertura em Remanejamento.','warning',10000);
        enviarAvisoCobertura();
        if(filePDF){toast('PDF assinado não anexado: só após a cobertura.','warning',8000);filePDF=null;}
      } else toast('Contrato '+ins.data.numero+' criado!','success');
    } else {
      var upd2=await db.from('contratos').update(dados).eq('id',contratoEditando.id).select('status').single();
      if(upd2.error)throw upd2.error;
      cId=contratoEditando.id;
      var f2=fornecedores.find(function(f){return f.id===dados.fornecedor_id;});
      var a2=atividades.find(function(a){return a.id===dados.atividade_id;});
      // o status final vem do banco (aditivo acima do saldo trava; cobertura libera)
      Object.assign(contratoEditando,dados,{status:upd2.data.status,fornecedores:f2||null,atividades:a2||null});
      if(upd2.data.status==='aguardando_cobertura'){
        toast('Contrato salvo, mas TRAVADO aguardando cobertura do orçamento. Peça cobertura em Remanejamento.','warning',10000);
        enviarAvisoCobertura();
        if(filePDF){toast('PDF assinado não anexado: só após a cobertura.','warning',8000);filePDF=null;}
      } else toast('Contrato atualizado!','success');
    }
    if(fill)fill.style.width='60%';
    if(filePDF&&cId){
      var path='contratos/'+cId+'/original_'+Date.now()+'_'+filePDF.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      var up=await db.storage.from('contratos-docs').upload(path,filePDF,{upsert:true});
      if(!up.error){
        var url=db.storage.from('contratos-docs').getPublicUrl(path).data.publicUrl;
        await db.from('contratos').update({contrato_assinado_url:url,contrato_assinado_nome:filePDF.name,contrato_assinado_data:new Date().toISOString().split('T')[0]}).eq('id',cId);
        var c2=todosContratos.find(function(x){return x.id===cId;});
        if(c2){c2.contrato_assinado_url=url;c2.contrato_assinado_nome=filePDF.name;}
      } else toast('Aviso: erro no upload do PDF -- '+up.error.message,'error');
    }
    if(fill)fill.style.width='100%';
    fecharModal();renderStats();filtrar();
    return cId;
  }catch(e){
    if(e.code==='23505')toast('Numero de contrato ja cadastrado.','error');
    else toast('Erro: '+(e.message||''),'error');
    if(prog)prog.style.display='none';
    throw e;
  }
}

// ── ENCERRAMENTO COM SALDO NÃO EXECUTADO ─────────────────────
var dadosEncerramentoPendente=null,produtosEncerramentoPendente=null;

function calcNaoExecutado(p){
  return Math.max(0,parseFloat(p.valor_brl||0)-parseFloat(p.valor_aprovado||0));
}

window.abrirModalEncerramento=function(dados,afetados){
  dadosEncerramentoPendente=dados;
  produtosEncerramentoPendente=afetados;
  document.getElementById('me-sub').textContent='Contrato '+contratoEditando.numero+(contratoEditando.fornecedores?' · '+contratoEditando.fornecedores.nome:'');
  var atv=atividades.find(function(a){return a.id===dados.atividade_id;});

  var linhas=afetados.map(function(p,i){
    var naoExec=calcNaoExecutado(p);
    return '<label class="ct-enc-it"><input type="checkbox" class="chk-prod-enc" data-idx="'+i+'" checked onchange="recalcLiberado()">'
      +'<span><b>Produto '+esc(p.numero_produto||'?')+' — '+esc((p.descricao||'').substring(0,70))+'</b><br>'+pillProd(p.situacao)+'</span>'
      +'<b class="mono" title="Não executado">'+fmtBRL(naoExec)+'</b></label>';
  }).join('');

  document.getElementById('me-body').innerHTML=
    '<p class="ct-enc-intro"><strong>'+afetados.length+' produto(s)</strong> ainda não foram entregues ou aprovados. Os marcados serão cancelados e o que não foi executado volta para o saldo da atividade, permitindo nova contratação. Desmarque os que <u>não</u> devem ser cancelados.</p>'
    +'<div>'+linhas+'</div>'
    +'<div class="ct-lib"><span>Volta para a atividade'+(atv?' '+esc(atv.codigo):'')+'</span><b id="me-valor-liberado"></b></div>'
    +'<div class="form-group"><label class="form-label" for="me-motivo">Justificativa do encerramento <span class="obrig">*</span></label>'
    +'<textarea class="form-control" id="me-motivo" rows="3" oninput="contarMotivo()" placeholder="Ex.: Fornecedor não entregou os produtos 03, 04 e 05 no prazo contratual (encerrado em DD/MM/AAAA). Saldo remanescente devolvido para nova contratação."></textarea>'
    +'<div class="ct-contador" id="me-contador"></div></div>';

  recalcLiberado();contarMotivo();
  ctAbrir('modal-encerramento');
};

window.contarMotivo=function(){
  var n=(document.getElementById('me-motivo').value||'').trim().length;
  var el=document.getElementById('me-contador');
  if(el){el.textContent=n+' caractere'+(n!==1?'s':'')+' · mínimo 20 · fica no histórico do contrato';el.classList.toggle('curto',n<20);}
};

window.recalcLiberado=function(){
  var total=0;
  document.querySelectorAll('.chk-prod-enc').forEach(function(chk){
    if(chk.checked){
      var p=produtosEncerramentoPendente[parseInt(chk.dataset.idx)];
      total+=calcNaoExecutado(p);
    }
  });
  var el=document.getElementById('me-valor-liberado');
  if(el)el.textContent=fmtBRL(total);
  var b=document.getElementById('me-btn');
  if(b)b.textContent='Encerrar e liberar '+fmtBRL(total);
};

window.fecharModalEncerramento=function(){
  ctFechar('modal-encerramento');
  dadosEncerramentoPendente=null;produtosEncerramentoPendente=null;
};

window.confirmarEncerramento=async function(){
  var motivo=(document.getElementById('me-motivo').value||'').trim();
  if(!motivo||motivo.length<20){toast('Descreva a justificativa do encerramento (mínimo 20 caracteres).','error');return;}

  var selecionados=[];
  document.querySelectorAll('.chk-prod-enc').forEach(function(chk){
    if(chk.checked)selecionados.push(produtosEncerramentoPendente[parseInt(chk.dataset.idx)]);
  });

  var valorLiberadoBrl=selecionados.reduce(function(s,p){return s+calcNaoExecutado(p);},0);
  // US$ = R$ ÷ PTAX do dia, calculado no banco (trg_encerramento_ptax, rem_09) — cotação nunca vem do navegador

  var dados=dadosEncerramentoPendente;
  var atividadeId=dados.atividade_id;
  var contratoId=contratoEditando.id;

  try{
    await executarSalvarContrato(dados);

    var idsCancelar=selecionados.filter(function(p){return !(parseFloat(p.valor_aprovado||0)>0);}).map(function(p){return p.id;});
    if(idsCancelar.length){
      var updProd=await db.from('contratos_produtos').update({situacao:'cancelado',atualizado_em:new Date().toISOString()}).in('id',idsCancelar);
      if(updProd.error)throw updProd.error;
    }

    var snapshot=selecionados.map(function(p){
      return {id:p.id,numero_produto:p.numero_produto,descricao:p.descricao,valor_brl:parseFloat(p.valor_brl||0),valor_aprovado:parseFloat(p.valor_aprovado||0),valor_nao_executado:calcNaoExecutado(p),situacao_anterior:p.situacao};
    });
    var insEnc=await db.from('contrato_encerramentos').insert({
      contrato_id:contratoId,atividade_id:atividadeId||null,
      valor_liberado_brl:valorLiberadoBrl,
      motivo:motivo,produtos_afetados:snapshot,autorizado_por:appState.usuario.id
    });
    if(insEnc.error)throw insEnc.error;

    toast('Contrato encerrado. '+fmtBRL(valorLiberadoBrl)+' liberado(s) para a atividade.','success',7000);
    fecharModalEncerramento();
    await recarregarDet(contratoId);
  }catch(e){
    toast('Erro ao encerrar contrato: '+(e.message||''),'error');
  }
};

// ── ESTADO PRODUTOS / ENTREGAS ────────────────────────────────
var produtosPorContrato={};
var entregasPorContrato={};
var detTabAtiva={};
var contratoModalProdId=null;

async function carregarProdutos(contratoId){
  var r=await db.from('contratos_produtos').select('*').eq('contrato_id',contratoId).order('numero_produto',{ascending:true});
  produtosPorContrato[contratoId]=r.data||[];
  return produtosPorContrato[contratoId];
}

window.mudarDetTab=async function(contratoId,tab){
  detTabAtiva[contratoId]=tab;
  if(tab==='prods'&&!produtosPorContrato[contratoId])await carregarProdutos(contratoId);
  if(tab==='entregas'){
    if(!produtosPorContrato[contratoId])await carregarProdutos(contratoId);
    await carregarEntregas(contratoId);
  }
  var c=todosContratos.find(function(x){return x.id===contratoId;});
  var inner=document.getElementById('inner-'+contratoId);
  if(inner&&c)inner.innerHTML=buildDet(c);
};

async function recarregarDet(contratoId){
  await carregarProdutos(contratoId);
  if(entregasPorContrato[contratoId]!==undefined)await carregarEntregas(contratoId);
  var c=todosContratos.find(function(x){return x.id===contratoId;});
  var inner=document.getElementById('inner-'+contratoId);
  if(inner&&c)inner.innerHTML=buildDet(c);
}

async function carregarEntregas(contratoId){
  var prods=produtosPorContrato[contratoId]||[];
  if(!prods.length){entregasPorContrato[contratoId]=[];return [];}
  var ids=prods.map(function(p){return p.id;});
  var r=await db.from('contratos_produtos_entregas')
    .select('*,criado_por_u:usuarios!contratos_produtos_entregas_criado_por_fkey(nome_completo),despachado_por_u:usuarios!contratos_produtos_entregas_despachado_por_fkey(nome_completo),lancamento:execucao_financeira!contratos_produtos_entregas_lancamento_id_fkey(id,situacao,valor_brl,dt_pagamento,pago_por_u:usuarios!execucao_financeira_pago_por_fkey(nome_completo)),documentos:entrega_documentos(*)')
    .in('produto_id',ids)
    .order('criado_em',{ascending:true});
  if(r.error){console.error('[carregarEntregas]',r.error);entregasPorContrato[contratoId]=[];return [];}
  entregasPorContrato[contratoId]=r.data||[];
  return entregasPorContrato[contratoId];
}

function buildTabEntregas(c){
  if(!entregasPorContrato[c.id]){
    setTimeout(async function(){
      if(!produtosPorContrato[c.id])await carregarProdutos(c.id);
      await carregarEntregas(c.id);
      var inner=document.getElementById('inner-'+c.id);
      if(inner)inner.innerHTML=buildDet(c);
    },0);
    return '<div class="ct-vazio" role="status">Carregando entregas…</div>';
  }
  var prods=produtosPorContrato[c.id]||[];
  var entregas=entregasPorContrato[c.id]||[];

  if(!prods.length)return '<div class="ent-vazia">Nenhum produto cadastrado.</div>';

  var h='<div class="ct-prods-hd"><div>'+
    (entregas.length?'<strong>'+entregas.length+'</strong> entrega(s) registrada(s) neste contrato.':'Nenhuma entrega registrada ainda.')+
    '</div></div>';

  prods.forEach(function(p){
    var pe=entregas.filter(function(e){return e.produto_id===p.id;});
    var valorTotalProd=parseFloat(p.valor_brl||0);
    var valorAprovProd=parseFloat(p.valor_aprovado||0);
    var naoExecProd=Math.max(0,valorTotalProd-valorAprovProd);
    var ehParcial=p.situacao==='entrega_parcial'&&valorAprovProd>0&&naoExecProd>0;
    var valorHtml=ehParcial
      ?'<span class="mono">'+fmtBRL(valorAprovProd)+' <span style="color:var(--txt-3)">de '+fmtBRL(valorTotalProd)+'</span></span>'
      :'<span class="mono">'+fmtBRL(valorTotalProd)+'</span>';
    h+='<div class="ent-bloco">';
    h+='<div class="ent-prod-header">'
      +'<span class="ent-num">#'+esc(p.numero_produto)+'</span>'
      +'<span class="ent-prod-title" title="'+escHtml(p.descricao)+'">'+escHtml(p.descricao)+'</span>'
      +valorHtml+pillProd(p.situacao)
      +'</div>';
    if(ehParcial){
      h+='<div class="ent-parcial">Pago parcialmente: <strong>'+fmtBRL(valorAprovProd)+'</strong> aprovado · <strong>'+fmtBRL(naoExecProd)+'</strong> não executado'
        +(p.pct_aprovado!=null?' ('+parseFloat(p.pct_aprovado)+'%)':'')+'</div>';
    }
    if(!pe.length){
      h+='<div class="ent-vazia">Nenhuma entrega registrada.</div>';
    } else {
      pe.forEach(function(e,ei){
        var se=ENT_SIT[e.situacao]||[e.situacao||'—','ct-p-ne'];
        h+='<div class="ent-item">';
        h+='<div class="ent-row">'
          +'<span class="ent-num">Entrega '+(ei+1)+'</span>'
          +(e.dt_entrega?'<span>'+fmtData(e.dt_entrega)+'</span>':'')
          +'<span class="ct-pill '+se[1]+'">'+esc(se[0])+'</span>'
          +(e.pct_entregue&&e.pct_entregue<100?'<span style="color:var(--txt-3)">'+esc(e.pct_entregue)+'%</span>':'')
          +'</div>';
        var temQuem=e.criado_por_u||e.despachado_por_u||(e.lancamento&&e.lancamento.dt_pagamento);
        if(temQuem){
          h+='<div class="ent-quem">';
          if(e.criado_por_u&&e.criado_por_u.nome_completo){
            h+='<div class="ent-quem-item"><span class="ent-quem-lbl">Carregou</span><span>'+escHtml(e.criado_por_u.nome_completo)+'</span></div>';
          }
          if(e.despachado_por_u&&e.despachado_por_u.nome_completo){
            var lblDesp=e.situacao==='devolvida'?'Devolveu':e.situacao==='em_analise'?'Enviou para análise':'Aprovou';
            h+='<div class="ent-quem-item"><span class="ent-quem-lbl">'+lblDesp+'</span><span>'+escHtml(e.despachado_por_u.nome_completo)+'</span>'
              +(e.despacho_data?'<span class="ent-quem-data">em '+fmtData(e.despacho_data)+'</span>':'')
              +'</div>';
          }
          if(e.lancamento&&e.lancamento.dt_pagamento){
            var pagNome=e.lancamento.pago_por_u&&e.lancamento.pago_por_u.nome_completo?e.lancamento.pago_por_u.nome_completo:'';
            h+='<div class="ent-quem-item"><span class="ent-quem-lbl">Pagamento</span>'
              +(pagNome?'<span>'+escHtml(pagNome)+'</span>':'')
              +'<span class="ent-quem-data">em '+fmtData(e.lancamento.dt_pagamento)+'</span></div>';
          }
          h+='</div>';
        }
        var temLinks=e.despacho_numero||e.nota_tecnica_url||(e.documentos&&e.documentos.length);
        if(temLinks){
          h+='<div class="ent-links">';
          if(e.despacho_numero){
            h+='<span class="ent-link ent-link-desp">'+ctIc('despacho','p')+'Despacho '+escHtml(e.despacho_numero)
              +(e.despacho_data?' · '+fmtData(e.despacho_data):'')+'</span>';
          }
          if(e.nota_tecnica_url){
            h+='<a href="#" data-arquivo="'+esc(e.nota_tecnica_url)+'" class="ent-link ent-link-nt">'+ctIc('doc','p')
              +escHtml(e.nota_tecnica_nome||'Nota Técnica')+'</a>';
          }
          if(e.documentos&&e.documentos.length){
            e.documentos.forEach(function(d){
              if(d.arquivo_url){
                h+='<a href="#" data-arquivo="'+esc(d.arquivo_url)+'" class="ent-link">'+ctIc('clipe','p')
                  +escHtml(d.tipo_documento||d.arquivo_nome||'Documento')+'</a>';
              }
            });
          }
          h+='</div>';
        }
        h+='</div>'; // ent-item
      });
    }
    h+='</div>'; // ent-bloco
  });
  return h;
}

window.abrirModalProd=async function(contratoId){
  contratoModalProdId=contratoId;
  var c=todosContratos.find(function(x){return x.id===contratoId;});
  if(!c)return;
  document.getElementById('mp-titulo').textContent='Produtos do contrato '+c.numero;
  document.getElementById('mp-sub').textContent=(c.fornecedores?c.fornecedores.nome:'')+(c.objeto_pt?' · '+c.objeto_pt.substring(0,60):'');
  document.getElementById('mp-footer').innerHTML='<button type="button" class="ct-btn" onclick="fecharModalProd()">Fechar</button><button type="button" class="ct-btn pri" onclick="salvarProdutos()">Salvar produtos</button>';
  var prods=produtosPorContrato[contratoId];
  if(!prods)prods=await carregarProdutos(contratoId);
  var pa=await db.rpc('fn_pode_avaliar_contrato',{p_contrato_id:contratoId});
  podeAvaliarProd=!pa.error&&pa.data===true;
  renderFormProd(c,prods);
  ctAbrir('modal-produtos');
};

var linhasProd=[];
var podeAvaliarProd=false; // fn_pode_avaliar_contrato: responsável/substituto da atividade ou super_admin

function renderFormProd(c,prods){
  linhasProd=prods.length
    ?prods.map(function(p){return{id:p.id,num:p.numero_produto,desc:p.descricao,val:p.valor_brl,venc:p.dt_vencimento||'',entrega:p.dt_entrega||'',sit:p.situacao,obs:p.observacoes||''};})
    :[{id:null,num:1,desc:'',val:'',venc:'',entrega:'',sit:'pendente',obs:''}];
  var total=parseFloat(c.valor_total_brl||0);
  document.getElementById('mp-body').innerHTML=
    '<div class="ct-somas">'
    +'<span>Valor do contrato: <strong class="mono">'+fmtBRL(total)+'</strong></span>'
    +'<span id="mp-soma">Soma dos produtos: <strong class="mono">—</strong></span>'
    +'<span id="mp-diff"></span></div>'
    +'<div id="prod-linhas"></div>'
    +'<button type="button" class="ct-btn" style="margin-top:8px" onclick="addLinhaProd()">'+ctIc('mais','p')+'Adicionar produto</button>';
  renderLinhasProd();
  calcSoma(total);
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderLinhasProd(){
  var container=document.getElementById('prod-linhas');
  if(!container)return;
  // registrar entrega/aprovar é do responsável da atividade (o banco recusa os demais: trg_cp_guarda_situacao)
  var SIT0=podeAvaliarProd?['pendente','em_analise','aprovado','cancelado']:['pendente','cancelado'];
  var SLBL={pendente:'Pendente',em_analise:'Em análise',aprovado:'Aprovado',pago:'Pago',cancelado:'Cancelado',devolvido:'Devolvido',entrega_parcial:'Entrega parcial'};

  container.innerHTML=linhasProd.map(function(p,i){
    var isPago    = p.sit==='pago';
    var isAprovado= p.sit==='aprovado';
    if(isPago||isAprovado){
      return '<div class="ct-prod-ed travado">'
        +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">'
        +'<span class="ct-cod">Produto '+esc(p.num)+'</span>'
        +(isPago?'<span class="ct-pill ct-p-ok">'+ctIc('cadeado','p')+'Pago · bloqueado para edição</span>':'<span class="ct-pill ct-p-ok">'+ctIc('check','p')+'Aprovado · aguardando pagamento no Financeiro</span>')
        +'</div>'
        +'<div class="ct-prod-trav">'
        +'<div class="d">'+escHtml(p.desc)+'</div>'
        +'<div class="mono" style="font-size:13px;font-weight:500">'+fmtBRL(parseFloat(p.val||0))+'</div>'
        +(p.venc?'<div style="font-size:12px;color:var(--txt-3)">Vencimento '+fmtData(p.venc)+'</div>':'<div></div>')
        +'</div></div>';
    }
    var SIT=SIT0.indexOf(p.sit)<0&&SLBL[p.sit]?SIT0.concat([p.sit]):SIT0;
    return '<div class="ct-prod-ed'+(p.sit==='cancelado'?' cancel':'')+'">'
      +'<div class="ct-prod-g1">'
      +'<div><label class="form-label" for="pp-num-'+i+'">Nº</label><input class="form-control" id="pp-num-'+i+'" type="number" min="1" value="'+esc(p.num)+'" oninput="updProd('+i+',\'num\',this.value)" style="font-family:var(--font-mono)"></div>'
      +'<div><label class="form-label" for="pp-desc-'+i+'">Descrição <span class="obrig">*</span></label><input class="form-control" id="pp-desc-'+i+'" type="text" value="'+escHtml(p.desc)+'" placeholder="Ex.: Relatório técnico final" oninput="updProd('+i+',\'desc\',this.value)"></div>'
      +'<div><label class="form-label" for="pp-val-'+i+'">Valor R$ <span class="obrig">*</span></label><input class="form-control" id="pp-val-'+i+'" type="number" step="0.01" value="'+esc(p.val)+'" placeholder="0,00" oninput="updProd('+i+',\'val\',this.value);calcSoma()" style="font-family:var(--font-mono)"></div>'
      +'<div><label class="form-label" for="pp-sit-'+i+'">Situação</label><select class="form-control" id="pp-sit-'+i+'" onchange="updProd('+i+',\'sit\',this.value);renderLinhasProd()">'
      +SIT.map(function(s){return '<option value="'+s+'" '+(p.sit===s?'selected':'')+'>'+SLBL[s]+'</option>';}).join('')+'</select></div>'
      +'<div>'+(linhasProd.length>1?'<button type="button" class="ct-rem" onclick="remLinhaProd('+i+')" title="Remover produto" aria-label="Remover produto '+esc(p.num)+'">'+ctIc('lixo','p')+'</button>':'')+'</div>'
      +'</div>'
      +'<div class="ct-prod-g2">'
      +'<div><label class="form-label" for="pp-venc-'+i+'">Vencimento previsto</label><input class="form-control" id="pp-venc-'+i+'" type="date" value="'+esc(p.venc)+'" oninput="updProd('+i+',\'venc\',this.value)"></div>'
      +'<div><label class="form-label" for="pp-ent-'+i+'">Data de entrega</label><input class="form-control" id="pp-ent-'+i+'" type="date" value="'+esc(p.entrega)+'" oninput="updProd('+i+',\'entrega\',this.value)"></div>'
      +'<div><label class="form-label" for="pp-obs-'+i+'">Observações</label><input class="form-control" id="pp-obs-'+i+'" type="text" value="'+escHtml(p.obs)+'" placeholder="Opcional" oninput="updProd('+i+',\'obs\',this.value)"></div>'
      +'</div></div>';
  }).join('');
}

window.updProd=function(i,campo,val){linhasProd[i][campo]=val;};
window.addLinhaProd=function(){
  var maxNum=linhasProd.reduce(function(m,p){return Math.max(m,parseInt(p.num)||0);},0);
  linhasProd.push({id:null,num:maxNum+1,desc:'',val:'',venc:'',entrega:'',sit:'pendente',obs:''});
  renderLinhasProd();
};
window.remLinhaProd=function(i){linhasProd.splice(i,1);renderLinhasProd();calcSoma();};

function calcSoma(){
  var c=todosContratos.find(function(x){return x.id===contratoModalProdId;});
  var total=c?parseFloat(c.valor_total_brl||0):0;
  var soma=linhasProd.reduce(function(s,p){return s+parseFloat(p.val||0);},0);
  var el=document.getElementById('mp-soma');
  var elD=document.getElementById('mp-diff');
  if(el)el.innerHTML='Soma dos produtos: <strong class="mono">'+fmtBRL(soma)+'</strong>';
  if(elD){
    var diff=total-soma;
    if(Math.abs(diff)<0.01){elD.innerHTML='<span class="ct-dif ok">'+ctIc('check','p')+' Valores conferem</span>';}
    else{elD.innerHTML='<span class="ct-dif '+(diff<0?'er':'al')+'">'+(diff<0?'Excedido':'Restante')+': '+fmtBRL(Math.abs(diff))+'</span>';}
  }
}

window.salvarProdutos=async function(){
  if(!contratoModalProdId)return;
  // Filtrar apenas os editáveis (excluir pago e aprovado)
  var editaveis=linhasProd.filter(function(p){return p.sit!=='pago'&&p.sit!=='aprovado';});
  var invalidos=editaveis.filter(function(p){return !p.desc.trim()||!p.val;});
  if(invalidos.length){toast('Preencha descrição e valor em todos os produtos.','error');return;}
  toast('Salvando produtos...','info');
  try{
    for(var i=0;i<linhasProd.length;i++){
      var p=linhasProd[i];
      // Pular produtos travados — não enviar update para o banco
      if(p.sit==='pago'||p.sit==='aprovado') continue;
      var dados={contrato_id:contratoModalProdId,numero_produto:parseInt(p.num)||i+1,descricao:p.desc.trim(),valor_brl:parseFloat(p.val)||0,dt_vencimento:p.venc||null,dt_entrega:p.entrega||null,situacao:p.sit,observacoes:p.obs.trim()||null,criado_por:appState.usuario.id};
      if(p.id){var upd=await db.from('contratos_produtos').update(dados).eq('id',p.id);if(upd.error)throw upd.error;}
      else{var ins=await db.from('contratos_produtos').insert(dados).select('id').single();if(ins.error)throw ins.error;linhasProd[i].id=ins.data.id;}
    }
    toast('Produtos salvos!','success');
    var idSalvo=contratoModalProdId;
    fecharModalProd();
    detTabAtiva[idSalvo]='prods';
    await recarregarDet(idSalvo);
  }catch(e){toast('Erro ao salvar: '+(e.message||''),'error');}
};

window.fecharModalProd=function(){
  ctFechar('modal-produtos');
  contratoModalProdId=null;
};

window.fecharModal=function(){
  ctFechar('modal-contrato');
  contratoEditando=null;filePDF=null;
};

// ── Janelas: foco no primeiro campo, Esc fecha a de cima, Tab preso, foco volta ao sair ──
var CT_FOCAVEIS='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]):not([type=file]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
var ctPilha=[];
function ctAbrir(id){
  var el=document.getElementById(id); if(!el)return;
  el.classList.add('aberto');
  if(!ctPilha.some(function(x){return x.el===el;})) ctPilha.push({el:el,volta:document.activeElement});
  requestAnimationFrame(function(){
    var alvo=el.querySelector('.modal-body :is(input:not([readonly]):not([type=checkbox]):not([type=file]),select,textarea)')||el.querySelector(CT_FOCAVEIS);
    if(alvo)alvo.focus({preventScroll:true});
  });
}
function ctFechar(id){
  var el=document.getElementById(id); if(!el)return;
  el.classList.remove('aberto');
  var i=ctPilha.findIndex(function(x){return x.el===el;}); if(i<0)return;
  var volta=ctPilha.splice(i,1)[0].volta;
  if(volta&&document.contains(volta))volta.focus({preventScroll:true});
}
document.addEventListener('keydown',function(e){
  var topo=ctPilha.length?ctPilha[ctPilha.length-1].el:null; if(!topo)return;
  if(e.key==='Escape'){
    e.preventDefault();
    if(topo.id==='modal-encerramento')fecharModalEncerramento();
    else if(topo.id==='modal-produtos')fecharModalProd();
    else fecharModal();
  }else if(e.key==='Tab'){
    var f=[].slice.call(topo.querySelectorAll(CT_FOCAVEIS)).filter(function(x){return x.offsetParent!==null;});
    if(!f.length)return;
    var pri=f[0],ult=f[f.length-1];
    if(!topo.contains(document.activeElement)){e.preventDefault();pri.focus();}
    else if(e.shiftKey&&document.activeElement===pri){e.preventDefault();ult.focus();}
    else if(!e.shiftKey&&document.activeElement===ult){e.preventDefault();pri.focus();}
  }
});
})();
</script>
