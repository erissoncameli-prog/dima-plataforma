var D_USD = function(v){ return 'US$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}); };
var D_PCT = function(v){ return Math.round(parseFloat(v||0))+'%'; };
var D_DATE = function(d){ return d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '—'; };
var D_P = function(v,t){ return t>0 ? Math.min(parseFloat(v||0)/parseFloat(t)*100,100) : 0; };
// valores curtos para eixos e rótulos: US$ 1,2 mi · US$ 340 mil
function D_USDc(v){ v=parseFloat(v||0); var a=Math.abs(v); if(a>=1e6) return 'US$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi'; if(a>=1e3) return 'US$ '+Math.round(v/1e3)+' mil'; return 'US$ '+Math.round(v); }
function D_BRLc(v){ v=parseFloat(v||0); var a=Math.abs(v); if(a>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi'; if(a>=1e3) return 'R$ '+Math.round(v/1e3)+' mil'; return 'R$ '+Math.round(v); }
function D_PCT1(v){ return (Math.round(parseFloat(v||0)*10)/10).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }

  check:'<path d="M20 6 9 17l-5-5"/>',
  filtro:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  aviao:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  recibo:'<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 2 2V2l-2 2-3-2-3 2-3-2-3 2z"/><path d="M8 8h8M8 12h8M8 16h5"/>',

function vgIc(n,cls){ return '<svg class="vg-ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(VG_IC[n]||'')+'</svg>'; }

// ── Cores do tema para o Chart.js (lidas dos tokens; nunca cor solta) ──
function vgCor(tok,alfa){
  var el=document.querySelector('.main-content')||document.body;
  var v=getComputedStyle(el).getPropertyValue(tok).trim()||'#8C9A92';
  return alfa==null ? v : vgAlfa(v,alfa);
}
function vgAlfa(c,a){
  if(c.charAt(0)==='#'){ var h=c.slice(1); if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');
    return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')'; }
  var m=/rgba?\(([^)]+)\)/.exec(c); if(!m) return c;
  var p=m[1].split(',').map(function(x){return x.trim();}); return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')';
}
function vgTemaChart(){
  if(typeof Chart==='undefined') return;
  Chart.defaults.font.family="'DM Sans', system-ui, sans-serif";
  Chart.defaults.font.size=11;
  Chart.defaults.color=vgCor('--txt-2');
  Chart.defaults.borderColor=vgCor('--vg-grade');
  Chart.defaults.plugins.legend.display=false;
  var tt=Chart.defaults.plugins.tooltip;
  tt.backgroundColor=vgCor('--sup'); tt.titleColor=vgCor('--txt'); tt.bodyColor=vgCor('--txt-2'); tt.footerColor=vgCor('--txt-3');
  tt.borderColor=vgCor('--lin-forte'); tt.borderWidth=1; tt.padding=10; tt.cornerRadius=10; tt.boxPadding=4;
  tt.titleFont={weight:'600'}; tt.bodyFont={family:"'DM Mono', ui-monospace, monospace"};
}
// Datasets guardam tokens em _bg/_bd/_pt (string ou lista); vgPinta resolve para cor real.
function vgPinta(cfg){
  function r(t,a){ return Array.isArray(t)?t.map(function(x){return vgCor(x,a);}):vgCor(t,a); }
  ((cfg.data&&cfg.data.datasets)||[]).forEach(function(ds){
    if(ds._bg) ds.backgroundColor=r(ds._bg,ds._bgA);
    if(ds._bd) ds.borderColor=r(ds._bd);
    if(ds._pt) ds.pointBackgroundColor=r(ds._pt);
    if(ds._ptb) ds.pointBorderColor=r(ds._ptb);
  });
}
// Troca de tema: redesenha todos os gráficos com as cores novas
function vgRetemar(){
  vgTemaChart();
  Object.keys(CHARTS).forEach(function(k){ var c=CHARTS[k]; try{ vgPinta(c.config); c.update('none'); }catch(e){} });
}
new MutationObserver(function(){ vgRetemar(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-tema']});

// Plugins: linha de referência (ex.: 100%) com zona de risco, total no fim da barra e texto no centro da rosca
var vgPlugRef={id:'vgRef',afterDatasetsDraw:function(c,a,o){
  if(!o||o.x==null)return; var xs=c.scales.x,ar=c.chartArea,px=xs.getPixelForValue(o.x); if(px<ar.left||px>ar.right)return;
  var ct=c.ctx; ct.save();
  if(o.zona){ ct.fillStyle=vgCor('--vg-zona-risco'); ct.globalCompositeOperation='destination-over'; ct.fillRect(px,ar.top,ar.right-px,ar.bottom-ar.top); ct.globalCompositeOperation='source-over'; }
  ct.strokeStyle=vgCor('--erro'); ct.lineWidth=1.5; ct.setLineDash([5,4]); ct.beginPath(); ct.moveTo(px,ar.top); ct.lineTo(px,ar.bottom); ct.stroke();
  if(o.rotulo){ ct.setLineDash([]); ct.fillStyle=vgCor('--erro-txt'); ct.font="600 11px 'DM Sans', sans-serif"; ct.textAlign='left'; ct.fillText(o.rotulo,px+6,ar.top+12); }
  ct.restore();
}};
var vgPlugFim={id:'vgFim',afterDatasetsDraw:function(c,a,o){
  if(!o||!o.fmt)return; var ct=c.ctx,n=(c.data.labels||[]).length; ct.save();
  ct.font="500 11px 'DM Mono', ui-monospace, monospace"; ct.fillStyle=vgCor('--txt'); ct.textBaseline='middle';
  for(var i=0;i<n;i++){
    var x=null,y=null;
    c.data.datasets.forEach(function(ds,di){ var m=c.getDatasetMeta(di); if(m.hidden||!m.data[i])return; var el=m.data[i];
      if(c.options.indexAxis==='y'){ if(x===null||el.x>x)x=el.x; y=el.y; } else { if(y===null||el.y<y)y=el.y; x=el.x; } });
    if(x===null)continue; var t=o.fmt(i); if(!t)continue;
    if(c.options.indexAxis==='y'){ ct.textAlign='left'; ct.fillText(t,x+6,y); } else { ct.textAlign='center'; ct.fillText(t,x,y-9); }
  }
  ct.restore();
}};
var vgPlugCentro={id:'vgCentro',afterDraw:function(c,a,o){
  if(!o||!o.t)return; var ar=c.chartArea,cx=(ar.left+ar.right)/2,cy=(ar.top+ar.bottom)/2,ct=c.ctx; ct.save(); ct.textAlign='center'; ct.textBaseline='middle';
  ct.fillStyle=vgCor('--txt'); ct.font="500 17px 'DM Mono', ui-monospace, monospace"; ct.fillText(o.t,cx,cy-(o.s?7:0));
  if(o.s){ ct.fillStyle=vgCor('--txt-3'); ct.font="11px 'DM Sans', sans-serif"; ct.fillText(o.s,cx,cy+12); }
  ct.restore();
}};
if(typeof Chart!=='undefined') Chart.register(vgPlugRef,vgPlugFim,vgPlugCentro);
vgTemaChart();

// Eixo em dinheiro / em número
function vgEixoUSD(v){ return D_USDc(v); }
function vgEixoBRL(v){ return D_BRLc(v); }
function vgInteiro(v){ return Number.isInteger(v)?v:''; }

// Cartão de gráfico: título, subtítulo, área do canvas, legenda e "Ver como tabela"
function vgCardGraf(id,titulo,sub,altura,opts){
  opts=opts||{};
  return '<div class="vg-card'+(opts.cls?' '+opts.cls:'')+'"'+(opts.style?' style="'+opts.style+'"':'')+'>'
    +'<div class="vg-card-h"><div><h3 class="vg-tit">'+titulo+'</h3>'+(sub?'<div class="vg-sub">'+sub+'</div>':'')+'</div>'+(opts.extra||'')+'</div>'
    +(opts.antes||'')
    +(opts.rolar?'<div id="'+id+'-rolar" style="overflow-x:auto;overflow-y:hidden">':'')
    +'<div class="vg-graf" id="'+id+'-wrap" style="height:'+altura+'px"><canvas id="'+id+'" role="img" aria-label="'+esc(String(titulo).replace(/<[^>]+>/g,''))+'"></canvas></div>'
    +(opts.rolar?'</div>':'')
    +(opts.leg||'')
    +(opts.nota?'<div class="vg-nota">'+opts.nota+'</div>':'')
    +'<button type="button" class="vg-link" aria-expanded="false" onclick="vgVerTabela(\''+id+'\',this)">Ver como tabela</button>'
    +'<div class="vg-dados" id="'+id+'-dados" hidden></div>'
    +'</div>';
}
// Tabela dos dados do gráfico (gerada do próprio gráfico; cfg._tabela substitui quando precisa)
window.vgVerTabela=function(id,btn){
  var box=document.getElementById(id+'-dados'); if(!box)return;
  var abrir=box.hidden;
  if(abrir){
    var c=CHARTS[id], html='<div class="vg-nota">Sem dados.</div>';
    if(c){
      if(c.config._tabela) html=c.config._tabela();
      else {
        var fmt=c.config._fmt||function(v){return v==null?'—':Number(v).toLocaleString('pt-BR');};
        var dss=c.data.datasets.filter(function(ds){return !ds._semTabela;});
        html='<div class="vg-tbl-w"><table class="vg-tbl"><thead><tr><th>'+(c.config._rotulo||'Item')+'</th>'
          +dss.map(function(ds){return '<th class="n">'+esc(ds.label||'Valor')+'</th>';}).join('')+'</tr></thead><tbody>'
          +(c.data.labels||[]).map(function(l,i){ var nome=(c.config._nomes&&c.config._nomes[i])||l;
            return '<tr><td>'+esc(String(nome))+'</td>'+dss.map(function(ds){return '<td class="n">'+fmt(ds.data[i],ds)+'</td>';}).join('')+'</tr>'; }).join('')
          +'</tbody></table></div>';
      }
    }
    box.innerHTML=html;
  }
  box.hidden=!abrir; btn.setAttribute('aria-expanded',String(abrir)); btn.textContent=abrir?'Ocultar tabela':'Ver como tabela';
};
// Barra de composição (segmentos clicáveis) e legenda
function vgCompBar(partes,total,fn,aria){
  var den=Math.max(total,partes.reduce(function(s,p){return s+(p[0]>0?p[0]:0);},0))||1;
  return '<div class="vg-comp" role="group" aria-label="'+esc(aria||'Composição')+'">'+partes.map(function(p,i){
    var w=p[0]/den*100; if(!(w>0))return '';
    var rot=p[2]+': '+(p[3]||D_USD)(p[0])+' ('+D_PCT1(p[0]/den*100)+')';
    return '<button type="button" style="width:'+w.toFixed(3)+'%;background:var('+p[1]+')" title="'+esc(rot)+'" aria-label="'+esc(rot)+'"'
      +(fn?' data-pop onclick="vgPopSeg(\''+fn+'\','+i+',event)"':' tabindex="-1"')+'></button>';
  }).join('')+'</div>';
}
function vgLeg(itens){ return '<div class="vg-leg">'+itens.map(function(x){return '<span><i class="vg-sw'+(x[0]==='--vg-livre'?' livre':'')+(x[3]?' r':'')+'" style="background:var('+x[0]+')"></i>'+esc(x[1])+(x[2]!=null&&x[2]!==''?' <b>'+x[2]+'</b>':'')+'</span>';}).join('')+'</div>'; }
function vgMeter(partes){ return '<div class="vg-meter">'+partes.map(function(p){return '<i style="width:'+Math.max(0,Math.min(100,p[0])).toFixed(2)+'%;background:var('+p[1]+')"></i>';}).join('')+'</div>'; }
function vgKpi(ic,lbl,val,sub,extra,cls){ return '<div class="vg-kpi'+(cls?' '+cls:'')+'"><div class="vg-kpi-l">'+vgIc(ic)+lbl+'</div><div class="vg-kpi-v">'+val+'</div>'+(extra||'')+(sub?'<div class="vg-kpi-s">'+sub+'</div>':'')+'</div>'; }
function vgContador(aba,n){ var b=document.querySelector('.vg-tab[data-aba="'+aba+'"] .vg-cnt'); if(!b)return; b.textContent=n; b.hidden=!(n>0); }
function vgVazio(msg,ic){ return '<div class="vg-vazio">'+vgIc(ic||'check')+esc(msg)+'</div>'; }
// objeto mínimo com o formato que os geradores de popup leem de um gráfico do Chart.js
function vgFalsoGraf(dados,labels){ return {data:{labels:labels||[],datasets:[{data:dados}]}}; }

  ['tarefas','Minhas tarefas','tarefas'],

  ['resultados','Resultados × Financeiro','alvo'],
  ['execucao','Execução financeira','grafico'],
  ['alertas','Alertas','sino']

(async function(){
  var u = await carregarUsuario();
  if(!u){ window.location.href='../index.html'; return; }
  _podeCobertura = ['super_admin','coordenacao'].includes(appState.perfil) || (appState.permissoes||[]).includes('dashboard_cobertura');

// Tema claro/escuro: mesmo 'diag_tema' da mesa do Diagnóstico, de TDRs e do Pulso (componente .dgm-tema)
function seletorTema(alvo){
  if(!alvo||alvo.querySelector('.dgm-tema')||typeof DiagTema==='undefined')return;
  var d=document.createElement('div');
  d.className='dgm-tema'; d.setAttribute('role','group'); d.setAttribute('aria-label','Tema');
  d.innerHTML=[['claro','sol','Claro'],['escuro','lua','Escuro']].map(function(x){
    return '<button type="button" data-tema="'+x[0]+'" aria-pressed="'+(DiagTema.atual()===x[0])+'">'+vgIc(x[1])+x[2]+'</button>';}).join('');
  var bc=alvo.querySelector('.topbar-breadcrumb');
  if(bc)bc.parentNode.insertBefore(d,bc); else alvo.appendChild(d);
  d.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-tema]'); if(!b)return;
    DiagTema.definir(b.dataset.tema);
    d.querySelectorAll('[data-tema]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });
}

window.mudarAba = function(id){

// ── resMap helper ─────────────────────────────────────────
function resMap(){
  var m={};
  D.res.forEach(function(rv){
    m[rv.codigo]={orc:0,comp:0,pago:0,apagar:0,nome:rv.nome_pt,ind:[]};
  });
  D.sal.forEach(function(s){
    var a=D.atv.find(function(x){return x.id===s.id;});
    if(!a)return;
    var rv=D.res.find(function(x){return x.id===a.resultado_id;});
    if(!rv)return;
    var k=rv.codigo;
    if(!m[k])m[k]={orc:0,comp:0,pago:0,apagar:0,nome:rv.nome_pt,ind:[]};
    m[k].orc+=parseFloat(s.orcamento_usd||0);
    m[k].comp+=parseFloat(s.comprometido_usd||0);
    m[k].pago+=parseFloat(s.pago_usd||0);
    m[k].apagar+=parseFloat(s.a_pagar_usd||0);
  });
  D.matrizItens.forEach(function(mi){
    var k='R'+mi.resultado;
    if(m[k])m[k].ind.push(mi);
  });
  return m;
}

    var el=document.getElementById('chart-popup');

    var pw=Math.min(364,window.innerWidth-16),ph=Math.min(el.scrollHeight+30,480);

    scales:{
      x:{stacked:!!o.stacked,min:0,max:o.max,border:{display:false},ticks:{callback:o.xfmt||vgEixoUSD,maxTicksLimit:6,precision:0}},

function vgOptV(o){

    layout:{padding:{top:o.padT||0}},
    plugins:{tooltip:{callbacks:o.tt||{}},vgFim:o.fim?{fmt:o.fim}:{}},
    scales:{
      x:{stacked:!!o.stacked,grid:{display:false},border:{display:false},ticks:{maxRotation:o.rot||0,autoSkip:o.autoSkip!==false}},

}

    +vgKpi('fluxo','Comprometido (TDR)',D_PCT(pComp),D_USDc(comp)+' em TDRs ativos',vgMeter([[pComp,'--vg-comp']]))
    +vgKpi('relogio','A pagar',D_PCT(pApagar),D_USDc(apagar)+' lançados a pagar',vgMeter([[pApagar,'--vg-apagar']]))
    +vgKpi('check','TDRs aprovados',taprov+' / '+D.tdrs.length,D_PCT(pTdr)+' já passaram da aprovação',vgMeter([[pTdr,'--vg-f-aprovado']]))
    +vgKpi('alvo','Metas com avanço',metasProg+' / '+_cmF.length,'indicadores com progresso',vgMeter([[D_P(metasProg,_cmF.length),'--pri-600']]))

  h+='</div>';

  // TDRs por fase (as 9 fases atuais; nomes antigos normalizados)
  var fCnt={},fVal={};
  D.tdrs.forEach(function(t){var k=tdrFase(t.status);fCnt[k]=(fCnt[k]||0)+1;fVal[k]=(fVal[k]||0)+parseFloat(t.valor_usd||0);});
  var fasesTdr=TDR_FASES.filter(function(f){return fCnt[f[0]];});
  _POP_DATA.fasesTdr=fasesTdr.map(function(f){return f[0];});
  h+='<div class="vg-g2">';
  h+=vgCardGraf('ch-donut-tdr','TDRs por fase','Quantidade e valor em cada fase · clique para ver os TDRs',Math.max(fasesTdr.length*30+30,120),
    {nota:fasesTdr.length?'':'Nenhum TDR cadastrado.'});
  h+=vgCardGraf('ch-fases-polar','Atividades por fase','Onde está cada uma das '+D.atv.length+' atividades',240);

        +fasesTdr.map(function(f){return '<tr><td>'+vgPillFase(f[0])+'</td><td class="n">'+fCnt[f[0]]+'</td><td class="n">'+D_USD(fVal[f[0]])+'</td></tr>';}).join('')+'</tbody></table></div>';}});

// GUIA 2 — OPERACIONAL (os números gerais ficam em Financiadores)

function renderOperacional(){
  // Top comprometidas (% do orçamento já em TDR)
  var topComp=D.sal.filter(function(s){return parseFloat(s.comprometido_usd||0)>0;})
    .sort(function(a,b){return parseFloat(b.pct_comprometido||0)-parseFloat(a.pct_comprometido||0);}).slice(0,10);

  // Fluxo de TDRs: quantos em cada fase, do rascunho ao contrato (cancelados à parte)
  var fCnt={},fVal={};
  D.tdrs.forEach(function(t){var k=tdrFase(t.status);fCnt[k]=(fCnt[k]||0)+1;fVal[k]=(fVal[k]||0)+parseFloat(t.valor_usd||0);});
  var fluxo=TDR_FASES.filter(function(f){return f[0]!=='cancelado';});
  _POP_DATA.fluxoTdr=fluxo.map(function(f){return f[0];});
  var nCanc=fCnt.cancelado||0;

  // Atividades × TDRs — cobertura por atividade
  var _stKeys=TDR_FASES.map(function(f){return f[0];});
  var atvTdrs=D.atv.map(function(a){
    var tdrsAtv=D.tdrs.filter(function(t){return t.atividade_id===a.id;});
    var counts={}; _stKeys.forEach(function(k){counts[k]=0;});
    tdrsAtv.forEach(function(t){var sk=tdrFase(t.status);if(counts[sk]!==undefined)counts[sk]++;});
    return{atv:a,total:tdrsAtv.length,counts:counts};
  });
  atvTdrs.sort(function(a,b){
    if(a.total===0&&b.total>0)return-1;
    if(b.total===0&&a.total>0)return 1;
    return a.total-b.total;
  });
  var _semTdr=atvTdrs.filter(function(x){return x.total===0;}).length;
  var _comTdr=atvTdrs.length-_semTdr;

  // TDRs por responsável
  var respSet=new Map();
  D.tdrs.forEach(function(t){
    var nome=(t.atividades&&t.atividades.responsavel&&t.atividades.responsavel.nome_completo)||'Sem responsável';
    if(!respSet.has(nome)){var o={};_stKeys.forEach(function(k){o[k]=0;});respSet.set(nome,o);}
    var r=respSet.get(nome),sk=tdrFase(t.status);
    if(r[sk]!==undefined)r[sk]++;
  });
  var respNomes=[...respSet.keys()].sort(function(a,b){
    var ta=Object.values(respSet.get(a)).reduce(function(s,v){return s+v;},0);
    var tb=Object.values(respSet.get(b)).reduce(function(s,v){return s+v;},0);
    return tb-ta;
  });
  var legFases=vgLeg(TDR_FASES.map(function(f){return [f[2],f[1]];}));

  var h='<div class="vg-g2">';
  h+=vgCardGraf('ch-tdr-bar-combo','Fluxo de TDRs','Quantos TDRs estão em cada fase, do rascunho ao contrato'+(nCanc?' · '+nCanc+' cancelado(s) fora do fluxo':''),250);
  h+=vgCardGraf('ch-top-comp','Atividades mais comprometidas','% do orçamento já em TDR · linha tracejada = 100% · clique para detalhes',Math.max(topComp.length*30+40,140),
    {nota:topComp.length?'':'Nenhuma atividade com TDR.'});
  h+='</div>';

  h+=vgCardGraf('ch-atv-tdrs','Atividades × TDRs cadastrados','Sem TDR primeiro · cada cor é uma fase · clique para ver os TDRs da atividade',atvTdrs.length*26+40,
    {antes:legFases,extra:'<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="vg-pill vg-p-er">'+vgIc('alerta','p')+_semTdr+' sem TDR</span><span class="vg-pill vg-p-ok">'+vgIc('check','p')+_comTdr+' com TDR</span></div>'});
  h+=vgCardGraf('ch-tdr-resp','TDRs por responsável','Fase dos TDRs das atividades de cada responsável',Math.max(respNomes.length*34+40,140),{antes:legFases});

  document.getElementById('pane-operacional').innerHTML = h;

  setTimeout(function(){
    mkChart('ch-tdr-bar-combo',{type:'bar',data:{labels:fluxo.map(function(f){return f[1];}),datasets:[
      vgDs('TDRs',fluxo.map(function(f){return fCnt[f[0]]||0;}),fluxo.map(function(f){return f[2];}),{maxBarThickness:40})
    ]},options:vgOptV({yfmt:vgInteiro,padT:16,rot:40,autoSkip:false,fim:function(i){return String(fCnt[fluxo[i][0]]||0);},
      tt:{label:function(c){var k=fluxo[c.dataIndex][0];return ' '+(fCnt[k]||0)+' TDR(s) · '+D_USD(fVal[k]||0);}}}),
      _tabela:function(){return '<div class="vg-tbl-w"><table class="vg-tbl"><thead><tr><th>Fase</th><th class="n">TDRs</th><th class="n">Valor</th></tr></thead><tbody>'
        +TDR_FASES.map(function(f){return '<tr><td>'+vgPillFase(f[0])+'</td><td class="n">'+(fCnt[f[0]]||0)+'</td><td class="n">'+D_USD(fVal[f[0]]||0)+'</td></tr>';}).join('')+'</tbody></table></div>';}});

    var topPct=topComp.map(function(s){return parseFloat(s.pct_comprometido||0);});
    var maxPct=Math.max(120,Math.ceil(Math.max.apply(null,topPct.concat([0]))/10)*10);
    mkChart('ch-top-comp',{type:'bar',data:{labels:topComp.map(function(s){return s.codigo;}),datasets:[
      vgDs('% comprometido',topPct,topComp.map(function(s){return (SAL_ST[s.status_saldo]||SAL_ST.ok)[3];}),{maxBarThickness:18})
    ]},options:vgOptH({max:maxPct,mono:true,padR:120,xfmt:function(v){return v+'%';},ref:{x:100,zona:true},
      fim:function(i){var s=topComp[i];return D_PCT(topPct[i])+'  '+(SAL_ST[s.status_saldo]||SAL_ST.ok)[0];},
      tt:{label:function(c){var s=topComp[c.dataIndex];return ' '+D_PCT(c.raw)+' · '+D_USD(s.comprometido_usd)+' de '+D_USD(s.orcamento_usd);}}}),
      _tabela:function(){return '<div class="vg-tbl-w"><table class="vg-tbl"><thead><tr><th>Atividade</th><th class="n">Orçamento</th><th class="n">Comprometido</th><th class="n">%</th><th>Situação</th></tr></thead><tbody>'
        +topComp.map(function(s){return '<tr><td><span class="vg-cod">'+esc(s.codigo)+'</span></td><td class="n">'+D_USD(s.orcamento_usd)+'</td><td class="n">'+D_USD(s.comprometido_usd)+'</td><td class="n">'+D_PCT(s.pct_comprometido)+'</td><td>'+vgPillSaldo(s.status_saldo)+'</td></tr>';}).join('')+'</tbody></table></div>';}});

    var atvDs=_stKeys.map(function(sk){ return vgDs(TDR_FASE[sk].nome,atvTdrs.map(function(x){return x.counts[sk]||0;}),TDR_FASE[sk].tok,Object.assign({maxBarThickness:16,borderRadius:3},VG_GAP)); });
    // barra curta vermelha para atividade sem TDR (marca a ausência)
    atvDs.unshift(vgDs('Sem TDR',atvTdrs.map(function(x){return x.total===0?0.35:0;}),'--erro',{maxBarThickness:16,borderRadius:3,_semTabela:true}));
    mkChart('ch-atv-tdrs',{type:'bar',data:{labels:atvTdrs.map(function(x){return x.atv.codigo;}),datasets:atvDs},
      options:vgOptH({stacked:true,mono:true,padR:70,xfmt:vgInteiro,yCor:function(ctx){var x=atvTdrs[ctx.index];return x&&x.total===0?vgCor('--erro'):vgCor('--txt-2');},
        fim:function(i){var x=atvTdrs[i];return x.total?x.total+' TDR'+(x.total>1?'s':''):'sem TDR';},
        tt:{title:function(it){var x=atvTdrs[it[0].dataIndex];return x.atv.codigo+' — '+(x.atv.nome_pt||'').substring(0,50);},
            label:function(c){ return c.dataset.label==='Sem TDR'?' Nenhum TDR cadastrado':' '+c.dataset.label+': '+c.raw; }}}),
      _nomes:atvTdrs.map(function(x){return x.atv.codigo+' — '+(x.atv.nome_pt||'');}),_rotulo:'Atividade'});

    var respDs=_stKeys.map(function(sk){ return vgDs(TDR_FASE[sk].nome,respNomes.map(function(n){return(respSet.get(n)||{})[sk]||0;}),TDR_FASE[sk].tok,Object.assign({maxBarThickness:18,borderRadius:3},VG_GAP)); });
    var respLabels=respNomes.map(function(n){var p=n.split(' ');return p.length<=2?n:p[0]+' '+p[p.length-1];});
    mkChart('ch-tdr-resp',{type:'bar',data:{labels:respLabels,datasets:respDs},
      options:vgOptH({stacked:true,padR:60,xfmt:vgInteiro,
        fim:function(i){var t=Object.values(respSet.get(respNomes[i])).reduce(function(s,v){return s+v;},0);return t+' TDR'+(t!==1?'s':'');},
        tt:{title:function(it){return respNomes[it[0].dataIndex];},label:function(c){return ' '+c.dataset.label+': '+c.raw;}}}),
      _nomes:respNomes,_rotulo:'Responsável'});

    _POP_DATA.topComp=topComp;
    _POP_DATA.atvTdrs=atvTdrs;
    _POP_DATA.respNomes=respNomes;
    addPopupToChart('ch-top-comp',_popTopComp);
    addPopupToChart('ch-tdr-bar-combo',_popTdrCombo);
    addPopupToChart('ch-atv-tdrs',_popAtvTdrs);
    addPopupToChart('ch-tdr-resp',_popTdrResp);
  },50);
}

// ─────────────────────────────────────────────────────────
// PAINEL — SALDO DE ORÇAMENTO POR ATIVIDADE (coord/super_admin)
// Orçamento → Comprometido (TDRs) → Firmado (c/ contrato) → Saldo livre
// ─────────────────────────────────────────────────────────
var _saldoRows=[], _firmSet={};
// Cores fixas só da janela de impressão (documento claro à parte); a tela usa os tokens de SAL_ST
var SALDO_COR={firm:'#047857',afirm:'#F59E0B',livre:'#94A3B8',exc:'#DC2626'};
var STAT_COR={ok:'#10B981',atencao:'#FACC15',critico:'#F97316',extrapolado:'#B91C1C',sem_orcamento:'#D1D5DB'};
var STAT_LBL={ok:'OK',atencao:'Atenção',critico:'Crítico',extrapolado:'Estourado',sem_orcamento:'Sem orçamento'};
var STAT_ICO={ok:'✓',atencao:'!',critico:'▲',extrapolado:'✕',sem_orcamento:'–'};

function renderSaldo(){
  // TDRs firmados = os que já têm contrato vinculado (contratos.tdr_id)
  _firmSet={};
  D.contr.forEach(function(c){ if(c.tdr_id) _firmSet[c.tdr_id]=true; });

  // Uma linha por atividade a partir da view vw_saldo_atividade
  // (comprometido = Σ valor_usd dos TDRs + contrato acima do TDR, já debitado no razão — rem_08)
  _saldoRows = D.sal.map(function(s){
    var tdrsAtv = D.tdrs.filter(function(t){ return t.atividade_id===s.id && t.status!=='cancelado'; });
    // o excedente de contrato é valor firmado (não "a firmar")
    var firmado = tdrsAtv.reduce(function(acc,t){ return acc + (_firmSet[t.id] ? parseFloat(t.valor_usd||0) : 0); }, 0)
                + parseFloat(s.excedente_contrato_usd||0);
    var orc  = parseFloat(s.orcamento_usd||0);
    var comp = parseFloat(s.comprometido_usd||0);
    return {
      id:s.id, codigo:s.codigo||'—', nome:s.nome_pt||'',
      orc:orc, comp:comp, firmado:firmado, aFirmar:Math.max(0,comp-firmado),
      livre:Math.max(0,orc-comp), status:s.status_saldo||'ok',
      pctComp: orc>0 ? comp/orc*100 : 0,
      nTdrs: tdrsAtv.length, nFirmados: tdrsAtv.filter(function(t){return _firmSet[t.id];}).length
    };
  }).filter(function(r){ return r.orc>0 || r.comp>0; })
    .sort(function(a,b){ return b.pctComp - a.pctComp; });

  var rows=_saldoRows;
  var tOrc  = rows.reduce(function(s,r){return s+r.orc;},0);
  var tComp = rows.reduce(function(s,r){return s+r.comp;},0);
  var tFirm = rows.reduce(function(s,r){return s+r.firmado;},0);
  var tAfirm= Math.max(0,tComp-tFirm);
  var tLivre= Math.max(0,tOrc-tComp);
  var tExc  = Math.max(0,tComp-tOrc);
  var nFirmTdrs = rows.reduce(function(s,r){return s+r.nFirmados;},0);
  var nExtra = rows.filter(function(r){return r.comp>r.orc;}).length;

  var statOrder=['ok','atencao','critico','extrapolado','sem_orcamento'];
  var statCnt={}; statOrder.forEach(function(k){statCnt[k]=0;});
  rows.forEach(function(r){ if(statCnt[r.status]===undefined)statCnt[r.status]=0; statCnt[r.status]++; });

  var h='<div class="vg-acoes">'
    +'<button type="button" class="vg-btn" onclick="abrirRelatorioA4Saldo()">'+vgIc('doc')+'Relatório A4</button>'
    +'<button type="button" class="vg-btn" onclick="imprimirPainelSaldo()">'+vgIc('imprimir')+'Imprimir painel</button>'
    +'<button type="button" class="vg-btn pri" onclick="exportSaldoExcel()">'+vgIc('planilha')+'Exportar Excel</button>'
    +'</div>';

  h+='<div class="vg-kpis">'
    +vgKpi('moeda','Orçamento total',D_USDc(tOrc),rows.length+' atividades')
    +vgKpi('fluxo','Comprometido (TDRs)',D_USDc(tComp),D_PCT(tOrc>0?tComp/tOrc*100:0)+' do orçamento',vgMeter([[tOrc>0?tComp/tOrc*100:0,'--vg-comp']]))
    +vgKpi('check','Firmado em contrato',D_USDc(tFirm),D_PCT(tComp>0?tFirm/tComp*100:0)+' do comprometido · '+nFirmTdrs+' TDRs',vgMeter([[tComp>0?tFirm/tComp*100:0,'--vg-pago']]))
    +vgKpi('balanca','Saldo livre','<span class="'+(tLivre<=0?'vg-v-erro':'')+'">'+D_USDc(tLivre)+'</span>',
      D_PCT(tOrc>0?tLivre/tOrc*100:0)+' do orçamento'+(nExtra>0?' · <span class="vg-v-erro">'+nExtra+' acima do orçamento</span>':''))
    +'</div>';

  var legSaldo=[['--vg-pago','Firmado',D_USDc(tFirm)],['--vg-comp','A firmar',D_USDc(tAfirm)],['--vg-livre','Saldo livre',D_USDc(tLivre)]];
  if(tExc>0) legSaldo.push(['--vg-exc','Excedente',D_USDc(tExc)]);
  h+='<div class="vg-g2">';
  h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Composição do orçamento do portfólio</h3><div class="vg-sub">Como o orçamento total se divide hoje</div></div></div>'
    +vgCompBar([[tFirm,'--vg-pago','Firmado'],[tAfirm,'--vg-comp','A firmar'],[tLivre,'--vg-livre','Saldo livre'],[tExc,'--vg-exc','Excedente']],Math.max(tOrc,tComp),null,'Composição do orçamento do portfólio')
    +vgLeg(legSaldo)+'</div>';
  h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Atividades por situação do saldo</h3><div class="vg-sub">Consumo do orçamento pelos TDRs</div></div></div>'
    +'<div style="display:flex;flex-direction:column;gap:8px">';
  statOrder.forEach(function(k){
    if(!statCnt[k])return;
    var pct=rows.length>0?statCnt[k]/rows.length*100:0;
    h+='<div style="display:grid;grid-template-columns:118px minmax(0,1fr) 30px;gap:10px;align-items:center">'+vgPillSaldo(k)
      +'<div class="vg-meter" style="height:8px"><i style="width:'+pct.toFixed(1)+'%;background:var('+SAL_ST[k][3]+')"></i></div>'
      +'<span class="mono" style="text-align:right;color:var(--txt)">'+statCnt[k]+'</span></div>';
  });
  h+='<div class="vg-nota">Atenção ≥ 75% · Crítico ≥ 95% · Estourado acima de 100% do orçamento comprometido</div></div></div>';
  h+='</div>';

  var legBar=vgLeg([['--vg-pago','Firmado'],['--vg-comp','A firmar'],['--vg-livre','Saldo livre'],['--vg-exc','Acima do orçamento']]);
  h+=vgCardGraf('ch-saldo-atv','Saldo de orçamento por atividade','Firmado + a firmar + saldo livre, em US$ · ordenado por % comprometido · clique para detalhes',Math.max(rows.length*26+50,200),{leg:legBar});
  var legQuad=vgLeg(statOrder.filter(function(k){return statCnt[k];}).map(function(k){return [SAL_ST[k][3],SAL_ST[k][0],'',true];}));
  h+=vgCardGraf('ch-saldo-quad','Quadrante de risco','% comprometido × saldo livre (US$) · tamanho da bolha = orçamento · clique para detalhes',340,
    {leg:legQuad,nota:'Faixa vermelha = orçamento comprometido além do previsto. Bolhas no alto à esquerda = muito saldo livre ainda a planejar.'});

  if(!rows.length) h='<div class="empty-state"><div class="empty-state-msg">Nenhuma atividade com orçamento cadastrado.</div></div>';
  document.getElementById('pane-saldo').innerHTML=h;
  if(!rows.length)return;

  setTimeout(function(){
    var dsFirm=rows.map(function(r){return Math.min(r.firmado,r.orc);});
    var dsAfirm=rows.map(function(r){return Math.max(0,Math.min(r.comp,r.orc)-Math.min(r.firmado,r.orc));});
    var dsLivre=rows.map(function(r){return Math.max(0,r.orc-r.comp);});
    var dsExc=rows.map(function(r){return Math.max(0,r.comp-r.orc);});
    var g=Object.assign({maxBarThickness:16,borderRadius:3},VG_GAP);
    mkChart('ch-saldo-atv',{type:'bar',data:{labels:rows.map(function(r){return r.codigo;}),datasets:[
      vgDs('Firmado',dsFirm,'--vg-pago',g),vgDs('A firmar',dsAfirm,'--vg-comp',g),
      vgDs('Saldo livre',dsLivre,'--vg-livre',g),vgDs('Excedente',dsExc,'--vg-exc',g)
    ]},options:vgOptH({stacked:true,mono:true,padR:120,
      fim:function(i){var r=rows[i];return D_PCT(r.pctComp)+'  '+(SAL_ST[r.status]||SAL_ST.ok)[0];},
      tt:{label:function(c){return ' '+c.dataset.label+': '+D_USD(c.raw);},
        footer:function(it){var r=rows[it[0].dataIndex];return 'Orçamento '+D_USD(r.orc)+' · comprometido '+D_PCT(r.pctComp);}}}),
      _fmt:function(v){return D_USD(v);},_rotulo:'Atividade',_nomes:rows.map(function(r){return r.codigo+' — '+r.nome;})});
    addPopupToChart('ch-saldo-atv',function(idx){return _popSaldoRow(rows[idx]);});

    // Quadrante de risco (bolhas por situação)
    var maxOrc=Math.max.apply(null,rows.map(function(r){return r.orc;}).concat([1]));
    function bub(r){ return Math.max(6,Math.min(24,Math.sqrt(r.orc/maxOrc)*24)); }
    var maxX=Math.max(120,Math.ceil(Math.max.apply(null,rows.map(function(r){return r.pctComp;}).concat([0]))/10)*10+10);
    var quadDs=statOrder.filter(function(k){return statCnt[k];}).map(function(k){
      return {label:SAL_ST[k][0],
        data:rows.filter(function(r){return r.status===k;}).map(function(r){return {x:r.pctComp,y:r.orc-r.comp,r:bub(r),_row:r};}),
        _bg:SAL_ST[k][3],_bgA:.72,_bd:'--sup',borderWidth:2,hoverBorderWidth:2};
    });
    mkChart('ch-saldo-quad',{type:'bubble',data:{datasets:quadDs},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:400},
        plugins:{vgRef:{x:100,zona:true,rotulo:'acima do orçamento'},
          tooltip:{callbacks:{title:function(it){var r=it[0].raw._row;return r.codigo+' — '+(r.nome||'').substring(0,40);},
            label:function(c){var r=c.raw._row;return ' '+D_PCT(r.pctComp)+' comprometido · livre '+D_USD(r.orc-r.comp)+' · orçamento '+D_USD(r.orc);}}}},
        scales:{x:{min:0,max:maxX,title:{display:true,text:'% comprometido'},border:{display:false},ticks:{callback:function(v){return v+'%';}}},
          y:{title:{display:true,text:'Saldo livre (US$)'},border:{display:false},ticks:{callback:vgEixoUSD,maxTicksLimit:6}}}},
      _tabela:function(){return '<div class="vg-tbl-w"><table class="vg-tbl"><thead><tr><th>Atividade</th><th class="n">Orçamento</th><th class="n">% comprometido</th><th class="n">Saldo livre</th><th>Situação</th></tr></thead><tbody>'
        +rows.map(function(r){return '<tr><td><span class="vg-cod">'+esc(r.codigo)+'</span> '+esc(r.nome)+'</td><td class="n">'+D_USD(r.orc)+'</td><td class="n">'+D_PCT(r.pctComp)+'</td><td class="n">'+D_USD(r.orc-r.comp)+'</td><td>'+vgPillSaldo(r.status)+'</td></tr>';}).join('')+'</tbody></table></div>';}});
    addPopupToChart('ch-saldo-quad',function(idx,ds,chart){var pt=chart.data.datasets[ds].data[idx];return _popSaldoRow(pt._row);});
  },50);
}

function _popSaldoRow(row){
  if(!row)return null;
  var html=_popRows([
    ['Orçamento',D_USD(row.orc)],
    ['Comprometido',D_USD(row.comp)+' ('+D_PCT(row.pctComp)+')'],
    ['Firmado (contrato)',D_USD(row.firmado)+' · '+row.nFirmados+' TDR(s)'],
    ['A firmar',D_USD(row.aFirmar)],
    ['Saldo livre',D_USD(row.orc-row.comp)],
    ['Situação',vgPillSaldo(row.status)]
  ]);
  var tdrsAtv=D.tdrs.filter(function(t){return t.atividade_id===row.id && t.status!=='cancelado';})
    .sort(function(a,b){return parseFloat(b.valor_usd||0)-parseFloat(a.valor_usd||0);});
  html+=_popSec('TDRs ('+tdrsAtv.length+')');
  html+=_popList(tdrsAtv.slice(0,8).map(function(t){
    var firm=_firmSet[t.id];
    return _popCod(t.numero)+' '+D_USD(t.valor_usd||0)+' '+(firm?'<span class="vg-pill vg-p-ok">'+vgIc('check','p')+'firmado</span>':'<span class="vg-pill vg-p-ne">a firmar</span>');
  }));
  if(tdrsAtv.length>8)html+='<div class="cpop-empty">... e mais '+(tdrsAtv.length-8)+'</div>';
  return {title:row.codigo+(row.nome?' — '+row.nome.substring(0,26):''), html:html, color:(SAL_ST[row.status]||SAL_ST.ok)[3]};
}

// Totais do painel de saldo (reusado por KPI/export/impressão)
function _saldoTot(){
  var t={tOrc:0,tComp:0,tFirm:0};
  _saldoRows.forEach(function(r){ t.tOrc+=r.orc; t.tComp+=r.comp; t.tFirm+=r.firmado; });
  t.tAfirm=Math.max(0,t.tComp-t.tFirm);
  t.tLivre=Math.max(0,t.tOrc-t.tComp);
  t.tExc=Math.max(0,t.tComp-t.tOrc);
  t.nExtra=_saldoRows.filter(function(r){return r.comp>r.orc;}).length;
  return t;
}

function _saldoAviso(msg,tipo){ if(typeof toast==='function')toast(msg,tipo||'info'); else alert(msg); }

// Exporta os dados do painel para Excel (.xlsx) — valores numéricos p/ somar no Excel
function exportSaldoExcel(){
  if(typeof XLSX==='undefined'){ _saldoAviso('Biblioteca de exportação ainda carregando, tente novamente em instantes.','warning'); return; }
  if(!_saldoRows.length){ _saldoAviso('Nenhum dado para exportar.','warning'); return; }
  var r2=function(v){return Math.round(parseFloat(v||0));};
  var aoa=[['Código','Atividade','Orçamento (USD)','Comprometido (USD)','Firmado (USD)','A firmar (USD)','Saldo livre (USD)','% Comprometido','Status','TDRs','TDRs firmados']];
  _saldoRows.forEach(function(r){
    aoa.push([r.codigo, r.nome, r2(r.orc), r2(r.comp), r2(r.firmado), r2(r.aFirmar), r2(r.orc-r.comp), Math.round(r.pctComp*10)/10, STAT_LBL[r.status]||r.status, r.nTdrs, r.nFirmados]);
  });
  var t=_saldoTot();
  aoa.push([]);
  aoa.push(['TOTAL GERAL','', r2(t.tOrc), r2(t.tComp), r2(t.tFirm), r2(t.tAfirm), r2(t.tOrc-t.tComp), t.tOrc>0?Math.round(t.tComp/t.tOrc*1000)/10:0,'','','']);
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:10},{wch:46},{wch:16},{wch:17},{wch:14},{wch:14},{wch:15},{wch:13},{wch:14},{wch:7},{wch:12}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Saldo por Atividade');
  XLSX.writeFile(wb, 'saldo_orcamento_atividade_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// Abre o relatório "Saldo de Orçamento por Atividade (TDRs)" (A4) — mesmo padrão robusto do
// Imprimir Painel (janela local, sem depender do carregamento de outra página inteira). Usa a
// MESMA lógica de cálculo/HTML de js/relatorio-saldo-atividade.js (compartilhada com a Central
// de Relatórios), garantindo que o conteúdo é sempre idêntico ao relatório oficial.
async function abrirRelatorioA4Saldo(){
  var win = window.open('', '_blank');
  if(!win){ _saldoAviso('Permita pop-ups neste site para gerar o relatório.','warning'); return; }
  win.document.write('<!doctype html><meta charset="utf-8"><title>Gerando relatório…</title><body style="font-family:sans-serif;color:#6B7280;padding:40px;text-align:center">Gerando relatório A4…</body>');
  try{
    var fornById = {};
    (D.forns||[]).forEach(function(f){ fornById[f.id]=f; });
    var contrByTdr = {};
    (D.contr||[]).forEach(function(c){ if(!c.tdr_id) return; (contrByTdr[c.tdr_id]=contrByTdr[c.tdr_id]||[]).push({id:c.id,numero:c.numero,valor_total_brl:c.valor_total_brl,status:c.status,fornecedor:fornById[c.fornecedor_id]?{nome:fornById[c.fornecedor_id].nome,tipo:fornById[c.fornecedor_id].tipo}:null}); });

function vgPctMeta(p){ return p>=80?['vg-p-ok','check','--ok']:p>=40?['vg-p-al','alerta','--alerta']:['vg-p-er','alerta','--erro']; }

// Distância entre % pago e % comprometido por resultado (pontos ligados; SVG próprio)
function vgHalteres(rks,rm){
  var W=460,lw=40,rw=40,pw=W-lw-rw,bh=34,top=24,H=top+rks.length*bh+8,s='';
  var maxV=Math.max(100,Math.ceil(Math.max.apply(null,rks.map(function(k){var r=rm[k];return r.orc>0?r.comp/r.orc*100:0;}).concat([0]))/25)*25);
  function X(v){return lw+pw*Math.min(v,maxV)/maxV;}
  for(var t=0;t<=maxV;t+=25){ s+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+(top-8)+'" y2="'+(H-4)+'" style="stroke:var(--vg-grade)"/><text x="'+X(t)+'" y="12" text-anchor="middle" style="fill:var(--txt-3);font-size:11px">'+t+'%</text>'; }
  rks.forEach(function(k,j){
    var r=rm[k],y=top+j*bh+bh/2,pp=r.orc>0?r.pago/r.orc*100:0,pc=r.orc>0?r.comp/r.orc*100:0,xp=X(pp),xc=X(pc);
    s+='<g data-pop role="button" tabindex="0" aria-label="'+esc(k+': '+D_PCT(pp)+' pago, '+D_PCT(pc)+' comprometido')+'" style="cursor:pointer" onclick="vgPopSeg(\'res\','+j+',event)" onkeydown="if(event.key===\'Enter\')vgPopSeg(\'res\','+j+',event)">'
      +'<rect x="0" y="'+(y-bh/2)+'" width="'+W+'" height="'+bh+'" style="fill:transparent"/>'
      +'<text x="0" y="'+(y+4)+'" style="fill:var(--txt);font-family:var(--font-mono);font-size:12px">'+esc(k)+'</text>'
      +'<line x1="'+xp+'" x2="'+xc+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--lin-forte);stroke-width:4;stroke-linecap:round"/>'
      +'<circle cx="'+xc+'" cy="'+y+'" r="7" style="fill:var(--vg-comp);stroke:var(--sup);stroke-width:2"/>'
      +'<circle cx="'+xp+'" cy="'+y+'" r="7" style="fill:var(--vg-pago);stroke:var(--sup);stroke-width:2"/>'
      +'<text x="'+(Math.max(xc,xp)+12)+'" y="'+(y+4)+'" style="fill:var(--txt);font-family:var(--font-mono);font-size:11px">'+D_PCT(pc)+'</text>'
      +(xc-xp>34?'<text x="'+(xp-12)+'" y="'+(y+4)+'" text-anchor="end" style="fill:var(--txt);font-family:var(--font-mono);font-size:11px">'+D_PCT(pp)+'</text>':'')
      +'</g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="Percentual pago e comprometido por resultado">'+s+'</svg>';
}

function renderResultados(){
  var rm=resMap(); var rks=Object.keys(rm);
  var pago=D.lanc.filter(function(l){return l.situacao==='pago';}).reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var orc=D.atv.reduce(function(s,a){return s+parseFloat(a.orcamento_usd||0);},0);
  var mProgR=D.matrizProg||[];
  var comMetaR=D.matrizItens;
  function progDe(id){ return mProgR.find(function(x){return x.id===id;})||{pct_confirmado:0,realizado_pendente:0}; }
  var metasProg=comMetaR.filter(function(i){return parseFloat(progDe(i.id).pct_confirmado||0)>0;}).length;
  var emRiscoGlobal=comMetaR.filter(function(i){return parseFloat(progDe(i.id).pct_confirmado||0)<40;}).length;

  var h='';
  // ── Matriz de Resultados ───────────────────────────────
  if(D.matrizItens&&D.matrizItens.length){
    var totalInd=D.matrizItens.length;
    var comMeta=D.matrizItens.filter(function(i){return parseFloat(i.meta_numerica||0)>0;});
    var atingidos=comMeta.filter(function(i){return parseFloat(progDe(i.id).pct_confirmado||0)>=100;}).length;
    var emRisco=comMeta.filter(function(i){return parseFloat(progDe(i.id).pct_confirmado||0)<40;}).length;
    var pendConf=mProgR.reduce(function(s,p){return s+parseFloat(p.realizado_pendente||0);},0);
    var mediaGeral=comMeta.length?Math.round(comMeta.reduce(function(s,i){return s+Math.min(parseFloat(progDe(i.id).pct_confirmado||0),100);},0)/comMeta.length):0;
    var nomeRes={}; D.res.forEach(function(r){nomeRes[r.codigo]=r.nome_pt;});
    var resNums=[]; comMeta.forEach(function(i){if(resNums.indexOf(i.resultado)<0)resNums.push(i.resultado);}); resNums.sort();

    var blocos=resNums.map(function(r){
      var itensR=comMeta.filter(function(i){return i.resultado===r;});
      var tok=vgResTok(r);
      var mediaR=Math.round(itensR.reduce(function(s,i){return s+Math.min(parseFloat(progDe(i.id).pct_confirmado||0),100);},0)/itensR.length);
      var hasPend=itensR.some(function(i){return parseFloat(progDe(i.id).realizado_pendente||0)>0;});
      var c=2*Math.PI*28,off=c*(1-Math.min(mediaR,100)/100);
      var dots=itensR.map(function(i){var p=parseFloat(progDe(i.id).pct_confirmado||0),m=vgPctMeta(p);
        return '<i title="'+esc((i.indicador||'')+' — '+Math.round(p)+'%')+'" style="background:var('+m[2]+')"></i>';}).join('');
      return '<div class="vg-ind"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="vg-res" style="background:var('+tok+')">R'+r+'</span>'
        +'<span class="vg-sub" style="margin:0;min-width:0;flex:1">'+esc(nomeRes['R'+r]||'')+'</span>'
        +(hasPend?'<span class="vg-pill vg-p-al">'+vgIc('relogio','p')+'pendente</span>':'')+'</div>'
        +'<div style="display:flex;gap:14px;align-items:center"><div class="vg-ring"><svg viewBox="0 0 68 68" width="68" height="68"><circle cx="34" cy="34" r="28" style="fill:none;stroke:var(--vg-livre);stroke-width:7"/>'
        +'<circle cx="34" cy="34" r="28" style="fill:none;stroke:var('+tok+');stroke-width:7;stroke-linecap:round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><span>'+mediaR+'%</span></div>'
        +'<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="vg-nota">'+itensR.length+' indicador'+(itensR.length!==1?'es':'')+'</span><div class="vg-dots">'+dots+'</div></div></div></div>';
    }).join('');

    h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Matriz de Resultados</h3><div class="vg-sub">Progresso confirmado pelos técnicos</div></div>'
      +'<a href="matriz.html" class="vg-btn">Ver matriz completa'+vgIc('seta','p')+'</a></div>'
      +'<div class="vg-kpis c5">'
      +'<div class="vg-kpi suave"><div class="vg-kpi-v peq '+(mediaGeral>=70?'vg-v-ok':mediaGeral>=40?'vg-v-alerta':'vg-v-erro')+'">'+mediaGeral+'%</div><div class="vg-kpi-s">progresso médio</div></div>'
      +'<div class="vg-kpi suave"><div class="vg-kpi-v peq">'+atingidos+'</div><div class="vg-kpi-s">metas atingidas</div></div>'
      +'<div class="vg-kpi suave"><div class="vg-kpi-v peq '+(emRisco>0?'vg-v-erro':'')+'">'+emRisco+'</div><div class="vg-kpi-s">em risco (abaixo de 40%)</div></div>'
      +'<div class="vg-kpi suave"><div class="vg-kpi-v peq '+(pendConf>0?'vg-v-alerta':'')+'">'+Math.round(pendConf)+'</div><div class="vg-kpi-s">aguardam confirmação</div></div>'
      +'<div class="vg-kpi suave"><div class="vg-kpi-v peq">'+totalInd+'</div><div class="vg-kpi-s">indicadores</div></div>'
      +'</div>'
      +'<div class="vg-g3">'+blocos+'</div>'
      +vgLeg([['--ok','80% ou mais','',true],['--alerta','40 a 79%','',true],['--erro','abaixo de 40%','',true]])
      +'</div>';
  }

  h+='<div class="vg-kpis">'
    +vgKpi('alvo','Metas com progresso',metasProg+' / '+comMetaR.length,'indicadores com progresso',vgMeter([[D_P(metasProg,comMetaR.length),'--pri-600']]))
    +vgKpi('moeda','Financeiro vs metas',D_PCT1(orc>0?pago/orc*100:0),'pago vs. orçamento total',vgMeter([[orc>0?pago/orc*100:0,'--vg-pago']]))
    +vgKpi('alerta','Indicadores em risco','<span class="'+(emRiscoGlobal>0?'vg-v-erro':'')+'">'+emRiscoGlobal+'</span>','com progresso abaixo de 40%')
    +vgKpi('grade','Resultados ativos',String(rks.length),'com atividades e orçamento')
    +'</div>';

  VG_SEG.res=function(i){ return _popResRadar(i,0,{data:{labels:rks}}); };
  h+='<div class="vg-g2">';

    mkChart('ch-res-grouped',{type:'bar',data:{labels:rks,datasets:[
      bala('Orçamento',rks.map(function(k){return rm[k].orc;}),'--vg-livre',.9,3),

      bala('Pago',rks.map(function(k){return rm[k].pago;}),'--vg-pago',.25,1)
    ]},options:vgOptH({mono:true,padR:80,fim:function(i){var r=rm[rks[i]];return r.orc>0?D_PCT(r.pago/r.orc*100)+' pago':'';},
      tt:{label:function(c){return ' '+c.dataset.label+': '+D_USD(c.raw);}}}),

}

function renderExecucao(){

  var _livre=Math.max(0,_orc-_comp);

  VG_SEG.proj=function(i){ return _popProjDonut(i,0,vgFalsoGraf(projPartes)); };

  var _brl_apagar=D.lanc.filter(function(l){return l.situacao==='a_pagar';}).reduce(function(s,l){return s+parseFloat(l.valor_brl||0);},0);

    +'<label for="fil-dt-fim">até<input type="date" id="fil-dt-fim"></label>'
    +'<label for="fil-sit">Situação<select id="fil-sit"><option value="">Todas</option><option value="pago">Pago</option><option value="a_pagar">A pagar</option><option value="cancelado">Cancelado</option></select></label>'
    +'<label for="fil-forn">Fornecedor<select id="fil-forn"><option value="">Todos</option>'+fornsOpts+'</select></label>'
    +'<label for="fil-contr">Contrato<select id="fil-contr"><option value="">Todos</option>'+contrOpts+'</select></label>'
    +'<label for="fil-atv">Atividade<select id="fil-atv"><option value="">Todas</option>'+atvOpts+'</select></label>'
    +'<button type="button" class="vg-btn" onclick="limparFiltros()">'+vgIc('x','p')+'Limpar filtros</button>'
    +'</div>';

  h+='<div id="fin-kpis" class="vg-kpis c5"></div>';

  h+='<div class="vg-g2">';
  h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Projeto em US$</h3><div class="vg-sub">Orçamento '+D_USDc(_orc)+' · não muda com os filtros · clique num trecho</div></div></div>'
    +vgCompBar([[_pago,'--vg-pago','Pago'],[_apagar,'--vg-apagar','A pagar'],[_tdr,'--vg-comp','Comprometido (TDR)']],_orc,'proj','Projeto em US$')
    +vgLeg([['--vg-pago','Pago',D_USDc(_pago)],['--vg-apagar','A pagar',D_USDc(_apagar)],['--vg-comp','Comprometido (TDR)',D_USDc(_tdr)],['--vg-livre','Livre',D_USDc(_livre)]])+'</div>';
  h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Contratos em R$</h3><div class="vg-sub">Contratado '+D_BRLc(_brl_contratado)+' · pago × a pagar × saldo · clique num trecho</div></div></div>'
    +vgCompBar([[_brl_pago,'--vg-pago','Pago',D_BRL],[_brl_apagar,'--vg-apagar','A pagar',D_BRL],[_brl_saldo,'--vg-comp','Saldo a executar',D_BRL]],_brl_contratado,'contr','Contratos em R$')
    +vgLeg([['--vg-pago','Pago',D_BRLc(_brl_pago)],['--vg-apagar','A pagar',D_BRLc(_brl_apagar)],['--vg-comp','Saldo a executar',D_BRLc(_brl_saldo)]])+'</div>';
  h+='</div>';

  var legMes=vgLeg([['--vg-pago','Pago'],['--vg-apagar','A pagar']]);
  h+=vgCardGraf('ch-acumulado-mensal','Pagamentos por mês','Pago e a pagar no mês, em R$ (data de pagamento ou de vencimento) · clique num mês',240,
    {leg:legMes,rolar:true,extra:'<div id="acum-btns" class="vg-seg" role="group" aria-label="Período"></div>'});

  h+='<div class="vg-g2">';

  h+=vgCardGraf('ch-fin-forn','Por fornecedor','8 maiores nos lançamentos filtrados · demais somados em "Outros"',300,{leg:legMes});
  h+='</div>';

  h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Lançamentos financeiros</h3><div class="vg-sub" id="fin-tab-sub"></div></div></div><div id="fin-tabela-wrap"><div class="empty-state"><div class="spinner"></div></div></div></div>';
  document.getElementById('pane-execucao').innerHTML=h;

  // filtros aplicam na hora
  ['fil-dt-ini','fil-dt-fim','fil-sit','fil-forn','fil-contr','fil-atv'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener('change',aplicarFiltros);
  });

var _acumModoAtual='todos';
function _acumSetBtn(modo){
  _acumModoAtual=modo;
  document.querySelectorAll('.acum-btn').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.modo===String(modo))); });
  renderAcumuladoMensal(modo);
}
window._acumSetBtn=_acumSetBtn;

function _acumPopularBtns(){
  var el=document.getElementById('acum-btns');
  if(!el)return;
  if(el.childElementCount===0){
    var anosSet={};
    D.lanc.forEach(function(l){var dt=l.dt_pagamento||l.dt_vencimento;if(dt){var y=new Date(dt+'T00:00:00').getFullYear();anosSet[y]=1;}});
    var anos=Object.keys(anosSet).map(Number).sort();
    var lista=[{label:'Todos os meses',modo:'todos'}].concat(anos.map(function(a){return {label:String(a),modo:a};}));
    el.innerHTML=lista.map(function(x){return '<button type="button" class="acum-btn" data-modo="'+x.modo+'" aria-pressed="false" onclick="_acumSetBtn(\''+x.modo+'\')">'+x.label+'</button>';}).join('');
  }
  _acumSetBtn(_acumModoAtual);
}

function renderAcumuladoMensal(modo){
  var lanc=D.lancFilt||D.lanc;
  var nmMeses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var labels=[],pagoArr=[],apagarArr=[];

  if(modo==='todos'){
    // Todos os meses presentes nos dados (ano+mês únicos, ordenados, sem lacunas)
    var mapa={};
    lanc.forEach(function(l){
      var dt=l.dt_pagamento||l.dt_vencimento;
      if(!dt)return;
      var d=new Date(dt+'T00:00:00');
      var key=d.getFullYear()*100+d.getMonth();
      if(!mapa[key])mapa[key]={pago:0,apagar:0};
      var v=parseFloat(l.valor_brl||0);
      if(l.situacao==='pago')mapa[key].pago+=v;
      else if(l.situacao==='a_pagar')mapa[key].apagar+=v;
    });
    var keys=Object.keys(mapa).map(Number).sort();
    if(keys.length>0){
      var cur=keys[0],kMax=keys[keys.length-1];
      while(cur<=kMax){
        var ano=Math.floor(cur/100),mes=cur%100;
        labels.push(nmMeses[mes]+'/'+String(ano).slice(2));
        var entry=mapa[cur]||{pago:0,apagar:0};
        pagoArr.push(entry.pago); apagarArr.push(entry.apagar);
        mes++;if(mes>11){mes=0;ano++;}
        cur=ano*100+mes;
      }
    }
  } else {
    var anoSel=parseInt(modo,10);
    for(var i=0;i<12;i++){pagoArr.push(0);apagarArr.push(0);}
    lanc.forEach(function(l){
      var dt=l.dt_pagamento||l.dt_vencimento;
      if(!dt)return;
      var d=new Date(dt+'T00:00:00');
      if(d.getFullYear()!==anoSel)return;
      var v=parseFloat(l.valor_brl||0);
      if(l.situacao==='pago')pagoArr[d.getMonth()]+=v;
      else if(l.situacao==='a_pagar')apagarArr[d.getMonth()]+=v;
    });
    labels=nmMeses.slice();
  }

  // Acumulado: só pago, e pago + a pagar (linha tracejada a partir do último mês com pagamento)
  var acPago=[],acTot=[],sp=0,st=0,ultPago=-1;
  for(var j=0;j<labels.length;j++){ sp+=pagoArr[j]; st+=pagoArr[j]+apagarArr[j]; acPago.push(sp); acTot.push(st); if(pagoArr[j]>0)ultPago=j; }
  var linhaPago=acPago.map(function(v,j){return j<=ultPago?v:null;});
  var linhaTot=acTot.map(function(v,j){return j>=Math.max(ultPago,0)?(j===ultPago?acPago[j]:v):null;});

  // Largura dinâmica: 56px por mês quando há muitos meses (rola na horizontal)
  var nCols=labels.length;
  ['ch-acumulado-mensal','ch-acum-linha'].forEach(function(id){
    var wrap=document.getElementById(id+'-wrap'),scroll=document.getElementById(id+'-rolar');
    if(!wrap)return;
    var minW=modo==='todos'?Math.max(nCols*56,scroll?scroll.clientWidth:600):null;
    wrap.style.width=minW?minW+'px':'';
  });

  var mesTab={_rotulo:'Mês',_fmt:function(v){return v==null?'—':D_BRL(v);}};
  mkChart('ch-acumulado-mensal',Object.assign({type:'bar',data:{labels:labels,datasets:[
      vgDs('Pago',pagoArr,'--vg-pago',Object.assign({stack:'m',maxBarThickness:32},VG_GAPV)),
      vgDs('A pagar',apagarArr,'--vg-apagar',Object.assign({stack:'m',maxBarThickness:32},VG_GAPV))
    ]},options:vgOptV({stacked:true,yfmt:vgEixoBRL,autoSkip:false,rot:nCols>14?45:0,
      tt:{label:function(c){return ' '+c.dataset.label+': '+D_BRL(c.raw);}}})},mesTab));
  var oL=vgOptV({yfmt:vgEixoBRL,autoSkip:false,rot:nCols>14?45:0,tt:{label:function(c){return c.raw==null?'':' '+c.dataset.label+': '+D_BRL(c.raw);}}});
  oL.interaction={mode:'index',intersect:false};
  oL.plugins.tooltip.filter=function(it){return it.raw!=null;};
  mkChart('ch-acum-linha',Object.assign({type:'line',data:{labels:labels,datasets:[
      {label:'Pago acumulado',data:linhaPago,_bd:'--vg-pago',_bg:'--vg-pago',_bgA:.12,fill:'origin',borderWidth:2,tension:.25,
        pointRadius:function(c){return c.dataIndex===ultPago?5:(nCols>24?0:3);},_pt:'--vg-pago',_ptb:'--sup',pointBorderWidth:2,spanGaps:false},
      {label:'Com o que está a pagar',data:linhaTot,_bd:'--vg-apagar',borderDash:[5,4],borderWidth:2,tension:.25,pointRadius:nCols>24?0:3,
        _pt:'--vg-apagar',_ptb:'--sup',pointBorderWidth:2,fill:false,spanGaps:false}
    ]},options:oL},mesTab));
  addPopupToChart('ch-acumulado-mensal',_popAcumulado);
  addPopupToChart('ch-acum-linha',_popAcumulado);
}
window.renderAcumuladoMensal=renderAcumuladoMensal;

function aplicarFiltros(){
  var dtIni=document.getElementById('fil-dt-ini').value;
  var dtFim=document.getElementById('fil-dt-fim').value;
  var sit=document.getElementById('fil-sit').value;
  var forn=document.getElementById('fil-forn').value;
  var contr=document.getElementById('fil-contr').value;
  var atv=document.getElementById('fil-atv').value;
  D.lancFilt=D.lanc.filter(function(l){
    if(sit&&l.situacao!==sit)return false;
    if(forn&&(!l.fornecedores||l.fornecedores.id!==forn))return false;
    if(contr&&(!l.contratos||l.contratos.id!==contr))return false;
    if(atv&&(!l.atividades||l.atividades.id!==atv))return false;
    if(dtIni&&l.dt_vencimento&&l.dt_vencimento<dtIni)return false;
    if(dtFim&&l.dt_vencimento&&l.dt_vencimento>dtFim)return false;
    return true;
  });
  renderFinTabela();
}
window.aplicarFiltros=aplicarFiltros;

function limparFiltros(){
  ['fil-dt-ini','fil-dt-fim','fil-sit','fil-forn','fil-contr','fil-atv'].forEach(function(id){
    var el=document.getElementById(id); if(el)el.value='';
  });
  D.lancFilt=D.lanc.slice();
  renderFinTabela();
}
window.limparFiltros=limparFiltros;

function renderFinTabela(){
  var lanc=D.lancFilt||D.lanc;
  var totBRL=lanc.reduce(function(s,l){return s+parseFloat(l.valor_brl||0);},0);
  var totUSD=lanc.reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var pagoUSD=lanc.filter(function(l){return l.situacao==='pago';}).reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var apagarUSD=lanc.filter(function(l){return l.situacao==='a_pagar';}).reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var nPago=lanc.filter(function(l){return l.situacao==='pago';}).length, nAp=lanc.filter(function(l){return l.situacao==='a_pagar';}).length;
  var nForn=(new Set(lanc.filter(function(l){return l.fornecedores;}).map(function(l){return l.fornecedores.id;}))).size;

  var kEl=document.getElementById('fin-kpis');
  if(kEl){
    kEl.innerHTML=
      vgKpi('recibo','Total (R$)',D_BRLc(totBRL),lanc.length+' lançamento(s)')+
      vgKpi('moeda','Total (US$)',D_USDc(totUSD),'mesmos lançamentos')+
      vgKpi('check','Pago',D_USDc(pagoUSD),nPago+' lançamento(s)',vgMeter([[totUSD>0?pagoUSD/totUSD*100:0,'--vg-pago']]))+
      vgKpi('relogio','A pagar',D_USDc(apagarUSD),nAp+' lançamento(s)',vgMeter([[totUSD>0?apagarUSD/totUSD*100:0,'--vg-apagar']]))+
      vgKpi('fluxo','Fornecedores',String(nForn),'com lançamento');
  }

  var tbody='';
  if(lanc.length===0){
    tbody='<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--txt-3)">Nenhum lançamento encontrado para os filtros escolhidos.</td></tr>';
  } else {
    lanc.forEach(function(l){
      tbody+='<tr>'
        +'<td><span class="vg-cod">'+esc(l.atividades&&l.atividades.codigo||'—')+'</span></td>'
        +'<td class="trunc" title="'+esc(l.descricao||'')+'">'+esc(l.descricao||'—')+'</td>'
        +'<td>'+esc(l.fornecedores&&l.fornecedores.nome||'—')+'</td>'
        +'<td class="mono">'+esc(l.numero_nf||'—')+'</td>'
        +'<td>'+esc(l.elemento_despesa||'—')+'</td>'
        +'<td class="n">'+D_BRL(l.valor_brl)+'</td>'
        +'<td class="n">'+D_USD(l.valor_usd)+'</td>'
        +'<td class="mono" style="white-space:nowrap">'+D_DATE(l.dt_vencimento)+'</td>'
        +'<td>'+_sitPill(l.situacao)+'</td>'
        +'</tr>';
    });
  }
  var sub=document.getElementById('fin-tab-sub'); if(sub) sub.textContent=lanc.length+' lançamento(s) · '+D_BRL(totBRL)+' · '+D_USD(totUSD);
  var wrap=document.getElementById('fin-tabela-wrap');
  if(wrap) wrap.innerHTML='<div class="vg-tbl-w"><table class="vg-tbl"><thead><tr><th>Atividade</th><th>Descrição</th><th>Fornecedor</th><th>NF</th><th>Elemento</th><th class="n">Valor R$</th><th class="n">Valor US$</th><th>Vencimento</th><th>Situação</th></tr></thead><tbody>'+tbody+'</tbody>'
    +(lanc.length?'<tfoot><tr><td colspan="5">Total ('+lanc.length+')</td><td class="n">'+D_BRL(totBRL)+'</td><td class="n">'+D_USD(totUSD)+'</td><td colspan="2"></td></tr></tfoot>':'')+'</table></div>';

  setTimeout(function(){
    // Valor por atividade (pago + a pagar, US$)
    var atvMap={};
    lanc.forEach(function(l){ if(l.situacao==='cancelado')return; var k=l.atividades&&l.atividades.codigo||'Sem atividade';
      if(!atvMap[k])atvMap[k]={p:0,a:0}; atvMap[k][l.situacao==='pago'?'p':'a']+=parseFloat(l.valor_usd||0); });
    var atvKs=Object.keys(atvMap).sort(function(a,b){return (atvMap[b].p+atvMap[b].a)-(atvMap[a].p+atvMap[a].a);}).slice(0,8);
    var g=Object.assign({maxBarThickness:18,borderRadius:3},VG_GAP);
    mkChart('ch-fin-atv',{type:'bar',data:{labels:atvKs,datasets:[
      vgDs('Pago',atvKs.map(function(k){return atvMap[k].p;}),'--vg-pago',g),vgDs('A pagar',atvKs.map(function(k){return atvMap[k].a;}),'--vg-apagar',g)
    ]},options:vgOptH({stacked:true,mono:true,padR:72,fim:function(i){var x=atvMap[atvKs[i]];return D_USDc(x.p+x.a);},
      tt:{label:function(c){return ' '+c.dataset.label+': '+D_USD(c.raw);}}}),_fmt:function(v){return D_USD(v);},_rotulo:'Atividade'});

    // Por fornecedor: 8 maiores + "Outros"
    var fornMap={};
    lanc.forEach(function(l){ if(l.situacao==='cancelado')return; var k=l.fornecedores&&l.fornecedores.nome||'Sem fornecedor';
      if(!fornMap[k])fornMap[k]={p:0,a:0}; fornMap[k][l.situacao==='pago'?'p':'a']+=parseFloat(l.valor_usd||0); });
    var fornTodos=Object.keys(fornMap).sort(function(a,b){return (fornMap[b].p+fornMap[b].a)-(fornMap[a].p+fornMap[a].a);});
    var fornKs=fornTodos.slice(0,8), outros=fornTodos.slice(8);
    var rotOutros='Outros ('+outros.length+')';
    if(outros.length){ fornMap[rotOutros]=outros.reduce(function(s,k){return {p:s.p+fornMap[k].p,a:s.a+fornMap[k].a};},{p:0,a:0}); fornKs.push(rotOutros); }
    _POP_DATA.fornOutros=outros; _POP_DATA.fornRotOutros=rotOutros;
    mkChart('ch-fin-forn',{type:'bar',data:{labels:fornKs,datasets:[
      vgDs('Pago',fornKs.map(function(k){return fornMap[k].p;}),'--vg-pago',g),vgDs('A pagar',fornKs.map(function(k){return fornMap[k].a;}),'--vg-apagar',g)
    ]},options:vgOptH({stacked:true,padR:72,fim:function(i){var x=fornMap[fornKs[i]];return D_USDc(x.p+x.a);},
      tt:{label:function(c){return ' '+c.dataset.label+': '+D_USD(c.raw);}}}),_fmt:function(v){return D_USD(v);},_rotulo:'Fornecedor'});
    // nomes longos no eixo: corta, o nome inteiro fica na dica e na tabela
    if(CHARTS['ch-fin-forn']){ CHARTS['ch-fin-forn'].options.scales.y.ticks.callback=function(v,i){var n=fornKs[i]||'';return n.length>24?n.substring(0,23)+'…':n;}; CHARTS['ch-fin-forn'].update('none'); }

    _acumPopularBtns();
    addPopupToChart('ch-fin-atv',_popFinAtv);
    addPopupToChart('ch-fin-forn',_popFinForn);
  },50);
}

      +'<div class="vg-kpi-l"><span class="vg-pill '+n[1]+'">'+vgIc(n[2],'p')+n[0]+'</span></div>'

  h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Todos os alertas ('+alertas.length+')</h3><div class="vg-sub" id="al-filtro-txt">Clique num contador acima para filtrar</div></div></div>';
  if(alertas.length===0){

        +'<div class="vg-it-a"><span class="vg-pill '+n[1]+'">'+n[0]+'</span>'+btn+'</div></div>';

    h+='</div>';

  h+='</div>';
  document.getElementById('pane-alertas').innerHTML=h;

  setTimeout(function(){
    mkChart('ch-saldo-status',{type:'bar',data:{labels:salUsados.map(function(k){return SAL_ST[k][0];}),datasets:[
      vgDs('Atividades',salUsados.map(function(k){return salCnt[k];}),salUsados.map(function(k){return SAL_ST[k][3];}),{maxBarThickness:18})
    ]},options:vgOptH({xfmt:vgInteiro,padR:40,fim:function(i){return String(salCnt[salUsados[i]]);}}),_rotulo:'Situação'});
    addPopupToChart('ch-saldo-status',_popSaldoStatus);
