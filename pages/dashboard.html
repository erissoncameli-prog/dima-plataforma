}
window.vgFiltrarAlertas=function(k){
  var bs=document.querySelectorAll('#pane-alertas button.vg-kpi');
  var ativo=document.querySelector('#pane-alertas button.vg-kpi[data-nivel="'+k+'"]');
  var ligar=ativo&&ativo.getAttribute('aria-pressed')!=='true';
  bs.forEach(function(b){b.setAttribute('aria-pressed',String(ligar&&b===ativo));});
  document.querySelectorAll('#lista-alertas .vg-item').forEach(function(it){ it.hidden=ligar&&it.dataset.nivel!==k; });
  var t=document.getElementById('al-filtro-txt');
  if(t) t.textContent=ligar?'Mostrando só: '+ALERTA_NIVEL[k][0]+' · clique de novo para ver todos':'Clique num contador acima para filtrar';
};

// ── PAINEL DE TAREFAS ─────────────────────────────────────
async function renderTarefas() {
  var el = document.getElementById('pane-tarefas');
  if(!el) return;
  el.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';

  // Buscar tarefas, vencimentos, devolvidos e notificações em paralelo
  var [rTarefas, rVenc, rDevolvidas, rNotifAval, rNotifDev, rNotifOutras] = await Promise.all([
    db.rpc('get_minhas_tarefas'),
    db.rpc('get_produtos_vencendo', { dias_limite: 30 }),
    db.rpc('get_minhas_entregas_devolvidas'),
    db.from('notificacoes')
      .select('id,titulo,mensagem,tipo,link,entidade_id,criado_em')
      .eq('usuario_id', appState.usuario.id)
      .eq('tipo', 'produto_para_avaliar')
      .eq('lida', false)
      .order('criado_em', {ascending: false})
      .limit(10),
    db.from('notificacoes')
      .select('id,titulo,mensagem,tipo,link,entidade_id,criado_em')
      .eq('usuario_id', appState.usuario.id)
      .eq('tipo', 'produto_devolvido')
      .eq('lida', false)
      .order('criado_em', {ascending: false})
      .limit(10),
    db.from('notificacoes')
      .select('id,titulo,mensagem,tipo,link,entidade_id,criado_em')
      .eq('usuario_id', appState.usuario.id)
      .eq('lida', false)
      .not('tipo', 'in', '("produto_para_avaliar","produto_devolvido")')
      .order('criado_em', {ascending: false})
      .limit(5)
  ]);

  var tarefas     = rTarefas.data     || [];
  var vencendo    = rVenc.data        || [];
  var devolvidas  = rDevolvidas.data  || [];
  var notifAval   = rNotifAval.data   || [];
  var notifDev    = rNotifDev.data    || [];
  var notifOutras = rNotifOutras.data || [];

  // ── Verificar status atual das entidades para detectar notificações já atendidas ──
  // Garante que o painel não mostre "pendente" para itens que outro usuário já resolveu.
  var prodIdsAval  = notifAval.filter(function(n){ return n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var prodIdsDev   = notifDev.filter(function(n){ return n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var prodIdsPag   = notifOutras.filter(function(n){ return n.tipo==='produto_aguarda_pagamento' && n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var viagIds      = notifOutras.filter(function(n){ return n.tipo==='viagem_solicitada' && n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var tdrIdsOut    = notifOutras.filter(function(n){ return n.tipo==='tdr_para_revisar' && n.entidade_id; }).map(function(n){ return n.entidade_id; });

  // IDs únicos de contratos_produtos (aval + dev + pag)
  var cpIdsUnicos = [...new Set([...prodIdsAval, ...prodIdsDev, ...prodIdsPag])];

  var statusProdAval = {}, statusProdDev = {}, statusProdPag = {}, statusViag = {}, statusTdrOut = {};
  await Promise.all([
    cpIdsUnicos.length && db.from('contratos_produtos').select('id,situacao').in('id', cpIdsUnicos)
      .then(function(r){ (r.data||[]).forEach(function(p){
        statusProdAval[p.id] = p.situacao;
        statusProdDev[p.id]  = p.situacao;
        statusProdPag[p.id]  = p.situacao;
      }); }),
    viagIds.length     && db.from('viagem_protocolos').select('id,situacao').in('id', viagIds)
      .then(function(r){ (r.data||[]).forEach(function(v){ statusViag[v.id]=v.situacao; }); }),
    tdrIdsOut.length   && db.from('tdrs').select('id,status').in('id', tdrIdsOut)
      .then(function(r){ (r.data||[]).forEach(function(t){ statusTdrOut[t.id]=t.status; }); }),
  ].filter(Boolean));

  // Separar notifAval em ativas vs já atendidas por outro usuário
  var notifAvalAtivas = [], notifAvalAtendidas = [];
  notifAval.forEach(function(n) {
    var sit = statusProdAval[n.entidade_id];
    if (sit && sit !== 'em_analise') notifAvalAtendidas.push(n);
    else notifAvalAtivas.push(n);
  });
  // Separar notifDev: se produto não está mais "devolvido" (foi resubmetido), já foi atendido
  var notifDevAtivas = [], notifDevAtendidas = [];
  notifDev.forEach(function(n) {
    var sit = statusProdDev[n.entidade_id];
    // Permanece devolvido quando situação ainda indica pendência de correção
    var pendDev = !sit || sit === 'devolvido' || sit === 'pendente';
    if (pendDev) notifDevAtivas.push(n);
    else notifDevAtendidas.push(n);
  });
  // Separar notifOutras: viagens aprovadas/rejeitadas, TDRs resolvidos e pagamentos já feitos
  var notifOutrasPend = [], notifOutrasAtend = [];
  var tdrPendentes = ['rascunho','revisao_interna','enviado_unesco','retorno_unesco','submetido','pendente_correcao'];
  notifOutras.forEach(function(n) {
    var atendido = false;
    if (n.tipo === 'produto_aguarda_pagamento' && n.entidade_id) {
      var sit = statusProdPag[n.entidade_id];
      // Órfão (registro deletado/substituído) ou já pago
      if (!sit || sit === 'pago') atendido = true;
    } else if (n.tipo === 'viagem_solicitada' && n.entidade_id) {
      var sit = statusViag[n.entidade_id];
      if (sit && sit !== 'solicitado') atendido = true;
    } else if (n.tipo === 'tdr_para_revisar' && n.entidade_id) {
      var sit = statusTdrOut[n.entidade_id];
      if (sit && !tdrPendentes.includes(sit)) atendido = true;
    }
    if (atendido) notifOutrasAtend.push(n);
    else notifOutrasPend.push(n);
  });

  // Auto-marcar como lida as que já foram atendidas (disparo sem aguardar)
  var idsParaMarcar = notifAvalAtendidas.concat(notifDevAtendidas).concat(notifOutrasAtend).map(function(n){ return n.id; });
  if (idsParaMarcar.length) {
    db.from('notificacoes').update({ lida: true, lida_em: new Date().toISOString() })
      .in('id', idsParaMarcar).then(function(){}).catch(function(){});
  }

  // Usar listas filtradas daqui em diante
  notifAval   = notifAvalAtivas;
  notifDev    = notifDevAtivas;
  notifOutras = notifOutrasPend;

  var perfil   = appState.perfil;
  var nome     = appState.usuario?.nome_completo?.split(' ')[0] || '';
  var hora     = new Date().getHours();
  var saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';

  var totalAval = tarefas.length || notifAval.length;
  var totalDev  = devolvidas.length || notifDev.length;
  vgContador('tarefas', totalAval + totalDev);
  function q(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  function notifClick(n){ return "clicarNotif('"+q(n.id)+"','"+q(n.link)+"','"+q(n.entidade_id)+"')"; }
  function dtHora(d){ return d ? new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''; }
  // item de lista: faixa de cor + ícone + texto + ação
  function item(o){
    return '<div class="vg-item'+(o.clic?' clic':'')+'"'+(o.atv!=null?' data-atv="'+esc(o.atv)+'"':'')+(o.clic?' role="button" tabindex="0" onclick="'+o.clic+'" onkeydown="if(event.key===\'Enter\')'+o.clic.replace(/"/g,'&quot;')+'"':'')+'>'
      +'<span class="vg-faixa" style="background:var('+o.cor+')"></span>'
      +'<span class="vg-ico" style="background:var('+o.bg+');color:var('+o.cor+')">'+vgIc(o.ic)+'</span>'
      +'<div style="min-width:0"><div class="vg-it-t">'+o.t+'</div>'+(o.s?'<div class="vg-it-s">'+o.s+'</div>':'')+(o.extra||'')+(o.m?'<div class="vg-it-m">'+o.m+'</div>':'')+'</div>'
      +'<div class="vg-it-a">'+(o.a||'')+'</div></div>';
  }
  function filtrosAval(cods,total,contar){
    if(cods.length<2) return '';
    return '<div class="vg-seg" role="group" aria-label="Filtrar por atividade"><button type="button" class="pill-aval" aria-pressed="true" onclick="filtrarAval(null,this)">Todas ('+total+')</button>'
      +cods.map(function(cod){return '<button type="button" class="pill-aval" aria-pressed="false" onclick="filtrarAval(\''+q(esc(cod))+'\',this)">'+esc(cod)+' ('+contar(cod)+')</button>';}).join('')+'</div>';
  }

  var h = '';

  // ── Faixa de saudação ─────────────────────────────────────
  var resumoTxt;
  if(totalAval === 0 && totalDev === 0 && vencendo.length === 0 && notifOutras.length === 0) resumoTxt = 'Você não tem tarefas pendentes no momento.';
  else {
    var partes = [];
    if(totalAval) partes.push(totalAval + ' produto(s) aguardando avaliação');
    if(totalDev)  partes.push(totalDev  + ' produto(s) devolvido(s) para correção');
    if(vencendo.length) partes.push(vencendo.length + ' produto(s) com vencimento próximo');
    resumoTxt = partes.length ? partes.join(' · ') : 'Você tem notificações não lidas.';
  }
  h += '<div class="vg-saud"><div><h2>'+saudacao+', '+esc(nome)+'</h2><p>'+esc(resumoTxt)+'</p></div>'
    + '<div class="vg-saud-n"><div><b>'+totalAval+'</b><span>avaliações</span></div><div><b>'+totalDev+'</b><span>devolvidos</span></div>'
    + '<div><b>'+vencendo.length+'</b><span>vencem em 30 dias</span></div><div><b>'+notifOutras.length+'</b><span>notificações</span></div></div></div>';

  h += '<div class="vg-g2">';

  // ── COLUNA ESQUERDA: Avaliações + Devolvidos ─────────────
  h += '<div style="display:flex;flex-direction:column;gap:16px;min-width:0">';
  h += '<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Avaliações pendentes</h3><div class="vg-sub">Produtos entregues aguardando seu parecer</div></div>'
    + (totalAval?'<span class="vg-pill vg-p-in">'+totalAval+'</span>':'')+'</div>';

  if(tarefas.length) {
    // Fonte primária: produtos em_analise no banco
    var atvMap = {};
    tarefas.forEach(function(t){ if(t.atividade_cod) atvMap[t.atividade_cod] = 1; });
    h += filtrosAval(Object.keys(atvMap),tarefas.length,function(cod){return tarefas.filter(function(t){return t.atividade_cod===cod;}).length;});
    h += '<div class="vg-lista" id="lista-aval">';
    tarefas.forEach(function(t) {
      var dias = parseInt(t.dias_aguardando) || 0;
      var urgente = dias >= 3;
      var meta = '<span class="vg-pill vg-p-in">Em avaliação</span>'
        + (t.dt_entrega ? '<span>Entregue '+D_DATE(t.dt_entrega)+'</span>' : '')
        + '<span class="vg-pill '+(urgente?'vg-p-er':'vg-p-ne')+'">'+(urgente?vgIc('alerta','p'):'')+dias+'d aguardando</span>'
        + (t.arquivo_nome ? '<span>'+vgIc('clipe','p')+' '+esc(t.arquivo_nome.substring(0,24))+'</span>' : '');
      h += item({atv:t.atividade_cod||'',cor:'--info',bg:'--info-bg',ic:'doc',
        t:'Produto '+esc(t.produto_num)+' — '+esc((t.produto_desc||'').substring(0,60))+((t.produto_desc||'').length>60?'…':''),
        s:'<span class="vg-cod">'+esc(t.atividade_cod||'')+'</span> '+esc((t.atividade_nome||'').substring(0,50))+((t.atividade_nome||'').length>50?'…':''),
        m:meta, a:'<a href="produtos.html?entrega='+encodeURIComponent(t.entrega_id)+'" class="vg-btn pri peq">'+vgIc('busca','p')+'Avaliar</a>'});
    });
    h += '</div>';
  } else if(notifAval.length) {
    // Fallback: notificações produto_para_avaliar não lidas ("Produto aguardando avaliação — AT-001")
    var atvMapN = {};
    notifAval.forEach(function(n){ var cod = (n.titulo||'').split(' — ')[1] || ''; if(cod) atvMapN[cod] = 1; });
    h += filtrosAval(Object.keys(atvMapN),notifAval.length,function(cod){return notifAval.filter(function(n){return (n.titulo||'').endsWith('— '+cod);}).length;});
    h += '<div class="vg-lista" id="lista-aval">';
    notifAval.forEach(function(n) {
      h += item({atv:(n.titulo||'').split(' — ')[1]||'',cor:'--alerta',bg:'--alerta-bg',ic:'doc',clic:notifClick(n),
        t:esc(n.titulo||''), s:n.mensagem?esc((n.mensagem||'').substring(0,80)):'',
        m:'<span class="vg-pill vg-p-al">Aguarda avaliação</span><span>'+dtHora(n.criado_em)+'</span>',
        a:'<button type="button" class="vg-btn pri peq" onclick="event.stopPropagation();'+notifClick(n)+'">'+vgIc('busca','p')+'Avaliar</button>'});
    });
    h += '</div>';
  } else {
    h += vgVazio('Nenhuma avaliação pendente');
  }
  h += '</div>';

  if(totalDev) {
    h += '<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Produtos devolvidos para você</h3><div class="vg-sub">Aguardando correção e reenvio</div></div><span class="vg-pill vg-p-er">'+totalDev+'</span></div><div class="vg-lista">';
    if(devolvidas.length) {
      devolvidas.forEach(function(d) {
        var venc = d.dt_vencimento ? new Date(d.dt_vencimento+'T12:00:00') : null;
        var diasV = venc ? Math.ceil((venc - new Date()) / 86400000) : null;
        var vencTxt = '';
        if(diasV !== null) {
          if(diasV < 0) vencTxt = '<span class="vg-pill vg-p-er">'+vgIc('relogio','p')+Math.abs(diasV)+'d vencido</span>';
          else if(diasV <= 7) vencTxt = '<span class="vg-pill vg-p-al">'+vgIc('relogio','p')+'Vence em '+diasV+'d</span>';
        }
        var dtDesp = d.despachado_em ? new Date(d.despachado_em).toLocaleDateString('pt-BR') : '';
        h += item({cor:'--erro',bg:'--erro-bg',ic:'voltar',
          t:'Produto '+esc(d.produto_num)+' — '+esc((d.produto_desc||'').substring(0,60))+((d.produto_desc||'').length>60?'…':''),
          s:d.atividade_cod?'<span class="vg-cod">'+esc(d.atividade_cod)+'</span> '+esc((d.atividade_nome||'').substring(0,50)):'',
          extra:d.despacho_texto?'<div class="vg-citacao">'+esc(d.despacho_texto.substring(0,140))+(d.despacho_texto.length>140?'…':'')+'</div>':'',
          m:'<span class="vg-pill vg-p-er">Devolvido</span>'+(dtDesp?'<span>Devolvido '+dtDesp+'</span>':'')+vencTxt,
          a:'<a href="produtos.html?entrega='+encodeURIComponent(d.entrega_id)+'" class="vg-btn perigo peq">'+vgIc('voltar','p')+'Corrigir</a>'});
      });
    } else {
      notifDev.forEach(function(n) {
        h += item({cor:'--erro',bg:'--erro-bg',ic:'voltar',clic:notifClick(n),t:esc(n.titulo||''),
          extra:n.mensagem?'<div class="vg-citacao">'+esc((n.mensagem||'').substring(0,140))+'</div>':'',
          m:'<span class="vg-pill vg-p-er">Devolvido</span><span>'+dtHora(n.criado_em)+'</span>',
          a:'<button type="button" class="vg-btn perigo peq" onclick="event.stopPropagation();'+notifClick(n)+'">'+vgIc('voltar','p')+'Corrigir</button>'});
      });
    }
    h += '</div></div>';
  }
  h += '</div>';

  // ── COLUNA DIREITA: Vencimentos + Notificações ───────────
  h += '<div style="display:flex;flex-direction:column;gap:16px;min-width:0">';
  h += '<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Vencimentos próximos</h3><div class="vg-sub">Produtos com prazo nos próximos 30 dias</div></div>'
    + (vencendo.length?'<span class="vg-pill vg-p-al">'+vencendo.length+'</span>':'')+'</div>';
  if(!vencendo.length) {
    h += vgVazio('Nenhum vencimento próximo');
  } else {
    h += '<div>';
    var sitNm = {pendente:['Pendente','vg-p-al'],em_analise:['Em avaliação','vg-p-in'],entrega_parcial:['Parcial','vg-p-ia']};
    vencendo.forEach(function(v) {
      var dias = parseInt(v.dias_restantes);
      var vencido = dias < 0;
      var cls = vencido ? 'vg-p-er' : dias <= 7 ? 'vg-p-al' : 'vg-p-ne';
      var sit = sitNm[v.situacao] || [v.situacao||'—','vg-p-ne'];
      h += '<div class="vg-venc"><div class="vg-venc-d '+cls+'">'+Math.abs(dias)+'<small>'+(vencido?'dias atrás':'dias')+'</small></div>'
        + '<div style="min-width:0"><div class="vg-it-t">Produto '+esc(v.produto_num)+' — '+esc((v.produto_desc||'').substring(0,50))+((v.produto_desc||'').length>50?'…':'')+'</div>'
        + '<div class="vg-it-s"><span class="vg-cod">'+esc(v.atividade_cod||'')+'</span> Contrato '+esc(v.contrato_numero||'')+' <span class="vg-pill '+sit[1]+'">'+esc(sit[0])+'</span></div></div></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Notificações não lidas (exceto produto_para_avaliar — já exibidas acima)
  if(notifOutras.length) {
    var icoNotif = {produto_aprovado:'check',produto_devolvido:'voltar',tdr_para_revisar:'doc',viagem_solicitada:'aviao',viagem_aprovada:'check',viagem_prestacao:'recibo'};
    h += '<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Notificações</h3><div class="vg-sub">Não lidas · clique para abrir</div></div><span class="vg-pill vg-p-er">'+notifOutras.length+'</span></div><div class="vg-lista">';
    notifOutras.forEach(function(n) {
      var temLink = !!(n.link || n.entidade_id);
      h += item({cor:'--txt-3',bg:'--bg-2',ic:icoNotif[n.tipo]||'sino',clic:temLink?notifClick(n):null,
        t:esc((n.titulo||'').substring(0,70)), s:n.mensagem?esc((n.mensagem||'').substring(0,80)):'',
        a:'<span class="vg-nota">'+dtHora(n.criado_em)+'</span>'+(temLink?vgIc('seta','p'):'')});
    });
    h += '</div><button type="button" onclick="abrirSino()" class="vg-btn" style="align-self:center">Ver todas as notificações</button></div>';
  }

  h += '</div>'; // coluna direita
  h += '</div>'; // .vg-g2

  el.innerHTML = h;
}

function filtrarAval(cod, btn) {
  document.querySelectorAll('.pill-aval').forEach(function(b) { b.setAttribute('aria-pressed', String(b === btn)); });
  var lista = document.getElementById('lista-aval');
  if(!lista) return;
  lista.querySelectorAll('.vg-item').forEach(function(el) { el.hidden = !!cod && el.dataset.atv !== cod; });
}
window.filtrarAval = filtrarAval;

// ─────────────────────────────────────────────────────────
// GUIA 7 — COBERTURA DE INDICADORES
// ─────────────────────────────────────────────────────────
function renderCobertura(){
  var el=document.getElementById('pane-cobertura');
  if(!el)return;

  var resById={}; D.res.forEach(function(r){resById[r.id]=r;});
  var resNomes={}; D.res.forEach(function(r){resNomes[r.codigo]=r.nome_pt||r.nome||r.codigo;});
  var atvById={}; D.atv.forEach(function(a){atvById[a.id]=a;});
  // atividade → [matriz_item_id] e indicador → [atividade_id]
  var atvToMat={}, matToAtv={};
  D.atvMatriz.forEach(function(l){
    (atvToMat[l.atividade_id]=atvToMat[l.atividade_id]||[]).push(l.matriz_item_id);
    (matToAtv[l.matriz_item_id]=matToAtv[l.matriz_item_id]||[]).push(l.atividade_id);
  });
  var progMap={}; D.matrizProg.forEach(function(p){progMap[p.id]=p;});
  // contribuições confirmadas por indicador e mês
  var sparkByInd={};
  D.contribs.forEach(function(c){
    var dt=c.contratos_produtos_entregas&&c.contratos_produtos_entregas.dt_entrega;
    if(!dt)return;
    var m=dt.substring(0,7);
    if(!sparkByInd[c.matriz_item_id])sparkByInd[c.matriz_item_id]={};
    sparkByInd[c.matriz_item_id][m]=(sparkByInd[c.matriz_item_id][m]||0)+parseFloat(c.valor||0);
  });
  function corPct(p){ return p>=70?'--ok':p>=40?'--alerta':'--erro'; }

  // Minigráfico do acumulado confirmado; linha pontilhada = meta
  function sparkSVG(indId, meta){
    var byMonth=sparkByInd[indId]||{};
    var months=Object.keys(byMonth).sort().slice(-8);
    if(months.length<2)return'<div class="vg-nota" style="height:40px;display:flex;align-items:center">Sem histórico de contribuições</div>';
    var cum=0;
    var pts=months.map(function(m){cum+=byMonth[m];return cum;});
    var maxV=parseFloat(meta)||Math.max.apply(null,pts)||1;
    var W=200,H=40,pad=4;
    var coords=pts.map(function(v,i){ return [pad+i*(W-2*pad)/(pts.length-1), pad+(1-Math.min(v/maxV,1))*(H-2*pad)]; });
    var line=coords.map(function(c,i){return(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1);}).join('');
    var fim=coords[coords.length-1];
    var cor=corPct(maxV>0?Math.min(pts[pts.length-1]/maxV,1)*100:0);
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:40px;display:block" preserveAspectRatio="none" role="img" aria-label="Acumulado confirmado nos últimos meses">'
      +(parseFloat(meta)>0?'<line x1="'+pad+'" y1="'+pad+'" x2="'+(W-pad)+'" y2="'+pad+'" style="stroke:var(--lin-forte);stroke-dasharray:3 3" vector-effect="non-scaling-stroke"/>':'')
      +'<path d="'+line+' L'+fim[0].toFixed(1)+','+(H-pad)+' L'+pad+','+(H-pad)+' Z" style="fill:var('+cor+');opacity:.12"/>'
      +'<path d="'+line+'" style="fill:none;stroke:var('+cor+');stroke-width:2;stroke-linejoin:round;stroke-linecap:round" vector-effect="non-scaling-stroke"/>'
      +'<circle cx="'+fim[0].toFixed(1)+'" cy="'+fim[1].toFixed(1)+'" r="3.5" style="fill:var('+cor+');stroke:var(--sup);stroke-width:1.5"/>'
      +'</svg>';
  }

  // ── Resumo ───────────────────────────────────────────────
  var total=D.atv.length;
  var comVinculo=D.atv.filter(function(a){return(atvToMat[a.id]||[]).length>0;}).length;
  var semVinculo=total-comVinculo;
  var indOrfaos=D.matrizItens.filter(function(mi){return!(matToAtv[mi.id]||[]).length;}).length;
  var pctCob=total>0?Math.round(comVinculo/total*100):0;
  vgContador('cobertura',semVinculo+indOrfaos);

  var h='<div class="vg-kpis">'
    +vgKpi('fluxo','Total de atividades',String(total),'no projeto')
    +vgKpi('link','Com indicador vinculado',String(comVinculo),pctCob+'% do total',vgMeter([[pctCob,'--ok']]))
    +vgKpi('alerta','Sem vínculo com indicador','<span class="'+(semVinculo?'vg-v-erro':'')+'">'+semVinculo+'</span>','não aparecem na matriz')
    +vgKpi('alvo','Indicadores órfãos','<span class="'+(indOrfaos?'vg-v-serio':'')+'">'+indOrfaos+'</span>','de '+D.matrizItens.length+' na matriz')
    +'</div>';

  // ── Indicadores agrupados por resultado (seções recolhíveis) ──
  h+='<div><h3 class="vg-tit">Indicadores da Matriz de Resultados</h3><div class="vg-sub">Progresso confirmado, tendência e atividades que cobrem cada indicador</div></div>';
  if(!D.matrizItens.length){
    h+='<div class="vg-card">'+vgVazio('Nenhum indicador cadastrado na Matriz de Resultados.','info')+'</div>';
  } else {
    var resultadosUnicos=[];
    D.matrizItens.forEach(function(mi){if(resultadosUnicos.indexOf(mi.resultado)<0)resultadosUnicos.push(mi.resultado);});
    resultadosUnicos.sort();
    resultadosUnicos.forEach(function(res){
      var itensRes=D.matrizItens.filter(function(mi){return mi.resultado===res;});
      var tok=vgResTok(res);
      var rotRes=/^\d+$/.test(String(res))?'R'+res:String(res);
      var nomeRes=resNomes[rotRes]||resNomes[res]||rotRes;
      var comMetaR=itensRes.filter(function(mi){return parseFloat(mi.meta_numerica||0)>0;});
      var mediaR=comMetaR.length?Math.round(comMetaR.reduce(function(s,mi){return s+Math.min(parseFloat((progMap[mi.id]||{}).pct_confirmado||0),100);},0)/comMetaR.length):0;
      var indOrfaosR=itensRes.filter(function(mi){return!(matToAtv[mi.id]||[]).length;}).length;

      h+='<details class="vg-sec" open><summary><span class="vg-res" style="background:var('+tok+')">'+esc(rotRes)+'</span><span class="nm">'+esc(nomeRes)+'</span>'
        +'<span class="vg-meter" style="width:90px">'+'<i style="width:'+mediaR+'%;background:var('+tok+')"></i></span>'
        +'<span class="mono" style="font-size:12px;color:var(--txt)">'+mediaR+'%</span><span class="vg-nota">'+itensRes.length+' ind.</span>'
        +(indOrfaosR>0?'<span class="vg-pill vg-p-al">'+indOrfaosR+' sem atividade</span>':'')
        +vgIc('chev','vg-chev')+'</summary><div class="vg-sec-c">';

      itensRes.forEach(function(mi){
        var prog=progMap[mi.id]||{realizado_confirmado:0,realizado_pendente:0,pct_confirmado:0};
        var meta=parseFloat(mi.meta_numerica||0);
        var conf=parseFloat(prog.realizado_confirmado||0);
        var pend=parseFloat(prog.realizado_pendente||0);
        var pct=meta>0?Math.min(conf/meta*100,100):0;
        var pctPend=meta>0?Math.min(pend/meta*100,100-pct):0;
        var atvsIds=matToAtv[mi.id]||[];
        h+='<div class="vg-ind'+(atvsIds.length?'':' sem')+'"><div class="vg-ind-h"><div style="min-width:0">'
          +'<div class="vg-eyebrow" style="color:var('+tok+')">'+esc(mi.produto_codigo||'')+'</div><div class="vg-ind-n" title="'+esc(mi.indicador||'')+'">'+esc(mi.indicador||'')+'</div></div>'
          +(meta>0?'<span class="vg-ind-p" style="color:var('+corPct(pct)+')">'+Math.round(pct)+'%</span>':'')+'</div>';
        h+=sparkSVG(mi.id, meta);
        if(meta>0){
          h+=vgMeter([[pct,'--ok'],[pctPend,'--alerta']])
            +'<div class="vg-nota mono">'+conf.toLocaleString('pt-BR')+' confirmados'+(pend>0?' · '+pend.toLocaleString('pt-BR')+' pendentes':'')+' · meta '+meta.toLocaleString('pt-BR')+' '+esc(mi.unidade||'')+'</div>';
        } else {
          h+='<div class="vg-nota">Indicador qualitativo</div>';
        }
        h+='<div class="vg-ind-ats">';
        if(atvsIds.length){
          h+='<span>Atividades ('+atvsIds.length+'):</span>';
          atvsIds.slice(0,4).forEach(function(aid){ var a=atvById[aid]; if(a) h+='<span class="vg-cod" title="'+esc(a.nome_pt||a.nome||'')+'">'+esc(a.codigo)+'</span>'; });
          if(atvsIds.length>4)h+='<span>+'+(atvsIds.length-4)+'</span>';
        } else {
          h+='<span class="vg-pill vg-p-er">'+vgIc('alerta','p')+'Sem atividade vinculada</span>';
        }
        h+='</div></div>';
      });
      h+='</div></details>';
    });
  }

  // ── Tabela atividade × indicadores com vinculação inline ──
  var faseInfo={}; ATV_FASES.forEach(function(f){faseInfo[f[0]]=f;});
  var atvSort=D.atv.slice().sort(function(a,b){
    var la=(atvToMat[a.id]||[]).length,lb=(atvToMat[b.id]||[]).length;
    if(la===0&&lb>0)return-1;
    if(lb===0&&la>0)return 1;
    return(a.codigo||'').localeCompare(b.codigo||'');
  });
  var indOptsHtml='<option value="">Escolha um indicador…</option>';
  D.matrizItens.forEach(function(mi){ indOptsHtml+='<option value="'+mi.id+'">'+esc(mi.resultado+' · '+mi.produto_codigo+' — '+(mi.indicador||'').substring(0,60))+'</option>'; });

  h+='<div class="vg-card"><div class="vg-card-h"><div><h3 class="vg-tit">Atividades × indicadores da matriz</h3><div class="vg-sub">Vínculo de cada atividade com as metas que ela cobre · sem vínculo primeiro · use "Vincular" para adicionar</div></div>'
    +'<div class="vg-seg" role="group" aria-label="Mostrar"><button type="button" class="cob-f" aria-pressed="true" onclick="vgCobFiltro(false,this)">Todas</button><button type="button" class="cob-f" aria-pressed="false" onclick="vgCobFiltro(true,this)">Sem vínculo ('+semVinculo+')</button></div></div>';
  h+='<div class="vg-tbl-w"><table class="vg-tbl"><thead><tr><th>Código</th><th>Atividade</th><th>Resultado</th><th>Fase</th><th>Indicadores vinculados</th><th class="c">Melhor progresso</th><th></th></tr></thead><tbody id="cob-tbody">';
  atvSort.forEach(function(a){
    var rv=resById[a.resultado_id];
    var resCod=rv?rv.codigo:'—';
    var inds=atvToMat[a.id]||[];
    var semLink=inds.length===0;
    var f=faseInfo[a.fase];
    var bestPct=0;
    inds.forEach(function(mid){ var p=progMap[mid]; if(p&&parseFloat(p.pct_confirmado||0)>bestPct)bestPct=parseFloat(p.pct_confirmado||0); });
    var dropId='vdrop-'+a.id;
    h+='<tr data-sem="'+(semLink?1:0)+'">';
    h+='<td><span class="vg-cod">'+esc(a.codigo)+'</span></td>';
    h+='<td style="min-width:200px;max-width:320px;line-height:1.4">'+esc(a.nome_pt||a.nome||'')+'</td>';
    h+='<td>'+(rv?'<span class="vg-res" style="background:var('+vgResTok(resCod)+')">'+esc(resCod)+'</span>':'—')+'</td>';
    h+='<td>'+(f?'<span class="vg-pill vg-pf" style="--c:var('+f[2]+')">'+f[1]+'</span>':esc(a.fase||'—'))+'</td>';
    h+='<td>';
    if(semLink){
      h+='<span class="vg-pill vg-p-er">Sem indicador</span>';
    } else {
      h+='<div style="display:flex;flex-wrap:wrap;gap:4px">';
      inds.forEach(function(mid){
        var mi=D.matrizItens.find(function(x){return x.id===mid;});
        if(!mi)return;
        var pct2=parseFloat((progMap[mid]||{}).pct_confirmado||0);
        h+='<span class="vg-pill vg-p-ne" title="'+esc(mi.indicador||'')+'">'+esc(mi.produto_codigo)
          +(mi.meta_numerica?' <span class="mono" style="color:var('+corPct(pct2)+')">'+Math.round(pct2)+'%</span>':'')
          +'<button type="button" class="vg-x" onclick="desvincularInd(\''+a.id+'\',\''+mid+'\')" title="Remover vínculo" aria-label="Remover vínculo com '+esc(mi.produto_codigo)+'">×</button></span>';
      });
      h+='</div>';
    }
    h+='</td>';
    h+='<td class="c">'+(semLink?'<span class="vg-nota">—</span>':'<span class="mono" style="font-size:13px;color:var('+corPct(bestPct)+')">'+Math.round(bestPct)+'%</span>')+'</td>';
    h+='<td style="white-space:nowrap"><div style="position:relative;display:inline-block">'
      +'<button type="button" class="vg-btn peq" onclick="toggleVdrop(\''+dropId+'\')" aria-expanded="false">'+vgIc('mais','p')+'Vincular</button>'
      +'<div id="'+dropId+'" class="vg-vdrop" hidden><select aria-label="Indicador para vincular" onchange="vincularInd(\''+a.id+'\',this)">'+indOptsHtml+'</select></div>'
      +'</div></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';

  el.innerHTML=h;
}

window.vgCobFiltro=function(so,btn){
  document.querySelectorAll('.cob-f').forEach(function(b){b.setAttribute('aria-pressed',String(b===btn));});
  document.querySelectorAll('#cob-tbody tr').forEach(function(tr){ tr.hidden=so&&tr.dataset.sem!=='1'; });
};

window.toggleVdrop=function(id){
  var el=document.getElementById(id);
  if(!el)return;
  var abrir=el.hidden;
  document.querySelectorAll('.vg-vdrop').forEach(function(d){d.hidden=true;});
  el.hidden=!abrir;
  if(abrir){ var s=el.querySelector('select'); if(s)s.focus(); }
};

window.vincularInd=async function(atvId, sel){
  var matrizItemId=sel.value;
  if(!matrizItemId)return;
  sel.value='';
  var dropEl=sel.closest('.vg-vdrop');
  if(dropEl)dropEl.hidden=true;
  var{error}=await db.from('atividade_matriz').upsert({atividade_id:atvId,matriz_item_id:matrizItemId},{onConflict:'atividade_id,matriz_item_id'});
  if(error){toast('Erro ao vincular: '+error.message,'error');return;}
  var r=await db.from('atividade_matriz').select('atividade_id,matriz_item_id');
  D.atvMatriz=r.data||[];
  renderCobertura();
  toast('Indicador vinculado','success');
};

window.desvincularInd=async function(atvId, matrizItemId){
  if(!confirm('Remover vínculo entre esta atividade e o indicador?'))return;
  var{error}=await db.from('atividade_matriz').delete().eq('atividade_id',atvId).eq('matriz_item_id',matrizItemId);
  if(error){toast('Erro ao remover: '+error.message,'error');return;}
  var r=await db.from('atividade_matriz').select('atividade_id,matriz_item_id');
  D.atvMatriz=r.data||[];
  renderCobertura();
  toast('Vínculo removido','success');
};

})();
</script>
