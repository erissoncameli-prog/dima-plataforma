function renderAlertas(){
  var alertas=[];
  D.sal.filter(function(s){return s.status_saldo==='extrapolado';}).forEach(function(s){
    alertas.push({n:'alto',t:'Atividade '+s.codigo+' — saldo extrapolado',d:'TDRs: '+D_USD(s.comprometido_usd)+' vs orçamento '+D_USD(s.orcamento_usd)+' ('+Math.round(parseFloat(s.pct_comprometido||0))+'%)'});
  });
  D.sal.filter(function(s){return s.status_saldo==='critico';}).forEach(function(s){
    alertas.push({n:'medio',t:'Atividade '+s.codigo+' — saldo crítico',d:Math.round(parseFloat(s.pct_comprometido||0))+'% comprometido. Saldo livre: '+D_USD(s.saldo_livre_usd)});
  });
  D.sal.filter(function(s){return s.status_saldo==='atencao';}).forEach(function(s){
    alertas.push({n:'leve',t:'Atividade '+s.codigo+' — atenção ('+Math.round(parseFloat(s.pct_comprometido||0))+'%)',d:'Saldo restante: '+D_USD(s.saldo_livre_usd)});
  });
  D.tdrs.filter(function(t){return t.status==='revisao_interna';}).forEach(function(t){
    alertas.push({n:'info',t:'TDR '+t.numero+' aguardando revisão interna',d:'Objeto: '+(t.objeto_pt||'').substring(0,80)+'...'});
  });
  var semTdr=D.atv.filter(function(a){return !D.tdrs.some(function(t){return t.atividade_id===a.id&&t.status!=='cancelado';});});
  if(semTdr.length>0)alertas.push({n:'info',t:semTdr.length+' atividade(s) sem TDR cadastrado',d:'Estas atividades não possuem comprometimento financeiro registrado'});

  var alto=alertas.filter(function(a){return a.n==='alto';}).length;
  var medio=alertas.filter(function(a){return a.n==='medio';}).length;
  var leve=alertas.filter(function(a){return a.n==='leve';}).length;
  var info=alertas.filter(function(a){return a.n==='info';}).length;

  var h='<div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">';
  h+='<div class="kpi-card ke"><div class="kpi-lbl">Críticos</div><div class="kpi-val" style="color:var(--erro)">'+alto+'</div><div class="kpi-sub">Requerem ação imediata</div></div>';
  h+='<div class="kpi-card ko"><div class="kpi-lbl">Atenção</div><div class="kpi-val" style="color:var(--ouro)">'+medio+'</div><div class="kpi-sub">Monitorar de perto</div></div>';
  h+='<div class="kpi-card ka"><div class="kpi-lbl">Leve</div><div class="kpi-val" style="color:var(--azul-medio)">'+leve+'</div><div class="kpi-sub">Saldo acima de 75%</div></div>';
  h+='<div class="kpi-card kv"><div class="kpi-lbl">Informativos</div><div class="kpi-val" style="color:var(--verde-claro)">'+info+'</div><div class="kpi-sub">Pendências e avisos</div></div>';
  h+='</div>';

  // Gráfico de pizza por tipo de alerta
  h+='<div class="g2" style="margin-bottom:14px">';
  h+='<div class="ch"><div class="ch-tit">Distribuição de alertas</div><div class="ch-sub">Por nível de criticidade</div><div style="position:relative;height:200px"><canvas id="ch-alertas-pie"></canvas></div></div>';
  h+='<div class="ch"><div class="ch-tit">Status dos saldos</div><div class="ch-sub">Quantitativo por criticidade</div><div style="position:relative;height:200px"><canvas id="ch-saldo-status"></canvas></div></div>';
  h+='</div>';

  h+='<div class="ch"><div class="ch-tit">Todos os alertas ('+alertas.length+')</div>';
  if(alertas.length===0){
    h+='<div class="empty-state"><div class="empty-state-icon">✓</div><div class="empty-state-msg">Nenhum alerta ativo. Projeto em conformidade.</div></div>';
  } else {
    alertas.forEach(function(a){
      var bg=a.n==='alto'?'#FEE2E2':a.n==='medio'?'#FEF9C3':a.n==='leve'?'#EFF6FF':'#F0FDF4';
      var cor=a.n==='alto'?'var(--erro)':a.n==='medio'?'var(--ouro)':a.n==='leve'?'var(--azul-medio)':'var(--sucesso)';
      var lbl=a.n==='alto'?'CRÍTICO':a.n==='medio'?'ATENÇÃO':a.n==='leve'?'LEVE':'INFO';
      h+='<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda);align-items:flex-start"><div style="width:30px;height:30px;border-radius:50%;background:'+bg+';color:'+cor+';display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:700">!</div><div style="flex:1"><div style="font-size:12px;font-weight:500;color:var(--cinza-900)">'+a.t+'</div><div style="font-size:11px;color:var(--cinza-500);margin-top:2px">'+a.d+'</div></div><span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:'+bg+';color:'+cor+';flex-shrink:0;margin-top:2px">'+lbl+'</span></div>';
    });
  }
  h+='</div>';
  document.getElementById('pane-alertas').innerHTML=h;

  setTimeout(function(){
    mkChart('ch-alertas-pie',{type:'pie',data:{labels:['Crítico','Atenção','Leve','Info'],datasets:[{data:[alto,medio,leve,info],backgroundColor:['#EF4444','#F59E0B','#3B82F6','#10B981'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12}}}}});

    var stCount={ok:0,atencao:0,critico:0,extrapolado:0};
    D.sal.forEach(function(s){if(stCount[s.status_saldo]!==undefined)stCount[s.status_saldo]++;});
    mkChart('ch-saldo-status',{type:'doughnut',data:{labels:['OK','Atenção','Crítico','Extrapolado'],datasets:[{data:[stCount.ok,stCount.atencao,stCount.critico,stCount.extrapolado],backgroundColor:['#34D399','#FCD34D','#FB923C','#EF4444'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12}}}}});
  },50);
}

// ── PAINEL DE TAREFAS ─────────────────────────────────────
async function renderTarefas() {
  var el = document.getElementById('pane-tarefas');
  if(!el) return;
  el.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';

  // Buscar tarefas, vencimentos, devolvidos e notificações em paralelo
  var [rTarefas, rVenc, rDevolvidas, rNotifAval, rNotifDev, rNotifOutras] = await Promise.all([
    db.rpc('get_minhas_tarefas'),
    db.rpc('get_produtos_vencendo', { dias_limite: 30 }),
    db.rpc('get_minhas_entregas_devolvidas'),
    db.from('notificacoes')
      .select('id,titulo,mensagem,tipo,link,entidade_id,criado_em')
      .eq('usuario_id', appState.usuario.id)
      .eq('tipo', 'produto_para_avaliar')
      .eq('lida', false)
      .order('criado_em', {ascending: false})
      .limit(10),
    db.from('notificacoes')
      .select('id,titulo,mensagem,tipo,link,entidade_id,criado_em')
      .eq('usuario_id', appState.usuario.id)
      .eq('tipo', 'produto_devolvido')
      .eq('lida', false)
      .order('criado_em', {ascending: false})
      .limit(10),
    db.from('notificacoes')
      .select('id,titulo,mensagem,tipo,link,entidade_id,criado_em')
      .eq('usuario_id', appState.usuario.id)
      .eq('lida', false)
      .not('tipo', 'in', '("produto_para_avaliar","produto_devolvido")')
      .order('criado_em', {ascending: false})
      .limit(5)
  ]);

  var tarefas     = rTarefas.data     || [];
  var vencendo    = rVenc.data        || [];
  var devolvidas  = rDevolvidas.data  || [];
  var notifAval   = rNotifAval.data   || [];
  var notifDev    = rNotifDev.data    || [];
  var notifOutras = rNotifOutras.data || [];

  // ── Verificar status atual das entidades para detectar notificações já atendidas ──
  // Garante que o painel não mostre "pendente" para itens que outro usuário já resolveu.
  var prodIdsAval  = notifAval.filter(function(n){ return n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var prodIdsDev   = notifDev.filter(function(n){ return n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var prodIdsPag   = notifOutras.filter(function(n){ return n.tipo==='produto_aguarda_pagamento' && n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var viagIds      = notifOutras.filter(function(n){ return n.tipo==='viagem_solicitada' && n.entidade_id; }).map(function(n){ return n.entidade_id; });
  var tdrIdsOut    = notifOutras.filter(function(n){ return n.tipo==='tdr_para_revisar' && n.entidade_id; }).map(function(n){ return n.entidade_id; });

  // IDs únicos de contratos_produtos (aval + dev + pag)
  var cpIdsUnicos = [...new Set([...prodIdsAval, ...prodIdsDev, ...prodIdsPag])];

  var statusProdAval = {}, statusProdDev = {}, statusProdPag = {}, statusViag = {}, statusTdrOut = {};
  await Promise.all([
    cpIdsUnicos.length && db.from('contratos_produtos').select('id,situacao').in('id', cpIdsUnicos)
      .then(function(r){ (r.data||[]).forEach(function(p){
        statusProdAval[p.id] = p.situacao;
        statusProdDev[p.id]  = p.situacao;
        statusProdPag[p.id]  = p.situacao;
      }); }),
    viagIds.length     && db.from('viagem_protocolos').select('id,situacao').in('id', viagIds)
      .then(function(r){ (r.data||[]).forEach(function(v){ statusViag[v.id]=v.situacao; }); }),
    tdrIdsOut.length   && db.from('tdrs').select('id,status').in('id', tdrIdsOut)
      .then(function(r){ (r.data||[]).forEach(function(t){ statusTdrOut[t.id]=t.status; }); }),
  ].filter(Boolean));

  // Separar notifAval em ativas vs já atendidas por outro usuário
  var notifAvalAtivas = [], notifAvalAtendidas = [];
  notifAval.forEach(function(n) {
    var sit = statusProdAval[n.entidade_id];
    if (sit && sit !== 'em_analise') notifAvalAtendidas.push(n);
    else notifAvalAtivas.push(n);
  });
  // Separar notifDev: se produto não está mais "devolvido" (foi resubmetido), já foi atendido
  var notifDevAtivas = [], notifDevAtendidas = [];
  notifDev.forEach(function(n) {
    var sit = statusProdDev[n.entidade_id];
    // Permanece devolvido quando situação ainda indica pendência de correção
    var pendDev = !sit || sit === 'devolvido' || sit === 'pendente';
    if (pendDev) notifDevAtivas.push(n);
    else notifDevAtendidas.push(n);
  });
  // Separar notifOutras: viagens aprovadas/rejeitadas, TDRs resolvidos e pagamentos já feitos
  var notifOutrasPend = [], notifOutrasAtend = [];
  var tdrPendentes = ['rascunho','revisao_interna','enviado_unesco','retorno_unesco','submetido','pendente_correcao'];
  notifOutras.forEach(function(n) {
    var atendido = false;
    if (n.tipo === 'produto_aguarda_pagamento' && n.entidade_id) {
      var sit = statusProdPag[n.entidade_id];
      // Órfão (registro deletado/substituído) ou já pago
      if (!sit || sit === 'pago') atendido = true;
    } else if (n.tipo === 'viagem_solicitada' && n.entidade_id) {
      var sit = statusViag[n.entidade_id];
      if (sit && sit !== 'solicitado') atendido = true;
    } else if (n.tipo === 'tdr_para_revisar' && n.entidade_id) {
      var sit = statusTdrOut[n.entidade_id];
      if (sit && !tdrPendentes.includes(sit)) atendido = true;
    }
    if (atendido) notifOutrasAtend.push(n);
    else notifOutrasPend.push(n);
  });

  // Auto-marcar como lida as que já foram atendidas (disparo sem aguardar)
  var idsParaMarcar = notifAvalAtendidas.concat(notifDevAtendidas).concat(notifOutrasAtend).map(function(n){ return n.id; });
  if (idsParaMarcar.length) {
    db.from('notificacoes').update({ lida: true, lida_em: new Date().toISOString() })
      .in('id', idsParaMarcar).then(function(){}).catch(function(){});
  }

  // Usar listas filtradas daqui em diante
  notifAval   = notifAvalAtivas;
  notifDev    = notifDevAtivas;
  notifOutras = notifOutrasPend;

  var perfil   = appState.perfil;
  var nome     = appState.usuario?.nome_completo?.split(' ')[0] || '';
  var hora     = new Date().getHours();
  var saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';

  var h = '';

  // ── Cabeçalho personalizado ──────────────────────────────
  h += '<div style="background:linear-gradient(135deg,var(--verde-medio) 0%,#1a5c38 100%);border-radius:var(--raio-lg);padding:20px 24px;margin-bottom:20px;color:#fff">';
  h += '<div style="font-size:18px;font-weight:600;margin-bottom:4px">' + saudacao + ', ' + nome + '!</div>';
  h += '<div style="font-size:13px;opacity:.85">';
  var totalAval = tarefas.length || notifAval.length;
  var totalDev  = devolvidas.length || notifDev.length;
  if(totalAval === 0 && totalDev === 0 && vencendo.length === 0 && notifOutras.length === 0) {
    h += '✓ Você não tem tarefas pendentes no momento. Bom trabalho!';
  } else {
    var partes = [];
    if(totalAval) partes.push(totalAval + ' produto(s) aguardando avaliação');
    if(totalDev)  partes.push(totalDev  + ' produto(s) devolvido(s) para correção');
    if(vencendo.length) partes.push(vencendo.length + ' produto(s) com vencimento próximo');
    h += partes.join(' · ');
  }
  h += '</div></div>';

  h += '<div class="g2" style="align-items:start">';

  // ── COLUNA ESQUERDA: Avaliações pendentes ────────────────
  h += '<div>';
  h += '<div class="ch">';
  h += '<div class="ch-tit">📋 Avaliações pendentes';
  if(totalAval) h += ' <span style="background:#EFF6FF;color:#1E40AF;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px">' + totalAval + '</span>';
  h += '</div>';
  h += '<div class="ch-sub">Produtos entregues aguardando seu parecer</div>';

  if(tarefas.length) {
    // Fonte primária: produtos em_analise no banco
    // Filtro por atividade (só aparece quando há múltiplas atividades)
    var atvMap = {};
    tarefas.forEach(function(t){ if(t.atividade_cod) atvMap[t.atividade_cod] = t.atividade_nome||t.atividade_cod; });
    var atvCods = Object.keys(atvMap);
    if(atvCods.length > 1) {
      h += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px">';
      h += '<button class="pill-aval active" onclick="filtrarAval(null,this)" style="font-size:10px;padding:3px 10px;border-radius:99px;border:1px solid var(--borda);background:var(--verde-medio);color:#fff;cursor:pointer;font-weight:600">Todas ('+tarefas.length+')</button>';
      atvCods.forEach(function(cod){
        var cnt = tarefas.filter(function(t){return t.atividade_cod===cod;}).length;
        h += '<button class="pill-aval" onclick="filtrarAval(\''+esc(cod)+'\',this)" style="font-size:10px;padding:3px 10px;border-radius:99px;border:1px solid var(--borda);background:var(--cinza-100);color:var(--cinza-700);cursor:pointer;font-weight:500">'+esc(cod)+' ('+cnt+')</button>';
      });
      h += '</div>';
    }
    h += '<div style="margin-top:4px" id="lista-aval">';
    tarefas.forEach(function(t) {
      var dias = parseInt(t.dias_aguardando) || 0;
      var urgente = dias >= 3;
      var corDias = urgente ? '#DC2626' : '#6B7280';
      var bgDias  = urgente ? '#FEF2F2' : 'var(--cinza-100)';

      h += '<div class="tarefa-item" data-atv="'+esc(t.atividade_cod||'')+'">';
      h += '<div class="tarefa-ico" style="background:#EFF6FF">📋</div>';
      h += '<div class="tarefa-corpo">';
      h += '<div class="tarefa-tit">Produto ' + t.produto_num + ' — ' + (t.produto_desc||'').substring(0,50) + (t.produto_desc?.length>50?'…':'') + '</div>';
      h += '<div class="tarefa-sub">';
      h += '<span style="font-family:var(--font-mono);font-size:10px;font-weight:600;background:var(--cinza-100);padding:1px 5px;border-radius:3px">' + (t.atividade_cod||'') + '</span> ';
      h += (t.atividade_nome||'').substring(0,45) + (t.atividade_nome?.length>45?'…':'');
      h += '</div>';
      h += '<div class="tarefa-meta">';
      h += '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#EFF6FF;color:#1E40AF">Em avaliação</span>';
      if(t.dt_entrega) h += '<span class="tarefa-dias">Entregue ' + D_DATE(t.dt_entrega) + '</span>';
      h += '<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:'+bgDias+';color:'+corDias+'">' + (urgente ? '⚠ ' : '') + dias + 'd aguardando</span>';
      if(t.arquivo_nome) h += '<span style="font-size:10px;color:var(--azul-medio)">📎 ' + t.arquivo_nome.substring(0,20) + '</span>';
      h += '</div></div>';
      h += '<div class="tarefa-acao">';
      h += '<a href="produtos.html?entrega=' + t.entrega_id + '" class="btn btn-primary btn-sm" style="font-size:11px;text-decoration:none;display:inline-flex;align-items:center;gap:4px">🔍 Avaliar →</a>';
      h += '</div>';
      h += '</div>';
    });
    h += '</div>';
  } else if(notifAval.length) {
    // Fallback: notificações produto_para_avaliar não lidas
    // Extrair código de atividade do título ("Produto aguardando avaliação — AT-001")
    var atvMapN = {};
    notifAval.forEach(function(n){
      var cod = (n.titulo||'').split(' — ')[1] || '';
      if(cod) atvMapN[cod] = cod;
    });
    var atvCodsN = Object.keys(atvMapN);
    if(atvCodsN.length > 1) {
      h += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px">';
      h += '<button class="pill-aval active" onclick="filtrarAval(null,this)" style="font-size:10px;padding:3px 10px;border-radius:99px;border:1px solid var(--borda);background:var(--verde-medio);color:#fff;cursor:pointer;font-weight:600">Todas ('+notifAval.length+')</button>';
      atvCodsN.forEach(function(cod){
        var cnt = notifAval.filter(function(n){return (n.titulo||'').endsWith('— '+cod);}).length;
        h += '<button class="pill-aval" onclick="filtrarAval(\''+esc(cod)+'\',this)" style="font-size:10px;padding:3px 10px;border-radius:99px;border:1px solid var(--borda);background:var(--cinza-100);color:var(--cinza-700);cursor:pointer;font-weight:500">'+esc(cod)+' ('+cnt+')</button>';
      });
      h += '</div>';
    }
    h += '<div style="margin-top:4px" id="lista-aval">';
    notifAval.forEach(function(n) {
      var codAtv = (n.titulo||'').split(' — ')[1] || '';
      var dtFmt = n.criado_em ? new Date(n.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      var nid = n.id || '', nlink = (n.link||'').replace(/'/g,"\\'"), nent = (n.entidade_id||'').replace(/'/g,"\\'");
      h += '<div class="tarefa-item" data-atv="'+esc(codAtv)+'" style="cursor:pointer" onclick="clicarNotif(\''+nid+'\',\''+nlink+'\',\''+nent+'\')">';
      h += '<div class="tarefa-ico" style="background:#FEF3C7">📋</div>';
      h += '<div class="tarefa-corpo">';
      h += '<div class="tarefa-tit">' + esc(n.titulo||'') + '</div>';
      if(n.mensagem) h += '<div class="tarefa-sub">' + esc((n.mensagem||'').substring(0,70)) + '</div>';
      h += '<div class="tarefa-meta">';
      h += '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#FEF3C7;color:#92400E">Aguarda avaliação</span>';
      h += '<span class="tarefa-dias">' + dtFmt + '</span>';
      h += '</div></div>';
      h += '<div class="tarefa-acao">';
      h += '<button onclick="event.stopPropagation();clicarNotif(\''+nid+'\',\''+nlink+'\',\''+nent+'\')" class="btn btn-primary btn-sm" style="font-size:11px">🔍 Avaliar →</button>';
      h += '</div>';
      h += '</div>';
    });
    h += '</div>';
  } else {
    h += '<div style="padding:24px 0;text-align:center;color:var(--cinza-400);font-size:12px">✓ Nenhuma avaliação pendente</div>';
  }
  h += '</div>'; // .ch avaliações

  // ── CARD: Produtos devolvidos para o usuário ─────────────
  if(totalDev) {
    var itensDev = devolvidas.length ? devolvidas : null;
    h += '<div class="ch" style="margin-top:14px;border-left:3px solid #EF4444">';
    h += '<div class="ch-tit" style="color:#991B1B">↩ Produtos devolvidos para você';
    h += ' <span style="background:#FEF2F2;color:#DC2626;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px">' + totalDev + '</span>';
    h += '</div>';
    h += '<div class="ch-sub">Aguardando correção e reenvio</div>';
    h += '<div style="margin-top:6px">';

    if(itensDev) {
      // Fonte primária: dados do banco via RPC
      itensDev.forEach(function(d) {
        var venc = d.dt_vencimento ? new Date(d.dt_vencimento+'T12:00:00') : null;
        var diasV = venc ? Math.ceil((venc - new Date()) / 86400000) : null;
        var vencTxt = '', vencCor = '';
        if(diasV !== null) {
          if(diasV < 0)  { vencTxt = Math.abs(diasV)+'d vencido'; vencCor = '#DC2626'; }
          else if(diasV <= 7) { vencTxt = 'Vence em '+diasV+'d'; vencCor = '#D97706'; }
        }
        var dtDesp = d.despachado_em ? new Date(d.despachado_em).toLocaleDateString('pt-BR') : '';
        h += '<div class="tarefa-item" style="border-left:none">';
        h += '<div class="tarefa-ico" style="background:#FEF2F2">↩</div>';
        h += '<div class="tarefa-corpo">';
        h += '<div class="tarefa-tit">Produto ' + d.produto_num + ' — ' + esc((d.produto_desc||'').substring(0,50)) + (d.produto_desc&&d.produto_desc.length>50?'…':'') + '</div>';
        if(d.atividade_cod) {
          h += '<div class="tarefa-sub"><span style="font-family:var(--font-mono);font-size:10px;font-weight:600;background:var(--cinza-100);padding:1px 5px;border-radius:3px">' + esc(d.atividade_cod) + '</span> ' + esc((d.atividade_nome||'').substring(0,45)) + '</div>';
        }
        if(d.despacho_texto) {
          h += '<div style="font-size:11px;color:#7F1D1D;background:#FEF2F2;border-left:2px solid #EF4444;padding:4px 8px;border-radius:0 4px 4px 0;margin:4px 0;line-height:1.4">'
            + esc(d.despacho_texto.substring(0,120)) + (d.despacho_texto.length>120?'…':'') + '</div>';
        }
        h += '<div class="tarefa-meta">';
        h += '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#FEF2F2;color:#DC2626">Devolvido</span>';
        if(dtDesp) h += '<span class="tarefa-dias">Devolvido ' + dtDesp + '</span>';
        if(vencTxt) h += '<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:#FEF2F2;color:'+vencCor+'">⏰ '+vencTxt+'</span>';
        h += '</div></div>';
        h += '<div class="tarefa-acao">';
        h += '<a href="produtos.html?entrega=' + d.entrega_id + '" class="btn btn-sm" style="font-size:11px;background:#DC2626;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:4px">↩ Corrigir →</a>';
        h += '</div></div>';
      });
    } else {
      // Fallback: notificações produto_devolvido não lidas
      notifDev.forEach(function(n) {
        var nid = n.id||'', nlink = (n.link||'').replace(/'/g,"\\'"), nent = (n.entidade_id||'').replace(/'/g,"\\'");
        var dtFmt = n.criado_em ? new Date(n.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
        h += '<div class="tarefa-item" style="border-left:none;cursor:pointer" onclick="clicarNotif(\''+nid+'\',\''+nlink+'\',\''+nent+'\')">';
        h += '<div class="tarefa-ico" style="background:#FEF2F2">↩</div>';
        h += '<div class="tarefa-corpo">';
        h += '<div class="tarefa-tit">' + esc(n.titulo||'') + '</div>';
        if(n.mensagem) h += '<div style="font-size:11px;color:#7F1D1D;background:#FEF2F2;border-left:2px solid #EF4444;padding:4px 8px;border-radius:0 4px 4px 0;margin:4px 0;line-height:1.4">' + esc((n.mensagem||'').substring(0,120)) + '</div>';
        h += '<div class="tarefa-meta"><span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#FEF2F2;color:#DC2626">Devolvido</span>';
        h += '<span class="tarefa-dias">' + dtFmt + '</span></div>';
        h += '</div><div class="tarefa-acao"><button onclick="event.stopPropagation();clicarNotif(\''+nid+'\',\''+nlink+'\',\''+nent+'\')" class="btn btn-sm" style="font-size:11px;background:#DC2626;color:#fff">↩ Corrigir →</button></div></div>';
      });
    }

    h += '</div>'; // lista
    h += '</div>'; // .ch devolvidos
  }

  h += '</div>'; // coluna esquerda

  // ── COLUNA DIREITA: Vencimentos + Notificações ───────────
  h += '<div style="display:flex;flex-direction:column;gap:14px">';

  // Vencimentos
  h += '<div class="ch">';
  h += '<div class="ch-tit">⏰ Vencimentos próximos';
  if(vencendo.length) h += ' <span style="background:#FEF3C7;color:#92400E;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px">' + vencendo.length + '</span>';
  h += '</div>';
  h += '<div class="ch-sub">Produtos com prazo nos próximos 30 dias</div>';

  if(!vencendo.length) {
    h += '<div style="padding:20px 0;text-align:center;color:var(--cinza-400);font-size:12px">✓ Nenhum vencimento próximo</div>';
  } else {
    h += '<div style="margin-top:8px">';
    vencendo.forEach(function(v) {
      var dias = parseInt(v.dias_restantes);
      var vencido = dias < 0;
      var cls = vencido ? 'venc-dias-vencido' : dias <= 3 ? 'venc-dias-alerta' : 'venc-dias-ok';
      var txt = vencido ? Math.abs(dias)+'d<br>vencido' : dias+'d<br>restantes';

      h += '<div class="venc-card">';
      h += '<div class="' + cls + '" style="line-height:1.2;font-size:11px">' + txt + '</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-size:12px;font-weight:600;color:var(--cinza-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">';
      h += 'Produto ' + v.produto_num + ' — ' + (v.produto_desc||'').substring(0,35) + (v.produto_desc?.length>35?'…':'');
      h += '</div>';
      h += '<div style="font-size:10px;color:var(--cinza-500);margin-top:2px">';
      h += (v.atividade_cod||'') + ' · Contrato ' + (v.contrato_numero||'');
      h += '</div>';
      h += '<div style="margin-top:4px">';
      var sitCor = {pendente:'#92400E',em_analise:'#1E40AF',entrega_parcial:'#6D28D9'}[v.situacao]||'#6B7280';
      var sitBg  = {pendente:'#FFFBEB',em_analise:'#EFF6FF',entrega_parcial:'#F5F3FF'}[v.situacao]||'var(--cinza-100)';
      var sitNm  = {pendente:'Pendente',em_analise:'Em avaliação',entrega_parcial:'Parcial'}[v.situacao]||v.situacao;
      h += '<span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;background:'+sitBg+';color:'+sitCor+'">' + sitNm + '</span>';
      h += '</div></div></div>';
    });
    h += '</div>';
  }
  h += '</div>'; // .ch vencimentos

  // Notificações não lidas (exceto produto_para_avaliar — já exibidas acima)
  if(notifOutras.length) {
    var iconeNotif = {produto_aprovado:'✅',produto_devolvido:'↩',tdr_para_revisar:'📄',viagem_solicitada:'✈️',viagem_aprovada:'✅',viagem_prestacao:'🧾'};
    h += '<div class="ch">';
    h += '<div class="ch-tit">🔔 Notificações <span style="background:#FEF2F2;color:#DC2626;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px">' + notifOutras.length + '</span></div>';
    h += '<div class="ch-sub">Não lidas — clique para abrir</div>';
    h += '<div style="margin-top:8px">';
    notifOutras.forEach(function(n) {
      var icone = iconeNotif[n.tipo] || '🔔';
      var temLink = !!(n.link || n.entidade_id);
      var nid = n.id||'', nlink = (n.link||'').replace(/'/g,"\\'"), nent = (n.entidade_id||'').replace(/'/g,"\\'");
      var dtFmt = n.criado_em ? new Date(n.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      h += '<div style="padding:9px 0;border-bottom:1px solid var(--borda);display:flex;align-items:flex-start;gap:8px'+(temLink?';cursor:pointer':'')+'"'
        + (temLink ? ' onclick="clicarNotif(\''+nid+'\',\''+nlink+'\',\''+nent+'\')" onmouseover="this.style.background=\'var(--cinza-50)\'" onmouseout="this.style.background=\'\'"' : '')
        + '>';
      h += '<span style="font-size:16px;flex-shrink:0;margin-top:1px">'+icone+'</span>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-size:12px;font-weight:500;color:var(--cinza-800)">'+esc((n.titulo||'').substring(0,55))+'</div>';
      if(n.mensagem) h += '<div style="font-size:10px;color:var(--cinza-500);margin-top:1px;line-height:1.4">'+esc((n.mensagem||'').substring(0,70))+'</div>';
      h += '</div>';
      h += '<div style="font-size:10px;color:var(--cinza-400);flex-shrink:0;margin-top:2px">'+dtFmt+'</div>';
      if(temLink) h += '<span style="font-size:10px;color:var(--azul-medio);flex-shrink:0;margin-top:2px">→</span>';
      h += '</div>';
    });
    h += '<div style="text-align:center;margin-top:10px">';
    h += '<button onclick="abrirSino()" class="btn btn-secondary btn-sm" style="font-size:11px">Ver todas as notificações</button>';
    h += '</div></div></div>';
  }

  h += '</div>'; // coluna direita
  h += '</div>'; // .g2

  el.innerHTML = h;
}

function filtrarAval(cod, btn) {
  document.querySelectorAll('.pill-aval').forEach(function(b) {
    b.style.background = 'var(--cinza-100)';
    b.style.color = 'var(--cinza-700)';
    b.classList.remove('active');
  });
  if(btn) {
    btn.style.background = 'var(--verde-medio)';
    btn.style.color = '#fff';
    btn.classList.add('active');
  }
  var lista = document.getElementById('lista-aval');
  if(!lista) return;
  lista.querySelectorAll('.tarefa-item').forEach(function(el) {
    el.style.display = (!cod || el.dataset.atv === cod) ? '' : 'none';
  });
}

// ─────────────────────────────────────────────────────────
// GUIA 7 — COBERTURA DE INDICADORES
// ─────────────────────────────────────────────────────────
function renderCobertura(){
  var el=document.getElementById('pane-cobertura');
  if(!el)return;

  // ── Mapas de lookup ──────────────────────────────────
  var resById={};
  D.res.forEach(function(r){resById[r.id]=r;});

  // resultado codigo → nome
  var resNomes={};
  D.res.forEach(function(r){resNomes[r.codigo]=r.nome_pt||r.nome||r.codigo;});

  var atvById={};
  D.atv.forEach(function(a){atvById[a.id]=a;});

  // atividade → [matriz_item_id]
  var atvToMat={};
  D.atvMatriz.forEach(function(l){
    if(!atvToMat[l.atividade_id])atvToMat[l.atividade_id]=[];
    atvToMat[l.atividade_id].push(l.matriz_item_id);
  });

  // indicador → [atividade_id]
  var matToAtv={};
  D.atvMatriz.forEach(function(l){
    if(!matToAtv[l.matriz_item_id])matToAtv[l.matriz_item_id]=[];
    matToAtv[l.matriz_item_id].push(l.atividade_id);
  });

  // progresso por indicador
  var progMap={};
  D.matrizProg.forEach(function(p){progMap[p.id]=p;});

  // contribuições confirmadas agrupadas por indicador e mês
  var sparkByInd={};
  D.contribs.forEach(function(c){
    var dt=c.contratos_produtos_entregas&&c.contratos_produtos_entregas.dt_entrega;
    if(!dt)return;
    var m=dt.substring(0,7);
    if(!sparkByInd[c.matriz_item_id])sparkByInd[c.matriz_item_id]={};
    sparkByInd[c.matriz_item_id][m]=(sparkByInd[c.matriz_item_id][m]||0)+parseFloat(c.valor||0);
  });

  // ── Cores por resultado ───────────────────────────────
  var resCores={R1:'#1D9E75',R2:'#2563EB',R3:'#7F77DD',R4:'#D97706',Outros:'#6B7280'};

  // ── Sparkline SVG ─────────────────────────────────────
  function sparkSVG(indId, meta){
    var byMonth=sparkByInd[indId]||{};
    var months=Object.keys(byMonth).sort().slice(-8);
    if(months.length<2)return'<div style="height:44px;display:flex;align-items:center;font-size:10px;color:var(--cinza-400);padding:0 2px">Sem histórico de contribuições</div>';
    var cum=0;
    var pts=months.map(function(m){cum+=byMonth[m];return cum;});
    var maxV=parseFloat(meta)||Math.max.apply(null,pts)||1;
    var W=200,H=44,padX=4,padY=6;
    var coords=pts.map(function(v,i){
      return [
        padX+i*(W-2*padX)/(Math.max(pts.length-1,1)),
        padY+(1-Math.min(v/maxV,1.05))*(H-2*padY)
      ];
    });
    var line=coords.map(function(c,i){return(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1);}).join('');
    var fill=line+' L'+coords[coords.length-1][0].toFixed(1)+','+(H-padY)+' L'+padX+','+(H-padY)+' Z';
    var lastPct=maxV>0?Math.min(pts[pts.length-1]/maxV,1):0;
    var cor=lastPct>=0.7?'#059669':lastPct>=0.4?'#D97706':'#DC2626';
    var metaLine='';
    if(parseFloat(meta)>0){
      var metaY=(padY+(0)*(H-2*padY)).toFixed(1);
      metaLine='<line x1="'+padX+'" y1="'+metaY+'" x2="'+(W-padX)+'" y2="'+metaY+'" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>';
    }
    return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:44px;display:block" preserveAspectRatio="none">'
      +metaLine
      +'<path d="'+fill+'" fill="'+cor+'" fill-opacity="0.1"/>'
      +'<path d="'+line+'" fill="none" stroke="'+cor+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      +'<circle cx="'+coords[coords.length-1][0].toFixed(1)+'" cy="'+coords[coords.length-1][1].toFixed(1)+'" r="3.5" fill="'+cor+'" stroke="#fff" stroke-width="1.5"/>'
      +'</svg>';
  }

  // ── Bloco 1 — Cards resumo ────────────────────────────
  var total=D.atv.length;
  var comVinculo=D.atv.filter(function(a){return(atvToMat[a.id]||[]).length>0;}).length;
  var semVinculo=total-comVinculo;
  var indOrfaos=D.matrizItens.filter(function(mi){return!(matToAtv[mi.id]||[]).length;}).length;
  var pctCob=total>0?Math.round(comVinculo/total*100):0;

  var h='';
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px">';
  h+='<div class="ch" style="padding:16px 18px"><div class="kpi-lbl">Total de atividades</div><div class="kpi-val">'+total+'</div><div class="kpi-sub">no projeto</div></div>';
  h+='<div class="ch" style="padding:16px 18px;border-top:3px solid #059669"><div class="kpi-lbl">Com indicador vinculado</div><div class="kpi-val" style="color:#059669">'+comVinculo+'</div><div class="kpi-sub">'+pctCob+'% do total</div><div class="kpi-bar" style="margin-top:8px"><div class="kpi-fill" style="width:'+pctCob+'%;background:#059669"></div></div></div>';
  h+='<div class="ch" style="padding:16px 18px;border-top:3px solid #DC2626"><div class="kpi-lbl">Sem vínculo com indicador</div><div class="kpi-val" style="color:#DC2626">'+semVinculo+'</div><div class="kpi-sub">não rastreadas na matriz</div></div>';
  h+='<div class="ch" style="padding:16px 18px;border-top:3px solid #D97706"><div class="kpi-lbl">Indicadores órfãos</div><div class="kpi-val" style="color:#D97706">'+indOrfaos+'</div><div class="kpi-sub">de '+D.matrizItens.length+' na matriz</div></div>';
  h+='</div>';

  // ── Bloco 2 — Indicadores agrupados por Resultado (colapsável) ──
  h+='<div style="font-size:14px;font-weight:600;color:var(--cinza-800);margin-bottom:4px">Indicadores da Matriz de Resultados</div>';
  h+='<div style="font-size:11px;color:var(--cinza-500);margin-bottom:14px">Progresso confirmado, tendência histórica e atividades cobrindo cada indicador</div>';

  if(!D.matrizItens.length){
    h+='<div class="ch" style="text-align:center;padding:32px;color:var(--cinza-400);font-size:13px">Nenhum indicador cadastrado na Matriz de Resultados.</div>';
  } else {
    // Resultados únicos ordenados
    var resultadosUnicos=[];
    D.matrizItens.forEach(function(mi){if(resultadosUnicos.indexOf(mi.resultado)<0)resultadosUnicos.push(mi.resultado);});
    resultadosUnicos.sort();

    h+='<div style="margin-bottom:26px">';
    resultadosUnicos.forEach(function(res,ri){
      var itensRes=D.matrizItens.filter(function(mi){return mi.resultado===res;});
      var cor=resCores[res]||'#6B7280';
      var nomeRes=resNomes[res]||res;
      var secId='cob-sec-'+ri;

      // Progresso médio do resultado
      var comMetaR=itensRes.filter(function(mi){return parseFloat(mi.meta_numerica||0)>0;});
      var mediaR=comMetaR.length?Math.round(comMetaR.reduce(function(s,mi){
        return s+parseFloat((progMap[mi.id]||{}).pct_confirmado||0);
      },0)/comMetaR.length):0;
      var indOrfaosR=itensRes.filter(function(mi){return!(matToAtv[mi.id]||[]).length;}).length;

      // ── Cabeçalho colapsável ──
      h+='<div style="margin-bottom:10px;border:1px solid var(--borda);border-radius:var(--raio-lg);overflow:hidden">';
      h+='<div onclick="toggleCobSec(\''+secId+'\')" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--cinza-50);cursor:pointer;user-select:none;" onmouseover="this.style.background=\'var(--cinza-100)\'" onmouseout="this.style.background=\'var(--cinza-50)\'">';
      h+='<span style="font-family:var(--font-mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:4px;color:#fff;background:'+cor+';flex-shrink:0">'+res+'</span>';
      h+='<span style="font-size:13px;font-weight:600;color:var(--cinza-900);flex:1;line-height:1.3">'+nomeRes+'</span>';
      h+='<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">';
      h+='<div style="width:80px;height:5px;background:var(--cinza-200);border-radius:3px;overflow:hidden"><div style="height:100%;background:'+cor+';width:'+mediaR+'%;border-radius:3px;transition:width .5s"></div></div>';
      h+='<span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:'+cor+'">'+mediaR+'%</span>';
      h+='<span style="font-size:11px;color:var(--cinza-400)">'+itensRes.length+' ind.</span>';
      if(indOrfaosR>0)h+='<span style="font-size:10px;font-weight:600;background:#FEF3C7;color:#92400E;padding:1px 7px;border-radius:99px">'+indOrfaosR+' s/ atividade</span>';
      h+='<span id="'+secId+'-ic" style="font-size:12px;color:var(--cinza-400);transition:transform .2s">▾</span>';
      h+='</div></div>';

      // ── Corpo: grid de cards ──
      h+='<div id="'+secId+'" style="padding:14px 16px;background:var(--branco)">';
      h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';

      itensRes.forEach(function(mi){
        var prog=progMap[mi.id]||{realizado_confirmado:0,realizado_pendente:0,pct_confirmado:0};
        var meta=parseFloat(mi.meta_numerica||0);
        var conf=parseFloat(prog.realizado_confirmado||0);
        var pend=parseFloat(prog.realizado_pendente||0);
        var pct=meta>0?Math.min(conf/meta*100,100):0;
        var pctPend=meta>0?Math.min(pend/meta*100,100):0;
        var corPct=pct>=70?'#059669':pct>=40?'#D97706':'#DC2626';
        var atvsIds=matToAtv[mi.id]||[];
        var temVinculo=atvsIds.length>0;
        var cardBorder=temVinculo?'2px solid #16A34A':'2px solid #DC2626';
        var cardBg=temVinculo?'#F0FDF4':'#FFF5F5';

        h+='<div style="background:'+cardBg+';border:'+cardBorder+';border-radius:var(--raio-lg);padding:14px 16px;border-top:3px solid '+cor+'">';

        // Header: produto_codigo + % atual
        h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px">';
        h+='<div style="flex:1;min-width:0">';
        h+='<div style="font-size:10px;font-weight:700;color:'+cor+';text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">'+mi.produto_codigo+'</div>';
        h+='<div style="font-size:12px;font-weight:600;color:var(--cinza-900);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+mi.indicador+'</div>';
        h+='</div>';
        h+='<div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:'+corPct+';flex-shrink:0;margin-top:2px">'+Math.round(pct)+'%</div>';
        h+='</div>';

        // Sparkline
        h+=sparkSVG(mi.id, meta);

        // Barra dupla conf + pend
        if(meta>0){
          h+='<div style="height:5px;background:var(--cinza-100);border-radius:3px;overflow:hidden;margin-top:8px;position:relative">';
          h+='<div style="position:absolute;left:0;top:0;height:100%;width:'+Math.min(pct+pctPend,100).toFixed(1)+'%;background:#FCD34D;border-radius:3px"></div>';
          h+='<div style="position:absolute;left:0;top:0;height:100%;width:'+pct.toFixed(1)+'%;background:#059669;border-radius:3px"></div>';
          h+='</div>';
          h+='<div style="font-size:10px;color:var(--cinza-500);margin-top:5px;font-family:var(--font-mono)">';
          h+=conf.toLocaleString('pt-BR')+' conf. ';
          if(pend>0)h+='· '+pend.toLocaleString('pt-BR')+' pend. ';
          h+='/ meta '+meta.toLocaleString('pt-BR')+' '+(mi.unidade||'');
          h+='</div>';
        } else {
          h+='<div style="font-size:10px;color:var(--cinza-400);margin-top:8px;font-style:italic">Indicador qualitativo</div>';
        }

        // Atividades cobrindo
        h+='<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--borda)">';
        if(atvsIds.length){
          h+='<div style="font-size:10px;color:var(--cinza-500);margin-bottom:5px">Atividades cobrindo ('+atvsIds.length+'):</div>';
          h+='<div style="display:flex;flex-wrap:wrap;gap:4px">';
          atvsIds.slice(0,4).forEach(function(aid){
            var a=atvById[aid];
            if(!a)return;
            h+='<span title="'+(a.nome_pt||a.nome||'')+'" style="font-size:10px;font-weight:600;background:var(--cinza-100);color:var(--cinza-700);padding:2px 7px;border-radius:99px;font-family:var(--font-mono)">'+a.codigo+'</span>';
          });
          if(atvsIds.length>4)h+='<span style="font-size:10px;color:var(--cinza-400);align-self:center">+'+(atvsIds.length-4)+' mais</span>';
          h+='</div>';
        } else {
          h+='<span style="font-size:10px;font-weight:600;color:#DC2626;background:#FEE2E2;padding:3px 9px;border-radius:99px">Sem atividade vinculada</span>';
        }
        h+='</div>';

        h+='</div>'; // card
      });

      h+='</div></div>'; // grid + corpo
      h+='</div>'; // bloco resultado
    });
    h+='</div>'; // container resultados
  }

  // ── Bloco 3 — Tabela atividade × indicadores com vinculação inline ──
  h+='<div class="ch">';
  h+='<div class="ch-tit">Atividades × Indicadores da Matriz</div>';
  h+='<div class="ch-sub">Vínculo entre cada atividade e as metas de resultado que ela cobre — clique em "+ Vincular" para adicionar</div>';
  h+='<div style="overflow-x:auto;margin-top:14px">';
  h+='<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h+='<thead><tr style="background:var(--cinza-50)">';
  var ths=['Código','Atividade','Resultado','Fase','Indicadores vinculados','Melhor progresso',''];
  ths.forEach(function(t,i){
    h+='<th style="padding:8px 10px;text-align:'+(i>=5?'center':'left')+';font-size:10px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--borda);white-space:nowrap">'+t+'</th>';
  });
  h+='</tr></thead><tbody>';

  var faseNm={A_INICIAR:'A Iniciar',ELABORACAO:'Elaboração',LICITACAO:'Licitação',ELABORADO:'Elaborado',CONTRATADO:'Contratado',CONCLUIDO:'Concluído'};
  var faseBg={A_INICIAR:'#F3F4F6',ELABORACAO:'#EFF6FF',LICITACAO:'#FFFBEB',ELABORADO:'#F0FDF4',CONTRATADO:'#ECFDF5',CONCLUIDO:'#1F2937'};
  var faseFg={A_INICIAR:'#374151',ELABORACAO:'#1E40AF',LICITACAO:'#92400E',ELABORADO:'#065F46',CONTRATADO:'#065F46',CONCLUIDO:'#F9FAFB'};

  // Ordena: atividades sem vínculo por último
  var atvSort=D.atv.slice().sort(function(a,b){
    var la=(atvToMat[a.id]||[]).length,lb=(atvToMat[b.id]||[]).length;
    if(la===0&&lb>0)return 1;
    if(lb===0&&la>0)return-1;
    return(a.codigo||'').localeCompare(b.codigo||'');
  });

  // Monta opções de indicadores para o dropdown de vinculação
  var indOptsHtml='<option value="">Escolha um indicador…</option>';
  D.matrizItens.forEach(function(mi){
    indOptsHtml+='<option value="'+mi.id+'">'+mi.resultado+' · '+mi.produto_codigo+' — '+(mi.indicador||'').substring(0,60)+'</option>';
  });

  atvSort.forEach(function(a,idx){
    var rv=resById[a.resultado_id];
    var resCod=rv?rv.codigo:'—';
    var resCor=resCores[resCod]||'#6B7280';
    var inds=atvToMat[a.id]||[];
    var fase=a.fase||'';
    var nome=a.nome_pt||a.nome||'';
    var semLink=inds.length===0;

    var bestPct=0;
    inds.forEach(function(mid){
      var p=progMap[mid];
      if(p&&parseFloat(p.pct_confirmado||0)>bestPct)bestPct=parseFloat(p.pct_confirmado||0);
    });

    var rowBg=semLink?'#FFF5F5':'transparent';
    var dropId='vdrop-'+a.id;
    h+='<tr style="border-bottom:1px solid var(--borda);background:'+rowBg+'" onmouseover="this.style.background=\''+(semLink?'#FFE4E4':'var(--cinza-50)')+'\'" onmouseout="this.style.background=\''+rowBg+'\'">';

    // Código
    h+='<td style="padding:9px 10px;white-space:nowrap"><span style="font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--cinza-100);padding:2px 7px;border-radius:4px;color:var(--cinza-700)">'+a.codigo+'</span></td>';

    // Nome
    h+='<td style="padding:9px 10px;color:var(--cinza-800);max-width:300px;word-break:break-word;line-height:1.4">'+nome+'</td>';

    // Resultado
    h+='<td style="padding:9px 10px;white-space:nowrap"><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:'+resCor+'22;color:'+resCor+'">'+resCod+'</span></td>';

    // Fase
    h+='<td style="padding:9px 10px;white-space:nowrap"><span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:'+(faseBg[fase]||'#F3F4F6')+';color:'+(faseFg[fase]||'#374151')+'">'+(faseNm[fase]||fase||'—')+'</span></td>';

    // Indicadores vinculados
    h+='<td style="padding:9px 10px">';
    if(semLink){
      h+='<span style="font-size:10px;font-weight:600;color:#DC2626;background:#FEE2E2;padding:2px 9px;border-radius:99px">Sem vínculo</span>';
    } else {
      h+='<div style="display:flex;flex-wrap:wrap;gap:3px">';
      inds.forEach(function(mid){
        var mi=D.matrizItens.find(function(x){return x.id===mid;});
        if(!mi)return;
        var p=progMap[mid]||{pct_confirmado:0};
        var pct2=parseFloat(p.pct_confirmado||0);
        var cor2=pct2>=70?'#059669':pct2>=40?'#D97706':'#DC2626';
        h+='<span title="'+mi.indicador+'" style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;background:#F0FDF4;color:#065F46;padding:2px 8px;border-radius:99px;border:1px solid #A7F3D0">';
        h+=mi.produto_codigo;
        if(mi.meta_numerica)h+=' <span style="color:'+cor2+';font-family:var(--font-mono);font-size:9px">'+Math.round(pct2)+'%</span>';
        h+='<span onclick="desvincularInd(\''+a.id+'\',\''+mid+'\')" title="Remover vínculo" style="cursor:pointer;color:#DC2626;font-size:10px;line-height:1;margin-left:1px">×</span>';
        h+='</span>';
      });
      h+='</div>';
    }
    h+='</td>';

    // Melhor progresso
    h+='<td style="padding:9px 10px;text-align:center">';
    if(semLink){
      h+='<span style="color:var(--cinza-300)">—</span>';
    } else {
      var bCor=bestPct>=70?'#059669':bestPct>=40?'#D97706':'#DC2626';
      h+='<span style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:'+bCor+'">'+Math.round(bestPct)+'%</span>';
    }
    h+='</td>';

    // Dropdown inline de vinculação
    h+='<td style="padding:9px 10px;white-space:nowrap">';
    h+='<div style="position:relative;display:inline-block">';
    h+='<button onclick="toggleVdrop(\''+dropId+'\')" style="font-size:10px;font-weight:600;padding:3px 9px;border-radius:4px;border:1px solid var(--borda);background:var(--branco);color:var(--cinza-600);cursor:pointer;display:inline-flex;align-items:center;gap:4px">+ Vincular</button>';
    h+='<div id="'+dropId+'" style="display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:99;background:#fff;border:1px solid var(--borda);border-radius:var(--raio);box-shadow:0 4px 18px rgba(0,0,0,.12);min-width:280px;padding:6px">';
    h+='<select onchange="vincularInd(\''+a.id+'\',this)" style="width:100%;font-size:11px;padding:5px 8px;border:1px solid var(--borda);border-radius:4px;color:var(--cinza-800)">'+indOptsHtml+'</select>';
    h+='</div></div>';
    h+='</td>';

    h+='</tr>';
  });

  h+='</tbody></table></div></div>';

  el.innerHTML=h;
}

window.toggleCobSec=function(id){
  var el=document.getElementById(id);
  var ic=document.getElementById(id+'-ic');
  if(!el)return;
  var hidden=el.style.display==='none';
  el.style.display=hidden?'':'none';
  if(ic)ic.style.transform=hidden?'':'rotate(-90deg)';
};

window.toggleVdrop=function(id){
  var el=document.getElementById(id);
  if(!el)return;
  var open=el.style.display==='none'||!el.style.display;
  document.querySelectorAll('[id^="vdrop-"]').forEach(function(d){d.style.display='none';});
  el.style.display=open?'block':'none';
};

window.vincularInd=async function(atvId, sel){
  var matrizItemId=sel.value;
  if(!matrizItemId)return;
  sel.value='';
  var dropEl=sel.closest('[id^="vdrop-"]');
  if(dropEl)dropEl.style.display='none';
  var{error}=await db.from('atividade_matriz').upsert({atividade_id:atvId,matriz_item_id:matrizItemId},{onConflict:'atividade_id,matriz_item_id'});
  if(error){alert('Erro ao vincular: '+error.message);return;}
  var r=await db.from('atividade_matriz').select('atividade_id,matriz_item_id');
  D.atvMatriz=r.data||[];
  renderCobertura();
};

window.desvincularInd=async function(atvId, matrizItemId){
  if(!confirm('Remover vínculo entre esta atividade e o indicador?'))return;
  var{error}=await db.from('atividade_matriz').delete().eq('atividade_id',atvId).eq('matriz_item_id',matrizItemId);
  if(error){alert('Erro ao remover: '+error.message);return;}
  var r=await db.from('atividade_matriz').select('atividade_id,matriz_item_id');
  D.atvMatriz=r.data||[];
  renderCobertura();
};

})();
</script>
</body>
</html>
