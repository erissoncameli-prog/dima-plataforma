<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Visão Geral</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<link href="../css/sidebar.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
.dash-tabs{display:flex;gap:0;border-bottom:1px solid var(--borda);background:var(--branco);padding:0 28px;overflow-x:auto;flex-shrink:0;}
.dash-tab{padding:10px 20px;font-size:12px;font-weight:500;color:var(--cinza-500);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font-sans);white-space:nowrap;transition:all .15s;}
.dash-tab:hover{color:var(--cinza-700);}
.dash-tab.ativo{color:var(--verde-medio);border-bottom-color:var(--verde-medio);font-weight:600;}
.dash-pane{display:none;padding:24px 28px;}
.dash-pane.ativo{display:block;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:20px;position:relative;overflow:hidden;}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.kv::after{background:var(--verde-claro);}
.ko::after{background:var(--ouro);}
.ka::after{background:var(--azul-medio);}
.ke::after{background:var(--erro);}
.krx::after{background:#7C3AED;}
.kpi-lbl{font-size:10px;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.kpi-val{font-size:24px;font-weight:600;color:var(--cinza-900);letter-spacing:-.02em;line-height:1.1;}
.kpi-sub{font-size:11px;color:var(--cinza-500);margin-top:4px;}
.kpi-bar{height:3px;background:var(--cinza-100);border-radius:2px;margin-top:10px;overflow:hidden;}
.kpi-fill{height:100%;border-radius:2px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:18px;}
.g31{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;}
.g13{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px;}
.ch{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:20px;}
.ch-tit{font-size:13px;font-weight:600;color:var(--cinza-800,#1F2937);margin-bottom:4px;}
.ch-sub{font-size:11px;color:var(--cinza-500);margin-bottom:16px;}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.leg-i{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--cinza-600,#4B5563);}
.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
/* Indicadores */
.ind-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--borda);}
.ind-row:last-child{border-bottom:none;}
.ind-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ind-nome{font-size:11px;color:var(--cinza-900);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ind-meta{font-size:10px;color:var(--cinza-400,#9CA3AF);width:60px;text-align:center;flex-shrink:0;}
.ind-prog{width:80px;flex-shrink:0;}
.ind-bar{height:5px;background:var(--cinza-100);border-radius:2px;overflow:hidden;margin-bottom:2px;}
.ind-fill{height:100%;border-radius:2px;}
.ind-pct{font-size:9px;color:var(--cinza-500);text-align:right;}
.ind-val{font-size:11px;font-weight:600;width:40px;text-align:right;flex-shrink:0;font-family:var(--font-mono);}
/* Alertas */
.al-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda);align-items:flex-start;}
.al-item:last-child{border-bottom:none;}
.al-ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.al-body{flex:1;}
.al-tit{font-size:12px;font-weight:500;color:var(--cinza-900);}
.al-desc{font-size:11px;color:var(--cinza-500);margin-top:2px;}
.al-bdg{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;flex-shrink:0;margin-top:2px;}
/* Gauge */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
/* Financeiro filtros */
.fin-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;background:var(--cinza-50);padding:12px;border-radius:var(--raio);border:1px solid var(--borda);}
.fin-filters label{font-size:11px;font-weight:500;color:var(--cinza-700);white-space:nowrap;}
.fin-filters select,.fin-filters input{height:32px;font-size:12px;border:1px solid var(--borda-forte);border-radius:var(--raio);padding:0 8px;background:var(--branco);font-family:var(--font-sans);color:var(--cinza-900);}
.fin-filters select{min-width:140px;}
.fin-filters input[type=date]{min-width:130px;}
.btn-filtrar{height:32px;padding:0 14px;background:var(--verde-medio);color:#fff;border:none;border-radius:var(--raio);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-sans);}
.btn-limpar{height:32px;padding:0 14px;background:var(--cinza-100);color:var(--cinza-700);border:1px solid var(--borda);border-radius:var(--raio);font-size:12px;cursor:pointer;font-family:var(--font-sans);}
/* Tabela financeiro */
.fin-tbl{width:100%;font-size:12px;border-collapse:collapse;}
.fin-tbl th{padding:9px 10px;font-size:10px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--borda);background:var(--cinza-50);text-align:left;white-space:nowrap;}
.fin-tbl td{padding:9px 10px;border-bottom:1px solid var(--borda);color:var(--cinza-700);vertical-align:middle;}
.fin-tbl tr:last-child td{border-bottom:none;}
.fin-tbl tr:hover td{background:var(--cinza-50);}
.sit-pago{background:#DCFCE7;color:#166534;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;}
.sit-apagar{background:#FEF9C3;color:#854D0E;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;}
.sit-cancelado{background:#FEE2E2;color:#991B1B;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;}
.fin-resumo{display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--borda);margin-top:8px;font-size:12px;flex-wrap:wrap;}
.fin-res-item{display:flex;flex-direction:column;gap:2px;}
.fin-res-lbl{font-size:10px;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.04em;}
.fin-res-val{font-size:13px;font-weight:600;font-family:var(--font-mono);}
/* Painel de tarefas */
.tarefa-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--borda);align-items:flex-start;}
.tarefa-item:last-child{border-bottom:none;}
.tarefa-item:hover{background:var(--cinza-50);margin:0 -16px;padding:12px 16px;border-radius:var(--raio);}
.tarefa-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.tarefa-corpo{flex:1;min-width:0;}
.tarefa-tit{font-size:13px;font-weight:600;color:var(--cinza-900);margin-bottom:3px;}
.tarefa-sub{font-size:11px;color:var(--cinza-500);line-height:1.4;}
.tarefa-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
.tarefa-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.tarefa-dias{font-size:10px;color:var(--cinza-400);}
.tarefa-acao{flex-shrink:0;margin-top:2px;}
.venc-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio);padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.venc-card:last-child{margin-bottom:0;}
.venc-dias-ok{background:#ECFDF5;color:#065F46;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;font-family:var(--font-mono);text-align:center;min-width:44px;flex-shrink:0;}
.venc-dias-alerta{background:#FFFBEB;color:#92400E;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;font-family:var(--font-mono);text-align:center;min-width:44px;flex-shrink:0;}
.venc-dias-vencido{background:#FEF2F2;color:#991B1B;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;font-family:var(--font-mono);text-align:center;min-width:44px;flex-shrink:0;}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/ajuda.js"></script>
<script>
(function(){

// ── Utilitários locais ────────────────────────────────────
var D_BRL = function(v){ return 'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); };
var D_USD = function(v){ return 'U$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}); };
var D_PCT = function(v){ return Math.round(parseFloat(v||0))+'%'; };
var D_DATE = function(d){ return d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '—'; };
var D_P = function(v,t){ return t>0 ? Math.min(parseFloat(v||0)/parseFloat(t)*100,100) : 0; };
var D = {};
var CHARTS = {};
var _podeCobertura = false; // definido após carregarUsuario()

// ── Init ──────────────────────────────────────────────────
(async function(){
  var u = await carregarUsuario();
  if(!u){ window.location.href='../index.html'; return; }
  _podeCobertura = ['super_admin','coordenacao'].includes(appState.perfil) || (appState.permissoes||[]).includes('dashboard_cobertura');

  // Render layout normal
  document.getElementById('app').innerHTML = gerarLayout(
    'Bem-vindo(a), '+u.nome_completo.split(' ')[0]+'!', 'dashboard'
  ) + `
    <div id="pane-tarefas" class="dash-pane"></div>
    <div id="pane-financiadores" class="dash-pane ativo"><div class="empty-state"><div class="spinner"></div></div></div>
    <div id="pane-operacional" class="dash-pane"></div>
    <div id="pane-resultados" class="dash-pane"></div>
    <div id="pane-execucao" class="dash-pane"></div>
    <div id="pane-alertas" class="dash-pane"></div>
    <div id="pane-cobertura" class="dash-pane"></div>
  ` + fecharLayout();

  carregarLogosSidebar();

  // Integrar guias no topbar via DOM — sem espaço em branco
  var _topbar = document.querySelector('.topbar');
  if(_topbar) {
    _topbar.style.padding = '0';
    _topbar.style.flexDirection = 'column';
    _topbar.style.height = 'auto';
    _topbar.style.alignItems = 'stretch';
    _topbar.style.gap = '0';
    _topbar.style.borderBottom = 'none';
    // Envolver conteúdo existente em topRow
    var _topRow = document.createElement('div');
    _topRow.style.cssText = 'display:flex;align-items:center;padding:0 28px;height:58px;gap:12px;border-bottom:1px solid var(--borda);flex-shrink:0;';
    while(_topbar.firstChild) _topRow.appendChild(_topbar.firstChild);
    _topbar.appendChild(_topRow);
    // Criar as guias
    var _tabs = document.createElement('div');
    _tabs.className = 'dash-tabs';
    var _tabDefs = [
      ['tarefas','📋 Minhas Tarefas'],
      ['financiadores','Financiadores'],
      ['operacional','Gestão operacional'],
      ['resultados','Resultados × Financeiro'],
      ['execucao','Execução financeira'],
      ['alertas','Alertas'],
    ];
    if(_podeCobertura) _tabDefs.push(['cobertura','Cobertura de Indicadores']);
    // Aba inicial: técnicos abrem em Tarefas, demais em Financiadores
    var _abaInicial = (appState.perfil === 'tecnico') ? 'tarefas' : 'financiadores';
    document.getElementById('pane-'+_abaInicial).classList.add('ativo');
    // Só oculta financiadores se a aba inicial for outra
    if(_abaInicial !== 'financiadores'){
      document.getElementById('pane-financiadores').classList.remove('ativo');
    }
    _tabDefs.forEach(function(td, i) {
      var btn = document.createElement('button');
      var isAtiva = td[0] === _abaInicial;
      btn.className = 'dash-tab' + (isAtiva ? ' ativo' : '');
      btn.textContent = td[1];
      // Aba tarefas sempre recarrega ao clicar (atualiza após avaliações)
      if(td[0] === 'tarefas'){
        btn.setAttribute('onclick', "mudarAba('tarefas',this);renderTarefas()");
      } else {
        btn.setAttribute('onclick', "mudarAba('"+td[0]+"',this)");
      }
      _tabs.appendChild(btn);
    });
    _topbar.appendChild(_tabs);
  }

    await loadData();
})();

window.mudarAba = function(id,btn){
  document.querySelectorAll('.dash-tab').forEach(function(b){b.classList.remove('ativo');});
  document.querySelectorAll('.dash-pane').forEach(function(p){p.classList.remove('ativo');});
  btn.classList.add('ativo');
  document.getElementById('pane-'+id).classList.add('ativo');
  // Redimensiona todos os gráficos ao trocar de aba (canvas precisa estar visível)
  setTimeout(function(){
    Object.values(CHARTS).forEach(function(c){ try{ c.resize(); }catch(e){} });
  }, 30);
};

// ── Dados ─────────────────────────────────────────────────
async function loadData(){
  var r = await Promise.all([
    db.from('atividades').select('*'),
    db.from('tdrs').select('*,atividades(codigo,responsavel:usuarios!atividades_responsavel_id_fkey(id,nome_completo))'),
    db.from('resultados').select('*'),
    db.from('vw_saldo_atividade').select('*'),
    db.from('indicadores').select('*,resultados(codigo,nome_pt)').eq('ativo',true),
    db.from('execucao_financeira').select('*,atividades(id,codigo,nome_pt),fornecedores(id,nome),contratos(id,numero)'),
    db.from('fornecedores').select('id,nome,tipo'),
    db.from('contratos').select('id,numero,objeto_pt,valor_total_brl,status'),
    db.from('matriz_itens').select('id,resultado,produto_codigo,produto_titulo,indicador,meta_numerica,unidade').eq('ativo',true).order('ordem'),
    db.from('vw_matriz_progresso').select('*'),
    db.from('atividade_matriz').select('atividade_id,matriz_item_id'),
    db.from('produto_matriz_contribuicao').select('matriz_item_id,valor,status,contratos_produtos_entregas(dt_entrega)').eq('status','confirmado'),
  ]);
  D.atv=r[0].data||[]; D.tdrs=r[1].data||[]; D.res=r[2].data||[];
  D.sal=r[3].data||[]; D.ind=r[4].data||[]; D.lanc=r[5].data||[];
  D.forns=r[6].data||[]; D.contr=r[7].data||[];
  D.matrizItens=r[8].data||[]; D.matrizProg=r[9].data||[];
  D.atvMatriz=r[10].data||[]; D.contribs=r[11].data||[];
  D.lancFilt = D.lanc.slice(); // cópia para filtros

  renderFinanciadores();
  renderOperacional();
  renderTarefas();
  renderResultados();
  renderExecucao();
  renderAlertas();
  if(_podeCobertura) renderCobertura();
}

// ── resMap helper ─────────────────────────────────────────
function resMap(){
  var m={};
  D.res.forEach(function(rv){
    m[rv.codigo]={orc:0,comp:0,pago:0,apagar:0,nome:rv.nome_pt,ind:[]};
  });
  D.sal.forEach(function(s){
    var a=D.atv.find(function(x){return x.id===s.id;});
    if(!a)return;
    var rv=D.res.find(function(x){return x.id===a.resultado_id;});
    if(!rv)return;
    var k=rv.codigo;
    if(!m[k])m[k]={orc:0,comp:0,pago:0,apagar:0,nome:rv.nome_pt,ind:[]};
    m[k].orc+=parseFloat(s.orcamento_usd||0);
    m[k].comp+=parseFloat(s.comprometido_usd||0);
    m[k].pago+=parseFloat(s.pago_usd||0);
    m[k].apagar+=parseFloat(s.a_pagar_usd||0);
  });
  D.matrizItens.forEach(function(mi){
    var k='R'+mi.resultado;
    if(m[k])m[k].ind.push(mi);
  });
  return m;
}

function destroyChart(id){
  if(CHARTS[id]){CHARTS[id].destroy();delete CHARTS[id];}
}
function mkChart(id,cfg){
  destroyChart(id);
  var el=document.getElementById(id);
  if(el)CHARTS[id]=new Chart(el,cfg);
}

// ─────────────────────────────────────────────────────────
// GUIA 1 — FINANCIADORES
// ─────────────────────────────────────────────────────────
function renderFinanciadores(){
  var orc=D.atv.reduce(function(s,a){return s+parseFloat(a.orcamento_usd||0);},0);
  var comp=D.sal.reduce(function(s,a){return s+parseFloat(a.comprometido_usd||0);},0);
  var pago=D.sal.reduce(function(s,a){return s+parseFloat(a.pago_usd||0);},0);
  var apagar=D.sal.reduce(function(s,a){return s+parseFloat(a.a_pagar_usd||0);},0);
  var taprov=D.tdrs.filter(function(t){return t.status==='aprovado';}).length;
  var _mPF=D.matrizProg||[];
  var _cmF=D.matrizItens;
  var metasProg=_cmF.filter(function(i){
    var p=_mPF.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
    return parseFloat(p.pct_confirmado||0)>0;
  }).length;
  var pExec=orc>0?pago/orc*100:0;
  var pComp=orc>0?comp/orc*100:0;
  var pApagar=orc>0?apagar/orc*100:0;
  var pTdr=D.tdrs.length>0?taprov/D.tdrs.length*100:0;
  var rm=resMap(); var rks=Object.keys(rm);

  // Hero gauge — semi-rosca SVG para Taxa de Execução (legível mesmo em valores baixos)
  var _arcLen=157.08; // π × 50 (comprimento da semi-circunferência)
  var _arcFill=(_arcLen*Math.min(pExec,100)/100).toFixed(2);
  var _corExec=pExec>=50?'#059669':pExec>=20?'#D97706':'#EF4444';

  var h='<div style="display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(4,1fr);gap:12px;margin-bottom:16px;align-items:stretch">';

  // Card hero — gauge
  h+='<div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center">';
  h+='<div style="font-size:10px;font-weight:700;color:#6B7280;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px">Taxa de execução</div>';
  h+='<svg viewBox="0 0 120 68" style="width:100%;max-width:170px">'
    +'<path d="M 10,65 A 50,50 0 0,1 110,65" fill="none" stroke="#F3F4F6" stroke-width="11" stroke-linecap="round"/>'
    +'<path d="M 10,65 A 50,50 0 0,1 110,65" fill="none" stroke="'+_corExec+'" stroke-width="11" stroke-linecap="round"'
    +' stroke-dasharray="'+_arcFill+' '+_arcLen+'"/>'
    +'</svg>';
  h+='<div style="font-size:30px;font-weight:900;color:'+_corExec+';font-family:var(--font-mono);line-height:1;margin-top:-4px">'+pExec.toFixed(1)+'%</div>';
  h+='<div style="font-size:11px;color:#6B7280;margin-top:6px;text-align:center">'+D_USD(pago)+' pagos de '+D_USD(orc)+'</div>';
  h+='</div>';

  // 4 cards modernizados — barra grossa + borda esquerda + fundo semântico suave
  [
    {lbl:'Comprometido (TDR)', val:D_PCT(pComp),        sub:D_USD(comp)+' em TDRs ativos',          pct:Math.min(pComp,100),              cor:'#D97706', bg:'#FFFBEB', bc:'#FDE68A'},
    {lbl:'A pagar',            val:D_PCT(pApagar),       sub:D_USD(apagar)+' comprometido financ.',   pct:Math.min(pApagar,100),            cor:'#F59E0B', bg:'#FFFBEB', bc:'#FEF3C7'},
    {lbl:'TDRs aprovados',     val:taprov+' / '+D.tdrs.length, sub:D_PCT(pTdr)+' do total',          pct:Math.min(pTdr,100),               cor:'#2563EB', bg:'#EFF6FF', bc:'#BFDBFE'},
    {lbl:'Metas com avanço',   val:metasProg+' / '+_cmF.length,  sub:'indicadores com progresso >0',  pct:D_P(metasProg,_cmF.length),       cor:'#7C3AED', bg:'#F5F3FF', bc:'#DDD6FE'},
  ].forEach(function(c){
    h+='<div style="background:'+c.bg+';border:1px solid '+c.bc+';border-left:4px solid '+c.cor+';border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:3px">';
    h+='<div style="font-size:10px;font-weight:700;color:#6B7280;letter-spacing:.05em;text-transform:uppercase">'+c.lbl+'</div>';
    h+='<div style="font-size:26px;font-weight:800;color:'+c.cor+';font-family:var(--font-mono);line-height:1.15">'+c.val+'</div>';
    h+='<div style="font-size:11px;color:#6B7280">'+c.sub+'</div>';
    h+='<div style="height:7px;background:rgba(0,0,0,.08);border-radius:4px;overflow:hidden;margin-top:8px">';
    h+='<div style="height:100%;background:'+c.cor+';width:'+c.pct+'%;border-radius:4px;transition:width .5s ease"></div>';
    h+='</div></div>';
  });

  h+='</div>';

  // Linha 1: Donut orçamento + Stacked bar por resultado
  h+='<div class="g31">';
  h+='<div class="ch"><div class="ch-tit">Execução financeira por resultado</div><div class="ch-sub">Pago × A pagar × Comprometido (TDR) × Saldo livre</div>';
  h+='<div class="leg"><div class="leg-i"><div class="leg-sq" style="background:#059669"></div>Pago</div><div class="leg-i"><div class="leg-sq" style="background:#F59E0B"></div>A pagar</div><div class="leg-i"><div class="leg-sq" style="background:#D97706"></div>Comprometido (TDR)</div><div class="leg-i"><div class="leg-sq" style="background:#E5E7EB"></div>Livre</div></div>';
  h+='<div style="position:relative;height:220px"><canvas id="ch-stacked-res"></canvas></div></div>';
  h+='<div class="ch"><div class="ch-tit">Distribuição do orçamento</div><div class="ch-sub">Visão geral dos recursos</div>';
  h+='<div style="position:relative;height:180px"><canvas id="ch-donut-orc"></canvas></div>';
  h+='<div id="leg-donut-orc" style="margin-top:10px;font-size:11px"></div></div>';
  h+='</div>';

  // Linha 2: TDRs rosca + Status fases linha
  h+='<div class="g2">';
  h+='<div class="ch"><div class="ch-tit">TDRs por status e valor (U$)</div><div class="ch-sub">Distribuição do valor comprometido</div>';
  h+='<div style="display:flex;align-items:center;gap:16px"><div style="position:relative;width:160px;height:160px;flex-shrink:0"><canvas id="ch-donut-tdr"></canvas></div><div id="leg-tdr" style="flex:1;font-size:11px"></div></div></div>';
  h+='<div class="ch"><div class="ch-tit">Atividades por fase</div><div class="ch-sub">Pipeline de contratação atual</div>';
  h+='<div style="position:relative;height:160px"><canvas id="ch-fases-polar"></canvas></div></div>';
  h+='</div>';

  document.getElementById('pane-financiadores').innerHTML = h;

  // Gráficos com setTimeout para garantir DOM
  setTimeout(function(){
    // Stacked bar por resultado — 4 camadas: pago + a_pagar + comprometido TDRs + saldo livre
    var labels=rks; var orcData=rks.map(function(k){return rm[k].orc;});
    var pagoData=rks.map(function(k){return rm[k].pago;});
    var apagarData=rks.map(function(k){return rm[k].apagar||0;});
    var compData=rks.map(function(k){return Math.max(0,rm[k].comp-rm[k].pago-(rm[k].apagar||0));});
    var livreData=rks.map(function(k){return Math.max(0,rm[k].orc-rm[k].comp);});
    mkChart('ch-stacked-res',{type:'bar',data:{labels:labels,datasets:[
      {label:'Pago',data:pagoData,backgroundColor:'#059669',stack:'s',borderRadius:{topLeft:3,topRight:3}},
      {label:'A pagar',data:apagarData,backgroundColor:'#F59E0B',stack:'s'},
      {label:'Comprometido (TDR)',data:compData,backgroundColor:'#D97706',stack:'s'},
      {label:'Saldo livre',data:livreData,backgroundColor:'#E5E7EB',stack:'s',borderRadius:{topLeft:3,topRight:3}},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:11},color:'#6B7280'}},y:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10},color:'#9CA3AF',callback:function(v){return 'U$ '+Math.round(v/1000)+'K';}}}}}}); 

    // Donut orçamento — 4 fatias: pago, a_pagar, comprometido TDRs, livre
    var orcTotal=D.atv.reduce(function(s,a){return s+parseFloat(a.orcamento_usd||0);},0);
    var compTotal=D.sal.reduce(function(s,a){return s+parseFloat(a.comprometido_usd||0);},0);
    var pagoTotal=D.sal.reduce(function(s,a){return s+parseFloat(a.pago_usd||0);},0);
    var apagarTotal=D.sal.reduce(function(s,a){return s+parseFloat(a.a_pagar_usd||0);},0);
    var livreTotal=Math.max(0,orcTotal-compTotal);
    mkChart('ch-donut-orc',{type:'doughnut',data:{labels:['Pago','A pagar','Comprometido (TDR)','Livre'],datasets:[{
      data:[pagoTotal,apagarTotal,Math.max(0,compTotal-pagoTotal-apagarTotal),livreTotal],
      backgroundColor:['#059669','#F59E0B','#D97706','#E5E7EB'],borderWidth:2,borderColor:'#fff'
    }]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false}}}});
    document.getElementById('leg-donut-orc').innerHTML=[
      '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--borda)"><span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#059669;display:inline-block"></span>Pago</span><strong>'+D_USD(pagoTotal)+'</strong></div>',
      '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--borda)"><span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#F59E0B;display:inline-block"></span>A pagar</span><strong>'+D_USD(apagarTotal)+'</strong></div>',
      '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--borda)"><span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#D97706;display:inline-block"></span>Comprometido (TDR)</span><strong>'+D_USD(Math.max(0,compTotal-pagoTotal-apagarTotal))+'</strong></div>',
      '<div style="display:flex;justify-content:space-between;padding:3px 0"><span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#E5E7EB;border:1px solid #ccc;display:inline-block"></span>Livre</span><strong>'+D_USD(livreTotal)+'</strong></div>',
    ].join('');

    // Donut TDRs por status
    var stMap={rascunho:0,revisao_interna:0,aprovado:0,ajustes:0,enviado_unesco:0};
    var stValMap={rascunho:0,revisao_interna:0,aprovado:0,ajustes:0,enviado_unesco:0};
    D.tdrs.forEach(function(t){if(stMap[t.status]!==undefined){stMap[t.status]++;stValMap[t.status]+=parseFloat(t.valor_usd||0);}});
    var stNm={rascunho:'Rascunho',revisao_interna:'Revisão',aprovado:'Aprovado',ajustes:'Ajustes',enviado_unesco:'UNESCO'};
    var stCor={rascunho:'#D1D5DB',revisao_interna:'#93C5FD',aprovado:'#34D399',ajustes:'#FCD34D',enviado_unesco:'#6EE7B7'};
    var stKs=Object.keys(stMap).filter(function(k){return stMap[k]>0;});
    mkChart('ch-donut-tdr',{type:'doughnut',data:{labels:stKs.map(function(k){return stNm[k];}),datasets:[{data:stKs.map(function(k){return stValMap[k];}),backgroundColor:stKs.map(function(k){return stCor[k];}),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false}}}});
    document.getElementById('leg-tdr').innerHTML=stKs.map(function(k){return '<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px"><div style="width:10px;height:10px;border-radius:2px;background:'+stCor[k]+';flex-shrink:0"></div><span>'+stNm[k]+' ('+stMap[k]+')<br><span style="font-family:var(--font-mono);font-size:10px;color:var(--cinza-400,#9CA3AF)">'+D_USD(stValMap[k])+'</span></span></div>';}).join('');

    // Polar area fases
    var fases={A_INICIAR:0,ELABORACAO:0,LICITACAO:0,ELABORADO:0,CONTRATADO:0,CONCLUIDO:0};
    D.atv.forEach(function(a){if(fases[a.fase]!==undefined)fases[a.fase]++;});
    var fNm=['A Iniciar','Elaboração','Licitação','Elaborado','Contratado','Concluído'];
    var fVals=Object.values(fases);
    mkChart('ch-fases-polar',{type:'polarArea',data:{labels:fNm,datasets:[{data:fVals,backgroundColor:['rgba(209,213,219,.7)','rgba(147,197,253,.7)','rgba(252,211,77,.7)','rgba(110,231,183,.7)','rgba(52,211,153,.7)','rgba(5,150,105,.7)'],borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:12}}}}});
  },50);
}

// ─────────────────────────────────────────────────────────
// GUIA 2 — OPERACIONAL
// ─────────────────────────────────────────────────────────
function renderOperacional(){
  var orc=D.atv.reduce(function(s,a){return s+parseFloat(a.orcamento_usd||0);},0);
  var comp=D.sal.reduce(function(s,a){return s+parseFloat(a.comprometido_usd||0);},0);
  var pago=D.lanc.filter(function(l){return l.situacao==='pago';}).reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var taprov=D.tdrs.filter(function(t){return t.status==='aprovado';}).length;
  var fases={A_INICIAR:0,ELABORACAO:0,LICITACAO:0,ELABORADO:0,CONTRATADO:0,CONCLUIDO:0};
  D.atv.forEach(function(a){if(fases[a.fase]!==undefined)fases[a.fase]++;});

  // Top comprometidas
  var topComp=D.sal.filter(function(s){return parseFloat(s.comprometido_usd||0)>0;})
    .sort(function(a,b){return parseFloat(b.comprometido_usd)-parseFloat(a.comprometido_usd);}).slice(0,10);

  // Atividades × TDRs — cobertura por atividade
  var _stKeys=['rascunho','revisao_interna','ajustes','enviado_unesco','retorno_unesco','aprovado','cancelado'];
  var atvTdrs=D.atv.map(function(a){
    var tdrsAtv=D.tdrs.filter(function(t){return t.atividade_id===a.id;});
    var counts={rascunho:0,revisao_interna:0,ajustes:0,enviado_unesco:0,retorno_unesco:0,aprovado:0,cancelado:0};
    tdrsAtv.forEach(function(t){if(counts[t.status]!==undefined)counts[t.status]++;});
    return{atv:a,total:tdrsAtv.length,counts:counts};
  });
  atvTdrs.sort(function(a,b){
    if(a.total===0&&b.total>0)return-1;
    if(b.total===0&&a.total>0)return 1;
    return a.total-b.total;
  });
  var _semTdr=atvTdrs.filter(function(x){return x.total===0;}).length;
  var _comTdr=atvTdrs.length-_semTdr;

  var h='<div class="g3">';
  h+='<div class="ch" style="text-align:center"><div class="ch-tit">'+((orc>0?pago/orc*100:0).toFixed(1))+'%</div><div class="ch-sub" style="margin-bottom:6px">Execução paga</div>';
  h+='<div style="position:relative;height:100px"><canvas id="ch-g1"></canvas></div>';
  h+='<div style="font-size:11px;color:var(--cinza-500);margin-top:6px">'+D_USD(pago)+' de '+D_USD(orc)+'</div></div>';
  h+='<div class="ch" style="text-align:center"><div class="ch-tit">'+((orc>0?comp/orc*100:0).toFixed(1))+'%</div><div class="ch-sub" style="margin-bottom:6px">Comprometido</div>';
  h+='<div style="position:relative;height:100px"><canvas id="ch-g2"></canvas></div>';
  h+='<div style="font-size:11px;color:var(--cinza-500);margin-top:6px">'+D_USD(comp)+' em TDRs</div></div>';
  h+='<div class="ch" style="text-align:center"><div class="ch-tit">'+(D.tdrs.length>0?Math.round(taprov/D.tdrs.length*100):0)+'%</div><div class="ch-sub" style="margin-bottom:6px">TDRs aprovados</div>';
  h+='<div style="position:relative;height:100px"><canvas id="ch-g3"></canvas></div>';
  h+='<div style="font-size:11px;color:var(--cinza-500);margin-top:6px">'+taprov+' de '+D.tdrs.length+' TDRs</div></div>';
  h+='</div>';

  h+='<div class="g2">';
  // Barras pipeline fases
  h+='<div class="ch"><div class="ch-tit">Pipeline de contratação</div><div class="ch-sub">Atividades por fase</div><div style="position:relative;height:220px"><canvas id="ch-pipeline"></canvas></div></div>';
  // Barra horizontal top comprometidas
  h+='<div class="ch"><div class="ch-tit">Top atividades comprometidas</div><div class="ch-sub">Percentual do orçamento alocado</div><div style="position:relative;height:'+(topComp.length*32+40)+'px"><canvas id="ch-top-comp"></canvas></div></div>';
  h+='</div>';

  // Linha barra TDR status
  h+='<div class="ch"><div class="ch-tit">Evolução do fluxo de TDRs</div><div class="ch-sub">Quantidade e valor por status</div><div style="position:relative;height:200px"><canvas id="ch-tdr-bar-combo"></canvas></div></div>';

  // Atividades × TDRs — card visual
  h+='<div class="ch" style="margin-bottom:14px">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  h+='<div><div class="ch-tit">Atividades × TDRs cadastrados</div><div class="ch-sub">Cobertura por atividade — ordenado por prioridade (sem TDR primeiro)</div></div>';
  h+='<div style="display:flex;gap:8px;flex-shrink:0">';
  h+='<span style="font-size:11px;font-weight:700;background:#FEE2E2;color:#991B1B;padding:4px 12px;border-radius:20px">'+_semTdr+' sem TDR</span>';
  h+='<span style="font-size:11px;font-weight:700;background:#D1FAE5;color:#065F46;padding:4px 12px;border-radius:20px">'+_comTdr+' com TDR</span>';
  h+='</div></div>';
  h+='<div style="position:relative;height:'+(atvTdrs.length*30+50)+'px"><canvas id="ch-atv-tdrs"></canvas></div>';
  h+='</div>';

  // TDRs por responsável
  var respSet=new Map();
  D.tdrs.forEach(function(t){
    var nome=(t.atividades&&t.atividades.responsavel&&t.atividades.responsavel.nome_completo)||'Sem responsável';
    if(!respSet.has(nome))respSet.set(nome,{rascunho:0,revisao_interna:0,ajustes:0,enviado_unesco:0,retorno_unesco:0,aprovado:0,cancelado:0});
    var r=respSet.get(nome);
    if(r[t.status]!==undefined)r[t.status]++;else r['rascunho']++;
  });
  var respNomes=[...respSet.keys()].sort(function(a,b){
    var ta=Object.values(respSet.get(a)).reduce(function(s,v){return s+v;},0);
    var tb=Object.values(respSet.get(b)).reduce(function(s,v){return s+v;},0);
    return tb-ta;
  });
  var respH=Math.max(respNomes.length*36+60,160);
  h+='<div class="ch"><div class="ch-tit">TDRs por responsável</div><div class="ch-sub">Distribuição por status</div><div style="position:relative;height:'+respH+'px"><canvas id="ch-tdr-resp"></canvas></div></div>';

  document.getElementById('pane-operacional').innerHTML = h;

  setTimeout(function(){
    // Gauges semicírculos
    function mkGauge(id,val,cor){
      mkChart(id,{type:'doughnut',data:{datasets:[{data:[Math.min(val,100),Math.max(0,100-val)],backgroundColor:[cor,'#F3F4F6'],borderWidth:0,circumference:180,rotation:270}]},options:{responsive:true,maintainAspectRatio:false,cutout:'75%',plugins:{legend:{display:false},tooltip:{enabled:false}}}});
    }
    var pExec=orc>0?pago/orc*100:0, pComp=orc>0?comp/orc*100:0, pTdr=D.tdrs.length>0?taprov/D.tdrs.length*100:0;
    mkGauge('ch-g1',pExec,'#059669'); mkGauge('ch-g2',pComp,'#D97706'); mkGauge('ch-g3',pTdr,'#2563EB');

    // Pipeline fases
    var fNm=['A Iniciar','Elaboração','Licitação','Elaborado','Contratado','Concluído'];
    var fVals=Object.values(fases);
    var fCor=['#D1D5DB','#93C5FD','#FCD34D','#6EE7B7','#34D399','#059669'];
    mkChart('ch-pipeline',{type:'bar',data:{labels:fNm,datasets:[{data:fVals,backgroundColor:fCor,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#6B7280'}},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{stepSize:1,font:{size:10},color:'#9CA3AF'}}}}});

    // Top comprometidas horizontal
    var topLabels=topComp.map(function(s){return s.codigo;});
    var topVals=topComp.map(function(s){return parseFloat(s.comprometido_usd||0);});
    var topCors=topComp.map(function(s){var p=parseFloat(s.pct_comprometido||0);return p>100?'#EF4444':p>95?'#F97316':'#2563EB';});
    mkChart('ch-top-comp',{type:'bar',data:{labels:topLabels,datasets:[{data:topVals,backgroundColor:topCors,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:9},color:'#9CA3AF',callback:function(v){return 'U$ '+Math.round(v/1000)+'K';}}},y:{grid:{display:false},ticks:{font:{size:10},color:'#374151'}}}}});

    // Combo TDR status — barras (qtd) + linha (valor)
    var stNm2={rascunho:'Rascunho',revisao_interna:'Revisão',aprovado:'Aprovado',ajustes:'Ajustes',enviado_unesco:'UNESCO'};
    var stMap2={rascunho:0,revisao_interna:0,aprovado:0,ajustes:0,enviado_unesco:0};
    var stVal2={rascunho:0,revisao_interna:0,aprovado:0,ajustes:0,enviado_unesco:0};
    D.tdrs.forEach(function(t){if(stMap2[t.status]!==undefined){stMap2[t.status]++;stVal2[t.status]+=parseFloat(t.valor_usd||0);}});
    var stKs2=Object.keys(stMap2);
    mkChart('ch-tdr-bar-combo',{type:'bar',data:{labels:stKs2.map(function(k){return stNm2[k];}),datasets:[
      {type:'bar',label:'Quantidade',data:stKs2.map(function(k){return stMap2[k];}),backgroundColor:'#BFDBFE',borderRadius:4,yAxisID:'y'},
      {type:'line',label:'Valor U$',data:stKs2.map(function(k){return stVal2[k];}),borderColor:'#D97706',backgroundColor:'rgba(217,119,6,.1)',pointBackgroundColor:'#D97706',pointRadius:5,fill:true,tension:0.3,yAxisID:'y2'},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:'#6B7280'}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{stepSize:1,font:{size:10},color:'#9CA3AF'},title:{display:true,text:'Qtd',font:{size:10}}},y2:{position:'right',grid:{display:false},ticks:{font:{size:10},color:'#9CA3AF',callback:function(v){return 'U$'+Math.round(v/1000)+'K';}},title:{display:true,text:'Valor',font:{size:10}}}}}});

    // Atividades × TDRs — barras empilhadas horizontais
    var _stCores={rascunho:'#D1D5DB',revisao_interna:'#93C5FD',ajustes:'#FCD34D',enviado_unesco:'#6EE7B7',retorno_unesco:'#F9A8D4',aprovado:'#34D399',cancelado:'#FCA5A5'};
    var _stLabels={rascunho:'Rascunho',revisao_interna:'Revisão',ajustes:'Ajustes',enviado_unesco:'UNESCO',retorno_unesco:'Retorno',aprovado:'Aprovado',cancelado:'Cancelado'};
    var atvLabels=atvTdrs.map(function(x){return x.total===0?'⚠ '+x.atv.codigo:x.atv.codigo;});
    var atvDatasets=_stKeys.map(function(sk){
      return{label:_stLabels[sk],data:atvTdrs.map(function(x){return x.counts[sk]||0;}),backgroundColor:_stCores[sk],borderRadius:2,borderSkipped:false};
    });
    // dataset phantom para atividades sem TDR (barra vermelha tênue de 0.3 indicando ausência)
    atvDatasets.unshift({label:'Sem TDR',data:atvTdrs.map(function(x){return x.total===0?0.4:0;}),backgroundColor:'#FCA5A5',borderRadius:2,borderSkipped:false});
    mkChart('ch-atv-tdrs',{type:'bar',data:{labels:atvLabels,datasets:atvDatasets},options:{
      responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{
        legend:{position:'top',labels:{font:{size:10},boxWidth:10,padding:8,filter:function(item){return item.text!=='Sem TDR';}}},
        tooltip:{callbacks:{
          title:function(items){var x=atvTdrs[items[0].dataIndex];return x.atv.codigo+' — '+(x.atv.nome_pt||'').substring(0,50);},
          afterTitle:function(items){var x=atvTdrs[items[0].dataIndex];return x.total===0?'⚠ Nenhum TDR cadastrado':x.total+' TDR(s) no total';}
        }}
      },
      scales:{
        x:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{stepSize:1,font:{size:10},color:'#9CA3AF'}},
        y:{stacked:true,grid:{display:false},ticks:{font:{size:10},color:function(ctx){var x=atvTdrs[ctx.index];return x&&x.total===0?'#EF4444':'#374151';}}}
      }
    }});

    // TDRs por responsável — barras empilhadas horizontais
    var stCores={rascunho:'#D1D5DB',revisao_interna:'#93C5FD',ajustes:'#FCD34D',enviado_unesco:'#6EE7B7',retorno_unesco:'#F9A8D4',aprovado:'#34D399',cancelado:'#FCA5A5'};
    var stLabels={rascunho:'Rascunho',revisao_interna:'Revisão interna',ajustes:'Ajustes',enviado_unesco:'Enviado UNESCO',retorno_unesco:'Retorno UNESCO',aprovado:'Aprovado',cancelado:'Cancelado'};
    var stKeys=Object.keys(stCores);
    var respDatasets=stKeys.map(function(sk){
      return{label:stLabels[sk],data:respNomes.map(function(n){return(respSet.get(n)||{})[sk]||0;}),backgroundColor:stCores[sk],borderRadius:2,borderSkipped:false};
    });
    // Abreviar nomes longos no eixo
    var respLabels=respNomes.map(function(n){
      var parts=n.split(' ');
      if(parts.length<=2)return n;
      return parts[0]+' '+parts[parts.length-1];
    });
    mkChart('ch-tdr-resp',{type:'bar',data:{labels:respLabels,datasets:respDatasets},options:{
      responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{
        legend:{position:'top',labels:{font:{size:10},boxWidth:10,padding:10}},
        tooltip:{callbacks:{title:function(items){return respNomes[items[0].dataIndex];}}}
      },
      scales:{
        x:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{stepSize:1,font:{size:10},color:'#9CA3AF'}},
        y:{stacked:true,grid:{display:false},ticks:{font:{size:10},color:'#374151'}}
      }
    }});
  },50);
}

// ─────────────────────────────────────────────────────────
// GUIA 3 — RESULTADOS × FINANCEIRO
// ─────────────────────────────────────────────────────────
function renderResultados(){
  var rm=resMap(); var rks=Object.keys(rm);
  var pago=D.lanc.filter(function(l){return l.situacao==='pago';}).reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var orc=D.atv.reduce(function(s,a){return s+parseFloat(a.orcamento_usd||0);},0);
  var mProgR=D.matrizProg||[];
  var comMetaR=D.matrizItens;
  var metasProg=comMetaR.filter(function(i){
    var p=mProgR.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
    return parseFloat(p.pct_confirmado||0)>0;
  }).length;
  var emRiscoGlobal=comMetaR.filter(function(i){
    var p=mProgR.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
    return parseFloat(p.pct_confirmado||0)<40;
  }).length;

  // ── Widget Matriz de Resultados ───────────────────────────
  var h='';
  if(D.matrizItens&&D.matrizItens.length){
    var mProg=D.matrizProg||[];
    var totalInd=D.matrizItens.length;
    var comMeta=D.matrizItens.filter(function(i){return parseFloat(i.meta_numerica||0)>0;});
    var atingidos=comMeta.filter(function(i){
      var p=mProg.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
      return parseFloat(p.pct_confirmado||0)>=100;
    }).length;
    var emRisco=comMeta.filter(function(i){
      var p=mProg.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
      return parseFloat(p.pct_confirmado||0)<40;
    }).length;
    var pendConf=mProg.reduce(function(s,p){return s+parseFloat(p.realizado_pendente||0);},0);
    var mediaGeral=comMeta.length?Math.round(comMeta.reduce(function(s,i){
      var p=mProg.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
      return s+Math.min(parseFloat(p.pct_confirmado||0),100);
    },0)/comMeta.length):0;

    // Por resultado — design com rings SVG e dot grid
    var coresRes={1:'#1D9E75',2:'#2563EB',3:'#7F77DD'};
    var resBlocos=[1,2,3].map(function(r){
      var itensR=comMeta.filter(function(i){return i.resultado===r;});
      if(!itensR.length)return'';
      var cor=coresRes[r];
      var mediaR=Math.round(itensR.reduce(function(s,i){
        var p=mProg.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
        return s+Math.min(parseFloat(p.pct_confirmado||0),100);
      },0)/itensR.length);
      var hasPend=itensR.some(function(i){var p=mProg.find(function(x){return x.id===i.id;})||{realizado_pendente:0};return parseFloat(p.realizado_pendente||0)>0;});
      // SVG ring
      var sz=68,rv2=sz/2-6,circ=2*Math.PI*rv2,offset=circ*(1-Math.min(mediaR,100)/100);
      var ring='<svg width="'+sz+'" height="'+sz+'" style="transform:rotate(-90deg);display:block">'
        +'<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+rv2+'" fill="none" stroke="#F3F4F6" stroke-width="6"/>'
        +'<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+rv2+'" fill="none" stroke="'+cor+'" stroke-width="6" stroke-linecap="round"'
        +' stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'" style="transition:stroke-dashoffset .8s ease"/>'
        +'</svg>';
      // Dot grid — cada indicador = ponto colorido por status
      var dots=itensR.map(function(i){
        var p=mProg.find(function(x){return x.id===i.id;})||{pct_confirmado:0};
        var pct=parseFloat(p.pct_confirmado||0);
        var dc=pct>=80?'#10B981':pct>=40?'#F59E0B':'#EF4444';
        return '<span title="'+i.indicador+' — '+Math.round(pct)+'%" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+dc+';margin:2px;cursor:default"></span>';
      }).join('');
      return '<div style="background:#fff;border:1px solid #F3F4F6;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px">'
        +'<div style="display:flex;align-items:center;gap:7px">'
        +'<span style="font-family:var(--font-mono);font-size:11px;font-weight:700;background:'+cor+';color:#fff;padding:2px 9px;border-radius:4px">R'+r+'</span>'
        +(hasPend?'<span style="font-size:9px;background:#FEF3C7;color:#92400E;padding:2px 6px;border-radius:3px;font-weight:600">⏳ pendente</span>':'')
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:12px">'
        +'<div style="position:relative;width:'+sz+'px;height:'+sz+'px;flex-shrink:0">'
        +ring
        +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
        +'<span style="font-size:13px;font-weight:800;color:'+cor+';font-family:var(--font-mono);line-height:1">'+mediaR+'%</span>'
        +'</div></div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="height:8px;background:#F3F4F6;border-radius:4px;overflow:hidden;margin-bottom:8px">'
        +'<div style="height:100%;background:'+cor+';width:'+mediaR+'%;border-radius:4px;transition:width .6s ease"></div>'
        +'</div>'
        +'<div style="font-size:10px;color:#6B7280;margin-bottom:6px">'+itensR.length+' indicador'+(itensR.length!==1?'es':'')+'</div>'
        +'<div style="line-height:1.4">'+dots+'</div>'
        +'</div></div></div>';
    }).join('');

    // KPIs com mini cards + cor semântica no progresso
    var corMedia=mediaGeral>=70?'#059669':mediaGeral>=40?'#D97706':'#DC2626';
    h='<div class="ch" style="margin-bottom:14px;border-color:#D1FAE5;background:linear-gradient(135deg,#F0FDF4 0%,#fff 100%)">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">'
      +'<div><div class="ch-tit" style="color:#1D9E75">◎ Matriz de Resultados — Progresso</div>'
      +'<div class="ch-sub" style="margin-bottom:0">Contribuições confirmadas pelos técnicos</div></div>'
      +'<a href="matriz.html" style="font-size:11px;color:#1D9E75;font-weight:600;text-decoration:none;padding:5px 12px;border:1px solid #A7F3D0;border-radius:6px;white-space:nowrap">Ver completo →</a>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:16px">'
      +'<div style="background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px;text-align:center">'
      +'<div style="font-size:22px;font-weight:800;color:'+corMedia+';font-family:var(--font-mono);line-height:1.1">'+mediaGeral+'%</div>'
      +'<div style="font-size:10px;color:#6B7280;margin-top:3px">progresso médio</div></div>'
      +'<div style="background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px;text-align:center">'
      +'<div style="font-size:22px;font-weight:800;color:#059669;font-family:var(--font-mono);line-height:1.1">'+atingidos+'</div>'
      +'<div style="font-size:10px;color:#6B7280;margin-top:3px">metas atingidas</div></div>'
      +'<div style="background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px;text-align:center">'
      +'<div style="font-size:22px;font-weight:800;color:'+(emRisco>0?'#DC2626':'#059669')+';font-family:var(--font-mono);line-height:1.1">'+emRisco+'</div>'
      +'<div style="font-size:10px;color:#6B7280;margin-top:3px">em risco (&lt;40%)</div></div>'
      +(pendConf>0
        ?'<div style="background:#fff;border:1px solid #FEF3C7;border-radius:8px;padding:10px 12px;text-align:center">'
        +'<div style="font-size:22px;font-weight:800;color:#D97706;font-family:var(--font-mono);line-height:1.1">'+Math.round(pendConf)+'</div>'
        +'<div style="font-size:10px;color:#6B7280;margin-top:3px">aguardam conf.</div></div>':''
      )
      +'<div style="background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px;text-align:center">'
      +'<div style="font-size:22px;font-weight:800;color:#374151;font-family:var(--font-mono);line-height:1.1">'+totalInd+'</div>'
      +'<div style="font-size:10px;color:#6B7280;margin-top:3px">indicadores</div></div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">'+resBlocos+'</div>'
      +'</div>';
  }

  h+='<div class="kpi-row">';
  h+='<div class="kpi-card kv"><div class="kpi-lbl">Metas com progresso</div><div class="kpi-val" style="color:var(--sucesso)">'+metasProg+' / '+comMetaR.length+'</div><div class="kpi-sub">indicadores com progresso &gt; 0</div><div class="kpi-bar"><div class="kpi-fill" style="width:'+D_P(metasProg,comMetaR.length)+'%;background:var(--sucesso)"></div></div></div>';
  h+='<div class="kpi-card ko"><div class="kpi-lbl">Financeiro vs metas</div><div class="kpi-val" style="color:var(--ouro)">'+(orc>0?pago/orc*100:0).toFixed(1)+'%</div><div class="kpi-sub">pago vs. orçamento total</div><div class="kpi-bar"><div class="kpi-fill" style="width:'+(orc>0?Math.min(pago/orc*100,100):0)+'%;background:var(--ouro)"></div></div></div>';
  h+='<div class="kpi-card ke"><div class="kpi-lbl">Indicadores em risco</div><div class="kpi-val" style="color:var(--erro)">'+emRiscoGlobal+'</div><div class="kpi-sub">com progresso &lt; 40%</div></div>';
  h+='<div class="kpi-card ka"><div class="kpi-lbl">Resultados ativos</div><div class="kpi-val" style="color:var(--azul-medio)">'+rks.length+'</div><div class="kpi-sub">com atividades e orçamento</div></div>';
  h+='</div>';

  // Gráfico radar + scatter por resultado
  h+='<div class="g2" style="margin-bottom:14px">';
  h+='<div class="ch"><div class="ch-tit">Orçamento × comprometido × pago por resultado</div><div class="ch-sub">Comparativo entre resultados</div><div style="position:relative;height:260px"><canvas id="ch-res-grouped"></canvas></div></div>';
  h+='<div class="ch"><div class="ch-tit">Score de execução por resultado</div><div class="ch-sub">% comprometido vs % pago</div><div style="position:relative;height:260px"><canvas id="ch-res-radar"></canvas></div></div>';
  h+='</div>';

  // Indicadores por resultado
  rks.forEach(function(k){
    var rv=rm[k];
    var tot=Math.max(rv.orc,1);
    var pP=rv.pago/tot*100, pC=(rv.comp-rv.pago)/tot*100;
    h+='<div class="ch" style="margin-bottom:14px">';
    h+='<div class="ch-tit">'+k+' — '+rv.nome.substring(0,60)+'</div>';
    h+='<div style="display:flex;gap:12px;font-size:11px;margin-bottom:10px"><span style="color:var(--sucesso)">'+D_USD(rv.pago)+' pago</span><span style="color:var(--ouro)">'+D_USD(rv.comp)+' comprom.</span><span style="color:var(--cinza-500)">'+D_USD(rv.orc)+' orçamento</span></div>';
    h+='<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--cinza-100);margin-bottom:12px">';
    if(pP>0.5)h+='<div style="width:'+Math.min(pP,100)+'%;background:#059669"></div>';
    if(pC>0.5)h+='<div style="width:'+Math.min(pC,100)+'%;background:#D97706"></div>';
    h+='<div style="flex:1;background:var(--cinza-100)"></div></div>';
    rv.ind.slice(0,5).forEach(function(i){
      var pg=D.matrizProg.find(function(x){return x.id===i.id;})||{pct_confirmado:0,realizado_confirmado:0};
      var pct=Math.min(parseFloat(pg.pct_confirmado||0),100);
      var cor=pct>=75?'var(--sucesso)':pct>=30?'var(--aviso)':'var(--erro)';
      h+='<div class="ind-row"><div class="ind-dot" style="background:'+cor+'"></div><div class="ind-nome">'+(i.indicador||'—')+'</div><div class="ind-meta">meta '+(i.meta_numerica||'—')+'</div><div class="ind-val" style="color:'+cor+'">'+pct.toFixed(0)+'%</div><div class="ind-prog"><div class="ind-bar"><div class="ind-fill" style="width:'+pct+'%;background:'+cor+'"></div></div><div class="ind-pct">'+Math.round(pct)+'%</div></div></div>';
    });
    if(rv.ind.length>5)h+='<div style="font-size:10px;color:var(--cinza-500);text-align:center;padding-top:6px">+ '+(rv.ind.length-5)+' indicadores</div>';
    h+='</div>';
  });

  if(rks.length===0)h+='<div class="empty-state"><div class="empty-state-icon">◎</div><div class="empty-state-msg">Nenhum resultado com atividades cadastradas.</div></div>';
  document.getElementById('pane-resultados').innerHTML=h;

  setTimeout(function(){
    // Grouped bar por resultado
    mkChart('ch-res-grouped',{type:'bar',data:{labels:rks,datasets:[
      {label:'Orçamento',data:rks.map(function(k){return rm[k].orc;}),backgroundColor:'#BFDBFE',borderRadius:3},
      {label:'Comprometido',data:rks.map(function(k){return rm[k].comp;}),backgroundColor:'#FCD34D',borderRadius:3},
      {label:'Pago',data:rks.map(function(k){return rm[k].pago;}),backgroundColor:'#6EE7B7',borderRadius:3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}}},scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},callback:function(v){return 'U$'+Math.round(v/1000)+'K';}}}}}});

    // Radar score por resultado
    mkChart('ch-res-radar',{type:'radar',data:{labels:rks,datasets:[
      {label:'% Comprometido',data:rks.map(function(k){var r=rm[k];return r.orc>0?Math.min(r.comp/r.orc*100,150):0;}),borderColor:'#D97706',backgroundColor:'rgba(217,119,6,.15)',pointBackgroundColor:'#D97706',pointRadius:4},
      {label:'% Pago',data:rks.map(function(k){var r=rm[k];return r.orc>0?r.pago/r.orc*100:0;}),borderColor:'#059669',backgroundColor:'rgba(5,150,105,.15)',pointBackgroundColor:'#059669',pointRadius:4},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}},scales:{r:{suggestedMin:0,suggestedMax:100,grid:{color:'rgba(0,0,0,.06)'},ticks:{font:{size:9},color:'#9CA3AF',stepSize:25},pointLabels:{font:{size:11}}}}}});
  },50);
}

// ─────────────────────────────────────────────────────────
// GUIA 4 — EXECUÇÃO FINANCEIRA (com filtros)
// ─────────────────────────────────────────────────────────
function renderExecucao(){
  var fornsOpts=D.forns.map(function(f){return '<option value="'+f.id+'">'+f.nome+'</option>';}).join('');
  var contrOpts=D.contr.map(function(c){return '<option value="'+c.id+'">'+c.numero+'</option>';}).join('');
  var atvOpts=D.atv.map(function(a){return '<option value="'+a.id+'">'+a.codigo+' — '+a.nome_pt.substring(0,40)+'</option>';}).join('');

  // Rosca total do projeto (usa D.sal, independente de filtros)
  var _orc=D.sal.reduce(function(s,a){return s+parseFloat(a.orcamento_usd||0);},0);
  var _comp=D.sal.reduce(function(s,a){return s+parseFloat(a.comprometido_usd||0);},0);
  var _pago=D.sal.reduce(function(s,a){return s+parseFloat(a.pago_usd||0);},0);
  var _apagar=D.sal.reduce(function(s,a){return s+parseFloat(a.a_pagar_usd||0);},0);
  var _tdr=Math.max(0,_comp-_pago-_apagar);
  var _livre=Math.max(0,_orc-_comp);
  var _pctPago=_orc>0?(_pago/_orc*100):0;

  var _brl_contratado=D.contr.reduce(function(s,c){return s+parseFloat(c.valor_total_brl||0);},0);
  var _brl_pago=D.lanc.filter(function(l){return l.situacao==='pago';}).reduce(function(s,l){return s+parseFloat(l.valor_brl||0);},0);
  var _brl_apagar=D.lanc.filter(function(l){return l.situacao==='a_pagar';}).reduce(function(s,l){return s+parseFloat(l.valor_brl||0);},0);
  var _brl_saldo=Math.max(0,_brl_contratado-_brl_pago-_brl_apagar);
  var _brl_pctPago=_brl_contratado>0?(_brl_pago/_brl_contratado*100):0;

  var h='<div style="display:flex;gap:14px;margin-bottom:14px;align-items:stretch">';
  // --- Coluna esquerda: dois donuts empilhados, mais estreitos ---
  h+='<div style="display:flex;flex-direction:column;gap:10px;flex:0 0 300px;min-width:0">';
  h+='<div class="ch" style="flex:1">';
  h+='<div class="ch-tit" style="font-size:12px">Execução financeira total</div>';
  h+='<div class="ch-sub">USD — independente de filtros</div>';
  h+='<div style="display:flex;align-items:center;gap:12px;height:140px;padding:4px 0">';
  h+='<div style="position:relative;flex:0 0 120px;height:100%"><canvas id="ch-proj-donut"></canvas></div>';
  h+='<div id="leg-proj-donut" style="flex:1;min-width:0"></div>';
  h+='</div></div>';
  h+='<div class="ch" style="flex:1">';
  h+='<div class="ch-tit" style="font-size:12px">Contratos — BRL</div>';
  h+='<div class="ch-sub">Contratado × Pago × A pagar</div>';
  h+='<div style="display:flex;align-items:center;gap:12px;height:140px;padding:4px 0">';
  h+='<div style="position:relative;flex:0 0 120px;height:100%"><canvas id="ch-contr-donut"></canvas></div>';
  h+='<div id="leg-contr-donut" style="flex:1;min-width:0"></div>';
  h+='</div></div>';
  h+='</div>';
  // --- Coluna direita: gráfico acumulado ---
  h+='<div class="ch" style="flex:1;min-width:0;display:flex;flex-direction:column">';
  h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px">';
  h+='<div><div class="ch-tit">Acumulado de pagamentos por mês</div><div class="ch-sub">Barras mensais (Pago · A pagar) + curva de acumulado — valores em BRL</div></div>';
  h+='<div id="acum-btns" style="display:flex;gap:4px;flex-wrap:wrap"></div>';
  h+='</div>';
  h+='<div class="leg" style="margin-bottom:6px">';
  h+='<div class="leg-i"><div class="leg-sq" style="background:#059669"></div>Pago</div>';
  h+='<div class="leg-i"><div class="leg-sq" style="background:#F59E0B"></div>A pagar</div>';
  h+='<div class="leg-i"><div class="leg-sq" style="background:rgba(59,130,246,.25);border:1px solid #3B82F6"></div>Acumulado</div>';
  h+='</div>';
  h+='<div id="acum-scroll" style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:6px;flex:1">';
  h+='<div id="acum-canvas-wrap" style="position:relative;height:100%;min-height:240px;min-width:100%"><canvas id="ch-acumulado-mensal"></canvas></div>';
  h+='</div>';
  h+='</div>';
  h+='</div>';

  h+='<div class="fin-filters">';
  h+='<label>Data de:</label><input type="date" id="fil-dt-ini">';
  h+='<label>até:</label><input type="date" id="fil-dt-fim">';
  h+='<label>Situação:</label><select id="fil-sit"><option value="">Todas</option><option value="pago">Pago</option><option value="a_pagar">A pagar</option><option value="cancelado">Cancelado</option></select>';
  h+='<label>Fornecedor:</label><select id="fil-forn"><option value="">Todos</option>'+fornsOpts+'</select>';
  h+='<label>Contrato:</label><select id="fil-contr"><option value="">Todos</option>'+contrOpts+'</select>';
  h+='<label>Atividade:</label><select id="fil-atv" style="min-width:200px"><option value="">Todas</option>'+atvOpts+'</select>';
  h+='<button class="btn-filtrar" onclick="aplicarFiltros()">Filtrar</button>';
  h+='<button class="btn-limpar" onclick="limparFiltros()">Limpar</button>';
  h+='</div>';

  // KPIs dinâmicos
  h+='<div id="fin-kpis" class="kpi-row" style="grid-template-columns:repeat(5,1fr)"></div>';

  // Gráficos filtráveis
  h+='<div class="g2" style="margin-bottom:14px">';
  h+='<div class="ch"><div class="ch-tit">Distribuição por situação</div><div class="ch-sub">Valor total por status</div><div style="display:flex;align-items:center;gap:14px;height:180px"><div style="position:relative;flex:1;height:100%"><canvas id="ch-fin-donut"></canvas></div><div id="leg-fin-donut" style="font-size:11px"></div></div></div>';
  h+='<div class="ch"><div class="ch-tit">Valor por atividade</div><div class="ch-sub">Lançamentos filtrados</div><div style="position:relative;height:180px"><canvas id="ch-fin-atv"></canvas></div></div>';
  h+='</div>';
  h+='<div class="ch" style="margin-bottom:14px"><div class="ch-tit">Lançamentos por fornecedor</div><div class="ch-sub">Distribuição do valor pago</div><div style="position:relative;height:200px"><canvas id="ch-fin-forn"></canvas></div></div>';

  // Tabela
  h+='<div class="ch"><div class="ch-tit">Lançamentos financeiros</div><div id="fin-tabela-wrap"><div class="empty-state"><div class="spinner"></div></div></div></div>';
  document.getElementById('pane-execucao').innerHTML=h;

  // Renderizar rosca do projeto
  setTimeout(function(){
    var centerPlugin={
      id:'projCenter',
      afterDraw:function(chart){
        var ctx=chart.ctx;
        var cx=(chart.chartArea.left+chart.chartArea.right)/2;
        var cy=(chart.chartArea.top+chart.chartArea.bottom)/2;
        ctx.save();
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.font='bold 26px Inter,sans-serif';
        ctx.fillStyle='#111827';
        ctx.fillText(_pctPago.toFixed(1)+'%',cx,cy-10);
        ctx.font='12px Inter,sans-serif';

        ctx.fillText('pago',cx,cy+14);
        ctx.restore();
      }

    mkChart('ch-proj-donut',{
      type:'doughnut',
      plugins:[centerPlugin],

        }]

      }
    });
    var legEl=document.getElementById('leg-proj-donut');
    if(legEl){
      var items=[
        ['Pago','#059669',_pago],
        ['A pagar','#F59E0B',_apagar],
        ['Comprometido (TDR)','#D97706',_tdr],
        ['Saldo livre','#E5E7EB',_livre]
      ];
      legEl.innerHTML=items.map(function(x){
        var pct=_orc>0?(x[2]/_orc*100):0;
        return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+

          '<div style="font-size:11px;color:#6B7280">'+pct.toFixed(1)+'% do orçamento total</div></div>'+
          '</div>';
      }).join('');
    }

    // Rosca contratos BRL
    var contrCenterPlugin={
      id:'contrCenter',
      afterDraw:function(chart){
        var ctx=chart.ctx;
        var cx=(chart.chartArea.left+chart.chartArea.right)/2;
        var cy=(chart.chartArea.top+chart.chartArea.bottom)/2;
        ctx.save();
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.font='bold 22px Inter,sans-serif';
        ctx.fillStyle='#111827';
        ctx.fillText(_brl_pctPago.toFixed(1)+'%',cx,cy-10);
        ctx.font='11px Inter,sans-serif';
        ctx.fillStyle='#6B7280';
        ctx.fillText('pago',cx,cy+12);
        ctx.restore();
      }
    };
    var contrSliceLabels={
      id:'contrSliceLabels',
      afterDraw:function(chart){
        var ctx=chart.ctx;
        var meta=chart.getDatasetMeta(0);
        var data=chart.data.datasets[0].data;
        var labels=chart.data.labels;
        var cors=['#fff','#fff','#6B7280'];
        meta.data.forEach(function(arc,i){
          var total=data.reduce(function(s,v){return s+(v||0);},0);
          if(!data[i]||total===0)return;
          var pct=data[i]/total*100;
          if(pct<5)return;
          var angle=(arc.startAngle+arc.endAngle)/2;
          var r=(arc.outerRadius+arc.innerRadius)/2;
          var x=arc.x+Math.cos(angle)*r;
          var y=arc.y+Math.sin(angle)*r;
          ctx.save();
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          ctx.font='bold 10px Inter,sans-serif';
          ctx.fillStyle=cors[i]||'#fff';
          ctx.fillText(labels[i],x,y-7);
          ctx.font='9px Inter,sans-serif';
          ctx.fillText(pct.toFixed(1)+'%',x,y+6);
          ctx.restore();
        });
      }
    };
    mkChart('ch-contr-donut',{
      type:'doughnut',
      plugins:[contrCenterPlugin,contrSliceLabels],
      data:{
        labels:['Pago','A pagar','Saldo'],
        datasets:[{
          data:[_brl_pago,_brl_apagar,_brl_saldo],
          backgroundColor:['#059669','#F59E0B','#E5E7EB'],
          borderWidth:3,
          borderColor:'#fff'
        }]
      },
      options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){var v=ctx.raw;var pct=_brl_contratado>0?(v/_brl_contratado*100):0;return ' '+formatBRL(v)+' ('+pct.toFixed(1)+'%)';}}}}}
    });
    var legContrEl=document.getElementById('leg-contr-donut');
    if(legContrEl){
      var contrItems=[
        ['Total contratado','#2563EB',_brl_contratado],
        ['Pago','#059669',_brl_pago],
        ['A pagar','#F59E0B',_brl_apagar],
        ['Saldo','#E5E7EB',_brl_saldo]
      ];
      legContrEl.innerHTML=contrItems.map(function(x){
        var pct=_brl_contratado>0?(x[2]/_brl_contratado*100):0;
        return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
          '<div style="width:14px;height:14px;border-radius:3px;background:'+x[1]+';flex-shrink:0;border:1px solid rgba(0,0,0,.08)"></div>'+
          '<div><div style="font-size:12px;color:#374151;font-weight:500">'+x[0]+'</div>'+
          '<div style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:#111827">'+formatBRL(x[2])+'</div>'+
          '<div style="font-size:11px;color:#6B7280">'+pct.toFixed(1)+'% do total contratado</div></div>'+
          '</div>';
      }).join('');
    }
  },50);

  renderFinTabela();
}

function _acumPopularBtns(){

function renderAcumuladoMensal(modo){
  var lanc=D.lancFilt||D.lanc;
  var nmMeses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var labels=[],pagoArr=[],apagarArr=[];

  if(modo==='todos'){
    // Coletar todos os meses presentes nos dados (ano+mês únicos, ordenados)
    var mapa={};
    lanc.forEach(function(l){
      var dt=l.dt_vencimento||l.dt_pagamento;
      if(!dt)return;
      var d=new Date(dt+'T00:00:00');
      var key=d.getFullYear()*100+d.getMonth(); // ex: 202400 = Jan/2024
      if(!mapa[key])mapa[key]={pago:0,apagar:0,ano:d.getFullYear(),mes:d.getMonth()};
      var v=parseFloat(l.valor_brl||0);
      if(l.situacao==='pago')mapa[key].pago+=v;
      else if(l.situacao==='a_pagar')mapa[key].apagar+=v;
    });
    // Preencher todos os meses do intervalo (sem lacunas)
    var keys=Object.keys(mapa).map(Number).sort();
    if(keys.length>0){
      var kMin=keys[0],kMax=keys[keys.length-1];
      var cur=kMin;
      while(cur<=kMax){
        var ano=Math.floor(cur/100),mes=cur%100;
        labels.push(nmMeses[mes]+'/'+String(ano).slice(2));
        var entry=mapa[cur]||{pago:0,apagar:0};
        pagoArr.push(entry.pago);
        apagarArr.push(entry.apagar);
        // avançar um mês
        mes++;if(mes>11){mes=0;ano++;}
        cur=ano*100+mes;
      }
    }
  } else {
    var ano=parseInt(modo,10);
    for(var i=0;i<12;i++){pagoArr.push(0);apagarArr.push(0);}
    lanc.forEach(function(l){
      var dt=l.dt_vencimento||l.dt_pagamento;
      if(!dt)return;
      var d=new Date(dt+'T00:00:00');
      if(d.getFullYear()!==ano)return;
      var m=d.getMonth();
      var v=parseFloat(l.valor_brl||0);
      if(l.situacao==='pago')pagoArr[m]+=v;
      else if(l.situacao==='a_pagar')apagarArr[m]+=v;
    });
    labels=nmMeses.slice();
  }

  // Acumulado progressivo
  var acum=[],soma=0;
  for(var j=0;j<labels.length;j++){soma+=pagoArr[j]+apagarArr[j];acum.push(soma);}

  // Largura dinâmica: 65px por barra no modo todos, responsivo no modo ano
  var wrap=document.getElementById('acum-canvas-wrap');
  var scroll=document.getElementById('acum-scroll');
  var nCols=labels.length;
  var minW=modo==='todos'?Math.max(nCols*68,scroll?scroll.clientWidth:800):null;
  if(wrap){
    if(minW){wrap.style.width=minW+'px';}
    else{wrap.style.width='';}
  }

  destroyChart('ch-acumulado-mensal');
  var el=document.getElementById('ch-acumulado-mensal');
  if(!el)return;
  CHARTS['ch-acumulado-mensal']=new Chart(el,{
    type:'bar',
    data:{
      labels:labels,
      datasets:[
        {label:'Pago',data:pagoArr,backgroundColor:'rgba(5,150,105,.85)',borderRadius:4,borderSkipped:false,order:2},
        {label:'A pagar',data:apagarArr,backgroundColor:'rgba(245,158,11,.75)',borderRadius:4,borderSkipped:false,order:2},
        {label:'Acumulado',data:acum,type:'line',yAxisID:'yAcum',borderColor:'#3B82F6',backgroundColor:'rgba(59,130,246,.1)',fill:true,tension:0.4,pointRadius:nCols>24?2:4,pointBackgroundColor:'#fff',pointBorderColor:'#3B82F6',pointBorderWidth:2,borderWidth:2.5,order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(ctx){return ' '+ctx.dataset.label+': '+formatBRL(ctx.raw);}}}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:nCols>24?9:11},color:'#6B7280',maxRotation:45,minRotation:0}},
        y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#9CA3AF',callback:function(v){return 'R$'+Math.round(v/1000)+'K';}}},
        yAcum:{position:'right',grid:{display:false},ticks:{font:{size:10},color:'#3B82F6',callback:function(v){return 'R$'+Math.round(v/1000)+'K';}}}
      }
    }
  });
}
window.renderAcumuladoMensal=renderAcumuladoMensal;

function aplicarFiltros(){
  var dtIni=document.getElementById('fil-dt-ini').value;
  var dtFim=document.getElementById('fil-dt-fim').value;
  var sit=document.getElementById('fil-sit').value;
  var forn=document.getElementById('fil-forn').value;
  var contr=document.getElementById('fil-contr').value;
  var atv=document.getElementById('fil-atv').value;
  D.lancFilt=D.lanc.filter(function(l){
    if(sit&&l.situacao!==sit)return false;
    if(forn&&(!l.fornecedores||l.fornecedores.id!==forn))return false;
    if(contr&&(!l.contratos||l.contratos.id!==contr))return false;
    if(atv&&(!l.atividades||l.atividades.id!==atv))return false;
    if(dtIni&&l.dt_vencimento&&l.dt_vencimento<dtIni)return false;
    if(dtFim&&l.dt_vencimento&&l.dt_vencimento>dtFim)return false;
    return true;
  });
  renderFinTabela();
}
window.aplicarFiltros=aplicarFiltros;

function limparFiltros(){
  ['fil-dt-ini','fil-dt-fim','fil-sit','fil-forn','fil-contr','fil-atv'].forEach(function(id){
    var el=document.getElementById(id); if(el)el.value='';
  });
  D.lancFilt=D.lanc.slice();
  renderFinTabela();
}
window.limparFiltros=limparFiltros;

function renderFinTabela(){
  var lanc=D.lancFilt||D.lanc;
  var totBRL=lanc.reduce(function(s,l){return s+parseFloat(l.valor_brl||0);},0);
  var totUSD=lanc.reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var pagoUSD=lanc.filter(function(l){return l.situacao==='pago';}).reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);
  var apagarUSD=lanc.filter(function(l){return l.situacao==='a_pagar';}).reduce(function(s,l){return s+parseFloat(l.valor_usd||0);},0);

  // Atualizar KPIs
  var kEl=document.getElementById('fin-kpis');
  if(kEl){
    kEl.innerHTML=
      '<div class="kpi-card kv"><div class="kpi-lbl">Total (BRL)</div><div class="kpi-val" style="font-size:16px">'+D_BRL(totBRL)+'</div><div class="kpi-sub">'+lanc.length+' lançamento(s)</div></div>'+
      '<div class="kpi-card kv"><div class="kpi-lbl">Total (USD)</div><div class="kpi-val" style="font-size:16px">'+D_USD(totUSD)+'</div></div>'+
      '<div class="kpi-card kv"><div class="kpi-lbl">Pago</div><div class="kpi-val" style="font-size:16px;color:var(--sucesso)">'+D_USD(pagoUSD)+'</div></div>'+
      '<div class="kpi-card ko"><div class="kpi-lbl">A pagar</div><div class="kpi-val" style="font-size:16px;color:var(--ouro)">'+D_USD(apagarUSD)+'</div></div>'+
      '<div class="kpi-card ka"><div class="kpi-lbl">Fornecedores</div><div class="kpi-val" style="font-size:16px;color:var(--azul-medio)">'+(new Set(lanc.filter(function(l){return l.fornecedores;}).map(function(l){return l.fornecedores.id;}))).size+'</div></div>';
  }

  // Tabela
  var tbody='';
  if(lanc.length===0){
    tbody='<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--cinza-500)">Nenhum lançamento encontrado para os filtros selecionados.</td></tr>';
  } else {
    lanc.forEach(function(l){
      var sitCls=l.situacao==='pago'?'sit-pago':l.situacao==='a_pagar'?'sit-apagar':'sit-cancelado';
      var sitNm=l.situacao==='pago'?'Pago':l.situacao==='a_pagar'?'A pagar':'Cancelado';
      tbody+='<tr>';
      tbody+='<td style="font-family:var(--font-mono);font-size:11px;font-weight:500">'+(l.atividades&&l.atividades.codigo||'—')+'</td>';
      tbody+='<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+(l.descricao||'')+'">'+(l.descricao||'—')+'</td>';
      tbody+='<td>'+(l.fornecedores&&l.fornecedores.nome||'—')+'</td>';
      tbody+='<td style="font-family:var(--font-mono);font-size:11px">'+(l.numero_nf||'—')+'</td>';
      tbody+='<td>'+(l.elemento_despesa||'—')+'</td>';
      tbody+='<td style="font-family:var(--font-mono);text-align:right">'+D_BRL(l.valor_brl)+'</td>';
      tbody+='<td style="font-family:var(--font-mono);text-align:right;font-weight:600">'+D_USD(l.valor_usd)+'</td>';
      tbody+='<td style="white-space:nowrap">'+D_DATE(l.dt_vencimento)+'</td>';
      tbody+='<td><span class="'+sitCls+'">'+sitNm+'</span></td>';
      tbody+='</tr>';
    });
  }
  var wrap=document.getElementById('fin-tabela-wrap');
  if(wrap) wrap.innerHTML='<div style="overflow-x:auto"><table class="fin-tbl"><thead><tr><th>Atividade</th><th>Descrição</th><th>Fornecedor</th><th>NF</th><th>Elemento</th><th>Valor BRL</th><th>Valor USD</th><th>Vencimento</th><th>Situação</th></tr></thead><tbody>'+tbody+'</tbody></table></div><div class="fin-resumo"><div class="fin-res-item"><span class="fin-res-lbl">Total BRL</span><span class="fin-res-val">'+D_BRL(totBRL)+'</span></div><div class="fin-res-item"><span class="fin-res-lbl">Total USD</span><span class="fin-res-val">'+D_USD(totUSD)+'</span></div><div class="fin-res-item"><span class="fin-res-lbl">Registros</span><span class="fin-res-val">'+lanc.length+'</span></div></div>';

  // Gráficos
  setTimeout(function(){
    // Donut situação
    var sitMap={pago:0,a_pagar:0,cancelado:0};
    lanc.forEach(function(l){if(sitMap[l.situacao]!==undefined)sitMap[l.situacao]+=parseFloat(l.valor_usd||0);});
    destroyChart('ch-fin-donut');
    mkChart('ch-fin-donut',{type:'doughnut',data:{labels:['Pago','A pagar','Cancelado'],datasets:[{data:[sitMap.pago,sitMap.a_pagar,sitMap.cancelado],backgroundColor:['#059669','#D97706','#EF4444'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false}}}});
    var legEl=document.getElementById('leg-fin-donut');
    if(legEl)legEl.innerHTML=[['Pago','#059669',sitMap.pago],['A pagar','#D97706',sitMap.a_pagar],['Cancelado','#EF4444',sitMap.cancelado]].map(function(x){return '<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px"><div style="width:10px;height:10px;border-radius:2px;background:'+x[1]+';flex-shrink:0"></div><span>'+x[0]+'<br><strong style="font-family:var(--font-mono);font-size:11px">'+D_USD(x[2])+'</strong></span></div>';}).join('');

    // Barras por atividade
    var atvMap={};
    lanc.forEach(function(l){var k=l.atividades&&l.atividades.codigo||'Sem atividade';atvMap[k]=(atvMap[k]||0)+parseFloat(l.valor_usd||0);});
    var atvKs=Object.keys(atvMap).sort(function(a,b){return atvMap[b]-atvMap[a];}).slice(0,8);
    destroyChart('ch-fin-atv');
    mkChart('ch-fin-atv',{type:'bar',data:{labels:atvKs,datasets:[{data:atvKs.map(function(k){return atvMap[k];}),backgroundColor:'#93C5FD',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},callback:function(v){return 'U$'+Math.round(v/1000)+'K';}}}}}});

    // Barras por fornecedor
    var fornMap={};
    lanc.forEach(function(l){var k=l.fornecedores&&l.fornecedores.nome||'Sem fornecedor';fornMap[k]=(fornMap[k]||0)+parseFloat(l.valor_usd||0);});
    var fornKs=Object.keys(fornMap).sort(function(a,b){return fornMap[b]-fornMap[a];}).slice(0,8);
    destroyChart('ch-fin-forn');
    mkChart('ch-fin-forn',{type:'bar',data:{labels:fornKs,datasets:[{data:fornKs.map(function(k){return fornMap[k];}),backgroundColor:'#6EE7B7',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},callback:function(v){return 'U$'+Math.round(v/1000)+'K';}}},y:{grid:{display:false},ticks:{font:{size:11},color:'#374151'}}}}});

    // Gráfico acumulado mensal — popular botões e renderizar
    _acumPopularBtns();
  },50);
}
