<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Diagnóstico Socioambiental</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
/* Mesa do Diagnóstico (mínima — Fase 3 traz validação, exportação e indicadores) */
.dg-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.dg-num{background:var(--cinza-50,#F9FAFB);border:1px solid var(--borda,#E5E7EB);border-radius:10px;padding:12px 14px}
.dg-num b{display:block;font-size:24px;line-height:1.2}
.dg-num span{font-size:12px;color:var(--cinza-500,#6B7280)}
.dg-treino{border-left:4px solid #C2410C;background:#FFF7ED}
.dg-treino h3{color:#9A3412}
.dg-tab{width:100%;border-collapse:collapse;font-size:13px}
.dg-tab th,.dg-tab td{padding:6px 8px;border-bottom:1px solid var(--borda,#E5E7EB);text-align:left}
.fade-in > #dg-geral > .card, #dg-admin .card{padding:16px 20px}
.dg-abas{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--borda,#E5E7EB)}
.dg-aba{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--cinza-500,#6B7280);cursor:pointer}
.dg-aba.ativa{color:var(--verde-medio,#2D6A4F);border-bottom-color:var(--verde-medio,#2D6A4F)}
.dg-linha{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--borda,#E5E7EB);font-size:13px}
.dg-inativo{font-size:10px;background:var(--cinza-100,#F3F4F6);color:var(--cinza-500,#6B7280);padding:1px 7px;border-radius:99px;font-weight:600;vertical-align:middle}
.dg-tab td.mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--cinza-500,#6B7280)}
/* ── Aba Validação (js/diagnostico-validacao.js) ── */
.dgv-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dgv-chip{font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--borda,#E5E7EB);background:#fff;color:var(--cinza-700,#374151);cursor:pointer}
.dgv-chip.on{background:var(--verde-medio,#2D6A4F);color:#fff;border-color:var(--verde-medio,#2D6A4F)}
.dgv-chip b{margin-left:5px;opacity:.8}
.dgv-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.dgv-filtros label{font-size:11px;color:var(--cinza-500,#6B7280)}
.dgv-filtros select,.dgv-filtros input:not([type=checkbox]){display:block;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--borda,#E5E7EB);border-radius:8px;background:#fff;min-width:130px}
.dgv-filtros .dgv-check{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--cinza-700,#374151);padding-bottom:6px}
.dgv-tab{width:100%;border-collapse:collapse;font-size:13px}
.dgv-tab th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza-500,#6B7280);text-align:left;padding:8px;border-bottom:1px solid var(--borda,#E5E7EB)}
.dgv-tab td{padding:10px 8px;border-bottom:1px solid var(--borda,#E5E7EB);vertical-align:middle}
.dgv-tab td small{color:var(--cinza-500,#6B7280)}
.dgv-tab tbody tr{cursor:pointer}.dgv-tab tbody tr:hover td,.dgv-tab tbody tr:focus td{background:#F0FDF4}
.dgv-cod{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}
.dgv-st{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.dgv-st-enviada{background:#EFF6FF;color:#1D4ED8}.dgv-st-devolvida{background:#FFFBEB;color:#B45309}
.dgv-st-validada{background:#ECFDF5;color:#047857}.dgv-st-descartada{background:#F3F4F6;color:#6B7280}
.dgv-al{font-size:11px;font-weight:700;color:#B45309}.dgv-al.ok{color:#047857}
.dgv-treino{font-size:10px;font-weight:700;background:#FFEDD5;color:#C2410C;padding:1px 6px;border-radius:99px;margin-left:6px;vertical-align:middle}
.dgv-ov{position:fixed;inset:0;background:rgba(8,20,14,.45);display:flex;justify-content:flex-end;z-index:1000}
.dgv-ov[hidden]{display:none}
.dgv-gaveta{width:min(760px,100%);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.dgv-g-topo{padding:16px 20px;border-bottom:1px solid var(--borda,#E5E7EB);display:flex;gap:12px;align-items:flex-start}
.dgv-g-topo h2{margin:0;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dgv-g-topo p{margin:4px 0 0;font-size:12px;color:var(--cinza-500,#6B7280)}
.dgv-g-corpo{flex:1;overflow:auto;padding:16px 20px}
.dgv-g-acoes{padding:12px 20px;border-top:1px solid var(--borda,#E5E7EB);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#FAFAF9}
.dgv-g-acoes>.btn{flex:1;min-width:140px}
.dgv-dev{color:#B45309!important}.dgv-desc{color:#6B7280!important}
.dgv-info{flex-basis:100%;margin:0;font-size:13px;color:var(--cinza-700,#374151)}
.dgv-motivo{flex:1}.dgv-motivo textarea{display:block;width:100%;margin:6px 0 8px;font:inherit;font-size:14px;padding:8px;border:1px solid var(--borda,#E5E7EB);border-radius:8px}
.dgv-bloco{margin-bottom:16px}.dgv-bloco h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--verde-medio,#2D6A4F);margin:0 0 6px}
.dgv-resp{display:grid;grid-template-columns:36px 1fr;gap:2px 8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--borda,#E5E7EB)}
.dgv-resp .n{color:var(--cinza-500,#6B7280);font-family:'DM Mono',monospace;font-size:11px;padding-top:2px}
.dgv-resp .q{color:var(--cinza-500,#6B7280)}.dgv-resp .v{font-weight:600}
.dgv-resp.aviso{background:#FFFBEB;border-radius:6px;padding:6px}.dgv-resp.aviso .v{color:#B45309}
.dgv-avisos{background:#FFFBEB;border:1px solid #FCD34D;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.dgv-avisos summary{cursor:pointer}
.dgv-avisos b{color:#92400E}.dgv-avisos ul{margin:4px 0 0;padding-left:18px}
.dgv-ident{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.dgv-ident small{color:#0369A1;font-weight:700;letter-spacing:.04em}
.dgv-mor{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.dgv-mor th,.dgv-mor td{padding:5px 6px;border-bottom:1px solid var(--borda,#E5E7EB);text-align:left}.dgv-mor th{color:var(--cinza-500,#6B7280);font-weight:600}
.dgv-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dgv-foto{position:relative;margin:0;border-radius:8px;overflow:hidden;background:#E5E7EB;aspect-ratio:4/3}
.dgv-foto img{width:100%;height:100%;object-fit:cover;display:block}
.dgv-foto figcaption{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px}
.dgv-foto button{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:rgba(220,38,38,.92);color:#fff;font-size:11px;padding:3px 7px;cursor:pointer}
.dgv-nota{font-size:11px;color:var(--cinza-500,#6B7280);margin:6px 0 0}
.dgv-hist{font-size:12px;color:var(--cinza-700,#374151);padding-left:18px;margin:0}.dgv-hist li{margin:3px 0}
/* ── Exportação (js/diagnostico-exportar.js) ── */
.dge-ov{justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto}
.dge-modal{width:min(620px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.dge-modal header{padding:16px 20px;border-bottom:1px solid var(--borda,#E5E7EB)}.dge-modal header h2{margin:0;font-size:16px}
.dge-modal header p{margin:3px 0 0;font-size:12px;color:var(--cinza-500,#6B7280)}
.dge-corpo{padding:16px 20px}
.dge-modal footer{padding:12px 20px;border-top:1px solid var(--borda,#E5E7EB);background:#FAFAF9;display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--cinza-500,#6B7280)}
.dge-botoes{display:flex;gap:8px}
.dge-sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--verde-medio,#2D6A4F);margin:0 0 6px}
.dge-sec small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--cinza-500,#6B7280)}
.dge-linha{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.dge-op{display:flex;gap:10px;border:1px solid var(--borda,#E5E7EB);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;cursor:pointer}
.dge-op.on{border-color:var(--verde-medio,#2D6A4F);background:#F0FDF4}.dge-op.dge-ident.on{border-color:#0369A1;background:#F0F9FF}
.dge-op b{display:block}.dge-op small{color:var(--cinza-500,#6B7280);display:block}
.dge-alerta{display:block;background:#FFFBEB;border:1px solid #FCD34D;border-radius:8px;padding:8px 10px;font-size:12px;color:#92400E;margin-top:6px}
.dge-alerta label{display:flex;gap:6px;align-items:center;margin-top:4px;font-weight:600}
.dge-abas{display:flex;gap:6px;flex-wrap:wrap}.dge-abas span{font-size:12px;background:var(--cinza-100,#F3F4F6);border-radius:6px;padding:3px 8px}
#dgv-exportacoes .card{margin-top:14px}
.dge-hist td{padding:7px 8px}
.dge-tag{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.dge-tag.p{background:#ECFDF5;color:#047857}.dge-tag.i{background:#E0F2FE;color:#0369A1}.dge-tag.c{background:#F3F4F6;color:#6B7280}
/* ── Indicadores (js/diagnostico-indicadores.js) ── */
.dgi-ctrl{padding:12px 16px!important;margin-bottom:12px}
.dgi-seg{display:flex;border:1px solid var(--borda-forte,#D1D5DB);border-radius:8px;overflow:hidden;margin-top:1px}
.dgi-seg button{font:inherit;font-size:12px;font-weight:600;border:0;background:#fff;padding:7px 12px;color:var(--cinza-700,#374151);cursor:pointer}
.dgi-seg button+button{border-left:1px solid var(--borda,#E5E7EB)}.dgi-seg button.on{background:var(--verde-medio,#2D6A4F);color:#fff}
.dgi-nums{margin:0 0 6px}
.dgi-bloco{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--verde-medio,#2D6A4F);margin:18px 0 8px}
.dgi-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.dgi-card{background:#fff;border:1px solid var(--borda,#E5E7EB);border-radius:12px;padding:14px 16px;min-width:0}
.dgi-card.dgi-larga{grid-column:1/-1}
.dgi-card h4{margin:0;font-size:13.5px;font-weight:600;line-height:1.35}.dgi-card h4 span{font-family:'DM Mono',monospace;font-size:11px;color:var(--cinza-500,#6B7280);margin-right:6px}
.dgi-meta{font-size:11.5px;color:var(--cinza-500,#6B7280);margin:3px 0 10px}
.dgi-bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 84px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.dgi-bar .trilho{height:14px;background:var(--cinza-100,#F3F4F6);border-radius:4px;overflow:hidden;display:block}
.dgi-bar .trilho i{display:block;height:100%;background:var(--verde-medio,#2D6A4F);border-radius:0 4px 4px 0}
.dgi-bar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.dgi-bar .v small{color:var(--cinza-400,#9CA3AF)}
.dgi-bar .v em{font-style:normal;color:var(--cinza-400,#9CA3AF);font-size:11px}
.dgi-opsx{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
.dgi-opsx .dgi-bar{grid-template-columns:1fr 84px;margin:2px 0}.dgi-bar.sx .trilho{height:8px}
.dgi-leg{display:flex;gap:14px;font-size:11.5px;color:var(--cinza-700,#374151);margin-bottom:6px;flex-wrap:wrap}
.dgi-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dgi-oculto{background:repeating-linear-gradient(135deg,#F9FAFB 0 8px,#F3F4F6 8px 16px);border:1px dashed var(--cinza-300,#D1D5DB);border-radius:8px;padding:12px;font-size:12.5px;color:var(--cinza-500,#6B7280);text-align:center}
.dgi-media{font-size:26px;font-weight:700;color:var(--verde,#1F4E2C)}.dgi-media small{font-size:12px;color:var(--cinza-500,#6B7280);font-weight:400}
.dgi-tab{width:100%;border-collapse:collapse;font-size:12.5px}
.dgi-tab th{font-size:11px;color:var(--cinza-500,#6B7280);text-align:left;padding:5px 8px;border-bottom:1px solid var(--borda,#E5E7EB);font-weight:600;white-space:nowrap}
.dgi-tab td{padding:6px 8px;border-bottom:1px solid var(--cinza-100,#F3F4F6);white-space:nowrap}
.dgi-tab td.dgi-oc{color:var(--cinza-400,#9CA3AF);font-style:italic}
.dgi-mini{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}.dgi-mini i{display:block;height:9px;background:var(--verde-medio,#2D6A4F);border-radius:0 3px 3px 0}
.dgi-nota{font-size:12px;color:var(--cinza-500,#6B7280);margin:14px 0 0}
@media (max-width:640px){.dgi-grade{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-regras.js"></script>
<script src="../js/diagnostico.js"></script>
<script src="../js/diagnostico-validacao.js"></script>
<script src="../js/diagnostico-exportar.js"></script>
<script src="../js/diagnostico-indicadores.js"></script>
</body>
</html>
