<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Diagnóstico Socioambiental</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
/* Mesa do Diagnóstico (mínima — Fase 3 traz validação, exportação e indicadores) */
.dg-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.dg-num{background:var(--cinza-50,#F9FAFB);border:1px solid var(--borda,#E5E7EB);border-radius:10px;padding:12px 14px}
.dg-num b{display:block;font-size:24px;line-height:1.2}
.dg-num span{font-size:12px;color:var(--cinza-500,#6B7280)}
.dg-treino{border-left:4px solid #C2410C;background:#FFF7ED}
.dg-treino h3{color:#9A3412}
.dg-tab{width:100%;border-collapse:collapse;font-size:13px}
.dg-tab th,.dg-tab td{padding:6px 8px;border-bottom:1px solid var(--borda,#E5E7EB);text-align:left}
.dg-tab td.mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--cinza-500,#6B7280)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diagnostico.js"></script>
</body>
</html>
