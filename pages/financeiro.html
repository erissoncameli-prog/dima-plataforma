function brlc(v) { v = parseFloat(v || 0); const a = Math.abs(v); if (a >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' mi'; if (a >= 1e4) return 'R$ ' + Math.round(v/1e3) + ' mil'; return fmtBRL(v); }
function usdc(v) { v = parseFloat(v || 0); const a = Math.abs(v); if (a >= 1e6) return 'US$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' mi'; if (a >= 1e4) return 'US$ ' + Math.round(v/1e3) + ' mil'; return fmtUSD(v); }
function diasAte(d) { if (!d) return null; const h = new Date(); h.setHours(0,0,0,0); return Math.round((new Date(d + 'T00:00:00') - h) / 86400000); }
function estaVencido(l) { return l.situacao === 'a_pagar' && l.dt_vencimento && new Date(l.dt_vencimento) < new Date(); }
function fmtTaxa(v) { return 'R$ ' + parseFloat(v || 0).toLocaleString('pt-BR', {minimumFractionDigits:4, maximumFractionDigits:4}); }

// US$ de um lançamento: pago = câmbio UNESCO gravado no pagamento (travado);
// a pagar = estimado pela cotação de hoje (muda até ser pago).
function usdLanc(l) {
  const brl = parseFloat(l.valor_brl || 0);
  if (l.situacao === 'pago') {
    const u = parseFloat(l.valor_usd_unesco || l.valor_usd || 0);
    if (u > 0) return u;
    return brl / parseFloat(l.cotacao_uso || taxaAtual);
  }
  return brl / taxaAtual;
}

// Tema claro/escuro: mesmo 'diag_tema' da mesa do Diagnóstico, de TDRs, Atividades, Contratos e Visão Geral (componente .dgm-tema)
function seletorTema() {
  const tb = document.querySelector('.topbar'); if (!tb || tb.querySelector('.dgm-tema') || typeof DiagTema === 'undefined') return;
  const d = document.createElement('div');
  d.className = 'dgm-tema'; d.setAttribute('role','group'); d.setAttribute('aria-label','Tema');
  d.innerHTML = [['claro','sol','Claro'],['escuro','lua','Escuro']].map(x =>
    `<button type="button" data-tema="${x[0]}" aria-pressed="${DiagTema.atual()===x[0]}">${fiIc(x[1])}${x[2]}</button>`).join('');
  const bc = tb.querySelector('.topbar-breadcrumb');
  if (bc) bc.parentNode.insertBefore(d, bc); else tb.appendChild(d);
  d.addEventListener('click', ev => {
    const b = ev.target.closest('[data-tema]'); if (!b) return;
    DiagTema.definir(b.dataset.tema);
    d.querySelectorAll('[data-tema]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
}

// ── Cotação USD — busca e persiste diariamente ────────────────
async function sincronizarCotacao() {
  const hoje = new Date().toISOString().split('T')[0];

  // Busca os dois últimos registros (hoje + anterior para variação)
  const { data: ultimas } = await db.from('cotacoes_usd')
    .select('id,cotacao,cotacao_anterior,variacao_pct,data_ref,fonte')
    .order('data_ref', { ascending: false })
    .limit(2);

  const ultima   = ultimas?.[0];
  const anterior = ultimas?.[1];

  // Já tem cotação de hoje → retorna direto
  if (ultima?.data_ref === hoje) {
    return {
      cotacao:          parseFloat(ultima.cotacao),
      cotacao_anterior: anterior ? parseFloat(anterior.cotacao) : null,
      variacao_pct:     ultima.variacao_pct ? parseFloat(ultima.variacao_pct) : null,
      data_ref:         ultima.data_ref
    };
  }

  // Buscar cotação atual na AwesomeAPI (gratuita, sem chave)
  try {
    const res  = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
    const json = await res.json();
    const nova = parseFloat(json.USDBRL.bid);

    const cotAnt = ultima ? parseFloat(ultima.cotacao) : null;
    const varPct = cotAnt ? parseFloat(((nova - cotAnt) / cotAnt * 100).toFixed(4)) : null;

    await db.from('cotacoes_usd').insert({
      cotacao:          nova,
      cotacao_anterior: cotAnt,
      variacao_pct:     varPct,
      data_ref:         hoje,
      fonte:            'AwesomeAPI'
    });

    return { cotacao: nova, cotacao_anterior: cotAnt, variacao_pct: varPct, data_ref: hoje };

  } catch (e) {
    // Fallback: usa o último registro disponível
    console.warn('AwesomeAPI indisponível, usando última cotação salva.', e);
    if (ultima) {
      return {
        cotacao:          parseFloat(ultima.cotacao),
        cotacao_anterior: anterior ? parseFloat(anterior.cotacao) : null,
        variacao_pct:     ultima.variacao_pct ? parseFloat(ultima.variacao_pct) : null,
        data_ref:         ultima.data_ref
      };
    }
    return { cotacao: 5.87, cotacao_anterior: null, variacao_pct: null, data_ref: null };
  }
}

async function carregar() {
  try {
    const [
      {data:lancs}, {data:ativs}, {data:conts},
      {data:forns}, {data:ress}, cotacao
    ] = await Promise.all([
      db.from('execucao_financeira').select(`
        *,cotacao_unesco,valor_usd_unesco,impacto_usd,
        atividades(id,codigo,nome_pt,resultado_id),
        contratos(id,numero,objeto_pt),
        fornecedores(id,nome,tipo)
      `).order('dt_vencimento',{ascending:false}),
      db.from('atividades').select('id,codigo,nome_pt,orcamento_usd,resultado_id').order('codigo'),
      db.from('contratos').select('id,numero,objeto_pt,fornecedor_id,atividade_id,valor_total_brl,valor_utilizado_brl,saldo_brl').order('numero'),
      db.from('fornecedores').select('id,nome,tipo').order('nome'),
      db.from('resultados').select('*').order('codigo'),
      sincronizarCotacao()
    ]);

    todosLanc = lancs || [];
    atividades = ativs || [];
    contratos = conts || [];
    fornecedores = forns || [];
    resultados = ress || [];

    // Pré-carregar última cotação UNESCO utilizada nos pagamentos
    const ultimoComUNESCO = (lancs||[]).find(l => l.cotacao_unesco && l.situacao === 'pago');
    if (ultimoComUNESCO) taxaUnescoUltima = parseFloat(ultimoComUNESCO.cotacao_unesco);

    taxaAtual        = cotacao?.cotacao       || 5.87;
    taxaAnterior     = cotacao?.cotacao_anterior || null;
    taxaVariacaoPct  = cotacao?.variacao_pct  || null;
    taxaDataRef      = cotacao?.data_ref      || null;
    taxaEHoje        = cotacao?.data_ref === new Date().toISOString().split('T')[0];

    // Filtro de atividades — as que têm contrato ou lançamento (o "Ver" da aba Por atividade usa este filtro)
    const filAtiv = document.getElementById('fil-ativ');
    if (filAtiv) {
      const comVinculo = new Set([
        ...(conts||[]).map(c => c.atividade_id),
        ...todosLanc.map(l => l.atividade_id)
      ].filter(Boolean));
      atividades
        .filter(a => comVinculo.has(a.id))
        .forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = `${a.codigo} — ${(a.nome_pt||'').substring(0,38)}`;
          filAtiv.appendChild(opt);
        });
    }

    // Filtro de fornecedores — só os que aparecem nos lançamentos
    const filForn = document.getElementById('fil-forn');
    if (filForn) {
      const fornsVistos = new Map();
      (lancs||[]).forEach(l => {
        if (l.fornecedor_id && l.fornecedores?.nome && !fornsVistos.has(l.fornecedor_id)) {
          fornsVistos.set(l.fornecedor_id, l.fornecedores.nome);
        }
      });
      [...fornsVistos.entries()]
        .sort((a,b) => a[1].localeCompare(b[1]))
        .forEach(([id, nome]) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = nome.substring(0, 45);
          filForn.appendChild(opt);
        });
    }

    // Filtro de meses
    const meses = [...new Set(todosLanc.map(l => l.dt_vencimento?.substring(0,7)).filter(Boolean))].sort().reverse();
    const filMes = document.getElementById('fil-mes');
    if (filMes) {
      const nomes = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      meses.forEach(m => {
        const opt = document.createElement('option');
        const [ano,mes] = m.split('-');
        opt.value = m; opt.textContent = `${nomes[parseInt(mes)]}/${ano}`;
        filMes.appendChild(opt);
      });
    }

    renderCotacaoCard();
    renderStats();
    renderConteudo();
  } catch(e) {
    console.error(e);
    toast('Erro ao carregar dados financeiros.','error');
  }
}

function renderCotacaoCard() {
  const el = document.getElementById('cotacao-chip');
  if (!el) return;

  // Usa variacao_pct do banco; recalcula só como fallback
  const varPct = taxaVariacaoPct !== null
    ? taxaVariacaoPct
    : (taxaAnterior && taxaAnterior > 0
        ? parseFloat(((taxaAtual - taxaAnterior) / taxaAnterior * 100).toFixed(4))
        : null);

  const varDir = varPct === null ? 'flat' : varPct > 0.005 ? 'up' : varPct < -0.005 ? 'down' : 'flat';
  const VAR = { up:['fi-p-er','sobe','Alta'], down:['fi-p-ok','desce','Baixa'], flat:['fi-p-ne','igual','Estável'] }[varDir];
  const varTxt = varPct !== null ? Math.abs(varPct).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%' : '—';

  const dataFmt = taxaDataRef
    ? new Date(taxaDataRef + 'T12:00:00').toLocaleDateString('pt-BR', {day:'2-digit',month:'short'})
    : '—';
  const selo = taxaEHoje
    ? `<span class="fi-pill fi-p-ok" style="padding:0 7px">Hoje</span>`

  el.innerHTML = `
    <div class="fi-cot" aria-label="Cotação do dólar">
      <div><small>Dólar comercial ${selo}</small><div class="v">${fmtTaxa(taxaAtual)}</div></div>

      <div class="sep"></div>
      <div><small>Fonte</small><span class="fonte">AwesomeAPI</span></div>

}

function renderStats() {
  const ativos = todosLanc.filter(l=>l.situacao!=='cancelado');
  const pagos = ativos.filter(l=>l.situacao==='pago');
  const aPagar = ativos.filter(l=>l.situacao==='a_pagar');
  const soma = arr => arr.reduce((s,l)=>s+parseFloat(l.valor_brl||0),0);
  const totalPago = soma(pagos);
  const totalAPagar = soma(aPagar);
  const totalGeral = totalPago + totalAPagar;
  const vencidosArr = aPagar.filter(estaVencido);
  const vencidos = vencidosArr.length;
  const usdPago = pagos.reduce((s,l)=>s+usdLanc(l),0);
  const usdAPagar = aPagar.reduce((s,l)=>s+usdLanc(l),0);
  const pp = totalGeral > 0 ? totalPago/totalGeral*100 : 0;
  const pa = totalGeral > 0 ? totalAPagar/totalGeral*100 : 0;
  const ativo = c => String(filtroCardFin===c);

  document.getElementById('stats').innerHTML = `
    <button type="button" class="fi-kpi" aria-pressed="${ativo('pago')}" onclick="clicarCardFin('pago')">
      <span class="fi-kpi-l">${fiIc('check','p')}Pago</span>
      <span class="fi-kpi-v ok">${brlc(totalPago)}</span>
      <span class="fi-meter" aria-hidden="true"><i class="pago" style="width:${pp}%"></i><i class="comp" style="width:${pa}%"></i></span>
      <span class="fi-kpi-s">${Math.round(pp)}% do lançado · ${pagos.length} pagamento${pagos.length!==1?'s':''}</span>
    </button>
    <button type="button" class="fi-kpi" aria-pressed="${ativo('a_pagar')}" onclick="clicarCardFin('a_pagar')">
      <span class="fi-kpi-l">${fiIc('relogio','p')}A pagar</span>
      <span class="fi-kpi-v">${brlc(totalAPagar)}</span>
      <span class="fi-kpi-s">${aPagar.length} lançamento${aPagar.length!==1?'s':''}</span>
    </button>
    <button type="button" class="fi-kpi${vencidos?' alerta':''}" aria-pressed="${ativo('vencidos')}" onclick="clicarCardFin('vencidos')">
      <span class="fi-kpi-l">${fiIc('alerta','p')}Vencidos</span>
      <span class="fi-kpi-v${vencidos?' erro':' ok'}">${vencidos}</span>
      <span class="fi-kpi-s">${vencidos ? brlc(soma(vencidosArr)) + ' · clique para ver' : 'nenhum a pagar vencido'}</span>
    </button>
    <div class="fi-kpi">
      <span class="fi-kpi-l">${fiIc('globo','p')}Em US$</span>
      <span class="fi-kpi-v">${usdc(usdPago + usdAPagar)}</span>
      <span class="fi-kpi-s"><b class="ok">${usdc(usdPago)}</b> pago (câmbio UNESCO) · ${usdc(usdAPagar)} a pagar (estimado a ${fmtTaxa(taxaAtual)})</span>
    </div>`;
  const n = document.getElementById('n-lanc'); if (n) n.textContent = todosLanc.length;
}

// ── Filtro por clique nos números do topo ─────────────────────
let filtroCardFin='';
const CARDS_FIN_STATUS_UNICO=['pago','a_pagar'];
function clicarCardFin(card){
  filtroCardFin=(filtroCardFin===card)?'':card;
  const selSit=document.getElementById('fil-sit');
  if(selSit){
    if(CARDS_FIN_STATUS_UNICO.includes(filtroCardFin)) selSit.value=filtroCardFin;
    else if(CARDS_FIN_STATUS_UNICO.includes(selSit.value)) selSit.value='';
  }
  renderStats();
  if(visaoAtual!=='lancamentos') mudarVisao('lancamentos');
  else renderLancamentos();
}

function sincronizarFiltroCardFin(){
  const selSit=document.getElementById('fil-sit');
  filtroCardFin=(selSit&&CARDS_FIN_STATUS_UNICO.includes(selSit.value))?selSit.value:'';
  renderStats();
  renderLancamentos();
}

function mudarVisao(v) {
  visaoAtual = v;
  document.querySelectorAll('.fi-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === v)));
  const filtros = document.getElementById('filtros-lanc');
  if (filtros) filtros.hidden = v !== 'lancamentos';
  renderConteudo();
}

function renderConteudo() {
  if (visaoAtual==='lancamentos') renderLancamentos();
  else if (visaoAtual==='atividades') renderPorAtividade();
  else if (visaoAtual==='resultados') renderPorResultado();
}

// ── VISÃO LANÇAMENTOS ─────────────────────────────────────────
function renderLancamentos() {
  const busca  = document.getElementById('busca')?.value.toLowerCase()||'';
  const sit    = document.getElementById('fil-sit')?.value||'';
  const ativId = document.getElementById('fil-ativ')?.value||'';
  const fornId = document.getElementById('fil-forn')?.value||'';
  const mes    = document.getElementById('fil-mes')?.value||'';

  const fil = todosLanc.filter(l => {
    const desc = (l.descricao||'').toLowerCase();
    const nf   = (l.numero_nf||'').toLowerCase();
    if (busca  && !desc.includes(busca) && !nf.includes(busca)) return false;
    if (sit    && l.situacao    !== sit)    return false;
    if (ativId && l.atividade_id !== ativId) return false;
    if (fornId && l.fornecedor_id !== fornId) return false;
    if (mes    && !(l.dt_vencimento||'').startsWith(mes)) return false;
    if (filtroCardFin==='vencidos' && !estaVencido(l)) return false;
    return true;
  });

  document.getElementById('cont-lanc').textContent = `${fil.length} de ${todosLanc.length} lançamentos`;

  if (!fil.length) {
    document.getElementById('conteudo-financeiro').innerHTML =
      `<div class="fi-card"><div class="fi-vazio" role="status">${fiIc('busca')}Nenhum lançamento encontrado.</div></div>`;
    return;
  }

  const podePagar = PERFIS_PAGAM.includes(appState.perfil);
  const soma = arr => arr.reduce((s,l)=>s+parseFloat(l.valor_brl||0),0);

  document.getElementById('conteudo-financeiro').innerHTML = `
    <div class="fi-card">
      <div class="fi-tbl-w">
        <table class="fi-tbl">
          <thead><tr>
            <th>Descrição</th><th>NF</th><th>Atividade</th><th>Fornecedor / contrato</th>
            <th>Vencimento</th><th>Pagamento</th><th class="dir">Valor</th><th>Situação</th><th>Comprovante</th>
            <th><span class="sr-only">Ações</span></th>
          </tr></thead>
          <tbody>
            ${fil.map(l => {
              const vencido = estaVencido(l);
              const dias = vencido ? -diasAte(l.dt_vencimento) : 0;
              const usd = usdLanc(l);
              const travado = l.situacao === 'pago';
              const forn = l.fornecedores?.nome || '';
              const cont = l.contratos?.numero || '';
              return `<tr class="${vencido?'venc':''}${l.situacao==='cancelado'?' cancel':''}">
                <td class="c-desc">
                  <div class="fi-desc">${esc(l.descricao||'—')}</div>
                  ${l.elemento_despesa?`<div class="fi-sub">${esc(l.elemento_despesa)}</div>`:''}
                  ${vencido?`<span class="fi-pill fi-p-er vencido">${fiIc('alerta','p')}Vencido há ${dias} dia${dias!==1?'s':''}</span>`:''}
                </td>
                <td class="c-nf">${l.numero_nf?`<span class="fi-nf">${esc(l.numero_nf)}</span>`:'<span class="fi-traco">—</span>'}</td>
                <td class="c-ativ">${l.atividades?.codigo?`<span class="fi-cod" title="${esc(l.atividades.nome_pt||'')}">${esc(l.atividades.codigo)}</span>`:'<span class="fi-traco">—</span>'}</td>
                <td class="c-forn"><div class="fi-forn">${esc(forn || (cont ? '' : '—'))}</div>${cont?`<div class="fi-sub">Contrato ${esc(cont)}</div>`:''}</td>
                <td class="c-venc fi-data">${fmtData(l.dt_vencimento)}</td>
                <td class="c-pgto fi-data ${l.dt_pagamento?'pago':'vazio'}">${l.dt_pagamento?fmtData(l.dt_pagamento):'—'}</td>
                <td class="c-val dir"><div class="fi-val">${fmtBRL(l.valor_brl)}</div>
                  <div class="fi-usd" title="${travado?'Câmbio UNESCO travado no pagamento':'Estimado pela cotação de hoje'}">${travado?fiIc('cadeado','p'):'≈ '}${fmtUSD(usd)}</div></td>
                <td class="c-sit">${pillSit(l.situacao)}</td>
                <td class="c-comp">${l.comprovante_url
                  ?`<a href="#" class="fi-comp" data-arquivo="${esc(l.comprovante_url)}" title="${esc(l.comprovante_nome||'Comprovante')}">${fiIc('clipe','p')}Abrir</a>`
                  :'<span class="fi-traco">—</span>'}</td>
                <td class="c-acoes"><div class="fi-acoes">
                  ${l.situacao==='a_pagar' && podePagar
                    ? `<button type="button" class="fi-btn peq pagar" onclick="abrirPagamento('${l.id}')">${fiIc('cartao','p')}Pagar</button>` : ''}
                  <button type="button" class="fi-btn ic" onclick="abrirEditar('${l.id}')" aria-label="Editar lançamento" title="Editar">${fiIc('lapis','p')}</button>

            }).join('')}

        </table>

      <div class="fi-rodape">
        <span>Total filtrado <b>${fmtBRL(soma(fil.filter(l=>l.situacao!=='cancelado')))}</b></span>
        <span>Pago <b class="ok">${fmtBRL(soma(fil.filter(l=>l.situacao==='pago')))}</b></span>

// Barra de execução (mesma de Atividades): pago em destaque + a pagar; acima do orçamento em vermelho
function barraExec(orc, pago, aPagar) {
  const tot = pago + aPagar;
  const base = Math.max(orc, tot) || 1;
  const pp = pago / base * 100, pa = aPagar / base * 100;
  const acima = orc > 0 && tot > orc;
  const pct = orc > 0 ? Math.round(tot / orc * 100) : null;
  return `<div class="fi-exec">
    <div class="fi-meter" role="img" aria-label="Pago ${usdc(pago)}, a pagar ${usdc(aPagar)}${orc>0?' de '+usdc(orc):''}">
      <i class="pago" style="width:${pp}%"></i><i class="${acima?'exc':'comp'}" style="width:${pa}%"></i></div>
    <div class="ln"><span>${orc>0?'de <b>'+usdc(orc)+'</b>':'sem orçamento'}</span>
      ${acima?`<b class="exc">${pct}% · acima</b>`:`<b class="pago">${orc>0?Math.round(pago/orc*100)+'% pago':usdc(pago)+' pago'}</b>`}</div>
  </div>`;
}

function notaSoLanc() { return `<div class="fi-nota">${fiIc('info','p')}<span>Só o que passou pelo Financeiro (pago pelo câmbio UNESCO + a pagar estimado a ${fmtTaxa(taxaAtual)}).
  O saldo oficial, com TDRs e contratos, está na <a href="dashboard.html">Visão Geral</a>.</span></div>`; }

// ── VISÃO POR ATIVIDADE (em US$, como o orçamento) ────────────
function renderPorAtividade() {
  const porAtiv = {};
  todosLanc.filter(l=>l.situacao!=='cancelado').forEach(l => {
    const id = l.atividade_id || '__sem__';
    if (!porAtiv[id]) porAtiv[id] = { pago:0, aPagar:0, n:0 };
    porAtiv[id].n++;
    if (l.situacao==='pago') porAtiv[id].pago += usdLanc(l);
    else porAtiv[id].aPagar += usdLanc(l);
  });

  const linhas = atividades.map(a => {
    const d = porAtiv[a.id] || { pago:0, aPagar:0, n:0 };
    return { a, d, orc: parseFloat(a.orcamento_usd||0) };
  }).filter(x => x.d.n > 0 || x.orc > 0);

  document.getElementById('conteudo-financeiro').innerHTML = `
    <div class="fi-pagina" style="gap:12px">
      ${notaSoLanc()}
      <div class="fi-card">
        <div class="fi-hd"><h3>Execução por atividade</h3><span class="fi-pill fi-p-ne">em US$</span></div>
        ${linhas.length ? linhas.map(({a,d,orc}) => `
          <div class="fi-alin">
            <span class="fi-cod">${esc(a.codigo)}</span>
            <span class="nm" title="${esc(a.nome_pt||'')}">${esc(a.nome_pt||'')}</span>
            ${barraExec(orc, d.pago, d.aPagar)}
            <button type="button" class="fi-btn peq" onclick="filtrarPorAtiv('${a.id}')" aria-label="Ver lançamentos de ${esc(a.codigo)}">Ver</button>
          </div>`).join('') :
          `<div class="fi-vazio">${fiIc('lista')}Nenhum lançamento registrado.</div>`}
      </div>
    </div>`;
}

// ── VISÃO POR RESULTADO (em US$) ──────────────────────────────
function renderPorResultado() {
  const resMap = {};
  resultados.forEach(r => { resMap[r.id] = { pago:0, aPagar:0 }; });

  todosLanc.filter(l=>l.situacao!=='cancelado').forEach(l => {
    const ativ = atividades.find(a=>a.id===l.atividade_id);
    const rId = ativ?.resultado_id;
    if (rId && resMap[rId]) {
      if (l.situacao==='pago') resMap[rId].pago += usdLanc(l);
      else resMap[rId].aPagar += usdLanc(l);
    }
  });

  document.getElementById('conteudo-financeiro').innerHTML = `
    <div class="fi-pagina" style="gap:12px">
      ${notaSoLanc()}
      ${resultados.length ? `<div class="fi-rgrid">
      ${resultados.map((r,i) => {
        const d = resMap[r.id];
        const orc = parseFloat(r.orcamento_usd||0);
        const livre = orc - d.pago - d.aPagar;
        const cor = i < 4 ? `var(--fi-r${i+1})` : 'var(--fi-rx)';
        return `
        <div class="fi-rcard" style="--c:${cor}">
          <div class="hd"><span class="fi-rtag">${esc(r.codigo)}</span><b>${esc(campo(r,'nome')||'')}</b></div>
          ${barraExec(orc, d.pago, d.aPagar)}
          <div class="fi-tri">
            <div><span>Pago</span><b class="ok">${usdc(d.pago)}</b></div>
            <div><span>A pagar</span><b>${usdc(d.aPagar)}</b></div>
            <div><span>${livre<0?'Acima do orçamento':'Livre (só lançamentos)'}</span><b class="${livre<0?'exc':''}">${usdc(Math.abs(livre))}</b></div>
          </div>
        </div>`;
      }).join('')}
      </div>` : `<div class="fi-card"><div class="fi-vazio">${fiIc('grafico')}Nenhum resultado cadastrado.</div></div>`}
    </div>`;
}

function filtrarPorAtiv(id) {
  mudarVisao('lancamentos');
  document.getElementById('fil-ativ').value = id;
  renderLancamentos();
}

function _optsContratos(atividadeId, contratoSelId) {
  const lista = atividadeId
    ? contratos.filter(c => c.atividade_id === atividadeId)
    : contratos;
  return `<option value="">— Sem contrato —</option>` +
    lista.map(c => {
      const obj = c.objeto_pt ? ` — ${c.objeto_pt.substring(0,38)}` : '';
      return `<option value="${c.id}" ${c.id===contratoSelId?'selected':''}>${esc(c.numero + obj)}</option>`;
    }).join('');
}

function _hintCont(atividadeId, qtd) {
  if (!atividadeId) return { cls:'', html:'Selecione uma atividade para filtrar os contratos' };
  if (!qtd) return { cls:'al', html: fiIc('alerta','p') + 'Nenhum contrato vinculado a esta atividade' };
  return { cls:'ok', html: fiIc('check','p') + `${qtd} contrato(s) vinculado(s) à atividade` };
}

function _renderPainelSaldo(contrato) {
  if (!contrato) return '';
  const total    = parseFloat(contrato.valor_total_brl || 0);
  const utilizado= parseFloat(contrato.valor_utilizado_brl || 0);
  const saldo    = parseFloat(contrato.saldo_brl ?? (total - utilizado));
  const pct      = total > 0 ? Math.min(utilizado / total * 100, 100) : 0;
  return `
    <div id="painel-saldo" class="fi-resumo tres fi-saldo">
      <div class="tit">${fiIc('doc','p')}Saldo do contrato ${esc(contrato.numero)}</div>
      <div><span>Valor total</span><b>${fmtBRL(total)}</b></div>
      <div><span>Utilizado</span><b>${fmtBRL(utilizado)}</b></div>
      <div><span>Saldo</span><b class="${saldo<0?'erro':saldo>0?'ok':''}">${fmtBRL(saldo)}</b></div>
      <div class="fi-meter" aria-hidden="true"><i class="${pct>=100?'exc':'pago'}" style="width:${pct}%"></i></div>
    </div>`;
}

      </div>
      <div class="form-group">
        <label class="form-label" for="f-nf">Número da nota fiscal</label>
        <input class="form-control mono" id="f-nf" type="text" value="${esc(l?.numero_nf||'')}" placeholder="Ex.: NF-12345">

    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label" for="f-venc">Data de vencimento</label>

      </div>
      <div class="form-group">
        <span class="form-label">Data de pagamento</span>

          ? `<span class="fi-pill fi-p-ok">${fiIc('cadeado','p')}${fmtData(l.dt_pagamento)}</span><span>Registrada no pagamento</span>`
          : `${fiIc('cadeado','p')}<span>Preenchida ao efetivar o pagamento (com senha)</span>`}</div>

    </div>
    <div class="grid-2">
      <div class="form-group">
        <span class="form-label">Situação</span>

      <div class="form-group">
        <label class="form-label" for="f-elem">Elemento de despesa</label>
        <input class="form-control mono" id="f-elem" type="text" value="${esc(l?.elemento_despesa||'')}" placeholder="Ex.: 33903900">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="f-obs">Observações</label>
      <textarea class="form-control" id="f-obs" rows="2">${esc(l?.observacoes||'')}</textarea>
    </div>
    <div class="form-group">
      <span class="form-label">Comprovante de transferência / pagamento</span>
      <div class="fi-dica" style="margin:0 0 8px">Recibo bancário, ordem de pagamento ou extrato — não é a nota fiscal (a NF vai em Produtos → Registrar entrega).</div>
      ${l?.comprovante_url?`<div class="fi-anexado">${fiIc('clipe','p')}<span style="flex:1">Comprovante já anexado</span>
        <a href="#" class="fi-btn peq" data-arquivo="${esc(l.comprovante_url)}">${fiIc('olho','p')}Abrir</a></div>`:''}
      <button type="button" class="upload-mini" id="upload-comp" onclick="document.getElementById('inp-comp').click()">
        ${fiIc('upload')}<b>${l?.comprovante_url?'Substituir comprovante':'Anexar comprovante de pagamento'}</b><span>PDF, JPG ou PNG</span>
      </button>
      <input type="file" id="inp-comp" accept=".pdf,.jpg,.jpeg,.png" hidden onchange="selecionarComp(this.files[0])">
    </div>`;

  // Se já tem contrato (edição), carregar produtos pendentes
  if (contratoId) {
    setTimeout(() => carregarProdutosPendentes(contratoId), 60);
  }
}

// ── CASCATA INTELIGENTE ───────────────────────────────────────
function cascataAtividade(atividadeId) {
  const contsFiltrados = atividadeId
    ? contratos.filter(c => c.atividade_id === atividadeId)
    : contratos;

  const selCont = document.getElementById('f-cont');
  if (selCont) selCont.innerHTML = _optsContratos(atividadeId, '');

  const hintCont = document.getElementById('hint-cont');
  if (hintCont) {
    const h = _hintCont(atividadeId, contsFiltrados.length);
    hintCont.className = 'fi-dica ' + h.cls;
    hintCont.innerHTML = h.html;
  }

  // Limpar saldo e fornecedor ao mudar atividade
  cascataContrato('');
}

function cascataContrato(contratoId) {
  const contrato = contratos.find(c => c.id === contratoId);

  const wrapSaldo = document.getElementById('wrap-saldo');
  if (wrapSaldo) wrapSaldo.innerHTML = contrato ? _renderPainelSaldo(contrato) : '';

  // Fornecedor automático
  const selForn = document.getElementById('f-forn');
  const hintForn = document.getElementById('hint-forn');
  if (selForn) {
    const auto = !!contrato?.fornecedor_id;
    selForn.value = auto ? contrato.fornecedor_id : '';
    selForn.classList.toggle('auto', auto);
    if (hintForn) hintForn.hidden = !auto;
  }

  // Produtos pendentes
  const wrapProd = document.getElementById('wrap-prod-pendentes');
  if (wrapProd) {
    prodsPendentes = [];
    if (contratoId) {
      wrapProd.innerHTML = '<div class="fi-carregando" role="status">Buscando produtos pendentes…</div>';
      carregarProdutosPendentes(contratoId);
    } else {
      wrapProd.innerHTML = '';
    }
  }
}

async function carregarProdutosPendentes(contratoId) {
  const wrap = document.getElementById('wrap-prod-pendentes');
  if (!wrap) return;
  try {
    const { data } = await db.from('contratos_produtos')
      .select('id,numero_produto,descricao,valor_brl,dt_vencimento,situacao')
      .eq('contrato_id', contratoId)
      .in('situacao', ['pendente','em_analise'])
      .order('numero_produto', {ascending: true});

    prodsPendentes = data || [];
    if (!prodsPendentes.length) {
      wrap.innerHTML = '<div class="fi-carregando">Nenhum produto pendente neste contrato.</div>';
      return;
    }

    wrap.innerHTML = `
      <div class="form-group">
        <span class="form-label">Produtos pendentes <span style="font-weight:400;color:var(--txt-3)">— clique para preencher</span></span>
        <div class="fi-prods" id="fi-prods">
          ${prodsPendentes.map((p, i) => {
            const vencido = p.dt_vencimento && new Date(p.dt_vencimento) < new Date();
            return `<button type="button" class="fi-prod${vencido?' vencido':''}" aria-pressed="false" onclick="preencherDeProduto(${i})">
              <small>Produto ${esc(p.numero_produto)}${vencido?' · '+fiIc('alerta','p')+'vencido':''}</small>
              <span title="${esc(p.descricao||'')}">${esc(p.descricao||'')}</span>
              <b>${fmtBRL(parseFloat(p.valor_brl||0))}</b>
            </button>`;
          }).join('')}
        </div>
      </div>`;
  } catch(e) {
    wrap.innerHTML = '';
  }
}

function preencherDeProduto(i) {
  const p = prodsPendentes[i];
  if (!p) return;
  const fDesc = document.getElementById('f-desc');
  const fBrl  = document.getElementById('f-brl');
  const fVenc = document.getElementById('f-venc');
  const valor = parseFloat(p.valor_brl || 0);
  if (fDesc && !fDesc.value) fDesc.value = p.descricao || '';
  if (fBrl  && !fBrl.value)  { fBrl.value = valor; calcUSD(valor); }
  if (fVenc && !fVenc.value && p.dt_vencimento) fVenc.value = p.dt_vencimento;

  // Referências ocultas do produto selecionado para o salvarLanc usar
  let hidden = document.getElementById('f-num-produto');
  if (!hidden) {
    hidden = document.createElement('input');
    hidden.type = 'hidden'; hidden.id = 'f-num-produto';
    document.getElementById('ml-body').appendChild(hidden);
  }
  hidden.value = p.numero_produto;

  let hiddenProdId = document.getElementById('f-prod-id');
  if (!hiddenProdId) {
    hiddenProdId = document.createElement('input');
    hiddenProdId.type = 'hidden'; hiddenProdId.id = 'f-prod-id';
    document.getElementById('ml-body').appendChild(hiddenProdId);
  }
  hiddenProdId.value = p.id;

  const box = document.getElementById('fi-prods');
  if (box) {
    box.classList.add('escolhido');
    box.querySelectorAll('.fi-prod').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
  }
  toast('Campos preenchidos com os dados do Produto '+p.numero_produto+'. Confira e salve.','info');
}

function calcUSD(val) {
  const brl  = parseFloat(val) || 0;
  const taxa = (lancEditando?.cotacao_travada_em && lancEditando?.situacao === 'pago')
    ? parseFloat(lancEditando.cotacao_uso)
    : taxaAtual;
  const el = document.getElementById('usd-preview');
  if (el) el.textContent = brl > 0 ? fmtUSD(brl / taxa) : '—';
}

function selecionarComp(file) {
  if (!file) return;
  arquivoComp = file;
  const el = document.getElementById('upload-comp');
  if (el) { el.classList.add('tem'); el.innerHTML = fiIc('check') + `<b>${esc(file.name)}</b><span>selecionado · clique para trocar</span>`; }
}

async function salvarLanc() {
  const desc = document.getElementById('f-desc').value.trim();
  const ativId = document.getElementById('f-ativ').value;
  const brl = parseFloat(document.getElementById('f-brl').value)||0;

  if (!desc || !ativId || !brl) {
    toast('Preencha descrição, atividade e valor.','error'); return;
  }

  const jaTravo = lancEditando?.cotacao_travada_em && lancEditando?.situacao === 'pago';

  const numProduto = parseInt(document.getElementById('f-num-produto')?.value) || null;
  const produtoId  = document.getElementById('f-prod-id')?.value || null;

  // dt_pagamento não vai daqui: só a janela "Efetivar pagamento" (com senha) grava o pagamento.
  const dados = {
    descricao: desc,
    atividade_id: ativId,
    contrato_id: document.getElementById('f-cont').value||null,
    fornecedor_id: document.getElementById('f-forn').value||null,
    valor_brl: brl,
    valor_usd: jaTravo
      ? lancEditando.valor_usd
      : parseFloat((brl / taxaAtual).toFixed(2)),
    cotacao_uso: jaTravo
      ? lancEditando.cotacao_uso
      : taxaAtual,
    numero_nf: document.getElementById('f-nf').value.trim()||null,
    numero_produto: numProduto ?? (lancEditando?.numero_produto ?? null),
    dt_vencimento: document.getElementById('f-venc').value||null,
    situacao: document.getElementById('f-sit').value,
    elemento_despesa: document.getElementById('f-elem').value.trim()||null,
    observacoes: document.getElementById('f-obs').value.trim()||null,
  };

  try {
    let id = lancEditando?.id;
    if (!lancEditando) {
      const {data,error} = await db.from('execucao_financeira')
        .insert({...dados, criado_por:appState.usuario.id})
        .select(`*,atividades(id,codigo,nome_pt,resultado_id),contratos(id,numero),fornecedores(id,nome,tipo)`)
        .single();
      if (error) throw error;
      id = data.id;
      todosLanc.unshift(data);
      toast('Lançamento registrado!','success');
    } else {
      const {error} = await db.from('execucao_financeira').update(dados).eq('id',lancEditando.id);
      if (error) throw error;
      Object.assign(lancEditando, dados);
      // embeds usados na lista
      const a = atividades.find(x => x.id === dados.atividade_id);
      if (a) lancEditando.atividades = { id:a.id, codigo:a.codigo, nome_pt:a.nome_pt, resultado_id:a.resultado_id };
      const c = contratos.find(x => x.id === dados.contrato_id);
      lancEditando.contratos = c ? { id:c.id, numero:c.numero, objeto_pt:c.objeto_pt } : null;
      const f = fornecedores.find(x => x.id === dados.fornecedor_id);
      lancEditando.fornecedores = f ? { id:f.id, nome:f.nome, tipo:f.tipo } : null;
      toast('Lançamento atualizado!','success');
    }

    // Vincular lancamento_id no produto se veio de um produto pendente
    if (produtoId && id) {
      await db.from('contratos_produtos')
        .update({ lancamento_id: id })
        .eq('id', produtoId);
    }
    if (arquivoComp && id) {
      const ext = arquivoComp.name.split('.').pop();
      const path = `comprovante-${id}.${ext}`;
      const {error:upErr} = await db.storage.from('financeiro-docs').upload(path,arquivoComp,{upsert:true});
      if (!upErr) {
        const {data:urlData} = db.storage.from('financeiro-docs').getPublicUrl(path);
        await db.from('execucao_financeira').update({
          comprovante_url: urlData.publicUrl, comprovante_nome: arquivoComp.name
        }).eq('id',id);
        const lanc = todosLanc.find(l=>l.id===id);
        if (lanc) { lanc.comprovante_url=urlData.publicUrl; lanc.comprovante_nome=arquivoComp.name; }
      }
    }

    fecharModal();
    renderStats();
    renderConteudo();
  } catch(e) {
    toast('Erro ao salvar: '+(e.message||''),'error');
  }
}

async function cancelarLanc(id) {
  if (!confirm('Cancelar este lançamento?')) return;
  const { error } = await db.from('execucao_financeira').update({situacao:'cancelado'}).eq('id',id);
  if (error) { toast('Erro ao cancelar: '+(error.message||''),'error'); return; }
  const l = todosLanc.find(x=>x.id===id);
  if (l) l.situacao = 'cancelado';
  fecharModal();
  renderStats(); renderConteudo();
  toast('Lançamento cancelado.','info');
}

}

// ── EXPORTAR CSV ──────────────────────────────────────────────
function exportarCSV() {
  const headers = ['Descrição','NF','Atividade','Fornecedor','Contrato','Vencimento','Pagamento','Valor R$','Valor U$','Situação','Elemento Despesa'];
  const rows = todosLanc.map(l => [
    `"${(l.descricao||'').replace(/"/g,'""')}"`,
    l.numero_nf||'',
    l.atividades?.codigo||'',
    `"${(l.fornecedores?.nome||l.contratos?.numero||'').replace(/"/g,'""')}"`,
    l.contratos?.numero||'',
    l.dt_vencimento||'',
    l.dt_pagamento||'',
    (l.valor_brl||0).toString().replace('.',','),
    usdLanc(l).toFixed(2).replace('.',','),
    l.situacao||'',
    l.elemento_despesa||''
  ]);

  const csv = [headers.join(';'), ...rows.map(r=>r.join(';'))].join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `financeiro-dima-${new Date().toISOString().split('T')[0]}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('CSV exportado com sucesso!','success');
}

// ── JANELA EFETIVAR PAGAMENTO ─────────────────────────────────
let lancPagando = null;
let arquivoPgto = null;
let taxaUnescoUltima = null; // lembra a última cotação UNESCO usada

async function abrirPagamento(id) {
  lancPagando = todosLanc.find(l => l.id === id);
  if (!lancPagando) return;
  arquivoPgto = null;

  const l = lancPagando;
  const taxaLanc = taxaAtual;
  const hoje = new Date().toISOString().split('T')[0];

  document.getElementById('pgto-subtitulo').textContent = l.descricao || '';
  document.getElementById('pgto-footer').innerHTML = '';
  document.getElementById('pgto-body').innerHTML =
    `<div class="fi-vazio" role="status"><div class="fi-spin"></div>Carregando histórico…</div>`;
  fiAbrir('modal-pgto');

  // Buscar produto vinculado, dados do fornecedor e totais do contrato
  let produto = null, fornData = {nome:'—',cpf_cnpj:'',email:''};
  let ctTotais = {total:0, aprovado:0, pago:0};
  const fornId = l.fornecedores?.id;
  const contratoId = l.contratos?.id || l.contrato_id;

  try {
    if (l.contrato_id && l.numero_produto) {
      const { data } = await db.from('contratos_produtos')
        .select(`id,numero_produto,descricao,valor_brl,dt_vencimento,dt_entrega,situacao,
                 arquivo_entrega_url,arquivo_entrega_nome,arquivo_entrega_data,
                 parecer_avaliador,avaliado_em,pct_aprovado,valor_aprovado,
                 usuarios!contratos_produtos_avaliado_por_fkey(nome_completo)`)
        .eq('contrato_id', l.contrato_id)
        .eq('numero_produto', l.numero_produto)
        .maybeSingle();
      produto = data;
    }

    const [fornR, totaisR] = await Promise.all([
      fornId
        ? db.from('fornecedores').select('nome,cpf_cnpj,email').eq('id', fornId).maybeSingle()
        : Promise.resolve({data:null}),
      contratoId
        ? db.from('contratos_produtos').select('valor_brl,valor_aprovado,situacao').eq('contrato_id', contratoId)
        : Promise.resolve({data:[]})
    ]);
    if (fornR.data) fornData = fornR.data;
    const todosCont = fornR.error ? [] : (totaisR.data || []);
    ctTotais.total    = todosCont.reduce((s,x) => s + parseFloat(x.valor_brl||0), 0);
    ctTotais.aprovado = todosCont.reduce((s,x) => s + parseFloat(x.valor_aprovado||0), 0);
    ctTotais.pago     = todosCont.filter(x => x.situacao==='pago').reduce((s,x) => s + parseFloat(x.valor_aprovado||0), 0);
  } catch(e) {
    console.error('[abrirPagamento] erro nas queries:', e);
  }
  const ctSaldo = ctTotais.total - ctTotais.pago;

  // ── Painel de atividade (lançamentos sem contrato, ex.: viagens) ──
  const semContrato = !l.contrato_id;
  let atTotais = { orcamento: 0, pago: 0, aPagar: 0 };
  if (semContrato && l.atividade_id) {
    const atividadeObj = atividades.find(a => a.id === l.atividade_id);
    atTotais.orcamento = parseFloat(atividadeObj?.orcamento_usd || 0) * taxaAtual;
    const lancsDaAtiv = todosLanc.filter(x => x.atividade_id === l.atividade_id && x.situacao !== 'cancelado');
    atTotais.pago   = lancsDaAtiv.filter(x => x.situacao === 'pago').reduce((s,x) => s + parseFloat(x.valor_brl||0), 0);
    atTotais.aPagar = lancsDaAtiv.filter(x => x.situacao === 'a_pagar').reduce((s,x) => s + parseFloat(x.valor_brl||0), 0);
  }
  const atSaldo = atTotais.orcamento - atTotais.pago - atTotais.aPagar;

  // ── Resumo do lançamento ──
  const ativNome = l.atividades ? `${l.atividades.codigo} · ${(l.atividades.nome_pt||'').substring(0,40)}` : '—';
  const fornNome = fornData.nome || l.fornecedores?.nome || '—';
  const contNum  = l.contratos?.numero  || '—';
  const venc     = l.dt_vencimento ? fmtData(l.dt_vencimento) : '—';
  const vencido  = l.dt_vencimento && new Date(l.dt_vencimento) < new Date();

  // ── Documentos e contribuições da última entrega ──
  let entregaDocs = [], entregaContribs = [], entregaInfo = null, entDevolvidas = [], entAprovada = null;
  if (produto) {
    const { data: todasEnts } = await db.from('contratos_produtos_entregas')
      .select('id,numero_entrega,dt_entrega,situacao,despacho_data,despachado_em,despacho_texto,criado_por_u:usuarios!contratos_produtos_entregas_criado_por_fkey(nome_completo),despachado_por_u:usuarios!contratos_produtos_entregas_despachado_por_fkey(nome_completo)')
      .eq('produto_id', produto.id)
      .order('numero_entrega', { ascending: true });
    const listaEntregas = todasEnts || [];
    entDevolvidas = listaEntregas.filter(e => e.situacao === 'devolvida');
    entAprovada = listaEntregas.filter(e => e.situacao === 'aprovada').slice(-1)[0] || null;
    const ent = listaEntregas.slice(-1)[0] || null;
    if (ent) {
      entregaInfo = ent;
      const [docsR, contribsR] = await Promise.all([
        db.from('entrega_documentos').select('*').eq('entrega_id', ent.id).order('inserido_em'),
        db.from('produto_matriz_contribuicao')
          .select('*,matriz_itens(resultado,produto_codigo,produto_titulo,indicador,unidade)')
          .eq('produto_id', ent.id)
      ]);
      entregaDocs  = docsR.data  || [];
      entregaContribs = contribsR.data || [];
    }
  }
  // a janela pode ter sido fechada enquanto carregava
  if (lancPagando !== l) return;

  // ── Histórico do produto ──
  let timelineHtml = '';
  if (produto) {
    const itens = [];
    itens.push({ cls:'t-ne', ic:'doc', titulo:`Produto ${produto.numero_produto} — ${(produto.descricao||'').substring(0,60)}`,
      data: contNum !== '—' ? `Contrato ${contNum}${produto.dt_vencimento ? ' · vence ' + fmtData(produto.dt_vencimento) : ''}` : '' });

    if (produto.dt_vencimento) {
      itens.push(produto.dt_entrega
        ? { cls:'t-in', ic:'caixa', titulo:'Entregue',
            data:`${fmtData(produto.dt_entrega)}${entregaInfo?.criado_por_u?.nome_completo ? ' · '+entregaInfo.criado_por_u.nome_completo : ''}${produto.arquivo_entrega_nome ? ' · '+produto.arquivo_entrega_nome : ''}` }
        : { cls:'t-al', ic:'relogio', titulo:'Aguardando entrega', data:`Prazo: ${fmtData(produto.dt_vencimento)}` });
    }

    entDevolvidas.forEach(e => {
      const dtDev = e.despacho_data ? fmtData(e.despacho_data)
        : e.despachado_em ? fmtData(e.despachado_em.split('T')[0])
        : `Entrega ${e.numero_entrega}`;
      const userDev = e.despachado_por_u?.nome_completo;
      itens.push({ cls:'t-al', ic:'volta', titulo:'Devolvido para ajustes', data:`${dtDev}${userDev ? ' · '+userDev : ''}`, parecer: e.despacho_texto });
    });

    // Avaliação — considera a situação do produto quando avaliado_em não foi preenchido
    const situacaoAprovada = ['aprovado', 'entrega_parcial', 'pago'].includes(produto.situacao);
    if (produto.avaliado_em || situacaoAprovada) {
      const avaliador = produto.usuarios?.nome_completo || entAprovada?.despachado_por_u?.nome_completo || 'Avaliador';
      const dtAprov = produto.avaliado_em
        || entAprovada?.despacho_data
        || (entAprovada?.despachado_em ? entAprovada.despachado_em.split('T')[0] : null);
      itens.push({ cls:'t-ok', ic:'check',
        titulo: `Avaliado — ${produto.pct_aprovado != null ? produto.pct_aprovado+'% aprovado' : 'aprovado'}`,
        data: `${dtAprov ? fmtData(dtAprov)+' · ' : ''}${avaliador}`,
        parecer: produto.parecer_avaliador });
    } else if (produto.dt_entrega) {
      itens.push({ cls:'t-al', ic:'busca', titulo:'Aguardando avaliação', data:'Produto entregue, pendente de avaliação' });
    }

    timelineHtml = `
      <div class="fi-sec">${fiIc('relogio','p')}Histórico do produto</div>
      <ul class="fi-tl">
        ${itens.map(i => `
          <li class="${i.cls}"><span class="d">${fiIc(i.ic,'p')}</span><div>
            <b>${esc(i.titulo)}</b>
            ${i.data ? `<small>${esc(i.data)}</small>` : ''}
            ${i.parecer ? `<q>${esc(i.parecer)}</q>` : ''}
          </div></li>`).join('')}
      </ul>`;
  }

  const CONTRIB_ST = { pendente:['fi-p-al','Pendente'], confirmado:['fi-p-ok','Confirmado'], rejeitado:['fi-p-er','Rejeitado'] };

  document.getElementById('pgto-body').innerHTML = `
    <div class="fi-pg-topo">
      ${semContrato ? `
        <div class="fi-quem"><span class="ico info">${fiIc('aviao')}</span><div><b>${esc(l.descricao||'—')}</b><small>Recurso executado diretamente pela UNESCO</small></div></div>
        <div class="fi-pg-ref"><span>Atividade</span><b>${esc(l.atividades?.codigo||'—')}</b></div>
      ` : `
        <div class="fi-quem"><span class="ico">${fiIc('predio')}</span><div><b>${esc(fornNome)}</b>
          ${fornData.cpf_cnpj ? `<small class="mono">${esc(fornData.cpf_cnpj)}</small>` : ''}
          ${fornData.email ? `<small>${esc(fornData.email)}</small>` : ''}</div></div>
        <div class="fi-pg-ref"><span>Contrato</span><b>${esc(contNum)}</b></div>
      `}
    </div>
    ${semContrato ? `
      <div class="fi-resumo">
        <div><span>Orçamento (estimado a ${fmtTaxa(taxaAtual)})</span><b>${fmtBRL(atTotais.orcamento)}</b></div>
        <div><span>Pago</span><b class="ok">${fmtBRL(atTotais.pago)}</b></div>
        <div><span>A pagar</span><b>${fmtBRL(atTotais.aPagar)}</b></div>
        <div><span>Saldo</span><b class="${atSaldo<0?'erro':''}">${fmtBRL(atSaldo)}</b></div>
      </div>` : `
      <div class="fi-resumo">
        <div><span>Total do contrato</span><b>${fmtBRL(ctTotais.total)}</b></div>
        <div><span>Aprovado</span><b>${fmtBRL(ctTotais.aprovado)}</b></div>
        <div><span>Pago</span><b class="ok">${fmtBRL(ctTotais.pago)}</b></div>
        <div><span>Saldo</span><b class="${ctSaldo<0?'erro':''}">${fmtBRL(ctSaldo)}</b></div>
      </div>`}

    <div class="fi-pg2">
      <div>
        <div class="fi-linhas">
          <div><span>Atividade</span><b>${esc(ativNome)}</b></div>
          <div><span>Vencimento</span><b class="${vencido?'erro':''}">${venc}${vencido?' · vencido':''}</b></div>
          <div><span>Valor do lançamento</span><b class="ok mono">${fmtBRL(l.valor_brl)}</b></div>
        </div>

        ${timelineHtml}

        ${entregaDocs.length ? `
          <div class="fi-sec">${fiIc('clipe','p')}Documentos da entrega ${esc(entregaInfo?.numero_entrega||'')}${entregaInfo?.dt_entrega?' · '+fmtData(entregaInfo.dt_entrega):''}</div>
          <div class="fi-docs">
            ${entregaDocs.map(d => `
              <div class="fi-doc"><span class="ico">${fiIc(d.tipo_documento==='Planilha de Geolocalização'?'pin':'doc')}</span>
                <div style="min-width:0"><b title="${esc(d.arquivo_nome||'')}">${esc(d.arquivo_nome||'Documento')}</b><small>${esc(d.tipo_documento||'')}</small></div>
                ${d.arquivo_url ? `<a href="#" class="fi-btn peq" data-arquivo="${esc(d.arquivo_url)}">${fiIc('olho','p')}Abrir</a>` : '<span></span>'}
              </div>`).join('')}
          </div>` : ''}
        ${entregaContribs.length ? `
          <div class="fi-sec">${fiIc('alvo','p')}Contribuição à Matriz de Resultados</div>
          <div class="fi-docs">
            ${entregaContribs.map(c => {
              const mi = c.matriz_itens || {};
              const st = CONTRIB_ST[c.status] || ['fi-p-ne', c.status || '—'];
              return `<div class="fi-contrib"><div style="min-width:0">
                  <small>R${esc(mi.resultado??'')} · ${esc(mi.produto_codigo||'')}</small>
                  <b>${esc(mi.indicador||'')}</b>
                  <span>Valor declarado: <b class="mono" style="display:inline">${parseFloat(c.valor||0).toLocaleString('pt-BR')}</b>${c.unidade?' '+esc(c.unidade):''}</span>
                </div><span class="fi-pill ${st[0]}">${esc(st[1])}</span></div>`;
            }).join('')}
          </div>` : ''}
      </div>

      <div>
        <div class="fi-sec">${fiIc('cartao','p')}Dados do pagamento</div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="pgto-data">Data do pagamento <span class="obrig">*</span></label>
            <input class="form-control" type="date" id="pgto-data" value="${hoje}">
          </div>
          <div class="form-group">
            <label class="form-label" for="pgto-nf">Nº NF / recibo</label>
            <input class="form-control mono" type="text" id="pgto-nf" placeholder="Ex.: NF-001234" value="${esc(l.numero_nf||'')}">
          </div>
        </div>
        <div class="form-group">
          <span class="form-label">Comprovante de transferência / pagamento</span>
          <button type="button" class="upload-mini${l.comprovante_url?' tem':''}" id="pgto-upload-wrap" onclick="document.getElementById('pgto-arquivo').click()">
            ${fiIc(l.comprovante_url?'check':'upload')}<b>${l.comprovante_url?'Comprovante já anexado · clique para substituir':'Anexar comprovante de pagamento'}</b>
            <span>Recibo bancário ou extrato — a NF vai em Produtos</span>
          </button>
          <input type="file" id="pgto-arquivo" hidden accept=".pdf,.jpg,.jpeg,.png" onchange="selecionarArquivoPgto(this.files[0])">
        </div>
        <div class="form-group">
          <label class="form-label" for="pgto-obs">Observações</label>
          <textarea class="form-control" id="pgto-obs" rows="2" placeholder="Ex.: Pago via TED, banco XXXX">${esc(l.observacoes||'')}</textarea>
        </div>

        <div class="fi-cambio">
          <div class="fi-sec">${fiIc('cambio','p')}Câmbio do pagamento</div>
          <div class="form-group">
            <label class="form-label" for="pgto-cotacao-unesco">Cotação UNESCO (UNORE) <span class="obrig">*</span></label>
            <input class="form-control mono" type="number" id="pgto-cotacao-unesco" step="0.0001" min="0.01"
              placeholder="Ex.: 5.6500" value="${taxaUnescoUltima ? taxaUnescoUltima.toFixed(4) : ''}"
              oninput="atualizarComparativoCotacao()">
            <div class="form-hint">Taxa operacional do período (UNORE)</div>
          </div>
          <div class="fi-ref">Cotação de mercado hoje: <b class="mono">${fmtTaxa(taxaLanc)}</b></div>
          <div id="pgto-usd-unesco" class="fi-ref">Informe a cotação UNESCO</div>
          <div id="pgto-comparativo" hidden></div>
        </div>
      </div>
    </div>`;

  document.getElementById('pgto-footer').innerHTML = `
    <button type="button" class="fi-btn" onclick="fecharModalPgto()">Cancelar</button>
    <button type="button" class="fi-btn pri" onclick="confirmarPagamento()">${fiIc('check','p')}Confirmar pagamento</button>`;
  atualizarComparativoCotacao();
  const foco = document.getElementById('pgto-data'); if (foco) foco.focus({preventScroll:true});
}

function atualizarComparativoCotacao() {
  const l = lancPagando;
  if (!l) return;
  const cotUNESCO = parseFloat(document.getElementById('pgto-cotacao-unesco')?.value) || 0;
  const valorBRL  = parseFloat(l.valor_brl || 0);
  const elUSD     = document.getElementById('pgto-usd-unesco');
  const elComp    = document.getElementById('pgto-comparativo');
  if (!cotUNESCO || cotUNESCO <= 0) {
    if (elUSD) { elUSD.hidden = false; elUSD.textContent = 'Informe a cotação UNESCO'; }
    if (elComp) elComp.hidden = true;
    return;
  }
  const usdUnesco  = valorBRL / cotUNESCO;
  const usdMercado = valorBRL / taxaAtual;
  const difUSD     = usdUnesco - usdMercado;
  const difPct     = (difUSD / usdMercado) * 100;
  const positivo   = difUSD >= 0;
  const f2 = v => v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  if (elUSD) elUSD.hidden = true;
  if (elComp) {
    elComp.hidden = false;
    elComp.innerHTML = `
      <div class="fi-cmp">
        <div><span>Pelo câmbio UNESCO (${fmtTaxa(cotUNESCO)})</span><b>US$ ${f2(usdUnesco)}</b></div>
        <div><span>Pelo mercado (${fmtTaxa(taxaAtual)})</span><b>US$ ${f2(usdMercado)}</b></div>
      </div>
      <div class="fi-imp"><span>Impacto do câmbio</span>
        <b class="${positivo?'ok':'erro'}">${positivo?'+':'−'}US$ ${f2(Math.abs(difUSD))} · ${f2(Math.abs(difPct))}% ${positivo?'a mais':'a menos'}</b></div>`;
  }
}

function abrirSenhaPgto() {
  if (!PERFIS_PAGAM.includes(appState.perfil)) {
    toast('Acesso negado. Apenas Super Admin e Financeiro podem efetivar pagamentos.', 'error');
    return;
  }
  const email = appState.sessao?.user?.email || '';
  const nome  = appState.usuario?.nome_completo || '';
  document.getElementById('senha-pgto-nome').textContent  = nome;
  document.getElementById('senha-pgto-email').textContent = email;
  document.getElementById('inp-senha-pgto').value = '';
  document.getElementById('senha-pgto-erro').hidden = true;
  fiAbrir('modal-senha-pgto');
}

function _btnSenha(txt, desab) {
  const btn = document.getElementById('btn-conf-senha');
  if (btn) { btn.disabled = !!desab; btn.innerHTML = desab ? txt : fiIc('chave','p') + txt; }
}
function _erroSenha(msg) {
  const el = document.getElementById('senha-pgto-erro');
  el.innerHTML = fiIc('alerta','p') + esc(msg); el.hidden = false;
}

function fecharSenhaPgto() {
  fiFechar('modal-senha-pgto');
  _btnSenha('Confirmar', false);
  const inp = document.getElementById('inp-senha-pgto');
  if (inp) inp.value = '';
  const erroEl = document.getElementById('senha-pgto-erro');
  if (erroEl) erroEl.hidden = true;
}

async function verificarSenhaEPagar() {
  const senha  = document.getElementById('inp-senha-pgto').value;
  document.getElementById('senha-pgto-erro').hidden = true;
  if (!senha) { _erroSenha('Informe sua senha.'); return; }
  _btnSenha('Verificando…', true);
  const email = appState.sessao?.user?.email || appState.usuario?.email || '';
  if (!email) {
    _erroSenha('Não foi possível identificar o e-mail da sessão. Recarregue a página.');
    _btnSenha('Confirmar', false);
    return;
  }
  try {
    const { error } = await db.auth.signInWithPassword({ email, password: senha });
    if (error) {
      _erroSenha('Senha incorreta. Tente novamente.');
      _btnSenha('Confirmar', false);
      document.getElementById('inp-senha-pgto').select();
      return;
    }
    fecharSenhaPgto();
    await executarPagamento();
  } catch(e) {
    console.error('[verificarSenhaEPagar]', e);
    _erroSenha('Erro de conexão. Verifique a internet e tente novamente.');
    _btnSenha('Confirmar', false);
  }
}

async function confirmarPagamento() {
  const dtPgto      = document.getElementById('pgto-data')?.value;
  const cotUNESCO   = parseFloat(document.getElementById('pgto-cotacao-unesco')?.value) || 0;
  if (!dtPgto)     { toast('Informe a data do pagamento.','error');    return; }
  if (!cotUNESCO)  { toast('Informe a cotação UNESCO (UNORE).','error'); return; }
  abrirSenhaPgto();
}

async function executarPagamento() {
  const dtPgto     = document.getElementById('pgto-data')?.value;
  const cotUNESCO  = parseFloat(document.getElementById('pgto-cotacao-unesco')?.value) || 0;
  const l          = lancPagando;
  const valorBRL   = parseFloat(l.valor_brl || 0);
  const nf         = document.getElementById('pgto-nf')?.value.trim() || l.numero_nf || null;
  const obs        = document.getElementById('pgto-obs')?.value.trim() || null;
  const usdUnesco  = parseFloat((valorBRL / cotUNESCO).toFixed(2));
  const usdMercado = parseFloat((valorBRL / taxaAtual).toFixed(2));
  const impactoUSD = parseFloat((usdUnesco - usdMercado).toFixed(2));

  // Lembra para próximo pagamento
  taxaUnescoUltima = cotUNESCO;

  try {
    const dados = {
      situacao:           'pago',
      dt_pagamento:       dtPgto,
      numero_nf:          nf,
      observacoes:        obs,
      cotacao_uso:        taxaAtual,
      cotacao_unesco:     cotUNESCO,
      cotacao_travada_em: new Date().toISOString(),
      valor_usd:          usdUnesco,
      valor_usd_unesco:   usdUnesco,
      impacto_usd:        impactoUSD,
      pago_por:           appState.usuario.id,
      atualizado_em:      new Date().toISOString()
    };

    const { error } = await db.from('execucao_financeira').update(dados).eq('id', l.id);
    if (error) throw error;

    // Marcar produto como pago em contratos_produtos (vínculo reverso via lancamento_id)
    const { data: prodsPagos } = await db.from('contratos_produtos')
      .update({ situacao: 'pago', atualizado_em: new Date().toISOString() })
      .eq('lancamento_id', l.id)
      .eq('situacao', 'aprovado')
      .select('id');

    // Notificar fornecedor por e-mail
    if (prodsPagos && prodsPagos.length) {
      const sess = await db.auth.getSession();
      const token = sess.data?.session?.access_token;
      for (const prod of prodsPagos) {
        try {
          const r = await fetch(SUPABASE_URL+'/functions/v1/enviar-email-produto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+token },
            body: JSON.stringify({ produto_id: prod.id, evento: 'pago' })
          });
          const result = await r.json();
          if (result.ok && result.enviados > 0) {
            await db.from('produto_notif_log').insert({ produto_id: prod.id, evento: 'pago', total_enviados: result.enviados, falhas: result.falhas||0, enviado_por: appState.usuario.id });
          }
        } catch(e) { console.error('Erro e-mail pago:', e); }
      }
    }

    // Upload comprovante se selecionado
    if (arquivoPgto) {
      const ext  = arquivoPgto.name.split('.').pop();
      const path = `comprovante-${l.id}.${ext}`;
      const { error: upErr } = await db.storage.from('financeiro-docs')
        .upload(path, arquivoPgto, { upsert: true, contentType: arquivoPgto.type });
      if (!upErr) {
        const { data: urlData } = db.storage.from('financeiro-docs').getPublicUrl(path);
        await db.from('execucao_financeira').update({
          comprovante_url:  urlData.publicUrl,
          comprovante_nome: arquivoPgto.name
        }).eq('id', l.id);
        dados.comprovante_url  = urlData.publicUrl;
        dados.comprovante_nome = arquivoPgto.name;
      }
    }

    // Atualiza local
    Object.assign(l, dados);
    fecharModalPgto();
    renderStats();
    renderConteudo();
    toast('Pagamento registrado com sucesso!', 'success');

  } catch(e) {
    toast('Erro ao registrar pagamento: ' + e.message, 'error');
  }
}

function selecionarArquivoPgto(file) {
  if (!file) return;
  arquivoPgto = file;
  const wrap = document.getElementById('pgto-upload-wrap');
  if (wrap) { wrap.classList.add('tem'); wrap.innerHTML = fiIc('check') + `<b>${esc(file.name)}</b><span>selecionado · clique para trocar</span>`; }
}

function fecharModalPgto() {
  fiFechar('modal-pgto');
  lancPagando = null; arquivoPgto = null;
}

function fecharModal() {
  fiFechar('modal-lanc');
  lancEditando = null; arquivoComp = null;
}

// ── Janelas: foco no primeiro campo, Esc fecha a de cima, Tab preso, foco volta ao sair ──
const FI_FOCAVEIS = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]):not([type=file]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const fiPilha = [];
function fiAbrir(id) {
  const el = document.getElementById(id); if (!el) return;
  el.classList.add('aberto');
  if (!fiPilha.some(x => x.el === el)) fiPilha.push({ el, volta: document.activeElement });
  requestAnimationFrame(() => {
    const alvo = el.querySelector('.modal-body :is(input:not([readonly]):not([type=checkbox]):not([type=file]):not([hidden]),select,textarea)') || el.querySelector(FI_FOCAVEIS);
    if (alvo) alvo.focus({ preventScroll: true });
  });
}
function fiFechar(id) {
  const el = document.getElementById(id); if (!el) return;
  el.classList.remove('aberto');
  const i = fiPilha.findIndex(x => x.el === el); if (i < 0) return;
  const volta = fiPilha.splice(i, 1)[0].volta;
  if (volta && document.contains(volta)) volta.focus({ preventScroll: true });
}
document.addEventListener('keydown', e => {
  const topo = fiPilha.length ? fiPilha[fiPilha.length - 1].el : null; if (!topo) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    if (topo.id === 'modal-senha-pgto') fecharSenhaPgto();
    else if (topo.id === 'modal-pgto') fecharModalPgto();
    else fecharModal();
  } else if (e.key === 'Tab') {
    const f = [...topo.querySelectorAll(FI_FOCAVEIS)].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const pri = f[0], ult = f[f.length - 1];
    if (!topo.contains(document.activeElement)) { e.preventDefault(); pri.focus(); }
    else if (e.shiftKey && document.activeElement === pri) { e.preventDefault(); ult.focus(); }
    else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
  }
});
</script>
