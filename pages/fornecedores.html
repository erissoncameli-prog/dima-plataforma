const FO_IC = {

  olho:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',

  seta:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',

function foIc(n, cls) { return '<svg class="fo-ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (FO_IC[n] || '') + '</svg>'; }
document.querySelectorAll('i[data-ic]').forEach(e => { e.outerHTML = foIc(e.dataset.ic); });

function brlc(v) { v = parseFloat(v || 0); const a = Math.abs(v); if (a >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' mi'; if (a >= 1e4) return 'R$ ' + Math.round(v/1e3) + ' mil'; return fmtBRL(v); }
function iniciais(nome) { return (nome || '?').trim().split(/\s+/).slice(0,2).map(n => n[0] || '').join('').toUpperCase(); }
function avatar(f) { return `<span class="fo-av${f.tipo==='PF'?' pf':''}" aria-hidden="true">${esc(iniciais(f.nome))}</span>`; }
function pillTipo(t) { return `<span class="fo-pill ${t==='PF'?'fo-p-ok':'fo-p-in'}" title="${t==='PF'?'Pessoa física':'Pessoa jurídica'}">${esc(t||'—')}</span>`; }
const PODE_EDITAR = () => PODE.verFinanceiro() || PODE.editarAtividade();

// ── VALIDAÇÃO CPF ─────────────────────────────────────────────
function validarCPF(cpf) {
  cpf = cpf.replace(/\D/g,'');
  if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
  let soma = 0, resto;
  for (let i=1; i<=9; i++) soma += parseInt(cpf[i-1]) * (11-i);
  resto = (soma*10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== parseInt(cpf[9])) return false;
  soma = 0;
  for (let i=1; i<=10; i++) soma += parseInt(cpf[i-1]) * (12-i);
  resto = (soma*10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  return resto === parseInt(cpf[10]);
}

// ── VALIDAÇÃO CNPJ ─────────────────────────────────────────────
function validarCNPJ(cnpj) {
  cnpj = cnpj.replace(/\D/g,'');
  if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;
  const calc = (cnpj, n) => {
    let soma = 0, pos = n - 7;
    for (let i = n; i >= 1; i--) {
      soma += parseInt(cnpj[n-i]) * pos--;
      if (pos < 2) pos = 9;
    }
    return soma % 11 < 2 ? 0 : 11 - (soma % 11);
  };
  return calc(cnpj,12) === parseInt(cnpj[12]) && calc(cnpj,13) === parseInt(cnpj[13]);
}

function mascaraDoc(val, tipo) {
  val = val.replace(/\D/g,'');
  if (tipo === 'PF') {
    return val.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4').substring(0,14);
  } else {
    return val.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5').substring(0,18);
  }
}

function mascaraFone(val) {
  val = val.replace(/\D/g,'').substring(0,11);
  if (val.length > 10) return val.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
  return val.replace(/(\d{2})(\d{4})(\d{4})/,'($1) $2-$3');
}

function mascaraCEP(val) {
  return val.replace(/\D/g,'').substring(0,8).replace(/(\d{5})(\d{3})/,'$1-$2');
}

function tipoAtual() { return document.querySelector('input[name="f-tipo"]:checked')?.value || 'PF'; }

function verificarDoc(val, tipo) {
  const num = val.replace(/\D/g,'');
  const el = document.getElementById('doc-status');
  if (!el) return;
  const inp = document.getElementById('f-doc');
  if (!num) { el.innerHTML=''; inp?.classList.remove('doc-valid','doc-invalid'); return; }
  const ok = tipo === 'PF' ? validarCPF(num) : validarCNPJ(num);
  const rot = tipo === 'PF' ? 'CPF' : 'CNPJ';
  el.innerHTML = ok
    ? `<span class="ds-ok">${foIc('check','p')}${rot} válido</span>`
    : `<span class="ds-err">${foIc('x','p')}${rot} inválido</span>`;
  if (inp) { inp.classList.toggle('doc-valid', ok); inp.classList.toggle('doc-invalid', !ok && num.length >= (tipo==='PF'?11:14)); }
}

// ── BUSCA CEP ─────────────────────────────────────────────────
async function buscarCEP() {
  const cep = document.getElementById('f-cep')?.value.replace(/\D/g,'');
  if (!cep || cep.length !== 8) return;
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d = await r.json();
    if (d.erro) { toast('CEP não encontrado.','warning'); return; }
    if (document.getElementById('f-logradouro')) document.getElementById('f-logradouro').value = d.logradouro||'';
    if (document.getElementById('f-bairro')) document.getElementById('f-bairro').value = d.bairro||'';
    if (document.getElementById('f-municipio')) document.getElementById('f-municipio').value = d.localidade||'';
    if (document.getElementById('f-uf')) document.getElementById('f-uf').value = d.uf||'';
    toast('Endereço preenchido automaticamente!','success');
    document.getElementById('f-numero')?.focus();
  } catch(e) { toast('Erro ao buscar CEP.','error'); }
}

// Tema claro/escuro: mesmo 'diag_tema' da mesa do Diagnóstico e das demais guias (componente .dgm-tema)
function seletorTema() {
  const tb = document.querySelector('.topbar'); if (!tb || tb.querySelector('.dgm-tema') || typeof DiagTema === 'undefined') return;
  const d = document.createElement('div');
  d.className = 'dgm-tema'; d.setAttribute('role','group'); d.setAttribute('aria-label','Tema');
  d.innerHTML = [['claro','sol','Claro'],['escuro','lua','Escuro']].map(x =>
    `<button type="button" data-tema="${x[0]}" aria-pressed="${DiagTema.atual()===x[0]}">${foIc(x[1])}${x[2]}</button>`).join('');
  const bc = tb.querySelector('.topbar-breadcrumb');
  if (bc) bc.parentNode.insertBefore(d, bc); else tb.appendChild(d);
  d.addEventListener('click', ev => {
    const b = ev.target.closest('[data-tema]'); if (!b) return;
    DiagTema.definir(b.dataset.tema);
    d.querySelectorAll('[data-tema]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
}

const BANCO_CAMPOS = ['banco', 'agencia', 'conta', 'tipo_conta', 'pix'];
const PODE_BANCO_PERFIS = ['super_admin', 'coordenacao', 'financeiro'];
let PODE_BANCO = false; // definido depois de carregarUsuario()

async function carregar() {
  PODE_BANCO = PODE_BANCO_PERFIS.includes(appState.perfil);
  try {
    const [{ data }, { data: conts }, { data: pagos }] = await Promise.all([
      db.from('fornecedores').select('*').order('nome'),
      db.from('contratos').select('fornecedor_id,status,valor_total_brl'),
      db.from('execucao_financeira').select('fornecedor_id,valor_brl').eq('situacao','pago'),
    ]);
    todosFornecedores = data || [];
    // Dados bancários ficam em tabela própria (migração 20261010_seg_usuarios_acessos): só super_admin,
    // coordenação e financeiro leem; para os demais a consulta volta vazia. Mesclados aqui para a tela.
    if (PODE_BANCO) {
      const { data: bancos } = await db.from('fornecedor_dados_bancarios').select('fornecedor_id,banco,agencia,conta,tipo_conta,pix');
      const porId = {}; (bancos || []).forEach(b => { porId[b.fornecedor_id] = b; });
      todosFornecedores.forEach(f => { const b = porId[f.id]; if (b) BANCO_CAMPOS.forEach(k => { f[k] = b[k]; }); });
    }
    contratosPorForn = {};
    (conts || []).forEach(c => {
      if (!c.fornecedor_id || c.status === 'cancelado') return;
      const x = contratosPorForn[c.fornecedor_id] || (contratosPorForn[c.fornecedor_id] = { total:0, vigentes:0, valorVigente:0 });
      x.total++;
      if (EM_VIGOR.includes(c.status)) { x.vigentes++; x.valorVigente += parseFloat(c.valor_total_brl || 0); }
    });
    pagoPorForn = {};
    (pagos || []).forEach(l => { if (l.fornecedor_id) pagoPorForn[l.fornecedor_id] = (pagoPorForn[l.fornecedor_id] || 0) + parseFloat(l.valor_brl || 0); });
    renderStats();
    filtrar();
  } catch(e) { console.error(e); toast('Erro ao carregar fornecedores.','error'); }
}

function clicarCardForn(card){
  filtroCardForn = (filtroCardForn===card) ? '' : card;
  // PF/PJ do topo = mesmo filtro do seletor de tipo
  if (card === 'PF' || card === 'PJ') { definirTipo(filtroCardForn ? card : '', true); }
  else if (filtroCardForn === 'total') { definirTipo('', true); }
  renderStats(); filtrar();
}

function definirTipo(t, semRender) {
  filtroTipo = t;
  document.querySelectorAll('#seg-tipo [data-tipo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tipo === t)));
  if (!semRender) {
    if (['PF','PJ'].includes(filtroCardForn) && filtroCardForn !== t) filtroCardForn = t || '';
    renderStats(); filtrar();
  }
}

function renderStats() {
  const ativos = todosFornecedores.filter(f=>f.ativo);
  const nPF = ativos.filter(f=>f.tipo==='PF').length;
  const nPJ = ativos.filter(f=>f.tipo==='PJ').length;
  const comVig = ativos.filter(f => contratosPorForn[f.id]?.vigentes);
  const valorVig = comVig.reduce((s,f) => s + contratosPorForn[f.id].valorVigente, 0);
  const inativos = todosFornecedores.length - ativos.length;
  const ap = c => String(filtroCardForn===c);
  document.getElementById('stats').innerHTML = `
    <button type="button" class="fo-kpi" aria-pressed="${ap('total')}" onclick="clicarCardForn('total')">
      <span class="fo-kpi-l">${foIc('pessoa','p')}Ativos</span>
      <span class="fo-kpi-v">${ativos.length}</span>
      <span class="fo-kpi-s">${inativos} inativo${inativos!==1?'s':''}</span>
    </button>
    <button type="button" class="fo-kpi" aria-pressed="${ap('PF')}" onclick="clicarCardForn('PF')">
      <span class="fo-kpi-l">${foIc('pessoa','p')}Pessoa física</span>
      <span class="fo-kpi-v">${nPF}</span>
      <span class="fo-kpi-s">consultores individuais</span>
    </button>
    <button type="button" class="fo-kpi" aria-pressed="${ap('PJ')}" onclick="clicarCardForn('PJ')">
      <span class="fo-kpi-l">${foIc('predio','p')}Pessoa jurídica</span>
      <span class="fo-kpi-v">${nPJ}</span>
      <span class="fo-kpi-s">empresas e cooperativas</span>
    </button>
    <button type="button" class="fo-kpi" aria-pressed="${ap('com_contrato')}" onclick="clicarCardForn('com_contrato')">
      <span class="fo-kpi-l">${foIc('contrato','p')}Com contrato vigente</span>
      <span class="fo-kpi-v ok">${comVig.length}</span>
      <span class="fo-kpi-s">${brlc(valorVig)} contratados</span>
    </button>`;
}

function filtrar() {
  const b = (document.getElementById('busca').value || '').toLowerCase().trim();
  const bDig = b.replace(/\D/g,'');
  const at = document.getElementById('fil-ativo').value;

  const fil = todosFornecedores.filter(f => {
    if (b && !(f.nome||'').toLowerCase().includes(b) &&
        !(f.cpf_cnpj||'').includes(b) &&
        !(bDig && (f.cpf_cnpj||'').replace(/\D/g,'').includes(bDig)) &&
        !(f.email||'').toLowerCase().includes(b) &&
        !(f.nome_fantasia||'').toLowerCase().includes(b)) return false;
    if (filtroTipo && f.tipo !== filtroTipo) return false;
    if (at !== '' && String(!!f.ativo) !== at) return false;
    if (filtroCardForn==='com_contrato' && !contratosPorForn[f.id]?.vigentes) return false;
    return true;
  });

  document.getElementById('cont').textContent = `${fil.length} de ${todosFornecedores.length} fornecedores`;

  const el = document.getElementById('lista');
  if (!fil.length) {
    el.innerHTML = `<div class="fo-card"><div class="fo-vazio" role="status">${foIc('busca')}Nenhum fornecedor encontrado.</div></div>`;
    return;
  }

  const podeEditar = PODE_EDITAR();
  el.innerHTML = `<div class="fo-card"><div class="fo-tbl-w"><table class="fo-tbl">
    <thead><tr><th>Fornecedor</th><th>CPF / CNPJ</th><th>Contato</th><th>Cidade</th><th>Contratos</th><th class="dir">Pago</th><th><span class="sr-only">Ações</span></th></tr></thead>
    <tbody>${fil.map(f => {
      const c = contratosPorForn[f.id];
      const pago = pagoPorForn[f.id] || 0;
      const cidade = f.cidade || f.municipio;
      const uf = f.estado || f.uf;
      const fone = f.telefone || f.whatsapp;
      return `<tr class="${f.ativo?'':'inativo'}">
        <td class="c-quem"><div class="fo-quem">${avatar(f)}<div style="min-width:0">
          <div class="fo-nome">${esc(f.nome)}</div>
          ${f.nome_fantasia?`<div class="fo-fant">${esc(f.nome_fantasia)}</div>`:''}
          <div class="fo-selos">${pillTipo(f.tipo)}
            ${f.contrato_url?`<span class="fo-pill fo-p-ne" title="${esc(f.contrato_nome||'Documento anexado ao cadastro')}">${foIc('clipe','p')}Documento</span>`:''}
            ${f.ativo?'':`<span class="fo-pill fo-p-ne">Inativo</span>`}</div>
        </div></div></td>
        <td class="c-doc">${f.cpf_cnpj?`<span class="fo-doc">${esc(f.cpf_cnpj)}</span>`:'<span class="fo-traco">—</span>'}</td>
        <td class="c-cont"><div class="fo-ct">${f.email?`<span>${esc(f.email)}</span>`:''}${fone?`<small>${esc(fone)}</small>`:''}${!f.email&&!fone?'<span class="fo-traco">—</span>':''}</div></td>
        <td class="c-cid fo-cid">${cidade?esc(cidade + (uf ? '/' + uf : '')):'<span class="fo-traco">—</span>'}</td>
        <td class="c-ctr">${c?`<span class="fo-pill ${c.vigentes?'fo-p-ok':'fo-p-ne'}">${c.vigentes} vigente${c.vigentes!==1?'s':''}</span><div class="fo-sub">de ${c.total} contrato${c.total!==1?'s':''}</div>`:'<span class="fo-traco">—</span>'}</td>
        <td class="c-pago dir"><span class="fo-val${pago?'':' zero'}">${pago?brlc(pago):'R$ 0'}</span></td>
        <td class="c-acoes"><div class="fo-acoes">
          <button type="button" class="fo-btn peq" onclick="abrirDetalhe('${f.id}')" aria-label="Detalhes de ${esc(f.nome)}">${foIc('olho','p')}Detalhes</button>
          ${podeEditar?`<button type="button" class="fo-btn ic" onclick="abrirEditar('${f.id}')" aria-label="Editar ${esc(f.nome)}" title="Editar">${foIc('lapis','p')}</button>`:''}
        </div></td>
      </tr>`;
    }).join('')}</tbody></table></div></div>`;
}

// ── Abas da janela ────────────────────────────────────────────
function abasHTML(abas) {
  return `<div class="fo-tabs" role="tablist">${abas.map((a,i) =>
    `<button type="button" class="fo-tab" role="tab" data-aba="${a[0]}" aria-selected="${i===0}" onclick="aba('${a[0]}')">${a[1]}</button>`).join('')}</div>`;
}
function aba(id) {
  document.querySelectorAll('#m-body .fo-painel').forEach(e => e.classList.toggle('ativo', e.id === 'tab-' + id));
  document.querySelectorAll('#m-body .fo-tab').forEach(e => e.setAttribute('aria-selected', String(e.dataset.aba === id)));
}

// ── DETALHE ───────────────────────────────────────────────────
const ST_CONTRATO = { vigente:['fo-p-ok','check','Vigente'], encerrado:['fo-p-ne','check','Encerrado'], suspenso:['fo-p-al','pausa','Suspenso'],
  aguardando_cobertura:['fo-p-er','cadeado','Aguardando cobertura'], cancelado:['fo-p-riscado','x','Cancelado'] };
function pillContrato(s) { const p = ST_CONTRATO[s] || ['fo-p-ne','info', s || '—']; return `<span class="fo-pill ${p[0]}">${foIc(p[1],'p')}${esc(p[2])}</span>`; }
const SIT_LANC = { pago:['fo-p-ok','check'], a_pagar:['fo-p-al','relogio'], cancelado:['fo-p-ne','x'] };
function pillSit(s) { const p = SIT_LANC[s] || ['fo-p-ne','info']; return `<span class="fo-pill ${p[0]}">${foIc(p[1],'p')}${esc(t('situacao', s) || s || '—')}</span>`; }

async function abrirDetalhe(id) {
  try {
  const f = todosFornecedores.find(x=>x.id===id);
  if (!f) return;
  fornEditando = f;
  document.getElementById('m-av').innerHTML = avatar(f);
  document.getElementById('m-titulo').textContent = f.nome;
  document.getElementById('m-sub').textContent = `${f.tipo} · ${f.cpf_cnpj||'—'}${(f.cidade||f.municipio)?' · '+(f.cidade||f.municipio)+((f.estado||f.uf)?'/'+(f.estado||f.uf):''):''}`;
  document.getElementById('m-body').innerHTML = `<div class="fo-carregando" role="status">Carregando…</div>`;
  document.getElementById('m-footer').innerHTML = '';
  foAbrir();

  // Contratos base
  const {data:contratosBase, error:cErr} = await db.from('contratos')
    .select('id,numero,objeto_pt,status,valor_total_brl,valor_utilizado_brl,valor_comprometido_brl,saldo_brl,dt_inicio,dt_fim,tdr_id,atividade_id')
    .eq('fornecedor_id',id).order('dt_inicio',{ascending:false});
  if(cErr) console.error('contratos query error:',cErr);

  // Enriquecer com TDR e Atividade em queries separadas
  let contratos = contratosBase||[];
  if(contratos.length){
    const tdrIds=[...new Set(contratos.map(c=>c.tdr_id).filter(Boolean))];
    const atIds=[...new Set(contratos.map(c=>c.atividade_id).filter(Boolean))];
    const [{data:tdrsData},{data:ativsData}] = await Promise.all([
      tdrIds.length ? db.from('tdrs').select('id,numero,objeto_pt').in('id',tdrIds) : {data:[]},
      atIds.length  ? db.from('atividades').select('id,codigo,nome_pt').in('id',atIds) : {data:[]},
    ]);
    const tdrMap=Object.fromEntries((tdrsData||[]).map(t=>[t.id,t]));
    const atMap=Object.fromEntries((ativsData||[]).map(a=>[a.id,a]));
    contratos=contratos.map(c=>({...c,tdr:tdrMap[c.tdr_id]||null,atividade:atMap[c.atividade_id]||null}));
  }

  // Lançamentos: totais com TODOS; a tabela mostra os 10 mais recentes
  const {data:lancamentos} = await db.from('execucao_financeira')
    .select('valor_brl,situacao,dt_pagamento,descricao,numero_nf,criado_em')
    .eq('fornecedor_id',id).order('criado_em',{ascending:false});
  if (fornEditando !== f) return; // janela fechada/trocada enquanto carregava
  const lancs = lancamentos || [];
  const soma = arr => arr.reduce((s,l)=>s+parseFloat(l.valor_brl||0),0);
  const totalPago = soma(lancs.filter(l=>l.situacao==='pago'));
  const totalAPagar = soma(lancs.filter(l=>l.situacao==='a_pagar'));
  const notasCount = lancs.filter(l=>l.numero_nf).length;
  const recentes = lancs.slice(0, 10);

  const c = (label, valor, mono) => valor ? `<div class="fo-campo"><span>${label}</span><b class="${mono?'mono':''}">${esc(valor)}</b></div>` : '';
  const cidadeUf = (f.cidade||f.municipio) && (f.estado||f.uf) ? `${f.cidade||f.municipio} / ${f.estado||f.uf}` : (f.cidade||f.municipio||f.estado||f.uf);

  document.getElementById('m-body').innerHTML = `
    ${abasHTML([
      ['dados','Dados cadastrais'],
      ['financeiro','Financeiro'],
      ['contratos',`Contratos <span class="n">${contratos.length}</span>`],
    ])}

    <div class="fo-painel ativo" id="tab-dados" role="tabpanel">
      <div class="fo-dados">
        <div>
          <div class="fo-sec">Identificação</div>
          ${c(f.tipo==='PJ'?'Razão social':'Nome', f.nome)}
          ${c('Nome fantasia', f.nome_fantasia)}
          ${c(f.tipo==='PJ'?'CNPJ':'CPF', f.cpf_cnpj, true)}
          ${f.tipo==='PJ'?c('Inscrição estadual', f.inscricao_estadual, true):''}
          ${f.tipo==='PJ'?c('Inscrição municipal', f.inscricao_municipal, true):''}
          <div class="fo-sec">Contato</div>
          ${c('Telefone', f.telefone)}
          ${c('WhatsApp', f.whatsapp)}
          ${c('E-mail', f.email)}
        </div>
        <div>
          <div class="fo-sec">Endereço</div>
          ${c('CEP', f.cep, true)}
          ${c('Logradouro', f.logradouro)}
          ${c('Número', f.numero_end)}
          ${c('Complemento', f.complemento)}
          ${c('Bairro', f.bairro)}
          ${c('Cidade / UF', cidadeUf)}
          <div class="fo-sec">Responsável</div>
          ${c('Nome', f.responsavel_nome)}
          ${c('Cargo', f.responsavel_cargo)}
        </div>
      </div>
      <div class="fo-sec">Dados bancários</div>
      ${PODE_BANCO ? '' : '<p class="fo-sub" style="margin:0 0 8px">Visíveis só para super_admin, coordenação e financeiro.</p>'}
      <div class="fo-dados">
        <div>${c('Banco', f.banco)}${c('Agência', f.agencia, true)}${c('Conta', f.conta, true)}</div>
        <div>${c('Tipo de conta', f.tipo_conta)}${c('PIX', f.pix, true)}</div>
      </div>
      ${f.contrato_url?`<div class="fo-sec">Documento do cadastro</div>
        <div class="fo-anexo">${foIc('clipe','p')}<b>${esc(f.contrato_nome||'Documento')}</b>
          <a href="#" class="fo-btn peq" data-arquivo="${esc(f.contrato_url)}">${foIc('olho','p')}Abrir</a></div>`:''}
      ${f.observacoes?`<div class="fo-sec">Observações</div><div class="fo-obs">${esc(f.observacoes)}</div>`:''}
    </div>

    <div class="fo-painel" id="tab-financeiro" role="tabpanel">
      <div class="fo-resumo">
        <div><span>Pago</span><b class="ok">${fmtBRL(totalPago)}</b></div>
        <div><span>A pagar</span><b>${fmtBRL(totalAPagar)}</b></div>
        <div><span>Notas fiscais registradas</span><b>${notasCount}</b></div>
      </div>
      ${recentes.length ? `
        <div class="fo-nota">${lancs.length > 10 ? `Mostrando os 10 lançamentos mais recentes de ${lancs.length}. Os totais acima somam todos.` : `${lancs.length} lançamento${lancs.length!==1?'s':''}.`}
          <a href="financeiro.html">Ver todos no Financeiro</a></div>
        <div style="overflow-x:auto"><table class="fo-mini">
          <thead><tr><th>Descrição</th><th>NF</th><th>Pagamento</th><th class="dir">Valor</th><th>Situação</th></tr></thead>
          <tbody>${recentes.map(l=>`<tr>
            <td>${esc(l.descricao||'—')}</td>
            <td class="mono">${esc(l.numero_nf||'—')}</td>
            <td>${l.dt_pagamento?fmtData(l.dt_pagamento):'—'}</td>
            <td class="dir mono">${fmtBRL(l.valor_brl)}</td>
            <td>${pillSit(l.situacao)}</td>
          </tr>`).join('')}</tbody></table></div>` :
        `<div class="fo-vazio">${foIc('doc')}Nenhum lançamento registrado.</div>`}
    </div>

    <div class="fo-painel" id="tab-contratos" role="tabpanel">
      ${renderContratos(contratos)}
    </div>
  `;

  document.getElementById('m-footer').innerHTML = `
    <button type="button" class="fo-btn" onclick="fecharModal()">Fechar</button>
    ${PODE_EDITAR()?`<button type="button" class="fo-btn pri" onclick="abrirEditar('${f.id}')">${foIc('lapis','p')}Editar cadastro</button>`:''}`;
  } catch(e) {
    console.error('abrirDetalhe error:',e);
    toast('Erro ao carregar detalhes do fornecedor.','error');
  }
}

function renderContratos(contratos){
  const rodape = `<div class="fo-nota">${foIc('info','p')}Para cadastrar um contrato, use a guia <a href="contratos.html">Contratos</a>.</div>`;
  if(!contratos.length) return `<div class="fo-vazio">${foIc('contrato')}Nenhum contrato vinculado.</div>` + rodape;

  const ativos = contratos.filter(c => c.status !== 'cancelado');
  const totTotal = ativos.reduce((s,c)=>s+parseFloat(c.valor_total_brl||0),0);
  const totPago = ativos.reduce((s,c)=>s+parseFloat(c.valor_utilizado_brl||0),0);
  const totComp = ativos.reduce((s,c)=>s+parseFloat(c.valor_comprometido_brl||c.valor_utilizado_brl||0),0);

  const cards = contratos.map(c => {
    const total = parseFloat(c.valor_total_brl||0);
    const pago = parseFloat(c.valor_utilizado_brl||0);            // só o pago
    const comp = parseFloat(c.valor_comprometido_brl||pago);       // pago + a pagar
    const livre = total - comp;
    const pp = total>0 ? Math.min(100, pago/total*100) : 0;
    const pc = total>0 ? Math.min(100 - pp, Math.max(0, comp-pago)/total*100) : 0;
    return `<div class="fo-ccard">
      <div class="t"><span class="fo-cod">${esc(c.numero||'—')}</span>${pillContrato(c.status)}
        ${c.dt_inicio&&c.dt_fim?`<span class="dt">${fmtData(c.dt_inicio)} → ${fmtData(c.dt_fim)}</span>`:''}
        <a href="contratos.html" class="fo-btn peq">${foIc('seta','p')}Abrir em Contratos</a></div>
      ${c.objeto_pt?`<div class="obj">${esc(c.objeto_pt)}</div>`:''}
      ${c.atividade||c.tdr?`<div class="fo-selos">
        ${c.atividade?`<span class="fo-pill fo-p-ne" title="${esc(c.atividade.nome_pt||'')}">Atividade ${esc(c.atividade.codigo)}</span>`:''}
        ${c.tdr?`<span class="fo-pill fo-p-ne">TDR ${esc(c.tdr.numero)}</span>`:''}</div>`:''}
      ${total>0?`<div class="fo-exec">
        <div class="fo-meter" role="img" aria-label="Pago ${fmtBRL(pago)}, comprometido ${fmtBRL(comp)} de ${fmtBRL(total)}"><i class="pago" style="width:${pp}%"></i><i class="comp" style="width:${pc}%"></i></div>
        <div class="ln"><span>de <b>${fmtBRL(total)}</b></span><span>Pago <b class="ok">${fmtBRL(pago)}</b> · a pagar <b>${fmtBRL(Math.max(0,comp-pago))}</b> · livre <b>${fmtBRL(livre)}</b></span></div>
      </div>`:''}
    </div>`;
  }).join('');

  const resumo = contratos.length > 1 ? `<div class="fo-resumo">
      <div><span>Contratado (${ativos.length} contrato${ativos.length!==1?'s':''})</span><b>${fmtBRL(totTotal)}</b></div>
      <div><span>Pago</span><b class="ok">${fmtBRL(totPago)}</b></div>
      <div><span>A pagar</span><b>${fmtBRL(Math.max(0, totComp - totPago))}</b></div>
    </div>` : '';
  return resumo + cards + rodape;
}

function abrirNovo() {
  fornEditando = null;
  arquivoContrato = null;
  document.getElementById('m-av').innerHTML = '';
  document.getElementById('m-titulo').textContent = 'Novo fornecedor';
  document.getElementById('m-sub').textContent = '';
  renderForm(null);
  document.getElementById('m-footer').innerHTML = `
    <button type="button" class="fo-btn" onclick="fecharModal()">Cancelar</button>
    <button type="button" class="fo-btn pri" id="btn-salvar-forn" onclick="salvar()">${foIc('check','p')}Criar fornecedor</button>`;
  foAbrir();
}

function abrirEditar(id) {
  fornEditando = todosFornecedores.find(f=>f.id===id);
  if (!fornEditando) return;
  arquivoContrato = null;
  document.getElementById('m-av').innerHTML = avatar(fornEditando);
  document.getElementById('m-titulo').textContent = 'Editar fornecedor';
  document.getElementById('m-sub').textContent = fornEditando.nome + (fornEditando.cpf_cnpj ? ' · ' + fornEditando.cpf_cnpj : '');
  renderForm(fornEditando);
  document.getElementById('m-footer').innerHTML = `
    ${!fornEditando.ativo
      ? `<button type="button" class="fo-btn esq" onclick="alterarAtivo('${fornEditando.id}',true)">${foIc('check','p')}Reativar</button>`
      : `<button type="button" class="fo-btn perigo esq" onclick="alterarAtivo('${fornEditando.id}',false)">${foIc('x','p')}Desativar</button>`}
    <button type="button" class="fo-btn" onclick="fecharModal()">Cancelar</button>
    <button type="button" class="fo-btn pri" id="btn-salvar-forn" onclick="salvar()">${foIc('check','p')}Salvar alterações</button>`;
  foAbrir();
}

          <option value="">Selecione…</option>
          ${['Corrente','Poupança','Pagamento'].map(t=>`<option value="${t}" ${f?.tipo_conta===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-pix">Chave PIX</label>
        <input class="form-control mono" id="f-pix" type="text" ${PODE_BANCO?'':'disabled'} value="${v(f?.pix)}" placeholder="CPF, CNPJ, e-mail, telefone ou chave aleatória">
      </div>
    </div>

    <div class="fo-painel" id="tab-documento" role="tabpanel">
      <span class="form-label">Documento / contrato assinado (.pdf ou .docx)</span>
      ${f?.contrato_url ? `<div class="fo-anexo" style="margin-top:8px">${foIc('clipe','p')}<b>${esc(f.contrato_nome||'Documento')}</b>
          <a href="#" class="fo-btn peq" data-arquivo="${esc(f.contrato_url)}">${foIc('olho','p')}Abrir</a></div>` : ''}
      <button type="button" class="upload-zone ${f?.contrato_url?'tem-arquivo':''}" id="upload-doc-forn" style="margin-top:8px"
        onclick="document.getElementById('inp-doc-forn').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="onDropForn(event)">
        ${foIc('upload')}
        <b id="doc-forn-txt">${f?.contrato_url?'Substituir o arquivo atual':'Arraste o arquivo ou clique para selecionar'}</b>
        <span>.pdf · .docx · .doc — até 10 MB</span>
      </button>
      <input type="file" id="inp-doc-forn" accept=".pdf,.docx,.doc" hidden onchange="selecionarDocForn(this.files[0])">
    </div>
  `;

  if (f?.cpf_cnpj) setTimeout(() => verificarDoc(f.cpf_cnpj, f.tipo), 100);
}

function trocarTipo(tipo) {
  const grpF = document.getElementById('grp-fantasia');
  const grpIe = document.getElementById('grp-ie');
  const lblDoc = document.getElementById('lbl-doc');
  const lblNome = document.getElementById('lbl-nome');
  const inpDoc = document.getElementById('f-doc');
  if (grpF) grpF.hidden = tipo !== 'PJ';
  if (grpIe) grpIe.hidden = tipo !== 'PJ';
  if (lblDoc) lblDoc.innerHTML = `${tipo==='PF'?'CPF':'CNPJ'} <span class="obrig">*</span>`;
  if (lblNome) lblNome.innerHTML = `${tipo==='PJ'?'Razão social':'Nome completo'} <span class="obrig">*</span>`;
  if (inpDoc) {
    inpDoc.placeholder = tipo==='PF'?'000.000.000-00':'00.000.000/0000-00';
    inpDoc.value = '';
    verificarDoc('', tipo);
  }
}

function onDropForn(e) {
  e.preventDefault();
  document.getElementById('upload-doc-forn').classList.remove('drag');
  selecionarDocForn(e.dataTransfer.files[0]);
}

function selecionarDocForn(file) {
  if (!file) return;
  arquivoContrato = file;
  const zone = document.getElementById('upload-doc-forn');
  const txt = document.getElementById('doc-forn-txt');
  zone.classList.add('tem-arquivo');
  if (txt) txt.textContent = `${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
  toast('Arquivo selecionado. Salve o formulário para fazer upload.','info');
}

async function salvar() {
  const btnSalvar = document.getElementById('btn-salvar-forn');
  if (btnSalvar?.disabled) return; // evita duplo-clique/duplo-submit
  if (btnSalvar) btnSalvar.disabled = true;

  try {
  const tipo = tipoAtual();
  const nome = document.getElementById('f-nome')?.value.trim();
  const doc = document.getElementById('f-doc')?.value.replace(/\D/g,'');

  if (!nome) { aba('identificacao'); toast('Preencha o nome/razão social.','error'); return; }
  const emailVal = document.getElementById('f-email')?.value.trim();
  if (!emailVal) { aba('identificacao'); toast('O campo e-mail é obrigatório para envio de notificações.','error'); document.getElementById('f-email')?.focus(); return; }
  if (doc) {
    const ok = tipo === 'PF' ? validarCPF(doc) : validarCNPJ(doc);
    if (!ok) { aba('identificacao'); toast(`${tipo==='PF'?'CPF':'CNPJ'} inválido. Verifique antes de salvar.`,'error'); return; }
    // Verificar duplicata antes de tentar inserir
    const duplicata = todosFornecedores.find(f =>
      f.id !== fornEditando?.id &&
      (f.cpf_cnpj||'').replace(/\D/g,'') === doc
    );
    if (duplicata) {
      if (!duplicata.ativo) {
        toast(`Este ${tipo==='PF'?'CPF':'CNPJ'} pertence a "${duplicata.nome}" que está inativo. Abra o cadastro e clique em "Reativar".`,'error');
      } else {
        toast(`${tipo==='PF'?'CPF':'CNPJ'} já cadastrado para "${duplicata.nome}".`,'error');
      }
      return;
    }
  }

  const dados = {
    tipo, nome,
    nome_fantasia: document.getElementById('f-fantasia')?.value.trim()||null,
    cpf_cnpj: document.getElementById('f-doc')?.value||null,
    inscricao_estadual: document.getElementById('f-ie')?.value.trim()||null,
    inscricao_municipal: document.getElementById('f-im')?.value.trim()||null,
    telefone: document.getElementById('f-tel')?.value||null,
    whatsapp: document.getElementById('f-wpp')?.value||null,
    email: document.getElementById('f-email')?.value.trim()||null,
    responsavel_nome: document.getElementById('f-resp-nome')?.value.trim()||null,
    responsavel_cargo: document.getElementById('f-resp-cargo')?.value.trim()||null,
    observacoes: document.getElementById('f-obs')?.value.trim()||null,
    cep: document.getElementById('f-cep')?.value||null,
    logradouro: document.getElementById('f-logradouro')?.value.trim()||null,
    numero_end: document.getElementById('f-numero')?.value.trim()||null,
    complemento: document.getElementById('f-complemento')?.value.trim()||null,
    bairro: document.getElementById('f-bairro')?.value.trim()||null,
    municipio: document.getElementById('f-municipio')?.value.trim()||null,
    cidade: document.getElementById('f-municipio')?.value.trim()||null,
    uf: document.getElementById('f-uf')?.value||null,
    estado: document.getElementById('f-uf')?.value||null,
    banco: document.getElementById('f-banco')?.value.trim()||null,
    agencia: document.getElementById('f-agencia')?.value.trim()||null,
    conta: document.getElementById('f-conta')?.value.trim()||null,
    tipo_conta: document.getElementById('f-tipo-conta')?.value||null,
    pix: document.getElementById('f-pix')?.value.trim()||null,
  };
  // banco vai para fornecedor_dados_bancarios; `fornecedores` recusa esses campos
  const banco = {}; BANCO_CAMPOS.forEach(k => { banco[k] = dados[k]; delete dados[k]; });
  const temBanco = BANCO_CAMPOS.some(k => banco[k]);

  try {
    let id = fornEditando?.id;

    if (!fornEditando) {
      // ativo e criado_por só no cadastro novo (editar não reativa nem troca o autor)
      const {data,error} = await db.from('fornecedores').insert({ ...dados, ativo: true, criado_por: appState.usuario.id }).select().single();
      if (error) {
        if (error.code==='23505') {
          const docNum = doc||'';
          const existente = todosFornecedores.find(f=>(f.cpf_cnpj||'').replace(/\D/g,'')===docNum);
          if (existente && !existente.ativo)
            toast(`Este ${tipo==='PF'?'CPF':'CNPJ'} pertence a "${existente.nome}" que está inativo. Abra o cadastro e clique em "Reativar".`,'error');
          else if (existente)
            toast(`${tipo==='PF'?'CPF':'CNPJ'} já cadastrado para "${existente.nome}".`,'error');
          else
            toast(`${tipo==='PF'?'CPF':'CNPJ'} já existe no sistema. Verifique fornecedores inativos.`,'error');
          return;
        }
        throw error;
      }
      id = data.id;
      if (PODE_BANCO && temBanco) {
        const { error: bErr } = await db.from('fornecedor_dados_bancarios').upsert({ fornecedor_id: id, ...banco }, { onConflict: 'fornecedor_id' });
        if (bErr) toast('Fornecedor salvo, mas os dados bancários não: ' + bErr.message, 'error'); else Object.assign(data, banco);
      }
      todosFornecedores.push(data);
      todosFornecedores.sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
      toast(`Fornecedor ${dados.nome} cadastrado!`,'success');
    } else {
      const {error} = await db.from('fornecedores').update(dados).eq('id',fornEditando.id);
      if (error) throw error;
      Object.assign(fornEditando, dados);
      const mudouBanco = BANCO_CAMPOS.some(k => (banco[k] || null) !== (fornEditando[k] || null));
      if (PODE_BANCO && mudouBanco) {
        const { error: bErr } = await db.from('fornecedor_dados_bancarios').upsert({ fornecedor_id: fornEditando.id, ...banco }, { onConflict: 'fornecedor_id' });
        if (bErr) toast('Dados salvos, mas os dados bancários não: ' + bErr.message, 'error'); else Object.assign(fornEditando, banco);
      }
      toast('Fornecedor atualizado!','success');
    }

    // Upload do documento se houver
    if (arquivoContrato && id) {
      const ext = arquivoContrato.name.split('.').pop();
      const path = `fornecedor-${id}/contrato-assinado.${ext}`;
      const {error:upErr} = await db.storage.from('tdrs-arquivos')
        .upload(path, arquivoContrato, {upsert:true});
      if (!upErr) {
        const {data:urlData} = db.storage.from('tdrs-arquivos').getPublicUrl(path);
        await db.from('fornecedores').update({
          contrato_url: urlData.publicUrl,
          contrato_nome: arquivoContrato.name
        }).eq('id',id);
        const forn = todosFornecedores.find(f=>f.id===id);
        if (forn) { forn.contrato_url=urlData.publicUrl; forn.contrato_nome=arquivoContrato.name; }
        toast('Documento carregado com sucesso!','success');
      }
    }

    fecharModal();
    renderStats();
    filtrar();
  } catch(e) {
    toast('Erro ao salvar: '+(e.message||''),'error');
  }
  } finally {
    if (btnSalvar) btnSalvar.disabled = false;
  }
}

async function alterarAtivo(id, ativo) {
  const { error } = await db.from('fornecedores').update({ativo}).eq('id',id);
  if (error) { toast('Erro: '+(error.message||''),'error'); return; }
  const f = todosFornecedores.find(x=>x.id===id);
  if (f) f.ativo = ativo;
  fecharModal();
  renderStats(); filtrar();
  toast(ativo?'Fornecedor reativado.':'Fornecedor desativado.','success');
}

// ── Janela: foco no primeiro campo, Esc fecha, Tab preso, foco volta ao sair ──
const FO_FOCAVEIS = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]):not([type=file]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let foVolta = null;
function foAbrir() {
  const el = document.getElementById('modal-forn');
  if (!el.classList.contains('aberto')) foVolta = document.activeElement;
  el.classList.add('aberto');
  requestAnimationFrame(() => {
    const alvo = el.querySelector('.modal-body .fo-painel.ativo :is(input:not([type=radio]):not([type=file]):not([hidden]),select,textarea)') || el.querySelector('.modal-close');
    if (alvo) alvo.focus({ preventScroll: true });
  });
}
function fecharModal() {
  const el = document.getElementById('modal-forn');
  el.classList.remove('aberto');
  fornEditando = null; arquivoContrato = null;
  if (foVolta && document.contains(foVolta)) foVolta.focus({ preventScroll: true });
  foVolta = null;
}
document.addEventListener('keydown', e => {
  const el = document.getElementById('modal-forn');
  if (!el.classList.contains('aberto')) return;
  if (e.key === 'Escape') { e.preventDefault(); fecharModal(); }
  else if (e.key === 'Tab') {
    const f = [...el.querySelectorAll(FO_FOCAVEIS)].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const pri = f[0], ult = f[f.length - 1];
    if (!el.contains(document.activeElement)) { e.preventDefault(); pri.focus(); }
    else if (e.shiftKey && document.activeElement === pri) { e.preventDefault(); ult.focus(); }
    else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
  }
});
</script>
