// Aplica o último estilo salvo nos campos do formulário e faz preview ao vivo
function _aplicarUltimoEstilo(){
  if(!_carUltimoEstilo) return;
  const u = _carUltimoEstilo;
  const fo  = Math.round((u.fill_opacity ?? 0.18) * 100);
  const sw  = u.stroke_width ?? 1.5;
  const fillEl   = document.getElementById('cs-fill');
  const foEl     = document.getElementById('cs-fo');
  const foValEl  = foEl?.nextElementSibling;
  const strokeEl = document.getElementById('cs-stroke');
  const swEl     = document.getElementById('cs-sw');
  const swValEl  = swEl?.nextElementSibling;
  if(fillEl   && u.fill_color)   fillEl.value   = u.fill_color;
  if(foEl)                        foEl.value     = fo;
  if(foValEl)                     foValEl.textContent = fo + '%';
  if(strokeEl && u.stroke_color) strokeEl.value = u.stroke_color;
  if(swEl)                        swEl.value     = sw;
  if(swValEl)                     swValEl.textContent = sw + 'px';
  _previewCarEstilo(); // aplica visualmente no mapa
}

function _previewCarEstilo(){
  if(!_carAbertoFeat) return;
  const cod  = _carAbertoFeat.properties?.cod_imovel;
  const cur  = _carMarcados.get(cod) || {};
  const prev = {
    ...cur,
    fill_color:   document.getElementById('cs-fill')?.value   || cur.fill_color,
    fill_opacity: (document.getElementById('cs-fo')?.value    || 18) / 100,
    stroke_color: document.getElementById('cs-stroke')?.value || cur.stroke_color,
    stroke_width: parseFloat(document.getElementById('cs-sw')?.value || 1.5),
  };
  // Atualiza somente o layer deste CAR (preview ao vivo)
  _carLayer?.eachLayer(l => {
    if(l.feature?.properties?.cod_imovel !== cod) return;
    const isSel = _carSelecionado === l;
    _carMarcados.set(cod, prev); // temporário para o _estiloCAR funcionar
    l.setStyle(_estiloCAR(l.feature, false, isSel));
  });
}

async function salvarCarEstilo(){
  if(!_carAbertoFeat) return;
  const cod = _carAbertoFeat.properties?.cod_imovel;
  const p   = _carAbertoFeat.properties || {};
  const payload = {
    cod_imovel:   cod,
    fill_color:   document.getElementById('cs-fill')?.value   || null,
    fill_opacity: (document.getElementById('cs-fo')?.value    || 18) / 100,
    stroke_color: document.getElementById('cs-stroke')?.value || null,
    stroke_width: parseFloat(document.getElementById('cs-sw')?.value || 1.5),
    area:      parseFloat(p.area)    || null,
    municipio: p.municipio           || null,
    condicao:  p.condicao            || null,
    atualizado_em: new Date().toISOString(),
  };
  // Inclui fill_color/stroke_color mesmo que null (upsert limpa campos anteriores)
  const { error } = await db.from('car_marcados').upsert(payload, { onConflict:'cod_imovel' });
  if(error){ toast('Erro ao salvar: ' + error.message, 'error'); return; }
  _carMarcados.set(cod, payload);
  // Guarda como último estilo para o botão "Repetir"
  _carUltimoEstilo = {
    fill_color:   payload.fill_color,
    fill_opacity: payload.fill_opacity,
    stroke_color: payload.stroke_color,
    stroke_width: payload.stroke_width,
    cod_imovel:   cod,
  };
  _atualizarLayerCAR(cod);
  _atualizarBtnMarcar();
  _atualizarContadorPins();
  _renderCarDetBody(); // re-renderiza para mostrar o botão Repetir no próximo CAR
  toast('Estilo salvo!', 'success');
}

async function restaurarCarEstilo(){
  if(!_carAbertoFeat) return;
  const cod = _carAbertoFeat.properties?.cod_imovel;
  _carMarcados.delete(cod);
  await db.from('car_marcados').delete().eq('cod_imovel', cod);
  _atualizarLayerCAR(cod);
  _renderCarDetBody(); // re-render aba estilo com valores padrão
  _atualizarBtnMarcar();
  _atualizarContadorPins();
  toast('Estilo restaurado ao padrão', 'info');
}

// ── Aba Diagnóstico ───────────────────────────────────────────────────────
let _carDiagCache = new Map(); // cod_imovel → dados calculados

function _htmlCarDiagLoading(){
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:10px;color:var(--cinza-500)">
    <div style="width:24px;height:24px;border:3px solid #e5e7eb;border-top-color:#2D6A4F;border-radius:50%;animation:spin .8s linear infinite"></div>
    <div style="font-size:12px">Calculando diagnóstico espacial…</div>
    <div style="font-size:10px;color:var(--cinza-400)">Intersectando ${camadas.filter(c=>c.geojson).length} camadas de delimitação</div>
  </div>`;
}

async function _iniciarDiagnosticoCAR(f){
  if(!f) return;
  const cod = f.properties?.cod_imovel;
  if(!cod) return;

  // Usa cache se disponível
  if(_carDiagCache.has(cod)){
    if(_carAbertoCod === cod && _carDetAba === 'diagnostico')
      document.getElementById('car-det-body').innerHTML = _htmlCarDiagnostico(_carDiagCache.get(cod), f);
    return;
  }

  const dados = await _calcularDiagnosticoCAR(f);
  _carDiagCache.set(cod, dados);

  if(_carAbertoCod === cod && _carDetAba === 'diagnostico'){
    const bod = document.getElementById('car-det-body');
    if(bod) bod.innerHTML = _htmlCarDiagnostico(dados, f);
  }
}

async function _calcularDiagnosticoCAR(f){
  const p = f.properties || {};

  // Garante geometria válida
  let carPoly;
  try { carPoly = turf.feature(f.geometry); }
  catch(e){ return { erro: 'Geometria inválida para este imóvel.' }; }

  const carBbox = turf.bbox(carPoly);

  // Localiza camadas no array global
  const fonte = camadas.filter(c => c.geojson?.features);
  const findL = (...ts) => fonte.find(c => ts.some(t => c.nome?.toLowerCase().includes(t.toLowerCase())));
  const lDesm  = findL('desmatamento');
  const lFlor  = findL('florestal');
  const lAppA  = findL('antropizada');
  const lAppV  = findL('app vegetação','APP Vegetação');
  const lRest  = findL('restauração');
  const lNasc  = findL('nascentes');
  const lHidro = findL('hidrografia');
  const lSub   = findL('subbacias','Subbacias');

  // Helper: calcula área da interseção entre o CAR e features de uma camada (em ha)
  function intersectArea(layer){
    if(!layer) return 0;
    let total = 0;
    for(const feat of (layer.geojson.features || [])){
      // Pré-filtro por bbox para performance
      try{
        const fb = turf.bbox(feat);
        if(fb[2] < carBbox[0] || fb[0] > carBbox[2] || fb[3] < carBbox[1] || fb[1] > carBbox[3]) continue;
        const inter = turf.intersect(carPoly, turf.feature(feat.geometry));
        if(inter) total += turf.area(inter);
      }catch(_){}
    }
    return total / 10000; // m² → ha
  }

  // Helper: conta features de ponto/polígono dentro ou que intersectam o CAR
  function countIntersect(layer){
    if(!layer) return 0;
    let n = 0;
    for(const feat of (layer.geojson.features || [])){
      try{
        const fb = turf.bbox(feat);
        if(fb[2] < carBbox[0] || fb[0] > carBbox[2] || fb[3] < carBbox[1] || fb[1] > carBbox[3]) continue;
        if(turf.booleanIntersects(carPoly, turf.feature(feat.geometry))) n++;
      }catch(_){}
    }
    return n;
  }

  // Sub-bacia (centroide do CAR)
  let subbacia = p._subbacia || null;
  if(!subbacia && lSub){
    try{
      const cent = turf.centroid(carPoly);
      for(const sb of (lSub.geojson.features || [])){
        if(turf.booleanPointInPolygon(cent, turf.feature(sb.geometry))){
          subbacia = sb.properties?.name || sb.properties?.Name || null;
          break;
        }
      }
    }catch(_){}
  }

  // Hidrografia: filtra segmentos que intersectam o CAR
  const hidroSegmentos = [];
  if(lHidro){
    for(const feat of (lHidro.geojson.features || [])){
      try{
        const fb = turf.bbox(feat);
        if(fb[2] < carBbox[0] || fb[0] > carBbox[2] || fb[3] < carBbox[1] || fb[1] > carBbox[3]) continue;
        if(turf.booleanIntersects(carPoly, turf.feature(feat.geometry))){
          hidroSegmentos.push(feat);
        }
      }catch(_){}
    }
  }
  const hidroComp   = hidroSegmentos.reduce((s,f) => s + (parseFloat(f.properties?.LENGTH)||0), 0) / 1000; // km
  const hidroInterm = hidroSegmentos.filter(f => /intermit/i.test(f.properties?.REGIME||'')).length;
  const hidroPerene = hidroSegmentos.filter(f => /peren/i.test(f.properties?.REGIME||'')).length;
  const hidroNomes  = [...new Set(hidroSegmentos.map(f=>(f.properties?.NOME_1||'').trim()).filter(Boolean))];

  // Métricas de área
  const areaCAR  = parseFloat(p.area) || turf.area(carPoly) / 10000;
  const desmat   = intersectArea(lDesm);
  const floresta = intersectArea(lFlor);
  const appA     = intersectArea(lAppA);
  const appV     = intersectArea(lAppV);
  const restaur  = intersectArea(lRest);
  const nascentes= countIntersect(lNasc);

  // Percentuais
  const pctDesmat  = areaCAR > 0 ? desmat   / areaCAR * 100 : 0;
  const pctFloresta= areaCAR > 0 ? floresta / areaCAR * 100 : 0;
  const appTotal   = appA + appV;
  const pctAppDeg  = appTotal > 0 ? appA / appTotal * 100 : 0;
  const deficit    = desmat - restaur;

  // Classificação de risco
  const risco = pctDesmat > 30 || pctAppDeg > 60 ? 'Alto' :
                pctDesmat > 15 || pctAppDeg > 35 ? 'Médio' : 'Baixo';
  const prioridade = deficit > 5 || pctDesmat > 20 ? 'Alta' :
                     deficit > 0 || pctDesmat > 8  ? 'Média' : 'Baixa';

  // ── Camadas adicionais: todas as demais camadas ativas ─────────────────
  const camadasConhecidas = new Set([lDesm,lFlor,lAppA,lAppV,lRest,lNasc,lHidro,lSub].filter(Boolean));
  const camadasAdicionais = [];

  for(const cam of fonte.filter(c => !camadasConhecidas.has(c) && (c.geojson?.features?.length||0) > 0)){
    const feats   = cam.geojson.features;
    const tipoGeo = feats[0]?.geometry?.type || '';
    const ehPoly  = /Polygon/i.test(tipoGeo);
    const ehLinha = /Line/i.test(tipoGeo);
    const ehPonto = /Point/i.test(tipoGeo);

    let areaHa = 0, contagem = 0, comprKm = 0;
    const fDentro = [];

    for(const feat of feats){
      if(!feat.geometry) continue;
      try{
        const fb = turf.bbox(feat);
        if(fb[2]<carBbox[0]||fb[0]>carBbox[2]||fb[3]<carBbox[1]||fb[1]>carBbox[3]) continue;
        if(ehPoly){
          const inter = turf.intersect(carPoly, turf.feature(feat.geometry));
          if(inter){ const ha = turf.area(inter)/10000; if(ha>0.01){ areaHa+=ha; contagem++; fDentro.push(feat); } }
        } else if(ehLinha){
          if(turf.booleanIntersects(carPoly, turf.feature(feat.geometry))){
            comprKm += (parseFloat(feat.properties?.LENGTH||feat.properties?.COMPRIMENTO||feat.properties?.comp_km||0));
            contagem++; fDentro.push(feat);
          }
        } else if(ehPonto){
          if(turf.booleanPointInPolygon(turf.centroid(turf.feature(feat.geometry)), carPoly)){
            contagem++; fDentro.push(feat);
          }
        }
      }catch(_){}
    }
    if(contagem === 0) continue;

    const pctCam = areaHa>0 && areaCAR>0 ? areaHa/areaCAR*100 : 0;

    // Extrai propriedade mais representativa para agrupar por tipo/classe
    const propKeys = ['tipo','classe','category','type','nome','name','NOME','TIPO','CLASSE','uso','USO','descricao','DESCRICAO'];
    const propKey  = propKeys.find(k => fDentro.some(ft => ft.properties?.[k]));
    const valores  = propKey
      ? [...new Set(fDentro.map(ft => ft.properties?.[propKey]).filter(Boolean))].slice(0,5)
      : [];

    camadasAdicionais.push({
      nome: cam.nome, cor: cam.cor||'#6b7280',
      tipo: ehPoly?'poligono':ehLinha?'linha':'ponto',
      areaHa, pctCam, comprKm, contagem, valores, propKey,
    });
  }

  return {
    subbacia, areaCAR, desmat, floresta, appA, appV, restaur, nascentes,
    pctDesmat, pctFloresta, appTotal, pctAppDeg, deficit, risco, prioridade,
    hidro: { total: hidroSegmentos.length, comprimento: hidroComp,
             intermitentes: hidroInterm, perenes: hidroPerene, nomes: hidroNomes },
    camadasAdicionais,
  };
}

// ── Camadas GeoJSON PRODES recortadas no(s) CAR(s) ───────────────────────
const _prodesCarLayers = { anual: null, hist: null };

function _toggleProdesCarLayer(tipo, ativo){
  // Remove camada existente
  if(_prodesCarLayers[tipo]){
    mapaL.removeLayer(_prodesCarLayers[tipo]);
    _prodesCarLayers[tipo] = null;
  }
  if(!ativo) return;

  // Coleta geometrias de todos os CARs com cache PRODES
  const allFeatures = [];
  _carProdesCache.forEach((dados, cod) => {
    if(dados.erro) return;
    const src = tipo === 'anual' ? dados.anual : dados.historico;
    (src.geojsonFeatures || []).forEach(f => allFeatures.push(f));
  });

  if(!allFeatures.length){
    toast('Nenhum polígono PRODES disponível. Abra a aba 🌳 PRODES em um imóvel CAR primeiro.', 'warning');
    // desmarca o checkbox
    const el = document.getElementById(`prodes-tab-toggle-${tipo === 'anual' ? 'anual' : 'hist'}`);
    if(el) el.checked = false;
    return;
  }

  const corFill   = tipo === 'anual' ? '#dc2626' : '#c2410c';
  const corStroke = tipo === 'anual' ? '#991b1b' : '#7c2d12';

  _prodesCarLayers[tipo] = L.geoJSON(
    { type: 'FeatureCollection', features: allFeatures },
    {
      style: {
        fillColor:   corFill,
        fillOpacity: 0.55,
        color:       corStroke,
        weight:      1,
        opacity:     0.9,
      },
      onEachFeature(feat, layer){
        const p   = feat.properties || {};
        const ha  = Number(p.ha_calc||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
        const ano = p.ano || p.year || '—';
        layer.bindTooltip(
          `<strong>PRODES ${tipo === 'anual' ? 'Anual' : 'Pré-2008'}</strong><br>Ano: ${ano}<br>Área: ${ha} ha`,
          { sticky: true, className: 'leaflet-tooltip' }
        );
      },
    }
  ).addTo(mapaL);

  // Traz para frente mas abaixo dos marcadores
  _prodesCarLayers[tipo].setZIndex ? _prodesCarLayers[tipo].setZIndex(200) : null;
}

// Remove camadas PRODES do CAR quando o painel fecha
function _limparProdesCarLayers(){
  ['anual','hist'].forEach(t => {
    if(_prodesCarLayers[t]){ mapaL.removeLayer(_prodesCarLayers[t]); _prodesCarLayers[t] = null; }
  });

async function _fetchProdesCAR(f){
  let carPoly;
  try { carPoly = turf.feature(f.geometry); }
  catch(e){ return { erro: 'Geometria inválida para este imóvel.' }; }

  const bb = turf.bbox(carPoly); // [minLon, minLat, maxLon, maxLat]
  // Margem de 0.01° (~1km) para capturar polígonos limítrofes
  const bbox = [bb[0]-0.01, bb[1]-0.01, bb[2]+0.01, bb[3]+0.01];

  // Chama via Edge Function (sem restrição CORS)
  const { data: { session } } = await db.auth.getSession();
  let data;
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/prodes-proxy', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (session?.access_token || ''),
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ bbox }),
      signal: AbortSignal.timeout(30000),
    });
    const json = await res.json();
    if(!res.ok || json.error) throw new Error(json.error || `HTTP ${res.status}`);
    data = json;
  } catch(e) {
    const msg = e.name === 'TimeoutError'
      ? 'Tempo limite atingido. O servidor INPE pode estar lento — tente novamente.'
      : (e.message || 'Erro desconhecido ao consultar o proxy PRODES.');
    return { erro: msg, link: 'https://terrabrasilis.dpi.inpe.br' };
  }

  const areaCAR = parseFloat(f.properties?.area) || turf.area(carPoly) / 10000;

  function calcIntersect(features){
    const porAno = {}; let totalHa = 0; let nIntersect = 0;
    const geojsonFeatures = []; // guarda geometrias intersectadas para renderização
    for(const feat of (features || [])){
      if(!feat.geometry) continue;
      try{
        const inter = turf.intersect(carPoly, turf.feature(feat.geometry));
        if(!inter) continue;
        const ha = turf.area(inter) / 10000;
        if(ha < 0.01) continue;
        const ano = String(feat.properties?.year || feat.properties?.ano
                 || feat.properties?.data_detec?.slice(0,4) || 'N/D');
        porAno[ano] = (porAno[ano] || 0) + ha;
        totalHa += ha;
        nIntersect++;
        geojsonFeatures.push({ ...inter, properties: { ...feat.properties, ha_calc: ha, ano } });
      }catch(_){}
    }
    return { porAno, totalHa, nIntersect, geojsonFeatures };
  }

  const anual     = calcIntersect(data.anual?.features);
  const historico = calcIntersect(data.historico?.features);
  const totalGeral = anual.totalHa + historico.totalHa;
  const anosAnual  = Object.keys(anual.porAno).sort();

  return {
    anual, historico, totalGeral, anosAnual, areaCAR,
    nFeaturesAnual:     data.anual?.features?.length || 0,
    nFeaturesHistorico: data.historico?.features?.length || 0,
  };
}

function _gerarTextoCarDiag(d, p, local){
  const f2 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
  const f1 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
  let t = [];

  // Situação do desmatamento — usa PRODES como fonte principal quando disponível
  const prodesD = _carProdesCache.get(p.cod_imovel);
  const temProdesD = prodesD && !prodesD.erro;
  const desmatRef  = temProdesD ? prodesD.totalGeral : d.desmat;
  const areaRef    = d.areaCAR || parseFloat(p.area) || 1;
  const pctRef     = desmatRef / areaRef * 100;
  const fonteLabel = temProdesD ? 'PRODES/INPE' : 'camadas locais';

  if(pctRef > 30)
    t.push(`⚠️ <strong>Desmatamento crítico</strong>: ${f2(desmatRef)} ha (${f1(pctRef)}% da área) registrados pelo ${fonteLabel} — situação crítica que demanda intervenção imediata.`);
  else if(pctRef > 10)
    t.push(`🟡 <strong>Desmatamento moderado</strong>: ${f2(desmatRef)} ha (${f1(pctRef)}%) segundo o ${fonteLabel}, com pressão antrópica significativa.`);
  else if(desmatRef > 0)
    t.push(`✅ <strong>Desmatamento baixo</strong>: apenas ${f2(desmatRef)} ha (${f1(pctRef)}%) registrados pelo ${fonteLabel}.`);

  if(temProdesD && prodesD.historico.totalHa > 0 && prodesD.anual.totalHa > 0){
    t.push(`📡 <strong>Detalhamento PRODES</strong>: ${f2(prodesD.historico.totalHa)} ha acumulados antes de 2008 (passivo histórico) + ${f2(prodesD.anual.totalHa)} ha detectados entre 2008 e ${prodesD.anosAnual[prodesD.anosAnual.length-1] || 'hoje'} (monitoramento anual por satélite).`);
  } else if(!temProdesD){
    t.push(`ℹ️ Para utilizar os dados oficiais do PRODES/INPE, acesse a aba <strong>🌳 PRODES</strong> neste painel.`);
  }

  // Vegetação remanescente
  if(d.floresta > 0)
    t.push(`🌿 <strong>Floresta remanescente</strong>: ${f2(d.floresta)} ha (${f1(d.pctFloresta)}% da propriedade) ainda com cobertura florestal${d.pctFloresta < 20 ? ' — fragmento isolado com risco de perda de conectividade ecológica' : ''}.`);

  // APP
  if(d.appTotal > 0){
    if(d.pctAppDeg > 50)
      t.push(`🔴 <strong>APP em situação crítica</strong>: ${f2(d.appA)} ha (${f1(d.pctAppDeg)}%) degradados — exposição dos cursos d'água à erosão e assoreamento.`);
    else if(d.pctAppDeg > 25)
      t.push(`🟡 <strong>APP parcialmente degradada</strong>: ${f2(d.appA)} ha (${f1(d.pctAppDeg)}%) sem cobertura vegetal — recomenda-se restauração da vegetação ciliar.`);
    else
      t.push(`✅ <strong>APP relativamente preservada</strong>: apenas ${f2(d.appA)} ha (${f1(d.pctAppDeg)}%) degradados.`);
  }

  // Nascentes
  if(d.nascentes > 0)
    t.push(`💧 <strong>${d.nascentes} nascente(s)</strong> identificada(s) na propriedade ou adjacência imediata${d.appA > 0 ? ' — presença de APP degradada próxima configura risco hídrico' : ''}.`);

  // Hidrografia
  if(d.hidro.total > 0){
    const msg = `💧 <strong>${d.hidro.total} segmento(s) hídrico(s)</strong> (${d.hidro.comprimento.toFixed(1)} km) cortam a propriedade`;
    if(d.hidro.intermitentes > 0 && d.pctAppDeg > 30)
      t.push(msg + ` — ${d.hidro.intermitentes} intermitente(s), indicando vulnerabilidade sazonal agravada pela APP degradada.`);
    else
      t.push(msg + '.');
  }

  // Restauração
  if(d.deficit > 5)
    t.push(`🌱 <strong>Déficit de restauração</strong>: ${f2(d.deficit)} ha desmatados além do mapeamento de restauração proposta — necessário ampliar ações de recuperação.`);
  else if(d.restaur > 0)
    t.push(`🌱 <strong>Área de restauração proposta</strong>: ${f2(d.restaur)} ha mapeados para recuperação.`);

  // Classificação SICAR
  if(local.nome_class){
    const classMsgs = {
      'Verde': '✅ Classificado como <strong>Verde</strong> no SICAR — imóvel em conformidade com o Código Florestal.',
      'Amarelo': '🟡 Classificado como <strong>Amarelo</strong> no SICAR — pendências de regularização ambiental a resolver.',
      'Vermelho': '🔴 Classificado como <strong>Vermelho</strong> no SICAR — imóvel em <strong>não conformidade</strong> com o Código Florestal.',
      'Não Classificado': '⚪ <strong>Não classificado</strong> no SICAR — análise técnica pendente.',
    };
    if(classMsgs[local.nome_class]) t.push(classMsgs[local.nome_class]);
  }

  // Camadas adicionais detectadas
  if(d.camadasAdicionais?.length){
    d.camadasAdicionais.forEach(c => {
      const f2c = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
      const vStr = c.valores.length ? ` — classes identificadas: <em>${c.valores.join(', ')}</em>` : '';
      if(c.tipo === 'poligono' && c.areaHa > 0)
        t.push(`🗂 <strong>${c.nome}</strong>: ${f2c(c.areaHa)} ha (${Number(c.pctCam).toFixed(1)}% do imóvel) intersectam esta camada${vStr}.`);
      else if(c.tipo === 'linha' && c.contagem > 0)
        t.push(`🗂 <strong>${c.nome}</strong>: ${c.contagem} segmento(s) cortam o imóvel${c.comprKm>0?` — ${f2c(c.comprKm)} km total`:''}${vStr}.`);
      else if(c.tipo === 'ponto' && c.contagem > 0)
        t.push(`🗂 <strong>${c.nome}</strong>: ${c.contagem} ponto(s) dentro do imóvel${vStr}.`);
    });
  }

  return t.map(s => `<p style="margin:0 0 5px">${s}</p>`).join('');
}

// ── Marcar / desmarcar ────────────────────────────────────────────────────
async function toggleMarcarCAR(){
  if(!_carAbertoFeat) return;
  const cod = _carAbertoFeat.properties?.cod_imovel;
  if(_carMarcados.has(cod)){
    await desmarcarCAR(cod);
  } else {
    const p = _carAbertoFeat.properties || {};
    const payload = {
      cod_imovel: cod, area: parseFloat(p.area)||null,
      municipio: p.municipio||null, condicao: p.condicao||null,
      atualizado_em: new Date().toISOString(),
    };
    const { error } = await db.from('car_marcados').upsert(payload, { onConflict:'cod_imovel' });
    if(error){ toast('Erro: '+error.message,'error'); return; }
    _carMarcados.set(cod, payload);
    _atualizarLayerCAR(cod);
    _atualizarBtnMarcar();
    _atualizarContadorPins();
    if(_carDetAba==='marcados') _renderCarDetBody();
    toast('Imóvel marcado!','success');
  }
}

async function desmarcarCAR(cod){
  const { error } = await db.from('car_marcados').delete().eq('cod_imovel', cod);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  _carMarcados.delete(cod);
  _atualizarLayerCAR(cod);
  if(cod === _carAbertoCod) _atualizarBtnMarcar();
  _atualizarContadorPins();
  if(_carDetAba==='marcados') _renderCarDetBody();
  toast('Marcação removida','info');
}

async function limparTodosMarcados(){
  if(!confirm(`Remover todos os ${_carMarcados.size} imóveis marcados?`)) return;
  const { error } = await db.from('car_marcados').delete().neq('cod_imovel','__nenhum__');
  if(error){ toast('Erro: '+error.message,'error'); return; }
  const cods = [..._carMarcados.keys()];
  _carMarcados.clear();
  cods.forEach(cod => _atualizarLayerCAR(cod));
  _atualizarBtnMarcar();
  _atualizarContadorPins();
  _renderCarDetBody();
  toast('Todos os marcados foram removidos','info');
}

// ── Navegar para CAR na lista ─────────────────────────────────────────────
function irParaCAR(cod){
  if(!_carLayer) return;
  let found = null;
  _carLayer.eachLayer(l => {
    if(!found && l.feature?.properties?.cod_imovel === cod) found = l;
  });
  if(!found){
    toast('Este imóvel está fora do filtro atual','warning'); return;
  }
  try{ mapaL.fitBounds(found.getBounds(), { maxZoom:17, padding:[30,30] }); } catch(_){}
  _selecionarCAR(found.feature, found);
}

// ── Atualizar style de um layer específico (sem re-render total) ──────────
function _atualizarLayerCAR(cod){
  if(!_carLayer) return;
  _carLayer.eachLayer(l => {
    if(l.feature?.properties?.cod_imovel !== cod) return;
    l.setStyle(_estiloCAR(l.feature, false, _carSelecionado === l));
  });
}

// ── Botões de marcação ────────────────────────────────────────────────────
function _atualizarBtnMarcar(){
  const cod     = _carAbertoFeat?.properties?.cod_imovel;
  const marcado = cod && _carMarcados.has(cod);
  const btnFoot = document.getElementById('btn-car-marcar');
  const btnHdr  = document.getElementById('btn-car-pin-hdr');
  if(btnFoot){
    btnFoot.textContent = marcado ? '📌 Desmarcar' : '📌 Marcar';
    btnFoot.classList.toggle('btn-car-marcado', !!marcado);
  }
  if(btnHdr){
    btnHdr.style.background = marcado ? '#7c3aed' : 'rgba(255,255,255,.15)';
  }
}

// ── Abrir / fechar painel ─────────────────────────────────────────────────
async function abrirDetalhesCAR(f){
  // Limpa camadas PRODES do CAR anterior ao abrir um novo
  _limparProdesCarLayers();
  _carAbertoFeat = f;
  _carAbertoCod  = f.properties?.cod_imovel;
  const det = document.getElementById('car-det-panel');
  const cod = document.getElementById('car-det-codigo');
  const lnk = document.getElementById('car-det-link-sicar');
  if(!det) return;
  if(cod) cod.textContent = _carAbertoCod || '—';
  if(_carDetAba === 'marcados') _carDetAba = 'atributos';
  _atualizarAbas();
  _renderCarDetBody(); // render imediato com dados do WFS
  _atualizarBtnMarcar();
  if(lnk && _carAbertoCod)
    lnk.href = `https://consultapublica.car.gov.br/publico/imoveis/index?idImovel=${encodeURIComponent(_carAbertoCod)}`;
  det.classList.add('aberto');

  // Busca dados enriquecidos (Supabase) em segundo plano
  if(_carDetAba === 'atributos'){
    const local = await _buscarDadosLocais(_carAbertoCod);
    // Só re-renderiza se o CAR aberto ainda for o mesmo
    if(_carAbertoCod === f.properties?.cod_imovel && _carDetAba === 'atributos'){
      _renderCarDetBody();
    }
  }
}

function _atualizarAbas(){
  document.querySelectorAll('.car-det-tab').forEach(b =>
    b.classList.toggle('ativo', b.dataset.tab === _carDetAba)
  );
}

function fecharDetalhesCAR(){
  document.getElementById('car-det-panel')?.classList.remove('aberto');
  if(_carSelecionado){
    try{ _carSelecionado.setStyle(_estiloCAR(_carSelecionado.feature||{properties:{}},false,false)); }catch(_){}
    _carSelecionado = null;
  }
  _carAbertoFeat = null;
  _carAbertoCod  = null;
  _limparProdesCarLayers();
}

// ── Relatório de CARs Marcados ────────────────────────────────────────────
let _relCarAbortado = false;

async function gerarRelatorioCarMarcados(){
  const cods = [..._carMarcados.keys()];
  if(!cods.length){ toast('Nenhum imóvel marcado para gerar relatório','warning'); return; }

  _relCarAbortado = false;
  const toast_id = toast(`Capturando ${cods.length} imóvel(is)… 0/${cods.length}`,'info');

  // Salva estado atual do mapa
  const viewAntes    = mapaL.getCenter();
  const zoomAntes    = mapaL.getZoom();
  const selAntes     = _carSelecionado;

  // Garante que o painel lateral não cobre o mapa
  document.getElementById('car-det-panel')?.classList.remove('aberto');

  // Pré-carrega dados locais, diagnósticos e PRODES para todos os CARs marcados
  toast(`Buscando dados cadastrais, diagnósticos e PRODES/INPE…`,'info');
  const featsParaDiag = cods.map(cod => _carFeatures.find(f => f.properties?.cod_imovel === cod)).filter(Boolean);
  await Promise.all([
    ...cods.map(cod => _buscarDadosLocais(cod)),
    ...featsParaDiag.map(f => _calcularDiagnosticoCAR(f).then(d => _carDiagCache.set(f.properties.cod_imovel, d))),
    ...featsParaDiag.map(f => {
      const cod = f.properties?.cod_imovel;
      if(_carProdesCache.has(cod)) return Promise.resolve();
      return _fetchProdesCAR(f).then(d => _carProdesCache.set(cod, d)).catch(()=>{});
    }),
  ]);

  const capturas = [];
  for(let i = 0; i < cods.length; i++){
    if(_relCarAbortado) break;
    const cod  = cods[i];
    const feat = _carFeatures.find(f => f.properties?.cod_imovel === cod);
    if(!feat) continue;

    toast(`Capturando ${i+1}/${cods.length}: ${cod.slice(-8)}…`,'info');

    const imgData = await _capturarMapaCAR(feat);
    capturas.push({ feat, imgData, row: _carMarcados.get(cod) });
  }

  // Restaura estado anterior
  mapaL.setView(viewAntes, zoomAntes);
  if(selAntes) _carSelecionado = selAntes;

  if(!capturas.length){ toast('Nenhuma captura realizada','error'); return; }

  toast('Gerando PDF via servidor…','info');
  await _gerarPdfRelatorioCAR(capturas);
}

function _criarLegendaMapa(f, prodesCapt){
  const mapEl = document.getElementById('mapa');
  if(!mapEl) return null;

  // ── Itens da legenda ──────────────────────────────────────────────────
  const itens = [];

  // CAR selecionado
  itens.push({ tipo:'poligono', cor:'#2D6A4F', brd:'#1F4E2C', label:'Imóvel CAR selecionado' });

  // PRODES
  const temP = prodesCapt && !prodesCapt.erro;
  if(temP){
    if((prodesCapt.anual?.totalHa||0) > 0)
      itens.push({ tipo:'area', cor:'#dc2626', brd:'#991b1b', label:'Desmatamento PRODES 2008–hoje' });
    if((prodesCapt.historico?.totalHa||0) > 0)
      itens.push({ tipo:'area', cor:'#c2410c', brd:'#7c2d12', label:'Desmatamento PRODES pré-2008' });
  }

  // Camadas de delimitação ativas — identifica pelo nome
  const fonte = camadas.filter(c => c.visivel && c.geojson?.features?.length);
  const findC = (...terms) => fonte.find(c => terms.some(t => c.nome?.toLowerCase().includes(t.toLowerCase())));

  const lDesm  = findC('desmatamento');
  const lFlor  = findC('florestal','floresta');
  const lAppA  = findC('antropizada','app antropiz');
  const lAppV  = findC('app vegetação','app vegeta');
  const lRest  = findC('restauração','restauracao');
  const lNasc  = findC('nascentes','nascente');
  const lHidro = findC('hidrografia','hidrograf');
  const lSub   = findC('subbacias','sub-bacias','subbacia');
  const lApa   = findC('igarapé são francisco','lago do amapá','apa ','demarcação');

  if(lFlor)  itens.push({ tipo:'area',   cor:'#166534', brd:'#14532d', label:'Floresta remanescente' });
  if(lDesm)  itens.push({ tipo:'area',   cor:'#b91c1c', brd:'#7f1d1d', label:'Desmatamento (camada local)' });
  if(lAppV)  itens.push({ tipo:'area',   cor:'#15803d', brd:'#14532d', label:'APP com vegetação' });
  if(lAppA)  itens.push({ tipo:'area',   cor:'#d97706', brd:'#92400e', label:'APP antropizada' });
  if(lRest)  itens.push({ tipo:'area',   cor:'#0891b2', brd:'#164e63', label:'Área de restauração' });
  if(lNasc)  itens.push({ tipo:'ponto',  cor:'#3b82f6', brd:'#1d4ed8', label:'Nascentes' });
  if(lHidro) itens.push({ tipo:'linha',  cor:'#0ea5e9', label:'Hidrografia' });
  if(lSub)   itens.push({ tipo:'linha',  cor:'#6366f1', label:'Sub-bacias' });
  if(lApa)   itens.push({ tipo:'poligono', cor:'#7c3aed', brd:'#4c1d95', label:'Limites APA' });

  // Camadas extras não identificadas acima
  fonte.forEach(c => {
    const jaTem = [lDesm,lFlor,lAppA,lAppV,lRest,lNasc,lHidro,lSub,lApa].includes(c);
    if(!jaTem){
      const cor = c.cor || '#6b7280';
      itens.push({ tipo:'area', cor, brd: cor, label: c.nome });
    }
  });

  if(!itens.length) return null;

  // ── Renderiza ─────────────────────────────────────────────────────────
  const simbolo = ({ tipo, cor, brd }) => {
    if(tipo === 'ponto')
      return `<div style="width:10px;height:10px;border-radius:50%;background:${cor};border:1.5px solid ${brd||cor};flex-shrink:0"></div>`;
    if(tipo === 'linha')

    if(tipo === 'poligono')
      return `<div style="width:14px;height:10px;background:${cor}55;border:2px solid ${brd||cor};border-radius:2px;flex-shrink:0"></div>`;
    // area
    return `<div style="width:14px;height:10px;background:${cor}99;border:1.5px solid ${brd||cor};border-radius:2px;flex-shrink:0"></div>`;
  };

  const rows = itens.map(i =>
    `<div style="display:flex;align-items:center;gap:5px;padding:1px 0">
      ${simbolo(i)}
      <span style="font-size:9px;color:#1f2937;line-height:1.2">${i.label}</span>
    </div>`
  ).join('');

  const div = document.createElement('div');
  div.id = 'mapa-legenda-captura';
  div.style.cssText = [
    'position:absolute',
    'bottom:10px',
    'left:10px',
    'z-index:9999',
    'background:rgba(255,255,255,0.93)',
    'border:1px solid #d1d5db',
    'border-radius:7px',
    'padding:7px 10px',
    'box-shadow:0 2px 8px rgba(0,0,0,.18)',
    'max-width:190px',
    'pointer-events:none',
  ].join(';');

  div.innerHTML = `
    <div style="font-size:9px;font-weight:700;color:#1F4E2C;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;border-bottom:1px solid #e5e7eb;padding-bottom:4px">
      🗺 Legenda
    </div>
    ${rows}
  `;

  mapEl.style.position = 'relative';
  mapEl.appendChild(div);
  return div;
}

async function _capturarMapaCAR(f){
  // 1. Calcula bounds do polígono
  let bounds;
  try{ bounds = turf.bbox(f); }catch(e){ bounds = [-68,-10,-67.5,-9.7]; }
  const lBounds = [[bounds[1],bounds[0]],[bounds[3],bounds[2]]];

  // 2. Destaca o CAR no mapa (cor de seleção)
  _carLayer?.eachLayer(l => {
    if(l.feature?.properties?.cod_imovel === f.properties?.cod_imovel){
      if(_carSelecionado && _carSelecionado !== l)
        _carSelecionado.setStyle(_estiloCAR(_carSelecionado.feature,false,false));
      _carSelecionado = l;
      l.setStyle(_estiloCAR(f,false,true));
    }
  });

  // 3. Zoom para o polígono e aguarda tiles carregarem
  await new Promise(resolve => {
    const onMoveEnd = () => {
      mapaL.off('moveend', onMoveEnd);
      setTimeout(resolve, 1800); // aguarda tiles renderizarem
    };
    mapaL.on('moveend', onMoveEnd);
    mapaL.fitBounds(lBounds, { padding:[70,70], maxZoom:17 });
  });

  // 4. Força re-render dos layers de canvas
  try{ _carLayer?.bringToFront(); }catch(_){}

  // 4b. Renderiza camadas PRODES no prodesPane (z-index 460, canvas) para a captura
  const cod = f.properties?.cod_imovel;
  const prodesCapt = _carProdesCache.get(cod);
  const captLayers = [];
  const prodesRenderer = L.canvas({ pane: 'prodesPane', padding: 0.5 });
  if(prodesCapt && !prodesCapt.erro){
    const estilos = [
      { feats: prodesCapt.historico?.geojsonFeatures||[], fill:'#c2410c', stroke:'#7c2d12', opacity:0.65 },
      { feats: prodesCapt.anual?.geojsonFeatures||[], fill:'#dc2626', stroke:'#991b1b', opacity:0.70 },
    ];
    estilos.forEach(({ feats, fill, stroke, opacity }) => {
      if(!feats.length) return;
      const lyr = L.geoJSON(
        { type:'FeatureCollection', features: feats },
        {
          pane:     'prodesPane',
          renderer: prodesRenderer,
          style:    { fillColor:fill, fillOpacity:opacity, color:stroke, weight:2, opacity:1 },
        }
      ).addTo(mapaL);
      captLayers.push(lyr);
    });
    // Aguarda canvas renderizar completamente
    if(captLayers.length) await new Promise(r => setTimeout(r, 900));
  }

  // 4c. Injeta legenda HTML sobre o mapa antes da captura
  const legendaEl = _criarLegendaMapa(f, prodesCapt);

  // 5. Captura com html2canvas
  const mapEl = document.getElementById('mapa');
  if(!mapEl || typeof html2canvas === 'undefined'){
    legendaEl?.remove();
    return _svgFallbackCAR(f, bounds);
  }

  let imgResult;
  try{
    const canvas = await html2canvas(mapEl, {
      useCORS:      true,
      allowTaint:   true,
      scale:        Math.min(window.devicePixelRatio||1, 2),
      logging:      false,
      imageTimeout: 8000,
      backgroundColor: '#1a1a2e',
    });
    try{
      imgResult = canvas.toDataURL('image/jpeg', 0.88);
    } catch(_){
      imgResult = _exportCanvasSemTaint(canvas, f, bounds);
    }
  } catch(err){
    console.warn('html2canvas falhou:', err);
    imgResult = _svgFallbackCAR(f, bounds);
  } finally{
    // Remove camadas PRODES temporárias e legenda da captura
    captLayers.forEach(l => { try{ mapaL.removeLayer(l); }catch(_){} });
    legendaEl?.remove();
  }
  return imgResult;
}

// Tenta exportar ignorando pixels tainted (risca apenas o CAR polygon sobre preto)
function _exportCanvasSemTaint(mainCanvas, f, bounds){
  try{
    // Cria canvas limpo do mesmo tamanho
    const c2 = document.createElement('canvas');
    c2.width = mainCanvas.width; c2.height = mainCanvas.height;
    const ctx = c2.getContext('2d');
    ctx.fillStyle = '#1a2030';
    ctx.fillRect(0,0,c2.width,c2.height);
    // Pega o canvas do carPane (mesmo origin, não tainted)
    const carCanvas = document.querySelector('.leaflet-pane canvas');
    if(carCanvas) ctx.drawImage(carCanvas, 0, 0, c2.width, c2.height);
    return c2.toDataURL('image/jpeg', 0.88);
  }catch(_){
    return _svgFallbackCAR(f, bounds);
  }
}

// SVG fallback: polígono do CAR projetado em coordenadas simples
function _svgFallbackCAR(f, bounds){
  const [minLng,minLat,maxLng,maxLat] = bounds;
  const W = 600, H = 380;
  const toX = lng => ((lng-minLng)/(maxLng-minLng)) * W;
  const toY = lat => H - ((lat-minLat)/(maxLat-minLat)) * H;

  const coords = (f.geometry?.type === 'MultiPolygon'
    ? (f.geometry.coordinates[0]||[])[0]||[]
    : (f.geometry?.coordinates[0]||[]));

  const pts = coords.map(([lng,lat]) => `${toX(lng).toFixed(1)},${toY(lat).toFixed(1)}`).join(' ');

  const cx = toX((minLng+maxLng)/2).toFixed(1);
  const cy = toY((minLat+maxLat)/2).toFixed(1);

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="#1a2030"/>
    <text x="12" y="22" fill="#6b7280" font-family="monospace" font-size="11">
      lat: ${minLat.toFixed(4)}..${maxLat.toFixed(4)} | lng: ${minLng.toFixed(4)}..${maxLng.toFixed(4)}
    </text>
    ${pts ? `<polygon points="${pts}" fill="#7c3aed44" stroke="#7c3aed" stroke-width="2"/>` : ''}
    <circle cx="${cx}" cy="${cy}" r="5" fill="#7c3aed"/>
    <text x="${cx}" y="${parseFloat(cy)+18}" fill="#c4b5fd" font-family="sans-serif" font-size="10" text-anchor="middle">centroide</text>
  </svg>`;

  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

.link-btn{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:4px 12px;border-radius:4px;border:1px solid;text-decoration:none;font-weight:600;}
.link-sicar{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
.link-sema{background:#f0fdf4;color:#16a34a;border-color:#86efac;}

/* ── TABELAS ── */
.rep-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.rep-tbl th{padding:6px 10px;font-size:9px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid #1F4E2C;background:#f0f7f2;}
.rep-tbl td{padding:6px 10px;border-bottom:1px solid #e5e7eb;color:#374151;}
.rep-tbl tbody tr:nth-child(even) td{background:#fafcfa;}

/* ── STATS RESUMO ── */
.rep-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.rep-stat{background:#f0f7f2;border:1px solid #c8e6d0;border-radius:6px;padding:12px 14px;}
.rep-stat-lbl{font-size:9px;font-weight:700;color:#2D6A4F;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.rep-stat-val{font-size:18px;font-weight:700;color:#111827;font-family:monospace;}
.rep-secao-titulo{font-size:10px;font-weight:700;color:#1F4E2C;text-transform:uppercase;letter-spacing:.08em;padding:6px 0;border-bottom:1.5px solid #c8e6d0;margin:16px 0 10px;display:flex;align-items:center;gap:6px;}

.nota{margin-top:16px;font-size:10px;color:#9ca3af;line-height:1.6;border-top:1px solid #e5e7eb;padding-top:10px;}

function _abrirJanelaRelatorioCAR(capturas){
  const win = window.open('', '_blank', 'width=1000,height=800');
  if(!win){ toast('Popup bloqueado. Permita popups para este site.','error'); return; }
  const html = _montarHtmlRelatorioCAR(capturas);
  // Adiciona o script de impressão automática para o modo fallback
  const htmlComPrint = html.replace('</body></html>', `<script>window.onload=()=>setTimeout(()=>window.print(),800);<\/script></body></html>`);
  win.document.write(htmlComPrint);
  win.document.close();
}

function _htmlFichaCAR(f, imgData){
  const p     = f.properties || {};
  const local = _carDadosLocais.get(p.cod_imovel) || {};
  const f2  = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
  const fDt = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
  const key = _carStatusKey(p.condicao);
  const statusLabel = {ativo:'Ativo',aguardando:'Aguardando análise',analise:'Em análise',outro:'Outro'}[key]||key;
  const apaLabel = p._apa==='isf' ? '🌿 APA Igarapé São Francisco' : p._apa==='la' ? '💧 APA Lago do Amapá' : '⚠️ Fora das APAs';
  const apaBadge = p._apa==='isf' ? 'badge-isf' : p._apa==='la' ? 'badge-la' : 'badge-fora';
  const sicarUrl = `https://consultapublica.car.gov.br/publico/imoveis/index?idImovel=${encodeURIComponent(p.cod_imovel||'')}`;
  const diag      = _carDiagCache.get(p.cod_imovel) || null;
  const descricao = _gerarDescricaoCAR(f);

  // Cores da classificação para o relatório impresso
  const classCfg = {
    'Verde':           {bg:'#f0fdf4',cor:'#16a34a',brd:'#86efac'},
    'Amarelo':         {bg:'#fffbeb',cor:'#d97706',brd:'#fde68a'},
    'Vermelho':        {bg:'#fef2f2',cor:'#dc2626',brd:'#fca5a5'},
    'Não Classificado':{bg:'#f3f4f6',cor:'#6b7280',brd:'#d1d5db'},
  };
  const cc = local.nome_class ? (classCfg[local.nome_class]||classCfg['Não Classificado']) : null;

  return `
<div class="ficha">
  <!-- Sub-header da ficha -->
  <div class="ficha-subhd">
    🏡 Ficha do Imóvel Rural — CAR
    <span class="ficha-badge ${apaBadge}">${apaLabel}</span>
    <span class="ficha-cod">${p.cod_imovel||'—'}</span>
  </div>

  <div class="doc-body">

    <!-- BLOCO 1: Dados Cadastrais — 2 colunas compactas -->
    <div class="dados-grid">
      <div class="dados-col">
        <div class="dados-col-title">📋 Dados Cadastrais</div>
        ${local.nom_imovel?`<div class="attr-row"><span class="attr-lbl">Nome do imóvel</span><span class="attr-val">${escHtml(local.nom_imovel)}</span></div>`:''}
        ${local.nome_compl?`<div class="attr-row"><span class="attr-lbl">Proprietário/Possuidor</span><span class="attr-val">${escHtml(local.nome_compl)}</span></div>`:''}
        ${local.cpf_cnpj?`<div class="attr-row"><span class="attr-lbl">CPF / CNPJ</span><span class="attr-val" style="font-family:monospace;font-size:9.5px">${escHtml(_mascaraCpfCnpj(local.cpf_cnpj))}</span></div>`:''}
        ${cc?`<div class="attr-row"><span class="attr-lbl">Classificação SICAR</span><span class="attr-val"><span style="background:${cc.bg};color:${cc.cor};border:1px solid ${cc.brd};border-radius:99px;padding:1px 7px;font-size:9px;font-weight:700">${escHtml(local.nome_class)}</span></span></div>`:''}
        ${local.tipo_docum?`<div class="attr-row"><span class="attr-lbl">Relação jurídica</span><span class="attr-val">${escHtml(local.tipo_docum)}</span></div>`:''}
        ${local.nome_docum?`<div class="attr-row"><span class="attr-lbl">Documento</span><span class="attr-val" style="font-size:9.5px">${escHtml(local.nome_docum)}</span></div>`:''}
      </div>
      <div>
        <div class="dados-col-title">📍 Localização e Situação</div>
        <div class="attr-row"><span class="attr-lbl">Área declarada</span><span class="attr-val" style="color:#1F4E2C;font-size:12px;font-weight:700">${f2(p.area)} ha</span></div>
        <div class="attr-row"><span class="attr-lbl">Município</span><span class="attr-val">${p.municipio||'—'} / AC</span></div>
        <div class="attr-row"><span class="attr-lbl">Tipo de imóvel</span><span class="attr-val">${p.tipo_imovel||'—'}</span></div>
        <div class="attr-row"><span class="attr-lbl">Módulos fiscais</span><span class="attr-val">${f2(p.m_fiscal)}</span></div>
        <div class="attr-row"><span class="attr-lbl">Situação cadastral</span><span class="attr-val">${statusLabel}</span></div>
        <div class="attr-row"><span class="attr-lbl">Data de cadastro</span><span class="attr-val">${fDt(p.dat_criacao)}</span></div>
        <div class="attr-row"><span class="attr-lbl">Sub-bacia hidrográfica</span><span class="attr-val">${p._subbacia||'—'}</span></div>
        <div style="padding:6px 10px;display:flex;gap:6px">
          <a href="${sicarUrl}" target="_blank" class="link-btn link-sicar">🔗 Ver no SICAR</a>
          <a href="https://seloverde.sema.ac.gov.br/consultar-car/" target="_blank" class="link-btn link-sema">🌿 SeloVerde AC</a>
        </div>
      </div>
    </div>

    <!-- BLOCO 2: Mapa largura total -->
    <div class="mapa-wrap">
      <img src="${imgData}" alt="Mapa do imóvel" class="mapa-img"
        onerror="this.style.background='#f0f7f2';this.style.height='200px';this.alt='Imagem não disponível'">
      <div style="font-size:8px;color:#9ca3af;margin-top:3px;text-align:center">
        Visão de satélite com PRODES · Captura Sistema DIMA · ${new Date().toLocaleDateString('pt-BR')}
      </div>
    </div>

    <!-- BLOCO 3: PRODES — faixa horizontal -->
    ${(()=>{
      const prodes = _carProdesCache.get(p.cod_imovel);
      const temP   = prodes && !prodes.erro;
      const area   = parseFloat(p.area) || diag?.areaCAR || 1;
      const f2r    = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
      const f1r    = n => Number(n||0).toFixed(1);
      if(!temP) return `
        <div style="border:1px dashed #d1d5db;border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:10px;color:#9ca3af;text-align:center">
          🛰 Dados PRODES/INPE não disponíveis para este imóvel nesta sessão.
        </div>`;
      const total  = prodes.totalGeral;
      const hist   = prodes.historico.totalHa;
      const anual  = prodes.anual.totalHa;
      const pctT   = (total/area*100);
      const pctH   = (hist/area*100);
      const pctA   = (anual/area*100);
      const corT   = pctT>30?'#dc2626':pctT>10?'#d97706':'#16a34a';
      const grau   = pctT>50?'Ext. comprometido':pctT>30?'Fort. impactado':pctT>10?'Mod. impactado':'Baixo passivo';
      const anoMax = prodes.anosAnual[prodes.anosAnual.length-1]||'hoje';
      const maxBar = Math.max(...Object.values(prodes.anual.porAno||{}),0.01);
      const barras = prodes.anosAnual.map(ano=>{
        const ha=prodes.anual.porAno[ano]; const w=(ha/maxBar*100).toFixed(1);
        return `<tr>
          <td style="font-size:9px;color:#374151;padding:1px 8px 1px 0;white-space:nowrap">${ano}</td>
          <td style="width:100%"><div style="height:9px;background:#dc2626;border-radius:2px;width:${w}%;min-width:3px"></div></td>
          <td style="font-size:9px;font-weight:600;color:#374151;padding:1px 0 1px 8px;white-space:nowrap;text-align:right">${f2r(ha)} ha</td>
        </tr>`;
      }).join('');
      return `
      <div class="prodes-faixa">
        <div class="prodes-faixa-header">
          <span style="font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em">🛰 Desmatamento PRODES/INPE — Fonte Oficial</span>
          <span style="font-size:9px;color:rgba(255,255,255,.8)">TerraBrasilis · Landsat/Sentinel-2 · Resolução 30m</span>
        </div>
        <div class="prodes-kpis">
          <div class="prodes-kpi" style="background:#fff">
            <div class="prodes-kpi-val" style="color:${corT}">${f2r(total)} ha</div>
            <div class="prodes-kpi-lbl">Total desmatado · ${f1r(pctT)}% da área · <strong>${grau}</strong></div>
          </div>
          <div class="prodes-kpi" style="background:#fff7ed">
            <div class="prodes-kpi-val" style="color:#c2410c">${f2r(hist)} ha</div>
            <div class="prodes-kpi-lbl" style="color:#9a3412">🕰 Acumulado pré-2008 · ${f1r(pctH)}% · Passivo histórico</div>
          </div>
          <div class="prodes-kpi" style="background:#fef2f2">
            <div class="prodes-kpi-val" style="color:#dc2626">${f2r(anual)} ha</div>
            <div class="prodes-kpi-lbl" style="color:#991b1b">📡 Anual 2008–${anoMax} · ${f1r(pctA)}% · Monitoramento satelital</div>
          </div>
        </div>
        ${prodes.anosAnual.length>0?`
        <div class="prodes-serie">
          <div class="prodes-serie-title">Série histórica anual (2008–${anoMax})</div>
          <table style="width:100%;border-collapse:collapse">${barras}</table>
        </div>`:''}
      </div>`;
    })()}

    <!-- BLOCO 4: Diagnóstico Ambiental -->
    ${diag && !diag.erro ? `
    <div style="border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;margin-bottom:12px">
      <div style="background:#f0f7f2;padding:6px 14px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:9px;font-weight:700;color:#1F4E2C;text-transform:uppercase;letter-spacing:.06em">🔬 Diagnóstico Espacial (Turf.js · Camadas de Delimitação)</span>
      </div>
      <div style="padding:10px 14px">
        <div class="diag-cards">
          <div class="diag-card" style="border-color:#86efac">
            <div class="diag-card-val" style="color:#16a34a">${(diag.floresta||0).toLocaleString('pt-BR',{maximumFractionDigits:1})} ha</div>
            <div class="diag-card-lbl">Floresta<br>${(diag.pctFloresta||0).toFixed(1)}%</div>
          </div>
          <div class="diag-card" style="border-color:#fca5a5">
            <div class="diag-card-val" style="color:#d97706">${(diag.appA||0).toLocaleString('pt-BR',{maximumFractionDigits:1})} ha</div>
            <div class="diag-card-lbl">APP Degrad.<br>${(diag.pctAppDeg||0).toFixed(1)}%</div>
          </div>
          <div class="diag-card" style="border-color:#86efac">
            <div class="diag-card-val" style="color:#0891b2">${(diag.appV||0).toLocaleString('pt-BR',{maximumFractionDigits:1})} ha</div>
            <div class="diag-card-lbl">APP<br>Preservada</div>
          </div>
          <div class="diag-card" style="border-color:#bfdbfe">
            <div class="diag-card-val" style="color:#2563eb">${diag.hidro?.total||0}</div>
            <div class="diag-card-lbl">Seg.<br>Hídricos</div>

function _gerarDescricaoCAR(f){
  const p     = f.properties || {};
  const local = _carDadosLocais.get(p.cod_imovel) || {};
  const f2 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
  const f1 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
  const mf = parseFloat(p.m_fiscal)||0;
  const area = parseFloat(p.area)||0;
  const classe = mf < 1 ? 'minifúndio' : mf <= 4 ? 'pequena propriedade rural' : mf <= 15 ? 'média propriedade rural' : 'grande propriedade rural';
  const sb = _relDados?.subbacias?.find(s => s.nome === p._subbacia);
  let t = '';

  // Caracterização do imóvel
  const nomImovel  = local.nom_imovel  ? `<strong>${escHtml(local.nom_imovel)}</strong>, ` : '';
  const nomePropr  = local.nome_compl  ? `, pertencente a <strong>${escHtml(local.nome_compl)}</strong>` : '';
  const tipoRelacao= local.tipo_docum  ? ` sob regime de <strong>${local.tipo_docum.toLowerCase()}</strong>` : '';
  const classLabel = local.nome_class  ? `, com classificação ambiental <strong>${local.nome_class}</strong>` : '';
  t += `O imóvel ${nomImovel}classificado como <strong>${classe}</strong> com <strong>${f2(area)} ha</strong> declarados `;
  t += `(${f2(mf)} módulo${mf !== 1?'s':''} fiscal${mf!==1?'is':''}), `;
  t += `está situado no município de <strong>${p.municipio||'Rio Branco'}</strong>, estado do Acre${nomePropr}${tipoRelacao}${classLabel}. `;

  // Contexto APA
  if(p._apa === 'isf'){
    t += `O imóvel está inserido na <strong>Área de Proteção Ambiental Igarapé São Francisco</strong> `;
    t += `(Decreto Estadual nº 12.310, de 14 de julho de 2005), unidade de uso sustentável gerida pela SEMA/AC. `;
  } else if(p._apa === 'la'){
    t += `O imóvel está inserido na <strong>Área de Proteção Ambiental Lago do Amapá</strong> `;
    t += `(Decreto Estadual nº 13.531, de 26 de dezembro de 2005), gerida pela SEMA/AC. `;
  } else {
    t += `O imóvel está localizado na área de influência das APAs monitoradas pelo Projeto 218BRA2001. `;
  }

  // Contexto sub-bacia
  if(p._subbacia && sb){
    t += `O imóvel pertence à <strong>${p._subbacia}</strong>, que possui área total de ${f2(sb.area)} ha, `;
    t += `com <strong>${f1(sb.pctDesmat)}% de desmatamento acumulado</strong> (${f2(sb.desmat)} ha) `;
    t += `e ${f1(sb.pctPreserv)}% de formação florestal remanescente. `;
    if(sb.pctAppDeg > 0){
      t += `A APP desta sub-bacia encontra-se <strong>${f1(sb.pctAppDeg)}% degradada</strong> `;
      t += `(${f2(sb.appAntrop)} ha), configurando risco <strong>${sb.risco.toLowerCase()}</strong> de assoreamento `;
      t += `dos cursos hídricos. `;
    }
    if(sb.restaur > 0){
      t += `Foram identificadas <strong>${f2(sb.restaur)} ha</strong> como área prioritária para restauração ecológica nesta sub-bacia. `;
    }
    const critica = sb.pctDesmat > 15;
    if(critica) t += `⚠️ Esta sub-bacia encontra-se em <strong>situação crítica</strong> de pressão antrópica, demandando intervenção prioritária. `;
  } else if(p._subbacia){
    t += `O imóvel está na ${p._subbacia}. `;
  }

  // Status CAR
  const key = _carStatusKey(p.condicao);
  const statusTextos = {
    ativo:      'O cadastro ambiental do imóvel encontra-se <strong>ativo e regularizado</strong> no SICAR',
    aguardando: 'O cadastro ambiental do imóvel <strong>aguarda análise técnica</strong> pelo órgão ambiental competente',
    analise:    'O cadastro ambiental do imóvel <strong>encontra-se em processo de análise técnica</strong>',
    outro:      'A situação cadastral do imóvel <strong>requer verificação</strong> no SICAR',
  };
  t += `${statusTextos[key]||statusTextos.outro}, com registro datado de ${new Date(p.dat_criacao||Date.now()).toLocaleDateString('pt-BR')}. `;
  t += `Para diagnóstico socioambiental detalhado, consulte o <em>SeloVerde AC</em> e o <em>SICAR nacional</em>.`;
  return `<p>${t}</p>`;
}

function _htmlRelCAR(d){
  if(!_carCarregado || !_carFeatures.length){
    return `<div style="padding:48px;text-align:center">
      <div style="font-size:40px;margin-bottom:12px">🏡</div>
      <div style="font-size:14px;font-weight:600;color:var(--cinza-700);margin-bottom:8px">Camada CAR não carregada</div>
      <div style="font-size:12px;color:var(--cinza-400);margin-bottom:16px">Ative a camada CAR no painel do mapa e reabra o relatório.</div>
      <button class="btn btn-primary" style="font-size:12px" onclick="fecharRelatorioAmbiental();document.getElementById('car-toggle').click()">Ativar camada CAR</button>
    </div>`;
  }

  const { subbacias } = d;
  const f2 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
  const f1 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});

  const totalCar  = _carFeatures.length;
  const totalArea = _carFeatures.reduce((s,f) => s + (parseFloat(f.properties?.area)||0), 0);
  const porStatus = {};
  _carFeatures.forEach(f => {
    const k = _carStatusKey(f.properties?.condicao);
    porStatus[k] = (porStatus[k]||0) + 1;
  });

  // Por sub-bacia
  const porSub = {};
  _carFeatures.forEach(f => {
    const sb = f.properties?._subbacia || '—';
    if(!porSub[sb]) porSub[sb] = { n:0, area:0, status:{} };
    porSub[sb].n++;
    porSub[sb].area += parseFloat(f.properties?.area)||0;
    const k = _carStatusKey(f.properties?.condicao);
    porSub[sb].status[k] = (porSub[sb].status[k]||0) + 1;
  });

  // Por APA
  const isf = _carFeatures.filter(f => f.properties?._apa === 'isf');
  const la  = _carFeatures.filter(f => f.properties?._apa === 'la');
  const fora= _carFeatures.filter(f => f.properties?._apa === 'fora');

  // KPIs APA coverage
  const coberturaISF = d.tot?.area > 0 ? (_carFeatures.filter(f=>f.properties?._apa==='isf').reduce((s,f)=>s+(parseFloat(f.properties?.area)||0),0) / d.tot.area * 100) : 0;

  return `
  <div class="rel-kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px">
    <div class="rel-kpi rel-kpi-info"><div class="rel-kpi-val">${totalCar.toLocaleString('pt-BR')}</div><div class="rel-kpi-lbl">Total de CARs na área</div></div>
    <div class="rel-kpi"><div class="rel-kpi-val">${f2(totalArea)} ha</div><div class="rel-kpi-lbl">Área total declarada</div></div>
    <div class="rel-kpi rel-kpi-green"><div class="rel-kpi-val">${isf.length}</div><div class="rel-kpi-lbl">CARs na APA ISF</div></div>
    <div class="rel-kpi rel-kpi-info"><div class="rel-kpi-val">${la.length}</div><div class="rel-kpi-lbl">CARs na APA Lago Amapá</div></div>
    <div class="rel-kpi rel-kpi-warn"><div class="rel-kpi-val">${(porStatus.aguardando||0).toLocaleString('pt-BR')}</div><div class="rel-kpi-lbl">Aguardando análise</div></div>
    <div class="rel-kpi"><div class="rel-kpi-val">${f1(coberturaISF)}%</div><div class="rel-kpi-lbl">Cobertura CAR na APA ISF</div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div class="rel-section">
      <div class="rel-section-title">📊 CARs por Situação</div>
      <div style="height:200px"><canvas id="chart-car-status"></canvas></div>
    </div>
    <div class="rel-section">
      <div class="rel-section-title">🗺 Distribuição por APA</div>
      <div style="height:200px"><canvas id="chart-car-apa"></canvas></div>
    </div>
  </div>

  <div class="rel-section">
    <div class="rel-section-title">🗂 CARs por Sub-bacia</div>
    <div style="overflow-x:auto;margin-top:4px">
      <table class="rel-table">
        <thead><tr>
          <th>Sub-bacia</th><th style="text-align:right">Nº CARs</th>
          <th style="text-align:right">Área declarada (ha)</th>
          <th style="text-align:right">Área sub-bacia (ha)</th>
          <th style="text-align:center">Cobertura CAR</th>
          <th style="text-align:center">Ativos</th><th style="text-align:center">Aguardando</th><th style="text-align:center">Em análise</th>
        </tr></thead>
        <tbody>
          ${Object.entries(porSub)
            .filter(([k]) => k !== '—')
            .sort((a,b) => b[1].n - a[1].n)
            .map(([nome, info]) => {
              const sbDados = subbacias?.find(s => s.nome === nome);
              const cobert  = sbDados?.area > 0 ? info.area / sbDados.area * 100 : null;
              return `<tr>
                <td style="font-weight:600">${escHtml(nome)}</td>
                <td style="text-align:right;font-weight:700">${info.n}</td>
                <td style="text-align:right">${f2(info.area)}</td>
                <td style="text-align:right;color:var(--cinza-400)">${sbDados ? f2(sbDados.area) : '—'}</td>
                <td style="text-align:center">${cobert != null ? `<span style="font-weight:700;color:${cobert>80?'#16a34a':cobert>50?'#d97706':'#dc2626'}">${f1(cobert)}%</span>` : '—'}</td>
                <td style="text-align:center;color:#16a34a">${info.status.ativo||0}</td>
                <td style="text-align:center;color:#d97706">${info.status.aguardando||0}</td>
                <td style="text-align:center;color:#2563eb">${info.status.analise||0}</td>
              </tr>`;
            }).join('')}
          ${porSub['—'] ? `<tr style="color:var(--cinza-400)">

            <td style="text-align:right">${porSub['—'].n}</td>
            <td style="text-align:right">${f2(porSub['—'].area)}</td>
            <td colspan="5" style="text-align:center">—</td>
          </tr>` : ''}
        </tbody>
      </table>
    </div>
  </div>`;
}

let _diagSessaoBatchRunning = false;

function _htmlRelDiagnosticoSessao(d){
  const cached = [..._carDiagCache.entries()].filter(([,v]) => v && !v.erro);
  const total  = _carFeatures.length;
  const f2 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
  const f1 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});

  if(!_carCarregado || !total){
    return `<div style="padding:48px;text-align:center">
      <div style="font-size:40px;margin-bottom:12px">🔬</div>
      <div style="font-size:14px;font-weight:600;color:var(--cinza-700);margin-bottom:8px">Camada CAR não carregada</div>
      <div style="font-size:12px;color:var(--cinza-400)">Ative a camada CAR no painel do mapa e reabra o relatório.</div>
    </div>`;
  }

  // Agrega métricas de todos os diagnósticos no cache
  const agg = cached.reduce((s,[,v]) => {
    s.desmat   += v.desmat   || 0;
    s.floresta += v.floresta || 0;
    s.appA     += v.appA     || 0;
    s.appV     += v.appV     || 0;
    s.restaur  += v.restaur  || 0;
    s.nascentes+= v.nascentes|| 0;
    s.hidro    += v.hidro?.total || 0;
    return s;
  }, { desmat:0, floresta:0, appA:0, appV:0, restaur:0, nascentes:0, hidro:0 });
  const deficit = agg.desmat - agg.restaur;
  const appTotal = agg.appA + agg.appV;
  const pctAppDeg = appTotal > 0 ? agg.appA / appTotal * 100 : 0;

  // Ranking por risco
  const ranking = cached
    .map(([cod, v]) => {
      const feat = _carFeatures.find(f => f.properties?.cod_imovel === cod);
      const p = feat?.properties || {};
      return { cod, municipio: p.municipio||'—', area: parseFloat(p.area)||0,
               risco: v.risco, prioridade: v.prioridade,
               pctDesmat: v.pctDesmat, desmat: v.desmat, pctAppDeg: v.pctAppDeg };
    })
    .sort((a,b) => {
      const ord = { Alto:0, Médio:1, Baixo:2 };
      return (ord[a.risco]??3) - (ord[b.risco]??3) || b.pctDesmat - a.pctDesmat;
    });

  const altos  = ranking.filter(r => r.risco === 'Alto').length;
  const medios = ranking.filter(r => r.risco === 'Médio').length;
  const baixos = ranking.filter(r => r.risco === 'Baixo').length;

  const semDiag = total - cached.length;

  return `
  <!-- Barra de progresso -->
  <div style="background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="flex:1;min-width:200px">
      <div style="font-size:12px;font-weight:600;color:var(--cinza-700);margin-bottom:6px">
        🔬 Diagnósticos calculados: <strong>${cached.length}</strong> de <strong>${total}</strong> CARs
      </div>
      <div style="height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${total>0?(cached.length/total*100).toFixed(1):0}%;background:linear-gradient(90deg,#1F4E2C,#16a34a);border-radius:4px;transition:width .4s"></div>
      </div>
      ${semDiag > 0 ? `<div style="font-size:10px;color:var(--cinza-400);margin-top:4px">${semDiag} imóvel(is) sem diagnóstico — clique em cada um no mapa ou use o cálculo em lote</div>` : '<div style="font-size:10px;color:#16a34a;margin-top:4px">✅ Todos os CARs com diagnóstico calculado</div>'}
    </div>
    <div style="display:flex;gap:7px;flex-shrink:0">
      <button id="btn-diag-batch" onclick="_calcularDiagBatch()" class="btn btn-primary" style="font-size:12px;display:flex;align-items:center;gap:5px">
        <span id="btn-diag-batch-ico">⚡</span> Calcular todos
      </button>
      ${cached.length > 0 ? `<button onclick="_exportarDiagCSV()" class="btn btn-outline" style="font-size:12px">📥 CSV</button>` : ''}
    </div>
  </div>

  ${cached.length === 0 ? `
  <div style="padding:48px;text-align:center;color:var(--cinza-400)">
    <div style="font-size:40px;margin-bottom:12px">🔬</div>
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">Nenhum diagnóstico calculado ainda</div>
    <div style="font-size:12px;margin-bottom:16px">Clique em um imóvel CAR no mapa e acesse a aba Diagnóstico, ou use o botão "Calcular todos" acima.</div>
  </div>` : `

  <!-- KPIs agregados -->
  <div class="rel-kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(155px,1fr));margin-bottom:16px">
    <div class="rel-kpi rel-kpi-danger"><div class="rel-kpi-val">${f2(agg.desmat)} ha</div><div class="rel-kpi-lbl">Total Desmatado</div><div class="rel-kpi-sub">${cached.length} imóvel(is)</div></div>
    <div class="rel-kpi rel-kpi-green"><div class="rel-kpi-val">${f2(agg.floresta)} ha</div><div class="rel-kpi-lbl">Total Florestal</div></div>
    <div class="rel-kpi rel-kpi-warn"><div class="rel-kpi-val">${f2(agg.appA)} ha</div><div class="rel-kpi-lbl">APP Degradada Total</div><div class="rel-kpi-sub">${f1(pctAppDeg)}% da APP</div></div>
    <div class="rel-kpi rel-kpi-green"><div class="rel-kpi-val">${f2(agg.appV)} ha</div><div class="rel-kpi-lbl">APP Preservada Total</div></div>
    <div class="rel-kpi rel-kpi-info"><div class="rel-kpi-val">${f2(agg.restaur)} ha</div><div class="rel-kpi-lbl">Restauração Proposta</div></div>
    <div class="rel-kpi" style="${deficit>0?'border-color:#fca5a5;background:#fef2f2':'border-color:#86efac;background:#f0fdf4'}">
      <div class="rel-kpi-val" style="color:${deficit>0?'#dc2626':'#16a34a'}">${f2(Math.abs(deficit))} ha</div>
      <div class="rel-kpi-lbl">${deficit>0?'Déficit':'Excedente'} de Restauração</div>
    </div>

async function _calcularDiagBatch(){
  if(_diagSessaoBatchRunning){ toast('Cálculo em andamento…','warning'); return; }
  if(!_carFeatures.length){ toast('Nenhum CAR carregado','warning'); return; }

  _diagSessaoBatchRunning = true;
  const btn = document.getElementById('btn-diag-batch');
  const ico = document.getElementById('btn-diag-batch-ico');
  if(btn) btn.disabled = true;
  if(ico) ico.textContent = '⏳';

  const pendentes = _carFeatures.filter(f => !_carDiagCache.has(f.properties?.cod_imovel));
  toast(`Calculando ${pendentes.length} diagnóstico(s)… pode levar alguns segundos.`,'info');

  let done = 0;
  for(const f of pendentes){
    const cod = f.properties?.cod_imovel;
    if(!cod) continue;
    try{
      const d = await _calcularDiagnosticoCAR(f);
      _carDiagCache.set(cod, d);
    }catch(_){}
    done++;
    if(done % 10 === 0) toast(`${done}/${pendentes.length} calculados…`,'info');
  }

  _diagSessaoBatchRunning = false;
  if(btn) btn.disabled = false;
  if(ico) ico.textContent = '⚡';
  toast(`✅ ${done} diagnóstico(s) calculado(s)!`,'success');

  // Re-renderiza a aba
  if(_relAba === 'diagnostico-sessao'){
    const body = document.getElementById('rel-body');
    if(body) body.innerHTML = _htmlRelDiagnosticoSessao(_relDados);
    setTimeout(_chartDiagSessao, 60);
  }
}

function _exportarDiagCSV(){
  const cached = [..._carDiagCache.entries()].filter(([,v]) => v && !v.erro);
  if(!cached.length){ toast('Nenhum diagnóstico para exportar','warning'); return; }
  const f2 = n => Number(n||0).toFixed(2);
  const f1 = n => Number(n||0).toFixed(1);
  const header = ['cod_imovel','municipio','area_ha','desmat_ha','pct_desmat','floresta_ha','pct_floresta',
    'app_degradada_ha','app_vegetacao_ha','pct_app_deg','restauracao_ha','deficit_ha',
    'nascentes','hidro_segmentos','risco','prioridade'].join(';');
  const rows = cached.map(([cod, v]) => {
    const feat = _carFeatures.find(f => f.properties?.cod_imovel === cod);
    const p = feat?.properties || {};
    return [cod, p.municipio||'', f2(p.area||0), f2(v.desmat), f1(v.pctDesmat),
      f2(v.floresta), f1(v.pctFloresta), f2(v.appA), f2(v.appV), f1(v.pctAppDeg),
      f2(v.restaur), f2(v.deficit), v.nascentes||0, v.hidro?.total||0,
      v.risco, v.prioridade].join(';');
  });
  const blob = new Blob(['﻿'+header+'\n'+rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `diagnostico-car-sessao-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV exportado!','success');
}

function _chartDiagSessao(){
  const cached = [..._carDiagCache.entries()].filter(([,v]) => v && !v.erro);
  if(!cached.length || typeof Chart === 'undefined') return;

  // Gráfico de risco (doughnut)
  const ctxR = document.getElementById('chart-diag-sessao-risco');
  if(ctxR){
    const altos  = cached.filter(([,v])=>v.risco==='Alto').length;
    const medios = cached.filter(([,v])=>v.risco==='Médio').length;
    const baixos = cached.filter(([,v])=>v.risco==='Baixo').length;
    const ch = new Chart(ctxR,{
      type:'doughnut',
      data:{ labels:['Risco Alto','Risco Médio','Risco Baixo'],
        datasets:[{data:[altos,medios,baixos],backgroundColor:['#dc2626','#f59e0b','#16a34a'],borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},
          tooltip:{callbacks:{label:c=>`${c.label}: ${c.parsed}`}}}}
    });

  // Gráfico uso do solo (bar horizontal)
  const ctxU = document.getElementById('chart-diag-sessao-uso');

    const agg = cached.reduce((s,[,v])=>({
      desmat: s.desmat+(v.desmat||0),
      floresta: s.floresta+(v.floresta||0),
      appA: s.appA+(v.appA||0),
      appV: s.appV+(v.appV||0),
      restaur: s.restaur+(v.restaur||0),
    }),{desmat:0,floresta:0,appA:0,appV:0,restaur:0});
    const ch = new Chart(ctxU,{
      type:'bar',
      data:{
        labels:['Desmatado','Florestal','APP Degradada','APP Vegetação','Restauração'],
        datasets:[{data:[agg.desmat,agg.floresta,agg.appA,agg.appV,agg.restaur],
          backgroundColor:['#dc2626','#16a34a','#f59e0b','#86efac','#0891b2'],borderRadius:4}]

      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>`${Number(c.parsed.x).toLocaleString('pt-BR',{maximumFractionDigits:2})} ha`}}},
        scales:{x:{ticks:{callback:v=>Number(v).toLocaleString('pt-BR')+'ha'},grid:{color:'#f3f4f6'}},y:{grid:{display:false}}}
      }
    });

// ── Cálculo dos dados ─────────────────────────────────────────────────────
async function _calcularDadosAmbientais(){
  // Usa o array global de camadas se já tiver geojson carregado;
  // caso contrário busca direto do banco (fallback robusto)
  let fonte = camadas.filter(c => c.geojson && c.geojson.features);
  if(!fonte.length){
    const { data } = await db.from('apa_demarcacoes')
      .select('id, nome, apa_key, cor, geojson, visivel, feature_colors')
      .order('created_at');
    fonte = (data || []).filter(c => c.geojson && c.geojson.features);
  }

  const findC = (...terms) => fonte.find(c =>
    c.nome && terms.some(t => c.nome.toLowerCase().includes(t.toLowerCase()))
  );
  const feats = c => c?.geojson?.features || [];
  const nArea = p => parseFloat(p?.['area (ha)'] != null ? p['area (ha)'] : p?.['AREA ha'] != null ? p['AREA ha'] : p?.['AREA HA'] != null ? p['AREA HA'] : p?.area != null ? p.area : 0) || 0;
  const toMap = (layer, fn, fa) => {
    if(!fa) fa = nArea;
    const m = {};
    feats(layer).forEach(f => {
      const p = f.properties || {};
      const n = fn ? fn(p) : (p.name || p.name_2 || p.name_3 || p.name_4 || p.Name || p.NAME || '');
      if(n) m[n] = fa(p);
    });
    return m;
  };

  const lSub   = findC('subbacias','Subbacias');
  const lDesm  = findC('desmatamento','Desmatamento');
  const lFlor  = findC('florestal','Florestal');
  const lAppA  = findC('antropizada','Antropizada');
  const lAppV  = findC('app vegetação','APP Vegetação');
  const lRest  = findC('restauração','Restauração');
  const lHidro = findC('hidrografia','Hidrografia');

  const mSub  = toMap(lSub);
  const mDesm = toMap(lDesm,  p => p?.name || '', p => parseFloat(p?.['AREA ha']  || 0) || 0);
  const mFlor = toMap(lFlor);
  const mAppA = toMap(lAppA, p => p?.name_4 || '');
  const mAppV = toMap(lAppV, p => p?.name_3 || '', p => parseFloat(p?.['AREA HA'] || p?.area || 0) || 0);
  const mRest = toMap(lRest, p => p?.name  || '', p => parseFloat(p?.['AREA HA'] || 0) || 0);

  const subbacias = Object.entries(mSub).map(([nome, area]) => {
    const desmat    = mDesm[nome] || 0;
    const floresta  = mFlor[nome] || 0;
    const appAntrop = mAppA[nome] || 0;
    const appVeg    = mAppV[nome] || 0;
    const restaur   = mRest[nome] || 0;
    const pctDesmat  = area > 0 ? desmat   / area * 100 : 0;
    const pctPreserv = area > 0 ? floresta / area * 100 : 0;
    const appTotal   = appAntrop + appVeg;
    const pctAppDeg  = appTotal > 0 ? appAntrop / appTotal * 100 : 0;
    const deficit    = desmat - restaur;
    const risco      = pctAppDeg > 60 || pctDesmat > 25 ? 'Alto' : pctAppDeg > 30 || pctDesmat > 10 ? 'Médio' : 'Baixo';
    const prioridade = pctDesmat > 15 || deficit > 200   ? 'Alta' : pctDesmat > 5  || deficit > 0   ? 'Média' : 'Baixa';
    return { nome, area, desmat, floresta, appAntrop, appVeg, restaur,
             pctDesmat, pctPreserv, appTotal, pctAppDeg, deficit, risco, prioridade };
  }).sort((a, b) => b.desmat - a.desmat);

  const tot = {
    area:  subbacias.reduce((s,x) => s + x.area,     0),
    desmat:subbacias.reduce((s,x) => s + x.desmat,   0),
    flor:  subbacias.reduce((s,x) => s + x.floresta, 0),
    appA:  subbacias.reduce((s,x) => s + x.appAntrop,0),
    appV:  subbacias.reduce((s,x) => s + x.appVeg,   0),
    rest:  subbacias.reduce((s,x) => s + x.restaur,  0),
  };
  tot.pctDesmat  = tot.area > 0 ? tot.desmat / tot.area * 100 : 0;
  tot.pctPreserv = tot.area > 0 ? tot.flor   / tot.area * 100 : 0;
  tot.appTotal   = tot.appA + tot.appV;
  tot.pctAppDeg  = tot.appTotal > 0 ? tot.appA / tot.appTotal * 100 : 0;

  const hf = feats(lHidro);
  const hidro = {
    total:         hf.length,
    comprimento:   hf.reduce((s,f) => s + (parseFloat(f.properties?.LENGTH) || 0), 0),
    intermitentes: hf.filter(f => /intermit/i.test(f.properties?.REGIME || '')).length,
    perenes:       hf.filter(f => /peren/i.test(f.properties?.REGIME   || '')).length,
    semNome:       hf.filter(f => !(f.properties?.NOME_1 || '').trim()).length,
    nomes: [...new Set(hf.map(f => (f.properties?.NOME_1||'').trim()).filter(Boolean))].slice(0,15),
  };
  return { subbacias, tot, hidro };
}

// ── Seção PRODES para o Relatório Textual ────────────────────────────────
function _htmlRelProdes(){
  const f2 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
  const f1 = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});

  // Agrega série anual consolidada

  entradas.forEach(([,v]) => {

  const anosGlobal = Object.keys(porAnoGlobal).sort();

    return `<p>Os dados oficiais do PRODES/INPE não foram carregados para nenhum imóvel nesta sessão. Para visualizar, selecione um imóvel CAR no mapa e acesse a aba <strong>🌳 PRODES</strong>.</p>

  const maxAnualHa = Math.max(...Object.values(porAnoGlobal), 0.01);

  <div style="display:flex;gap:12px;margin:12px 0;flex-wrap:wrap">

      <div style="font-size:20px;font-weight:700;color:#c2410c">${f2(totalHist)} ha</div>
      <div style="font-size:11px;color:#9a3412;margin-top:2px">Acumulado pré-2008</div>
      <div style="font-size:10px;color:#fdba74;margin-top:4px;line-height:1.3">Passivo histórico anterior ao monitoramento anual sistemático</div>
    </div>
    <div style="flex:1;min-width:120px;padding:12px;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;text-align:center">
      <div style="font-size:20px;font-weight:700;color:#dc2626">${f2(totalAnual)} ha</div>
      <div style="font-size:11px;color:#991b1b;margin-top:2px">Pós-2008 (anual)</div>
      <div style="font-size:10px;color:#fca5a5;margin-top:4px;line-height:1.3">Detecção por satélite ano a ano — monitoramento rigoroso</div>
    </div>
    <div style="flex:1;min-width:120px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;text-align:center">

function _chartVisaoGeral(d){
  const ctx = document.getElementById('chart-visao-geral');
  if(!ctx || typeof Chart === 'undefined') return;
  const { subbacias } = d;
  const nomes = subbacias.map(s => s.nome.replace('Sub-bacia ','SB '));
  const ch = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: nomes,
      datasets: [
        { label:'Formação Florestal (ha)', data: subbacias.map(s=>s.floresta),  backgroundColor:'#16a34a', stack:'a' },
        { label:'Desmatamento (ha)',        data: subbacias.map(s=>s.desmat),    backgroundColor:'#dc2626', stack:'a' },
        { label:'APP Degradada (ha)',       data: subbacias.map(s=>s.appAntrop), backgroundColor:'#f59e0b', stack:'a' },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom'}, tooltip:{callbacks:{label: c => `${c.dataset.label}: ${Number(c.parsed.y).toLocaleString('pt-BR',{maximumFractionDigits:2})} ha`}} },
      scales:{ x:{stacked:true}, y:{stacked:true, ticks:{callback: v => Number(v).toLocaleString('pt-BR')+' ha'}} }
    }
  });
  _relCharts.push(ch);
}

function _chartRanking(d){
  const ctx = document.getElementById('chart-ranking');
  if(!ctx || typeof Chart === 'undefined') return;
  const sorted = [...d.subbacias].sort((a,b) => b.area - a.area);
  const fmt = v => Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2})+' ha';
  const outros = sorted.map(s => Math.max(0, s.area - s.floresta - s.desmat - s.appAntrop));
  const ch = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(s => s.nome.replace('Sub-bacia ','SB ')),
      datasets:[
        { label:'Formação Florestal',  data: sorted.map(s=>s.floresta),  backgroundColor:'#16a34a', stack:'a' },
        { label:'Desmatamento',        data: sorted.map(s=>s.desmat),    backgroundColor:'#dc2626', stack:'a' },
        { label:'APP Degradada',       data: sorted.map(s=>s.appAntrop), backgroundColor:'#f59e0b', stack:'a' },
        { label:'Outras Coberturas',   data: outros,                     backgroundColor:'#d1d5db', stack:'a' },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } },
        tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}` } }
      },
      scales:{
        x:{ stacked:true, grid:{display:false} },
        y:{ stacked:true, ticks:{ callback: v => Number(v).toLocaleString('pt-BR')+' ha' } }
      }
    }
  });
  _relCharts.push(ch);
}

function _chartHidro(d){
  const ctx = document.getElementById('chart-hidro');
  if(!ctx || typeof Chart === 'undefined') return;
  const { hidro } = d;
  const outros = Math.max(0, hidro.total - hidro.intermitentes - hidro.perenes);
  const ch = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:['Intermitentes','Perenes','Outros/N.class.'],
      datasets:[{ data:[hidro.intermitentes, hidro.perenes, outros],
        backgroundColor:['#f59e0b','#0891b2','#9ca3af'], borderWidth:2, borderColor:'#fff' }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom'}, tooltip:{callbacks:{label: c => `${c.label}: ${Number(c.parsed).toLocaleString('pt-BR')} segmentos`}} }
    }
  });
  _relCharts.push(ch);
}

function exportarRelCSV(){
  if(!_relDados) return;
  const { subbacias } = _relDados;
  const f2 = n => Number(n).toFixed(2);
  const f1 = n => Number(n).toFixed(1);
  const header = ['Sub-bacia','Área Total (ha)','Desmatada (ha)','% Desmatado','Florestal (ha)','% Preservado',
    'APP Degradada (ha)','APP Vegetação (ha)','% APP Degradada','Proposta Restauração (ha)','Déficit (ha)',
    'Risco Assoreamento','Prioridade Restauração'].join(';');
  const rows = subbacias.map(s =>
    [s.nome, f2(s.area), f2(s.desmat), f1(s.pctDesmat), f2(s.floresta), f1(s.pctPreserv),
     f2(s.appAntrop), f2(s.appVeg), f1(s.pctAppDeg), f2(s.restaur), f2(s.deficit),
     s.risco, s.prioridade].join(';')
  );
  const blob = new Blob(['﻿' + header + '\n' + rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `relatorio-ambiental-apa-isf-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV exportado com sucesso!', 'success');
}

function _htmlRelCARPrint(d){
