  const areaTot   = _carFeatures.reduce((s,f) => s + (parseFloat(f.properties?.area)||0), 0);
  const porStatus = {};
  _carFeatures.forEach(f => { const k = _carStatusKey(f.properties?.condicao); porStatus[k] = (porStatus[k]||0)+1; });
  const isf = _carFeatures.filter(f=>f.properties?._apa==='isf').length;
  const la  = _carFeatures.filter(f=>f.properties?._apa==='la').length;
  const porSub = {};

    if(!porSub[sb]) porSub[sb] = {n:0, area:0, status:{}};
    porSub[sb].n++; porSub[sb].area += parseFloat(f.properties?.area)||0;
    const k = _carStatusKey(f.properties?.condicao);

          <td style="text-align:center">${f1(s.pctAppDeg)}%</td>
          <td style="text-align:center">${f1(s.pctDesmat)}%</td>
          <td style="text-align:center;font-weight:700;color:${s.pctDesmat>15?'#dc2626':s.pctDesmat>8?'#d97706':'#16a34a'}">${s.pctDesmat>15?'Alta':s.pctDesmat>8?'Média':'Baixa'}</td>
          <td style="text-align:center">${s.risco==='Alto'?'<span class="rel-badge rel-badge-danger">Alto</span>':s.risco==='Médio'?'<span class="rel-badge rel-badge-warn">Médio</span>':'<span class="rel-badge rel-badge-ok">Baixo</span>'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

// ── Utilitários ───────────────────────────────────────────────────────────
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function togglePainelMobile(){
  const wrap = document.querySelector('.mapa-painel-wrap');
  const backdrop = document.getElementById('mapa-backdrop');
  if(!wrap) return;
  const aberto = wrap.classList.toggle('mobile-aberto');
  if(backdrop) backdrop.classList.toggle('ativo', aberto);
  const btn = document.getElementById('btn-filtros-mobile');
  if(!btn) return;
  btn.innerHTML = aberto
    ? `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Fechar`
    : `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="18" x2="12" y2="18"/></svg> Filtros`;
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// UNIDADES DE CONSERVAÇÃO  —  /data/uc_acre.geojson
// Fonte: Shapefile oficial SEMA/AC (21 UCs · federal + estadual + municipal)
// Campos: nome, sigla, categoria, grupo (PI/US), esfera, ano_cria, ato_cria,
//         gestor, municipios, area_ha, cor, centro_lon, centro_lat
// ═══════════════════════════════════════════════════════════════════════════

// ── Cores individuais por UC — persistidas no localStorage ────────────────
var _ucCoresLS = {};
try { _ucCoresLS = JSON.parse(localStorage.getItem('dima_uc_cores') || '{}'); } catch(e){}

function _ucCorNome(nome, fallback) {
  return _ucCoresLS[nome] || fallback || '#6b7280';
}
function _ucSalvarCores() {
  try { localStorage.setItem('dima_uc_cores', JSON.stringify(_ucCoresLS)); } catch(e) {}
}
function ucAlterarCor(nome, cor) {
  _ucCoresLS[nome] = cor;
  _ucSalvarCores();
  var sw = document.querySelector('[data-ucsw="' + nome.replace(/"/g,'&quot;') + '"]');
  if (sw) sw.style.background = cor;
  if (_ucLayer) {
    _ucLayer.eachLayer(function(l) {
      if (l.feature && l.feature.properties && l.feature.properties.nome === nome)
        l.setStyle({ color: cor, fillColor: cor });
    });
  }
}

// Color picker reutilizável
var _ucPickerEl = null, _ucPickerNome = null;
function ucAbrirColorPicker(nome, el) {
  if (!_ucPickerEl) {
    _ucPickerEl = document.createElement('input');
    _ucPickerEl.type = 'color';
    _ucPickerEl.style.cssText = 'position:fixed;opacity:0;width:0;height:0;pointer-events:none';
    document.body.appendChild(_ucPickerEl);
    _ucPickerEl.addEventListener('input', function(e) {
      if (_ucPickerNome) ucAlterarCor(_ucPickerNome, e.target.value);
    });
  }
  _ucPickerNome = nome;
  _ucPickerEl.value = (_ucCoresLS[nome] || el.style.backgroundColor || '#059669').replace(/[^#0-9a-fA-F]/g,'').substring(0,7) || '#059669';
  _ucPickerEl.click();
}

var _ucGeojson = null;
var _ucLayer   = null;
var _ucOpacity = 0.4;
var _ucAtivo   = false;
var _ucLabels  = true;

var _tiGeojson = null;
var _tiLayer   = null;
var _tiOpacity = 0.4;
var _tiAtivo   = false;

function _ucGrupoId(grupo) {
  if (!grupo) return 'us';
  var g = grupo.toLowerCase();
  return (g === 'pi' || g.indexOf('integral') >= 0) ? 'pi' : 'us';
}

async function _carregarUC() {
  document.getElementById('uc-loading').style.display = 'flex';
  try {
    var r = await fetch('../data/uc_acre.geojson');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    _ucGeojson = await r.json();
  } catch(e) {
    document.getElementById('uc-loading').style.display = 'none';
    document.getElementById('uc-controles').style.display = 'flex';
    document.getElementById('uc-stat').textContent = '⚠ Erro: ' + e.message;
    return;
  }
  document.getElementById('uc-loading').style.display = 'none';
  document.getElementById('uc-controles').style.display = 'flex';
  _ucConstruirPainel();
  _renderizarUC();
  _ucStatsAtualizar();
  document.getElementById('uc-stats-card').classList.add('visivel');
}

function _ucConstruirPainel() {
  // Injetar toggle de labels e atualizar titulo acima dos grupos
  var tituloEl = document.querySelector('.uc-secao-titulo');
  if (tituloEl && !document.getElementById('uc-labels-toggle')) {
    var toggleRow = document.createElement('div');
    toggleRow.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:6px';
    toggleRow.innerHTML = '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--cinza-700)">'
      + '<input type="checkbox" id="uc-labels-toggle" checked style="accent-color:var(--verde-escuro);width:12px;height:12px;cursor:pointer" onchange="ucToggleLabels(this.checked)">'
      + 'Exibir nome sobre a área</label>';
    tituloEl.parentNode.insertBefore(toggleRow, tituloEl);
  }

  // Construir lista de UCs por nome (PI e US separados)
  var pi = [], us = [];
  (_ucGeojson.features || []).forEach(function(f) {
    var p = f.properties;
    var g = _ucGrupoId(p.grupo);
    var item = { nome: p.nome || '', sigla: p.sigla || '', esfera: p.esfera || '', cor: _ucCorNome(p.nome, p.cor) };
    if (g === 'pi') pi.push(item); else us.push(item);
  });

  function esferaBadge(esf) {
    if (esf === 'federal')
      return '<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;flex-shrink:0">' + esf + '</span>';
    if (esf === 'estadual')
      return '<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#fefce8;color:#854d0e;border:1px solid #fde68a;flex-shrink:0">' + esf + '</span>';
    return '<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#f0fdf4;color:#166534;border:1px solid #86efac;flex-shrink:0">' + esf + '</span>';
  }

  function buildList(items) {
    return items.sort(function(a,b){ return a.nome.localeCompare(b.nome); }).map(function(item) {
      return '<div class="uc-filtro-label" style="gap:5px;padding:3px 0;align-items:center">'
        + '<input type="checkbox" checked data-uc-nome="' + esc(item.nome) + '" style="accent-color:' + item.cor + ';width:12px;height:12px;cursor:pointer;flex-shrink:0" onchange="filtrarUC()">'
        + '<div data-ucsw="' + esc(item.nome) + '" style="background:' + item.cor + ';border:1px solid ' + item.cor + ';cursor:pointer;width:14px;height:14px;border-radius:3px;flex-shrink:0" title="Mudar cor" onclick="ucAbrirColorPicker(\'' + esc(item.nome).replace(/'/g,'\\\'') + '\',this)"></div>'
        + '<span style="font-size:10px;font-weight:600;color:var(--cinza-500);flex-shrink:0">' + esc(item.sigla) + '</span>'
        + '<span style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(item.nome) + '">' + esc(item.nome) + '</span>'
        + esferaBadge(item.esfera)
        + '</div>';
    }).join('');
  }

  var piEl = document.getElementById('uc-tipos-pi');
  var usEl = document.getElementById('uc-tipos-us');
  if (piEl) piEl.innerHTML = pi.length ? buildList(pi) : '<span style="font-size:10px;color:var(--cinza-400)">Nenhuma</span>';
  if (usEl) usEl.innerHTML = us.length ? buildList(us) : '<span style="font-size:10px;color:var(--cinza-400)">Nenhuma</span>';
}

function _renderizarUC() {
  if (_ucLayer) { mapaL.removeLayer(_ucLayer); _ucLayer = null; }
  if (!_ucGeojson || !_ucAtivo) return;

  var esfFed = document.getElementById('uc-esfera-federal') ? document.getElementById('uc-esfera-federal').checked : true;
  var esfEst = document.getElementById('uc-esfera-estadual') ? document.getElementById('uc-esfera-estadual').checked : true;
  var esfMun = document.getElementById('uc-esfera-municipal') ? document.getElementById('uc-esfera-municipal').checked : true;

  var nomesAtivos = new Set(
    Array.from(document.querySelectorAll('[data-uc-nome]'))
      .filter(function(el){ return el.checked; })
      .map(function(el){ return el.dataset.ucNome; })
  );

  var count = 0;
  _ucLayer = L.geoJSON(_ucGeojson, {
    style: function(f) {
      var p = f.properties;
      var cor = _ucCorNome(p.nome, p.cor);
      return { color: cor, weight: 2, opacity: 0.9, fillColor: cor, fillOpacity: _ucOpacity };
    },
    filter: function(f) {
      var esf = (f.properties.esfera || '').toLowerCase();
      if (esf === 'federal'   && !esfFed) return false;
      if (esf === 'estadual'  && !esfEst) return false;
      if (esf === 'municipal' && !esfMun) return false;
      if (nomesAtivos.size > 0 && !nomesAtivos.has(f.properties.nome)) return false;
      count++;
      return true;
    },
    onEachFeature: function(f, layer) {
      var p   = f.properties;
      var cor = _ucCorNome(p.nome, p.cor);
      var gid = _ucGrupoId(p.grupo);
      var corG = gid === 'pi' ? '#dc2626' : '#2563eb';
      var lblG = gid === 'pi' ? 'Proteção Integral' : 'Uso Sustentável';
      var ha   = p.area_ha ? Number(p.area_ha).toLocaleString('pt-BR', {maximumFractionDigits:0}) : '';

      // Label permanente no centroide
      if (_ucLabels && p.centro_lon && p.centro_lat) {
        var tt = L.tooltip({ permanent: true, direction: 'center', className: 'uc-label-tt', interactive: false });
        tt.setContent('<span style="color:' + cor + '">' + esc(p.sigla || '') + '</span> ' + esc(p.nome || ''));
        tt.setLatLng([p.centro_lat, p.centro_lon]);
        tt.addTo(mapaL);
        layer._ucLabel = tt;
        layer.on('remove', function() { try { mapaL.removeLayer(tt); } catch(x){} });
      }

      // Popup completo
      var popHtml = '<div class="camada-popup">'
        + '<div class="cp-header" style="background:#1a5f38">🌿 Unidade de Conservação</div>'
        + '<div class="cp-layer">'
        + '<div class="cp-layer-nome" style="color:' + cor + '">' + esc((p.sigla || '') + ' — ' + (p.nome || '')) + '</div>'
        + '<div class="cp-row"><strong>Categoria</strong><span>' + esc(p.categoria || p.sigla || '') + '</span></div>'
        + '<div class="cp-row"><strong>Esfera</strong><span style="text-transform:capitalize">' + esc(p.esfera || '') + '</span></div>'
        + (p.municipios ? '<div class="cp-row"><strong>Municípios</strong><span>' + esc(p.municipios) + '</span></div>' : '')
        + (p.ano_cria   ? '<div class="cp-row"><strong>Criação</strong><span>' + esc(p.ano_cria) + '</span></div>' : '')
        + (p.ato_cria   ? '<div class="cp-row"><strong>Ato legal</strong><span style="font-size:10px">' + esc(p.ato_cria) + '</span></div>' : '')
        + (ha           ? '<div class="cp-row"><strong>Área (ha)</strong><span>' + ha + '</span></div>' : '')
        + (p.gestor     ? '<div class="cp-row"><strong>Gestor</strong><span>' + esc(p.gestor) + '</span></div>' : '')
        + '<div class="cp-badge" style="background:' + corG + '11;border-color:' + corG + ';color:' + corG + '">' + lblG + '</div>'
        + '</div></div>';
      layer.bindPopup(popHtml, { className: 'camada-popup-wrap', maxWidth: 340 });
    }
  });
  _ucLayer.addTo(mapaL);
  var stat = document.getElementById('uc-stat');
  if (stat) stat.textContent = count + ' UC' + (count !== 1 ? 's' : '') + ' exibida' + (count !== 1 ? 's' : '');
  var badge = document.getElementById('uc-count-badge');
  if (badge) { badge.textContent = count; badge.style.display = count ? '' : 'none'; }
}

function toggleCamadaUC(ativo) {
  _ucAtivo = ativo;
  if (ativo && !_ucGeojson) { _carregarUC(); return; }
  _renderizarUC();
  _ucStatsAtualizar();
  document.getElementById('uc-stats-card').classList.toggle('visivel', ativo);
}
function filtrarUC() { _renderizarUC(); _ucStatsAtualizar(); }

// ── Card flutuante de estatísticas das UCs ────────────────────────────────
var _ucStatsCollapsed = false;
var AREA_ACRE_HA = 16421700; // área do estado do Acre em ha

function _ucStatsAtualizar() {
  if (!_ucGeojson || !_ucAtivo) return;

  // Respeita os filtros ativos na interface
  var esfFed = (document.getElementById('uc-esfera-federal')  || {checked:true}).checked;
  var esfEst = (document.getElementById('uc-esfera-estadual') || {checked:true}).checked;
  var esfMun = (document.getElementById('uc-esfera-municipal')|| {checked:true}).checked;
  var nomesAtivos = new Set(
    Array.from(document.querySelectorAll('[data-uc-nome]'))
      .filter(function(el){ return el.checked; })
      .map(function(el){ return el.dataset.ucNome; })
  );

  var feats = _ucGeojson.features.filter(function(f) {
    var esf = (f.properties.esfera || '').toLowerCase();
    if (esf === 'federal'   && !esfFed) return false;
    if (esf === 'estadual'  && !esfEst) return false;
    if (esf === 'municipal' && !esfMun) return false;
    if (nomesAtivos.size > 0 && !nomesAtivos.has(f.properties.nome)) return false;
    return true;
  });

  var totalUCs  = feats.length;
  var totalHa   = feats.reduce(function(s,f){ return s + (Number(f.properties.area_ha)||0); }, 0);
  var pctEstado = totalHa > 0 ? (totalHa / AREA_ACRE_HA * 100).toFixed(1) : '—';

  var fmtHa = function(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0}); };

  // Totais
  document.getElementById('usc-totais').innerHTML =
    '<div class="usc-total-bloco"><div class="usc-total-val">' + totalUCs + '</div><div class="usc-total-lbl">Unidades</div></div>' +
    '<div class="usc-total-bloco"><div class="usc-total-val">' + fmtHa(totalHa) + '</div><div class="usc-total-lbl">Hectares</div></div>' +
    '<div class="usc-pct-badge">≈ ' + pctEstado + '%<br><span style="font-size:8px;font-weight:500;color:#1d4ed8">do estado</span></div>';

  // Por tipo (agrupa por sigla)
  var porTipo = {};
  feats.forEach(function(f) {
    var p   = f.properties;
    var sig = p.sigla || p.categoria || '?';
    if (!porTipo[sig]) porTipo[sig] = { sigla: sig, cat: p.categoria || sig, qtd: 0, ha: 0, cor: p.cor || '#2D6A4F' };
    porTipo[sig].qtd++;
    porTipo[sig].ha += Number(p.area_ha) || 0;
  });
  var tipoList = Object.values(porTipo).sort(function(a,b){ return b.ha - a.ha; });
  var maxHa    = tipoList.length ? tipoList[0].ha : 1;
  document.getElementById('usc-tipos').innerHTML = tipoList.map(function(t) {
    var pct = maxHa > 0 ? Math.max(3, Math.round(t.ha / maxHa * 100)) : 3;
    var haStr = t.ha > 0 ? fmtHa(t.ha) + ' ha' : '— ha';
    return '<div class="usc-tipo-row">' +
      '<span class="usc-tipo-sigla" title="' + t.cat + '">' + t.sigla + '</span>' +
      '<div class="usc-tipo-bar-wrap"><div class="usc-tipo-bar" style="width:' + pct + '%;background:' + t.cor + '"></div></div>' +
      '<span class="usc-tipo-info">' + t.qtd + ' · ' + haStr + '</span>' +
      '</div>';
  }).join('');

  // Por gestão
  var cores = { federal: '#2563eb', estadual: '#059669', municipal: '#d97706' };
  var porGestao = {};
  feats.forEach(function(f) {
    var esf = (f.properties.esfera || 'outro').toLowerCase();
    if (!porGestao[esf]) porGestao[esf] = { qtd: 0, ha: 0 };
    porGestao[esf].qtd++;
    porGestao[esf].ha += Number(f.properties.area_ha) || 0;
  });
  var ordem = ['federal','estadual','municipal'];
  document.getElementById('usc-gestao').innerHTML = ordem.filter(function(k){ return porGestao[k]; }).map(function(k) {
    var g   = porGestao[k];
    var pct = totalHa > 0 ? (g.ha / totalHa * 100).toFixed(0) : 0;
    return '<div class="usc-gestao-row">' +
      '<div class="usc-gestao-dot" style="background:' + cores[k] + '"></div>' +
      '<span class="usc-gestao-nome">' + k.charAt(0).toUpperCase() + k.slice(1) + '</span>' +
      '<span class="usc-gestao-qtd">' + g.qtd + '</span>' +
      '<span class="usc-gestao-ha">' + fmtHa(g.ha) + ' ha</span>' +
      '<span class="usc-gestao-pct">' + pct + '%</span>' +
      '</div>';
  }).join('');
}

function ucStatsToggleCollapse() {
  _ucStatsCollapsed = !_ucStatsCollapsed;
  document.getElementById('usc-body').style.display = _ucStatsCollapsed ? 'none' : '';
  document.getElementById('usc-collapse-btn').textContent = _ucStatsCollapsed ? '▸' : '▾';
}
function setOpacidadeUC(v) {
  _ucOpacity = v / 100;
  document.getElementById('uc-opacity-val').textContent = v + '%';
  if (_ucLayer) _ucLayer.setStyle({ fillOpacity: _ucOpacity });
}
function ucSelecionarTodos(estado) {
  document.querySelectorAll('[data-uc-nome]').forEach(function(el){ el.checked = estado; });
  filtrarUC();
}
function ucToggleGrupo(g) {
  var el = document.getElementById('uc-grupo-' + g);
  var ch = document.getElementById('uc-chevron-' + g);
  var aberto = el.style.display !== 'none';
  el.style.display = aberto ? 'none' : '';
  if (ch) ch.textContent = aberto ? '▸' : '▾';
}
function ucToggleLabels(ativo) {
  _ucLabels = ativo;
  _renderizarUC();
}

// ═══════════════════════════════════════════════════════════════════════════
// TERRAS INDÍGENAS — GeoJSON estático /data/ti_acre.geojson
// Fonte: FUNAI · Campos: terrai_nome, etnia_nome, fase_ti,
//        superficie_perimetro_ha, modalidade_ti
// ═══════════════════════════════════════════════════════════════════════════

const TI_FASES_COR = {
  'regularizada':      '#15803d',
  'homologada':        '#16a34a',
  'encaminhada ri':    '#0891b2',
  'delimitada':        '#f59e0b',
  'em estudo':         '#9ca3af',
};
function _tiCorFase(fase){
  if(!fase) return '#d97706';
  const low = fase.toLowerCase();
  for(const [k,v] of Object.entries(TI_FASES_COR)) if(low.includes(k)) return v;
  return '#d97706';
}

async function _carregarTI(){
  document.getElementById('ti-loading').style.display = 'flex';
  try {
    const r = await fetch('../data/ti_acre.geojson');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    _tiGeojson = await r.json();
  } catch(e) {
    document.getElementById('ti-loading').style.display = 'none';
    document.getElementById('ti-controles').style.display = 'flex';
    document.getElementById('ti-stat').textContent = '⚠ Erro ao carregar TI: ' + e.message;
    return;
  }
  document.getElementById('ti-loading').style.display = 'none';
  document.getElementById('ti-controles').style.display = 'flex';
  _tiConstruirFiltrosFases();
  _renderizarTI();
}

function _tiConstruirFiltrosFases(){
  const cont = {};
  (_tiGeojson.features || []).forEach(f => {
    const fase = f.properties.fase_ti || 'Sem informação';
    cont[fase] = (cont[fase]||0) + 1;
  });
  const el = document.getElementById('ti-fases');
  if(!el) return;
  el.innerHTML = Object.entries(cont).sort().map(([fase, n]) => {
    const cor = _tiCorFase(fase);
    return `<label class="uc-filtro-label">
      <input type="checkbox" checked data-ti-fase="${esc(fase)}" style="accent-color:${cor};width:12px;height:12px;cursor:pointer" onchange="filtrarTI()">
      <div class="uc-tipo-dot" style="background:${cor}33;border-color:${cor}"></div>
      <span style="flex:1">${esc(fase)}</span>
      <span style="font-size:9px;color:var(--cinza-400)">${n}</span>
    </label>`;
  }).join('');
}

function _renderizarTI(){
  if(_tiLayer){ mapaL.removeLayer(_tiLayer); _tiLayer = null; }
  if(!_tiGeojson || !_tiAtivo) return;

  const fasesAtivas = new Set(
    [...document.querySelectorAll('[data-ti-fase]')]
      .filter(el => el.checked).map(el => el.dataset.tiFase)
  );
  let count = 0;
  _tiLayer = L.geoJSON(_tiGeojson, {
    style: f => {
      const cor = _tiCorFase(f.properties.fase_ti);
      return { color: cor, weight: 1.8, opacity: 0.9, fillColor: cor, fillOpacity: _tiOpacity };
    },
    filter: f => {
      const fase = f.properties.fase_ti || 'Sem informação';
      if(fasesAtivas.size && !fasesAtivas.has(fase)) return false;
      count++;
      return true;
    },
    onEachFeature: (f, layer) => {
      const p   = f.properties;
      const cor = _tiCorFase(p.fase_ti);
      const ha  = p.superficie_perimetro_ha;
      // Label permanente no centróide
      const nome = p.terrai_nome || '';
      if(nome){
        let centroid;
        try {
          const c = turf.centroid(f);
          centroid = [c.geometry.coordinates[1], c.geometry.coordinates[0]];
        } catch(e) {
          const pts = f.geometry.type === 'MultiPolygon'
            ? f.geometry.coordinates[0][0]
            : f.geometry.coordinates[0];
          const sumLon = pts.reduce((s,p)=>s+p[0],0);
          const sumLat = pts.reduce((s,p)=>s+p[1],0);
          centroid = [sumLat/pts.length, sumLon/pts.length];
        }
        const tt = L.tooltip({ permanent:true, direction:'center', className:'ti-label-tt', interactive:false });
        tt.setContent(nome);
        tt.setLatLng(centroid);
        tt.addTo(mapaL);
        layer._tiLabel = tt;
        layer.on('remove', ()=>{ try{ mapaL.removeLayer(tt); }catch(x){} });
      }
      layer.bindPopup(`
        <div class="camada-popup">
          <div class="cp-header" style="background:#92400e">🪶 Terra Indígena</div>
          <div class="cp-layer">
            <div class="cp-layer-nome" style="color:#92400e">${esc(p.terrai_nome||'')}</div>
            ${p.fase_ti      ? `<div class="cp-row"><strong>Fase</strong><span>${esc(p.fase_ti)}</span></div>` : ''}
            ${p.etnia_nome   ? `<div class="cp-row"><strong>Etnia(s)</strong><span>${esc(p.etnia_nome)}</span></div>` : ''}
            ${p.modalidade_ti? `<div class="cp-row"><strong>Modalidade</strong><span>${esc(p.modalidade_ti)}</span></div>` : ''}
            ${ha             ? `<div class="cp-row"><strong>Área (ha)</strong><span>${Number(ha).toLocaleString('pt-BR',{maximumFractionDigits:0})}</span></div>` : ''}
            <div class="cp-badge" style="background:${cor}22;border-color:${cor};color:${cor}">${esc(p.fase_ti||'—')}</div>
          </div>
        </div>`, { className:'camada-popup-wrap', maxWidth:300 }
      );
    }
  });
  _tiLayer.addTo(mapaL);
  const stat = document.getElementById('ti-stat');
  if(stat) stat.textContent = `${count} terra${count!==1?'s':''} indígena${count!==1?'s':''}`;
  const badge = document.getElementById('ti-count-badge');
  if(badge){ badge.textContent = count; badge.style.display = count ? '' : 'none'; }
}

function toggleCamadaTI(ativo){
  _tiAtivo = ativo;
  if(ativo && !_tiGeojson){ _carregarTI(); return; }
  _renderizarTI();
}
function filtrarTI(){ _renderizarTI(); }
function setOpacidadeTI(v){
  _tiOpacity = v / 100;
  document.getElementById('ti-opacity-val').textContent = v + '%';
  if(_tiLayer) _tiLayer.setStyle({ fillOpacity: _tiOpacity });
}

// ═══════════════════════════════════════════════════════════════════════════
// LIMITE DO ESTADO DO ACRE — IBGE malhas API
// Sempre visível sobre qualquer basemap (pane acima das tiles)
// ═══════════════════════════════════════════════════════════════════════════
var _acreLayer = null;

async function _carregarLimiteAcre() {
  if (_acreLayer) return; // já carregado
  try {
    var r = await fetch('https://servicodados.ibge.gov.br/api/v3/malhas/estados/12?formato=application/vnd.geo%2Bjson');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var geojson = await r.json();

    // Pane dedicado com z-index alto (acima das tiles, abaixo dos markers)
    if (mapaL && !mapaL.getPane('acreBorderPane')) {
      mapaL.createPane('acreBorderPane');
      mapaL.getPane('acreBorderPane').style.zIndex = 420;
      mapaL.getPane('acreBorderPane').style.pointerEvents = 'none';
    }

    _acreLayer = L.geoJSON(geojson, {
      pane: 'acreBorderPane',
      style: {
        color:       '#FACC15',   // amarelo ouro — visível em satelite, mapa claro e escuro
        weight:      3.5,
        opacity:     1,
        fillOpacity: 0,
        dashArray:   null,
        lineJoin:    'round',
        lineCap:     'round',
      }
    });

    // Camada dupla: sombra escura embaixo + linha amarela em cima
    // Isso garante contraste em qualquer cor de fundo
    var _acreSombra = L.geoJSON(geojson, {
      pane: 'acreBorderPane',
      style: {
        color:       '#1a1a1a',
        weight:      6,
        opacity:     0.55,
        fillOpacity: 0,
      }
    });

    _acreSombra.addTo(mapaL);
    _acreLayer.addTo(mapaL);

  } catch(e) {
    console.warn('Limite do Acre não carregado:', e);
  }
}

// Carregar assim que o mapa estiver pronto
document.addEventListener('DOMContentLoaded', function() {
  var waitMapa = setInterval(function() {
    if (typeof mapaL !== 'undefined' && mapaL) {
      clearInterval(waitMapa);
      _carregarLimiteAcre();
      _injetarTabMunicipios();
    }
  }, 300);
});

// ═══════════════════════════════════════════════════════════════════════════
// MUNICÍPIOS DO ACRE — IBGE malhas (resolução 5 = nível municipal)
// ═══════════════════════════════════════════════════════════════════════════
var _munLayer   = null;
var _munOpacity = 0.5;
var _munAtivo   = false;
var _munCor     = '#94a3b8';

async function _carregarMunicipios() {
  document.getElementById('mun-loading').style.display = 'flex';
  try {
    var r = await fetch('../data/municipios_acre.geojson');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var geojson = await r.json();
    if (!mapaL.getPane('munPane')) {
      mapaL.createPane('munPane');
      mapaL.getPane('munPane').style.zIndex = 415;
      mapaL.getPane('munPane').style.pointerEvents = 'none';
    }
    _munLayer = L.geoJSON(geojson, {
      pane: 'munPane',
      style: { color: _munCor, weight: 1.5, opacity: _munOpacity, fillOpacity: 0, dashArray: '4 3' },
      onEachFeature: function(f, layer) {
        var nome = (f.properties && f.properties.nome) || '';
        if (!nome) return;
        // Label permanente no centróide (usando turf se disponível, senão média simples)
        var centroid;
        try {
          var c = turf.centroid(f);
          centroid = [c.geometry.coordinates[1], c.geometry.coordinates[0]];
        } catch(e) {
          var pts = f.geometry.type === 'Polygon'
            ? f.geometry.coordinates[0]
            : f.geometry.coordinates[0][0];
          var sumLat = 0, sumLon = 0;
          pts.forEach(function(p){ sumLon += p[0]; sumLat += p[1]; });
          centroid = [sumLat / pts.length, sumLon / pts.length];
        }
        var tt = L.tooltip({ permanent: true, direction: 'center', className: 'mun-label-tt', interactive: false });
        tt.setContent(nome);
        tt.setLatLng(centroid);
        tt.addTo(mapaL);
        layer._munLabel = tt;
        layer.on('remove', function(){ try{ mapaL.removeLayer(tt); }catch(x){} });
      }
    });
    document.getElementById('mun-loading').style.display = 'none';
    document.getElementById('mun-controles').style.display = 'flex';
    var n = geojson.features ? geojson.features.length : 0;
    var stat = document.getElementById('mun-stat');
    if (stat) stat.textContent = n + ' município' + (n !== 1 ? 's' : '');
    if (_munAtivo) _munLayer.addTo(mapaL);
  } catch(e) {
    document.getElementById('mun-loading').style.display = 'none';
    var stat = document.getElementById('mun-stat');
    if (stat) stat.textContent = '⚠ Erro: ' + e.message;
  }
}

function toggleCamadaMun(ativo) {
  _munAtivo = ativo;
  if (!ativo) {
    // Remover layer (o evento 'remove' em cada sublayer remove os labels)
    if (_munLayer) { mapaL.removeLayer(_munLayer); _munLayer = null; }
    return;
  }
  // Carregar ou recriar (labels são criados em onEachFeature, precisam do mapaL ativo)
  _carregarMunicipios();
}
function setOpacidadeMun(v) {
  _munOpacity = v / 100;
  var el = document.getElementById('mun-opacity-val');
  if (el) el.textContent = v + '%';
  if (_munLayer) _munLayer.setStyle({ opacity: _munOpacity });
}
function setCorMun(cor) {
  _munCor = cor;
  if (_munLayer) _munLayer.setStyle({ color: cor });
}

function _injetarTabMunicipios() {
  if (document.getElementById('mlb-btn-mun')) return;

  // Tab button
  var tabs = document.querySelector('.mlb-tabs');
  if (!tabs) return;
  var btn = document.createElement('button');
  btn.className = 'mlb-tab';
  btn.id = 'mlb-btn-mun';
  btn.onclick = function() { _toggleMunPanel(); };
  btn.textContent = '🗺 Municípios';
  tabs.appendChild(btn);

  // Painel
  var layerbar = document.getElementById('mapa-layerbar');
  if (!layerbar) return;
  var panel = document.createElement('div');
  panel.className = 'mlb-dropdown';
  panel.id = 'mlb-panel-mun';
  panel.style.cssText = 'display:none;min-width:300px';
  panel.innerHTML = ''
    + '<div class="mlb-dropdown-header">'
    +   '<span class="mlb-dropdown-title">🗺 Divisão Municipal — Acre</span>'
    +   '<button class="mlb-close" onclick="_fecharMunPanel()">✕</button>'
    + '</div>'
    + '<div class="mlb-dropdown-body" style="gap:10px">'
    +   '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--cinza-700)">'
    +     '<input type="checkbox" id="mun-toggle" style="accent-color:var(--verde-escuro);width:13px;height:13px;cursor:pointer" onchange="toggleCamadaMun(this.checked)">'
    +     '<strong>Exibir divisão municipal</strong>'
    +   '</label>'
    +   '<div id="mun-loading" style="display:none;align-items:center;gap:8px;font-size:11px;color:var(--cinza-500)">'
    +     '<div style="width:12px;height:12px;border:2px solid #e5e7eb;border-top-color:#2D6A4F;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0"></div>'
    +     'Carregando…'
    +   '</div>'
    +   '<div id="mun-controles" style="display:none;flex-direction:column;gap:8px">'
    +     '<div style="display:flex;align-items:center;gap:8px">'
    +       '<span style="font-size:10px;font-weight:700;color:var(--cinza-500);text-transform:uppercase;width:52px;flex-shrink:0">Opac.</span>'
    +       '<input type="range" min="10" max="100" value="50" class="camada-slider" id="mun-opacity" oninput="setOpacidadeMun(this.value)">'
    +       '<span id="mun-opacity-val" style="font-size:9px;font-weight:700;color:var(--cinza-700);width:26px;text-align:right">50%</span>'
    +     '</div>'
    +     '<div style="display:flex;align-items:center;gap:8px">'
    +       '<span style="font-size:10px;font-weight:700;color:var(--cinza-500);text-transform:uppercase;width:52px;flex-shrink:0">Cor</span>'
    +       '<input type="color" id="mun-cor" value="#94a3b8" style="width:36px;height:24px;border:1px solid var(--borda);border-radius:4px;cursor:pointer;padding:1px" oninput="setCorMun(this.value)">'
    +       '<span style="font-size:10px;color:var(--cinza-500)">linha dos limites</span>'
    +     '</div>'
    +   '</div>'
    +   '<div id="mun-stat" style="font-size:10px;color:var(--cinza-400)"></div>'
    + '</div>';
  layerbar.appendChild(panel);

  // Fechar ao clicar fora
  document.addEventListener('click', function(e) {
    var lb = document.getElementById('mapa-layerbar');
    if (lb && !lb.contains(e.target)) _fecharMunPanel();
  }, true);
}

function _toggleMunPanel() {
  var panel = document.getElementById('mlb-panel-mun');
  var btn   = document.getElementById('mlb-btn-mun');
  if (!panel) return;
  var abrindo = panel.style.display === 'none';
  ['veg','car','uc','ti'].forEach(function(k) {
    var p = document.getElementById('mlb-panel-' + k);
    var b = document.getElementById('mlb-btn-' + k);
    if (p) p.style.display = 'none';
    if (b) b.classList.remove('ativo');
  });
  if (abrindo) { panel.style.display = ''; btn.classList.add('ativo'); }
  else _fecharMunPanel();
}
function _fecharMunPanel() {
  var p = document.getElementById('mlb-panel-mun');
  var b = document.getElementById('mlb-btn-mun');
  if (p) p.style.display = 'none';
  if (b) b.classList.remove('ativo');
}
</script>
