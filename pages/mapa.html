function _videoEmbedUrl(url){
  if(!url) return null;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const vi = url.match(/vimeo\.com\/(\d+)/);
  if(vi) return `https://player.vimeo.com/video/${vi[1]}`;
  return null;
}

function _pararCarTimer(){
  if(_geoCarTimer){ clearInterval(_geoCarTimer); _geoCarTimer = null; }
}
function _iniciarCarTimer(){
  _pararCarTimer();
  if(_geoCarAtual.fotos.length <= 1) return;
  _geoCarTimer = setInterval(() => _geoCarNav(1, true), 2000);
}

function _htmlCarrosselPopup(fotos){
  if(!fotos || !fotos.length) return '';
  const multi = fotos.length > 1;
  return `<div style="position:relative;margin-bottom:8px;border-radius:6px;overflow:hidden;background:#000;height:130px"
    onmouseenter="_pararCarTimer()" onmouseleave="_iniciarCarTimer()">
    <img id="geo-car-img" src="${escHtml(fotos[0])}"
         style="width:100%;height:130px;object-fit:cover;display:block;cursor:zoom-in;transition:opacity .3s"
         onclick="abrirFotoModal(document.getElementById('geo-car-img').src)" title="Ver em tela cheia">
    ${multi ? `
    <button onclick="_geoCarNav(-1)" style="position:absolute;left:4px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:15px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center">‹</button>
    <button onclick="_geoCarNav(1)"  style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:15px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center">›</button>
    <div id="geo-car-counter" style="position:absolute;bottom:5px;right:7px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px">1/${fotos.length}</div>
    ` : ''}
  </div>`;
}

function _geoCarNav(dir, auto = false){
  const n = _geoCarAtual.fotos.length;
  if(!n) return;
  _geoCarAtual.idx = (_geoCarAtual.idx + dir + n) % n;
  const url     = _geoCarAtual.fotos[_geoCarAtual.idx];
  const img     = document.getElementById('geo-car-img');
  const counter = document.getElementById('geo-car-counter');
  if(img)     img.src = url;
  if(counter) counter.textContent = `${_geoCarAtual.idx + 1}/${n}`;
  // Navegação manual reinicia o timer; automática não (evita sobreposição)
  if(!auto) _iniciarCarTimer();
}

function _popupGeometria(nome, pts, tipo){
  const p0 = pts[0];
  const cor = corIcone(p0);
  const dt = p0.data_implantacao ? new Date(p0.data_implantacao+'T12:00').toLocaleDateString('pt-BR') : '—';
  const latlngs = pts.map(p => [p.lat, p.lng]);
  const medida = tipo === 'poligono'
    ? `<div class="pp-linha"><strong>Área:</strong>${_formatarArea(_calcularArea(latlngs))}</div>`
    : `<div class="pp-linha"><strong>Distância:</strong>${_formatarDistancia(_calcularDistancia(latlngs))}</div>`;

  // Vídeo e pontos de interesse (trilha)
  let btnVideo = '', badgesPE = '';
  if(tipo === 'trilha'){
    const meta = trilhaMetadata[nome];
    if(meta?.video_url){
      btnVideo = `<button onclick="abrirVideoModal('${escHtml(meta.video_url)}')"
        style="width:100%;margin:6px 0 4px;padding:7px 12px;background:#1e3a5f;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">
        ▶ Assistir vídeo da trilha
      </button>`;
    }
    const especiais = pts.filter(p => p.ponto_especial && PONTOS_ESPECIAIS[p.ponto_especial]);
    if(especiais.length){
      badgesPE = `<div style="margin-top:8px;border-top:1px solid #e5e7eb;padding-top:7px">
        <div style="font-size:9px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Pontos de interesse</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">`;
      especiais.forEach(p => {
        const pe = PONTOS_ESPECIAIS[p.ponto_especial];
        badgesPE += `<span class="pe-badge" style="background:${pe.cor}22;border:1px solid ${pe.cor}55;color:${pe.cor}">${pe.emoji} ${pe.label}</span>`;
      });
      badgesPE += `</div></div>`;
    }
  }

  const fotos = geometriaFotos[tipo + ':' + nome] || [];
  _geoCarAtual = { fotos, idx: 0 };
  setTimeout(_iniciarCarTimer, 80);

  return `<div class="mapa-popup">
    ${_htmlCarrosselPopup(fotos)}
    <h4>${escHtml(nome)}</h4>
    ${p0.tipo_atividade?`<div style="margin-bottom:5px"><span style="background:${cor}22;color:${cor};font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid ${cor}55">${escHtml(p0.tipo_atividade)}</span></div>`:''}
    ${btnVideo}
    <div class="pp-linha"><strong>APA:</strong>${escHtml(p0.apa)}</div>
    ${p0.responsavel?`<div class="pp-linha"><strong>Responsável:</strong>${escHtml(p0.responsavel)}</div>`:''}
    <div class="pp-linha"><strong>Implantação:</strong>${dt}</div>
    ${medida}
    <div class="pp-linha"><strong>${tipo==='poligono'?'Vértices':'Pontos'}:</strong>${pts.length}</div>
    ${p0.observacao?`<div class="pp-linha"><strong>Obs.:</strong>${escHtml(p0.observacao)}</div>`:''}
    ${_htmlOdsKm(p0.tipo_atividade)}
    ${badgesPE}
    ${_ehEditor() ? `<div style="margin-top:8px;display:flex;gap:6px">
      <button onclick="abrirModalEditarGeometria('${escHtml(nome)}','${tipo}')" style="font-size:11px;padding:3px 10px;border:1px solid #ccc;border-radius:6px;cursor:pointer;background:#fff">✏ Editar</button>
      <button onclick="excluirGeometria('${escHtml(nome)}','${tipo}')" style="font-size:11px;padding:3px 10px;border:1px solid #fca5a5;border-radius:6px;cursor:pointer;background:#fff;color:#dc2626">🗑</button>
    </div>` : ''}
  </div>`;
}

function renderizarLista(){
  const el=document.getElementById('lista-pontos'), ct=document.getElementById('lista-count');
  if(!el) return;
  const vis = pontos.filter(pontoVisivel);

  // Deduplicar: pontos individuais + um item por geometry_group
  const itens = [];
  const gruposVistos = new Set();
  vis.forEach(p => {
    const tipo = p.geometry_type || 'ponto';
    if(tipo === 'ponto'){
      itens.push({ tipo, p, id: p.id });
    } else {
      const key = tipo + ':' + p.geometry_group;
      if(!gruposVistos.has(key)){ gruposVistos.add(key); itens.push({ tipo, p, group: p.geometry_group }); }
    }
  });

  if(ct) ct.textContent = itens.length;
  if(!itens.length){ el.innerHTML=`<div style="padding:14px;text-align:center;font-size:12px;color:var(--cinza-400)">Nenhum ponto visível.</div>`; return; }

  el.innerHTML = itens.map(item => {
    const { p, tipo } = item;
    const cor = corIcone(p);
    const dt = p.data_implantacao ? new Date(p.data_implantacao+'T12:00').toLocaleDateString('pt-BR') : '';
    const tipoLabel = tipo === 'poligono' ? 'Polígono' : tipo === 'trilha' ? 'Trilha' : null;
    const onclick = tipo === 'ponto'
      ? `focarPonto('${p.id}')`
      : `focarGeometria('${escHtml(item.group)}','${tipo}')`;
    return `<div class="ponto-item" onclick="${onclick}">
      <span class="ponto-dot" style="background:${cor}"></span>
      <div style="flex:1;min-width:0">
        <div class="ponto-nome">${escHtml(p.nome_local)}</div>
        <div class="ponto-sub">${tipoLabel?tipoLabel+' · ':''}${escHtml(p.tipo_atividade||p.apa)}${dt?' · '+dt:''}</div>
      </div>
    </div>`;
  }).join('');
}

function focarGeometria(group, tipo){
  const pts = pontos.filter(p => p.geometry_group === group && p.geometry_type === tipo);
  if(!pts.length) return;
  const bounds = L.latLngBounds(pts.map(p => [p.lat, p.lng]));
  mapaL.fitBounds(bounds, {padding:[40,40], maxZoom:17});
}

function focarPonto(id){
  const p=pontos.find(x=>x.id===id); if(!p) return;
  mapaL.setView([p.lat,p.lng],17);
  const layer=pontosLayer.find(m=>m.pontoId===id);
  if(layer) clusters.zoomToShowLayer(layer,()=>layer.openPopup());
}

function _renderTiposHtml(){
  const ehAdmin = appState.perfil === 'super_admin';
  if(matrizVisiveis.length === 0)
    return `<div style="font-size:11px;color:var(--cinza-400);padding:4px 0">${ehAdmin?'Nenhum tipo configurado. Clique em ⚙ para configurar.':'Nenhum tipo configurado.'}</div>`;
  const todosMarcados = [...Object.keys(tipoCores)].every(t => filtrosTipo.has(t));
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:4px">
    <button onclick="toggleTodosTipos()" id="btn-todos-tipos" style="font-size:10px;color:var(--cinza-500);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px">${todosMarcados?'Desmarcar todos':'Marcar todos'}</button>
  </div>`
  + matrizVisiveis.map(item => {
      const tipo = item.produto_titulo||'';
      const cor = item.cor || '#9ca3af';
      const emoji = item.emoji || '';
      const marcado = filtrosTipo.has(tipo);
      const meta = item.meta_numerica?`meta ${item.meta_numerica} ${item.unidade||''}`.trim():'';
      const sub = [item.produto_codigo, tipo, meta].filter(Boolean).join(' · ');
      const dot = emoji
        ? `<span style="width:18px;height:18px;border-radius:50%;background:${cor};display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px">${emoji}</span>`
        : `<span class="filtro-dot" style="background:${cor}"></span>`;
      return `<div class="filtro-item">
        <input type="checkbox" ${marcado?'checked':''} data-tipo="${escHtml(tipo)}" onchange="toggleFiltroTipo(this)">
        ${dot}
        <span style="flex:1;line-height:1.3">${escHtml(item.indicador||tipo)}<span style="display:block;font-size:9px;color:var(--cinza-400)">${escHtml(sub)}</span></span>
        ${ehAdmin?`<button onclick="event.stopPropagation();abrirModalEditarTipo('${item.id}')" title="Editar ícone e cor" style="font-size:11px;padding:1px 5px;border:1px solid var(--borda);border-radius:4px;background:#fff;cursor:pointer;flex-shrink:0;color:var(--cinza-500);margin-top:1px">✏</button>`:''}
      </div>`;
    }).join('');
}

function toggleTodosTipos(){
  const tipos = Object.keys(tipoCores);
  const todosMarcados = tipos.every(t => filtrosTipo.has(t));
  if(todosMarcados){ tipos.forEach(t => filtrosTipo.delete(t)); }
  else { tipos.forEach(t => filtrosTipo.add(t)); }
  const bloco = document.getElementById('bloco-tipos');
  if(bloco) bloco.innerHTML = _renderTiposHtml();
  renderizarMarcadores(); renderizarLista();
}

function toggleFiltroAPA(el){
  const apa = el.dataset.apa;
  if(el.checked) filtrosAPA.add(apa); else filtrosAPA.delete(apa);
  renderizarMarcadores(); renderizarLista();
}

function toggleFiltroTipo(el){
  const tipo = el.dataset.tipo;
  if(el.checked) filtrosTipo.add(tipo); else filtrosTipo.delete(tipo);
  renderizarMarcadores(); renderizarLista();
}

// ── Lightbox de foto ──────────────────────────────────────────────────────
function _syncFotoModalNav(){
  const n     = _geoCarAtual.fotos.length;
  const multi = n > 1;
  const prev    = document.getElementById('modal-foto-prev');
  const next    = document.getElementById('modal-foto-next');
  const counter = document.getElementById('modal-foto-counter');
  if(prev)    prev.style.display    = multi ? 'flex' : 'none';
  if(next)    next.style.display    = multi ? 'flex' : 'none';
  if(counter){ counter.style.display = multi ? 'block' : 'none';
               counter.textContent   = `${_geoCarAtual.idx + 1} / ${n}`; }
}

function abrirFotoModal(url){
  const idx = _geoCarAtual.fotos.indexOf(url);
  if(idx >= 0) _geoCarAtual.idx = idx;
  document.getElementById('modal-foto-img').src = url;
  _syncFotoModalNav();
  _pararCarTimer();
  document.getElementById('modal-foto').classList.add('aberto');
}

function fecharFotoModal(){
  document.getElementById('modal-foto').classList.remove('aberto');
  document.getElementById('modal-foto-img').src = '';
  if(document.getElementById('geo-car-img')) _iniciarCarTimer();
}

function _fotoModalNav(dir){
  const n = _geoCarAtual.fotos.length;
  if(!n) return;
  _geoCarAtual.idx = (_geoCarAtual.idx + dir + n) % n;
  const url = _geoCarAtual.fotos[_geoCarAtual.idx];
  document.getElementById('modal-foto-img').src = url;
  // sincroniza o mini-carrossel do popup se estiver visível
  const carImg     = document.getElementById('geo-car-img');
  const carCounter = document.getElementById('geo-car-counter');
  if(carImg)     carImg.src = url;
  if(carCounter) carCounter.textContent = `${_geoCarAtual.idx + 1}/${n}`;
  _syncFotoModalNav();
}

// Teclado: ← → Esc no lightbox
document.addEventListener('keydown', e => {
  if(!document.getElementById('modal-foto')?.classList.contains('aberto')) return;
  if(e.key === 'ArrowLeft')  { e.preventDefault(); _fotoModalNav(-1); }
  if(e.key === 'ArrowRight') { e.preventDefault(); _fotoModalNav(1);  }
  if(e.key === 'Escape')     { fecharFotoModal(); }
});

// ── Modal: Vídeo em tela cheia ────────────────────────────────────────────
function abrirVideoModal(url){
  const embed = _videoEmbedUrl(url);
  const iframe = document.getElementById('modal-video-iframe');
  const link   = document.getElementById('modal-video-link');
  if(embed){
    iframe.src = embed + (embed.includes('?') ? '&' : '?') + 'autoplay=1';
    iframe.style.display = 'block';
  } else {
    iframe.src = '';
    iframe.style.display = 'none';
  }
  link.href = url;
  link.style.display = 'block';
  document.getElementById('modal-video').classList.add('aberto');
}

function fecharVideoModal(){
  document.getElementById('modal-video-iframe').src = '';
  document.getElementById('modal-video').classList.remove('aberto');
}

// Fechar ao clicar no fundo escuro
document.addEventListener('click', e => {
  const mv = document.getElementById('modal-video');
  if(mv && e.target === mv) fecharVideoModal();
});

// ── Modal: Detalhes do ponto especial (foto + vídeo) ─────────────────────
let _peEditandoIdx = null;
let _peFotoArquivo = null;

function abrirModalPeDetalhes(idx){
  _peEditandoIdx = idx;
  _peFotoArquivo = null;
  const p = _geoEditando.pts[idx];
  const pe = PONTOS_ESPECIAIS[p.ponto_especial] || {};

  document.getElementById('modal-pe-titulo').textContent =
    (pe.emoji ? pe.emoji + ' ' : '') + (pe.label || 'Detalhes do ponto');
  document.getElementById('pe-foto-url').value   = p.foto_url   || '';
  document.getElementById('pe-video-url').value  = p.video_url  || '';
  document.getElementById('pe-observacao').value = p.observacao || '';
  document.getElementById('pe-foto-status').textContent = '';
  atualizarPreviaPe();
  document.getElementById('modal-pe-detalhes').style.display = 'flex';
}

function fecharModalPeDetalhes(){
  document.getElementById('modal-pe-detalhes').style.display = 'none';
  _peEditandoIdx = null; _peFotoArquivo = null;
}

function atualizarPreviaPe(){
  const url = document.getElementById('pe-foto-url').value.trim();
  const wrap = document.getElementById('pe-foto-preview-wrap');
  const img  = document.getElementById('pe-foto-preview-img');
  if(url){ img.src = url; wrap.style.display = 'block'; }
  else    { wrap.style.display = 'none'; }
}

function uploadFotoPe(input){
  const file = input.files[0];
  if(!file) return;
  _peFotoArquivo = file;
  const url = URL.createObjectURL(file);
  document.getElementById('pe-foto-url').value = '';
  const wrap = document.getElementById('pe-foto-preview-wrap');
  const img  = document.getElementById('pe-foto-preview-img');
  img.src = url; wrap.style.display = 'block';
  document.getElementById('pe-foto-status').textContent = `📎 ${file.name} — será enviado ao salvar`;
}

async function salvarPeDetalhes(){
  if(_peEditandoIdx === null) return;
  const btn = document.querySelector('#modal-pe-detalhes .btn-primary');
  btn.disabled = true; btn.textContent = 'Salvando…';

  let foto_url = document.getElementById('pe-foto-url').value.trim() || null;

  if(_peFotoArquivo){
    const ext  = _peFotoArquivo.name.split('.').pop();
    const path = `pontos/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await db.storage.from('pontos-mapa').upload(path, _peFotoArquivo, { upsert: true });
    if(upErr){ alert('Erro no upload da foto: ' + upErr.message); btn.disabled=false; btn.textContent='OK'; return; }
    const { data: urlData } = db.storage.from('pontos-mapa').getPublicUrl(path);
    foto_url = urlData.publicUrl;
  }

  const pt = _geoEditando.pts[_peEditandoIdx];
  pt.foto_url   = foto_url;
  pt.video_url  = document.getElementById('pe-video-url').value.trim()  || null;
  pt.observacao = document.getElementById('pe-observacao').value.trim()  || null;

  btn.disabled = false; btn.textContent = 'OK';
  fecharModalPeDetalhes();
  abaGeometria('vertices'); // re-render para refletir que o ponto tem foto/vídeo
}

// ── Modal: Editar ícone e cor do tipo de entrega ──────────────────────────
let _tipoEditando = null;
let _tipoEmojiSel = null;

function abrirModalEditarTipo(id){
  const item = matrizItens.find(i => i.id === id);
  if(!item) return;
  _tipoEditando = id;
  const corAtual = item.cor || '#16a34a';
  _tipoEmojiSel = item.emoji || null;

  const nome = item.indicador || item.produto_titulo || '';
  document.getElementById('modal-tipo-titulo').textContent = 'Editar: ' + nome;
  document.getElementById('tipo-preview-nome').textContent = nome;
  document.getElementById('tipo-cor-picker').value = corAtual;
  document.getElementById('tipo-cor-texto').value = corAtual;
  document.getElementById('tipo-emoji-atual').value = _tipoEmojiSel || '';

  // Grade de emojis
  document.getElementById('emoji-grid-container').innerHTML = EMOJIS_EDITAVEIS.map(e =>
    `<button class="emoji-btn${_tipoEmojiSel===e?' sel':''}" onclick="selecionarEmoji('${e}')">${e}</button>`
  ).join('');

  atualizarPreviewTipo();
  document.getElementById('modal-editar-tipo').style.display = 'flex';
}

function fecharModalEditarTipo(){
  document.getElementById('modal-editar-tipo').style.display = 'none';
  _tipoEditando = null; _tipoEmojiSel = null;
}

function selecionarEmoji(e){
  _tipoEmojiSel = e;
  document.getElementById('tipo-emoji-atual').value = e;
  document.querySelectorAll('#emoji-grid-container .emoji-btn').forEach(b =>
    b.classList.toggle('sel', b.textContent.trim() === e)
  );

}

function sincronizarCorTipo(val){
  if(/^#[0-9a-fA-F]{6}$/.test(val)){
    document.getElementById('tipo-cor-picker').value = val;
    atualizarPreviewTipo();

}

function atualizarPreviewTipo(){
  const cor = document.getElementById('tipo-cor-picker').value;

  const prev = document.getElementById('tipo-preview-icone');
  prev.style.background = cor;

async function salvarIconeTipo(){
  if(!_tipoEditando) return;

// ── Modal Admin: configurar tipos visíveis ────────────────────────────────
function abrirModalAdminFiltros(){
  document.getElementById('modal-admin-filtros').style.display='flex';
  renderAdminFiltrosList();
}
function fecharModalAdminFiltros(){ document.getElementById('modal-admin-filtros').style.display='none'; }

function renderAdminFiltrosList(){
  const el = document.getElementById('admin-filtros-lista');
  if(!el) return;
  if(!matrizItens.length){ el.innerHTML='<div style="padding:20px;text-align:center;font-size:12px;color:var(--cinza-400)">Nenhum item na matriz.</div>'; return; }

  // Agrupar por resultado
  const porResultado = {};
  matrizItens.forEach(i => {
    const key = 'Resultado '+i.resultado;
    if(!porResultado[key]) porResultado[key] = [];
    porResultado[key].push(i);
  });

  let html = '';
  Object.entries(porResultado).forEach(([res, itens]) => {
    html += `<div class="admin-resultado-label">${escHtml(res)}</div>`;
    itens.forEach(i => {
      const meta = i.meta_numerica ? `meta ${i.meta_numerica} ${i.unidade||''}`.trim() : '';
      html += `<div class="admin-item">
        <input type="checkbox" id="adm-${i.id}" data-id="${i.id}" ${i.visivel_no_mapa?'checked':''}>
        <div style="flex:1;min-width:0">
          <div class="admin-item-nome">${escHtml(i.indicador||i.produto_titulo||'Sem título')}</div>
          <div class="admin-item-sub">${escHtml([i.produto_codigo, i.produto_titulo].filter(Boolean).join(' · '))}${meta?' · '+meta:''}</div>
        </div>
      </div>`;
    });
  });
  el.innerHTML = html;
}

async function salvarAdminFiltros(){
  const checkboxes = document.querySelectorAll('#admin-filtros-lista input[type=checkbox][data-id]');
  const btn = document.getElementById('btn-salvar-admin-filtros');
  btn.disabled = true; btn.textContent = 'Salvando…';

  // Atualizar em batch: separar marcados e desmarcados
  const marcados = [], desmarcados = [];
  checkboxes.forEach(cb => {
    if(cb.checked) marcados.push(cb.dataset.id); else desmarcados.push(cb.dataset.id);
  });

  let erro = null;
  if(marcados.length){
    const r = await db.from('matriz_itens').update({visivel_no_mapa:true}).in('id', marcados);
    if(r.error) erro = r.error;
  }
  if(!erro && desmarcados.length){
    const r = await db.from('matriz_itens').update({visivel_no_mapa:false}).in('id', desmarcados);
    if(r.error) erro = r.error;
  }

  btn.disabled = false; btn.textContent = 'Salvar configuração';
  if(erro){ alert('Erro ao salvar: '+erro.message); return; }

  // Recarregar dados locais e remontar filtros
  const matrizData = await db.from('matriz_itens')
    .select('id,resultado,produto_codigo,produto_titulo,indicador,meta_numerica,unidade,visivel_no_mapa,ods,metas_km,cor,emoji')
    .eq('ativo', true).order('produto_codigo');
  matrizItens = matrizData.data || [];
  matrizVisiveis = matrizItens.filter(i => i.visivel_no_mapa);
  matrizByTipo = _buildMatrizByTipo(matrizItens);
  _recalcularTipoCoresIcones();

  fecharModalAdminFiltros();

  // Re-renderizar o bloco de tipos sem recarregar a página
  const bloco = document.getElementById('bloco-tipos');
  if(bloco) bloco.innerHTML = _renderTiposHtml();

  renderizarMarcadores(); renderizarLista();
}

      <label>Data de implantação</label>
      <input id="f-data" type="date" value="${p.data_implantacao||''}">

function abrirModalNovo(){ editandoId=null; document.getElementById('modal-ponto-titulo').textContent='Adicionar ponto'; document.getElementById('modal-ponto-body').innerHTML=htmlFormPonto(); document.getElementById('modal-ponto').style.display='flex'; }
function abrirModalEditar(id){ const p=pontos.find(x=>x.id===id); if(!p) return; editandoId=id; document.getElementById('modal-ponto-titulo').textContent='Editar ponto'; document.getElementById('modal-ponto-body').innerHTML=htmlFormPonto(p); document.getElementById('modal-ponto').style.display='flex'; }
function fecharModalPonto(){ document.getElementById('modal-ponto').style.display='none'; editandoId=null; fotoArquivo=null; }
function onChangeTipo(sel){ const livre=document.getElementById('g-tipo-livre'); if(livre) livre.style.display=sel.value==='__outro'?'':'none'; }
function usarGeolocalizacao(){ if(!navigator.geolocation){alert('Não suportado.');return;} navigator.geolocation.getCurrentPosition(pos=>{document.getElementById('f-lat').value=pos.coords.latitude.toFixed(6);document.getElementById('f-lng').value=pos.coords.longitude.toFixed(6);},()=>alert('Sem permissão.')); }

let fotoArquivo=null;
function previewFoto(input){ const f=input.files[0];if(!f)return;fotoArquivo=f;const img=document.getElementById('foto-preview');img.src=URL.createObjectURL(f);img.style.display='block'; }
function onFotoDrop(e){ e.preventDefault();document.getElementById('foto-area').classList.remove('drag');const f=e.dataTransfer.files[0];if(!f||!f.type.startsWith('image/'))return;fotoArquivo=f;const img=document.getElementById('foto-preview');img.src=URL.createObjectURL(f);img.style.display='block'; }

async function salvarPonto(){
  const nome = document.getElementById('f-nome').value.trim();
  const apa  = document.getElementById('f-apa').value;
  const lat  = parseFloat(document.getElementById('f-lat').value);
  const lng  = parseFloat(document.getElementById('f-lng').value);
  const tipoSel = document.getElementById('f-tipo').value;
  const tipo = tipoSel==='__outro' ? (document.getElementById('f-tipo-livre')?.value.trim()||null) : (tipoSel||null);
  if(!nome||!apa||isNaN(lat)||isNaN(lng)){ alert('Preencha Nome, APA, Latitude e Longitude.'); return; }

  const pontoAntes = editandoId ? (pontos.find(p=>p.id===editandoId)||null) : null;
  const acao = editandoId ? 'editar' : 'criar';
  const desc = acao==='editar'
    ? `✏️ <strong>Editar ponto</strong><br><span style="color:var(--cinza-600)">${escHtml(nome)}</span>`
    : `➕ <strong>Criar ponto</strong><br><span style="color:var(--cinza-600)">${escHtml(nome)}</span>`;

  _confirmarComSenha(desc, async () => {
    const btn = document.getElementById('btn-salvar-ponto');
    if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
    let foto_url  = editandoId ? (pontos.find(p=>p.id===editandoId)?.foto_url ||null) : null;
    let foto_nome = editandoId ? (pontos.find(p=>p.id===editandoId)?.foto_nome||null) : null;
    if(fotoArquivo){
      const ext  = fotoArquivo.name.split('.').pop();
      const path = `pontos/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const {error:upErr} = await db.storage.from('pontos-mapa').upload(path, fotoArquivo, {upsert:true});
      if(upErr){ alert('Erro foto: '+upErr.message); if(btn){btn.disabled=false;btn.textContent='Salvar';} return; }
      const {data:urlData} = db.storage.from('pontos-mapa').getPublicUrl(path);
      foto_url = urlData.publicUrl; foto_nome = fotoArquivo.name;
    }
    const payload = {
      nome_local: nome, apa, tipo_atividade: tipo,
      responsavel:      document.getElementById('f-resp').value.trim()||null,
      data_implantacao: document.getElementById('f-data').value||null,
      lat, lng, foto_url, foto_nome,
      observacao: document.getElementById('f-obs').value.trim()||null,
      status: 'ativo'
    };
    let err, novoId = editandoId;
    if(editandoId){
      ({error:err} = await db.from('produto_pontos_mapa').update(payload).eq('id', editandoId));
    } else {
      payload.criado_por = appState.usuario?.id||null;
      const {data:ins, error:insErr} = await db.from('produto_pontos_mapa').insert(payload).select('id').single();
      err = insErr; if(ins) novoId = ins.id;
    }
    if(btn){ btn.disabled=false; btn.textContent='Salvar'; }
    if(err){ alert('Erro: '+err.message); return; }
    await _gravarLog(acao, pontoAntes, { ...payload, id: novoId, geometry_type: 'ponto' });
    fecharModalPonto();
    await carregarPontos();
  });
}

async function excluirPonto(id){
  const ponto = pontos.find(p=>p.id===id) || { id };
  const desc = `🗑️ <strong>Excluir ponto</strong><br><span style="color:var(--cinza-600)">${escHtml(ponto.nome_local||id)}</span>`;
  _confirmarComSenha(desc, async () => {
    const {error} = await db.from('produto_pontos_mapa').delete().eq('id', id);
    if(error){ alert('Erro: '+error.message); return; }
    await _gravarLog('excluir', { ...ponto, geometry_type: 'ponto' }, null);
    await carregarPontos();
  });
}

let _geoEditando = null;
let _geoFotos = []; // [{url, file}] — fotos existentes ou novas aguardando upload

async function abrirModalEditarGeometria(group, tipo){
  const pts = pontos
    .filter(p => p.geometry_group === group && p.geometry_type === tipo)
    .sort((a,b) => (a.geometry_order||0)-(b.geometry_order||0));
  if(!pts.length) return;
  _geoEditando = { group, tipo, pts: pts.map(p=>({...p})), abaAtiva:'dados' };
  _geoFotos = [];
  const { data: fotosData } = await db.from('geometria_fotos')
    .select('foto_url, ordem')
    .eq('geometry_group', group)
    .eq('geometry_type', tipo)
    .order('ordem');
  if(fotosData) _geoFotos = fotosData.map(f => ({ url: f.foto_url, file: null }));
  document.getElementById('modal-geo-titulo').textContent = tipo === 'poligono' ? 'Editar polígono' : 'Editar trilha / caminho';
  abaGeometria('dados');
  document.getElementById('modal-geometria').style.display = 'flex';
}

function fecharModalGeometria(){
  document.getElementById('modal-geometria').style.display = 'none';
  _geoEditando = null;
  _geoFotos = [];
}

    ? `<p style="font-size:12px;color:var(--cinza-400);text-align:center;margin:24px 0 8px">Nenhuma foto adicionada ainda.</p>` : '';
  return `
    <div style="font-size:12px;color:var(--cinza-500);margin-bottom:8px">${_geoFotos.length} / ${MAX} fotos • JPG, PNG, WEBP</div>
    ${vazio}
    <div class="geo-foto-grid">${items}${addBtn}</div>
    <p style="font-size:11px;color:var(--cinza-400);margin-top:10px">As fotos são salvas ao clicar em <strong>Salvar</strong>.</p>
  `;
}

function _geoAdicionarFotos(input){
  const MAX = 10;
  Array.from(input.files || []).forEach(f => {
    if(_geoFotos.length >= MAX) return;
    if(!f.type.startsWith('image/')) return;
    _geoFotos.push({ url: null, file: f });
  });
  input.value = '';
  abaGeometria('fotos');
}

function _geoRemoverFoto(idx){
  _geoFotos.splice(idx, 1);
  abaGeometria('fotos');
}

  <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:var(--cinza-100)">
        <th style="padding:5px 8px;text-align:center;border-bottom:1px solid var(--borda);width:28px">#</th>
        <th style="padding:5px 8px;text-align:left;border-bottom:1px solid var(--borda)">Latitude</th>
        <th style="padding:5px 8px;text-align:left;border-bottom:1px solid var(--borda)">Longitude</th>
        ${ehTrilha?`<th style="padding:5px 8px;text-align:left;border-bottom:1px solid var(--borda);min-width:140px">Ponto especial</th>`:''}
        <th style="padding:5px 8px;border-bottom:1px solid var(--borda);width:84px"></th>
      </tr></thead>
      <tbody>${pts.map((p,i) => `<tr>
        <td style="padding:4px 8px;text-align:center;color:var(--cinza-400);font-size:11px">${i+1}</td>
        <td style="padding:3px 4px"><input type="number" step="any" value="${p.lat}" data-idx="${i}" data-campo="lat" onchange="_onVertexChange(this)" style="width:100%;font-size:12px;padding:3px 6px;border:1px solid var(--borda);border-radius:4px;font-family:monospace"></td>
        <td style="padding:3px 4px"><input type="number" step="any" value="${p.lng}" data-idx="${i}" data-campo="lng" onchange="_onVertexChange(this)" style="width:100%;font-size:12px;padding:3px 6px;border:1px solid var(--borda);border-radius:4px;font-family:monospace"></td>
        ${ehTrilha?`<td style="padding:3px 4px">
          <div style="display:flex;gap:3px;align-items:center">
            <select class="pe-select" data-idx="${i}" onchange="_onPontoEspecialChange(this)" style="flex:1">
              <option value="">— regular —</option>
              ${peOptions.replace(`value="${p.ponto_especial||''}"`,`value="${p.ponto_especial||''}" selected`)}
            </select>
            ${p.ponto_especial ? `<button onclick="abrirModalPeDetalhes(${i})" title="Foto e vídeo deste ponto"

              ${p.foto_url||p.video_url ? '📷✓' : '📷'}
            </button>` : ''}
          </div>
        </td>`:''}
        <td style="padding:3px 4px;white-space:nowrap;text-align:center">
          ${i>0?`<button onclick="_moverVertex(${i},-1)" title="Subir" style="font-size:10px;padding:2px 5px;border:1px solid var(--borda);border-radius:3px;background:#fff;cursor:pointer">↑</button>`:'<span style="display:inline-block;width:24px"></span>'}
          ${i<pts.length-1?`<button onclick="_moverVertex(${i},1)" title="Descer" style="font-size:10px;padding:2px 5px;border:1px solid var(--borda);border-radius:3px;background:#fff;cursor:pointer">↓</button>`:'<span style="display:inline-block;width:24px"></span>'}
          ${pts.length>minPts?`<button onclick="_removerVertex(${i})" title="Remover" style="font-size:10px;padding:2px 5px;border:1px solid #fca5a5;border-radius:3px;background:#fff;color:#dc2626;cursor:pointer">✕</button>`:''}
        </td>
      </tr>`).join('')}</tbody>
    </table>
  </div>
  <button onclick="_adicionarVertex()" class="btn btn-outline" style="margin-top:8px;font-size:12px;width:100%">＋ Adicionar vértice</button>`;
}

function _onVertexChange(input){
  const idx = parseInt(input.dataset.idx);
  _geoEditando.pts[idx][input.dataset.campo] = parseFloat(input.value)||0;
  const latlngs = _geoEditando.pts.map(p=>[p.lat,p.lng]);
  const el = document.getElementById('geo-medida');
  if(el) el.innerHTML = _geoEditando.tipo === 'poligono'
    ? `Área: <strong>${_formatarArea(_calcularArea(latlngs))}</strong>`
    : `Distância: <strong>${_formatarDistancia(_calcularDistancia(latlngs))}</strong>`;
}

function _moverVertex(idx, dir){
  const pts = _geoEditando.pts;
  [pts[idx], pts[idx+dir]] = [pts[idx+dir], pts[idx]];
  abaGeometria('vertices');
}

function _removerVertex(idx){
  _geoEditando.pts.splice(idx,1);
  abaGeometria('vertices');
}

function _onPontoEspecialChange(sel){
  const idx = parseInt(sel.dataset.idx);
  _geoEditando.pts[idx].ponto_especial = sel.value || null;
}

function _adicionarVertex(){
  const pts = _geoEditando.pts;
  const ult = pts[pts.length-1];
  pts.push({...ult, lat:+(ult.lat+0.001).toFixed(6), lng:+(ult.lng+0.001).toFixed(6), id:null, ponto_especial:null});
  abaGeometria('vertices');
}

async function salvarGeometria(){
  if(!_geoEditando) return;
  const fNome = document.getElementById('fg-nome');
  let nome, apa, tipo_atividade, responsavel, data_implantacao, observacao;
  if(fNome){
    nome = fNome.value.trim();
    apa = document.getElementById('fg-apa').value;
    const ts = document.getElementById('fg-tipo').value;
    tipo_atividade = ts==='__outro' ? (document.getElementById('fg-tipo-livre')?.value.trim()||null) : (ts||null);
    responsavel = document.getElementById('fg-resp').value.trim()||null;
    data_implantacao = document.getElementById('fg-data').value||null;
    observacao = document.getElementById('fg-obs').value.trim()||null;
  } else {
    const p0 = _geoEditando.pts[0];
    ({nome_local:nome, apa, tipo_atividade, responsavel, data_implantacao, observacao} = p0);
  }
  if(!nome){ alert('Nome é obrigatório.'); return; }

  const { group, tipo:geoTipo } = _geoEditando;
  const tipLabel = geoTipo==='poligono' ? 'polígono' : 'trilha/caminho';
  const dadosAntes = {
    geometry_type: geoTipo, geometry_group: group,
    nome_local:       _geoEditando.pts[0]?.nome_local      || group,
    apa:              _geoEditando.pts[0]?.apa              || null,
    tipo_atividade:   _geoEditando.pts[0]?.tipo_atividade   || null,
    responsavel:      _geoEditando.pts[0]?.responsavel      || null,
    data_implantacao: _geoEditando.pts[0]?.data_implantacao || null,
    observacao:       _geoEditando.pts[0]?.observacao       || null,
    vertices: _geoEditando.pts.map(p=>({lat:p.lat, lng:p.lng}))
  };
  const desc = `✏️ <strong>Editar ${tipLabel}</strong><br><span style="color:var(--cinza-600)">${escHtml(nome)}</span>`;

  _confirmarComSenha(desc, async () => {
    const btn = document.getElementById('btn-salvar-geo');
    if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
    const {error:delErr} = await db.from('produto_pontos_mapa')
      .delete().eq('geometry_group', group).eq('geometry_type', geoTipo);
    if(delErr){ alert('Erro: '+delErr.message); if(btn){btn.disabled=false;btn.textContent='Salvar';} return; }
    const inserts = _geoEditando.pts.map((p,i) => ({
      nome_local: nome, apa, tipo_atividade, responsavel, data_implantacao,
      // Pontos especiais têm observacao, foto e vídeo próprios; demais usam o campo do formulário
      observacao: (geoTipo === 'trilha' && p.ponto_especial) ? (p.observacao ?? observacao) : observacao,
      lat: p.lat, lng: p.lng, geometry_type: geoTipo, geometry_group: nome,
      geometry_order: i, status: 'ativo', criado_por: appState.usuario?.id||null,
      ponto_especial: geoTipo === 'trilha' ? (p.ponto_especial || null) : null,
      foto_url:  p.foto_url  || null,
      video_url: p.video_url || null,
    }));
    const {error:insErr} = await db.from('produto_pontos_mapa').insert(inserts);
    if(btn){ btn.disabled=false; btn.textContent='Salvar'; }
    if(insErr){ alert('Erro: '+insErr.message); return; }

    // Salvar vídeo da trilha
    if(geoTipo === 'trilha'){
      const videoEl = document.getElementById('fg-video');
      // Se o elemento não está no DOM (usuário salvou pela aba de vértices),
      // preserva o valor já gravado em vez de sobrescrever com null
      const videoUrl = videoEl
        ? (videoEl.value.trim() || null)
        : (trilhaMetadata[group]?.video_url || null);
      await db.from('trilha_metadata').upsert(
        { geometry_group: nome, video_url: videoUrl, updated_at: new Date().toISOString() },
        { onConflict: 'geometry_group' }
      );
      trilhaMetadata[nome] = { geometry_group: nome, video_url: videoUrl };
      // Se a trilha foi renomeada, remove o registro antigo para não deixar órfão
      if(nome !== group){
        await db.from('trilha_metadata').delete().eq('geometry_group', group);
        delete trilhaMetadata[group];
      }
    }
    // Salvar fotos do polígono/trilha
    await db.from('geometria_fotos').delete()
      .eq('geometry_group', group).eq('geometry_type', geoTipo);
    if(nome !== group){
      await db.from('geometria_fotos').delete()
        .eq('geometry_group', nome).eq('geometry_type', geoTipo);
    }
    const fotoInserts = [];
    for(let fi = 0; fi < _geoFotos.length; fi++){
      const f = _geoFotos[fi];
      let fotoUrl = f.url;
      if(f.file){
        const ext = f.file.name.split('.').pop();
        const nomeSlug = nome.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9_-]/g,'_');
        const path = `geometria/${nomeSlug}/${Date.now()}_${fi}.${ext}`;
        const { error: upErr } = await db.storage.from('pontos-mapa').upload(path, f.file, { upsert: true });
        if(upErr){ alert('Erro no upload da foto: ' + upErr.message); continue; }
        const { data: urlData } = db.storage.from('pontos-mapa').getPublicUrl(path);
        fotoUrl = urlData.publicUrl;
      }
      if(fotoUrl) fotoInserts.push({ geometry_group: nome, geometry_type: geoTipo, foto_url: fotoUrl, ordem: fi });
    }
    if(fotoInserts.length > 0) await db.from('geometria_fotos').insert(fotoInserts);

    const dadosDepois = {
      geometry_type: geoTipo, geometry_group: nome,
      nome_local: nome, apa, tipo_atividade, responsavel, data_implantacao, observacao,
      vertices: _geoEditando.pts.map(p=>({lat:p.lat, lng:p.lng}))
    };
    await _gravarLog('editar', dadosAntes, dadosDepois);
    fecharModalGeometria();
    await carregarPontos();
  });
}

async function excluirGeometria(group, tipo){
  const pts = pontos
    .filter(p=>p.geometry_group===group&&p.geometry_type===tipo)
    .sort((a,b)=>(a.geometry_order||0)-(b.geometry_order||0));
  const p0 = pts[0] || {};
  const tipLabel = tipo==='poligono' ? 'polígono' : 'trilha/caminho';
  const dadosAntes = {
    geometry_type: tipo, geometry_group: group,
    nome_local: p0.nome_local||group, apa: p0.apa||null,
    tipo_atividade: p0.tipo_atividade||null,
    responsavel: p0.responsavel||null, data_implantacao: p0.data_implantacao||null,
    observacao: p0.observacao||null,
    vertices: pts.map(p=>({lat:p.lat, lng:p.lng}))
  };
  const desc = `🗑️ <strong>Excluir ${tipLabel}</strong><br><span style="color:var(--cinza-600)">${escHtml(p0.nome_local||group)}</span>`;
  _confirmarComSenha(desc, async () => {
    await db.from('produto_pontos_mapa').delete().eq('geometry_group',group).eq('geometry_type',tipo);
    await _gravarLog('excluir', dadosAntes, null);
    fecharModalGeometria();
    await carregarPontos();
  });
}

function _impBaixarTemplate(){
  if(typeof XLSX==='undefined'){alert('Biblioteca Excel ainda carregando, tente em instantes.');return;}

  // Formata colunas lat/lng como Texto (@) para evitar que o Excel brasileiro
  // interprete o ponto decimal como separador de milhar (ex: -67.83 → -6783)
  function formatarTexto(ws, colLat, colLng, maxRow){
    for(let r = 1; r <= maxRow; r++){
      [colLat, colLng].forEach(c => {
        const ref = XLSX.utils.encode_cell({r, c});
        if(!ws[ref]){ ws[ref] = {t:'s', v:'', z:'@'}; }
        else {
          ws[ref].z = '@';
          if(ws[ref].t !== 's'){ ws[ref].t = 's'; ws[ref].v = String(ws[ref].v||''); delete ws[ref].w; }
        }
      });
    }
    if(ws['!ref']){
      const range = XLSX.utils.decode_range(ws['!ref']);
      range.e.r = Math.max(range.e.r, maxRow);
      ws['!ref'] = XLSX.utils.encode_range(range);
    }
  }

  const wb = XLSX.utils.book_new();

  // Aba Pontos — lat=col 5 (F), lng=col 6 (G)
  const wsPontos = XLSX.utils.aoa_to_sheet([
    ['nome_local','apa','tipo_atividade','responsavel','data_implantacao','lat','lng','observacao'],
    ['Ex: Unidade Produtiva 01','Igarapé São Francisco','Desenvolvimento de Produtos Sustentáveis','João Silva','2025-04-10','-9.972000','-67.805000','Próximo ao igarapé']
  ]);
  wsPontos['!cols']=[{wch:35},{wch:28},{wch:38},{wch:18},{wch:20},{wch:14},{wch:14},{wch:30}];
  formatarTexto(wsPontos, 5, 6, 100);
  XLSX.utils.book_append_sheet(wb, wsPontos, 'Pontos');

  // Aba Polígono — lat=col 6 (G), lng=col 7 (H)
  const wsPolig = XLSX.utils.aoa_to_sheet([
    ['nome_area','apa','tipo_atividade','responsavel','data_implantacao','ordem','lat','lng','observacao'],
    ['Ex: Área de Reflorestamento A','Lago do Amapá','Mitigação da Vulnerabilidade das APAs','Maria Silva','2025-04-10','1','-9.950000','-67.820000','Vértice 1'],
    ['Ex: Área de Reflorestamento A','Lago do Amapá','Mitigação da Vulnerabilidade das APAs','Maria Silva','2025-04-10','2','-9.952000','-67.818000','Vértice 2'],
    ['Ex: Área de Reflorestamento A','Lago do Amapá','Mitigação da Vulnerabilidade das APAs','Maria Silva','2025-04-10','3','-9.951000','-67.815000','Vértice 3']
  ]);
  wsPolig['!cols']=[{wch:35},{wch:28},{wch:38},{wch:18},{wch:20},{wch:8},{wch:14},{wch:14},{wch:30}];
  formatarTexto(wsPolig, 6, 7, 100);
  XLSX.utils.book_append_sheet(wb, wsPolig, 'Polígono');

  // Aba Trilha — lat=col 6 (G), lng=col 7 (H)
  const wsTrilha = XLSX.utils.aoa_to_sheet([
    ['nome_trilha','apa','tipo_atividade','responsavel','data_implantacao','ordem','lat','lng','observacao'],
    ['Ex: Trilha Ecológica Norte','Igarapé São Francisco','Monitoramento e Adaptação','Carlos Souza','2025-04-10','1','-9.960000','-67.810000','Início da trilha'],
    ['Ex: Trilha Ecológica Norte','Igarapé São Francisco','Monitoramento e Adaptação','Carlos Souza','2025-04-10','2','-9.962000','-67.812000','Ponto intermediário'],
    ['Ex: Trilha Ecológica Norte','Igarapé São Francisco','Monitoramento e Adaptação','Carlos Souza','2025-04-10','3','-9.965000','-67.814000','Final da trilha']
  ]);
  wsTrilha['!cols']=[{wch:35},{wch:28},{wch:38},{wch:18},{wch:20},{wch:8},{wch:14},{wch:14},{wch:30}];
  formatarTexto(wsTrilha, 6, 7, 100);
  XLSX.utils.book_append_sheet(wb, wsTrilha, 'Trilha');

  XLSX.writeFile(wb, 'template_geo_mapa.xlsx');
}

function _impLerArquivo(file){
  if(!file) return;
  if(!file.name.toLowerCase().endsWith('.xlsx')){ alert('Por favor selecione um arquivo .xlsx (Excel).'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, {type:'binary'});
    _impProcessarWorkbook(wb);
  };
  reader.readAsBinaryString(file);
}

function _impProcessarWorkbook(wb){
  const pontos=[], poligonos=[], trilhas=[], erros=[];
  // Suporta 3 formatos de coordenada:
  //   1) colunas separadas com ponto:        lat=-10.042  lng=-67.852
  //   2) colunas separadas com vírgula BR:   lat=-10,042  lng=-67,852
  //   3) par colado do Google Maps na célula lat: "-10.042, -67.852" (lng vazia)
  const extrairCoords = (latRaw, lngRaw) => {
    const latStr = String(latRaw||'').trim();
    const lngStr = String(lngRaw||'').trim();
    if(latStr.includes(',') && lngStr === ''){
      const partes = latStr.split(',');
      if(partes.length >= 2){
        const a = parseFloat(partes[0].trim()), b = parseFloat(partes[1].trim());
        if(!isNaN(a)&&!isNaN(b)&&Math.abs(a)<=90&&Math.abs(b)<=180) return {lat:a, lng:b};
      }
    }
    return {lat:parseFloat(latStr.replace(',','.')), lng:parseFloat(lngStr.replace(',','.'))};
  };
  wb.SheetNames.forEach(nome => {
    const ws = wb.Sheets[nome];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
    const nomeLower = nome.toLowerCase();
    const coordOk = (lat,lng) => !isNaN(lat)&&!isNaN(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180;
    if(nomeLower.includes('pont')){
      rows.forEach((r,i) => {
        const {lat,lng} = extrairCoords(r.lat||r.LAT, r.lng||r.LNG);
        if(!r.nome_local||!coordOk(lat,lng)){ erros.push(`${nome} linha ${i+2}: coordenadas inválidas (lat=${r.lat} lng=${r.lng})`); return; }
        pontos.push({nome_local:String(r.nome_local),apa:r.apa||'Outra',tipo_atividade:r.tipo_atividade||null,responsavel:r.responsavel||null,data_implantacao:r.data_implantacao||null,lat,lng,observacao:r.observacao||null,geometry_type:'ponto'});
      });
    } else if(nomeLower.includes('pol')){
      rows.forEach((r,i) => {
        const {lat,lng} = extrairCoords(r.lat||r.LAT, r.lng||r.LNG);
        if(!r.nome_area||!coordOk(lat,lng)){ erros.push(`${nome} linha ${i+2}: coordenadas inválidas`); return; }
        poligonos.push({nome_local:String(r.nome_area),apa:r.apa||'Outra',tipo_atividade:r.tipo_atividade||null,responsavel:r.responsavel||null,data_implantacao:r.data_implantacao||null,lat,lng,observacao:r.observacao||null,geometry_type:'poligono',geometry_group:String(r.nome_area),geometry_order:parseInt(r.ordem)||0});
      });
    } else if(nomeLower.includes('trilh')){
      rows.forEach((r,i) => {
        const {lat,lng} = extrairCoords(r.lat||r.LAT, r.lng||r.LNG);
        if(!r.nome_trilha||!coordOk(lat,lng)){ erros.push(`${nome} linha ${i+2}: coordenadas inválidas`); return; }
        trilhas.push({nome_local:String(r.nome_trilha),apa:r.apa||'Outra',tipo_atividade:r.tipo_atividade||null,responsavel:r.responsavel||null,data_implantacao:r.data_implantacao||null,lat,lng,observacao:r.observacao||null,geometry_type:'trilha',geometry_group:String(r.nome_trilha),geometry_order:parseInt(r.ordem)||0});
      });
    }
  });
  _impLinhas = {pontos, poligonos, trilhas};
  _impEtapa2(erros);
}

// ── Scrollbar customizada do painel de filtros ────────────────────────────
function initScrollbarCustom(){
  const painel = document.getElementById('mapa-painel');
  const outer  = document.getElementById('mapa-scrollbar-outer');
  const thumb  = document.getElementById('mapa-scrollbar-thumb');
  if(!painel || !outer || !thumb) return;

  function update(){
    const totalH  = painel.scrollHeight;
    const outerH  = outer.clientHeight;
    if(totalH <= painel.clientHeight){ thumb.style.display = 'none'; return; }
    thumb.style.display = 'block';
    const thumbH    = Math.max(24, painel.clientHeight / totalH * outerH);
    const scrollPct = painel.scrollTop / (totalH - painel.clientHeight);
    thumb.style.height = thumbH + 'px';
    thumb.style.top    = (scrollPct * (outerH - thumbH)) + 'px';
  }

  painel.addEventListener('scroll', update);

  // Clique no track → scroll proporcional
  outer.addEventListener('click', e => {
    if(e.target === thumb) return;
    const rect = outer.getBoundingClientRect();
    const pct  = (e.clientY - rect.top) / outer.clientHeight;
    painel.scrollTo({ top: pct * painel.scrollHeight, behavior: 'smooth' });
  });

  // Drag no thumb
  let dragStart = null;
  thumb.addEventListener('mousedown', e => {
    e.preventDefault();
    dragStart = { y: e.clientY, scrollTop: painel.scrollTop };
  });
  document.addEventListener('mousemove', e => {
    if(!dragStart) return;
    const dy       = e.clientY - dragStart.y;
    const ratio    = painel.scrollHeight / outer.clientHeight;
    painel.scrollTop = dragStart.scrollTop + dy * ratio;
  });
  document.addEventListener('mouseup', () => { dragStart = null; });

  new ResizeObserver(update).observe(painel);
  new MutationObserver(update).observe(painel, { subtree: true, attributes: true, attributeFilter: ['style'] });
  setTimeout(update, 300);
}

// ── Click popup: camadas de delimitação ───────────────────────────────────
let _skipCamadaClick = false;

/**
 * Para Polygon: retorna a área do feature inteiro.
 * Para MultiPolygon: encontra o sub-polígono que contém o ponto clicado
 * e retorna só a área daquele componente (evita somar todos os fragmentos).
 * Retorna { clicada, total } — 'total' é sempre a soma de todos os componentes
 * e é usado para: (a) ordenação e (b) cálculo do badge de %.
 */
function _areaFeature(pt, feature){
  const gt = (feature.geometry && feature.geometry.type) || '';
  let total = 0, clicada = 0;
  try{ total = turf.area(feature); }catch(e){}
  if(gt === 'Polygon'){
    clicada = total;
  } else if(gt === 'MultiPolygon'){
    for(const ring of (feature.geometry.coordinates || [])){
      try{
        const sub = turf.polygon(ring);
        if(turf.booleanPointInPolygon(pt, sub)){
          clicada = turf.area(sub);
          break;
        }
      }catch(e){}
    }
    if(!clicada) clicada = total; // fallback se nenhum componente bateu
  }
  return { clicada, total };
}

function _buildCamadaHit(camada, feature, arr, pt){
  const props = feature.properties || {};
  const isHidro = 'LENGTH' in props || 'REGIME' in props;
  const isAPA   = 'DECRETO' in props || 'ANO_CRIACA' in props || 'AREA_UC' in props;
  const isAPP   = 'name_4' in props;
  let bodyHtml = '', area = 0;

  if(isHidro){
    area = Infinity;
    const nome   = props.NOME_1||props.Nome_1||props.NOME||props.nome||'';
    const regime = props.REGIME||'';
    const len    = props.LENGTH != null ? parseFloat(props.LENGTH) : null;
    const lenStr = len != null ? (len >= 1000 ? (len/1000).toFixed(2)+' km' : Math.round(len)+' m') : '';
    if(nome)   bodyHtml += `<div class="cp-row"><strong>Nome:</strong><span>${escHtml(nome)}</span></div>`;
    if(regime) bodyHtml += `<div class="cp-row"><strong>Regime:</strong><span>${escHtml(regime)}</span></div>`;
    if(lenStr) bodyHtml += `<div class="cp-row"><strong>Comprimento:</strong><span>${escHtml(lenStr)}</span></div>`;
  } else if(isAPA){
    const av = _areaFeature(pt, feature);
    area = av.clicada;
    [['Nome', props.NOME_UC||props.NOME||props.nome||''],
     ['Decreto', props.DECRETO||''],
     ['Criação', props.ANO_CRIACA||''],
     ['Área', props.AREA_UC ? Number(props.AREA_UC).toLocaleString('pt-BR',{maximumFractionDigits:2})+' ha' : ''],
     ['Municípios', props.MUNICIPIO_||''],
     ['Gestão', 'SEMA'],
     ['Pl. Manejo', props.PLANO_MANE||''],
    ].forEach(([label, val]) => {
      if(val) bodyHtml += `<div class="cp-row"><strong>${escHtml(label)}:</strong><span>${escHtml(String(val))}</span></div>`;
    });
  } else if(isAPP){
    const av = _areaFeature(pt, feature);
    area = av.clicada; // apenas o fragmento clicado
    const nome = props.name_4 || '';
    if(nome) bodyHtml += `<div class="cp-row"><strong>Sub-bacia:</strong><span>${escHtml(nome)}</span></div>`;
    if(area) bodyHtml += `<div class="cp-row"><strong>Área (fragmento):</strong><span>${(area/10000).toFixed(2)} ha</span></div>`;
    // badge %: usa área TOTAL do feature (todos os fragmentos APP da sub-bacia) / área da sub-bacia
    if(arr && nome && av.total > 0){
      const sb = arr.find(x => x.visivel && x.geojson && x.geojson.features &&
        x.geojson.features.some(f => { const p=f.properties||{}; return p.name||p.Name||p.NAME; }));
      if(sb){
        const rf = sb.geojson.features.find(f => {
          const p = f.properties||{};
          return (p.name||p.Name||p.NAME||'') === nome;
        });
        if(rf){ let ra=0; try{ra=turf.area(rf);}catch(e){}
          if(ra>0) bodyHtml += `<div class="cp-badge">🌿 APP total: ${Math.min(100,(av.total/ra)*100).toFixed(1)}% da sub-bacia</div>`; }
      }
    }
  } else {
    const av = _areaFeature(pt, feature);
    area = av.clicada;
    const nome = props.name||props.Name||props.NAME||'';
    if(nome) bodyHtml += `<div class="cp-row"><strong>Nome:</strong><span>${escHtml(nome)}</span></div>`;
    if(area) bodyHtml += `<div class="cp-row"><strong>Área:</strong><span>${(area/10000).toFixed(2)} ha</span></div>`;
    ['CLASSE','Classe','tipo','Tipo'].forEach(k=>{
      if(props[k] && props[k]!==nome) bodyHtml += `<div class="cp-row"><strong>${escHtml(k)}:</strong><span>${escHtml(String(props[k]))}</span></div>`;
    });
  }
  if(!bodyHtml){
    let cnt=0;
    for(const [k,v] of Object.entries(props)){
      if(v!=null && v!=='' && cnt<4){ bodyHtml+=`<div class="cp-row"><strong>${escHtml(k)}:</strong><span>${escHtml(String(v))}</span></div>`; cnt++; }
    }
  }
  return { area, bodyHtml, camadaNome: camada.nome, propKey: JSON.stringify(props) };
}

function _buildCamadaPopupHtml(hits){
  let html = `<div class="camada-popup">`;
  if(hits.length > 1) html += `<div class="cp-header">📍 ${hits.length} camadas neste ponto</div>`;
  hits.forEach((h, i) => {
    if(i > 0) html += `<div class="cp-divider"></div>`;
    html += `<div class="cp-layer"><div class="cp-layer-nome">${escHtml(h.camadaNome)}</div>${h.bodyHtml}</div>`;
  });
  return html + `</div>`;
}

function _iniciarClickCamadas(getCamadas){
  mapaL.on('popupopen', ev => {
    if(ev.popup._source){ _skipCamadaClick=true; setTimeout(()=>{ _skipCamadaClick=false; },80); }
  });

  mapaL.on('click', e => {
    if(_skipCamadaClick) return;
    const pt = turf.point([e.latlng.lng, e.latlng.lat]);

    // ── 1. CAR tem prioridade: verifica primeiro ───────────────────────────
    // Se CAR não está ativo mas painel está aberto, fecha
    if(!_carCarregado || !_carLayer){
      const panel = document.getElementById('car-det-panel');
      if(panel?.classList.contains('aberto')) fecharDetalhesCAR();
    }
    if(_carCarregado && _carLayer){
      let carHit = null;
      _carLayer.eachLayer(l => {
        if(carHit || !l.feature?.geometry) return;
        try{
          // pré-filtro rápido por bounding box antes do turf completo
          const b = l.getBounds ? l.getBounds() : null;
          if(b && !b.contains(e.latlng)) return;
          if(turf.booleanPointInPolygon(pt, l.feature))
            carHit = { f: l.feature, layer: l };
        }catch(_){}
      });
      if(carHit){
        _selecionarCAR(carHit.f, carHit.layer);
        return; // não abre popup de delimitação
      } else {
        // Clicou fora de qualquer CAR — fecha o painel se estiver aberto
        fecharDetalhesCAR();
      }
    }

    // ── 2. Camadas de delimitação ──────────────────────────────────────────
    const lineTol = 40 * Math.pow(2, Math.max(0, 12 - mapaL.getZoom()));
    const hits = [], seen = new Set();
    getCamadas().filter(c => c.visivel && c.geojson).forEach(camada => {
      (camada.geojson.features||[]).forEach(feature => {
        if(!feature.geometry) return;
        const gt = feature.geometry.type;
        let hit = false;
        try{
          if(gt==='Polygon'||gt==='MultiPolygon') hit = turf.booleanPointInPolygon(pt, feature);
          else if(gt==='LineString'||gt==='MultiLineString') hit = turf.pointToLineDistance(pt, feature, {units:'meters'}) <= lineTol;
        }catch(er){}
        if(hit){
          const h = _buildCamadaHit(camada, feature, getCamadas(), pt);
          if(!seen.has(h.propKey)){ seen.add(h.propKey); hits.push(h); }
        }
      });
    });
    if(!hits.length) return;
    hits.sort((a,b) => a.area - b.area);
    L.popup({ maxWidth:310, className:'camada-popup-wrap' })
      .setLatLng(e.latlng)
      .setContent(_buildCamadaPopupHtml(hits))
      .openOn(mapaL);
  });
}

// ── Resize do painel CAR ──────────────────────────────────────────────────
(function(){
  const CAR_WIDTH_KEY = 'dima_car_panel_width';
  const MIN_W = 280, MAX_W = 680;

  function _aplicarLargura(w){
    const panel = document.getElementById('car-det-panel');
    if(!panel) return;
    const clamped = Math.min(MAX_W, Math.max(MIN_W, w));
    panel.style.width = clamped + 'px';
    // mantém o "right: -largura" quando fechado
    if(!panel.classList.contains('aberto')){
      panel.style.transition = 'none';
      panel.style.right = `-${clamped + 10}px`;
      requestAnimationFrame(() => { panel.style.transition = ''; });
    }
  }

  // Restaura largura salva
  const saved = parseInt(localStorage.getItem(CAR_WIDTH_KEY));
  if(saved) _aplicarLargura(saved);

  document.addEventListener('DOMContentLoaded', () => {
    const handle = document.getElementById('car-resize-handle');
    const panel  = document.getElementById('car-det-panel');
    if(!handle || !panel) return;

    let startX = 0, startW = 0, dragging = false;

    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      dragging = true;
      startX = e.clientX;
      startW = panel.offsetWidth;
      handle.classList.add('dragging');
      document.body.style.cursor = 'ew-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', e => {
      if(!dragging) return;
      // painel está à direita: mover mouse para esquerda aumenta largura
      const delta = startX - e.clientX;
      const newW  = Math.min(MAX_W, Math.max(MIN_W, startW + delta));
      panel.style.transition = 'none';
      panel.style.width = newW + 'px';
    });

    document.addEventListener('mouseup', e => {
      if(!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      panel.style.transition = '';
      const finalW = panel.offsetWidth;
      localStorage.setItem(CAR_WIDTH_KEY, finalW);
    });

    // Touch support
    handle.addEventListener('touchstart', e => {
      const t = e.touches[0];
      startX = t.clientX; startW = panel.offsetWidth; dragging = true;
      handle.classList.add('dragging');
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if(!dragging) return;
      const t = e.touches[0];
      const delta = startX - t.clientX;
      const newW  = Math.min(MAX_W, Math.max(MIN_W, startW + delta));
      panel.style.transition = 'none';
      panel.style.width = newW + 'px';
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if(!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      panel.style.transition = '';
      localStorage.setItem(CAR_WIDTH_KEY, panel.offsetWidth);
    });
  });
})();

const CAR_BBOX     = '-68.3,-10.15,-67.4,-9.65,EPSG:4326';
const CAR_PAGE     = 1000;

let _carFeatures   = [];     // all loaded features (with computed _apa, _subbacia)
let _carVisiveis   = [];     // filtered subset
let _carLayer      = null;   // Leaflet GeoJSON layer
let _carRenderer   = null;   // Canvas renderer
let _carCarregado  = false;
let _carCarregando = false;
let _carSelecionado= null;   // selected Leaflet layer ref
let _carSubbaciaOpts = [];   // distinct sub-bacia names
let _carUCOpts       = [];   // distinct UC names (from _ucGeojson)

// ── Estado global CAR ─────────────────────────────────────────────────────

let _carMarcados    = new Map(); // cod_imovel → row da tabela car_marcados
let _carAbertoCod   = null;     // cod_imovel com painel aberto

let _carUltimoEstilo= null;     // último estilo salvo { fill_color, fill_opacity, stroke_color, stroke_width, cod_imovel }

// ── Mascara CPF/CNPJ: exibe 3 primeiros e 2 últimos dígitos ──────────────
function _mascaraCpfCnpj(v){
  if(!v) return '—';
  const d = String(v).replace(/\D/g,'');
  if(d.length < 6) return d;
  return d.slice(0,3) + '*'.repeat(d.length - 5) + d.slice(-2);
}

// ── Badge de classificação ambiental ─────────────────────────────────────
function _badgeClass(nome_class){
  if(!nome_class) return '<span style="font-size:10px;color:var(--cinza-400)">—</span>';
  const cfg = {
    'Verde':           { bg:'#f0fdf4', cor:'#16a34a', brd:'#86efac', ico:'🟢' },
    'Amarelo':         { bg:'#fffbeb', cor:'#d97706', brd:'#fde68a', ico:'🟡' },
    'Vermelho':        { bg:'#fef2f2', cor:'#dc2626', brd:'#fca5a5', ico:'🔴' },
    'Não Classificado':{ bg:'#f3f4f6', cor:'#6b7280', brd:'#d1d5db', ico:'⚪' },
  };
  const c = cfg[nome_class] || { bg:'#f3f4f6', cor:'#6b7280', brd:'#d1d5db', ico:'○' };

// ── Busca dados locais (Supabase) por cod_imovel ─────────────────────────
async function _buscarDadosLocais(cod){
  if(!cod) return null;
  if(_carDadosLocais.has(cod)) return _carDadosLocais.get(cod);
  const { data } = await db.from('car_dados_locais')
    .select('nom_imovel,nome_compl,cpf_cnpj,nome_class,tipo_docum,nome_docum,dat_criaca')
    .eq('cod_imovel', cod)
    .maybeSingle();
  _carDadosLocais.set(cod, data || null);
  return data || null;
}

// ── Status helpers ─────────────────────────────────────────────────────────
function _carStatusKey(condicao){
  const c = (condicao||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(c.includes('ativo'))      return 'ativo';
  if(c.includes('aguardando')) return 'aguardando';
  if(c.includes('em anal'))    return 'analise';
  if(c.includes('analise'))    return 'analise';
  return 'outro';
}
function _carCor(key){
  return { ativo:'#16a34a', aguardando:'#d97706', analise:'#2563eb', outro:'#9ca3af' }[key] || '#9ca3af';
}

function _estiloCAR(f, hover, sel){
  const cod     = f.properties?.cod_imovel;
  const marcado = _carMarcados.has(cod);
  const custom  = _carMarcados.get(cod);
  const corBase = _carCor(_carStatusKey(f.properties?.condicao));

  if(sel){
    return { color:'#7c3aed', weight:3, opacity:1,
             fillColor: custom?.fill_color || '#7c3aed', fillOpacity:0.35, dashArray:null };
  }
  const fillColor   = custom?.fill_color   || corBase;
  const fillOpacity = hover
    ? Math.min(0.8, (custom?.fill_opacity ?? 0.18) + 0.15)
    : (custom?.fill_opacity ?? (marcado ? 0.22 : 0.18));
  const strokeColor = marcado ? '#7c3aed' : (custom?.stroke_color || corBase);
  const strokeWidth = hover ? 2.5 : (custom?.stroke_width ?? (marcado ? 2.5 : 1.5));
  return { color:strokeColor, weight:strokeWidth, opacity:1,
           fillColor, fillOpacity, dashArray: marcado ? '6 4' : null };
}

// Cache: ucNome → features[] já carregadas
const _carCacheUC = new Map();
let _carUCAtual = null; // nome da UC atualmente carregada

// ── Toggle da camada ───────────────────────────────────────────────────────
async function toggleCamadaCAR(el){
  if(!el.checked){
    if(_carLayer) mapaL.removeLayer(_carLayer);

  }

  else _aplicarCamadaCAR(); // mostra vazio até o usuário escolher
}

// ── Carregamento WFS por UC ────────────────────────────────────────────────
async function carregarDadosCAR(ucNome){
  if(_carCarregando) return;

  // UC não específica: limpa e sai
  if(!ucNome || ucNome === 'todas' || ucNome === 'fora'){
    _carFeatures = [];
    _carVisiveis = [];
    if(_carLayer){ mapaL.removeLayer(_carLayer); _carLayer = null; }
    _atualizarBadgeCAR();
    return;
  }

  // Cache hit
  if(_carCacheUC.has(ucNome)){
    _carFeatures = _carCacheUC.get(ucNome);
    _carUCAtual  = ucNome;
    _carCarregado = true;
    _computarAtributosCAR();
    _popularFiltroSubbacia();
    _aplicarCamadaCAR();
    return;
  }

  _carCarregando = true;
  const load = document.getElementById('car-loading');
  if(load) load.style.display = 'flex';

  try{
    // Calcula bbox da UC selecionada
    const ucFeat = (_ucGeojson?.features||[]).find(f =>
      (f.properties?.nome || f.properties?.name || f.properties?.NOME) === ucNome
    );
    if(!ucFeat) throw new Error('UC não encontrada no GeoJSON: ' + ucNome);

    const [minX, minY, maxX, maxY] = turf.bbox(ucFeat);
    const bbox = `${minX},${minY},${maxX},${maxY},EPSG:4326`;

    // 1ª página — descobre total
    const url0 = `${CAR_WFS_BASE}?service=WFS&version=2.0.0&request=GetFeature`
               + `&typeNames=sicar:sicar_imoveis_ac&outputFormat=application/json`
               + `&BBOX=${bbox}&count=${CAR_PAGE}&startindex=0`;
    const res0 = await fetch(url0).then(r => r.json());
    const total = res0.numberMatched || res0.totalFeatures || (res0.features||[]).length;
    const features = [...(res0.features || [])];

    // Páginas restantes em paralelo
    if(total > CAR_PAGE){
      const npages = Math.ceil(total / CAR_PAGE);
      const promises = [];
      for(let i = 1; i < npages; i++){
        const u = `${CAR_WFS_BASE}?service=WFS&version=2.0.0&request=GetFeature`
                + `&typeNames=sicar:sicar_imoveis_ac&outputFormat=application/json`
                + `&BBOX=${bbox}&count=${CAR_PAGE}&startindex=${i * CAR_PAGE}`;
        promises.push(fetch(u).then(r => r.json()));
      }
      const pages = await Promise.all(promises);
      pages.forEach(p => features.push(...(p.features || [])));
    }

    // Filtra estrito: mantém só os que o centroide cai dentro do polígono da UC
    const dentro = features.filter(f => {
      if(!f.geometry) return false;
      try{ return turf.booleanPointInPolygon(turf.centroid(f), ucFeat); }catch(e){ return false; }
    });

    _carCacheUC.set(ucNome, dentro);
    _carFeatures = dentro;
    _carUCAtual  = ucNome;
    _computarAtributosCAR();
    await _carregarMarcados();
    _carCarregado  = true;
    _carCarregando = false;
    if(load) load.style.display = 'none';
    _popularFiltroSubbacia();
    _aplicarCamadaCAR();
    _atualizarContadorPins();
    toast(`${dentro.length.toLocaleString('pt-BR')} imóveis CAR em ${ucNome}`, 'success');
  } catch(err){
    _carCarregando = false;
    if(load) load.style.display = 'none';
    toast('Erro ao carregar CAR: ' + err.message, 'error');
  }
}

// ── Pré-computa UC e sub-bacia de cada feature ────────────────────────────
function _computarAtributosCAR(){
  const fonte = camadas.filter(c => c.geojson && c.geojson.features);
  const findLayer = (...terms) => fonte.find(c =>
    terms.some(t => c.nome && c.nome.toLowerCase().includes(t.toLowerCase()))
  );
  const sbFeats  = findLayer('subbacias','Subbacias')?.geojson?.features || [];
  const ucFeats  = (_ucGeojson?.features || []).filter(f => f.geometry);

  const sbNomes = new Set();
  const ucNomes = new Set();
  _carFeatures.forEach(f => {
    if(!f.geometry) return;
    let centroid;
    try { centroid = turf.centroid(f); } catch(e) { return; }
    const pt = centroid;

    // UC — encontra primeira UC que contém o centroide
    f.properties._uc = null;
    for(const uc of ucFeats){
      try{
        if(turf.booleanPointInPolygon(pt, uc)){
          f.properties._uc = uc.properties?.nome || uc.properties?.name || uc.properties?.NOME || null;
          if(f.properties._uc) ucNomes.add(f.properties._uc);
          break;
        }
      } catch(e){}
    }

    // Sub-bacia
    f.properties._subbacia = null;
    for(const sb of sbFeats){
      try{
        if(turf.booleanPointInPolygon(pt, sb)){
          f.properties._subbacia = sb.properties?.name || sb.properties?.Name || sb.properties?.NAME || null;
          if(f.properties._subbacia) sbNomes.add(f.properties._subbacia);
          break;
        }
      } catch(e) {}
    }

    // Interseção com desmatamento (marca flag)
    f.properties._desmat = false;
  });
  _carSubbaciaOpts = [...sbNomes].sort();
  _carUCOpts = [...ucNomes].sort();
}

// ── Popular select de sub-bacias ──────────────────────────────────────────
function _popularFiltroSubbacia(){
  const sel = document.getElementById('car-sel-sub');
  if(!sel) return;
  sel.innerHTML = '<option value="todas">Todas as sub-bacias</option>'
    + _carSubbaciaOpts.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('');
}

// ── Popular select de UCs ─────────────────────────────────────────────────
function _popularFiltroUC(){
  const sel = document.getElementById('car-sel-uc');
  if(!sel) return;
  const nomes = (_ucGeojson?.features || [])
    .map(f => f.properties?.nome || f.properties?.name || f.properties?.NOME)
    .filter(Boolean)
    .sort((a,b) => a.localeCompare(b, 'pt-BR'));
  const atual = sel.value; // preserva seleção atual se já havia
  sel.innerHTML = '<option value="todas">— Selecione uma UC —</option>'
    + nomes.map(n => `<option value="${escHtml(n)}"${n===atual?' selected':''}>${escHtml(n)}</option>`).join('');
}

// ── Renderiza camada no mapa ──────────────────────────────────────────────
function _aplicarCamadaCAR(){
  if(_carLayer) mapaL.removeLayer(_carLayer);
  // Canvas dentro do carPane (z-index 450 > overlayPane 400)
  if(!_carRenderer) _carRenderer = L.canvas({ pane: 'carPane', padding: 0.5 });

  aplicarFiltrosCAR(false); // computa _carVisiveis sem redesenhar

  _carLayer = L.geoJSON({ type:'FeatureCollection', features: _carVisiveis }, {
    pane:     'carPane',
    renderer: _carRenderer,
    style: f => _estiloCAR(f, false, false),
    onEachFeature: (f, layer) => {
      layer.on('mouseover', () => {
        if(layer !== _carSelecionado)
          layer.setStyle(_estiloCAR(f, true, false));
        mapaL.getContainer().style.cursor = 'pointer';
      });
      layer.on('mouseout', () => {
        if(layer !== _carSelecionado)
          layer.setStyle(_estiloCAR(f, false, false));
        mapaL.getContainer().style.cursor = '';
      });
      layer.on('click', e => {
        L.DomEvent.stopPropagation(e); // impede popup de delimitação
        _selecionarCAR(f, layer);
      });
    }
  }).addTo(mapaL);

  _atualizarBadgeCAR();
  document.getElementById('car-filtros-wrap').style.display = 'flex';
}

// ── Filtros ───────────────────────────────────────────────────────────────
function aplicarFiltrosCAR(redesenhar = true){
  const uc     = document.getElementById('car-sel-uc')?.value   || 'todas';
  const sub    = document.getElementById('car-sel-sub')?.value  || 'todas';
  const checks = document.querySelectorAll('[data-car-status]');
  const ativos = new Set([...checks].filter(c => c.checked).map(c => c.dataset.carStatus));

  // UC mudou → recarrega WFS para essa UC
  if(uc !== _carUCAtual){
    carregarDadosCAR(uc);
    return;
  }

  _carVisiveis = _carFeatures.filter(f => {
    const p = f.properties || {};
    if(sub !== 'todas' && p._subbacia !== sub) return false;
    const key = _carStatusKey(p.condicao);
    if(!ativos.has(key)) return false;
    return true;
  });

  if(redesenhar) _aplicarCamadaCAR();
  else _atualizarBadgeCAR();
}

function _atualizarBadgeCAR(){
  const badge = document.getElementById('car-count-badge');
  if(badge){
    badge.textContent = _carVisiveis.length.toLocaleString('pt-BR');
    badge.style.display = 'inline-flex';
  }
  // Stats block
  const sb = document.getElementById('car-stats-bloco');
  if(!sb) return;
  const areaTot = _carVisiveis.reduce((s,f) => s + (parseFloat(f.properties?.area)||0), 0);
  const porStatus = {};
  _carVisiveis.forEach(f => {
    const k = _carStatusKey(f.properties?.condicao);
    porStatus[k] = (porStatus[k]||0) + 1;
  });
  sb.innerHTML = `
    <div class="car-stat-row"><span>Imóveis visíveis</span><span class="car-stat-val">${_carVisiveis.length.toLocaleString('pt-BR')}</span></div>
    <div class="car-stat-row"><span>Área total declarada</span><span class="car-stat-val">${areaTot.toLocaleString('pt-BR',{maximumFractionDigits:0})} ha</span></div>
    ${porStatus.ativo     ? `<div class="car-stat-row"><span style="color:#16a34a">● Ativo</span><span class="car-stat-val">${porStatus.ativo}</span></div>` : ''}
    ${porStatus.aguardando? `<div class="car-stat-row"><span style="color:#d97706">● Aguardando</span><span class="car-stat-val">${porStatus.aguardando}</span></div>` : ''}
    ${porStatus.analise   ? `<div class="car-stat-row"><span style="color:#2563eb">● Em análise</span><span class="car-stat-val">${porStatus.analise}</span></div>` : ''}`;
}

// ── Seleção de imóvel ─────────────────────────────────────────────────────
function _selecionarCAR(f, layer){
  // Resetar anterior
  if(_carSelecionado) _carSelecionado.setStyle(_estiloCAR(_carSelecionado.feature || f, false, false));
  _carSelecionado = layer;
  layer.setStyle(_estiloCAR(f, false, true));
  layer.bringToFront();
  abrirDetalhesCAR(f);
}

async function _carregarMarcados(){
  const { data } = await db.from('car_marcados').select('*');
  _carMarcados = new Map((data||[]).map(r => [r.cod_imovel, r]));
  _atualizarContadorPins();
}

function _atualizarContadorPins(){
  const n = _carMarcados.size;
  ['car-pin-count-tab'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.textContent = n;
  });
}

function abaCarDet(aba){
  _carDetAba = aba;

  );

function _renderCarDetBody(){
  const bod = document.getElementById('car-det-body');
  if(!bod) return;
  if(_carDetAba === 'atributos')          bod.innerHTML = _htmlCarAtributos(_carAbertoFeat);

  else if(_carDetAba === 'prodes')      { bod.innerHTML = _htmlProdesLoading(); _iniciarProdesCAR(_carAbertoFeat); }
