<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Mapa de Entregas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
/* ── Layout ─────────────────────────────────────────────────── */
.mapa-wrapper{display:flex;flex-direction:column;gap:12px;height:calc(100vh - 110px);min-height:500px;}
.mapa-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.mapa-container{display:flex;gap:12px;flex:1;min-height:0;}
#mapa{flex:1;border-radius:var(--raio-lg);border:1px solid var(--borda);z-index:0;min-height:0;}
.mapa-painel{width:270px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:2px;}

/* ── Stats mini ─────────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.stat-mini{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:10px 12px;position:relative;overflow:hidden;}
.stat-mini::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.sm-g::after{background:var(--verde-claro)}.sm-b::after{background:var(--azul-medio)}
.stat-mini .lbl{font-size:10px;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.stat-mini .val{font-size:18px;font-weight:600;color:var(--cinza-900);}

/* ── Blocos de filtro ───────────────────────────────────────── */
.filtro-bloco{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);overflow:hidden;}
.filtro-bloco-header{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--borda);cursor:pointer;user-select:none;}
.filtro-bloco-header h4{margin:0;font-size:11px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;}
.filtro-bloco-body{padding:8px 12px 10px;}
.filtro-item{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;color:var(--cinza-700);}
.filtro-item input[type=checkbox]{accent-color:var(--verde-escuro);width:13px;height:13px;cursor:pointer;flex-shrink:0;}
.filtro-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.filtro-count{margin-left:auto;font-size:10px;font-weight:600;color:var(--cinza-400);background:var(--cinza-100);padding:1px 6px;border-radius:99px;}

/* APA: botão geojson */
.apa-row{display:flex;align-items:center;gap:4px;padding:4px 0;}
.apa-row input[type=checkbox]{accent-color:var(--verde-escuro);width:13px;height:13px;cursor:pointer;flex-shrink:0;}
.apa-row .apa-label{flex:1;font-size:12px;color:var(--cinza-700);display:flex;align-items:center;gap:6px;}
.btn-geojson{font-size:10px;padding:2px 7px;border:1px dashed var(--borda);border-radius:4px;background:transparent;color:var(--cinza-500);cursor:pointer;white-space:nowrap;transition:all .15s;}
.btn-geojson:hover{border-color:var(--verde-escuro);color:var(--verde-escuro);}
.btn-geojson.carregado{border-color:#16a34a;color:#16a34a;background:#f0fdf4;}

/* ── Lista de pontos ───────────────────────────────────────── */
.pontos-lista{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);overflow:hidden;flex:1;min-height:80px;}
.pontos-lista-header{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 8px;border-bottom:1px solid var(--borda);}
.pontos-lista-header h4{margin:0;font-size:11px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;}
.pontos-scroll{overflow-y:auto;max-height:240px;}
.ponto-item{display:flex;align-items:flex-start;gap:8px;padding:7px 12px;border-bottom:1px solid var(--cinza-100);cursor:pointer;transition:background .12s;}
.ponto-item:last-child{border-bottom:none;}
.ponto-item:hover{background:var(--cinza-50);}
.ponto-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.ponto-nome{font-size:12px;font-weight:500;color:var(--cinza-800);line-height:1.3;}
.ponto-sub{font-size:10px;color:var(--cinza-500);margin-top:1px;}

/* ── Modal ─────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-header{padding:16px 20px 12px;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-header h3{margin:0;font-size:15px;font-weight:600;color:var(--cinza-900);}
.modal-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.modal-footer{padding:12px 20px;border-top:1px solid var(--borda);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/-1;}
.form-group label{font-size:11px;font-weight:600;color:var(--cinza-600);text-transform:uppercase;letter-spacing:.05em;}
.form-group input,.form-group select,.form-group textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--borda);border-radius:var(--raio);color:var(--cinza-900);background:#fff;width:100%;box-sizing:border-box;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--verde-escuro);box-shadow:0 0 0 3px rgba(31,78,44,.1);}
.form-group textarea{resize:vertical;min-height:60px;}
.geo-row{display:flex;gap:8px;align-items:flex-end;}
.geo-row .form-group{flex:1;}
.btn-geo{padding:7px 10px;border:1px dashed var(--verde-escuro);background:rgba(31,78,44,.06);color:var(--verde-escuro);border-radius:var(--raio);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.btn-geo:hover{background:rgba(31,78,44,.12);}
.foto-upload-area{border:2px dashed var(--borda);border-radius:var(--raio);padding:16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;}
.foto-upload-area:hover,.foto-upload-area.drag{border-color:var(--verde-escuro);background:rgba(31,78,44,.04);}
.foto-upload-area .ico{font-size:24px;margin-bottom:4px;}
.foto-upload-area p{margin:0;font-size:12px;color:var(--cinza-500);}
.foto-preview{width:100%;max-height:140px;object-fit:cover;border-radius:var(--raio);margin-top:8px;display:none;}

/* ── Popup Leaflet ──────────────────────────────────────────── */
.mapa-popup{min-width:200px;max-width:260px;font-family:'DM Sans',sans-serif;}
.mapa-popup h4{margin:0 0 6px;font-size:13px;font-weight:600;color:#1F4E2C;}
.mapa-popup .pp-foto{width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px;}
.mapa-popup .pp-linha{display:flex;gap:6px;font-size:11px;color:#555;margin-bottom:3px;align-items:flex-start;}
.mapa-popup .pp-linha strong{color:#222;min-width:64px;flex-shrink:0;}

/* ── CSV modal ──────────────────────────────────────────────── */
.csv-drop{border:2px dashed var(--borda);border-radius:var(--raio);padding:24px;text-align:center;cursor:pointer;}
.csv-drop:hover,.csv-drop.drag{border-color:var(--verde-escuro);background:rgba(31,78,44,.04);}
.csv-preview{margin-top:10px;font-size:11px;color:var(--cinza-600);background:var(--cinza-50);border-radius:var(--raio);padding:8px;max-height:140px;overflow-y:auto;}
.csv-preview table{border-collapse:collapse;width:100%;}
.csv-preview td,.csv-preview th{padding:3px 6px;border:1px solid var(--cinza-200);white-space:nowrap;}
.csv-preview th{background:var(--cinza-100);font-weight:600;}

/* ── Tipo badge ─────────────────────────────────────────────── */
.tipo-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div style="text-align:center"><div style="width:32px;height:32px;border:3px solid #E5E7EB;border-top-color:#2D6A4F;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>Carregando mapa...</div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ── Constantes ────────────────────────────────────────────────────────────
const APA_CONFIG = {
  'Igarapé São Francisco': { cor:'#16a34a', fill:'#16a34a', lsKey:'dima_geojson_isf' },
  'Lago do Amapá':          { cor:'#2563eb', fill:'#2563eb', lsKey:'dima_geojson_la'  },
  'Outra':                  { cor:'#9ca3af', fill:'#9ca3af', lsKey:null               },
};

// Paleta para tipos de entrega (rotativa)
const TIPO_CORES = ['#7c3aed','#d97706','#0891b2','#dc2626','#059669','#d946ef','#f59e0b','#3b82f6'];

// ── Estado ────────────────────────────────────────────────────────────────
let mapaL = null, clusters = null;
let pontos = [], pontosLayer = [];
let matrizItens = [];   // itens da matriz com indicador geolocalizável
let filtrosAPA  = new Set(Object.keys(APA_CONFIG));
let filtrosTipo = new Set();   // preenchido após carregar matriz
let apaPolygonLayers = {};     // { 'Igarapé São Francisco': L.geoJSON, ... }
let tipoCores = {};            // { tipo: cor }

// ── Init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const u = await carregarUsuario();
  if (!u) { window.location.href = '../index.html'; return; }

  // Carregar matriz_itens em paralelo com o layout
  const [, matrizData] = await Promise.all([
    Promise.resolve(),
    db.from('matriz_itens')
      .select('id,resultado,produto_codigo,produto_titulo,indicador,meta_numerica,unidade')
      .eq('ativo', true)
      .order('produto_codigo')
  ]);
  matrizItens = (matrizData.data || []);

  // Montar tipos únicos com cores
  const tiposUnicos = [...new Set(matrizItens.map(i => i.produto_titulo).filter(Boolean))];
  tiposUnicos.forEach((t, idx) => {
    tipoCores[t] = TIPO_CORES[idx % TIPO_CORES.length];
    filtrosTipo.add(t);
  });

  document.getElementById('app').innerHTML =
    gerarLayout('Mapa de Entregas','mapa') + renderPagina() + fecharLayout();

  setTimeout(async () => {
    iniciarMapa();
    carregarGeoJsonSalvos();
    await carregarPontos();
    vincularEventos();
  }, 0);
});

// ── Render ────────────────────────────────────────────────────────────────
function renderPagina(){
  // Seção tipos de entrega (dinâmica)
  const tiposHtml = matrizItens.length === 0
    ? `<div style="font-size:11px;color:var(--cinza-400);padding:4px 0">Nenhum item na matriz.</div>`
    : [...new Set(matrizItens.map(i=>i.produto_titulo).filter(Boolean))].map(tipo => {
        const cor = tipoCores[tipo] || '#9ca3af';
        const item = matrizItens.find(i=>i.produto_titulo===tipo);
        const meta = item?.meta_numerica ? ` · meta ${item.meta_numerica} ${item.unidade||''}`.trim() : '';
        return `<div class="filtro-item">
          <input type="checkbox" checked data-tipo="${escHtml(tipo)}" onchange="toggleFiltroTipo(this)">
          <span class="filtro-dot" style="background:${cor}"></span>
          <span style="flex:1;line-height:1.3">${escHtml(tipo)}<span style="display:block;font-size:9px;color:var(--cinza-400)">${escHtml(item?.resultado||'')}${meta}</span></span>
        </div>`;
      }).join('');

  return `
  <div class="mapa-wrapper">
    <div class="mapa-toolbar">
      <div style="flex:1">
        <h2 style="margin:0;font-size:17px;font-weight:600;color:var(--cinza-900)">Mapa de Entregas</h2>
        <p style="margin:2px 0 0;font-size:11px;color:var(--cinza-500)">APAs · Rio Branco, Acre</p>
      </div>
      <button class="btn btn-outline" onclick="abrirModalCSV()" style="font-size:12px;display:flex;align-items:center;gap:5px;">
        <span>📂</span> Importar CSV
      </button>
      <button class="btn btn-primary" onclick="abrirModalNovo()" style="font-size:12px;display:flex;align-items:center;gap:5px;">
        <span>＋</span> Adicionar ponto
      </button>
    </div>

    <div class="mapa-container">
      <div id="mapa"></div>

      <div class="mapa-painel">
        <!-- stats -->
        <div class="stats-row">
          <div class="stat-mini sm-g"><div class="lbl">Total</div><div class="val" id="stat-total">—</div></div>
          <div class="stat-mini sm-b"><div class="lbl">Ativos</div><div class="val" id="stat-ativos">—</div></div>
        </div>

        <!-- Demarcação APAs -->
        <div class="filtro-bloco">
          <div class="filtro-bloco-header" onclick="toggleBloco('bloco-apa')">
            <h4>Demarcação das APAs</h4>
            <span style="font-size:10px;color:var(--cinza-400)" id="chevron-bloco-apa">▾</span>
          </div>
          <div class="filtro-bloco-body" id="bloco-apa">
            ${Object.entries(APA_CONFIG).filter(([k])=>k!=='Outra').map(([nome, cfg])=>`
            <div class="apa-row">
              <input type="checkbox" checked data-apa="${escHtml(nome)}" onchange="toggleFiltroAPA(this)">
              <span class="apa-label">
                <span class="filtro-dot" style="background:${cfg.cor}"></span>
                <span style="flex:1">${escHtml(nome)}</span>
              </span>
              <button class="btn-geojson ${localStorage.getItem(cfg.lsKey)?'carregado':''}"
                id="btn-geojson-${escHtml(nome.replace(/\s/g,'_'))}"
                onclick="abrirUploadGeoJson('${escHtml(nome)}')"
                title="${localStorage.getItem(cfg.lsKey)?'Demarcação carregada — clique para substituir':'Importar arquivo GeoJSON da demarcação'}">
                ${localStorage.getItem(cfg.lsKey)?'✓ GeoJSON':'📁 GeoJSON'}
              </button>
            </div>`).join('')}
            <p style="font-size:10px;color:var(--cinza-400);margin:6px 0 0;line-height:1.4">
              Importe o arquivo <code>.geojson</code> oficial do CNUC/SEMA para visualizar o limite da APA no mapa.
            </p>
          </div>
        </div>

        <!-- Filtro por tipo de entrega -->
        <div class="filtro-bloco">
          <div class="filtro-bloco-header" onclick="toggleBloco('bloco-tipos')">
            <h4>Tipos de entrega</h4>
            <span style="font-size:10px;color:var(--cinza-400)" id="chevron-bloco-tipos">▾</span>
          </div>
          <div class="filtro-bloco-body" id="bloco-tipos">
            ${tiposHtml}
          </div>
        </div>

        <!-- lista de pontos -->
        <div class="pontos-lista">
          <div class="pontos-lista-header">
            <h4>Pontos visíveis</h4>
            <span id="lista-count" style="font-size:10px;color:var(--cinza-400)">0</span>
          </div>
          <div class="pontos-scroll" id="lista-pontos">
            <div style="padding:14px;text-align:center;font-size:12px;color:var(--cinza-400)">Carregando...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Novo/Editar ponto -->
  <div class="modal-overlay" id="modal-ponto" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-ponto-titulo">Adicionar ponto</h3>
        <button class="btn-close" onclick="fecharModalPonto()">✕</button>
      </div>
      <div class="modal-body" id="modal-ponto-body"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="fecharModalPonto()">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar-ponto" onclick="salvarPonto()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Importar CSV -->
  <div class="modal-overlay" id="modal-csv" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Importar CSV</h3>
        <button class="btn-close" onclick="fecharModalCSV()">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin:0;font-size:12px;color:var(--cinza-600)">
          Cabeçalhos esperados: <code>nome_local, apa, tipo_atividade, responsavel, data_implantacao, lat, lng, observacao</code>
        </p>
        <button class="btn btn-outline" onclick="baixarTemplate()" style="font-size:12px;">⬇ Baixar template</button>
        <div class="csv-drop" id="csv-drop"
          onclick="document.getElementById('csv-input').click()"
          ondragover="event.preventDefault();this.classList.add('drag')"
          ondragleave="this.classList.remove('drag')"
          ondrop="onCsvDrop(event)">
          <div style="font-size:28px;margin-bottom:6px">📄</div>
          <p style="font-size:13px;font-weight:500;color:var(--cinza-700)">Arraste ou clique para selecionar</p>
          <p style="font-size:11px;color:var(--cinza-400);margin-top:4px">Apenas .csv</p>
        </div>
        <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="onCsvFile(this.files[0])">
        <div class="csv-preview" id="csv-preview" style="display:none"></div>
        <p id="csv-status" style="font-size:12px;color:var(--cinza-600);margin:4px 0 0"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="fecharModalCSV()">Cancelar</button>
        <button class="btn btn-primary" id="btn-importar-csv" onclick="importarCSV()" disabled>Importar</button>
      </div>
    </div>
  </div>

  <!-- Input oculto para upload GeoJSON -->
  <input type="file" id="geojson-input" accept=".geojson,.json" style="display:none" onchange="onGeoJsonFile(this.files[0])">
  `;
}

// ── Mapa ──────────────────────────────────────────────────────────────────
function iniciarMapa(){
  mapaL = L.map('mapa', { center:[-9.965,-67.81], zoom:12 });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Esri, Maxar, Earthstar Geographics', maxZoom:19
  }).addTo(mapaL);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{
    attribution:'© CartoDB', opacity:0.8, maxZoom:19
  }).addTo(mapaL);

  clusters = L.markerClusterGroup({ maxClusterRadius:40, disableClusteringAtZoom:17 });
  mapaL.addLayer(clusters);
}

// ── GeoJSON das APAs ──────────────────────────────────────────────────────
let apaGeoJsonAtual = null; // qual APA está sendo importada

function carregarGeoJsonSalvos(){
  Object.entries(APA_CONFIG).forEach(([nome, cfg]) => {
    if(!cfg.lsKey) return;
    const raw = localStorage.getItem(cfg.lsKey);
    if(raw){
      try { renderizarApaPolygon(nome, JSON.parse(raw)); } catch(e){}
    }
  });
}

function abrirUploadGeoJson(nomeApa){
  apaGeoJsonAtual = nomeApa;
  document.getElementById('geojson-input').value = '';
  document.getElementById('geojson-input').click();
}

function onGeoJsonFile(file){
  if(!file || !apaGeoJsonAtual) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const gj = JSON.parse(e.target.result);
      const cfg = APA_CONFIG[apaGeoJsonAtual];
      if(cfg?.lsKey) localStorage.setItem(cfg.lsKey, JSON.stringify(gj));
      renderizarApaPolygon(apaGeoJsonAtual, gj);
      // Atualizar botão
      const btnId = 'btn-geojson-'+apaGeoJsonAtual.replace(/\s/g,'_');
      const btn = document.getElementById(btnId);
      if(btn){ btn.textContent='✓ GeoJSON'; btn.classList.add('carregado'); }
    } catch(err){
      alert('Arquivo GeoJSON inválido: '+err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

function renderizarApaPolygon(nome, geojson){
  // Remover camada anterior se existir
  if(apaPolygonLayers[nome]){
    mapaL.removeLayer(apaPolygonLayers[nome]);
    delete apaPolygonLayers[nome];
  }
  const cfg = APA_CONFIG[nome];
  const layer = L.geoJSON(geojson, {
    style: {
      color: cfg.cor,
      weight: 2,
      opacity: 0.9,
      fillColor: cfg.fill,
      fillOpacity: 0.15,
      dashArray: '5 4'
    }
  });

  // Só adiciona ao mapa se a APA estiver ligada no filtro
  if(filtrosAPA.has(nome)){
    layer.addTo(mapaL);
    mapaL.fitBounds(layer.getBounds(), { padding:[20,20] });
  }
  apaPolygonLayers[nome] = layer;
}

function toggleBloco(id){
  const el = document.getElementById(id);
  const ch = document.getElementById('chevron-'+id);
  if(!el) return;
  const aberto = el.style.display !== 'none';
  el.style.display = aberto ? 'none' : '';
  if(ch) ch.textContent = aberto ? '▸' : '▾';
}

// ── Marcadores ────────────────────────────────────────────────────────────
function corIcone(p){
  // Cor pelo tipo de entrega; se não tiver tipo, usa a cor da APA
  if(p.tipo_atividade && tipoCores[p.tipo_atividade]) return tipoCores[p.tipo_atividade];
  return APA_CONFIG[p.apa]?.cor || '#9ca3af';
}

function criarIcone(p){
  const cor = corIcone(p);
  const letra = (p.tipo_atividade||'?')[0].toUpperCase();
  return L.divIcon({
    className:'',
    html:`<div style="width:16px;height:16px;border-radius:50%;background:${cor};border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;font-family:sans-serif">${letra}</div>`,
    iconSize:[16,16], iconAnchor:[8,8], popupAnchor:[0,-10]
  });
}

async function carregarPontos(){
  const { data, error } = await db.from('produto_pontos_mapa').select('*').order('criado_em',{ascending:false});
  if(error){ console.error(error); return; }
  pontos = data || [];
  renderizarMarcadores();
  renderizarLista();
  atualizarStats();
}

function pontoVisivel(p){
  if(!filtrosAPA.has(p.apa)) return false;
  if(p.tipo_atividade && !filtrosTipo.has(p.tipo_atividade)) return false;
  return true;
}

function renderizarMarcadores(){
  clusters.clearLayers();
  pontosLayer = [];
  pontos.filter(pontoVisivel).forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: criarIcone(p) });
    m.bindPopup(renderPopup(p), { maxWidth:280 });
    m.pontoId = p.id;
    clusters.addLayer(m);
    pontosLayer.push(m);
  });
}

function renderPopup(p){
  const dt = p.data_implantacao ? new Date(p.data_implantacao+'T12:00').toLocaleDateString('pt-BR') : '—';
  const cor = corIcone(p);
  return `<div class="mapa-popup">
    ${p.foto_url?`<img class="pp-foto" src="${escHtml(p.foto_url)}" alt="foto">`:''}
    <h4>${escHtml(p.nome_local)}</h4>
    ${p.tipo_atividade?`<div style="margin-bottom:7px"><span style="background:${cor}22;color:${cor};font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid ${cor}55">${escHtml(p.tipo_atividade)}</span></div>`:''}
    <div class="pp-linha"><strong>APA:</strong>${escHtml(p.apa)}</div>
    ${p.responsavel?`<div class="pp-linha"><strong>Responsável:</strong>${escHtml(p.responsavel)}</div>`:''}
    <div class="pp-linha"><strong>Implantação:</strong>${dt}</div>
    ${p.observacao?`<div class="pp-linha"><strong>Obs.:</strong>${escHtml(p.observacao)}</div>`:''}
    <div style="margin-top:8px;display:flex;gap:6px">
      <button onclick="abrirModalEditar('${p.id}')" style="font-size:11px;padding:3px 10px;border:1px solid #ccc;border-radius:6px;cursor:pointer;background:#fff">✏ Editar</button>
      <button onclick="excluirPonto('${p.id}')" style="font-size:11px;padding:3px 10px;border:1px solid #fca5a5;border-radius:6px;cursor:pointer;background:#fff;color:#dc2626">🗑</button>
    </div>
  </div>`;
}

function renderizarLista(){
  const el = document.getElementById('lista-pontos');
  const ct = document.getElementById('lista-count');
  if(!el) return;
  const vis = pontos.filter(pontoVisivel);
  if(ct) ct.textContent = vis.length;
  if(!vis.length){
    el.innerHTML=`<div style="padding:14px;text-align:center;font-size:12px;color:var(--cinza-400)">Nenhum ponto visível.</div>`;
    return;
  }
  el.innerHTML = vis.map(p => {
    const cor = corIcone(p);
    const dt = p.data_implantacao ? new Date(p.data_implantacao+'T12:00').toLocaleDateString('pt-BR') : '';
    return `<div class="ponto-item" onclick="focarPonto('${p.id}')">
      <span class="ponto-dot" style="background:${cor}"></span>
      <div style="flex:1;min-width:0">
        <div class="ponto-nome">${escHtml(p.nome_local)}</div>
        <div class="ponto-sub">${escHtml(p.tipo_atividade||p.apa)}${dt?' · '+dt:''}</div>
      </div>
    </div>`;
  }).join('');
}

function atualizarStats(){
  const el1=document.getElementById('stat-total'), el2=document.getElementById('stat-ativos');
  if(el1) el1.textContent=pontos.length;
  if(el2) el2.textContent=pontos.filter(p=>p.status==='ativo').length;
}

function focarPonto(id){
  const p=pontos.find(x=>x.id===id); if(!p) return;
  mapaL.setView([p.lat,p.lng],17);
  const layer=pontosLayer.find(m=>m.pontoId===id);
  if(layer) clusters.zoomToShowLayer(layer,()=>layer.openPopup());
}

function toggleFiltroAPA(el){
  const apa = el.dataset.apa;
  if(el.checked) filtrosAPA.add(apa); else filtrosAPA.delete(apa);
  // Mostrar/ocultar polígono
  if(apaPolygonLayers[apa]){
    if(el.checked) apaPolygonLayers[apa].addTo(mapaL);
    else mapaL.removeLayer(apaPolygonLayers[apa]);
  }
  renderizarMarcadores();
  renderizarLista();
}

function toggleFiltroTipo(el){
  const tipo = el.dataset.tipo;
  if(el.checked) filtrosTipo.add(tipo); else filtrosTipo.delete(tipo);
  renderizarMarcadores();
  renderizarLista();
}

// ── Modal: Novo/Editar ponto ──────────────────────────────────────────────
let editandoId = null;

function htmlFormPonto(p={}){
  const tipoOptions = matrizItens.length
    ? [...new Set(matrizItens.map(i=>i.produto_titulo).filter(Boolean))].map(t =>
        `<option value="${escHtml(t)}" ${p.tipo_atividade===t?'selected':''}>${escHtml(t)}</option>`
      ).join('')
    : '';

  return `
  <div class="form-row">
    <div class="form-group full">
      <label>Nome do local *</label>
      <input id="f-nome" type="text" value="${escHtml(p.nome_local||'')}" placeholder="Ex: Unidade Produtiva — Comunidade Boa Vista">
    </div>
    <div class="form-group">
      <label>APA *</label>
      <select id="f-apa">
        <option value="">Selecione…</option>
        ${Object.keys(APA_CONFIG).map(a=>`<option value="${escHtml(a)}" ${p.apa===a?'selected':''}>${escHtml(a)}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>Tipo de entrega</label>
      <select id="f-tipo">
        <option value="">Selecione…</option>
        ${tipoOptions}
        <option value="__outro" ${!p.tipo_atividade||!tipoOptions?'selected':''}>Outro (digitar)</option>
      </select>
    </div>
    <div class="form-group" id="g-tipo-livre" style="${p.tipo_atividade&&tipoOptions&&!['__outro'].includes(p.tipo_atividade)?'display:none':''}">
      <label>Tipo (livre)</label>
      <input id="f-tipo-livre" type="text" value="${tipoOptions?'':(escHtml(p.tipo_atividade||''))}" placeholder="Descreva o tipo">
    </div>
    <div class="form-group">
      <label>Responsável</label>
      <input id="f-resp" type="text" value="${escHtml(p.responsavel||'')}" placeholder="Nome">
    </div>
    <div class="form-group">
      <label>Data de implantação</label>
      <input id="f-data" type="date" value="${p.data_implantacao||''}">
    </div>
  </div>
  <div>
    <label style="font-size:11px;font-weight:600;color:var(--cinza-600);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px">Localização *</label>
    <div class="geo-row">
      <div class="form-group"><label>Latitude</label><input id="f-lat" type="number" step="any" value="${p.lat||''}" placeholder="-9.9748"></div>
      <div class="form-group"><label>Longitude</label><input id="f-lng" type="number" step="any" value="${p.lng||''}" placeholder="-67.8072"></div>
      <button class="btn-geo" onclick="usarGeolocalizacao()">📍 GPS</button>
    </div>
  </div>
  <div class="form-group">
    <label>Foto</label>
    <div class="foto-upload-area" id="foto-area"
      onclick="document.getElementById('f-foto').click()"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="onFotoDrop(event)">
      <div class="ico">📷</div>
      <p>${p.foto_url?'Substituir foto':'Clique ou arraste para adicionar foto'}</p>
      ${p.foto_url?`<img id="foto-preview" class="foto-preview" src="${escHtml(p.foto_url)}" style="display:block">`:`<img id="foto-preview" class="foto-preview">`}
    </div>
    <input type="file" id="f-foto" accept="image/*" style="display:none" onchange="previewFoto(this)">
  </div>
  <div class="form-group">
    <label>Observação</label>
    <textarea id="f-obs" placeholder="Informações adicionais…">${escHtml(p.observacao||'')}</textarea>
  </div>`;
}

function abrirModalNovo(){
  editandoId=null;
  document.getElementById('modal-ponto-titulo').textContent='Adicionar ponto';
  document.getElementById('modal-ponto-body').innerHTML=htmlFormPonto();
  document.getElementById('modal-ponto').style.display='flex';
  // Mostrar campo livre quando selecionar "outro"
  document.getElementById('f-tipo').addEventListener('change', onChangeTipo);
}
function abrirModalEditar(id){
  const p=pontos.find(x=>x.id===id); if(!p) return;
  editandoId=id;
  document.getElementById('modal-ponto-titulo').textContent='Editar ponto';
  document.getElementById('modal-ponto-body').innerHTML=htmlFormPonto(p);
  document.getElementById('modal-ponto').style.display='flex';
  document.getElementById('f-tipo').addEventListener('change', onChangeTipo);
}
function fecharModalPonto(){ document.getElementById('modal-ponto').style.display='none'; editandoId=null; fotoArquivo=null; }
function onChangeTipo(e){
  const livre=document.getElementById('g-tipo-livre');
  if(livre) livre.style.display = e.target.value==='__outro' ? '' : 'none';
}

function usarGeolocalizacao(){
  if(!navigator.geolocation){ alert('Geolocalização não suportada.'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('f-lat').value=pos.coords.latitude.toFixed(6);
    document.getElementById('f-lng').value=pos.coords.longitude.toFixed(6);
  }, ()=>alert('Sem permissão de localização.'));
}

let fotoArquivo=null;
function previewFoto(input){
  const f=input.files[0]; if(!f) return;
  fotoArquivo=f;
  const img=document.getElementById('foto-preview');
  img.src=URL.createObjectURL(f); img.style.display='block';
}
function onFotoDrop(e){
  e.preventDefault(); document.getElementById('foto-area').classList.remove('drag');
  const f=e.dataTransfer.files[0]; if(!f||!f.type.startsWith('image/')) return;
  fotoArquivo=f;
  const img=document.getElementById('foto-preview');
  img.src=URL.createObjectURL(f); img.style.display='block';
}

async function salvarPonto(){
  const nome=document.getElementById('f-nome').value.trim();
  const apa=document.getElementById('f-apa').value;
  const lat=parseFloat(document.getElementById('f-lat').value);
  const lng=parseFloat(document.getElementById('f-lng').value);
  const tipoSel=document.getElementById('f-tipo').value;
  const tipo = tipoSel==='__outro'
    ? (document.getElementById('f-tipo-livre')?.value.trim()||null)
    : (tipoSel||null);

  if(!nome||!apa||isNaN(lat)||isNaN(lng)){
    alert('Preencha Nome, APA, Latitude e Longitude.'); return;
  }
  const btn=document.getElementById('btn-salvar-ponto');
  btn.disabled=true; btn.textContent='Salvando…';

  let foto_url=editandoId?(pontos.find(p=>p.id===editandoId)?.foto_url||null):null;
  let foto_nome=editandoId?(pontos.find(p=>p.id===editandoId)?.foto_nome||null):null;
  if(fotoArquivo){
    const ext=fotoArquivo.name.split('.').pop();
    const path=`pontos/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const {error:upErr}=await db.storage.from('pontos-mapa').upload(path,fotoArquivo,{upsert:true});
    if(upErr){ alert('Erro foto: '+upErr.message); btn.disabled=false; btn.textContent='Salvar'; return; }
    const {data:urlData}=db.storage.from('pontos-mapa').getPublicUrl(path);
    foto_url=urlData.publicUrl; foto_nome=fotoArquivo.name;
  }

  const payload={nome_local:nome,apa,tipo_atividade:tipo,responsavel:document.getElementById('f-resp').value.trim()||null,
    data_implantacao:document.getElementById('f-data').value||null,lat,lng,foto_url,foto_nome,
    observacao:document.getElementById('f-obs').value.trim()||null,status:'ativo'};
  let err;
  if(editandoId){({error:err}=await db.from('produto_pontos_mapa').update(payload).eq('id',editandoId));}
  else{payload.criado_por=appState.usuario?.id||null;({error:err}=await db.from('produto_pontos_mapa').insert(payload));}

  btn.disabled=false; btn.textContent='Salvar';
  if(err){alert('Erro: '+err.message);return;}
  fecharModalPonto();
  await carregarPontos();
  // Novo tipo adicionado? Atualizar filtro
  if(tipo && !tipoCores[tipo]){
    const idx=Object.keys(tipoCores).length;
    tipoCores[tipo]=TIPO_CORES[idx%TIPO_CORES.length];
    filtrosTipo.add(tipo);
  }
}

async function excluirPonto(id){
  if(!confirm('Excluir este ponto?')) return;
  const {error}=await db.from('produto_pontos_mapa').delete().eq('id',id);
  if(error){alert('Erro: '+error.message);return;}
  await carregarPontos();
}

// ── CSV ───────────────────────────────────────────────────────────────────
let csvLinhas=[];
const CSV_CAMPOS=['nome_local','apa','tipo_atividade','responsavel','data_implantacao','lat','lng','observacao'];
function abrirModalCSV(){ csvLinhas=[];document.getElementById('csv-preview').style.display='none';document.getElementById('csv-status').textContent='';document.getElementById('btn-importar-csv').disabled=true;document.getElementById('modal-csv').style.display='flex'; }
function fecharModalCSV(){ document.getElementById('modal-csv').style.display='none'; }
function baixarTemplate(){
  const blob=new Blob([CSV_CAMPOS.join(',')+'\nUnidade Produtiva 01,Igarapé São Francisco,Unidades Produtivas,João Silva,2025-04-10,-9.9720,-67.8050,Próximo ao igarapé'],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='template_pontos_mapa.csv';a.click();
}
function onCsvDrop(e){e.preventDefault();document.getElementById('csv-drop').classList.remove('drag');const f=e.dataTransfer.files[0];if(f)processarCSV(f);}
function onCsvFile(f){if(f)processarCSV(f);}
function processarCSV(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const linhas=e.target.result.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!linhas.length){document.getElementById('csv-status').textContent='Arquivo vazio.';return;}
    const header=linhas[0].split(',').map(h=>h.trim().toLowerCase().replace(/[^a-z_]/g,''));
    const dados=linhas.slice(1).map(linha=>{
      const cols=parseCsvLinha(linha);const obj={};
      header.forEach((h,i)=>{obj[h]=cols[i]?.trim()||null;});return obj;
    }).filter(r=>r.nome_local&&r.lat&&r.lng);
    if(!dados.length){document.getElementById('csv-status').textContent='Nenhuma linha válida.';return;}
    csvLinhas=dados;
    document.getElementById('csv-status').textContent=`${dados.length} registros prontos.`;
    document.getElementById('btn-importar-csv').disabled=false;
    const prev=document.getElementById('csv-preview');
    const cols=CSV_CAMPOS.filter(c=>header.includes(c));
    prev.style.display='block';
    prev.innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${dados.slice(0,5).map(r=>`<tr>${cols.map(c=>`<td>${escHtml(r[c]||'')}</td>`).join('')}</tr>`).join('')}${dados.length>5?`<tr><td colspan="${cols.length}" style="text-align:center;color:#999">…+${dados.length-5}</td></tr>`:''}</tbody></table>`;
  };
  reader.readAsText(file,'utf-8');
}
function parseCsvLinha(linha){const result=[];let cur='',inQ=false;for(let i=0;i<linha.length;i++){const c=linha[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){result.push(cur);cur='';}else{cur+=c;}}result.push(cur);return result;}
async function importarCSV(){
  if(!csvLinhas.length) return;
  const btn=document.getElementById('btn-importar-csv');btn.disabled=true;btn.textContent='Importando…';
  const uid=appState.usuario?.id||null;
  const inserts=csvLinhas.map(r=>({
    nome_local:r.nome_local,
    apa:Object.keys(APA_CONFIG).includes(r.apa)?r.apa:'Outra',
    tipo_atividade:r.tipo_atividade||null,
    responsavel:r.responsavel||null,
    data_implantacao:r.data_implantacao||null,
    lat:parseFloat(r.lat),lng:parseFloat(r.lng),
    observacao:r.observacao||null,status:'ativo',criado_por:uid
  })).filter(r=>!isNaN(r.lat)&&!isNaN(r.lng));
  const {error}=await db.from('produto_pontos_mapa').insert(inserts);
  btn.disabled=false;btn.textContent='Importar';
  if(error){alert('Erro: '+error.message);return;}
  fecharModalCSV();
  await carregarPontos();
}

// ── Clique no mapa ────────────────────────────────────────────────────────
function vincularEventos(){
  mapaL.on('click', e => {
    const fLat=document.getElementById('f-lat'), fLng=document.getElementById('f-lng');
    if(fLat&&fLng&&document.getElementById('modal-ponto').style.display!=='none'){
      fLat.value=e.latlng.lat.toFixed(6); fLng.value=e.latlng.lng.toFixed(6);
    }
  });
}

// ── Utilitários ───────────────────────────────────────────────────────────
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
