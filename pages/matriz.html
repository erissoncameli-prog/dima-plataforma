<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Matriz de Resultados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
/* ── Stats ── */
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
.stat-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;user-select:none;transition:box-shadow .15s,border-color .15s,transform .08s;}
.stat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px);}
.stat-card:active{transform:scale(.95);box-shadow:0 1px 2px rgba(0,0,0,.12) inset;}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;z-index:3;}
.sc-g::after{background:var(--verde-claro)}.sc-b::after{background:#2563EB}
.sc-a::after{background:var(--aviso)}.sc-r::after{background:var(--erro)}.sc-t::after{background:#0D9488}
.stat-card.ativo{border-color:transparent;box-shadow:0 0 0 2px currentColor inset;}
.sc-g.ativo{color:var(--verde-claro)}
.sc-b.ativo{color:#2563EB}
.sc-a.ativo{color:var(--aviso)}
.sc-r.ativo{color:var(--erro)}
.sc-t.ativo{color:#0D9488}
.stat-lbl{font-size:10px;color:var(--cinza-700);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:600;}
.stat-val{font-size:20px;font-weight:700;color:var(--cinza-900);}
.stat-sub{font-size:10px;color:var(--cinza-500);margin-top:3px;}
.stat-card>*{position:relative;z-index:2;}
.wc-inner{position:absolute;left:0;right:0;bottom:0;height:0%;transition:height 1.1s cubic-bezier(.4,0,.2,1);z-index:0;overflow:visible;opacity:.5;}
.wc-wavewrap{position:absolute;left:0;right:0;bottom:100%;height:14px;overflow:hidden;}
.wc-wave-svg{position:absolute;top:0;left:0;width:200%;height:100%;animation:wcwave 4.5s linear infinite;}
.wc-wave-svg.w2{animation-duration:6.5s;animation-direction:reverse;opacity:.6;}
@keyframes wcwave{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── Main tabs ── */
.main-tabs{display:flex;gap:0;border-bottom:2px solid var(--borda);margin-bottom:18px;}
.main-tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--cinza-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font-sans);white-space:nowrap;}
.main-tab.ativo{color:var(--verde-medio);border-bottom-color:var(--verde-medio);font-weight:600;}
.main-tab-content{display:none;}
.main-tab-content.ativo{display:block;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Resultado accordion ── */
.resultado-bloco{margin-bottom:12px;border:1px solid var(--borda);border-radius:var(--raio-lg);overflow:hidden;}
.resultado-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--cinza-50);cursor:pointer;user-select:none;}
.resultado-header:hover{background:var(--cinza-100);}
.resultado-codigo{font-family:var(--font-mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:4px;color:#fff;flex-shrink:0;}
.rc-1{background:#1D9E75}.rc-2{background:#2563EB}.rc-3{background:#7F77DD}
.resultado-nome-txt{font-size:13px;font-weight:600;color:var(--cinza-900);flex:1;line-height:1.3;}

/* ── Produto group ── */
.produto-group{border-top:1px solid var(--borda);background:var(--branco);}
.produto-label{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#F8FAFF;border-top:1px solid var(--borda);cursor:pointer;}
.produto-label:hover{background:#F0F4FF;}
.produto-cod{font-family:var(--font-mono);font-size:11px;font-weight:700;color:#2563EB;background:#EFF6FF;padding:2px 8px;border-radius:3px;}
.produto-titulo-txt{font-size:12px;font-weight:500;color:var(--cinza-700);flex:1;}

/* ── Indicador card ── */
.ind-card{padding:12px 16px;border-top:1px solid var(--borda);border-left:4px solid transparent;cursor:pointer;transition:background .1s;}
.ind-card:hover{background:var(--cinza-50);}
.ind-card.risco-ok{border-left-color:#059669;}
.ind-card.risco-med{border-left-color:#D97706;}
.ind-card.risco-alto{border-left-color:#DC2626;}
.ind-card.risco-sem{border-left-color:var(--cinza-300);}
.ind-header{display:flex;align-items:flex-start;gap:10px;}
.ind-num{font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--cinza-100);padding:2px 7px;border-radius:3px;color:var(--cinza-600);flex-shrink:0;margin-top:2px;}
.ind-nome{font-size:12px;font-weight:500;color:var(--cinza-900);flex:1;line-height:1.4;}
.ind-badges{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;align-items:flex-start;}

.ind-prog{margin-top:8px;display:flex;align-items:center;gap:10px;}
.prog-bar-wrap{flex:1;height:6px;background:var(--cinza-100);border-radius:3px;overflow:hidden;position:relative;}
.prog-fill-conf{height:100%;background:#059669;border-radius:3px;transition:width .5s;position:absolute;left:0;}
.prog-fill-pend{height:100%;background:#FCD34D;border-radius:3px;transition:width .5s;position:absolute;}
.ind-prog-nums{font-size:10px;color:var(--cinza-500);white-space:nowrap;text-align:right;min-width:90px;}
.ind-pct{font-family:var(--font-mono);font-size:13px;font-weight:700;min-width:38px;text-align:right;}

/* ── Chips ── */
.ods-chip{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#EFF6FF;color:#1D4ED8;}
.km-chip{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#EDE9FE;color:#5B21B6;}
.pend-chip{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#FEF3C7;color:#92400E;}
.conf-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;}
.cb-ok{background:#D1FAE5;color:#065F46}
.cb-med{background:#FEF3C7;color:#92400E}

.cb-sem{background:#F3F4F6;color:#6B7280}

/* ── ODS grid ── */
.ods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.ods-card{border:1px solid var(--borda);border-radius:var(--raio-lg);overflow:hidden;text-align:center;cursor:pointer;transition:all .2s;opacity:.35;filter:grayscale(.8);background:#fff;}
.ods-card.ativo{opacity:1;filter:none;box-shadow:0 4px 18px rgba(0,0,0,.13);}
.ods-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.15);opacity:1;filter:none;}
.ods-img-wrap{width:100%;aspect-ratio:1/1;overflow:hidden;}
.ods-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s;}
.ods-card:hover .ods-img-wrap img{transform:scale(1.04);}
.ods-card-foot{padding:6px 8px 8px;min-height:36px;}
.ods-badge-cnt{font-size:9px;font-weight:700;margin-top:4px;padding:2px 8px;border-radius:99px;display:inline-block;}

/* ── KM list ── */
.km-item{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:6px;cursor:pointer;transition:all .15s;opacity:.5;}
.km-item.ativo{opacity:1;background:var(--branco);box-shadow:0 1px 6px rgba(0,0,0,.07);}
.km-item.ativo:hover{background:var(--cinza-50);}
.km-num{font-family:var(--font-mono);font-size:14px;font-weight:700;min-width:32px;text-align:center;padding:4px 0;}
.km-body{flex:1;}
.km-titulo{font-size:12px;font-weight:600;color:var(--cinza-900);margin-bottom:3px;}
.km-resumo{font-size:11px;color:var(--cinza-600);line-height:1.4;}
.km-inds{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}

/* ── Tabs dentro do modal ── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--borda);margin-bottom:14px;overflow-x:auto;}
.tab-btn{padding:7px 14px;font-size:12px;font-weight:500;color:var(--cinza-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font-sans);white-space:nowrap;}
.tab-btn.ativo{color:var(--verde-medio);border-bottom-color:var(--verde-medio);}
.tab-content{display:none;}
.tab-content.ativo{display:block;}

/* ── Contribuição item ── */
.contrib-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:6px;background:var(--branco);}
.contrib-status{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;}
.cs-pend{background:#FEF3C7;color:#92400E}
.cs-conf{background:#D1FAE5;color:#065F46}
.cs-rej{background:#FEE2E2;color:#991B1B}

/* ── ODS/KM seletores no formulário ── */
.fi-ods-sel{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio);min-height:44px;}
.fi-ods-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 9px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .12s;background:#F3F4F6;color:var(--cinza-500);user-select:none;}
.fi-ods-chip:hover{filter:brightness(.94);}
.fi-ods-chip.sel{border-color:currentColor;}
.fi-km-sel{display:flex;flex-direction:column;gap:3px;padding:8px;background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio);max-height:220px;overflow-y:auto;}
.fi-km-chip{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:all .12s;background:var(--branco);user-select:none;}
.fi-km-chip:hover{background:#EDE9FE33;}
.fi-km-chip.sel{background:#EDE9FE;border-color:#7C3AED;}
.fi-km-chip-num{font-family:var(--font-mono);font-size:11px;font-weight:700;min-width:22px;color:#5B21B6;margin-top:1px;}
.fi-km-chip-txt{font-size:11px;color:var(--cinza-700);line-height:1.35;}
</style>

// ── Carregar dados ────────────────────────────────────────────
async function carregar(){
  try{
    const [
      {data:itens,  error:eItens},
      {data:prog,   error:eProg},
      {data:ods,    error:eOds},
      {data:km,     error:eKm}
    ] = await Promise.all([
      db.from('matriz_itens').select('*').eq('ativo',true).order('ordem'),
      db.from('vw_matriz_progresso').select('*'),
      db.from('ods_refs').select('*'),        // ordenação feita no cliente
      db.from('metas_km_refs').select('*')    // ordenação feita no cliente
    ]);

    if(eItens) console.warn('[matriz] matriz_itens:', eItens.message);
    if(eProg)  console.warn('[matriz] vw_matriz_progresso:', eProg.message);
    if(eOds)   console.warn('[matriz] ods_refs:', eOds.message);
    if(eKm)    console.warn('[matriz] metas_km_refs:', eKm.message);

    matrizItens = itens||[];
    progresso   = prog||[];
    odsRefs     = ods||[];
    kmRefs      = km||[];

    renderStats();
    renderMatriz();
    renderODS();
    renderKM();
  }catch(e){
    console.error('[matriz] erro geral:', e);
    document.getElementById('conteudo-matriz').innerHTML=
      `<div class="empty-state"><div class="empty-state-msg">Erro ao carregar dados. Verifique se o SQL de migração foi executado no Supabase.</div></div>`;
  }
}

// ── Helpers ───────────────────────────────────────────────────
function getProgresso(id){
  return progresso.find(p=>p.id===id)||{realizado_confirmado:0,realizado_pendente:0,realizado_total:0,pct_confirmado:0};
}

function calcPct(item){
  const p=getProgresso(item.id);
  const meta=parseFloat(item.meta_numerica||0);
  if(!meta)return{conf:0,pend:0,total:0};
  const conf=Math.min(parseFloat(p.realizado_confirmado||0)/meta*100,100);
  const pend=Math.min(parseFloat(p.realizado_pendente||0)/meta*100,100);
  return{conf:Math.round(conf),pend:Math.round(Math.min(conf+pend,100)-conf),total:Math.round(Math.min(conf+pend,100))};
}

function classeRisco(item){
  const meta=parseFloat(item.meta_numerica||0);
  if(!meta)return'risco-sem';
  const{conf}=calcPct(item);
  if(conf>=100)return'risco-ok';
  if(conf>=40)return'risco-med';
  return'risco-alto';
}

function badgeConf(item){
  const meta=parseFloat(item.meta_numerica||0);
  if(!meta)return`<span class="conf-badge cb-sem">Sem meta</span>`;
  const{conf}=calcPct(item);
  if(conf>=100)return`<span class="conf-badge cb-ok">✓ Atingida</span>`;
  if(conf>=70)return`<span class="conf-badge cb-ok">Em dia</span>`;
  if(conf>=40)return`<span class="conf-badge cb-med">⚠ Atenção</span>`;
  return`<span class="conf-badge cb-alto">🔴 Risco</span>`;
}

function corPct(pct){
  if(pct>=100)return'#059669';
  if(pct>=70)return'#059669';
  if(pct>=40)return'#D97706';
  return'#DC2626';
}

      <div class="stat-sub">100% confirmado</div>
    </div>
    <div class="stat-card sc-t${ativo('progresso')}" onclick="clicarCardMatriz('progresso')">

      <div class="stat-val">${media}%</div>
      <div class="stat-sub">confirmado</div>
    </div>
    <div class="stat-card sc-a${ativo('risco')}" onclick="clicarCardMatriz('risco')">

function renderMatriz(){
  const busca=(document.getElementById('busca-ind')?.value||'').toLowerCase();
  const el=document.getElementById('conteudo-matriz');
  if(!matrizItens.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-state-msg">Nenhum indicador cadastrado. Execute o SQL de migração 04 no Supabase.</div></div>`;
    return;
  }

  const res=[1,2,3];
  const nomes={
    1:'Fortalecimento do uso sustentável dos recursos naturais e da sociobiodiversidade',
    2:'Mitigação da vulnerabilidade ambiental e aumento da resiliência das APAs',
    3:'Fortalecimento da governança e equidade de gênero'
  };
  const coresRes={1:'#1D9E75',2:'#2563EB',3:'#7F77DD'};

  el.innerHTML=res.map(r=>{
    let itensR=matrizItens.filter(i=>i.resultado===r);
    if(busca) itensR=itensR.filter(i=>(i.indicador||'').toLowerCase().includes(busca)||(i.produto_titulo||'').toLowerCase().includes(busca)||(i.produto_codigo||'').toLowerCase().includes(busca));
    if(filtroMatrizCard==='atingidos') itensR=itensR.filter(i=>calcPct(i).conf>=100);
    if(filtroMatrizCard==='risco') itensR=itensR.filter(i=>parseFloat(i.meta_numerica||0)>0&&calcPct(i).conf<40);
    if(filtroMatrizCard==='pendente') itensR=itensR.filter(i=>parseFloat(getProgresso(i.id).realizado_pendente||0)>0);
    if(!itensR.length&&(busca||filtroMatrizCard))return'';

    // Agrupar por produto_codigo
    const produtos=[...new Set(itensR.map(i=>i.produto_codigo))].sort();

    // Progresso geral do resultado
    const comMeta=itensR.filter(i=>parseFloat(i.meta_numerica||0)>0);
    const mediaR=comMeta.length?Math.round(comMeta.reduce((s,i)=>s+calcPct(i).conf,0)/comMeta.length):0;

    const corR=coresRes[r];

    return`<div class="resultado-bloco">
      <div class="resultado-header" onclick="toggleResultado('rb-${r}','icon-${r}')">
        <span class="resultado-codigo rc-${r}">R${r}</span>
        <span class="resultado-nome-txt">${nomes[r]}</span>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <div style="width:80px;height:5px;background:var(--cinza-200);border-radius:3px;overflow:hidden">
            <div style="height:100%;background:${corR};width:${mediaR}%;border-radius:3px;transition:width .5s"></div>
          </div>
          <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:${corR}">${mediaR}%</span>
          <span style="font-size:11px;color:var(--cinza-400)">${itensR.length} ind.</span>
          <span id="icon-${r}" style="font-size:12px;color:var(--cinza-400);transition:transform .2s">▾</span>
        </div>
      </div>
      <div id="rb-${r}">
        ${produtos.map(cod=>{
          const itensP=itensR.filter(i=>i.produto_codigo===cod);
          const titulo=itensP[0]?.produto_titulo||cod;
          const comMetaP=itensP.filter(i=>parseFloat(i.meta_numerica||0)>0);
          const mediaP=comMetaP.length?Math.round(comMetaP.reduce((s,i)=>s+calcPct(i).conf,0)/comMetaP.length):0;
          const hasPend=itensP.some(i=>parseFloat(getProgresso(i.id).realizado_pendente||0)>0);

          return`<div class="produto-group">
            <div class="produto-label" onclick="toggleProduto('pg-${r}-${cod.replace('.','-')}','pig-${r}-${cod.replace('.','-')}')">
              <span class="produto-cod">${cod}</span>
              <span class="produto-titulo-txt">${titulo}</span>
              ${hasPend?`<span class="pend-chip">Aguarda confirmação</span>`:''}
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                <div style="width:60px;height:4px;background:var(--cinza-200);border-radius:2px;overflow:hidden">
                  <div style="height:100%;background:#2563EB;width:${mediaP}%;border-radius:2px"></div>
                </div>
                <span style="font-size:10px;color:var(--cinza-500);font-family:var(--font-mono)">${mediaP}%</span>
                <span id="pig-${r}-${cod.replace('.','-')}" style="font-size:10px;color:var(--cinza-400);transition:transform .2s">▾</span>
              </div>
            </div>
            <div id="pg-${r}-${cod.replace('.','-')}">
              ${itensP.map(i=>renderIndCard(i)).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleResultado(id,iconId){
  const el=document.getElementById(id);
  const ic=document.getElementById(iconId);
  if(!el)return;
  const hidden=el.style.display==='none';
  el.style.display=hidden?'':'none';
  if(ic)ic.style.transform=hidden?'':'rotate(-90deg)';
}
function toggleProduto(id,iconId){
  const el=document.getElementById(id);
  const ic=document.getElementById(iconId);
  if(!el)return;
  const hidden=el.style.display==='none';
  el.style.display=hidden?'':'none';
  if(ic)ic.style.transform=hidden?'':'rotate(-90deg)';
}

function renderIndCard(i){
  const meta=parseFloat(i.meta_numerica||0);
  const{conf,pend}=calcPct(i);
  const temMeta=meta>0;
  const p=getProgresso(i.id);
  const risco=classeRisco(i);

  const ods=(i.ods||[]).slice(0,4).map(o=>`<span class="ods-chip">ODS${o}</span>`).join('');
  const km=(i.metas_km||[]).slice(0,3).map(k=>`<span class="km-chip">KM${k}</span>`).join('');
  const hasPend=parseFloat(p.realizado_pendente||0)>0;

  return`<div class="ind-card ${risco}" onclick="abrirIndicador('${i.id}')">
    <div class="ind-header">
      <span class="ind-num">${i.produto_codigo}.${(i.ods||[''])[0]||'?'}</span>
      <div style="flex:1;min-width:0">
        <div class="ind-nome">${(i.indicador||'').substring(0,110)}${(i.indicador||'').length>110?'…':''}</div>
        <div style="font-size:10px;color:var(--cinza-400);margin-top:2px">Meta: ${i.meta_descricao||'—'}</div>
      </div>
      <div class="ind-badges" style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px">
        ${badgeConf(i)}
        ${hasPend?`<span class="pend-chip">⏳ Pend.</span>`:''}
        <div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end">${ods}${km}</div>
      </div>
    </div>
    ${temMeta?`<div class="ind-prog">
      <div class="prog-bar-wrap">
        <div class="prog-fill-conf" style="width:${conf}%"></div>
        <div class="prog-fill-pend" style="width:${pend}%;left:${conf}%"></div>
      </div>
      <div class="ind-prog-nums">
        ${parseFloat(p.realizado_confirmado||0).toLocaleString('pt-BR')} / ${meta.toLocaleString('pt-BR')} ${i.unidade||''}
      </div>
      <div class="ind-pct" style="color:${corPct(conf)}">${conf}%</div>
    </div>`:`<div style="margin-top:6px;font-size:10px;color:var(--cinza-400)">Meta qualitativa — sem valor numérico</div>`}
  </div>`;
}

// Fallback quando imagem local não carrega
function odsImgFalhou(img, num, cor){
  img.onerror=null;
  var wrap=img.parentNode;
  var d=document.createElement('div');
  d.style.cssText='width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:'+cor;
  d.innerHTML='<span style="font-size:30px;font-weight:800;color:#fff;font-family:sans-serif">'+num+'</span>';
  wrap.innerHTML='';
  wrap.appendChild(d);
}

// Retorna o título da ODS no idioma ativo
function odsTitulo(o){
  const lang=appState.idioma||'pt';
  if(lang==='en'&&o.titulo_en) return o.titulo_en;
  if(lang==='es'&&o.titulo_es) return o.titulo_es;
  return o.titulo; // fallback PT
}

  const el=document.getElementById('ods-grid');

  el.innerHTML=sorted.map(o=>{

    const localUrl=`../assets/sdg/sdg-${num}.jpg`;

      style="${borderStyle}"
      onclick="abrirRefODS('${o.numero}')">

// ── KM ────────────────────────────────────────────────────────
function renderKM(){
  const el=document.getElementById('km-lista');
  if(!kmRefs.length){el.innerHTML='<div style="color:var(--cinza-400);font-size:12px">Execute o SQL de migração.</div>';return;}

  el.innerHTML=kmRefs.map(k=>{
    const inds=matrizItens.filter(i=>(i.metas_km||[]).includes(k.numero));
    const{conf}=inds.reduce((acc,i)=>{const p=calcPct(i);return{conf:acc.conf+p.conf};},{conf:0});
    const mediaKM=inds.filter(i=>parseFloat(i.meta_numerica||0)>0).length
      ?Math.round(conf/(inds.filter(i=>parseFloat(i.meta_numerica||0)>0).length)):0;

    return`<div class="km-item${k.no_projeto?' ativo':''}" onclick="abrirRefKM('${k.numero}')">
      <div class="km-num" style="color:${k.no_projeto?'#5B21B6':'var(--cinza-300)'}">
        <div style="font-size:16px;font-weight:700">${k.numero}</div>
        ${k.no_projeto?`<div style="font-size:8px;font-weight:700;background:#EDE9FE;color:#5B21B6;padding:1px 5px;border-radius:3px;margin-top:2px;text-align:center">✓</div>`:''}
      </div>
      <div class="km-body">
        <div class="km-titulo">${k.titulo}</div>
        <div class="km-resumo">${(k.resumo||'').substring(0,120)}${(k.resumo||'').length>120?'…':''}</div>
        ${k.no_projeto&&inds.length?`<div class="km-inds">
          ${inds.slice(0,4).map(i=>`<span style="font-size:9px;background:var(--cinza-100);color:var(--cinza-600);padding:1px 6px;border-radius:3px">${i.produto_codigo}</span>`).join('')}
          ${inds.length>4?`<span style="font-size:9px;color:var(--cinza-400)">+${inds.length-4}</span>`:''}
          ${parseFloat(mediaKM)>0?`<span style="margin-left:auto;font-size:9px;font-weight:700;color:${corPct(mediaKM)}">${mediaKM}%</span>`:''}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

          <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--cinza-100);padding:1px 6px;border-radius:3px;flex-shrink:0">${i.produto_codigo}</span>
          <span style="flex:1;font-size:12px;color:var(--cinza-800)">${(i.indicador||'').substring(0,75)}${(i.indicador||'').length>75?'…':''}</span>
          ${temMeta?`<span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:${corPct(conf)};flex-shrink:0">${conf}%</span>`:''}
        </div>
        ${temMeta?`
        <div style="height:5px;background:var(--cinza-100);border-radius:3px;overflow:hidden;position:relative;margin-bottom:4px">
          <div style="position:absolute;height:100%;background:#059669;width:${conf}%;border-radius:3px"></div>
          <div style="position:absolute;height:100%;background:#FCD34D;width:${pend}%;left:${conf}%;border-radius:3px"></div>
        </div>
        <div style="font-size:10px;color:var(--cinza-500);display:flex;gap:10px">
          ${realConf>0?`<span style="color:#059669">✓ ${realConf.toLocaleString('pt-BR')} conf.</span>`:''}
          ${realPend>0?`<span style="color:#D97706">⏳ ${realPend.toLocaleString('pt-BR')} pend.</span>`:''}
          <span style="margin-left:auto">Meta: <strong>${meta.toLocaleString('pt-BR')} ${i.unidade||''}</strong></span>
        </div>`:''}
      </div>`;
    }).join('')}`:`<div style="text-align:center;padding:16px;color:var(--cinza-400);font-size:12px">Nenhum indicador diretamente vinculado.</div>`}`;
  document.getElementById('modal-ref').style.display='flex';
}

// ── MODAL INDICADOR ───────────────────────────────────────────
async function abrirIndicador(id){
  indAtual=matrizItens.find(i=>i.id===id);
  if(!indAtual)return;
  const i=indAtual;
  const meta=parseFloat(i.meta_numerica||0);
  const{conf,pend}=calcPct(i);
  const p=getProgresso(id);
  const temMeta=meta>0;

  document.getElementById('mi-titulo').textContent=`${i.produto_codigo} · Indicador`;
  document.getElementById('mi-sub').textContent=`Resultado ${i.resultado} → Produto ${i.produto_codigo} · ${i.unidade||'qualitativo'}`;

  // Carregar contribuições
  const{data:contribs}=await db.from('produto_matriz_contribuicao')
    .select('*,contratos_produtos_entregas(numero_entrega,dt_entrega,situacao,tipo_documento)')
    .eq('matriz_item_id',id)
    .order('criado_em',{ascending:false})
    .limit(30);

  const pendentes=(contribs||[]).filter(c=>c.status==='pendente');
  const podeAprovar=PODE.aprovarProduto();

  document.getElementById('mi-body').innerHTML=`
    <!-- Progresso visual -->
    <div style="background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:14px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:600;color:var(--cinza-900);margin-bottom:8px;line-height:1.4">${i.indicador||'—'}</div>
      ${temMeta?`
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="height:10px;background:var(--cinza-100);border-radius:5px;overflow:hidden;position:relative">
            <div style="position:absolute;height:100%;background:#059669;width:${conf}%;border-radius:5px"></div>
            <div style="position:absolute;height:100%;background:#FCD34D;width:${pend}%;left:${conf}%;border-radius:5px"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--cinza-500);margin-top:4px">
            <span>Confirmado: <strong>${parseFloat(p.realizado_confirmado||0).toLocaleString('pt-BR')} ${i.unidade||''}</strong></span>
            ${parseFloat(p.realizado_pendente||0)>0?`<span style="color:#D97706">Pendente: +${parseFloat(p.realizado_pendente||0).toLocaleString('pt-BR')}</span>`:''}
            <span>Meta: <strong>${meta.toLocaleString('pt-BR')} ${i.unidade||''}</strong></span>
          </div>
        </div>
        <div style="text-align:center;min-width:60px">
          <div style="font-size:28px;font-weight:700;font-family:var(--font-mono);color:${corPct(conf)};line-height:1">${conf}%</div>
          <div style="font-size:9px;color:var(--cinza-400);margin-top:2px">confirmado</div>
        </div>
      </div>`:`<div style="font-size:11px;color:var(--cinza-500);background:#FFF;border:1px solid var(--borda);border-radius:var(--raio);padding:8px 12px">Indicador qualitativo — progresso acompanhado por registros</div>`}
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        ${(i.ods||[]).map(o=>{const r=odsRefs.find(x=>x.numero===o);return`<span class="ods-chip" style="background:${r?.cor||'#2563EB'}22;color:${r?.cor||'#2563EB'}" title="${r?.titulo||''}">${r?.emoji||''} ODS ${o}</span>`;}).join('')}
        ${(i.metas_km||[]).map(k=>`<span class="km-chip">KM ${k}</span>`).join('')}
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn ativo" onclick="abaModal('det',this)">Detalhes</button>
      <button class="tab-btn" onclick="abaModal('contrib',this)">Contribuições (${(contribs||[]).length})</button>
      ${pendentes.length&&podeAprovar?`<button class="tab-btn" style="color:#D97706" onclick="abaModal('aprovar',this)">⏳ Confirmar (${pendentes.length})</button>`:''}
    </div>

    <!-- DETALHES -->
    <div class="tab-content ativo" id="mtab-det">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          ${[
            ['Resultado',`R${i.resultado}`],
            ['Produto',`${i.produto_codigo} — ${i.produto_titulo}`],
            ['Meta',i.meta_descricao],
            ['Meta numérica',temMeta?`${meta.toLocaleString('pt-BR')} ${i.unidade||''}`:null],
          ].filter(([,v])=>v).map(([l,v])=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--borda)">
            <span style="color:var(--cinza-500)">${l}</span>
            <span style="font-weight:500;color:var(--cinza-900);text-align:right;max-width:200px">${v}</span>
          </div>`).join('')}
        </div>
        <div>
          ${i.meios_verificacao?`<div style="font-size:11px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Meios de Verificação</div>
          <div style="font-size:12px;color:var(--cinza-700);line-height:1.5;background:var(--cinza-50);padding:8px 10px;border-radius:var(--raio);border:1px solid var(--borda)">${i.meios_verificacao}</div>`:''}
          ${i.hipoteses_riscos?`<div style="margin-top:10px;font-size:11px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Hipóteses / Riscos</div>
          <div style="font-size:12px;color:var(--cinza-700);line-height:1.5;background:var(--cinza-50);padding:8px 10px;border-radius:var(--raio);border:1px solid var(--borda)">${i.hipoteses_riscos}</div>`:''}
        </div>
      </div>
    </div>

    <!-- CONTRIBUIÇÕES -->
    <div class="tab-content" id="mtab-contrib">
      ${(contribs||[]).length?`
        <div style="font-size:11px;color:var(--cinza-500);margin-bottom:10px">
          Total confirmado: <strong>${parseFloat(p.realizado_confirmado||0).toLocaleString('pt-BR')} ${i.unidade||''}</strong>
          ${parseFloat(p.realizado_pendente||0)>0?` · Pendente: <strong style="color:#D97706">${parseFloat(p.realizado_pendente||0).toLocaleString('pt-BR')}</strong>`:''}
        </div>
        ${(contribs||[]).map(c=>{
          const ent=c.contratos_produtos_entregas;
          const nomeProduto='Entrega '+(ent?.numero_entrega||'—')+(ent?.dt_entrega?' · '+new Date(ent.dt_entrega+'T12:00').toLocaleDateString('pt-BR'):'');
          const statusMap={pendente:'Pendente',confirmado:'Confirmado',rejeitado:'Rejeitado'};
          const cssMap={pendente:'cs-pend',confirmado:'cs-conf',rejeitado:'cs-rej'};
          return`<div class="contrib-item">
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;color:var(--cinza-900)">${nomeProduto.substring(0,60)}</div>
              <div style="font-size:10px;color:var(--cinza-500);margin-top:1px">${c.observacao||''}</div>
            </div>
            <div style="font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--cinza-900)">${parseFloat(c.valor||0).toLocaleString('pt-BR')} <span style="font-size:10px;font-weight:400;color:var(--cinza-400)">${c.unidade||i.unidade||''}</span></div>
            <span class="contrib-status ${cssMap[c.status]||'cs-pend'}">${statusMap[c.status]||c.status}</span>
            ${c.status==='pendente'&&podeAprovar?`
            <div style="display:flex;gap:4px">
              <button class="btn btn-sm" style="background:#D1FAE5;color:#065F46;border:none;padding:3px 8px;font-size:11px" onclick="confirmarContrib('${c.id}','confirmado')">✓</button>
              <button class="btn btn-sm" style="background:#FEE2E2;color:#991B1B;border:none;padding:3px 8px;font-size:11px" onclick="confirmarContrib('${c.id}','rejeitado')">✕</button>
            </div>`:''}
          </div>`;
        }).join('')}`:`<div class="empty-state"><div class="empty-state-msg">Nenhuma contribuição registrada ainda.</div></div>`}
    </div>

    <!-- APROVAR (somente para pending + podeAprovar) -->
    ${pendentes.length&&podeAprovar?`
    <div class="tab-content" id="mtab-aprovar">
      <div style="background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--raio);padding:10px 12px;margin-bottom:12px;font-size:12px;color:#92400E">
        ⏳ <strong>${pendentes.length} contribuição(ões)</strong> aguardam confirmação técnica para contabilizar no progresso.
      </div>
      ${pendentes.map(c=>{
        const ent=c.contratos_produtos_entregas;
        const nomeProduto=ent?.descricao||('Entrega '+(ent?.numero_entrega||''));
        return`<div class="contrib-item" style="border-color:#FCD34D;background:#FFFBEB">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:500;color:var(--cinza-900)">${nomeProduto.substring(0,60)}</div>
            <div style="font-size:10px;color:var(--cinza-500)">${c.observacao||''}</div>
          </div>
          <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:#92400E">${parseFloat(c.valor||0).toLocaleString('pt-BR')} ${c.unidade||i.unidade||''}</div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm" style="background:#059669;color:#fff;border:none;padding:4px 12px;font-size:11px;border-radius:6px" onclick="confirmarContrib('${c.id}','confirmado')">✓ Confirmar</button>
            <button class="btn btn-sm" style="background:#DC2626;color:#fff;border:none;padding:4px 12px;font-size:11px;border-radius:6px" onclick="confirmarContrib('${c.id}','rejeitado')">✕ Rejeitar</button>
          </div>
        </div>`;
      }).join('')}
    </div>`:''}
  `;

  document.getElementById('mi-footer').innerHTML=`
    <div style="display:flex;gap:8px;justify-content:flex-end">
      ${PODE.editarAtividade()||PODE.aprovarProduto()?`<button class="btn btn-secondary" onclick="abrirEditarInd('${id}')">✎ Editar indicador</button>`:''}
      <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>`;

  document.getElementById('modal-ind').style.display='flex';
}

function fecharModal(){
  document.getElementById('modal-ind').style.display='none';
}

function abaModal(id,btn){
  document.querySelectorAll('#mi-body .tab-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  document.querySelectorAll('#mi-body .tab-content').forEach(c=>c.classList.remove('ativo'));
  const el=document.getElementById('mtab-'+id);
  if(el)el.classList.add('ativo');
}

// ── Confirmar contribuição ────────────────────────────────────
async function confirmarContrib(contribId, novoStatus){
  const{error}=await db.from('produto_matriz_contribuicao')
    .update({
      status:novoStatus,
      confirmado_por:appState.usuario.id,
      confirmado_em:new Date().toISOString()
    })
    .eq('id',contribId);

  if(error){toast('Erro ao atualizar contribuição.','error');return;}
  toast(novoStatus==='confirmado'?'Contribuição confirmada!':'Contribuição rejeitada.', novoStatus==='confirmado'?'success':'info');

  // Recarregar progresso e reabrir modal
  const{data:prog}=await db.from('vw_matriz_progresso').select('*');
  progresso=prog||[];
  renderStats();
  renderMatriz();
  if(indAtual)await abrirIndicador(indAtual.id);
}

// ── Editar/Criar indicador ────────────────────────────────────
function abrirModalNovoInd(){
  indAtual=null;
  abrirFormInd(null);
}
function abrirEditarInd(id){
  const i=matrizItens.find(x=>x.id===id);
  fecharModal();
  setTimeout(()=>abrirFormInd(i),150);
}

function abrirFormInd(i){
  const titulo=i?'Editar Indicador':'Novo Indicador';
  document.getElementById('mi-titulo').textContent=titulo;
  document.getElementById('mi-sub').textContent=i?`${i.produto_codigo} — ${i.produto_titulo}`:'Preencha os campos abaixo';
  document.getElementById('mi-body').innerHTML=`
    <div class="grid-2" style="gap:12px">
      <div class="form-group">
        <label class="form-label">Resultado *</label>
        <select class="form-control" id="fi-resultado" style="height:36px">
          <option value="1" ${i?.resultado===1?'selected':''}>1 — Uso sustentável</option>
          <option value="2" ${i?.resultado===2?'selected':''}>2 — Mitigação ambiental</option>
          <option value="3" ${i?.resultado===3?'selected':''}>3 — Governança e gênero</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Código Produto *</label>
        <input class="form-control" id="fi-produto-cod" placeholder="ex: 1.1" value="${i?.produto_codigo||''}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Título do Produto *</label>
      <input class="form-control" id="fi-produto-titulo" placeholder="ex: Desenvolvimento de Produtos Sustentáveis" value="${i?.produto_titulo||''}">
    </div>
    <div class="form-group">
      <label class="form-label">Indicador *</label>
      <textarea class="form-control" id="fi-indicador" rows="2" placeholder="Descreva o indicador...">${i?.indicador||''}</textarea>
    </div>
    <div class="grid-2" style="gap:12px">
      <div class="form-group">
        <label class="form-label">Meta (descrição)</label>
        <input class="form-control" id="fi-meta-desc" placeholder="ex: 200 unidades produtivas" value="${i?.meta_descricao||''}">
      </div>
      <div class="form-group">
        <label class="form-label">Meta numérica</label>
        <input class="form-control" type="number" id="fi-meta-num" step="0.01" placeholder="200" value="${i?.meta_numerica||''}">
      </div>
    </div>
    <div class="grid-2" style="gap:12px">
      <div class="form-group">
        <label class="form-label">Unidade de medida</label>
        <input class="form-control" id="fi-unidade" placeholder="ex: pessoas, hectares" value="${i?.unidade||''}">
      </div>
      <div class="form-group">
        <label class="form-label">Ordem</label>
        <input class="form-control" type="number" id="fi-ordem" value="${i?.ordem||0}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ODS vinculados <span style="font-size:10px;color:var(--cinza-400);font-weight:400">(selecione quantos forem necessários)</span></label>
      <div class="fi-ods-sel" id="fi-ods-grid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Metas Kunming-Montreal <span style="font-size:10px;color:var(--cinza-400);font-weight:400">(selecione quantas forem necessárias)</span></label>
      <div class="fi-km-sel" id="fi-km-grid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Meios de Verificação</label>
      <textarea class="form-control" id="fi-meios" rows="2" placeholder="Como será medido...">${i?.meios_verificacao||''}</textarea>
    </div>
  `;
  document.getElementById('mi-footer').innerHTML=`
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarIndicador('${i?.id||''}')">💾 Salvar</button>
    </div>`;
  renderOdsSel(i?.ods||[]);
  renderKmSel(i?.metas_km||[]);
  document.getElementById('modal-ind').style.display='flex';

function renderOdsSel(selecionados){
  const cont=document.getElementById('fi-ods-grid');
  if(!cont)return;
  const sel=new Set((selecionados||[]).map(String));
  const sorted=[...odsRefs].sort((a,b)=>parseInt(a.numero,10)-parseInt(b.numero,10));
  if(!sorted.length){cont.innerHTML='<span style="font-size:11px;color:var(--cinza-400)">Carregando ODS…</span>';return;}
  cont.innerHTML=sorted.map(o=>{
    const isSel=sel.has(String(o.numero));
    const cor=o.cor||'#2563EB';
    const st=isSel?`background:${cor}22;color:${cor};border-color:${cor}`:'';
    return `<label class="fi-ods-chip${isSel?' sel':''}" style="${st}" title="${o.titulo||''}">
      <input type="checkbox" value="${o.numero}" ${isSel?'checked':''} style="display:none" onchange="toggleOdsSel(this)">
      ${o.emoji||''} ODS ${o.numero}
    </label>`;
  }).join('');
}

function toggleOdsSel(cb){
  const label=cb.closest('.fi-ods-chip');
  const o=odsRefs.find(x=>String(x.numero)===String(cb.value));
  const cor=o?.cor||'#2563EB';
  if(cb.checked){
    label.classList.add('sel');
    label.style.cssText=`background:${cor}22;color:${cor};border-color:${cor}`;
  }else{
    label.classList.remove('sel');
    label.style.cssText='';
  }
}

function renderKmSel(selecionados){
  const cont=document.getElementById('fi-km-grid');
  if(!cont)return;
  const sel=new Set((selecionados||[]).map(String));
  const sorted=[...kmRefs].sort((a,b)=>parseInt(a.numero,10)-parseInt(b.numero,10));
  if(!sorted.length){cont.innerHTML='<span style="font-size:11px;color:var(--cinza-400)">Carregando metas KM…</span>';return;}
  cont.innerHTML=sorted.map(k=>{
    const isSel=sel.has(String(k.numero));
    return `<label class="fi-km-chip${isSel?' sel':''}">
      <input type="checkbox" value="${k.numero}" ${isSel?'checked':''} style="display:none" onchange="toggleKmSel(this)">
      <span class="fi-km-chip-num">${k.numero}</span>
      <span class="fi-km-chip-txt">${k.titulo||k.resumo||''}</span>
    </label>`;
  }).join('');
}

function toggleKmSel(cb){
  cb.closest('.fi-km-chip').classList.toggle('sel',cb.checked);
}

async function salvarIndicador(id){
  const payload={
    resultado:parseInt(document.getElementById('fi-resultado').value)||1,
    produto_codigo:(document.getElementById('fi-produto-cod').value||'').trim(),
    produto_titulo:(document.getElementById('fi-produto-titulo').value||'').trim(),
    indicador:(document.getElementById('fi-indicador').value||'').trim(),
    meta_descricao:(document.getElementById('fi-meta-desc').value||'').trim(),
    meta_numerica:parseFloat(document.getElementById('fi-meta-num').value)||null,
    unidade:(document.getElementById('fi-unidade').value||'').trim()||null,
    ordem:parseInt(document.getElementById('fi-ordem').value)||0,
    ods:[...document.querySelectorAll('#fi-ods-grid input:checked')].map(x=>x.value),
    metas_km:[...document.querySelectorAll('#fi-km-grid input:checked')].map(x=>x.value),
    meios_verificacao:(document.getElementById('fi-meios').value||'').trim()||null,
    atualizado_em:new Date().toISOString()
  };

  if(!payload.indicador||!payload.produto_codigo||!payload.produto_titulo){
    toast('Preencha os campos obrigatórios.','warning');return;
  }

  let error;
  if(id){
    ({error}=await db.from('matriz_itens').update(payload).eq('id',id));
  }else{
    ({error}=await db.from('matriz_itens').insert(payload));
  }
  if(error){toast('Erro ao salvar: '+error.message,'error');return;}
  toast(id?'Indicador atualizado!':'Indicador criado!','success');
  fecharModal();
  await carregar();
}

// ── Exportar CSV ──────────────────────────────────────────────
function exportarCSV(){
  const rows=[['Resultado','Produto','Indicador','Meta','Meta Numérica','Unidade','Confirmado','% Confirmado','ODS','KM','Meios de Verificação']];
  matrizItens.forEach(i=>{
    const p=getProgresso(i.id);
    const meta=parseFloat(i.meta_numerica||0);
    const conf=parseFloat(p.realizado_confirmado||0);
    const pct=meta>0?Math.round(conf/meta*100):0;
    rows.push([
      `R${i.resultado}`,i.produto_codigo,i.indicador,
      i.meta_descricao,i.meta_numerica||'',i.unidade||'',
      conf,pct+'%',
      (i.ods||[]).join(';'),(i.metas_km||[]).join(';'),
      (i.meios_verificacao||'').replace(/[\n\r,]/g,' ')
    ]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='matriz_resultados_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

document.getElementById('modal-ref').addEventListener('click',e=>{if(e.target===document.getElementById('modal-ref'))document.getElementById('modal-ref').style.display='none';});
