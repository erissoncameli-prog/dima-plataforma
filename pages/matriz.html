<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Matriz de Resultados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<link href="../css/sidebar.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes da Matriz -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/matriz.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="empty-state" role="status"><div class="spinner"></div><div class="empty-state-msg">Carregando Matriz de Resultados…</div></div></div>

<!-- Janelas fora do #app; .mz-ov = escopo do tema (css/matriz.css). <i data-ic> vira ícone SVG. -->
<div class="modal-overlay mz-ov" id="modal-ind" role="dialog" aria-modal="true" aria-labelledby="mi-titulo">
  <div class="modal" style="max-width:740px">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div class="modal-sub" id="mi-sub"></div>
        <div class="modal-title" id="mi-titulo">Indicador</div>
      </div>
      <button type="button" class="modal-close" onclick="mzFechar('modal-ind')" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="mi-body"></div>
    <div class="modal-footer" id="mi-footer"></div>
  </div>
</div>

<div class="modal-overlay mz-ov" id="modal-ref" role="dialog" aria-modal="true" aria-labelledby="mr-titulo">
  <div class="modal" style="max-width:580px">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div class="modal-sub" id="mr-sub"></div>
        <div class="modal-title" id="mr-titulo">Referência</div>
      </div>
      <button type="button" class="modal-close" onclick="mzFechar('modal-ref')" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="mr-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/diag-tema.js"></script>
<script>
// ── Dados globais ─────────────────────────────────────────────
let matrizItens = [], progresso = [], odsRefs = [], kmRefs = [], resultadosRef = [], pendPorItem = {};
let indAtual = null;
let filtroSit = '', abaAtual = 'matriz';
const resFechados = new Set();

// ── Ícones (SVG, sem emoji) ───────────────────────────────────
const MZ_IC = {
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  alerta:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  alvo:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  grafico:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  relogio:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  busca:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  mais:'<path d="M12 5v14M5 12h14"/>',
  baixar:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  lapis:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  globo:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  folha:'<path d="M5 21c0-9 5-15 15-16-1 10-7 15-15 16z"/><path d="M5 21 14 12"/>',
  salvar:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  lua:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
function mzIc(n, cls) { return '<svg class="mz-ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (MZ_IC[n] || '') + '</svg>'; }
document.querySelectorAll('i[data-ic]').forEach(e => { e.outerHTML = mzIc(e.dataset.ic); });

// Situação do indicador (sem prazo por indicador, não há "atrasado": nada fica vermelho)
const SIT = {
  ating: { rot:'Atingida',      cor:'--mz-ating', pill:'mz-p-ok', ic:'check' },
  and:   { rot:'Em andamento',  cor:'--mz-and',   pill:'mz-p-in', ic:'grafico' },
  sem:   { rot:'Sem registro',  cor:'--mz-sem',   pill:'mz-p-ne', ic:'relogio' },
  qual:  { rot:'Qualitativa',   cor:'--mz-qual',  pill:'mz-p-ia', ic:'info' },
};
const COR_RES = { 1:'--mz-r1', 2:'--mz-r2', 3:'--mz-r3' };
const ODS_COR = {1:'#E5243B',2:'#DDA63A',3:'#4C9F38',4:'#C5192D',5:'#FF3A21',6:'#26BDE2',7:'#FCC30B',8:'#A21942',9:'#FD6925',10:'#DD1367',11:'#FD9D24',12:'#BF8B2E',13:'#3F7E44',14:'#0A97D9',15:'#56C02B',16:'#00689D',17:'#19486A'};
const num = v => parseFloat(v || 0);
const fmtN = v => num(v).toLocaleString('pt-BR');

(async () => {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }
  const podeEditar = PODE.editarAtividade() || PODE.aprovarProduto();

  document.getElementById('app').innerHTML =
    gerarLayout('Matriz de Resultados', 'matriz') + `
    <div class="fade-in mz-pagina">
      <div class="mz-kpis" id="stats-row"></div>
      <div class="mz-tabs" role="tablist" aria-label="Visões da Matriz">
        <button type="button" class="mz-tab" role="tab" data-aba="matriz" aria-selected="true">${mzIc('alvo','p')}Matriz <span class="n" id="n-mz"></span></button>
        <button type="button" class="mz-tab" role="tab" data-aba="ods" aria-selected="false">${mzIc('globo','p')}ODS <span class="n" id="n-ods"></span></button>
        <button type="button" class="mz-tab" role="tab" data-aba="km" aria-selected="false">${mzIc('folha','p')}Kunming-Montreal <span class="n" id="n-km"></span></button>
      </div>

      <div class="mz-painel" id="tc-matriz" role="tabpanel">
        <div class="mz-filtros" role="group" aria-label="Filtros">
          <label class="mz-busca">${mzIc('busca','p')}<input type="search" id="busca-ind" placeholder="Indicador, produto ou código" aria-label="Buscar indicador" oninput="renderMatriz()"></label>
          <div class="mz-seg" id="seg-sit" role="group" aria-label="Situação"></div>
          <span class="mz-cont" id="cont" aria-live="polite"></span>
          <button type="button" class="mz-btn" onclick="exportarCSV()">${mzIc('baixar','p')}Exportar CSV</button>
          ${podeEditar ? `<button type="button" class="mz-btn pri" onclick="abrirModalNovoInd()">${mzIc('mais','p')}Indicador</button>` : ''}
        </div>
        <div class="mz-leg"><span><i style="background:var(--mz-ating)"></i>Confirmado</span><span><i class="pd"></i>Pendente de confirmação</span><span>Progresso médio com teto de 100% por indicador</span></div>
        <div id="conteudo-matriz" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>

      <div class="mz-painel" id="tc-ods" role="tabpanel" hidden>
        <p class="mz-nota" id="ods-info-txt"></p>
        <div class="mz-odsg" id="ods-grid"></div>
      </div>

      <div class="mz-painel" id="tc-km" role="tabpanel" hidden>
        <p class="mz-nota" id="km-info-txt"></p>
        <div class="mz-kml" id="km-lista"></div>
      </div>
    </div>` + `</div></div></div>`;

  carregarLogosSidebar();
  seletorTema();
  document.querySelector('.mz-tabs').addEventListener('click', ev => {
    const b = ev.target.closest('[data-aba]'); if (b) mudarAba(b.dataset.aba);
  });
  document.getElementById('seg-sit').addEventListener('click', ev => {
    const b = ev.target.closest('[data-sit]'); if (!b) return;
    filtroSit = b.dataset.sit; renderSeg(); renderMatriz();
  });
  await carregar();
})();

// Tema claro/escuro: mesmo 'diag_tema' da mesa do Diagnóstico e das demais guias (componente .dgm-tema)
function seletorTema() {
  const tb = document.querySelector('.topbar'); if (!tb || tb.querySelector('.dgm-tema') || typeof DiagTema === 'undefined') return;
  const d = document.createElement('div');
  d.className = 'dgm-tema'; d.setAttribute('role','group'); d.setAttribute('aria-label','Tema');
  d.innerHTML = [['claro','sol','Claro'],['escuro','lua','Escuro']].map(x =>
    `<button type="button" data-tema="${x[0]}" aria-pressed="${DiagTema.atual()===x[0]}">${mzIc(x[1])}${x[2]}</button>`).join('');
  const bc = tb.querySelector('.topbar-breadcrumb');
  if (bc) bc.parentNode.insertBefore(d, bc); else tb.appendChild(d);
  d.addEventListener('click', ev => {
    const b = ev.target.closest('[data-tema]'); if (!b) return;
    DiagTema.definir(b.dataset.tema);
    d.querySelectorAll('[data-tema]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
}

// ── Carregar dados ────────────────────────────────────────────
async function carregar() {
  try {
    const [rItens, rProg, rOds, rKm, rRes, rPend] = await Promise.all([
      db.from('matriz_itens').select('*').eq('ativo', true).order('ordem'),
      db.from('vw_matriz_progresso').select('*'),
      db.from('ods_refs').select('*'),
      db.from('metas_km_refs').select('*'),
      db.from('resultados').select('codigo,nome_pt,nome_en,nome_es'),
      // pendente que já conta na barra (entrega aprovada) = aguardando confirmação
      db.from('vw_matriz_contribuicoes').select('matriz_item_id').eq('status', 'pendente').eq('entrega_situacao', 'aprovada'),
    ]);
    [['matriz_itens', rItens], ['vw_matriz_progresso', rProg], ['ods_refs', rOds], ['metas_km_refs', rKm], ['resultados', rRes], ['vw_matriz_contribuicoes', rPend]]
      .forEach(([n, r]) => { if (r.error) console.warn('[matriz] ' + n + ':', r.error.message); });

    matrizItens = rItens.data || [];
    progresso = rProg.data || [];
    odsRefs = (rOds.data || []).sort((a, b) => parseInt(a.numero, 10) - parseInt(b.numero, 10));
    kmRefs = (rKm.data || []).sort((a, b) => parseInt(a.numero, 10) - parseInt(b.numero, 10));
    resultadosRef = rRes.data || [];
    pendPorItem = {};
    (rPend.data || []).forEach(c => { pendPorItem[c.matriz_item_id] = (pendPorItem[c.matriz_item_id] || 0) + 1; });
    prepararItens();

    renderStats();
    renderSeg();
    renderMatriz();
    renderODS();
    renderKM();
  } catch (e) {
    console.error('[matriz] erro geral:', e);
    document.getElementById('conteudo-matriz').innerHTML = '<div class="mz-vazio">Erro ao carregar a Matriz. Recarregue a página.</div>';
  }
}

// Código do indicador = produto · posição dentro do produto (pela ordem); título do grupo = o mais comum do produto
let tituloProduto = {};
function prepararItens() {
  const pos = {}, titulos = {};
  matrizItens.forEach(i => {
    pos[i.produto_codigo] = (pos[i.produto_codigo] || 0) + 1;
    i._cod = (i.produto_codigo || '?') + '·' + pos[i.produto_codigo];
    const t = (titulos[i.produto_codigo] = titulos[i.produto_codigo] || {});
    t[i.produto_titulo || ''] = (t[i.produto_titulo || ''] || 0) + 1;
  });
  tituloProduto = {};
  Object.keys(titulos).forEach(cod => {
    tituloProduto[cod] = Object.entries(titulos[cod]).sort((a, b) => b[1] - a[1])[0][0];
  });
}

// ── Helpers ───────────────────────────────────────────────────
function getProgresso(id) {
  return progresso.find(p => p.id === id) || { realizado_confirmado: 0, realizado_pendente: 0 };
}
function calcPct(item) {
  const p = getProgresso(item.id), meta = num(item.meta_numerica);
  if (!meta) return { real: null, conf: 0, pend: 0 };
  const real = Math.round(num(p.realizado_confirmado) / meta * 100);
  const conf = Math.min(real, 100);
  const pend = Math.round(Math.min(num(p.realizado_pendente) / meta * 100, 100 - conf));
  return { real, conf, pend };
}
function sitItem(item) {
  if (!num(item.meta_numerica)) return 'qual';
  const p = getProgresso(item.id);
  if (calcPct(item).real >= 100) return 'ating';
  return (num(p.realizado_confirmado) > 0 || num(p.realizado_pendente) > 0) ? 'and' : 'sem';
}
function mediaConf(itens) {
  const c = itens.filter(i => num(i.meta_numerica) > 0);
  return c.length ? Math.round(c.reduce((s, i) => s + calcPct(i).conf, 0) / c.length) : 0;
}
function pillSit(s) { const S = SIT[s]; return `<span class="mz-pill ${S.pill}">${mzIc(S.ic,'p')}${S.rot}</span>`; }
function nomeResultado(r) {
  const x = resultadosRef.find(z => z.codigo === 'R' + r);
  if (!x) return 'Resultado ' + r;
  const l = appState.idioma || 'pt';
  return (l === 'en' && x.nome_en) || (l === 'es' && x.nome_es) || x.nome_pt || ('Resultado ' + r);
}
function odsRef(n) { return odsRefs.find(o => String(o.numero) === String(n)); }
function odsCor(n) { const o = odsRef(n); return (o && o.cor) || ODS_COR[parseInt(n, 10)] || '#1F4E2C'; }
function odsTitulo(o) {
  const l = appState.idioma || 'pt';
  return (l === 'en' && o.titulo_en) || (l === 'es' && o.titulo_es) || o.titulo || '';
}
const temOds = (i, n) => (i.ods || []).some(x => String(parseInt(x, 10)) === String(parseInt(n, 10)));
const temKm = (i, n) => (i.metas_km || []).some(x => String(x) === String(n));
function chipsRef(i) {
  return (i.ods || []).map(o => `<span class="mz-ods" style="--c:${odsCor(o)}">ODS ${esc(o)}</span>`).join('')
    + (i.metas_km || []).map(k => `<span class="mz-km">KM ${esc(k)}</span>`).join('');
}
function barra(i, grande) {
  const meta = num(i.meta_numerica), p = getProgresso(i.id), { conf, pend } = calcPct(i);
  return `<div class="mz-bar"><div class="mz-tr"${grande ? ' style="height:10px"' : ''}><i class="cf" style="width:${conf}%"></i>${pend ? `<i class="pd" style="width:${pend}%"></i>` : ''}</div>
    <div class="nm"><span><b>${fmtN(p.realizado_confirmado)}</b> / ${fmtN(meta)} ${esc(i.unidade || '')}</span>${num(p.realizado_pendente) > 0 ? `<span>+ ${fmtN(p.realizado_pendente)} pendente</span>` : ''}</div></div>`;
}

// ── Números do topo ───────────────────────────────────────────
function renderStats() {
  const total = matrizItens.length;
  const comMeta = matrizItens.filter(i => num(i.meta_numerica) > 0);
  const ating = comMeta.filter(i => sitItem(i) === 'ating').length;
  const media = mediaConf(matrizItens);
  const pend = Object.values(pendPorItem).reduce((s, n) => s + n, 0);
  const kpi = (ic, l, v, s, m) => `<div class="mz-kpi"><div class="mz-kpi-l">${mzIc(ic)}${l}</div><div class="mz-kpi-v">${v}</div>${m || ''}<div class="mz-kpi-s">${s}</div></div>`;
  document.getElementById('stats-row').innerHTML =
      kpi('alvo', 'Indicadores', total, `${comMeta.length} com meta numérica · ${total - comMeta.length} qualitativo${total - comMeta.length === 1 ? '' : 's'}`)
    + kpi('check', 'Metas atingidas', `${ating} <small>de ${comMeta.length}</small>`, 'confirmado ≥ 100% da meta',
        `<div class="mz-meter"><i style="width:${comMeta.length ? ating / comMeta.length * 100 : 0}%;background:var(--mz-ating)"></i></div>`)
    + kpi('grafico', 'Progresso médio', media + '%', 'confirmado, teto de 100% por indicador',
        `<div class="mz-meter"><i style="width:${media}%;background:var(--mz-and)"></i></div>`)
    + kpi('relogio', 'Aguardando confirmação', pend, pend === 1 ? 'contribuição pendente' : 'contribuições pendentes');
  document.getElementById('n-mz').textContent = total;
}

function renderSeg() {
  const cnt = {}; matrizItens.forEach(i => { const s = sitItem(i); cnt[s] = (cnt[s] || 0) + 1; });
  const pend = matrizItens.filter(i => pendPorItem[i.id]).length;
  const ops = [['', 'Todos', matrizItens.length]].concat(Object.keys(SIT).map(s => [s, SIT[s].rot, cnt[s] || 0]));
  if (pend) ops.push(['pend', 'Aguarda confirmação', pend]);
  document.getElementById('seg-sit').innerHTML = ops.map(([k, r, n]) =>
    `<button type="button" data-sit="${k}" aria-pressed="${filtroSit === k}">${SIT[k] ? `<span class="dt" style="--c:var(${SIT[k].cor})"></span>` : ''}${r} <span class="mono">${n}</span></button>`).join('');
}

// ── Abas ──────────────────────────────────────────────────────
function mudarAba(aba) {
  abaAtual = aba;
  document.querySelectorAll('.mz-tab[data-aba]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.aba === aba)));
  ['matriz', 'ods', 'km'].forEach(a => { document.getElementById('tc-' + a).hidden = a !== aba; });
}

// ── MATRIZ ────────────────────────────────────────────────────
function renderMatriz() {
  const el = document.getElementById('conteudo-matriz');
  if (!matrizItens.length) { el.innerHTML = '<div class="mz-vazio">Nenhum indicador cadastrado.</div>'; document.getElementById('cont').textContent = ''; return; }
  const busca = (document.getElementById('busca-ind')?.value || '').toLowerCase();
  const vis = matrizItens.filter(i => {
    if (filtroSit === 'pend') { if (!pendPorItem[i.id]) return false; }
    else if (filtroSit && sitItem(i) !== filtroSit) return false;
    if (!busca) return true;
    return [i.indicador, i.produto_titulo, i.produto_codigo, i._cod, i.meta_descricao].some(t => (t || '').toLowerCase().includes(busca));
  });
  document.getElementById('cont').textContent = vis.length + ' de ' + matrizItens.length + ' indicadores';
  const resultados = [...new Set(matrizItens.map(i => i.resultado))].sort((a, b) => a - b);

  el.innerHTML = resultados.map(r => {
    const ir = vis.filter(i => i.resultado === r);
    if (!ir.length) return '';
    const todosR = matrizItens.filter(i => i.resultado === r);
    const mR = mediaConf(todosR);
    const cnt = {}; todosR.forEach(i => { const s = sitItem(i); cnt[s] = (cnt[s] || 0) + 1; });
    const resumo = Object.keys(SIT).filter(s => cnt[s]).map(s => cnt[s] + ' ' + SIT[s].rot.toLowerCase()).join(' · ');
    const aberto = !resFechados.has(r);
    const produtos = [...new Set(ir.map(i => i.produto_codigo))];
    return `<div class="mz-res" style="--c:var(${COR_RES[r] || '--mz-sem'})">
      <button type="button" class="mz-res-h" aria-expanded="${aberto}" onclick="toggleResultado(${r})">
        <span class="mz-res-c">R${r}</span>
        <span class="mz-res-n">${esc(nomeResultado(r))}<small>${resumo}</small></span>
        <span class="mz-res-r"><span class="mz-mini"><i style="width:${mR}%"></i></span><span class="mz-pct">${mR}%</span>${mzIc('chev','chev')}</span>
      </button>
      <div${aberto ? '' : ' hidden'}>
        ${produtos.map(cod => {
          const ip = ir.filter(i => i.produto_codigo === cod);
          const nTot = matrizItens.filter(i => i.produto_codigo === cod).length;
          return `<div class="mz-prod-h"><span class="mz-cod">${esc(cod)}</span><span class="t">${esc(tituloProduto[cod] || cod)}</span><span class="s">${nTot} indicador${nTot === 1 ? '' : 'es'}</span></div>`
            + ip.map(renderIndCard).join('');
        }).join('')}
      </div>
    </div>`;
  }).join('') || '<div class="mz-vazio">Nenhum indicador com esse filtro.</div>';
}

function toggleResultado(r) {
  if (resFechados.has(r)) resFechados.delete(r); else resFechados.add(r);
  renderMatriz();
}

function renderIndCard(i) {
  const s = sitItem(i), S = SIT[s], { real } = calcPct(i);
  const outroTitulo = (i.produto_titulo || '') !== (tituloProduto[i.produto_codigo] || '');
  const bar = num(i.meta_numerica) ? barra(i) : `<div class="mz-bar q">Meta qualitativa, sem valor numérico</div>`;
  return `<div class="mz-ind" role="button" tabindex="0" onclick="abrirIndicador('${i.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirIndicador('${i.id}')}">
    <span class="ic-c">${esc(i._cod)}</span>
    <div style="min-width:0">
      <div class="tx">${esc(i.indicador || '—')}</div>

// ── Confirmar contribuição ────────────────────────────────────
async function confirmarContrib(contribId, novoStatus) {
  const { error } = await db.from('produto_matriz_contribuicao')
    .update({ status: novoStatus, confirmado_por: appState.usuario.id, confirmado_em: new Date().toISOString() })
    .eq('id', contribId);
  if (error) { toast('Não foi possível atualizar a contribuição: ' + error.message, 'error'); return; }
  toast(novoStatus === 'confirmado' ? 'Contribuição confirmada.' : 'Contribuição rejeitada.', novoStatus === 'confirmado' ? 'success' : 'info');
  const id = indAtual && indAtual.id;
  await carregar();
  if (id) await abrirIndicador(id);
}

async function salvarIndicador(id) {
  const val = x => (document.getElementById(x).value || '').trim();
  const payload = {
    resultado: parseInt(val('fi-resultado'), 10) || 1,
    produto_codigo: val('fi-produto-cod'),
    produto_titulo: val('fi-produto-titulo'),
    indicador: val('fi-indicador'),
    meta_descricao: val('fi-meta-desc'),
    meta_numerica: parseFloat(val('fi-meta-num')) || null,
    unidade: val('fi-unidade') || null,
    ordem: parseInt(val('fi-ordem'), 10) || 0,
    ods: [...document.querySelectorAll('#fi-ods-grid [aria-pressed="true"]')].map(x => x.dataset.ods),
    metas_km: [...document.querySelectorAll('#fi-km-grid [aria-pressed="true"]')].map(x => x.dataset.km),
    meios_verificacao: val('fi-meios') || null,
    atualizado_em: new Date().toISOString()
  };
  if (!payload.indicador || !payload.produto_codigo || !payload.produto_titulo) { toast('Preencha resultado, código e título do produto e o indicador.', 'warning'); return; }
  const { error } = id
    ? await db.from('matriz_itens').update(payload).eq('id', id)
    : await db.from('matriz_itens').insert(payload);
  if (error) { toast('Não foi possível salvar: ' + error.message, 'error'); return; }
  toast(id ? 'Indicador atualizado.' : 'Indicador criado.', 'success');
  mzFechar('modal-ind');
  await carregar();
}

// ── Exportar CSV ──────────────────────────────────────────────
function exportarCSV() {
  const rows = [['Resultado', 'Produto', 'Código', 'Indicador', 'Meta', 'Meta numérica', 'Unidade', 'Confirmado', 'Pendente', '% confirmado', 'Situação', 'ODS', 'KM', 'Meios de verificação']];
  matrizItens.forEach(i => {
    const p = getProgresso(i.id), { real } = calcPct(i);
    rows.push([`R${i.resultado}`, i.produto_codigo, i._cod, i.indicador, i.meta_descricao, i.meta_numerica || '', i.unidade || '',
      num(p.realizado_confirmado), num(p.realizado_pendente), real == null ? '' : real + '%', SIT[sitItem(i)].rot,
      (i.ods || []).join(';'), (i.metas_km || []).join(';'), (i.meios_verificacao || '').replace(/[\n\r]+/g, ' ')]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent(csv);
  a.download = 'matriz_resultados_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
}

// ── Janelas: pilha (Esc fecha a de cima), foco no primeiro controle, Tab preso, foco volta ──
const MZ_FOCAVEIS = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]):not([type=file]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const mzPilha = [];
function mzAbrir(id) {
  const el = document.getElementById(id);
  if (!el.classList.contains('aberto')) { mzPilha.push({ id, volta: document.activeElement }); el.classList.add('aberto'); }
  requestAnimationFrame(() => {
    const alvo = el.querySelector('.modal-body :is(input:not([type=file]),select,textarea)') || el.querySelector('.modal-close');
    if (alvo) alvo.focus({ preventScroll: true });
    el.querySelector('.modal-body').scrollTop = 0;
  });
}
function mzFechar(id) {
  const el = document.getElementById(id);
  el.classList.remove('aberto');
  const k = mzPilha.findIndex(x => x.id === id);
  if (k >= 0) { const { volta } = mzPilha.splice(k, 1)[0]; if (volta && document.contains(volta)) volta.focus({ preventScroll: true }); }
}
document.addEventListener('keydown', e => {
  const topo = mzPilha[mzPilha.length - 1]; if (!topo) return;
  const el = document.getElementById(topo.id);
  if (e.key === 'Escape') { e.preventDefault(); mzFechar(topo.id); }
  else if (e.key === 'Tab') {
    const f = [...el.querySelectorAll(MZ_FOCAVEIS)].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const pri = f[0], ult = f[f.length - 1];
    if (!el.contains(document.activeElement)) { e.preventDefault(); pri.focus(); }
    else if (e.shiftKey && document.activeElement === pri) { e.preventDefault(); ult.focus(); }
    else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
  }
});
['modal-ind', 'modal-ref'].forEach(id => document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) mzFechar(id); }));
</script>
