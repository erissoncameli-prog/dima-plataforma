<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="author" content="Erisson Cameli Santiago">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Patrimônio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<link href="../css/sidebar.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes do Patrimônio -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/patrimonio.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="empty-state" role="status"><div class="spinner"></div><div class="empty-state-msg">Carregando patrimônio…</div></div></div>

<!-- Janelas fora do #app; .pt-ov = escopo do tema (css/patrimonio.css). Conteúdo montado por js/patrimonio.js -->
<div class="modal-overlay pt-ov" id="pt-ficha" role="dialog" aria-modal="true" aria-labelledby="pt-ficha-tit">
  <div class="modal pt-largo">
    <div class="modal-header">
      <div class="pt-mh"><span id="pt-ficha-ic"></span>
        <div><div class="modal-title" id="pt-ficha-tit">Bem</div><div class="modal-sub" id="pt-ficha-sub"></div></div></div>
      <button type="button" class="modal-close" data-fechar="pt-ficha" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="pt-ficha-corpo"></div>
    <div class="modal-footer" id="pt-ficha-rodape"></div>
  </div>
</div>

<div class="modal-overlay pt-ov" id="pt-inc" role="dialog" aria-modal="true" aria-labelledby="pt-inc-tit" data-fundo-fecha="nao">
  <div class="modal pt-largo">
    <div class="modal-header">
      <div><div class="modal-title" id="pt-inc-tit">Incorporar bens</div>
        <div class="modal-sub">Cadastre os bens recebidos. Nada é gravado até você clicar em <b>Incorporar</b>.</div></div>
      <button type="button" class="modal-close" data-fechar="pt-inc" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="pt-inc-corpo"></div>
    <div class="modal-footer" id="pt-inc-rodape"></div>
  </div>
</div>

<!-- termo de responsabilidade / empréstimo: leitura, aceite com senha, impressão -->
<div class="modal-overlay pt-ov" id="pt-termo" role="dialog" aria-modal="true" aria-labelledby="pt-termo-tit">
  <div class="modal pt-largo">
    <div class="modal-header">
      <div><div class="modal-title" id="pt-termo-tit">Termo</div><div class="modal-sub" id="pt-termo-sub"></div></div>
      <button type="button" class="modal-close" data-fechar="pt-termo" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="pt-termo-corpo"></div>
    <div class="modal-footer" id="pt-termo-rodape"></div>
  </div>
</div>

<!-- janela de formulário curto (condição, correção, estorno, NF, categoria, local) -->
<div class="modal-overlay pt-ov" id="pt-form" role="dialog" aria-modal="true" aria-labelledby="pt-form-tit">
  <div class="modal pt-medio">
    <div class="modal-header">
      <div><div class="modal-title" id="pt-form-tit"></div><div class="modal-sub" id="pt-form-sub"></div></div>
      <button type="button" class="modal-close" data-fechar="pt-form" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="pt-form-corpo"></div>
    <div class="modal-footer" id="pt-form-rodape"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/autoria.js"></script>
<script src="../js/logos.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/guia-app.js"></script>
<script src="../js/guias-plataforma.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/folha-a4.js"></script>
<script src="../js/qrcode-generator.js"></script>
<script src="../js/patrimonio.js"></script>
</body>
</html>
