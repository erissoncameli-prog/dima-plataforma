<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Produtos Entregues</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<link href="../css/sidebar.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes de Produtos -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/produtos.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="empty-state" role="status"><div class="spinner"></div><div class="empty-state-msg">Carregando produtos…</div></div></div>

<!-- Janelas fora do #app; .pr-ov = escopo do tema (css/produtos.css). <i data-ic> vira ícone SVG. -->
<div id="lightbox" class="pr-ov" role="dialog" aria-modal="true" aria-label="Foto ampliada" onclick="if(event.target===this)fecharLightbox()">
  <button type="button" id="lightbox-close" onclick="fecharLightbox()" aria-label="Fechar"><i data-ic="x"></i></button>
  <img id="lb-img" alt="">
  <div id="lightbox-nome"></div>
</div>

<div class="modal-overlay pr-ov" id="modal-prod" role="dialog" aria-modal="true" aria-labelledby="mp-titulo">
  <div class="modal modal-prod">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="mp-titulo">Produto</div>
        <div class="modal-sub" id="mp-sub"></div>
      </div>
      <button type="button" class="modal-close" onclick="fecharModal()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="mp-body"></div>
    <div class="modal-footer" id="mp-footer"></div>
  </div>
</div>

<!-- Planilha de Geolocalização -->
<div class="modal-overlay pr-ov pr-sobre" id="modal-geo-csv" role="dialog" aria-modal="true" aria-labelledby="geo-titulo">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="geo-titulo"><i data-ic="pin"></i>Planilha de geolocalização</div>
        <div class="modal-sub">Importe as coordenadas dos pontos entregues</div>
      </div>
      <button type="button" class="modal-close" onclick="fecharModalGeoCsv()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="geo-csv-body"></div>
    <div class="modal-footer" id="geo-csv-footer"></div>
  </div>
</div>

<!-- Editar contribuição à Matriz (super_admin, produtos já aprovados/pagos) -->
<div class="modal-overlay pr-ov pr-sobre" id="modal-matriz-edit" role="dialog" aria-modal="true" aria-labelledby="me-titulo">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="me-titulo"><i data-ic="alvo"></i>Contribuição à Matriz de Resultados</div>
        <div class="modal-sub" id="me-sub"></div>
      </div>
      <button type="button" class="modal-close" onclick="fecharModalMatrizEdit()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="me-body"></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="fecharModalMatrizEdit()">Fechar</button>
    </div>
  </div>
</div>

<!-- Anexar documento (super_admin, produtos já aprovados/pagos) -->
<div class="modal-overlay pr-ov pr-sobre" id="modal-anexo-edit" role="dialog" aria-modal="true" aria-labelledby="ae-titulo">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="ae-titulo"><i data-ic="clipe"></i>Anexar documento</div>
        <div class="modal-sub" id="ae-sub"></div>
      </div>
      <button type="button" class="modal-close" onclick="fecharModalAnexoEdit()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="ae-body"></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="fecharModalAnexoEdit()">Fechar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/produtos.js"></script>
<script>document.querySelectorAll('i[data-ic]').forEach(function(e){e.outerHTML=prIc(e.dataset.ic);});</script>
</body>
</html>
