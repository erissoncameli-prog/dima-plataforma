<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Pulso da Equipe</title>
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes do Pulso -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/pulso.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"></div>
<!-- janelas fora do #app (z-index da sidebar) -->
<div class="pu-qr" id="pu-qr" role="dialog" aria-modal="true" aria-labelledby="pu-qr-tit">
  <div class="pu-qr-bts">
    <button type="button" onclick="PU.fecharQR()" id="pu-qr-fechar"><svg class="pu-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>Fechar</button>
  </div>
  <h2 id="pu-qr-tit"></h2>
  <p>Aponte a câmera do celular · anônimo · cerca de 3 minutos</p>
  <div class="pu-qr-cartao"><img id="pu-qr-img" alt="QR Code do questionário"></div>
  <div class="pu-qr-cont" aria-live="polite"><b id="pu-qr-n">0</b><span>respostas recebidas</span></div>
  <div class="url" id="pu-qr-url"></div>
</div>
<div class="modal-overlay pu-ov" id="pu-modal" role="dialog" aria-modal="true"><div class="modal"><div id="pu-modal-c"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/qrcode-generator.js"></script>
<script src="../js/pulso-perguntas.js"></script>
<script src="../js/pulso-exportar.js"></script>
<script src="../js/pulso.js"></script>
</body>
</html>
