<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Relatórios</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
/* ── SELETOR DE TEMAS ─────────────────────────────────────── */
.temas-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.tema-btn{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--borda);background:var(--branco);cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:500;color:var(--cinza-600);transition:all .15s;}
.tema-btn:hover{border-color:currentColor;opacity:.85;}
.tema-btn.ativo{color:#fff;border-color:transparent;}
.tema-btn .tema-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* ── LISTA DE RELATÓRIOS ──────────────────────────────────── */
.rel-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:24px;}
.rel-card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:16px 18px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.rel-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;}
.rel-card:hover{box-shadow:var(--sombra-md);transform:translateY(-1px);}
.rel-card.ativo{box-shadow:var(--sombra-md);}
.rel-card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.rel-card-icon{width:34px;height:34px;border-radius:var(--raio);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.rel-card-titulo{font-size:13px;font-weight:600;color:var(--cinza-900);line-height:1.3;}
.rel-card-desc{font-size:11px;color:var(--cinza-500);line-height:1.5;}
.rel-card-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;margin-top:8px;}

/* ── PAINEL DE CONFIGURAÇÃO ──────────────────────────────── */
.config-panel{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:20px 24px;margin-bottom:20px;}
.config-titulo{font-size:14px;font-weight:600;color:var(--cinza-900);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.config-desc{font-size:12px;color:var(--cinza-500);margin-bottom:16px;}
.config-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.config-grupo{display:flex;flex-direction:column;gap:4px;}
.config-lbl{font-size:10px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.05em;}
.config-select,.config-input{height:34px;border:1px solid var(--borda);border-radius:var(--raio);padding:0 10px;font-family:var(--font-sans);font-size:12px;color:var(--cinza-900);background:var(--branco);min-width:140px;}
.config-select:focus,.config-input:focus{outline:none;border-color:var(--verde-medio);}

/* ── ÁREA DE VISUALIZAÇÃO ─────────────────────────────────── */
.preview-wrap{background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio-lg);padding:20px;min-height:200px;}
.preview-vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--cinza-400);gap:10px;}
.preview-vazio-icon{font-size:48px;opacity:.4;}

/* ── DOCUMENTO IMPRIMÍVEL ─────────────────────────────────── */
.doc-wrap{position:relative;background:#fff;max-width:900px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.1);border-radius:4px;}

/* CABEÇALHO DO RELATÓRIO */
.doc-header{padding:20px 32px 16px;border-bottom:3px solid #1F4E2C;position:relative;}
.doc-header-logos{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.doc-header-logos-esq{display:flex;align-items:center;gap:10px;}
.doc-header-logos-dir{display:flex;align-items:center;gap:10px;}
.doc-header-logo{height:32px;width:auto;object-fit:contain;}
.doc-header-sep{width:1px;height:28px;background:#B5860D;flex-shrink:0;}
.doc-header-projeto{font-size:9px;font-weight:700;color:#1F4E2C;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.doc-header-programa{font-size:11px;color:var(--cinza-600);margin-bottom:1px;}
.doc-header-local{font-size:10px;color:var(--cinza-500);}
.doc-header-titulo-wrap{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.doc-header-titulo{font-size:18px;font-weight:700;color:var(--cinza-900);display:flex;align-items:center;gap:10px;}
.doc-header-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;color:#fff;}
.doc-header-meta{text-align:right;font-size:10px;color:var(--cinza-500);line-height:1.6;}

/* MARCA D'ÁGUA */
.doc-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.06;}
.doc-watermark img{width:280px;height:auto;}

/* CORPO DO RELATÓRIO */
.doc-body{padding:24px 32px;position:relative;z-index:1;}

/* RODAPÉ DO RELATÓRIO */
.doc-footer{padding:12px 32px;border-top:1.5px solid #1F4E2C;display:flex;align-items:center;justify-content:space-between;background:#f8faf8;}
.doc-footer-esq{font-size:10px;color:var(--cinza-600);line-height:1.6;}
.doc-footer-centro{font-size:9px;color:var(--cinza-400);text-align:center;}
.doc-footer-dir{font-size:11px;font-weight:600;color:var(--cinza-700);font-family:var(--font-mono);}

/* TABELAS DO RELATÓRIO */
.rep-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px;}
.rep-tbl th{padding:7px 10px;font-size:9px;font-weight:700;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid #1F4E2C;background:#f0f7f2;text-align:left;white-space:nowrap;}
.rep-tbl td{padding:7px 10px;border-bottom:1px solid var(--borda);color:var(--cinza-700);vertical-align:middle;word-break:break-word;}
.rep-tbl tbody tr:nth-child(even) td{background:#fafcfa;}
.rep-tbl tbody tr:hover td{background:#f0f7f2;}
.rep-tbl tfoot td{padding:8px 10px;font-weight:700;color:var(--cinza-900);border-top:2px solid #1F4E2C;background:#f0f7f2;}

/* STATS DO RELATÓRIO */
.rep-stats{display:grid;gap:12px;margin-bottom:20px;}
.rep-stats-4{grid-template-columns:repeat(4,1fr);}
.rep-stats-3{grid-template-columns:repeat(3,1fr);}
.rep-stat{background:#f0f7f2;border:1px solid #c8e6d0;border-radius:var(--raio);padding:12px 14px;}
.rep-stat-lbl{font-size:9px;font-weight:700;color:#2D6A4F;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.rep-stat-val{font-size:18px;font-weight:700;color:var(--cinza-900);font-family:var(--font-mono);letter-spacing:-.01em;}
.rep-stat-sub{font-size:10px;color:var(--cinza-500);margin-top:2px;}

/* SEÇÃO DO RELATÓRIO */
.rep-secao{margin-bottom:20px;}
.rep-secao-titulo{font-size:11px;font-weight:700;color:#1F4E2C;text-transform:uppercase;letter-spacing:.08em;padding:6px 0;border-bottom:1.5px solid #c8e6d0;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

/* BARRA DE PROGRESSO */
.rep-barra{height:6px;background:var(--cinza-100);border-radius:3px;overflow:hidden;}
.rep-barra-fill{height:100%;border-radius:3px;background:#2D6A4F;transition:width .4s;}
.rep-barra-fill.warn{background:var(--aviso);}
.rep-barra-fill.crit{background:var(--erro);}

/* BADGES */
.rep-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
.rb-verde{background:#ECFDF5;color:#065F46}
.rb-azul{background:#EFF6FF;color:#1E40AF}
.rb-ouro{background:#FFFBEB;color:#92400E}
.rb-vermelho{background:#FEF2F2;color:#991B1B}
.rb-cinza{background:#F3F4F6;color:#374151}
.rb-teal{background:#F0FDFA;color:#0F766E}

/* MONO */
.mono{font-family:var(--font-mono);font-size:10px;white-space:nowrap;}
.mono-sm{font-family:var(--font-mono);font-size:9px;}

/* BOTÕES DE AÇÃO */
.btn-imprimir{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;background:#1F4E2C;color:#fff;border:none;border-radius:var(--raio);font-family:var(--font-sans);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-imprimir:hover{background:#143520;}

/* ── MODAL DE EXPORTAÇÃO ──────────────────────────────────── */
#export-modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);flex-direction:row;}
#export-modal.aberto{display:flex;}
.exp-sidebar{width:210px;flex-shrink:0;background:#1F4E2C;display:flex;flex-direction:column;padding:0;overflow-y:auto;}
.exp-sidebar-hd{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.14);}
.exp-sidebar-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.exp-sidebar-sub{font-size:10px;color:rgba(255,255,255,.55);line-height:1.4;}
.exp-sidebar-body{padding:14px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
.exp-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.07em;padding:8px 0 3px;}
.exp-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--raio);border:none;cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:600;text-align:left;transition:all .15s;width:100%;color:#fff;}
.exp-btn-pdf{background:rgba(255,255,255,.13);}
.exp-btn-pdf:hover{background:rgba(255,255,255,.23);}
.exp-btn-csv{background:rgba(255,255,255,.08);}
.exp-btn-csv:hover{background:rgba(255,255,255,.18);}
.exp-btn-xls{background:rgba(21,128,61,.45);}
.exp-btn-xls:hover{background:rgba(21,128,61,.65);}
.exp-btn-print{background:rgba(255,255,255,.06);color:rgba(255,255,255,.75);}
.exp-btn-print:hover{background:rgba(255,255,255,.14);color:#fff;}
.exp-btn-close{background:rgba(220,38,38,.18);color:rgba(255,255,255,.8);margin-top:auto;}
.exp-btn-close:hover{background:rgba(220,38,38,.45);color:#fff;}
.exp-btn:disabled{opacity:.5;cursor:wait;}
.exp-btn-recomendado{outline:2px solid #FCD34D;outline-offset:1px;background:rgba(252,211,77,.18)!important;}
.exp-aviso-paisagem{background:rgba(252,211,77,.15);border:1px solid rgba(252,211,77,.4);border-radius:var(--raio);padding:7px 10px;font-size:10px;color:#FDE68A;line-height:1.4;display:flex;gap:6px;align-items:flex-start;}
.exp-preview{flex:1;overflow-y:auto;overflow-x:auto;background:#d1d5db;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:0;}
.exp-preview .doc-wrap{width:100%;max-width:960px;margin:0;}
.doc-paisagem .rep-tbl{font-size:9px;}
.doc-paisagem .rep-tbl th,.doc-paisagem .rep-tbl td{padding:5px 7px;}
.doc-paisagem .rep-tbl tfoot td{padding:6px 7px;}

/* ── PRINT ─────────────────────────────────────────────────── */
@media print {
  body > *:not(#print-area){ display:none !important; }
  #print-area{ display:block !important; }
  .doc-wrap{ box-shadow:none; max-width:100%; border-radius:0; }
  tfoot{ display:table-row-group; }

  /* Cabeçalho fixo — repete em todas as páginas */
  .doc-header{
    position:fixed; top:0; left:0; right:0;
    background:#fff; z-index:100;
  }
  /* Rodapé fixo — repete em todas as páginas */
  .doc-footer{
    position:fixed; bottom:0; left:0; right:0;
    z-index:100;
  }
  /* Marca d'água fixa — repete em todas as páginas */
  .doc-watermark{
    position:fixed; top:50vh; left:50%;
    transform:translate(-50%,-50%);
  }
  /* Espaço para não sobrepor cabeçalho/rodapé fixos */
  .doc-body{
    padding-top:185px !important;
    padding-bottom:70px !important;
  }
  .doc-watermark,
  .rep-tbl th,.rep-stat,.rep-secao-titulo,.doc-header,.doc-footer{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'DM Sans',sans-serif;color:#6B7280">
    <div style="text-align:center">
      <div style="width:32px;height:32px;border:3px solid #E5E7EB;border-top-color:#2D6A4F;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      Carregando relatórios...
    </div>
  </div>
</div>

<!-- ÁREA DE IMPRESSÃO -->
<div id="print-area" style="display:none"></div>

<!-- MODAL DE EXPORTAÇÃO -->
<div id="export-modal">
  <div class="exp-sidebar">
    <div class="exp-sidebar-hd">
      <div class="exp-sidebar-title">📤 Exportar Relatório</div>
      <div class="exp-sidebar-sub" id="exp-rel-nome">—</div>
    </div>
    <div class="exp-sidebar-body">
      <div class="exp-lbl">PDF · A4</div>
      <button class="exp-btn exp-btn-pdf" onclick="exportPDF('portrait',this)">📄 Retrato</button>
      <button class="exp-btn exp-btn-pdf" onclick="exportPDF('landscape',this)">📰 Paisagem</button>

      <div class="exp-lbl">Dados</div>
      <button class="exp-btn exp-btn-csv" onclick="exportCSV()">📊 CSV</button>
      <button class="exp-btn exp-btn-xls" onclick="exportExcel()">📗 Excel (.xlsx)</button>

      <div class="exp-lbl">Imprimir</div>
      <button class="exp-btn exp-btn-print" onclick="exportPrint('portrait')">🖨️ Retrato</button>
      <button class="exp-btn exp-btn-print" onclick="exportPrint('landscape')">🖨️ Paisagem</button>

      <button class="exp-btn exp-btn-close" onclick="fecharExport()" style="margin-top:20px">✕ Fechar</button>
    </div>
  </div>
  <div class="exp-preview" id="exp-preview-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════════════════════
let relAtivo = null;   // id do relatório selecionado

// ══════════════════════════════════════════════════════════════
// CATÁLOGO DE RELATÓRIOS

let _atividades=[], _fornecedores=[], _usuarios=[], _protocolos=[], _viajantesNomes=[];

async function carregarAuxiliares(){
  const [ra,rf,ru,rp,rv] = await Promise.all([
    db.from('atividades').select('id,codigo,nome_pt').order('codigo'),
    db.from('fornecedores').select('id,nome').eq('ativo',true).order('nome'),
    db.from('usuarios').select('id,nome_completo,perfil').eq('ativo',true).order('nome_completo'),
    db.from('viagem_protocolos').select('id,numero,destino_principal').order('numero',{ascending:false}),
    db.from('viagem_viajantes').select('nome').order('nome'),
  ]);
  _atividades = ra.data||[];
  _fornecedores = rf.data||[];
  _usuarios = ru.data||[];
  _protocolos = rp.data||[];
  _viajantesNomes = [...new Set((rv.data||[]).map(v=>v.nome).filter(Boolean))].sort();
}

function getAbasPermitidas(){
  const perfil=appState.perfil;
  if(['super_admin','coordenacao'].includes(perfil))
    return TEMAS.filter(t=>t.id!=='todos').map(t=>t.id);
  return TEMAS
    .filter(t=>t.id!=='todos'&&t.id!=='usuarios'&&t.id!=='logs')
    .filter(t=>appState.permissoes.includes('relatorios_'+t.id))
    .map(t=>t.id);
}

// RENDER TEMAS
// ══════════════════════════════════════════════════════════════
let temaAtivo = 'todos';
function renderTemas(ativo){
  temaAtivo = ativo;
  const abasOk = getAbasPermitidas();
  const temasVisiveis = TEMAS.filter(t=>t.id==='todos'||abasOk.includes(t.id));
  document.getElementById('temas-grid').innerHTML = temasVisiveis.map(t=>`
    <button class="tema-btn${t.id===ativo?' ativo':''}"
      style="${t.id===ativo?'background:'+t.cor+';border-color:'+t.cor:''}"
      onclick="renderTemas('${t.id}');renderLista('${t.id}')">
      <span class="tema-dot" style="background:${t.id===ativo?'rgba(255,255,255,.7)':t.cor}"></span>
      ${t.label}
    </button>`).join('');
}

// ══════════════════════════════════════════════════════════════
// RENDER LISTA
// ══════════════════════════════════════════════════════════════
function renderLista(tema){
  const isSuperAdmin = appState.perfil === 'super_admin';
  const abasOk = getAbasPermitidas();
  const lista = (tema==='todos' ? RELATORIOS : RELATORIOS.filter(r=>r.tema===tema))
    .filter(r => !r.somente_super_admin || isSuperAdmin)
    .filter(r => abasOk.includes(r.tema));
  const temaInfo = t => TEMAS.find(x=>x.id===t)||{cor:'#374151'};
  document.getElementById('rel-lista').innerHTML = lista.map(r=>{
    const ti = temaInfo(r.tema);
    return `<div class="rel-card${relAtivo===r.id?' ativo':''}"
        style="--card-cor:${ti.cor};border-left:4px solid ${ti.cor}"
        onclick="selecionarRel('${r.id}')">
      <div class="rel-card-header">
        <div class="rel-card-icon" style="background:${ti.cor}22;color:${ti.cor}">${r.icone}</div>
        <div>
          <div class="rel-card-titulo">${r.titulo}</div>
          <div style="font-size:9px;font-family:var(--font-mono);color:${ti.cor};font-weight:700;margin-top:2px">${r.id}</div>
        </div>
      </div>
      <div class="rel-card-desc">${r.desc}</div>
    </div>`;
  }).join('');
}

function selecionarRel(id){
  relAtivo = id;
  filtros = {};
  dadosRel = null;
  renderLista(temaAtivo);
  const rel = RELATORIOS.find(r=>r.id===id);
  const ti = TEMAS.find(t=>t.id===rel.tema)||{cor:'#374151'};
  document.getElementById('config-area').style.display='block';
  // Painel de config
  document.getElementById('config-panel').innerHTML = `
    <div class="config-titulo" style="color:${ti.cor}">
      <span>${rel.icone}</span> ${rel.titulo}
      <span style="font-size:9px;font-family:var(--font-mono);background:${ti.cor}22;color:${ti.cor};padding:2px 8px;border-radius:99px;font-weight:700">${rel.id}</span>
    </div>
    <div class="config-desc">${rel.desc}</div>
    <div class="config-filtros" id="filtros-form">
      ${renderFiltros(rel.filtros)}
    </div>`;
  document.getElementById('acoes-area').innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="limparPreview()">✕ Limpar</button>
    <button class="btn-imprimir" onclick="gerarRelatorio('${id}')">▶ Gerar Relatório</button>`;
  document.getElementById('preview-area').innerHTML = `
    <div class="preview-vazio">
      <div class="preview-vazio-icon">⚙️</div>
      <div>Configure os filtros acima e clique em <strong>Gerar Relatório</strong></div>
    </div>`;
  document.getElementById('config-area').scrollIntoView({behavior:'smooth',block:'start'});
}

function wrapDoc(conteudo, rel){
  const u = appState.usuario;
  const ti = TEMAS.find(t=>t.id===rel.tema)||{cor:'#374151', label:rel.tema};
  const dtIni = filVal('fil-dt-ini');
  const dtFim = filVal('fil-dt-fim');
  const periodoTxt = dtIni||dtFim
    ? 'Período: '+(dtIni?fmtDt(dtIni):'início')+' a '+(dtFim?fmtDt(dtFim):'hoje')
    : '';
  const perfilLabel = {super_admin:'Super Admin',coordenacao:'Coordenação',tecnico:'Técnico',financeiro:'Financeiro'}[appState.perfil]||appState.perfil;
  const paisagemAttr = rel.paisagem ? ' data-paisagem="true" class="doc-wrap doc-paisagem"' : ' class="doc-wrap"';
  return `
  <div${paisagemAttr} id="doc-content">
    ${docHeader(rel.icone+' '+rel.titulo, ti.label.toUpperCase(), ti.cor, periodoTxt)}
    <div class="doc-body">
      ${conteudo}
    </div>
    ${docFooter(u?.nome_completo||'Usuário', perfilLabel)}
    ${docWatermark()}
  </div>`;
}

// MODAL DE EXPORTAÇÃO

function abrirExport() {
  const content = document.getElementById('doc-content');
  if (!content) return;
  const rel = RELATORIOS.find(r => r.id === relAtivo);
  document.getElementById('exp-rel-nome').textContent = rel ? `${rel.id} · ${rel.titulo}` : '—';
  const preview = document.getElementById('exp-preview-content');
  preview.innerHTML = content.outerHTML;
  preview.querySelector('#doc-content')?.removeAttribute('id');
  preview.querySelectorAll('.doc-watermark').forEach(el => el.style.position = 'absolute');

  // Destacar botões paisagem quando o relatório recomenda essa orientação
  const sidebar = document.querySelector('.exp-sidebar-body');
  sidebar.querySelectorAll('.exp-aviso-paisagem').forEach(el => el.remove());
  sidebar.querySelectorAll('.exp-btn-recomendado').forEach(el => el.classList.remove('exp-btn-recomendado'));
  if (rel?.paisagem) {
    const aviso = document.createElement('div');
    aviso.className = 'exp-aviso-paisagem';
    aviso.innerHTML = '📰 Este relatório é recomendado em <strong>Paisagem</strong> para melhor visualização.';
    sidebar.insertBefore(aviso, sidebar.firstChild);
    sidebar.querySelectorAll('.exp-btn-pdf, .exp-btn-print').forEach(btn => {
      if (btn.textContent.includes('Paisagem')) btn.classList.add('exp-btn-recomendado');
    });
  }

  document.getElementById('export-modal').classList.add('aberto');
  document.body.style.overflow = 'hidden';
}

function fecharExport() {
  document.getElementById('export-modal').classList.remove('aberto');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharExport(); });

function exportPDF(orientacao, btn) {
  const wrapper = document.getElementById('exp-preview-content').querySelector('.doc-wrap');
  if (!wrapper) return;
  if (wrapper.dataset.paisagem === 'true') orientacao = 'landscape';
  const rel = RELATORIOS.find(r => r.id === relAtivo);
  const nome = (rel?.titulo || 'relatorio').replace(/[^\w\s]/g,'').trim().replace(/\s+/g,'_').slice(0,40);
  const filename = `${relAtivo}_${nome}_${new Date().toISOString().slice(0,10)}.pdf`;
  const orig = btn.innerHTML;
  btn.innerHTML = '⏳ Gerando...'; btn.disabled = true;

  // Clonar o HTML removendo watermark (evita taint) e passar como string
  // para o html2pdf criar container próprio sem herdar offset do modal
  const clone = wrapper.cloneNode(true);
  clone.querySelectorAll('.doc-watermark').forEach(e => e.remove());
  const htmlStr = clone.outerHTML;

  html2pdf().set({
    margin: [6, 8, 6, 8],
    filename,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true, logging: false, scrollX: 0, scrollY: 0 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: orientacao, compress: true },
    pagebreak: { mode: 'avoid-all' }
  }).from(htmlStr).save().finally(() => {
    btn.innerHTML = orig; btn.disabled = false;
  });
}

function exportCSV() {
  const table = document.querySelector('#exp-preview-content table');
  if (!table) { alert('Nenhuma tabela encontrada neste relatório.'); return; }
  const rel = RELATORIOS.find(r => r.id === relAtivo);
  const nome = (rel?.titulo || 'relatorio').replace(/[^\w\s]/g,'').trim().replace(/\s+/g,'_').slice(0,40);
  const linhas = [];
  table.querySelectorAll('tr').forEach(tr => {
    const cols = [...tr.querySelectorAll('th,td')].map(c =>
      '"' + c.textContent.trim().replace(/\s+/g,' ').replace(/"/g,'""') + '"'
    );
    if (cols.some(c => c !== '""')) linhas.push(cols.join(';'));
  });
  _download('\uFEFF' + linhas.join('\r\n'), `${relAtivo}_${nome}_${new Date().toISOString().slice(0,10)}.csv`, 'text/csv;charset=utf-8;');
}

function exportExcel() {
  const tables = [...document.querySelectorAll('#exp-preview-content table')];
  if (!tables.length) { alert('Nenhuma tabela encontrada neste relatório.'); return; }
  const rel = RELATORIOS.find(r => r.id === relAtivo);
  const nome = (rel?.titulo || 'relatorio').replace(/[^\w\s]/g,'').trim().replace(/\s+/g,'_').slice(0,40);
  const wb = XLSX.utils.book_new();
  tables.forEach((tbl, i) => XLSX.utils.book_append_sheet(wb, XLSX.utils.table_to_sheet(tbl), `Aba${i+1}`));
  XLSX.writeFile(wb, `${relAtivo}_${nome}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportPrint(orientacao) {
  const el = document.getElementById('exp-preview-content').querySelector('.doc-wrap');
  if (!el) return;
  if (el.dataset.paisagem === 'true') orientacao = 'landscape';
  const printArea = document.getElementById('print-area');
  printArea.innerHTML = el.outerHTML;
  let s = document.getElementById('_po');
  if (!s) { s = document.createElement('style'); s.id = '_po'; document.head.appendChild(s); }
  s.textContent = `@page { size: A4 ${orientacao}; margin: 0; }`;
  window.addEventListener('afterprint', () => { printArea.innerHTML = ''; }, { once: true });
  window.print();
}

function _download(conteudo, nome, tipo) {
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([conteudo], { type: tipo })),
    download: nome
  });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ══════════════════════════════════════════════════════════════
// F1 — EXECUÇÃO ORÇAMENTÁRIA GERAL
// ══════════════════════════════════════════════════════════════
async function relF1(){
  const ativFil = filVal('fil-atividade');
  const resFil  = filVal('fil-resultado');

  let q = db.from('atividades')
    .select(`id,codigo,nome_pt,orcamento_usd,fase,
      resultado:resultados(codigo,nome_pt),
      tdrs(valor_brl,valor_usd,status),
      contratos(valor_total_brl,valor_utilizado_brl,valor_comprometido_brl,saldo_brl,status)`)
    .order('codigo');
  if(ativFil) q = q.eq('id', ativFil);

  // Buscar lançamentos diretos (sem contrato: viagens, etc.) e cotação atual
  let qDir = db.from('execucao_financeira')
    .select('atividade_id,valor_brl,situacao')
    .is('contrato_id', null)
    .neq('situacao','cancelado');
  if(ativFil) qDir = qDir.eq('atividade_id', ativFil);

  const [{data:ativs, error}, {data:diretos}, {data:cotRows}] = await Promise.all([
    q, qDir,
    db.from('cotacoes_usd').select('cotacao').order('data_ref',{ascending:false}).limit(1)
  ]);
  if(error) throw error;
  const taxaRel = parseFloat(cotRows?.[0]?.cotacao || 0);

  // Mapear lançamentos diretos por atividade
  const dirMap = {};
  (diretos||[]).forEach(l => {
    if(!dirMap[l.atividade_id]) dirMap[l.atividade_id] = {comp:0, pago:0};
    dirMap[l.atividade_id].comp += parseFloat(l.valor_brl||0);
    if(l.situacao==='pago') dirMap[l.atividade_id].pago += parseFloat(l.valor_brl||0);
  });

  let rows = (ativs||[]);
  if(resFil) rows = rows.filter(a => a.resultado?.codigo == resFil);

  // Deduplicar resultados do PostgREST
  rows = rows.map(a => {
    const seenT=new Set(), seenC=new Set();
    return { ...a,
      tdrs: (a.tdrs||[]).filter(t=>{ if(seenT.has(t.status+t.valor_brl)) return false; seenT.add(t.status+t.valor_brl); return true; }),
      contratos: (a.contratos||[]).filter(c=>{ if(seenC.has(c.valor_total_brl)) return false; seenC.add(c.valor_total_brl); return true; }),
    };
  });

  const totalOrc  = rows.reduce((s,a)=>s+(a.orcamento_usd||0),0);
  const totalComp = rows.reduce((s,a)=>{
    const dc = dirMap[a.id]?.comp||0;
    return s+(a.contratos||[]).reduce((sc,c)=>sc+(c.valor_comprometido_brl||0),0)+dc;
  },0);
  const totalPago = rows.reduce((s,a)=>{
    const dp = dirMap[a.id]?.pago||0;
    return s+(a.contratos||[]).reduce((sc,c)=>sc+(c.valor_utilizado_brl||0),0)+dp;
  },0);
  const totalSald = taxaRel > 0
    ? rows.reduce((s,a) => s + ((a.orcamento_usd||0)*taxaRel) - ((a.contratos||[]).reduce((sc,c)=>sc+(c.valor_comprometido_brl||0),0) + (dirMap[a.id]?.comp||0)), 0)
    : rows.reduce((s,a)=>s+(a.contratos||[]).reduce((sc,c)=>sc+(c.saldo_brl||0),0),0);

  const badgeStatus = f => {
    const m = {A_INICIAR:'rb-cinza',ELABORACAO:'rb-ouro',LICITACAO:'rb-azul',ELABORADO:'rb-azul',CONTRATADO:'rb-verde',CONCLUIDO:'rb-teal'};
    const l = {A_INICIAR:'A Iniciar',ELABORACAO:'Elaboração',LICITACAO:'Licitação',ELABORADO:'Elaborado',CONTRATADO:'Contratado',CONCLUIDO:'Concluído'};
    return `<span class="rep-badge ${m[f]||'rb-cinza'}">${l[f]||f}</span>`;
  };

  const pct = (v,t) => t>0?(v/t*100).toFixed(1)+'%':'—';

  return `
  <div class="rep-stats rep-stats-4">
    <div class="rep-stat"><div class="rep-stat-lbl">Orçamento Total (USD)</div><div class="rep-stat-val">${fmtUSD(totalOrc)}</div><div class="rep-stat-sub">${rows.length} atividades</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Comprometido (BRL)</div><div class="rep-stat-val">${fmtBRL(totalComp)}</div><div class="rep-stat-sub">Em contratos ativos</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Pago (BRL)</div><div class="rep-stat-val">${fmtBRL(totalPago)}</div><div class="rep-stat-sub">${pct(totalPago,totalComp)} do comprometido</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Saldo Disponível (BRL)</div><div class="rep-stat-val">${fmtBRL(totalSald)}</div><div class="rep-stat-sub">Saldo em contratos</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">◈ Execução por Atividade</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Código</th><th>Atividade</th><th>Resultado</th><th>Fase</th>
        <th style="text-align:right">Orç. (USD)</th>
        <th style="text-align:right">Comprometido</th>
        <th style="text-align:right">Pago</th>
        <th style="text-align:right">Saldo</th>
        <th style="min-width:80px">Execução</th>
      </tr></thead>
      <tbody>
      ${rows.map(a=>{
        const comp = (a.contratos||[]).reduce((s,c)=>s+(c.valor_comprometido_brl||0),0) + (dirMap[a.id]?.comp||0);
        const pago = (a.contratos||[]).reduce((s,c)=>s+(c.valor_utilizado_brl||0),0) + (dirMap[a.id]?.pago||0);
        const sald = taxaRel > 0 ? ((a.orcamento_usd||0)*taxaRel) - comp : (a.contratos||[]).reduce((s,c)=>s+(c.saldo_brl||0),0);
        const pctExec = comp>0?(pago/comp*100):0;
        const cls = pctExec>80?'crit':pctExec>50?'warn':'';
        return `<tr>
          <td class="mono">${a.codigo}</td>
          <td>${a.nome_pt}</td>
          <td><span class="rep-badge rb-verde">R${a.resultado?.codigo||'?'}</span></td>
          <td>${badgeStatus(a.fase)}</td>
          <td class="mono" style="text-align:right">${fmtUSD(a.orcamento_usd)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(comp)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(pago)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(sald)}</td>
          <td><div class="rep-barra"><div class="rep-barra-fill ${cls}" style="width:${Math.min(100,pctExec).toFixed(0)}%"></div></div><div class="mono-sm" style="margin-top:2px">${pct(pago,comp)}</div></td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr>
        <td colspan="4"><strong>TOTAL GERAL</strong></td>
        <td class="mono" style="text-align:right">${fmtUSD(totalOrc)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totalComp)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totalPago)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totalSald)}</td>
        <td></td>
      </tr></tfoot>
    </table>
    ${taxaRel > 0 ? `<div style="font-size:10px;color:var(--cinza-500);margin-top:8px;text-align:right">* Saldo = Orçamento USD × R$ ${taxaRel.toFixed(4)} (cotação atual) − Comprometido BRL</div>` : ''}
  </div>`;
}

// ══════════════════════════════════════════════════════════════
// F2 — FLUXO DE CAIXA / VENCIMENTOS
// ══════════════════════════════════════════════════════════════
async function relF2(){
  const dias = parseInt(filVal('fil-horizonte')||'30');
  const hoje = new Date();
  const fim  = new Date(hoje); fim.setDate(fim.getDate()+dias);
  const fimStr = fim.toISOString().split('T')[0];
  const hojStr = hoje.toISOString().split('T')[0];

  const ativFil = filVal('fil-atividade');
  const fornFil = filVal('fil-fornecedor');

  let q = db.from('contratos_produtos')
    .select(`id,numero_produto,descricao,valor_brl,dt_vencimento,situacao,
      contrato:contratos(numero,objeto_pt,fornecedor:fornecedores(nome),atividade:atividades(codigo,nome_pt))`)
    .gte('dt_vencimento', hojStr)
    .lte('dt_vencimento', fimStr)
    .not('situacao','in','("pago","cancelado")')
    .order('dt_vencimento');

  const {data, error} = await q;
  if(error) throw error;

  let rows = data||[];
  if(ativFil) rows = rows.filter(r=>r.contrato?.atividade?.id===ativFil);
  if(fornFil) rows = rows.filter(r=>r.contrato?.fornecedor?.id===fornFil);

  const total = rows.reduce((s,r)=>s+(r.valor_brl||0),0);

  const sitBadge = s => {
    const m = {pendente:'rb-cinza',em_analise:'rb-ouro',aprovado:'rb-verde'};
    const l = {pendente:'Pendente',em_analise:'Em análise',aprovado:'Aprovado'};
    return `<span class="rep-badge ${m[s]||'rb-cinza'}">${l[s]||s}</span>`;
  };

  const diasAte = dt => {
    const d = Math.ceil((new Date(dt+' 12:00')-hoje)/(1000*60*60*24));
    return `<span class="${d<=7?'rep-badge rb-vermelho':d<=15?'rep-badge rb-ouro':''}">${d}d</span>`;
  };

  return `
  <div class="rep-stats rep-stats-3">

// P2 — ATRASOS NA ENTREGA
// ══════════════════════════════════════════════════════════════
async function relP2(){
  const hoje = new Date().toISOString().split('T')[0];
  const ativFil = filVal('fil-atividade');
  const fornFil = filVal('fil-fornecedor');

  const {data, error} = await db.from('contratos_produtos')
    .select(`*,contrato:contratos(numero,fornecedor:fornecedores(nome),atividade:atividades(codigo))`)
    .lt('dt_vencimento', hoje)
    .is('dt_entrega', null)
    .not('situacao','in','("pago","cancelado")')
    .order('dt_vencimento');
  if(error) throw error;
  let rows = data||[];
  if(ativFil) rows = rows.filter(r=>r.contrato?.atividade?.id===ativFil);
  if(fornFil) rows = rows.filter(r=>r.contrato?.fornecedor?.id===fornFil);

  const diasAtraso = dt => Math.ceil((new Date()-new Date(dt+' 12:00'))/(1000*60*60*24));
  const totalVal   = rows.reduce((s,r)=>s+(r.valor_brl||0),0);

  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Produtos em Atraso</div><div class="rep-stat-val" style="color:var(--erro)">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Valor em Risco</div><div class="rep-stat-val">${fmtBRL(totalVal)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Atraso Médio</div><div class="rep-stat-val">${rows.length>0?Math.round(rows.reduce((s,r)=>s+diasAtraso(r.dt_vencimento),0)/rows.length):0} dias</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">🚨 Produtos com Atraso na Entrega</div>
    ${rows.length===0?`<div style="padding:24px;text-align:center;color:var(--cinza-400)">Nenhum produto em atraso.</div>`:`
    <table class="rep-tbl">
      <thead><tr>
        <th>Produto</th><th>Contrato</th><th>Fornecedor</th><th>Atividade</th>
        <th>Vencimento</th><th>Dias em Atraso</th>
        <th style="text-align:right">Valor</th><th>Situação</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td>${r.descricao||'—'}</td>
        <td class="mono">${r.contrato?.numero||'—'}</td>
        <td>${r.contrato?.fornecedor?.nome||'—'}</td>
        <td class="mono">${r.contrato?.atividade?.codigo||'—'}</td>
        <td class="mono">${fmtDt(r.dt_vencimento)}</td>
        <td><span class="rep-badge ${diasAtraso(r.dt_vencimento)>30?'rb-vermelho':'rb-ouro'}">${diasAtraso(r.dt_vencimento)} dias</span></td>
        <td class="mono" style="text-align:right">${fmtBRL(r.valor_brl)}</td>
        <td><span class="rep-badge rb-cinza">${r.situacao}</span></td>
      </tr>`).join('')}
      </tbody>
    </table>`}
  </div>`;
}

// A1 — EXECUÇÃO POR ATIVIDADE
// ══════════════════════════════════════════════════════════════
async function relA1(){
  const resFil  = filVal('fil-resultado');
  const faseFil = filVal('fil-fase');

  let q = db.from('atividades')
    .select(`*,resultado:resultados(codigo,nome_pt),
      responsaveis:atividade_responsaveis(usuario:usuarios!usuario_id(nome_completo)),
      tdrs(id,status,valor_brl),
      contratos(valor_total_brl,valor_utilizado_brl,saldo_brl,status)`)
    .order('codigo');
  if(faseFil) q = q.eq('fase', faseFil);

  const {data, error} = await q;
  if(error) throw error;
  let rows = data||[];
  if(resFil) rows = rows.filter(a=>a.resultado?.codigo==resFil);

  const faseLabel = {A_INICIAR:'A Iniciar',ELABORACAO:'Elaboração',LICITACAO:'Licitação',ELABORADO:'Elaborado',CONTRATADO:'Contratado',CONCLUIDO:'Concluído'};
  const faseClass = {A_INICIAR:'rb-cinza',ELABORACAO:'rb-ouro',LICITACAO:'rb-azul',ELABORADO:'rb-azul',CONTRATADO:'rb-verde',CONCLUIDO:'rb-teal'};

  return `
  <div class="rep-secao">
    <div class="rep-secao-titulo">◈ Atividades — Execução e Fase</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Código</th><th>Atividade</th><th>Res.</th><th>Fase</th>
        <th>Responsável</th>
        <th style="text-align:right">Orç. USD</th>
        <th style="text-align:right">Pago BRL</th>
        <th style="text-align:right">Saldo BRL</th>
        <th style="text-align:center">TDRs</th>
      </tr></thead>
      <tbody>
      ${rows.map(a=>{
        const seen=new Set();
        const contratos=(a.contratos||[]).filter(c=>{const k=c.valor_total_brl+'';if(seen.has(k))return false;seen.add(k);return true;});
        const pago=contratos.reduce((s,c)=>s+(c.valor_utilizado_brl||0),0);
        const saldo=contratos.reduce((s,c)=>s+(c.saldo_brl||0),0);
        const resps=[...new Set((a.responsaveis||[]).map(r=>r.usuario?.nome_completo).filter(Boolean))];
        const tdrsAprov=(a.tdrs||[]).filter(t=>t.status==='aprovado').length;
        return `<tr>
          <td class="mono">${a.codigo}</td>
          <td>${a.nome_pt}</td>
          <td><span class="rep-badge rb-verde">R${a.resultado?.codigo||'?'}</span></td>
          <td><span class="rep-badge ${faseClass[a.fase]||'rb-cinza'}">${faseLabel[a.fase]||a.fase}</span></td>
          <td style="font-size:10px">${resps.join(', ')||'—'}</td>
          <td class="mono" style="text-align:right">${fmtUSD(a.orcamento_usd)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(pago)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(saldo)}</td>
          <td class="mono" style="text-align:center">${tdrsAprov}/${(a.tdrs||[]).length}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>`;
}

// Vi1 — PROTOCOLOS DE VIAGEM
// ══════════════════════════════════════════════════════════════
async function relVi1(){
  const dtIni  = filVal('fil-dt-ini');
  const dtFim  = filVal('fil-dt-fim');
  const stFil  = filVal('fil-status-viagem');
  const protFil = filVal('fil-protocolo-viagem');

  let q = db.from('viagem_protocolos')
    .select(`*,viajantes:viagem_viajantes(*,trechos:viagem_trechos(*),diarias:viagem_diarias_v2(*))`)
    .order('dt_saida',{ascending:false});
  if(dtIni)   q = q.gte('dt_saida', dtIni);
  if(dtFim)   q = q.lte('dt_saida', dtFim);
  if(stFil)   q = q.eq('situacao', stFil);
  if(protFil) q = q.eq('id', protFil);

  const {data, error} = await q;
  if(error) throw error;

  const rows = (data||[]).map(p=>{
    const seenV=new Set();
    const viajantes=(p.viajantes||[]).filter(v=>{if(seenV.has(v.id))return false;seenV.add(v.id);return true;});
    const total=viajantes.reduce((s,v)=>{
      const seenT=new Set(), seenD=new Set();
      const pass=(v.trechos||[]).filter(t=>{if(seenT.has(t.id))return false;seenT.add(t.id);return true;})
        .reduce((st,t)=>st+parseFloat(t.valor||0),0);
      const diar=(v.diarias||[]).filter(d=>{if(seenD.has(d.id))return false;seenD.add(d.id);return true;})
        .reduce((sd,d)=>sd+parseFloat(d.valor_unitario||0)*parseFloat(d.quantidade||d.qtd_dias||0),0);
      return s+pass+diar;
    },0);
    return {...p, viajantes, _total:total};
  });

  const totalGeral = rows.reduce((s,r)=>s+r._total,0);
  const stBadge = s=>{const m={rascunho:'rb-cinza',solicitado:'rb-ouro',aprovado:'rb-verde',pago:'rb-teal',cancelado:'rb-vermelho'};return`<span class="rep-badge ${m[s]||'rb-cinza'}">${s}</span>`;};

  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Total Protocolos</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Viajantes</div><div class="rep-stat-val">${rows.reduce((s,r)=>s+r.viajantes.length,0)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Estimado</div><div class="rep-stat-val">${fmtBRL(totalGeral)}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">✈ Protocolos de Viagem</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Número</th><th>Objetivo / Destino</th>
        <th>Saída</th><th>Retorno</th>
        <th style="text-align:center">Viajantes</th>
        <th style="text-align:right">Total Est.</th>
        <th>Situação</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td class="mono">${r.numero||'—'}</td>
        <td>${r.objetivo||r.destino_principal||'—'}</td>
        <td class="mono">${fmtDt(r.dt_saida)}</td>
        <td class="mono">${fmtDt(r.dt_retorno)}</td>
        <td class="mono" style="text-align:center">${r.viajantes.length}</td>
        <td class="mono" style="text-align:right">${fmtBRL(r._total)}</td>
        <td>${stBadge(r.situacao)}</td>
      </tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="5"><strong>TOTAL GERAL</strong></td><td class="mono" style="text-align:right">${fmtBRL(totalGeral)}</td><td></td></tr></tfoot>
    </table>
  </div>`;
}

// F4 — EVOLUÇÃO DA COTAÇÃO USD
// ══════════════════════════════════════════════════════════════
async function relF4(){
  const dtIni = filVal('fil-dt-ini');
  const dtFim = filVal('fil-dt-fim');
  let q = db.from('cotacoes_usd').select('id,cotacao,cotacao_anterior,variacao_pct,data_ref,fonte').order('data_ref',{ascending:true});
  if(dtIni) q = q.gte('data_ref', dtIni);
  if(dtFim) q = q.lte('data_ref', dtFim);
  const {data, error} = await q;
  if(error) throw error;
  const rows = data||[];
  const ult = rows[rows.length-1];
  const prim = rows[0];
  const varAcum = (ult&&prim&&prim.cotacao>0)?((ult.cotacao-prim.cotacao)/prim.cotacao*100):0;
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Registros no Período</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Cotação Atual</div><div class="rep-stat-val">${ult?Number(ult.cotacao).toFixed(4):'—'}</div><div class="rep-stat-sub">${ult?fmtDt(ult.data_ref):''}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Variação Acumulada</div><div class="rep-stat-val" style="color:${varAcum>=0?'var(--sucesso)':'var(--erro)'}">${varAcum>=0?'+':''}${varAcum.toFixed(2)}%</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">📈 Histórico da Cotação USD</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Data Ref.</th><th>Cotação (BRL/USD)</th><th>Anterior</th><th>Variação</th><th>Fonte</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>{
        const v=parseFloat(r.variacao_pct||0);
        return `<tr>
          <td class="mono">${fmtDt(r.data_ref)}</td>
          <td class="mono" style="font-weight:600">${Number(r.cotacao).toFixed(4)}</td>
          <td class="mono">${r.cotacao_anterior?Number(r.cotacao_anterior).toFixed(4):'—'}</td>
          <td><span class="rep-badge ${v>0?'rb-vermelho':v<0?'rb-verde':'rb-cinza'}">${v>=0?'+':''}${v.toFixed(2)}%</span></td>
          <td style="font-size:10px">${r.fonte||'—'}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>`;
}

// F5 — SALDO POR ATIVIDADE
// ══════════════════════════════════════════════════════════════
async function relF5(){
  const ativFil = filVal('fil-atividade');
  const resFil  = filVal('fil-resultado');
  const faseFil = filVal('fil-fase');
  let q = db.from('atividades').select(`id,codigo,nome_pt,orcamento_usd,fase,resultado:resultados(codigo),contratos(valor_total_brl,valor_comprometido_brl,valor_utilizado_brl,saldo_brl,status)`).order('codigo');
  if(faseFil) q = q.eq('fase',faseFil);
  if(ativFil) q = q.eq('id',ativFil);
  const {data, error} = await q;
  if(error) throw error;
  let rows = data||[];
  if(resFil) rows = rows.filter(a=>a.resultado?.codigo==resFil);
  rows = rows.map(a=>{
    const seen=new Set();
    return {...a,contratos:(a.contratos||[]).filter(c=>{const k=c.valor_total_brl+'';if(seen.has(k))return false;seen.add(k);return true;})};
  });
  const totOrc  = rows.reduce((s,a)=>s+(a.orcamento_usd||0),0);
  const totComp = rows.reduce((s,a)=>(a.contratos||[]).reduce((sc,c)=>sc+(c.valor_comprometido_brl||0),0)+s,0);
  const totPago = rows.reduce((s,a)=>(a.contratos||[]).reduce((sc,c)=>sc+(c.valor_utilizado_brl||0),0)+s,0);
  const totSald = rows.reduce((s,a)=>(a.contratos||[]).reduce((sc,c)=>sc+(c.saldo_brl||0),0)+s,0);
  return `
  <div class="rep-stats rep-stats-4">
    <div class="rep-stat"><div class="rep-stat-lbl">Orçamento Total (USD)</div><div class="rep-stat-val">${fmtUSD(totOrc)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Comprometido (BRL)</div><div class="rep-stat-val">${fmtBRL(totComp)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Pago (BRL)</div><div class="rep-stat-val">${fmtBRL(totPago)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Saldo Livre (BRL)</div><div class="rep-stat-val">${fmtBRL(totSald)}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">⚖️ Saldo por Atividade</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Código</th><th>Atividade</th><th>Res.</th><th>Fase</th>
        <th style="text-align:right">Orç. USD</th>
        <th style="text-align:right">Comprometido</th>
        <th style="text-align:right">Pago</th>
        <th style="text-align:right">Saldo</th>
      </tr></thead>
      <tbody>
      ${rows.map(a=>{
        const comp=(a.contratos||[]).reduce((s,c)=>s+(c.valor_comprometido_brl||0),0);
        const pago=(a.contratos||[]).reduce((s,c)=>s+(c.valor_utilizado_brl||0),0);
        const sald=(a.contratos||[]).reduce((s,c)=>s+(c.saldo_brl||0),0);
        const faseL={A_INICIAR:'A Iniciar',ELABORACAO:'Elaboração',LICITACAO:'Licitação',ELABORADO:'Elaborado',CONTRATADO:'Contratado',CONCLUIDO:'Concluído'};
        const faseC={A_INICIAR:'rb-cinza',ELABORACAO:'rb-ouro',LICITACAO:'rb-azul',ELABORADO:'rb-azul',CONTRATADO:'rb-verde',CONCLUIDO:'rb-teal'};
        return `<tr>
          <td class="mono">${a.codigo}</td>
          <td>${a.nome_pt}</td>
          <td><span class="rep-badge rb-verde">R${a.resultado?.codigo||'?'}</span></td>
          <td><span class="rep-badge ${faseC[a.fase]||'rb-cinza'}">${faseL[a.fase]||a.fase}</span></td>
          <td class="mono" style="text-align:right">${fmtUSD(a.orcamento_usd)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(comp)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(pago)}</td>
          <td class="mono" style="text-align:right;font-weight:${sald<0?'700':'400'};color:${sald<0?'var(--erro)':'inherit'}">${fmtBRL(sald)}</td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr>
        <td colspan="4"><strong>TOTAL</strong></td>
        <td class="mono" style="text-align:right">${fmtUSD(totOrc)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totComp)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totPago)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totSald)}</td>
      </tr></tfoot>
    </table>
  </div>`;
}

// F6 — INADIMPLÊNCIA / ATRASOS
// ══════════════════════════════════════════════════════════════
async function relF6(){
  const hoje = new Date().toISOString().split('T')[0];
  const ativFil = filVal('fil-atividade');
  const fornFil = filVal('fil-fornecedor');
  const {data, error} = await db.from('contratos_produtos')
    .select(`*,contrato:contratos(numero,fornecedor:fornecedores(id,nome),atividade:atividades(id,codigo))`)
    .lt('dt_vencimento', hoje)
    .not('situacao','in','("pago","cancelado")')
    .order('dt_vencimento');
  if(error) throw error;
  let rows = data||[];
  if(ativFil) rows = rows.filter(r=>r.contrato?.atividade?.id===ativFil);
  if(fornFil) rows = rows.filter(r=>r.contrato?.fornecedor?.id===fornFil);
  const totalVal = rows.reduce((s,r)=>s+(r.valor_brl||0),0);
  const diasAt = dt=>Math.ceil((new Date()-new Date(dt+' 12:00'))/(864e5));
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Itens em Atraso/Inadimplentes</div><div class="rep-stat-val" style="color:var(--erro)">${rows.length}</div></div>

    <div class="rep-stat"><div class="rep-stat-lbl">Atraso Médio</div><div class="rep-stat-val">${rows.length?Math.round(rows.reduce((s,r)=>s+diasAt(r.dt_vencimento),0)/rows.length):0} dias</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">⚠️ Produtos com Pagamento em Atraso</div>
    ${rows.length===0?`<div style="padding:24px;text-align:center;color:var(--cinza-400)">Sem inadimplências no período.</div>`:`
    <table class="rep-tbl">
      <thead><tr>
        <th>Produto</th><th>Contrato</th><th>Fornecedor</th><th>Atividade</th>
        <th>Vencimento</th><th>Dias em Atraso</th>
        <th style="text-align:right">Valor</th><th>Situação</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td>${r.descricao||'—'}</td>
        <td class="mono">${r.contrato?.numero||'—'}</td>
        <td>${r.contrato?.fornecedor?.nome||'—'}</td>
        <td class="mono">${r.contrato?.atividade?.codigo||'—'}</td>
        <td class="mono">${fmtDt(r.dt_vencimento)}</td>
        <td><span class="rep-badge ${diasAt(r.dt_vencimento)>60?'rb-vermelho':diasAt(r.dt_vencimento)>30?'rb-ouro':'rb-cinza'}">${diasAt(r.dt_vencimento)}d</span></td>
        <td class="mono" style="text-align:right">${fmtBRL(r.valor_brl)}</td>
        <td><span class="rep-badge rb-cinza">${r.situacao}</span></td>
      </tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="6"><strong>TOTAL</strong></td><td class="mono" style="text-align:right">${fmtBRL(totalVal)}</td><td></td></tr></tfoot>
    </table>`}
  </div>`;
}

// C2 — CONTRATOS PRÓXIMOS DO VENCIMENTO
// ══════════════════════════════════════════════════════════════
async function relC2(){
  const dias = parseInt(filVal('fil-horizonte')||'30');
  const hoje = new Date();
  const fim  = new Date(hoje); fim.setDate(fim.getDate()+dias);
  const hojStr = hoje.toISOString().split('T')[0];
  const fimStr = fim.toISOString().split('T')[0];
  const stFil  = filVal('fil-status-contrato');
  let q = db.from('contratos')
    .select(`*,fornecedor:fornecedores(nome),atividade:atividades(codigo)`)
    .gte('dt_fim', hojStr).lte('dt_fim', fimStr).order('dt_fim');
  if(stFil) q = q.eq('status', stFil);
  const {data, error} = await q;
  if(error) throw error;
  const rows = data||[];
  const diasAte = dt=>Math.ceil((new Date(dt+' 12:00')-hoje)/864e5);
  const stBadge = s=>{const m={vigente:'rb-verde',encerrado:'rb-cinza',suspenso:'rb-vermelho'};return`<span class="rep-badge ${m[s]||'rb-cinza'}">${s}</span>`;};
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Contratos a Vencer (${dias}d)</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Valor Total em Risco</div><div class="rep-stat-val">${fmtBRL(rows.reduce((s,r)=>s+(r.saldo_brl||0),0))}</div><div class="rep-stat-sub">saldo remanescente</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Prazo</div><div class="rep-stat-val" style="font-size:13px">${fmtDt(hojStr)} — ${fmtDt(fimStr)}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">🔔 Contratos com Encerramento Próximo</div>
    ${rows.length===0?`<div style="padding:24px;text-align:center;color:var(--cinza-400)">Nenhum contrato a vencer nos próximos ${dias} dias.</div>`:`
    <table class="rep-tbl">
      <thead><tr>
        <th>Número</th><th>Fornecedor</th><th>Atividade</th><th>Tipo</th>
        <th>Vencimento</th><th>Falta</th>
        <th style="text-align:right">Saldo BRL</th><th>Status</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>{const d=diasAte(r.dt_fim);return`<tr>
        <td class="mono">${r.numero||'—'}</td>
        <td>${r.fornecedor?.nome||'—'}</td>
        <td class="mono">${r.atividade?.codigo||'—'}</td>

        <td class="mono">${fmtDt(r.dt_fim)}</td>
        <td><span class="rep-badge ${d<=7?'rb-vermelho':d<=15?'rb-ouro':'rb-cinza'}">${d}d</span></td>
        <td class="mono" style="text-align:right">${fmtBRL(r.saldo_brl)}</td>
        <td>${stBadge(r.status)}</td>
      </tr>`;}).join('')}
      </tbody>
    </table>`}
  </div>`;
}

        const aPagar =prods.filter(p=>!['pago','cancelado'].includes(p.situacao)).reduce((s,p)=>s+(p.valor_brl||0),0);

          <td class="mono" style="text-align:right">${fmtBRL(cancel)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(c.saldo_brl)}</td>

        </tr>`;
      }).join('')}
      </tbody>
    </table>

}

// V2 — CONCENTRAÇÃO DE CONTRATOS
// ══════════════════════════════════════════════════════════════
async function relV2(){
  const tpFil = filVal('fil-tipo-forn');
  let q = db.from('fornecedores').select(`id,nome,tipo,ativo,contratos(valor_total_brl,status)`).order('nome');
  if(tpFil) q = q.eq('tipo', tpFil);
  const {data, error} = await q;
  if(error) throw error;
  const rows = (data||[]).map(f=>{
    const seen=new Set();
    const contratos=(f.contratos||[]).filter(c=>{const k=c.valor_total_brl+''+c.status;if(seen.has(k))return false;seen.add(k);return true;});
    const total=contratos.reduce((s,c)=>s+(c.valor_total_brl||0),0);
    return {...f,contratos,_total:total};
  }).filter(f=>f._total>0).sort((a,b)=>b._total-a._total);
  const totalGeral=rows.reduce((s,r)=>s+r._total,0);
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Fornecedores com Contrato</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Volume Total Contratado</div><div class="rep-stat-val">${fmtBRL(totalGeral)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Maior Concentração</div><div class="rep-stat-val" style="font-size:13px">${rows[0]?fmtPct1(rows[0]._total/totalGeral*100):'—'}</div><div class="rep-stat-sub">${rows[0]?.nome||''}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">📉 Concentração por Fornecedor</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>#</th><th>Fornecedor</th><th>Tipo</th>
        <th style="text-align:center">Contratos</th>
        <th style="text-align:right">Total Contratado</th>
        <th style="text-align:right">% do Total</th>
        <th style="min-width:80px">Participação</th>
      </tr></thead>
      <tbody>
      ${rows.map((r,i)=>{
        const pct=totalGeral>0?r._total/totalGeral*100:0;
        return `<tr>
          <td class="mono">${i+1}</td>
          <td style="font-weight:500">${r.nome}</td>
          <td><span class="rep-badge ${r.tipo==='PF'?'rb-azul':'rb-ouro'}">${r.tipo}</span></td>
          <td class="mono" style="text-align:center">${r.contratos.length}</td>
          <td class="mono" style="text-align:right">${fmtBRL(r._total)}</td>
          <td class="mono" style="text-align:right">${fmtPct1(pct)}</td>
          <td><div class="rep-barra"><div class="rep-barra-fill ${pct>40?'crit':pct>20?'warn':''}" style="width:${Math.min(100,pct).toFixed(0)}%"></div></div></td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr><td colspan="4"><strong>TOTAL</strong></td><td class="mono" style="text-align:right">${fmtBRL(totalGeral)}</td><td class="mono" style="text-align:right">100%</td><td></td></tr></tfoot>
    </table>
  </div>`;
}

// P4 — TEMPO DE AVALIAÇÃO
// ══════════════════════════════════════════════════════════════
async function relP4(){
  const dtIni = filVal('fil-dt-ini');
  const dtFim = filVal('fil-dt-fim');
  let q = db.from('contratos_produtos')
    .select(`*,contrato:contratos(numero,fornecedor:fornecedores(nome),atividade:atividades(codigo))`)
    .not('dt_entrega','is',null).not('avaliado_em','is',null)
    .order('avaliado_em',{ascending:false});
  if(dtIni) q = q.gte('avaliado_em', dtIni);
  if(dtFim) q = q.lte('avaliado_em', dtFim);
  const {data, error} = await q;
  if(error) throw error;
  const rows = (data||[]).map(r=>{
    const dias = r.dt_entrega&&r.avaliado_em
      ? Math.max(0,Math.ceil((new Date(r.avaliado_em)-new Date(r.dt_entrega+' 12:00'))/864e5))
      : null;
    return {...r,_dias:dias};
  });
  const comDias = rows.filter(r=>r._dias!=null);
  const media = comDias.length?Math.round(comDias.reduce((s,r)=>s+r._dias,0)/comDias.length):0;
  const maximo = comDias.length?Math.max(...comDias.map(r=>r._dias)):0;
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Produtos Avaliados</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Tempo Médio de Avaliação</div><div class="rep-stat-val">${media} dias</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Maior Prazo</div><div class="rep-stat-val">${maximo} dias</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">⏱️ Tempo entre Entrega e Avaliação</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>#</th><th>Descrição</th><th>Contrato</th><th>Fornecedor</th><th>Atividade</th>
        <th>Data Entrega</th><th>Data Avaliação</th><th style="text-align:right">Dias</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td class="mono">${r.numero_produto||'—'}</td>
        <td>${r.descricao||'—'}</td>
        <td class="mono">${r.contrato?.numero||'—'}</td>
        <td>${r.contrato?.fornecedor?.nome||'—'}</td>
        <td class="mono">${r.contrato?.atividade?.codigo||'—'}</td>
        <td class="mono">${fmtDt(r.dt_entrega)}</td>
        <td class="mono">${r.avaliado_em?new Date(r.avaliado_em).toLocaleDateString('pt-BR'):'—'}</td>
        <td style="text-align:right"><span class="rep-badge ${r._dias>15?'rb-vermelho':r._dias>7?'rb-ouro':'rb-verde'}">${r._dias!=null?r._dias+'d':'—'}</span></td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

async function relT2(){
  const dtIni = filVal('fil-dt-ini');
  const dtFim = filVal('fil-dt-fim');
  const tpFil = filVal('fil-tipo-tdr');
  let q = db.from('tdrs')
    .select(`id,numero,tipo,objeto_pt,status,criado_em,
      atividade:atividades(codigo),
      acoes:tdr_acoes(status_novo,criado_em)`)
    .not('status','eq','rascunho')
    .order('criado_em',{ascending:false});
  if(dtIni) q = q.gte('criado_em', dtIni);
  if(dtFim) q = q.lte('criado_em', dtFim);
  if(tpFil) q = q.eq('tipo', tpFil);
  const {data, error} = await q;
  if(error) throw error;
  const rows = (data||[]).map(t=>{
    const acoes=t.acoes||[];
    const dtEnv = acoes.find(a=>a.status_novo==='enviado_unesco')?.criado_em;
    const dtAprov = acoes.find(a=>a.status_novo==='aprovado')?.criado_em;
    const diasTotal = t.criado_em&&dtAprov?Math.ceil((new Date(dtAprov)-new Date(t.criado_em))/864e5):null;
    const diasAteEnvio = t.criado_em&&dtEnv?Math.ceil((new Date(dtEnv)-new Date(t.criado_em))/864e5):null;
    return {...t,dtEnv,dtAprov,diasTotal,diasAteEnvio};
  });
  const comAprov = rows.filter(r=>r.diasTotal!=null);
  const media = comAprov.length?Math.round(comAprov.reduce((s,r)=>s+r.diasTotal,0)/comAprov.length):0;

  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">TDRs Analisados</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Aprovados com Tempo Medido</div><div class="rep-stat-val">${comAprov.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Tempo Médio Total</div><div class="rep-stat-val">${media} dias</div><div class="rep-stat-sub">criação → aprovação</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">⏳ Tempo de Tramitação por TDR</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Número</th><th>Objeto</th><th>Tipo</th><th>Atividade</th>
        <th>Criado em</th><th>Enviado UNESCO</th><th>Aprovado em</th>
        <th style="text-align:right">Dias (Total)</th><th>Status</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td class="mono">${r.numero||'—'}</td>
        <td>${r.objeto_pt||'—'}</td>
        <td><span class="rep-badge rb-azul">${r.tipo||'—'}</span></td>
        <td class="mono">${r.atividade?.codigo||'—'}</td>
        <td class="mono">${r.criado_em?new Date(r.criado_em).toLocaleDateString('pt-BR'):'—'}</td>
        <td class="mono">${r.dtEnv?new Date(r.dtEnv).toLocaleDateString('pt-BR'):'—'}</td>
        <td class="mono">${r.dtAprov?new Date(r.dtAprov).toLocaleDateString('pt-BR'):'—'}</td>
        <td style="text-align:right"><span class="rep-badge ${r.diasTotal!=null?(r.diasTotal>60?'rb-vermelho':r.diasTotal>30?'rb-ouro':'rb-verde'):'rb-cinza'}">${r.diasTotal!=null?r.diasTotal+'d':'—'}</span></td>
        <td><span class="rep-badge ${stClass[r.status]||'rb-cinza'}">${stLabel[r.status]||r.status}</span></td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

// A3 — CONCENTRAÇÃO POR RESPONSÁVEL
// ══════════════════════════════════════════════════════════════
async function relA3(){
  const {data, error} = await db.from('atividades')
    .select(`id,codigo,nome_pt,orcamento_usd,fase,
      responsaveis:atividade_responsaveis(usuario:usuarios!usuario_id(id,nome_completo))`)
    .order('codigo');
  if(error) throw error;
  const rows = data||[];
  const mapa = {};
  rows.forEach(a=>{
    const resps=[...new Set((a.responsaveis||[]).map(r=>r.usuario?.nome_completo).filter(Boolean))];
    if(!resps.length){
      const k='— Sem Responsável';
      if(!mapa[k]) mapa[k]={nome:k,qtd:0,orc:0,atividades:[]};
      mapa[k].qtd++; mapa[k].orc+=(a.orcamento_usd||0); mapa[k].atividades.push(a.codigo);
    } else {
      resps.forEach(nome=>{
        if(!mapa[nome]) mapa[nome]={nome,qtd:0,orc:0,atividades:[]};
        mapa[nome].qtd++; mapa[nome].orc+=(a.orcamento_usd||0); mapa[nome].atividades.push(a.codigo);
      });
    }
  });
  const lista = Object.values(mapa).sort((a,b)=>b.qtd-a.qtd);
  const totQtd = lista.reduce((s,r)=>s+r.qtd,0);
  const totOrc = lista.reduce((s,r)=>s+r.orc,0);
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Técnicos Responsáveis</div><div class="rep-stat-val">${lista.filter(r=>r.nome!=='— Sem Responsável').length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Atividades Totais</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Orçamento Total (USD)</div><div class="rep-stat-val">${fmtUSD(totOrc)}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">👤 Concentração por Responsável</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Responsável</th>
        <th style="text-align:center">Atividades</th>
        <th style="text-align:right">Orçamento (USD)</th>
        <th style="text-align:right">% Atividades</th>
        <th style="min-width:90px">Distribuição</th>
        <th>Atividades</th>
      </tr></thead>
      <tbody>
      ${lista.map(r=>{
        const pct=totQtd>0?r.qtd/totQtd*100:0;
        return `<tr>
          <td style="font-weight:500">${r.nome}</td>
          <td class="mono" style="text-align:center">${r.qtd}</td>
          <td class="mono" style="text-align:right">${fmtUSD(r.orc)}</td>
          <td class="mono" style="text-align:right">${fmtPct1(pct)}</td>
          <td><div class="rep-barra"><div class="rep-barra-fill ${pct>40?'crit':pct>25?'warn':''}" style="width:${Math.min(100,pct).toFixed(0)}%"></div></div></td>
          <td style="font-size:10px;font-family:var(--font-mono)">${r.atividades.join(', ')}</td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr>
        <td><strong>TOTAL</strong></td>
        <td class="mono" style="text-align:center">${totQtd}</td>
        <td class="mono" style="text-align:right">${fmtUSD(totOrc)}</td>
        <td colspan="3"></td>
      </tr></tfoot>
    </table>
  </div>`;
}

          <td class="mono" style="text-align:right">${real.toLocaleString('pt-BR')} ${i.unidade||''}</td>
