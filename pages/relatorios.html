// ══════════════════════════════════════════════════════════════
// Vi2 — GASTO POR VIAJANTE
// ══════════════════════════════════════════════════════════════
async function relVi2(){
  const dtIni    = filVal('fil-dt-ini');
  const dtFim    = filVal('fil-dt-fim');
  const viaFil   = filVal('fil-viajante-viagem');

  let q = db.from('viagem_protocolos')
    .select(`*,atividade:atividades(id,codigo,nome_pt,orcamento_usd),viajantes:viagem_viajantes(*,trechos:viagem_trechos(*),diarias:viagem_diarias_v2(*))`)
    .order('dt_saida',{ascending:false});
  if(dtIni) q = q.gte('dt_saida', dtIni);
  if(dtFim) q = q.lte('dt_saida', dtFim);
  const [{data, error}, qCot] = await Promise.all([q, db.from('cotacoes_usd').select('cotacao').order('data_ref',{ascending:false}).limit(1)]);
  if(error) throw error;

  const cotacao = parseFloat(qCot.data?.[0]?.cotacao||1);

  // Queries separadas para contratos + lançamentos diretos (mesmo padrão do financeiro)
  const ativIds = [...new Set((data||[]).map(p=>p.atividade_id).filter(Boolean))];
  const [{ data:ativData }, { data:dirDataV2 }] = ativIds.length
    ? await Promise.all([
        db.from('atividades').select('id,orcamento_usd,contratos(valor_comprometido_brl,valor_utilizado_brl)').in('id',ativIds),
        db.from('execucao_financeira').select('atividade_id,valor_brl,situacao').in('atividade_id',ativIds).is('contrato_id',null).neq('situacao','cancelado')
      ])
    : [{data:[]},{data:[]}];

  // Índice atividade_id → { saldoBRL, orcBRL }
  const ativSaldo = {};
  (ativData||[]).forEach(a=>{
    const orcBRL       = parseFloat(a.orcamento_usd||0)*cotacao;
    const comprometido = (a.contratos||[]).reduce((s,c)=>s+parseFloat(c.valor_comprometido_brl||0),0);
    ativSaldo[a.id]    = { orcBRL, comprometido };
  });
  (dirDataV2||[]).forEach(l=>{
    if(!ativSaldo[l.atividade_id]) ativSaldo[l.atividade_id]={orcBRL:0,comprometido:0};
    ativSaldo[l.atividade_id].comprometido += parseFloat(l.valor_brl||0);
  });
  Object.values(ativSaldo).forEach(a=>{ a.saldoBRL = Math.max(0, a.orcBRL - a.comprometido); });

  // mapa[nome] = { nome, totalPass, totalDiar, itens:[{prot, viajante}] }
  const mapa = {};
  const viaFil_lc = viaFil?.toLowerCase();
  (data||[]).forEach(p=>{
    const seenV=new Set();
    (p.viajantes||[])
      .filter(v=>{ if(seenV.has(v.id)) return false; seenV.add(v.id); return true; })
      .filter(v=>!viaFil_lc||(v.nome||'').toLowerCase()===viaFil_lc)
      .forEach(v=>{
        const nome = v.nome||'Sem Nome';
        if(!mapa[nome]) mapa[nome]={nome,totalPass:0,totalDiar:0,itens:[]};
        const seenT=new Set(), seenD=new Set();
        const trechos = (v.trechos||[]).filter(t=>{ if(seenT.has(t.id)) return false; seenT.add(t.id); return true; });
        const diarias = (v.diarias||[]).filter(d=>{ if(seenD.has(d.id)) return false; seenD.add(d.id); return true; });
        const vPass = trechos.reduce((s,t)=>s+parseFloat(t.valor||0),0);
        const vDiar = diarias.reduce((s,d)=>s+parseFloat(d.quantidade||d.qtd_dias||0)*parseFloat(d.valor_unitario||0),0);
        mapa[nome].totalPass += vPass;
        mapa[nome].totalDiar += vDiar;
        mapa[nome].itens.push({prot:p, viajante:v, trechos, diarias, vPass, vDiar});
      });
  });

  const SIT_BADGE_V2  = {rascunho:'rb-cinza',solicitado:'rb-ouro',aprovado:'rb-verde',em_prestacao:'rb-teal',realizado:'rb-azul',cancelado:'rb-vermelho',rejeitado:'rb-vermelho'};
  const SIT_LABELS_V2 = {rascunho:'Rascunho',solicitado:'Solicitado',aprovado:'Aprovado',em_prestacao:'Em Prestação',realizado:'Realizado',cancelado:'Cancelado',rejeitado:'Rejeitado'};

  const lista = Object.values(mapa).sort((a,b)=>(b.totalPass+b.totalDiar)-(a.totalPass+a.totalDiar));
  const totPass = lista.reduce((s,r)=>s+r.totalPass,0);
  const totDiar = lista.reduce((s,r)=>s+r.totalDiar,0);

  const detalhesPorViajante = lista.map(r=>{
    const protRows = r.itens.map(({prot:p, trechos, diarias, vPass, vDiar})=>{
      const tStr = trechos.length
        ? trechos.map(t=>`<div>${esc(t.origem||'?')}→${esc(t.destino||'?')} <span style="color:var(--cinza-400)">(${esc(t.tipo||'—')}, ${fmtDt(t.dt_saida)})</span> <span class="mono">${fmtBRL(t.valor||0)}</span></div>`).join('')
        : '<span style="color:var(--cinza-400)">—</span>';
      const dStr = diarias.length
        ? diarias.map(d=>`<div>${esc(d.tipo_diaria||d.tipo||'—')}: ${d.quantidade||d.qtd_dias||0}d × ${fmtBRL(d.valor_unitario||0)}</div>`).join('')
        : '<span style="color:var(--cinza-400)">—</span>';

      const saldoAtv  = p.atividade_id ? ativSaldo[p.atividade_id] : null;
      const saldoBRL  = saldoAtv?.saldoBRL ?? 0;
      const gastoViaj = vPass + vDiar;
      const pctAtiv   = saldoBRL > 0 ? gastoViaj / saldoBRL * 100 : null;
      const pctCor    = pctAtiv === null ? '' : pctAtiv >= 30 ? '#DC2626' : pctAtiv >= 15 ? '#D97706' : '#059669';
      const pctHtml   = pctAtiv === null
        ? '<span style="color:var(--cinza-400)">—</span>'
        : `<div style="display:flex;flex-direction:column;gap:3px;min-width:80px">
            <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${pctCor}">${fmtPct1(pctAtiv)}</div>
            <div style="font-size:9px;color:var(--cinza-500)">de ${fmtBRL(saldoBRL)}</div>
            <div class="rep-barra"><div class="rep-barra-fill" style="width:${Math.min(100,pctAtiv).toFixed(0)}%;background:${pctCor}"></div></div>
           </div>`;
      const ativHtml  = p.atividade
        ? `<span style="font-size:9px;background:var(--cinza-100);padding:2px 5px;border-radius:3px;font-family:var(--font-mono)">${esc(p.atividade.codigo)}</span>`
        : '<span style="color:var(--cinza-400)">—</span>';

      return `<tr>
        <td><span style="font-family:var(--font-mono);font-size:10px;background:#D1FAE5;color:#065F46;padding:2px 6px;border-radius:3px">${esc(p.numero||'—')}</span></td>
        <td>${esc(p.numero_sei||'—')}</td>
        <td>${esc(p.objetivo||p.destino_principal||'—')}</td>
        <td class="mono">${fmtDt(p.dt_saida)}</td>
        <td class="mono">${fmtDt(p.dt_retorno)}</td>
        <td><span class="rep-badge ${SIT_BADGE_V2[p.situacao]||'rb-cinza'}">${SIT_LABELS_V2[p.situacao]||p.situacao}</span></td>
        <td style="font-size:10px">${tStr}</td>
        <td class="mono" style="text-align:right">${fmtBRL(vPass)}</td>
        <td style="font-size:10px">${dStr}</td>
        <td class="mono" style="text-align:right">${fmtBRL(vDiar)}</td>
        <td class="mono" style="text-align:right;font-weight:600">${fmtBRL(vPass+vDiar)}</td>
        <td>${ativHtml}</td>
        <td>${pctHtml}</td>
      </tr>`;
    }).join('');

    const tot = r.totalPass+r.totalDiar;
    return `
    <div style="border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:20px;overflow:hidden;page-break-inside:avoid">
      <div style="background:var(--cinza-50);border-bottom:1px solid var(--borda);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:700;color:var(--cinza-900);flex:1">${esc(r.nome)}</span>
        <span style="font-size:11px;color:var(--cinza-500)">${r.itens.length} protocolo${r.itens.length!==1?'s':''}</span>
        <span class="mono" style="font-size:11px;color:var(--cinza-600)">Pass: ${fmtBRL(r.totalPass)}</span>
        <span class="mono" style="font-size:11px;color:var(--cinza-600)">Diárias: ${fmtBRL(r.totalDiar)}</span>
        <span class="mono" style="font-size:12px;font-weight:700;color:var(--verde-medio)">Total: ${fmtBRL(tot)}</span>
      </div>
      <table class="rep-tbl" style="margin-bottom:0">
        <thead><tr>
          <th>Protocolo</th><th>SEI</th><th>Objetivo / Destino</th>
          <th>Saída</th><th>Retorno</th><th>Situação</th>
          <th>Trechos</th><th style="text-align:right">Passagens</th>
          <th>Diárias</th><th style="text-align:right">Total Diárias</th>
          <th style="text-align:right">Total</th>
          <th>Atividade</th><th>% Orçamento</th>
        </tr></thead>
        <tbody>${protRows}</tbody>
        <tfoot><tr>
          <td colspan="7"><strong>TOTAL — ${esc(r.nome)}</strong></td>
          <td class="mono" style="text-align:right">${fmtBRL(r.totalPass)}</td>
          <td></td>
          <td class="mono" style="text-align:right">${fmtBRL(r.totalDiar)}</td>
          <td class="mono" style="text-align:right;font-weight:700">${fmtBRL(tot)}</td>
          <td colspan="2"></td>
        </tr></tfoot>
      </table>
    </div>`;
  }).join('');

  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Viajantes no Período</div><div class="rep-stat-val">${lista.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Passagens</div><div class="rep-stat-val">${fmtBRL(totPass)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Diárias</div><div class="rep-stat-val">${fmtBRL(totDiar)}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">Resumo por Viajante</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>#</th><th>Viajante</th>
        <th style="text-align:center">Protocolos</th>
        <th style="text-align:right">Passagens</th>
        <th style="text-align:right">Diárias</th>
        <th style="text-align:right">Total</th>
        <th style="min-width:80px">%</th>
      </tr></thead>
      <tbody>
      ${lista.map((r,i)=>{
        const tot=r.totalPass+r.totalDiar;
        const pct=(totPass+totDiar)>0?tot/(totPass+totDiar)*100:0;
        return `<tr>
          <td class="mono">${i+1}</td>
          <td style="font-weight:500">${esc(r.nome)}</td>
          <td class="mono" style="text-align:center">${r.itens.length}</td>
          <td class="mono" style="text-align:right">${fmtBRL(r.totalPass)}</td>
          <td class="mono" style="text-align:right">${fmtBRL(r.totalDiar)}</td>
          <td class="mono" style="text-align:right;font-weight:600">${fmtBRL(tot)}</td>
          <td><div class="rep-barra"><div class="rep-barra-fill" style="width:${Math.min(100,pct).toFixed(0)}%"></div></div><div class="mono-sm">${fmtPct1(pct)}</div></td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr>
        <td colspan="3"><strong>TOTAL</strong></td>
        <td class="mono" style="text-align:right">${fmtBRL(totPass)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totDiar)}</td>
        <td class="mono" style="text-align:right">${fmtBRL(totPass+totDiar)}</td>
        <td></td>
      </tr></tfoot>
    </table>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">Detalhamento por Viajante</div>
    ${detalhesPorViajante}
  </div>`;
}

// ══════════════════════════════════════════════════════════════
// Vi3 — GASTO POR ATIVIDADE
// ══════════════════════════════════════════════════════════════
async function relVi3(){
  const dtIni   = filVal('fil-dt-ini');
  const dtFim   = filVal('fil-dt-fim');
  const ativFil = filVal('fil-atividade');

  // Query 1: protocolos com viajantes (sem tentar aninhar contratos)
  let q = db.from('viagem_protocolos')
    .select(`id,numero,dt_saida,atividade_id,situacao,
      atividade:atividades(id,codigo,nome_pt,orcamento_usd),
      viajantes:viagem_viajantes(*,trechos:viagem_trechos(*),diarias:viagem_diarias_v2(*))`)
    .order('dt_saida',{ascending:false});
  if(dtIni)   q = q.gte('dt_saida', dtIni);
  if(dtFim)   q = q.lte('dt_saida', dtFim);
  if(ativFil) q = q.eq('atividade_id', ativFil);

  const [{data,error}, qCot] = await Promise.all([
    q,
    db.from('cotacoes_usd').select('cotacao').order('data_ref',{ascending:false}).limit(1)
  ]);
  if(error) throw error;

  const cotacao = parseFloat(qCot.data?.[0]?.cotacao||1);

  // Coletar IDs únicos das atividades presentes nos protocolos
  const ativIds = [...new Set((data||[]).map(p=>p.atividade_id).filter(Boolean))];

  // Queries paralelas: contratos + lançamentos diretos (execucao_financeira sem contrato)
  const [{ data:ativData }, { data:dirData }] = ativIds.length
    ? await Promise.all([
        db.from('atividades').select('id,contratos(valor_comprometido_brl,valor_utilizado_brl)').in('id',ativIds),
        db.from('execucao_financeira').select('atividade_id,valor_brl,situacao').in('atividade_id',ativIds).is('contrato_id',null).neq('situacao','cancelado')
      ])
    : [{data:[]},{data:[]}];

  // Índice atividade_id → {pago, comprometido} (contratos + diretos)
  const ativContratos = {};
  (ativData||[]).forEach(a=>{
    const contratos = a.contratos||[];
    ativContratos[a.id] = {
      pago:        contratos.reduce((s,c)=>s+parseFloat(c.valor_utilizado_brl||0),0),
      comprometido:contratos.reduce((s,c)=>s+parseFloat(c.valor_comprometido_brl||0),0)
    };
  });
  (dirData||[]).forEach(l=>{
    if(!ativContratos[l.atividade_id]) ativContratos[l.atividade_id]={pago:0,comprometido:0};
    ativContratos[l.atividade_id].comprometido += parseFloat(l.valor_brl||0);
    if(l.situacao==='pago') ativContratos[l.atividade_id].pago += parseFloat(l.valor_brl||0);
  });

  // Mapa por atividade — agrega viagens e dados orçamentários
  const mapa = {};
  (data||[]).forEach(p=>{
    const key = p.atividade?.id||'sem-atv';
    if(!mapa[key]){
      const atv  = p.atividade;
      const orcBRL = atv ? parseFloat(atv.orcamento_usd||0)*cotacao : 0;
      const {pago=0, comprometido=0} = ativContratos[atv?.id]||{};
      mapa[key]={
        id:key, codigo:atv?.codigo||'—', nome:atv?.nome_pt||'Sem Atividade',
        orcBRL, pago, comprometido, aPagar:Math.max(0,comprometido-pago),
        viagens:0, protocolos:0
      };
    }
    mapa[key].protocolos++;
    const seenV=new Set();
    (p.viajantes||[]).filter(v=>{if(seenV.has(v.id))return false;seenV.add(v.id);return true;}).forEach(v=>{
      const seenT=new Set(),seenD=new Set();
      mapa[key].viagens+=(v.trechos||[]).filter(t=>{if(seenT.has(t.id))return false;seenT.add(t.id);return true;}).reduce((s,t)=>s+parseFloat(t.valor||0),0);
      mapa[key].viagens+=(v.diarias||[]).filter(d=>{if(seenD.has(d.id))return false;seenD.add(d.id);return true;}).reduce((s,d)=>s+parseFloat(d.quantidade||d.qtd_dias||0)*parseFloat(d.valor_unitario||0),0);
    });
  });

  const lista      = Object.values(mapa).sort((a,b)=>b.protocolos-a.protocolos);
  const totalOrc   = lista.reduce((s,r)=>s+r.orcBRL,0);
  const totalPago  = lista.reduce((s,r)=>s+r.pago,0);
  const totalComp  = lista.reduce((s,r)=>s+r.comprometido,0);
  const totalSaldo = lista.reduce((s,r)=>s+Math.max(0,r.orcBRL-r.comprometido),0);

  // ── gráfico empilhado por atividade ───────────────────────────
  const grafico = lista.filter(r=>r.orcBRL>0).map(r=>{
    const saldo  = r.orcBRL - r.comprometido;
    const over   = saldo < 0;
    const pPago  = Math.min(100, r.pago/r.orcBRL*100);
    const pAPag  = Math.min(100-pPago, r.aPagar/r.orcBRL*100);
    const pSaldo = Math.max(0, 100-pPago-pAPag);
    return `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <div style="font-size:10px;font-weight:600;color:var(--cinza-800)">
          <span style="font-family:var(--font-mono);background:var(--cinza-100);padding:1px 5px;border-radius:3px;margin-right:6px">${esc(r.codigo)}</span>${esc(r.nome)}
        </div>
        <div style="font-size:10px;font-family:var(--font-mono)">
          Saldo: <strong style="color:${over?'#DC2626':'#059669'}">${fmtBRL(saldo)}</strong>
          ${over?'<span style="color:#DC2626;margin-left:4px">Acima do orçamento</span>':''}
        </div>
      </div>
      <div style="height:18px;border-radius:4px;overflow:hidden;display:flex;background:var(--cinza-100)">
        ${pPago>0 ?`<div style="width:${pPago.toFixed(1)}%;background:#059669;height:100%" title="Pago: ${fmtBRL(r.pago)}"></div>`:''}
        ${pAPag>0 ?`<div style="width:${pAPag.toFixed(1)}%;background:#D97706;height:100%" title="A pagar: ${fmtBRL(r.aPagar)}"></div>`:''}
        ${pSaldo>0?`<div style="width:${pSaldo.toFixed(1)}%;background:#E5E7EB;height:100%" title="Saldo: ${fmtBRL(saldo)}"></div>`:''}
        ${over    ?`<div style="width:4px;background:#DC2626;height:100%"></div>`:''}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:3px;font-size:9px;color:var(--cinza-500);font-family:var(--font-mono)">
        <span>Orç: ${fmtBRL(r.orcBRL)}</span>
        <span style="display:flex;gap:10px">
          <span style="color:#059669">■ Pago ${fmtBRL(r.pago)}</span>
          <span style="color:#D97706">■ A pagar ${fmtBRL(r.aPagar)}</span>
        </span>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="rep-stats rep-stats-4">
    <div class="rep-stat"><div class="rep-stat-lbl">Atividades com Viagem</div><div class="rep-stat-val">${lista.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Orçamento Total</div><div class="rep-stat-val">${fmtBRL(totalOrc)}</div><div class="rep-stat-sub">base na cotação atual</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Comprometido</div><div class="rep-stat-val">${fmtBRL(totalComp)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Saldo Disponível</div><div class="rep-stat-val" style="color:${totalSaldo>=0?'var(--sucesso)':'var(--erro)'}">${fmtBRL(totalSaldo)}</div></div>
  </div>

  <div class="rep-secao">
    <div class="rep-secao-titulo">Orçamento × Execução por Atividade</div>
    <div style="padding:4px 0 8px;display:flex;gap:16px;flex-wrap:wrap;font-size:10px;margin-bottom:12px">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;background:#059669;border-radius:2px;display:inline-block"></span>Pago</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;background:#D97706;border-radius:2px;display:inline-block"></span>A pagar (comprometido)</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;background:#E5E7EB;border:1px solid #D1D5DB;border-radius:2px;display:inline-block"></span>Saldo livre</span>
    </div>
    ${grafico||'<div style="color:var(--cinza-400);font-size:11px">Nenhuma atividade com orçamento cadastrado.</div>'}
  </div>

  <div class="rep-secao">
    <div class="rep-secao-titulo">Execução por Atividade</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Código</th><th>Atividade</th>
        <th style="text-align:center">Protocolos</th>
        <th style="text-align:right">Orçamento</th>
        <th style="text-align:right">Pago</th>
        <th style="text-align:right">A pagar</th>
        <th style="text-align:right">Saldo</th>
        <th style="min-width:80px">Execução</th>
      </tr></thead>
      <tbody>
      ${lista.map(r=>{
        const saldo = r.orcBRL - r.comprometido;
        const over  = saldo < 0;
        const pctExec = r.orcBRL>0 ? r.comprometido/r.orcBRL*100 : 0;
        return `<tr>
          <td class="mono">${esc(r.codigo)}</td>
          <td>${esc(r.nome)}</td>
          <td class="mono" style="text-align:center">${esc(r.protocolos)}</td>
          <td class="mono" style="text-align:right">${r.orcBRL>0?fmtBRL(r.orcBRL):'—'}</td>
          <td class="mono" style="text-align:right;color:#059669">${fmtBRL(r.pago)}</td>
          <td class="mono" style="text-align:right;color:#D97706">${fmtBRL(r.aPagar)}</td>
          <td class="mono" style="text-align:right;font-weight:600;color:${over?'#DC2626':'#059669'}">${r.orcBRL>0?fmtBRL(saldo):'—'}</td>
          <td><div class="rep-barra"><div class="rep-barra-fill" style="width:${Math.min(100,pctExec).toFixed(0)}%"></div></div><div class="mono-sm">${r.orcBRL>0?fmtPct1(pctExec):'—'}</div></td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr>
        <td colspan="3"><strong>TOTAL</strong></td>
        <td class="mono" style="text-align:right">${fmtBRL(totalOrc)}</td>
        <td class="mono" style="text-align:right;color:#059669">${fmtBRL(totalPago)}</td>
        <td class="mono" style="text-align:right;color:#D97706">${fmtBRL(totalComp-totalPago)}</td>
        <td class="mono" style="text-align:right;font-weight:700;color:${totalSaldo>=0?'#059669':'#DC2626'}">${fmtBRL(totalSaldo)}</td>
        <td></td>
      </tr></tfoot>
    </table>
  </div>`;
}

// ══════════════════════════════════════════════════════════════
// Vi4 — RELATÓRIO DETALHADO DE PROTOCOLO
// ══════════════════════════════════════════════════════════════
async function relVi4(){
  const sel = document.getElementById('fil-protocolo-vi4-multi');
  const selectedIds = sel ? [...sel.selectedOptions].map(o=>o.value) : [];
  const stFil  = filVal('fil-status-viagem');
  const dtIni  = filVal('fil-dt-ini');
  const dtFim  = filVal('fil-dt-fim');

  let q = db.from('viagem_protocolos')
    .select(`*,viajantes:viagem_viajantes(*,trechos:viagem_trechos(*),diarias:viagem_diarias_v2(*))`)
    .order('dt_saida',{ascending:false});
  if(selectedIds.length) q = q.in('id', selectedIds);
  if(stFil) q = q.eq('situacao', stFil);
  if(dtIni) q = q.gte('dt_saida', dtIni);
  if(dtFim) q = q.lte('dt_saida', dtFim);

  const {data, error} = await q;
  if(error) throw error;
  const rows = data||[];
  if(!rows.length) return `<div style="padding:32px;text-align:center;color:var(--cinza-400)">Nenhum protocolo encontrado para os filtros selecionados.</div>`;

  const SIT_LABELS2 = {rascunho:'Rascunho',solicitado:'Solicitado',aprovado:'Aprovado',em_prestacao:'Em Prestação',realizado:'Realizado',cancelado:'Cancelado',rejeitado:'Rejeitado'};
  const SIT_BADGE2  = {rascunho:'rb-cinza',solicitado:'rb-ouro',aprovado:'rb-verde',em_prestacao:'rb-teal',realizado:'rb-azul',cancelado:'rb-vermelho',rejeitado:'rb-vermelho'};

  const nomeUsuario = id => {
    if(!id) return '—';
    const u = _usuarios.find(u=>u.id===id);
    return u?.nome_completo||id;
  };

  const dedup = (arr, key='id') => {
    const seen = new Set();
    return (arr||[]).filter(x=>{ if(seen.has(x[key])) return false; seen.add(x[key]); return true; });
  };

  const calcTotais = vList => {
    let pass=0, diar=0;
    vList.forEach(v=>{
      dedup(v.trechos).forEach(t=>{ pass+=parseFloat(t.valor||0); });
      dedup(v.diarias).forEach(d=>{ diar+=parseFloat(d.quantidade||d.qtd_dias||0)*parseFloat(d.valor_unitario||0); });
    });
    return {pass, diar, total:pass+diar};
  };

  const blocos = rows.map(p=>{
    const vList = dedup(p.viajantes);
    const {pass:totalPass, diar:totalDiar, total:totalGeral} = calcTotais(vList);

    // ── Timeline ──────────────────────────────────────────────
    const etapas = [];
    const solicitante = p.email_solicitante||nomeUsuario(p.criado_por);
    etapas.push({icone:'✓',cor:'#2563EB',label:'Solicitado',data:p.criado_em,desc:`Por: ${solicitante}`,ok:true});

    if(p.rejeitado_em){
      etapas.push({icone:'✕',cor:'#DC2626',label:'Rejeitado / Devolvido',data:p.rejeitado_em,
        desc:p.rejeitado_motivo?`Motivo: ${p.rejeitado_motivo.substring(0,80)}`:'',ok:true});
    } else if(p.aprovado_em){
      etapas.push({icone:'✓',cor:'#059669',label:'Aprovado',data:p.aprovado_em,
        desc:`Por: ${nomeUsuario(p.aprovado_por)}`,ok:true});
    } else {
      etapas.push({icone:'·',cor:'#9CA3AF',label:'Aguardando aprovação',data:null,desc:'',ok:false});
    }

    if(!p.rejeitado_em && p.aprovado_em){
      const viagemOcorreu = p.dt_retorno && new Date(p.dt_retorno) < new Date();
      if(viagemOcorreu || p.situacao==='em_prestacao' || p.situacao==='realizado'){
        etapas.push({icone:'✓',cor:'#7C3AED',label:'Viagem realizada',data:p.dt_retorno,desc:'',ok:true});
        if(p.situacao==='realizado'){
          etapas.push({icone:'✓',cor:'#059669',label:'Prestação confirmada',data:p.realizado_em,desc:'Documentos validados',ok:true});
          etapas.push({icone:'✓',cor:'#059669',label:'Concluído',data:p.realizado_em,desc:'Lançado no financeiro',ok:true});
        } else if(p.situacao==='em_prestacao'){
          etapas.push({icone:'✓',cor:'#7C3AED',label:'Prestação de contas enviada',data:null,desc:'Aguardando validação pelo coordenador',ok:true});
          etapas.push({icone:'·',cor:'#9CA3AF',label:'Conclusão',data:null,desc:'Aguardando dados',ok:false});
        } else {
          etapas.push({icone:'·',cor:'#9CA3AF',label:'Prestação de contas',data:null,desc:'Aguardando dados',ok:false});
          etapas.push({icone:'·',cor:'#9CA3AF',label:'Conclusão',data:null,desc:'Aguardando dados',ok:false});
        }
      } else {
        etapas.push({icone:'·',cor:'#9CA3AF',label:'Viagem ainda não ocorrida',data:null,desc:`Prevista: ${fmtDt(p.dt_saida)}`,ok:false});
        etapas.push({icone:'·',cor:'#9CA3AF',label:'Prestação de contas',data:null,desc:'Aguardando dados',ok:false});
        etapas.push({icone:'·',cor:'#9CA3AF',label:'Conclusão',data:null,desc:'Aguardando dados',ok:false});
      }
    }

    const timelineHtml = etapas.map((e,i)=>`
      <div style="display:flex;gap:8px;align-items:flex-start${i<etapas.length-1?';padding-bottom:10px':''}">
        <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:22px">
          <div style="width:22px;height:22px;border-radius:50%;background:${e.cor};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;${e.ok?'':'opacity:.4'}">${e.icone}</div>
          ${i<etapas.length-1?`<div style="width:2px;flex:1;min-height:10px;background:${e.ok?e.cor:'#E5E7EB'};margin-top:2px;opacity:.4"></div>`:''}
        </div>
        <div style="flex:1;padding-top:2px;${e.ok?'':'opacity:.45'}">
          <div style="font-size:11px;font-weight:600;color:var(--cinza-900)">${e.label}</div>
          ${e.data?`<div style="font-size:10px;color:var(--cinza-500)">${new Date(e.data).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`:''}
          ${e.desc?`<div style="font-size:10px;color:var(--cinza-600);margin-top:1px">${esc(e.desc)}</div>`:''}
        </div>
      </div>`).join('');

    // ── Viajantes / trechos / diárias ─────────────────────────
    const vRows = vList.map(v=>{
      const trechos = dedup(v.trechos);
      const diarias = dedup(v.diarias);
      const vPass   = trechos.reduce((s,t)=>s+parseFloat(t.valor||0),0);
      const vDiar   = diarias.reduce((s,d)=>s+parseFloat(d.quantidade||d.qtd_dias||0)*parseFloat(d.valor_unitario||0),0);
      const tStr    = trechos.length
        ? trechos.map(t=>`${esc(t.origem||'?')}→${esc(t.destino||'?')} <span style="color:var(--cinza-400)">(${esc(t.tipo||'—')}, ${fmtDt(t.dt_saida)})</span> <span class="mono">${fmtBRL(t.valor||0)}</span>`).join('<br>')
        : '<span style="color:var(--cinza-400)">—</span>';
      const dStr    = diarias.length
        ? diarias.map(d=>`${esc(d.tipo_diaria||d.tipo||'—')}: ${d.quantidade||d.qtd_dias||0}d × ${fmtBRL(d.valor_unitario||0)}`).join('<br>')
        : '<span style="color:var(--cinza-400)">—</span>';
      return `<tr>
        <td style="white-space:nowrap">${esc(v.nome||'—')}</td>
        <td style="color:var(--cinza-500);font-size:10px;white-space:nowrap">${esc(v.funcao||'—')}</td>
        <td style="font-size:10px">${tStr}</td>
        <td class="mono" style="text-align:right;white-space:nowrap">${fmtBRL(vPass)}</td>
        <td style="font-size:10px">${dStr}</td>
        <td class="mono" style="text-align:right;white-space:nowrap">${fmtBRL(vDiar)}</td>
        <td class="mono" style="text-align:right;white-space:nowrap;font-weight:600">${fmtBRL(vPass+vDiar)}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--cinza-400);padding:12px">Nenhum viajante cadastrado</td></tr>`;

    // ── Prestação de contas ───────────────────────────────────
    const prestacaoAtiva = ['em_prestacao','realizado'].includes(p.situacao);
    let prestacaoHtml;
    if(!prestacaoAtiva){
      prestacaoHtml = `<div style="font-size:11px;color:var(--cinza-400);font-style:italic;padding:8px 0">Aguardando dados — prestação de contas ainda não iniciada.</div>`;
    } else {
      const secoes = vList.map(v=>{
        const cartoes = v.cartoes_embarque_urls||[];
        const thumbs  = cartoes.map((url,i)=>`
          <a href="#" data-arquivo="${esc(url)}"
             style="display:inline-flex;align-items:center;justify-content:center;width:72px;height:56px;border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden;text-decoration:none;flex-shrink:0">
            <img data-arquivo-src="${esc(url)}" style="width:100%;height:100%;object-fit:cover"
              onerror="this.parentElement.innerHTML='<span style=\\'font-size:10px;color:#6B7280\\'>Cartão</span>'"
              alt="Cartão ${i+1}">
          </a>`).join('');
        const relHtml = v.relatorio_url
          ? `<a href="#" data-arquivo="${esc(v.relatorio_url)}"
               style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--verde-medio);text-decoration:none;background:var(--verde-bg);border:1px solid var(--borda-verde);border-radius:var(--raio);padding:4px 10px">
               ${esc(v.relatorio_nome||'Relatório de viagem')}
             </a>`
          : `<span style="font-size:11px;color:var(--cinza-400);font-style:italic">Aguardando dados</span>`;
        return `
          <div style="margin-bottom:10px">
            <div style="font-size:10px;font-weight:600;color:var(--cinza-700);margin-bottom:6px">${esc(v.nome||'—')}</div>
            <div style="margin-bottom:6px">
              <span style="font-size:9px;text-transform:uppercase;color:var(--cinza-400);letter-spacing:.05em">Relatório de viagem</span><br>
              <div style="margin-top:3px">${relHtml}</div>
            </div>
            ${cartoes.length?`
            <div>
              <span style="font-size:9px;text-transform:uppercase;color:var(--cinza-400);letter-spacing:.05em">Cartões de embarque (${cartoes.length})</span>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${thumbs}</div>
            </div>`:''}
          </div>`;
      }).join('');
      prestacaoHtml = secoes || `<span style="font-size:11px;color:var(--cinza-400);font-style:italic">Aguardando dados</span>`;
    }

    return `
    <div style="border:2px solid var(--borda);border-radius:8px;margin-bottom:28px;overflow:hidden;page-break-inside:avoid">
      <!-- Cabeçalho -->
      <div style="background:var(--verde-bg);border-bottom:2px solid var(--borda-verde);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-family:var(--font-mono);font-size:13px;font-weight:700;background:var(--verde-escuro);color:#fff;padding:3px 10px;border-radius:4px">${esc(p.numero||'—')}</span>
        <span style="font-size:13px;font-weight:600;color:var(--cinza-900);flex:1;min-width:0">${esc(p.objetivo||p.destino_principal||'—')}</span>
        <span class="rep-badge ${SIT_BADGE2[p.situacao]||'rb-cinza'}">${SIT_LABELS2[p.situacao]||p.situacao}</span>
      </div>

      <!-- Grid principal: dados+timeline | financeiro+prestação -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--borda)">

        <!-- Esquerda: dados + timeline -->
        <div style="padding:16px;border-right:1px solid var(--borda)">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza-500);margin-bottom:8px">Dados do Protocolo</div>
          <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px">
            ${[
              ['Número SEI', p.numero_sei||'—'],
              ['Destino',    p.destino_principal||'—'],
              ['Objetivo',   p.objetivo||'—'],
              ['Saída',      p.dt_saida?fmtDt(p.dt_saida):'—'],
              ['Retorno',    p.dt_retorno?fmtDt(p.dt_retorno):'—'],
              ['Solicitante',p.email_solicitante||nomeUsuario(p.criado_por)||'—'],
              ...(p.observacoes?[['Observações',p.observacoes]]:[])
            ].map(([l,v])=>`<tr>
              <td style="padding:3px 8px 3px 0;color:var(--cinza-500);white-space:nowrap;vertical-align:top;width:88px;font-size:10px">${l}</td>
              <td style="padding:3px 0;color:var(--cinza-900);word-break:break-word">${esc(String(v))}</td>
            </tr>`).join('')}
          </table>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza-500);margin-bottom:8px">Histórico</div>
          ${timelineHtml}
        </div>

        <!-- Direita: financeiro + prestação -->
        <div style="padding:16px">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza-500);margin-bottom:8px">Resumo Financeiro</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px">
            <div style="background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio);padding:10px;text-align:center">
              <div style="font-size:9px;color:var(--cinza-500);text-transform:uppercase;margin-bottom:4px">Passagens</div>
              <div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--cinza-900)">${fmtBRL(totalPass)}</div>
            </div>
            <div style="background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio);padding:10px;text-align:center">
              <div style="font-size:9px;color:var(--cinza-500);text-transform:uppercase;margin-bottom:4px">Diárias</div>
              <div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--cinza-900)">${fmtBRL(totalDiar)}</div>
            </div>
            <div style="background:var(--verde-bg);border:1px solid var(--borda-verde);border-radius:var(--raio);padding:10px;text-align:center">
              <div style="font-size:9px;color:var(--cinza-500);text-transform:uppercase;margin-bottom:4px">Total</div>
              <div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--verde-medio)">${fmtBRL(totalGeral)}</div>
            </div>
          </div>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza-500);margin-bottom:8px">Prestação de Contas</div>
          ${prestacaoHtml}
        </div>
      </div>

      <!-- Viajantes / Trechos / Diárias -->
      <div style="padding:16px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza-500);margin-bottom:8px">Viajantes · Trechos · Diárias</div>
        <table class="rep-tbl">
          <thead><tr>
            <th>Viajante</th><th>Função</th><th>Trechos</th>
            <th style="text-align:right">Passagens</th>
            <th>Diárias</th>
            <th style="text-align:right">Total Diárias</th>
            <th style="text-align:right">Total</th>
          </tr></thead>
          <tbody>${vRows}</tbody>
          <tfoot><tr>
            <td colspan="3"><strong>TOTAL DO PROTOCOLO</strong></td>
            <td class="mono" style="text-align:right;white-space:nowrap">${fmtBRL(totalPass)}</td>
            <td></td>
            <td class="mono" style="text-align:right;white-space:nowrap">${fmtBRL(totalDiar)}</td>
            <td class="mono" style="text-align:right;white-space:nowrap;font-weight:700">${fmtBRL(totalGeral)}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
  });

  const grandTotal = rows.reduce((s,p)=>{ const vl=dedup(p.viajantes); return s+calcTotais(vl).total; },0);
  const grandPass  = rows.reduce((s,p)=>{ const vl=dedup(p.viajantes); return s+calcTotais(vl).pass;  },0);
  const grandDiar  = rows.reduce((s,p)=>{ const vl=dedup(p.viajantes); return s+calcTotais(vl).diar;  },0);

  return `
  <div class="rep-stats rep-stats-4" style="margin-bottom:24px">
    <div class="rep-stat"><div class="rep-stat-lbl">Protocolos</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Viajantes</div><div class="rep-stat-val">${rows.reduce((s,p)=>s+dedup(p.viajantes).length,0)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Passagens</div><div class="rep-stat-val">${fmtBRL(grandPass)}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Total Diárias</div><div class="rep-stat-val">${fmtBRL(grandDiar)}</div></div>
  </div>
  ${blocos.join('')}`;
}

// U4 — USUÁRIOS INATIVOS
// ══════════════════════════════════════════════════════════════
async function relU4(){
  const dias = parseInt(filVal('fil-dias')||'30');
  const corte = new Date(); corte.setDate(corte.getDate()-dias);
  const corteStr = corte.toISOString();
  const {data, error} = await db.from('usuarios').select('*').eq('ativo',true).order('nome_completo');
  if(error) throw error;
  const rows = (data||[]).filter(u=>{
    if(!u.ultimo_acesso_em) return true;
    return new Date(u.ultimo_acesso_em)<corte;
  });
  const perfilLabel={super_admin:'Super Admin',coordenacao:'Coordenação',tecnico:'Técnico',financeiro:'Financeiro',consultor_externo:'Consultor Externo',visualizador:'Visualizador'};
  const fmtDtHr=s=>!s?'—':new Date(s).toLocaleString('pt-BR',{timeZone:'America/Rio_Branco',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const diasSem=s=>!s?null:Math.floor((new Date()-new Date(s))/864e5);
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Usuários Inativos</div><div class="rep-stat-val" style="color:var(--aviso)">${rows.length}</div><div class="rep-stat-sub">sem acesso há +${dias} dias</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Sem Nenhum Acesso</div><div class="rep-stat-val">${rows.filter(r=>!r.ultimo_acesso_em).length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Corte</div><div class="rep-stat-val" style="font-size:13px">${corte.toLocaleDateString('pt-BR')}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">Usuários Ativos sem Acesso Recente</div>
    ${rows.length===0?`<div style="padding:24px;text-align:center;color:var(--cinza-400)">Nenhum usuário inativo no período selecionado.</div>`:`
    <table class="rep-tbl">
      <thead><tr>
        <th>Nome</th><th>E-mail</th><th>Perfil</th>
        <th>Último Acesso</th><th>Dias sem Acesso</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>{
        const d=diasSem(r.ultimo_acesso_em);
        return `<tr>
          <td style="font-weight:500">${esc(r.nome_completo||'—')}</td>
          <td style="font-size:10px">${esc(r.email||'—')}</td>
          <td><span class="rep-badge rb-azul">${perfilLabel[r.perfil]||r.perfil}</span></td>
          <td class="mono" style="font-size:10px">${fmtDtHr(r.ultimo_acesso_em)}</td>
          <td><span class="rep-badge ${d==null?'rb-vermelho':d>90?'rb-vermelho':d>60?'rb-ouro':'rb-cinza'}">${d!=null?d+'d':'nunca'}</span></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`}
  </div>`;
}

// L1 — AÇÕES EM TDRs
// ══════════════════════════════════════════════════════════════
async function relL1(){
  const dtIni = filVal('fil-dt-ini');
  const dtFim = filVal('fil-dt-fim');
  let q = db.from('tdr_acoes')
    .select(`*,usuario:usuarios(nome_completo),tdr:tdrs(numero,objeto_pt,atividade:atividades(codigo))`)
    .order('criado_em',{ascending:false});
  if(dtIni) q = q.gte('criado_em', dtIni);
  if(dtFim) q = q.lte('criado_em', dtFim+'T23:59:59');
  const {data, error} = await q;
  if(error) throw error;
  const rows = data||[];
  const acoesMap={};
  rows.forEach(a=>{const t=a.usuario?.nome_completo||'—';if(!acoesMap[t])acoesMap[t]=0;acoesMap[t]++;});
  const stLabel={rascunho:'Rascunho',revisao_interna:'Revisão Interna',enviado_unesco:'Enviado UNESCO',ajustes:'Em Ajustes',aprovado:'Aprovado',cancelado:'Cancelado'};
  const stClass={rascunho:'rb-cinza',revisao_interna:'rb-ouro',enviado_unesco:'rb-azul',ajustes:'rb-ouro',aprovado:'rb-verde',cancelado:'rb-vermelho'};
  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Total de Ações</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Usuários Envolvidos</div><div class="rep-stat-val">${Object.keys(acoesMap).length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">TDRs Afetados</div><div class="rep-stat-val">${new Set(rows.map(r=>r.tdr_id)).size}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">Ações Registradas em TDRs</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Data/Hora</th><th>Usuário</th><th>TDR</th><th>Atividade</th>
        <th>Fase Anterior</th><th>Nova Fase</th><th>Observação</th>
      </tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td class="mono" style="font-size:10px">${r.criado_em?new Date(r.criado_em).toLocaleString('pt-BR',{timeZone:'America/Rio_Branco',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}</td>
        <td>${esc(r.usuario?.nome_completo||'—')}</td>
        <td class="mono">${esc(r.tdr?.numero||'—')}</td>
        <td class="mono">${esc(r.tdr?.atividade?.codigo||'—')}</td>

// L5 — LOG DE ALTERAÇÕES NO MAPA
// ══════════════════════════════════════════════════════════════
async function relL5(){
  if(appState.perfil !== 'super_admin'){
    return `<div style="padding:32px;text-align:center;color:var(--erro)">Acesso restrito a Super Administradores.</div>`;
  }

  const dtIni   = filVal('fil-dt-ini');
  const dtFim   = filVal('fil-dt-fim');
  const acaoFil = filVal('fil-acao-log');
  const usrFil  = filVal('fil-usuario-log');

  let q = db.from('mapa_pontos_log').select('*').order('criado_em',{ascending:false});
  if(dtIni)   q = q.gte('criado_em', dtIni);
  if(dtFim)   q = q.lte('criado_em', dtFim+'T23:59:59');
  if(acaoFil) q = q.eq('acao', acaoFil);
  if(usrFil)  q = q.eq('usuario_id', usrFil);

  const {data, error} = await q;
  if(error) throw error;
  const rows = data||[];

  const fmtDtHr = s => !s ? '—' : new Date(s).toLocaleString('pt-BR',{timeZone:'America/Rio_Branco',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});

  const acaoCor  = { criar:'#16a34a', editar:'#2563eb', excluir:'#dc2626' };
  const acaoIcon = { criar:'+', editar:'✎', excluir:'✕' };
  const acaoLabel= { criar:'Criação', editar:'Edição', excluir:'Exclusão' };
  const geoLabel = { ponto:'Ponto', poligono:'Polígono', trilha:'Trilha', caminho:'Caminho' };

  // campos com rótulo legível — exclui campos internos/estruturais
  const CAMPOS = {
    nome_local:'Nome', apa:'APA', tipo_atividade:'Tipo de Atividade',
    responsavel:'Responsável', data_implantacao:'Data de Implantação',
    observacao:'Observação', lat:'Latitude', lng:'Longitude',
    foto_url:'Foto URL', foto_nome:'Nome da Foto', status:'Status'
  };

  function _diffHtml(antes, depois){
    if(!antes && !depois) return '<em style="color:var(--cinza-400)">Sem dados.</em>';

    // Para geometrias (antes ou depois tem vertices), mostra apenas campos + contagem de vértices
    const a = antes || {};
    const d = depois || {};
    const camposParaComparar = Object.keys(CAMPOS);
    const linhas = [];

    camposParaComparar.forEach(k => {
      const va = a[k] !== undefined ? a[k] : null;
      const vd = d[k] !== undefined ? d[k] : null;
      const mudou = JSON.stringify(va) !== JSON.stringify(vd);
      if(!mudou && !antes) return; // na criação, mostra todos
      if(!mudou && !depois) return; // na exclusão, mostra todos
      if(!mudou) return; // na edição, só mostra alterados

      const label = CAMPOS[k];
      const valAntes = va !== null && va !== undefined && va !== '' ? String(va) : '—';
      const valDepois = vd !== null && vd !== undefined && vd !== '' ? String(vd) : '—';

      if(!depois){
        // Exclusão: mostra valor que existia
        linhas.push(`<tr>
          <td style="padding:4px 8px;font-size:11px;font-weight:600;color:var(--cinza-600);white-space:nowrap">${esc(label)}</td>
          <td style="padding:4px 8px;font-size:11px;color:#dc2626;text-decoration:line-through">${esc(valAntes)}</td>
          <td style="padding:4px 8px;font-size:11px;color:var(--cinza-400)">—</td>
        </tr>`);
      } else if(!antes){
        // Criação: mostra valor novo
        linhas.push(`<tr>
          <td style="padding:4px 8px;font-size:11px;font-weight:600;color:var(--cinza-600);white-space:nowrap">${esc(label)}</td>
          <td style="padding:4px 8px;font-size:11px;color:var(--cinza-400)">—</td>
          <td style="padding:4px 8px;font-size:11px;color:#16a34a">${esc(valDepois)}</td>
        </tr>`);
      } else {
        // Edição: antes → depois
        linhas.push(`<tr>
          <td style="padding:4px 8px;font-size:11px;font-weight:600;color:var(--cinza-600);white-space:nowrap">${esc(label)}</td>
          <td style="padding:4px 8px;font-size:11px;color:#dc2626;text-decoration:line-through">${esc(valAntes)}</td>
          <td style="padding:4px 8px;font-size:11px;color:#16a34a">${esc(valDepois)}</td>
        </tr>`);
      }
    });

    // Vértices — para polígonos/trilhas
    if(a.vertices || d.vertices){
      const nAntes  = a.vertices ? a.vertices.length : '—';
      const nDepois = d.vertices ? d.vertices.length : '—';
      const mudouVtx = nAntes !== nDepois;
      if(!depois){
        linhas.push(`<tr>
          <td style="padding:4px 8px;font-size:11px;font-weight:600;color:var(--cinza-600)">Vértices</td>
          <td style="padding:4px 8px;font-size:11px;color:#dc2626;text-decoration:line-through">${nAntes} ponto(s)</td>
          <td style="padding:4px 8px;font-size:11px;color:var(--cinza-400)">—</td>
        </tr>`);
      } else if(!antes){
        linhas.push(`<tr>
          <td style="padding:4px 8px;font-size:11px;font-weight:600;color:var(--cinza-600)">Vértices</td>
          <td style="padding:4px 8px;font-size:11px;color:var(--cinza-400)">—</td>
          <td style="padding:4px 8px;font-size:11px;color:#16a34a">${nDepois} ponto(s)</td>
        </tr>`);
      } else if(mudouVtx){
        linhas.push(`<tr>
          <td style="padding:4px 8px;font-size:11px;font-weight:600;color:var(--cinza-600)">Vértices</td>
          <td style="padding:4px 8px;font-size:11px;color:#dc2626;text-decoration:line-through">${nAntes} ponto(s)</td>
          <td style="padding:4px 8px;font-size:11px;color:#16a34a">${nDepois} ponto(s)</td>
        </tr>`);
      }
    }

    if(!linhas.length){
      return '<em style="color:var(--cinza-400);font-size:11px">Nenhuma alteração de campo registrada.</em>';
    }

    return `<table style="width:100%;border-collapse:collapse;border:1px solid var(--borda);border-radius:6px;overflow:hidden">
      <thead><tr style="background:var(--cinza-50)">
        <th style="padding:4px 8px;font-size:10px;text-align:left;border-bottom:1px solid var(--borda);color:var(--cinza-500)">Campo</th>
        <th style="padding:4px 8px;font-size:10px;text-align:left;border-bottom:1px solid var(--borda);color:#dc2626">Antes</th>
        <th style="padding:4px 8px;font-size:10px;text-align:left;border-bottom:1px solid var(--borda);color:#16a34a">Depois</th>
      </tr></thead>
      <tbody>${linhas.join('')}</tbody>
    </table>`;
  }

  const totCriar  = rows.filter(r=>r.acao==='criar').length;
  const totEditar = rows.filter(r=>r.acao==='editar').length;
  const totExcluir= rows.filter(r=>r.acao==='excluir').length;

  return `
  <div class="rep-stats rep-stats-3">
    <div class="rep-stat"><div class="rep-stat-lbl">Total de Eventos</div><div class="rep-stat-val">${rows.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Criações / Edições / Exclusões</div>
      <div class="rep-stat-val" style="font-size:14px">
        <span style="color:#16a34a">${totCriar}</span> /
        <span style="color:#2563eb">${totEditar}</span> /
        <span style="color:#dc2626">${totExcluir}</span>
      </div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Usuários distintos</div><div class="rep-stat-val">${new Set(rows.map(r=>r.usuario_email).filter(Boolean)).size}</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">Histórico de Alterações no Mapa</div>
    ${rows.length === 0
      ? '<div style="padding:24px;text-align:center;color:var(--cinza-400)">Nenhum registro encontrado para os filtros selecionados.</div>'
      : rows.map((r,i) => {
          const cor = acaoCor[r.acao]||'#374151';
          const geo = geoLabel[r.geometry_type]||r.geometry_type||'Ponto';
          return `
          <div style="border:1px solid var(--borda);border-radius:8px;margin-bottom:10px;overflow:hidden">
            <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:${cor}11;border-bottom:1px solid ${cor}33;cursor:pointer"
                 onclick="this.parentElement.querySelector('.l5-diff').style.display=this.parentElement.querySelector('.l5-diff').style.display==='none'?'block':'none'">
              <span style="font-size:16px">${acaoIcon[r.acao]||'•'}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:12px;font-weight:600;color:var(--cinza-900)">
                  <span style="color:${cor};background:${cor}1a;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:6px">${acaoLabel[r.acao]||r.acao}</span>
                  ${r.ponto_nome ? `<strong>${esc(r.ponto_nome)}</strong>` : '<em style="color:var(--cinza-400)">sem nome</em>'}
                  <span style="font-size:10px;color:var(--cinza-400);margin-left:6px">[${geo}]</span>
                </div>
                <div style="font-size:10px;color:var(--cinza-500);margin-top:2px">
                  ${fmtDtHr(r.criado_em)} · ${esc(r.usuario_nome||r.usuario_email||'Desconhecido')}
                  ${r.apa ? ` · APA: ${esc(r.apa)}` : ''}
                </div>
              </div>
              <span style="font-size:11px;color:var(--cinza-400)">▼ detalhes</span>
            </div>
            <div class="l5-diff" style="display:none;padding:12px 14px">
              ${_diffHtml(r.dados_antes, r.dados_depois)}
            </div>
          </div>`;
        }).join('')
    }
  </div>`;
}

async function _buscarEntregas(pIds, sitEntFil, dtIni, dtFim){
  if(!pIds.length) return [];
  let q = db.from('contratos_produtos_entregas')
    .select('id,produto_id,situacao,dt_entrega,despacho_numero,despacho_data,nota_tecnica_url,nota_tecnica_nome,pct_entregue,criado_por_u:usuarios!contratos_produtos_entregas_criado_por_fkey(nome_completo),despachado_por_u:usuarios!contratos_produtos_entregas_despachado_por_fkey(nome_completo),lancamento:execucao_financeira!contratos_produtos_entregas_lancamento_id_fkey(dt_pagamento),documentos:entrega_documentos(arquivo_url,arquivo_nome,tipo_documento)')
    .in('produto_id', pIds)
    .order('dt_entrega',{ascending:true});
  if(sitEntFil) q = q.eq('situacao', sitEntFil);
  if(dtIni) q = q.gte('dt_entrega', dtIni);

async function relC5(){
  const ativFil   = filVal('fil-atividade');
  const fornFil   = filVal('fil-fornecedor');

  const sitEntFil = filVal('fil-sit-entrega');

    .order('numero');
  if(ativFil)   qC = qC.eq('atividade_id', ativFil);

  const {data:contratos, error:eC} = await qC;
  if(eC) throw eC;
  if(!contratos?.length) return `<div style="text-align:center;padding:32px;color:var(--cinza-400)">Nenhum contrato encontrado com os filtros selecionados.</div>`;

  const cIds = contratos.map(c=>c.id);

  const {data:prods, error:eP} = await db.from('contratos_produtos')
    .select('id,contrato_id,numero_produto,descricao,valor_brl,situacao')
    .in('contrato_id', cIds).order('numero_produto');
  if(eP) throw eP;

  const pIds = (prods||[]).map(p=>p.id);
  const entregas = await _buscarEntregas(pIds, sitEntFil, dtIni, dtFim);

  const prodsByContrato = {};
  (prods||[]).forEach(p=>{ if(!prodsByContrato[p.contrato_id]) prodsByContrato[p.contrato_id]=[]; prodsByContrato[p.contrato_id].push(p); });
  const entsByProd = {};
  entregas.forEach(e=>{ if(!entsByProd[e.produto_id]) entsByProd[e.produto_id]=[]; entsByProd[e.produto_id].push(e); });

  const totEnts  = entregas.length;
  const totAprov = entregas.filter(e=>e.situacao==='aprovada').length;
  const totAnali = entregas.filter(e=>e.situacao==='em_analise').length;
  const totDev   = entregas.filter(e=>e.situacao==='devolvida').length;

  let html = `
  <div class="rep-stats rep-stats-4">
    <div class="rep-stat"><div class="rep-stat-lbl">Contratos</div><div class="rep-stat-val">${contratos.length}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Entregas</div><div class="rep-stat-val">${totEnts}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Aprovadas</div><div class="rep-stat-val" style="color:#065F46">${totAprov}</div><div class="rep-stat-sub">${totEnts?Math.round(totAprov/totEnts*100):0}% do total</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Em Análise / Devolvidas</div><div class="rep-stat-val" style="color:#1E40AF">${totAnali}</div><div class="rep-stat-sub">${totDev} devolvida(s)</div></div>
  </div>`;

  contratos.forEach(c=>{
    const ps   = prodsByContrato[c.id]||[];
    const cEnts= ps.flatMap(p=>entsByProd[p.id]||[]);
    html += `<div class="rep-secao">
      <div class="rep-secao-titulo">
        ${esc(c.numero)} — ${esc(c.fornecedores?.nome||'—')}
        <span class="rep-badge ${COR_CONT[c.status]||'rb-cinza'}" style="margin-left:6px">${SIT_CONT[c.status]||c.status}</span>
        <span style="margin-left:auto;font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--cinza-500)">${esc(c.atividades?.codigo||'')} &nbsp;·&nbsp; ${fmtBRL(c.valor_total_brl)} &nbsp;·&nbsp; ${cEnts.length} entrega(s)</span>
      </div>`;

    if(!ps.length){
      html += `<p style="font-size:11px;color:var(--cinza-400);font-style:italic;padding:4px 0">Nenhum produto cadastrado.</p>`;
    } else {
      ps.forEach(p=>{
        const pe = entsByProd[p.id]||[];
        html += `<div style="margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f4f8f5;border-radius:4px;border:1px solid #ddeee4;margin-bottom:4px">
            <span style="font-size:10px;font-weight:700;color:var(--cinza-400);font-family:var(--font-mono)">#${esc(p.numero_produto)}</span>
            <span style="font-size:12px;font-weight:600;color:var(--cinza-900);flex:1">${esc(p.descricao)}</span>
            <span style="font-family:var(--font-mono);font-size:11px;color:#2D6A4F">${fmtBRL(parseFloat(p.valor_brl||0))}</span>
            <span class="rep-badge ${COR_PROD[p.situacao]||'rb-cinza'}">${SIT_PROD[p.situacao]||p.situacao}</span>
          </div>`;
        if(!pe.length){
          html += `<div style="padding:5px 10px;font-size:11px;color:var(--cinza-400);font-style:italic">Nenhuma entrega registrada.</div>`;
        } else {
          pe.forEach((e,ei)=>{
            html += `<div style="padding:8px 10px;margin-bottom:4px;border:1px solid #e2ede8;border-radius:4px;background:#fff">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:9px;font-weight:700;font-family:var(--font-mono);color:var(--cinza-400)">Entrega ${ei+1}</span>
                ${e.dt_entrega?`<span style="font-size:11px;color:var(--cinza-700)">${fmtDt(e.dt_entrega)}</span>`:''}
                <span class="rep-badge ${COR_ENT[e.situacao]||'rb-cinza'}">${SIT_ENT[e.situacao]||e.situacao}</span>
                ${e.pct_entregue&&e.pct_entregue<100?`<span style="font-size:10px;color:var(--cinza-500)">${e.pct_entregue}%</span>`:''}
              </div>
              ${_quemEntrega(e)}
              ${_linksEntrega(e)}
            </div>`;
          });
        }
        html += `</div>`;
      });
    }
    html += `</div>`;
  });
  return html;
}

// ══════════════════════════════════════════════════════════════
// V4 — RASTREABILIDADE DE ENTREGAS POR FORNECEDOR
// ══════════════════════════════════════════════════════════════
async function relV4(){
  const fornFil   = filVal('fil-fornecedor');
  const ativFil   = filVal('fil-atividade');
  const sitEntFil = filVal('fil-sit-entrega');
  const dtIni     = filVal('fil-dt-ini');
  const dtFim     = filVal('fil-dt-fim');

  let qC = db.from('contratos')
    .select('id,numero,status,valor_total_brl,fornecedor_id,fornecedores(id,nome,tipo,cpf_cnpj),atividades(codigo)')
    .order('numero');
  if(fornFil) qC = qC.eq('fornecedor_id', fornFil);
  if(ativFil) qC = qC.eq('atividade_id', ativFil);

  const {data:contratos, error:eC} = await qC;
  if(eC) throw eC;
  if(!contratos?.length) return `<div style="text-align:center;padding:32px;color:var(--cinza-400)">Nenhum contrato encontrado com os filtros selecionados.</div>`;

  const cIds = contratos.map(c=>c.id);
  const {data:prods, error:eP} = await db.from('contratos_produtos')
    .select('id,contrato_id,numero_produto,descricao,valor_brl,situacao')
    .in('contrato_id', cIds).order('numero_produto');
  if(eP) throw eP;

  const pIds = (prods||[]).map(p=>p.id);
  const entregas = await _buscarEntregas(pIds, sitEntFil, dtIni, dtFim);

  // Agrupar por fornecedor
  const fornMap = {};
  contratos.forEach(c=>{
    const fid = c.fornecedor_id;
    if(!fornMap[fid]) fornMap[fid]={info:c.fornecedores, contratos:[]};
    fornMap[fid].contratos.push(c);
  });
  const prodsByContrato = {};
  (prods||[]).forEach(p=>{ if(!prodsByContrato[p.contrato_id]) prodsByContrato[p.contrato_id]=[]; prodsByContrato[p.contrato_id].push(p); });
  const entsByProd = {};
  entregas.forEach(e=>{ if(!entsByProd[e.produto_id]) entsByProd[e.produto_id]=[]; entsByProd[e.produto_id].push(e); });

  const totForn    = Object.keys(fornMap).length;
  const totConts   = contratos.length;
  const totEnts    = entregas.length;
  const totAprov   = entregas.filter(e=>e.situacao==='aprovada').length;

  let html = `
  <div class="rep-stats rep-stats-4">
    <div class="rep-stat"><div class="rep-stat-lbl">Fornecedores</div><div class="rep-stat-val">${totForn}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Contratos</div><div class="rep-stat-val">${totConts}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Entregas</div><div class="rep-stat-val">${totEnts}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Aprovadas</div><div class="rep-stat-val" style="color:#065F46">${totAprov}</div><div class="rep-stat-sub">${totEnts?Math.round(totAprov/totEnts*100):0}%</div></div>
  </div>`;

  Object.values(fornMap).forEach(({info:f, contratos:cs})=>{
    const fEnts = cs.flatMap(c=>(prodsByContrato[c.id]||[]).flatMap(p=>entsByProd[p.id]||[]));
    const fIdDoc = f?.cpf_cnpj ? `${f.tipo==='PF'?'CPF':'CNPJ'} ${esc(f.cpf_cnpj)}` : '';
    html += `<div class="rep-secao">
      <div class="rep-secao-titulo">
        ${esc(f?.nome||'—')}
        <span class="rep-badge ${f?.tipo==='PF'?'rb-azul':'rb-teal'}" style="margin-left:6px">${f?.tipo==='PF'?'PF':'PJ'}</span>
        ${fIdDoc?`<span style="font-family:var(--font-mono);font-size:9px;color:var(--cinza-500);font-weight:400;text-transform:none;letter-spacing:0">${fIdDoc}</span>`:''}
        <span style="margin-left:auto;font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--cinza-500)">${cs.length} contrato(s) &nbsp;·&nbsp; ${fEnts.length} entrega(s)</span>
      </div>`;

    cs.forEach(c=>{
      const ps   = prodsByContrato[c.id]||[];
      const cEnts= ps.flatMap(p=>entsByProd[p.id]||[]);
      html += `<div style="margin-bottom:12px;padding:10px 12px;border:1px solid var(--borda);border-radius:var(--raio)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #eaf3ec">
          <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--cinza-800)">${esc(c.numero)}</span>
          <span class="rep-badge ${COR_CONT[c.status]||'rb-cinza'}">${SIT_CONT[c.status]||c.status}</span>
          ${c.atividades?.codigo?`<span style="font-size:10px;color:var(--cinza-500)">${esc(c.atividades.codigo)}</span>`:''}
          <span style="font-family:var(--font-mono);font-size:11px;color:#2D6A4F;margin-left:auto">${fmtBRL(parseFloat(c.valor_total_brl||0))}</span>
          <span style="font-size:10px;color:var(--cinza-400)">${cEnts.length} entrega(s)</span>
        </div>`;

      ps.forEach(p=>{
        const pe = entsByProd[p.id]||[];
        html += `<div style="margin-bottom:8px;padding-left:10px;border-left:2px solid #c8e6d0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="font-size:10px;font-weight:700;color:var(--cinza-400)">#${esc(p.numero_produto)}</span>
            <span style="font-size:11px;font-weight:600;color:var(--cinza-900);flex:1">${esc(p.descricao)}</span>
            <span style="font-family:var(--font-mono);font-size:10px;color:#2D6A4F">${fmtBRL(parseFloat(p.valor_brl||0))}</span>
            <span class="rep-badge ${COR_PROD[p.situacao]||'rb-cinza'}">${SIT_PROD[p.situacao]||p.situacao}</span>
          </div>`;
        if(!pe.length){
          html += `<div style="font-size:10px;color:var(--cinza-400);font-style:italic;padding:2px 0">Sem entregas.</div>`;
        } else {
          pe.forEach((e,ei)=>{
            html += `<div style="padding:6px 8px;margin-bottom:3px;background:#f8fafb;border-radius:4px;border:1px solid #e8f0ea">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:9px;font-family:var(--font-mono);color:var(--cinza-400)">Ent.${ei+1}</span>
                ${e.dt_entrega?`<span style="font-size:10px;color:var(--cinza-700)">${fmtDt(e.dt_entrega)}</span>`:''}
                <span class="rep-badge ${COR_ENT[e.situacao]||'rb-cinza'}">${SIT_ENT[e.situacao]||e.situacao}</span>
                ${e.pct_entregue&&e.pct_entregue<100?`<span style="font-size:9px;color:var(--cinza-500)">${e.pct_entregue}%</span>`:''}
              </div>
              ${_quemEntrega(e)}
              ${_linksEntrega(e)}
            </div>`;
          });
        }
        html += `</div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ══════════════════════════════════════════════════════════════
// P5 — AUDITORIA DE DOCUMENTAÇÃO DE ENTREGAS (paisagem)
// ══════════════════════════════════════════════════════════════
async function relP5(){
  const ativFil    = filVal('fil-atividade');
  const fornFil    = filVal('fil-fornecedor');
  const sitEntFil  = filVal('fil-sit-entrega');
  const sitProdFil = filVal('fil-sit-produto');
  const temNTFil   = filVal('fil-tem-nt');
  const temDespFil = filVal('fil-tem-despacho');
  const dtIni      = filVal('fil-dt-ini');
  const dtFim      = filVal('fil-dt-fim');

  let qC = db.from('contratos').select('id,numero,fornecedor_id,fornecedores(nome)').order('numero');
  if(ativFil) qC = qC.eq('atividade_id', ativFil);
  if(fornFil) qC = qC.eq('fornecedor_id', fornFil);
  const {data:contratos, error:eC} = await qC;
  if(eC) throw eC;
  if(!contratos?.length) return `<div style="text-align:center;padding:32px;color:var(--cinza-400)">Nenhum dado encontrado.</div>`;

  const contratoMap = Object.fromEntries(contratos.map(c=>[c.id,c]));

  let qP = db.from('contratos_produtos')
    .select('id,contrato_id,numero_produto,descricao,valor_brl,situacao')
    .in('contrato_id', contratos.map(c=>c.id));
  if(sitProdFil) qP = qP.eq('situacao', sitProdFil);
  const {data:prods, error:eP} = await qP;
  if(eP) throw eP;

  const prodMap = Object.fromEntries((prods||[]).map(p=>[p.id,p]));
  const pIds = (prods||[]).map(p=>p.id);

  let entregas = await _buscarEntregas(pIds, sitEntFil, dtIni, dtFim);
  if(temNTFil==='sim')    entregas = entregas.filter(e=>e.nota_tecnica_url);
  if(temNTFil==='nao')    entregas = entregas.filter(e=>!e.nota_tecnica_url);
  if(temDespFil==='sim')  entregas = entregas.filter(e=>e.despacho_numero);
  if(temDespFil==='nao')  entregas = entregas.filter(e=>!e.despacho_numero);

  if(!entregas.length) return `<div style="text-align:center;padding:32px;color:var(--cinza-400)">Nenhuma entrega encontrada com os filtros selecionados.</div>`;

  const totEnts  = entregas.length;
  const totAprov = entregas.filter(e=>e.situacao==='aprovada').length;
  const totDev   = entregas.filter(e=>e.situacao==='devolvida').length;
  const totSemDoc= entregas.filter(e=>!e.nota_tecnica_url&&!e.despacho_numero&&!(e.documentos?.length)).length;

  return `
  <div class="rep-stats rep-stats-4">
    <div class="rep-stat"><div class="rep-stat-lbl">Total de Entregas</div><div class="rep-stat-val">${totEnts}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Aprovadas</div><div class="rep-stat-val" style="color:#065F46">${totAprov}</div><div class="rep-stat-sub">${Math.round(totAprov/totEnts*100)}% do total</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Devolvidas</div><div class="rep-stat-val" style="color:#991B1B">${totDev}</div></div>
    <div class="rep-stat"><div class="rep-stat-lbl">Sem Documentos</div><div class="rep-stat-val" style="color:#92400E">${totSemDoc}</div><div class="rep-stat-sub">sem NT, despacho ou doc</div></div>
  </div>
  <div class="rep-secao">
    <div class="rep-secao-titulo">Registro de Entregas com Rastreabilidade</div>
    <table class="rep-tbl">
      <thead><tr>
        <th>Contrato</th><th>Fornecedor</th><th>Produto</th>
        <th>Data Entrega</th><th>Situação</th>
        <th>Carregou</th><th>Aprovou</th><th>Pago em</th>
        <th>Documentos</th>
      </tr></thead>
      <tbody>
      ${entregas.map(e=>{
        const prod = prodMap[e.produto_id];
        const cont = prod ? contratoMap[prod.contrato_id] : null;
        const docs  = e.documentos||[];
        const links = [];
        if(e.despacho_numero) links.push(`<span style="font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid #BFDBFE;background:#EFF6FF;color:#1E40AF;white-space:nowrap">${esc(e.despacho_numero)}</span>`);
        if(e.nota_tecnica_url) links.push(`<a href="#" data-arquivo="${esc(e.nota_tecnica_url)}" style="font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid #BBF7D0;background:#F0FDF4;color:#166534;text-decoration:none;white-space:nowrap">NT</a>`);
        docs.forEach(d=>{ if(d.arquivo_url) links.push(`<a href="#" data-arquivo="${esc(d.arquivo_url)}" style="font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid var(--borda);background:#fff;color:var(--cinza-700);text-decoration:none;white-space:nowrap">${esc(d.tipo_documento||'Doc')}</a>`); });
        return `<tr>
          <td class="mono-sm" style="font-weight:600;white-space:nowrap">${esc(cont?.numero||'—')}</td>
          <td style="font-size:10px;max-width:110px">${esc(cont?.fornecedores?.nome||'—')}</td>
          <td style="font-size:10px;max-width:140px">${prod?`<span style="color:var(--cinza-400)">#${esc(prod.numero_produto)}</span> ${esc(prod.descricao)}`:'—'}</td>
          <td class="mono-sm" style="white-space:nowrap">${fmtDt(e.dt_entrega)}</td>
          <td><span class="rep-badge ${COR_ENT[e.situacao]||'rb-cinza'}">${SIT_ENT[e.situacao]||e.situacao}</span></td>
          <td style="font-size:10px">${esc(e.criado_por_u?.nome_completo||'—')}</td>
          <td style="font-size:10px">${e.despachado_por_u?.nome_completo?esc(e.despachado_por_u.nome_completo)+(e.despacho_data?`<div class="mono-sm">${fmtDt(e.despacho_data)}</div>`:''): '—'}</td>
          <td class="mono-sm" style="white-space:nowrap">${fmtDt(e.lancamento?.dt_pagamento)}</td>
          <td><div style="display:flex;flex-wrap:wrap;gap:2px">${links.join('')||'<span style="font-size:9px;color:var(--cinza-300)">—</span>'}</div></td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr>
        <td colspan="9">${totEnts} entrega(s) &nbsp;·&nbsp; ${totAprov} aprovada(s) &nbsp;·&nbsp; ${totDev} devolvida(s) &nbsp;·&nbsp; ${totSemDoc} sem documentos</td>
      </tr></tfoot>
    </table>
  </div>`;
}
</script>
</body>
</html>
