<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Remanejamento de recursos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<link href="../css/sidebar.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes do Remanejamento (js/remanejamentos.js; regras no banco) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/remanejamentos.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="empty-state" role="status"><div class="spinner"></div><div class="empty-state-msg">Carregando remanejamentos…</div></div></div>

<!-- Janelas fora do #app (armadilha 11); .rm-ov = escopo do tema (css/remanejamentos.css). <i data-ic> vira ícone SVG. -->
<div class="modal-overlay rm-ov" id="rm-modal-pedido" role="dialog" aria-modal="true" aria-labelledby="rm-mp-titulo">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div style="flex:1;min-width:0"><div class="modal-title" id="rm-mp-titulo">Pedido</div><div class="rm-sub" id="rm-mp-sub"></div></div>
      <button type="button" class="modal-close" onclick="remFecharPedido()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="rm-mp-corpo"></div>
    <div class="modal-footer" id="rm-mp-acoes"></div>
  </div>
</div>

<div class="modal-overlay rm-ov" id="rm-modal-assinar" role="dialog" aria-modal="true" aria-labelledby="rm-as-titulo">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <div class="modal-title" id="rm-as-titulo" style="flex:1;min-width:0">Assinar</div>
      <button type="button" class="modal-close" onclick="remFecharAssinar()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body">
      <p id="rm-as-texto" style="font-size:13px;color:var(--txt-forte-2);line-height:1.5;margin:0"></p>
      <div class="form-group" id="rm-as-motivo-grp">
        <label class="form-label" for="rm-as-motivo" id="rm-as-motivo-lbl">Motivo</label>
        <textarea class="form-control" id="rm-as-motivo" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="rm-as-senha">Sua senha de acesso <button type="button" class="rm-q" aria-label="Ajuda: por que pedir a senha" onclick="remAjuda('senha')">?</button></label>
        <input class="form-control" id="rm-as-senha" type="password" autocomplete="current-password">
        <div class="rm-sub" style="display:flex;gap:6px;align-items:flex-start"><i data-ic="cadeado"></i><span>A senha é conferida no servidor e não é guardada. Cinco erros seguidos bloqueiam a assinatura por 30 minutos.</span></div>
      </div>
      <div class="rm-hash" id="rm-as-hash"></div>
      <div class="rm-sub">O que estou assinando? <button type="button" class="rm-q" aria-label="Ajuda: impressão digital" onclick="remAjuda('hash')">?</button>
        Decisões possíveis <button type="button" class="rm-q" aria-label="Ajuda: aprovar, devolver, recusar" onclick="remAjuda('decisoes')">?</button></div>
      <div id="rm-as-erro" class="rm-erro" role="alert" hidden></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="remFecharAssinar()">Voltar</button>
      <button type="button" class="btn btn-primary" id="rm-as-ok" onclick="remConfirmarAssinatura()">Assinar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/logos.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/relatorio-remanejamento.js"></script>
<script src="../js/remanejamentos-ajuda.js"></script>
<script src="../js/remanejamentos.js"></script>
</body>
</html>
