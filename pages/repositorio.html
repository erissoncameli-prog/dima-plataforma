<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Repositório de Referências</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes do Repositório -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/repositorio.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="rp-carrega" role="status">Carregando repositório…</div></div>

<!-- Janelas fora do #app (armadilha 11); .rp-ov = escopo do tema. <i data-ic> vira ícone SVG. -->
<div class="modal-overlay rp-ov" id="modal-ref" role="dialog" aria-modal="true" aria-labelledby="ref-modal-titulo">
  <div class="modal rp-modal-mat">
    <div class="modal-header">
      <div style="flex:1;min-width:0"><div class="modal-title" id="ref-modal-titulo" style="white-space:normal;line-height:1.4"></div></div>
      <button type="button" class="modal-close" onclick="rpFechar('modal-ref')" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="ref-modal-body"></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="rpFechar('modal-ref')">Fechar</button></div>
  </div>
</div>

<div class="modal-overlay rp-ov" id="modal-repo" role="dialog" aria-modal="true" aria-labelledby="repo-modal-titulo">
  <div class="modal rp-modal-add">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="repo-modal-titulo">Adicionar referência</div>
        <div style="font-size:12px;color:var(--txt-3);margin-top:2px">Cole o link e buscamos título, veículo e resumo</div>
      </div>
      <button type="button" class="modal-close" onclick="fecharModal()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div class="modal-overlay rp-ov" id="modal-conf" role="dialog" aria-modal="true" aria-labelledby="conf-tit">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <div style="flex:1;min-width:0"><div class="modal-title" id="conf-tit">Desativar referência?</div><div style="font-size:12.5px;color:var(--txt-3);margin-top:2px;word-break:break-word" id="conf-sub"></div></div>
      <button type="button" class="modal-close" onclick="fecharConf(false)" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body"><p style="margin:0;font-size:13px;color:var(--txt-forte-2);line-height:1.55">Ela fica oculta para todos os usuários, mas não é excluída.</p></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="fecharConf(false)">Cancelar</button>
      <button type="button" class="btn btn-primary" id="conf-ok" onclick="fecharConf(true)">Desativar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/logos.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/ajuda.js"></script>
<script>
const CATEGORIAS = [
  'Biodiversidade','Governança','Gênero','Restauração',
  'Comunicação','Legislação','Relatório UNESCO','Outro'
];
const IDIOMAS = ['pt','en','es','fr','de','ar','zh'];

let todosLinks = [], nInativos = 0, metadataFetch = {};
let filtCat = '', filtLang = '', filtBusca = '';
let grupos = [];          // matérias (links agrupados por título)

// ── Ícones (SVG, sem emoji) ─────────────────────────────────────
const RP_IC = {
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  busca: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  jornal: '<path d="M4 22h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>',
  externo: '<path d="M14 3h7v7M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>',
  mais: '<path d="M12 5v14M5 12h14"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  predio: '<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M8 7h4M8 11h4M8 15h4M2 21h20"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  alerta: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  lua: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
};
function rpIc(n, cls) { return '<svg class="rp-ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (RP_IC[n] || '') + '</svg>'; }
document.querySelectorAll('i[data-ic]').forEach(e => { e.outerHTML = rpIc(e.dataset.ic, 'p'); });

// Tema claro/escuro: mesmo 'diag_tema' da mesa do Diagnóstico e das demais guias (componente .dgm-tema)
function seletorTema() {
  const tb = document.querySelector('.topbar'); if (!tb || tb.querySelector('.dgm-tema') || typeof DiagTema === 'undefined') return;
  const d = document.createElement('div');
  d.className = 'dgm-tema'; d.setAttribute('role', 'group'); d.setAttribute('aria-label', 'Tema');
  d.innerHTML = [['claro','sol','Claro'],['escuro','lua','Escuro']].map(x =>
    `<button type="button" data-tema="${x[0]}" aria-pressed="${DiagTema.atual() === x[0]}">${rpIc(x[1])}${x[2]}</button>`).join('');
  const bc = tb.querySelector('.topbar-breadcrumb');
  if (bc) bc.parentNode.insertBefore(d, bc); else tb.appendChild(d);
  d.addEventListener('click', ev => {
    const b = ev.target.closest('[data-tema]'); if (!b) return;
    DiagTema.definir(b.dataset.tema);
    d.querySelectorAll('[data-tema]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
}

// ── Janelas: pilha (Esc fecha a de cima), foco, Tab preso, foco volta ──
const RP_FOCAVEIS = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const rpPilha = [];
function rpAbrir(id, alvo) {
  const el = document.getElementById(id);
  if (!el.classList.contains('aberto')) { rpPilha.push({ id, volta: document.activeElement }); el.classList.add('aberto'); }
  requestAnimationFrame(() => {
    const f = (alvo && document.getElementById(alvo)) || el.querySelector('.modal-close');
    if (f) f.focus({ preventScroll: true });
  });
}
function rpFechar(id) {
  const el = document.getElementById(id); if (!el) return;
  el.classList.remove('aberto');
  const k = rpPilha.findIndex(x => x.id === id);
  if (k >= 0) { const { volta } = rpPilha.splice(k, 1)[0]; if (volta && document.contains(volta)) volta.focus({ preventScroll: true }); }
}
const RP_FECHAR = { 'modal-repo': () => fecharModal(), 'modal-conf': () => fecharConf(false) };
document.addEventListener('keydown', e => {
  const topo = rpPilha[rpPilha.length - 1]; if (!topo) return;
  const el = document.getElementById(topo.id);
  if (e.key === 'Escape') { e.preventDefault(); (RP_FECHAR[topo.id] || (() => rpFechar(topo.id)))(); }
  else if (e.key === 'Tab') {
    const f = [...el.querySelectorAll(RP_FOCAVEIS)].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const pri = f[0], ult = f[f.length - 1];
    if (!el.contains(document.activeElement)) { e.preventDefault(); pri.focus(); }
    else if (e.shiftKey && document.activeElement === pri) { e.preventDefault(); ult.focus(); }
    else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
  }
});
['modal-ref','modal-repo','modal-conf'].forEach(id => document.getElementById(id).addEventListener('click', e => {
  if (e.target.id === id) (RP_FECHAR[id] || (() => rpFechar(id)))();
}));

// ── Utilitários ─────────────────────────────────────────────────
// Só endereço http/https é aceito e aberto (javascript:, data: etc. nunca viram link)
const urlSegura = u => (typeof u === 'string' && /^https?:\/\/[^\s]+$/i.test(u.trim())) ? u.trim() : null;
function getDominio(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch{ return ''; } }
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
// Mesma matéria = mesmo começo de título, ignorando acento, maiúscula e pontuação
const chaveMateria = l => {
  const t = semAcento(l.titulo).replace(/[^a-z0-9]+/g, ' ').trim();
  return t ? t.slice(0, 60) : 'url:' + (l.url || l.id);
};
const nomeVeiculo = l => l.fonte || getDominio(l.url) || 'Link';
// Inicial desenhada aqui (sem pedir ícone ao Google); cor por hash do nome
function avatar(nome, grande) {
  const ini = String(nome).replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  let h = 0; for (const c of String(nome)) h = (h * 31 + c.charCodeAt(0)) | 0;
  return `<span class="rp-av v${Math.abs(h) % 6}${grande ? ' g' : ''}" aria-hidden="true">${esc(ini)}</span>`;
}
const rpData = (s, longo) => s ? new Date(s).toLocaleDateString('pt-BR', { day: '2-digit', month: longo ? 'long' : '2-digit', year: 'numeric' }) : '';

// ── INIT ──────────────────────────────────────────────────────
(async () => {
  const u = await carregarUsuario();
  if (!u) { window.location.href = '../index.html'; return; }

  document.getElementById('app').innerHTML =
    gerarLayout('Repositório de Referências', 'repositorio') + `
    <div class="fade-in">
      <div class="rp-topo">
        <div><h2>Repositório de Referências</h2><p>Matérias, publicações e documentos externos sobre o projeto.</p></div>
        <button type="button" class="btn btn-primary" onclick="abrirModal()">${rpIc('mais','p')}Adicionar link</button>
      </div>
      <div class="rp-kpis" id="stats"></div>
      <div class="rp-filtros">
        <label class="rp-busca">${rpIc('busca','p')}<input type="search" id="f-busca" placeholder="Buscar título, veículo ou descrição" aria-label="Buscar" oninput="filtrar()" autocomplete="off"></label>
        <select class="rp-sel" id="f-lang" onchange="filtrar()" aria-label="Idioma">
          <option value="">Todos os idiomas</option>
          ${IDIOMAS.map(l=>`<option value="${l}">${l.toUpperCase()}</option>`).join('')}
        </select>
        <span class="rp-cont" id="cont-links"></span>
      </div>
      <div class="rp-chips" id="f-cats" role="group" aria-label="Categoria"></div>
      <div id="repo-conteudo"></div>
    </div>` + `</div></div></div>`;
  seletorTema();
  document.getElementById('f-cats').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b || b.disabled) return;
    filtCat = b.dataset.cat; filtrar();
  });

  await carregar();
})();

async function carregar() {
  const [{ data }, { count }] = await Promise.all([
    db.from('repositorio_links')
      .select('*,usuarios!repositorio_links_inserido_por_fkey(id,nome_completo)')
      .eq('ativo', true)
      .order('inserido_em', { ascending: false }),
    db.from('repositorio_links').select('id', { count: 'exact', head: true }).eq('ativo', false),
  ]);
  todosLinks = data || [];
  nInativos = count || 0;
  renderStats();
  filtrar();
}

// Agrupa links em matérias (o banco segue com um registro por link)
function agrupar(links) {
  const mapa = new Map();
  links.forEach(l => {
    const k = chaveMateria(l);
    if (!mapa.has(k)) mapa.set(k, { chave: k, links: [] });
    mapa.get(k).links.push(l);
  });
  return [...mapa.values()].map(g => {
    g.links.sort((a, b) => nomeVeiculo(a).localeCompare(nomeVeiculo(b), 'pt-BR'));
    // título exibido = o mais longo (o mais completo); data = a primeira publicação registrada
    g.titulo = g.links.map(l => l.titulo || l.url).sort((a, b) => b.length - a.length)[0];
    g.inserido_em = g.links.map(l => l.inserido_em).filter(Boolean).sort()[0];
    g.recente = g.links.map(l => l.inserido_em).filter(Boolean).sort().slice(-1)[0];
    g.categorias = [...new Set(g.links.map(l => l.categoria).filter(Boolean))];
    g.idiomas = [...new Set(g.links.map(l => l.idioma).filter(Boolean))];
    return g;
  }).sort((a, b) => String(b.recente || '').localeCompare(String(a.recente || '')));
}

function renderStats() {
  const mats = agrupar(todosLinks);
  const veics = new Set(todosLinks.map(l => semAcento(nomeVeiculo(l)))).size;
  const n = new Date();
  const mes = todosLinks.filter(l => { const d = new Date(l.inserido_em); return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth(); }).length;
  const ultimo = todosLinks.map(l => l.inserido_em).filter(Boolean).sort().slice(-1)[0];
  const k = (ic, l, v, s) => `<div class="rp-kpi"><span class="rp-kpi-l">${rpIc(ic,'p')}${l}</span><span class="rp-kpi-v">${v}</span><span class="rp-kpi-s">${s}</span></div>`;
  document.getElementById('stats').innerHTML =
    k('jornal', 'Matérias', mats.length, 'mesmo assunto agrupado') +
    k('link', 'Links', todosLinks.length, 'ativos' + (nInativos ? ' · ' + nInativos + (nInativos === 1 ? ' desativado' : ' desativados') : '')) +
    k('predio', 'Veículos', veics, 'fontes distintas') +
    k('cal', 'Neste mês', mes, ultimo ? 'último em ' + rpData(ultimo) : 'nenhum ainda');
}

function renderCats() {
  const base = todosLinks.filter(l => !filtLang || l.idioma === filtLang);
  const cont = c => base.filter(l => l.categoria === c).length;
  document.getElementById('f-cats').innerHTML =
    `<button type="button" class="rp-chip${filtCat ? '' : ' on'}" data-cat="" aria-pressed="${!filtCat}">Todas <span class="n">${base.length}</span></button>` +
    CATEGORIAS.map(c => {
      const n = cont(c);
      return `<button type="button" class="rp-chip${filtCat === c ? ' on' : ''}" data-cat="${esc(c)}" aria-pressed="${filtCat === c}"${n || filtCat === c ? '' : ' disabled'}>${esc(c)} <span class="n">${n}</span></button>`;
    }).join('');
}

function filtrar() {
  filtBusca = semAcento(document.getElementById('f-busca')?.value || '').trim();
  filtLang  = document.getElementById('f-lang')?.value || '';
  renderCats();

  const fil = todosLinks.filter(l => {
    if (filtCat  && l.categoria !== filtCat) return false;
    if (filtLang && l.idioma    !== filtLang) return false;
    if (filtBusca) {
      const txt = semAcento([l.titulo, l.descricao, l.fonte, l.url].join(' '));
      if (!txt.includes(filtBusca)) return false;
    }
    return true;
  });
  grupos = agrupar(fil);

  const contEl = document.getElementById('cont-links');
  if (contEl) contEl.textContent = `${grupos.length} ${grupos.length === 1 ? 'matéria' : 'matérias'} · ${fil.length} de ${todosLinks.length} links`;

  const el = document.getElementById('repo-conteudo');
  if (!grupos.length) {
    el.innerHTML = todosLinks.length
      ? `<div class="rp-vazio">${rpIc('busca')}<b>Nenhuma referência encontrada</b>Troque a busca, a categoria ou o idioma.</div>`
      : `<div class="rp-vazio">${rpIc('link')}<b>O repositório está vazio</b><button type="button" class="btn btn-primary btn-sm" style="margin-top:12px" onclick="abrirModal()">${rpIc('mais','p')}Adicionar o primeiro link</button></div>`;
    return;
  }
  el.innerHTML = `<div class="rp-lista">${grupos.map(renderMateria).join('')}</div>`;
}

function chipVeiculo(l) {
  const nome = nomeVeiculo(l), url = urlSegura(l.url);
  return url
    ? `<a class="rp-veic" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="Abrir em ${esc(nome)}">${avatar(nome)}<span class="nm">${esc(nome)}</span>${rpIc('externo')}</a>`
    : `<span class="rp-veic sem" title="Endereço inválido: não é http/https">${avatar(nome)}<span class="nm">${esc(nome)}</span></span>`;
}

function renderMateria(g, i) {
  const n = g.links.length;
  return `<div class="rp-mat">
    <span class="rp-th">${rpIc('jornal')}</span>
    <div style="min-width:0">
      <h3>${esc(g.titulo)}</h3>
      <div class="rp-mt">
        ${g.categorias.map(c => `<span class="rp-pill">${esc(c)}</span>`).join('')}
        ${g.idiomas.map(l => `<span class="rp-lang">${esc(l)}</span>`).join('')}
        ${g.inserido_em ? rpIc('cal') + `<span>${rpData(g.inserido_em)}</span>` : ''}
        <span>· ${n} ${n === 1 ? 'veículo' : 'veículos'}</span>
      </div>
      <div class="rp-veics">${g.links.map(chipVeiculo).join('')}</div>
    </div>
    <button type="button" class="btn btn-secondary btn-sm" onclick="abrirDetalhe(${i})">Detalhes</button>
  </div>`;
}

// ── DETALHE DA MATÉRIA ────────────────────────────────────────
function abrirDetalhe(i) {
  const g = grupos[i];
  if (!g) return;
  const isAdmin = appState.perfil === 'super_admin';
  const comImg = g.links.find(l => urlSegura(l.imagem_url));
  const comDesc = g.links.find(l => l.descricao);

  document.getElementById('ref-modal-titulo').textContent = g.titulo;
  document.getElementById('ref-modal-body').innerHTML = `
    ${comImg ? `<img class="rp-capa" src="${esc(urlSegura(comImg.imagem_url))}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
    <div class="rp-mt" style="margin:0 0 10px">
      ${g.categorias.map(c => `<span class="rp-pill">${esc(c)}</span>`).join('')}
      ${g.idiomas.map(l => `<span class="rp-lang">${esc(l)}</span>`).join('')}
    </div>
    ${comDesc ? `<p class="rp-desc">${esc(comDesc.descricao)}</p>` : '<p class="rp-desc vazio">Sem descrição disponível.</p>'}
    <div class="rp-sec">${g.links.length === 1 ? 'Veículo' : g.links.length + ' veículos'}</div>
    ${g.links.map(l => {
      const nome = nomeVeiculo(l), url = urlSegura(l.url);
      return `<div class="rp-vl">${avatar(nome, true)}
        <div style="min-width:0"><b>${esc(nome)}</b><small>Adicionado por ${esc(l.usuarios?.nome_completo || '—')} · ${rpData(l.inserido_em, true)}</small></div>
        <div class="rp-vl-ac">
          ${isAdmin ? `<button type="button" class="btn btn-secondary btn-sm rp-perigo" onclick="desativar('${esc(l.id)}')">Desativar</button>` : ''}
          ${url ? `<a class="btn btn-primary btn-sm" href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">${rpIc('externo','p')}Abrir</a>`
                : '<span class="rp-pill ina">Endereço inválido</span>'}
        </div></div>`;
    }).join('')}`;
  rpAbrir('modal-ref');
}

// ── ADICIONAR ─────────────────────────────────────────────────
function abrirModal() {
  metadataFetch = {};
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group">
      <label class="form-label" for="f-url">Endereço (http ou https) <span class="obrig">*</span></label>
      <div class="rp-url">
        <input class="form-control" id="f-url" type="url" placeholder="https://…" oninput="aoDigitarUrl(this.value)" autocomplete="off">
        <button type="button" class="btn btn-secondary" id="btn-fetch" onclick="buscarMetadata()" style="white-space:nowrap">${rpIc('busca','p')}Buscar informações</button>
      </div>
      <div id="fetch-status" class="rp-msg" role="status"></div>
      <div id="dup-status" class="rp-msg" role="status"></div>
    </div>
    <div id="preview-card" class="rp-prev">
      <img id="prev-img" alt="" hidden referrerpolicy="no-referrer">
      <div style="flex:1;min-width:0"><div class="rp-prev-f" id="prev-fonte"></div><div class="rp-prev-t" id="prev-titulo"></div><div class="rp-prev-d" id="prev-desc"></div></div>
    </div>
    <div id="form-fields" style="display:none;margin-top:12px">
      <div class="grid-2">
        <div class="form-group"><label class="form-label" for="f-titulo">Título</label><input class="form-control" id="f-titulo" type="text" placeholder="Título da matéria" oninput="checarMateria()"></div>
        <div class="form-group"><label class="form-label" for="f-fonte">Veículo</label><input class="form-control" id="f-fonte" type="text" placeholder="Ex.: UNESCO, G1, IUCN"></div>
      </div>
      <div class="form-group"><label class="form-label" for="f-desc">Resumo</label><textarea class="form-control" id="f-desc" rows="2" placeholder="Resumo do conteúdo da referência"></textarea></div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label" for="m-cat">Categoria <span class="obrig">*</span></label>
          <select class="form-control" id="m-cat"><option value="">Selecione…</option>${CATEGORIAS.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label" for="m-lang">Idioma</label>
          <select class="form-control" id="m-lang"><option value="">Selecione…</option>${IDIOMAS.map(l=>`<option value="${l}">${l.toUpperCase()}</option>`).join('')}</select></div>
      </div>
    </div>`;
  document.getElementById('modal-footer').innerHTML = `
    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
    <button type="button" class="btn btn-primary" id="btn-salvar" onclick="salvar()" disabled>Salvar referência</button>`;
  rpAbrir('modal-repo', 'f-url');
}

function msg(id, tipo, texto) {
  const el = document.getElementById(id); if (!el) return;
  el.className = 'rp-msg' + (texto ? ' ' + tipo : '');
  el.innerHTML = texto ? rpIc({ ok: 'check', info: 'info', alerta: 'alerta', erro: 'alerta' }[tipo], 'p') + '<span>' + texto + '</span>' : '';
}

function aoDigitarUrl(v) {
  metadataFetch = {};
  document.getElementById('preview-card').classList.remove('on');
  msg('fetch-status', '', '');
  const url = (v || '').trim();
  if (url && !urlSegura(url)) { msg('dup-status', 'erro', 'O endereço precisa começar com http:// ou https://.'); travarSalvar(true); return; }
  if (urlSegura(url) && todosLinks.some(l => l.url === url)) { msg('dup-status', 'erro', 'Este link já está no repositório.'); travarSalvar(true); return; }
  msg('dup-status', '', '');
  if (url.length >= 8) mostrarFormManual();
  checarMateria();
}

// Avisa (sem bloquear) quando a matéria já está no repositório por outro veículo
function checarMateria() {
  const url = (document.getElementById('f-url')?.value || '').trim();
  if (!urlSegura(url) || todosLinks.some(l => l.url === url)) return;
  const titulo = document.getElementById('f-titulo')?.value || metadataFetch.titulo || '';
  if (!titulo) { msg('dup-status', '', ''); return; }
  const k = chaveMateria({ titulo });
  const iguais = todosLinks.filter(l => chaveMateria(l) === k);
  msg('dup-status', iguais.length ? 'info' : '', iguais.length
    ? `Esta matéria já está no repositório em <strong>${iguais.length} ${iguais.length === 1 ? 'veículo' : 'veículos'}</strong>. O link novo entra na mesma ficha.`
    : '');
}

function travarSalvar(sim) { const b = document.getElementById('btn-salvar'); if (b) b.disabled = sim; }

async function buscarMetadata() {
  const url = document.getElementById('f-url')?.value?.trim();
  if (!url) { toast('Cole uma URL primeiro.', 'error'); return; }
  if (!urlSegura(url)) { msg('dup-status', 'erro', 'O endereço precisa começar com http:// ou https://.'); return; }

  const btn = document.getElementById('btn-fetch');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="rp-spin"></span>Buscando…'; }
  msg('fetch-status', 'info', 'Buscando informações da página…');

  try {
    const { data: { session } } = await db.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/fetch-link-metadata`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token || ''}`, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ url })
    });
    const data = await res.json();

    if (!data.ok && data.erro) {
      msg('fetch-status', 'alerta', esc(data.erro) + '. Preencha os campos manualmente.');
      mostrarFormManual();
      return;
    }
    metadataFetch = data;

    const prevImg = document.getElementById('prev-img');
    const img = urlSegura(data.imagem_url);
    if (img) { prevImg.src = img; prevImg.hidden = false; prevImg.onerror = () => { prevImg.hidden = true; }; } else prevImg.hidden = true;
    document.getElementById('prev-fonte').textContent = data.fonte || data.dominio || '';
    document.getElementById('prev-titulo').textContent = data.titulo || url;
    document.getElementById('prev-desc').textContent = (data.descricao || '').substring(0, 180);
    document.getElementById('preview-card').classList.add('on');

    mostrarFormManual();
    document.getElementById('f-titulo').value = data.titulo || '';
    document.getElementById('f-fonte').value  = data.fonte  || '';
    document.getElementById('f-desc').value   = data.descricao || '';
    if (data.idioma) {
      const sel = document.getElementById('m-lang');
      if ([...sel.options].some(o => o.value === data.idioma)) sel.value = data.idioma;
    }
    msg('fetch-status', 'ok', 'Informações carregadas. Revise e escolha a categoria.');
    checarMateria();
  } catch (e) {
    msg('fetch-status', 'alerta', 'Não foi possível buscar automaticamente. Preencha os campos abaixo.');
    mostrarFormManual();
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = rpIc('busca','p') + 'Buscar novamente'; }
  }
}

function mostrarFormManual() {
  document.getElementById('form-fields').style.display = 'block';
  const url = (document.getElementById('f-url')?.value || '').trim();
  travarSalvar(!urlSegura(url) || todosLinks.some(l => l.url === url));
}

async function salvar() {
  const url      = document.getElementById('f-url')?.value?.trim();
  const titulo   = document.getElementById('f-titulo')?.value?.trim();
  const fonte    = document.getElementById('f-fonte')?.value?.trim();
  const descricao= document.getElementById('f-desc')?.value?.trim();
  const categoria= document.getElementById('m-cat')?.value;
  const idioma   = document.getElementById('m-lang')?.value;

  if (!url) { toast('URL obrigatória.', 'error'); return; }
  if (!urlSegura(url)) { toast('O endereço precisa começar com http:// ou https://.', 'error'); return; }
  if (!categoria) { toast('Escolha uma categoria.', 'error'); return; }
  if (todosLinks.some(l => l.url === url)) { toast('Este link já foi adicionado ao repositório.', 'error'); return; }

  travarSalvar(true);
  const { error } = await db.from('repositorio_links').insert({
    url,
    titulo:     titulo  || metadataFetch.titulo  || url,
    fonte:      fonte   || metadataFetch.fonte   || '',
    descricao:  descricao || metadataFetch.descricao || '',
    imagem_url: urlSegura(metadataFetch.imagem_url) || null,
    categoria,
    idioma:     idioma  || metadataFetch.idioma  || 'pt',
    inserido_por: appState.usuario.id
  });
  if (error) { travarSalvar(false); toast('Erro ao salvar: ' + error.message, 'error'); return; }

  toast('Referência adicionada ao repositório.', 'success');
  fecharModal();
  await carregar();
}

function fecharModal() {
  rpFechar('modal-repo');
  metadataFetch = {};
}

// ── ADMIN: DESATIVAR (confirmação em janela própria) ──────────
let confResolver = null;
function confirmar(sub) {
  document.getElementById('conf-sub').textContent = sub;
  rpAbrir('modal-conf', 'conf-ok');
  return new Promise(res => { confResolver = res; });
}
function fecharConf(ok) {
  rpFechar('modal-conf');
  if (confResolver) { const r = confResolver; confResolver = null; r(!!ok); }
}

async function desativar(id) {
  const l = todosLinks.find(x => x.id === id);
  if (!(await confirmar(l ? nomeVeiculo(l) + ' · ' + (l.titulo || l.url) : ''))) return;
  const { error } = await db.from('repositorio_links').update({
    ativo: false,
    desativado_por: appState.usuario.id,
    desativado_em: new Date().toISOString()
  }).eq('id', id);
  if (error) { toast('Erro: ' + error.message, 'error'); return; }
  toast('Referência desativada.', 'info');
  rpFechar('modal-ref');
  await carregar();
}
</script>
