<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Revisor — TDR</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-sans,system-ui);background:#F3F4F6;display:flex;flex-direction:column}

/* HEADER */
.rv-header{background:#fff;border-bottom:1px solid var(--borda,#E5E7EB);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:10}
.rv-back{background:#F9FAFB;border:1px solid var(--borda,#E5E7EB);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--cinza-600,#4B5563);cursor:pointer;display:flex;align-items:center;gap:5px;text-decoration:none}
.rv-back:hover{background:#F3F4F6}
.rv-title{font-size:14px;font-weight:700;color:var(--cinza-900,#111827)}
.rv-sub{font-size:11px;color:var(--cinza-400,#9CA3AF);margin-top:1px}
.rv-prog{flex:1;display:flex;align-items:center;gap:10px;justify-content:center}
.rv-prog-label{font-size:11px;color:var(--cinza-500,#6B7280);white-space:nowrap}
.rv-prog-track{width:180px;height:5px;background:var(--cinza-100,#F3F4F6);border-radius:99px;overflow:hidden}
.rv-prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--verde-claro,#16A34A),#34D399);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rv-prog-count{font-size:12px;font-weight:700;color:var(--cinza-900,#111827);white-space:nowrap}
.rv-actions{display:flex;gap:8px}
.rv-btn-ghost{background:#F9FAFB;border:1px solid var(--borda,#E5E7EB);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--cinza-700,#374151);cursor:pointer}
.rv-btn-concluir{background:#6B7280;border:none;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;transition:background .2s}
.rv-btn-concluir.ativo{background:var(--verde-claro,#16A34A)}

/* BODY */
.rv-body{display:flex;flex:1;overflow:hidden}

/* PAINEL ESQ */
.rv-left{width:50%;background:#fff;border-right:1px solid var(--borda,#E5E7EB);display:flex;flex-direction:column;overflow:hidden}
.rv-left-top{padding:10px 16px;border-bottom:1px solid var(--borda,#E5E7EB);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.rv-left-title{font-size:10px;font-weight:700;color:var(--cinza-500,#6B7280);text-transform:uppercase;letter-spacing:.06em}
.rv-left-body{flex:1;overflow-y:auto;padding:18px 22px}

.rv-doc-section{margin-bottom:20px}
.rv-doc-label{font-size:9px;font-weight:700;color:var(--cinza-400,#9CA3AF);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.rv-doc-text{font-size:12.5px;color:var(--cinza-700,#374151);line-height:1.75}

.rv-mark{border-radius:3px;padding:1px 3px;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent}
.rv-mark.pendente{background:#FEF9C3;border-bottom-color:#EAB308}
.rv-mark.pendente:hover{background:#FEF08A}
.rv-mark.ativo{background:#FDE68A;border-bottom-color:#D97706;box-shadow:0 0 0 2px #FCD34D40}
.rv-mark.aceito-ia{background:#DCFCE7;border-bottom-color:#16A34A}
.rv-mark.aceito-user{background:#EEF2FF;border-bottom-color:#6366F1}
.rv-mark.rejeitado{background:#F1F5F9;border-bottom-color:#CBD5E1;color:#94A3B8;text-decoration:line-through}
.rv-mark-num{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:#EAB308;color:#fff;border-radius:50%;font-size:8px;font-weight:700;margin-right:3px;vertical-align:middle;flex-shrink:0}
.rv-mark.aceito-ia .rv-mark-num{background:#16A34A}
.rv-mark.aceito-user .rv-mark-num{background:#6366F1}
.rv-mark.ativo .rv-mark-num{background:#D97706}

/* PAINEL DIR */
.rv-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#F9FAFB}
.rv-right-top{padding:12px 18px;background:#fff;border-bottom:1px solid var(--borda,#E5E7EB);flex-shrink:0}
.rv-ponto-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.rv-ponto-dot{width:7px;height:7px;border-radius:50%;animation:rv-pulse 1.5s ease-in-out infinite}
@keyframes rv-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rv-ponto-campo{font-size:13px;font-weight:700;color:var(--cinza-900,#111827)}
.rv-ponto-motivo{font-size:11px;color:var(--cinza-500,#6B7280);margin-top:3px;line-height:1.4}

.rv-right-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}

/* diff cards */
.rv-card{border-radius:10px;overflow:hidden;border:1px solid}
.rv-card.antes{border-color:#FECACA}
.rv-card.depois{border-color:#BBF7D0}
.rv-card-header{padding:7px 12px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rv-card-header.antes{background:#FEF2F2;color:#DC2626}
.rv-card-header.depois{background:#F0FDF4;color:#16A34A}
.rv-card-body{padding:11px 12px;font-size:12px;line-height:1.75;background:#fff;color:var(--cinza-700,#374151);white-space:pre-wrap;word-break:break-word}
.rv-card-body.vazio{color:var(--cinza-400,#9CA3AF);font-style:italic}

/* editor */
.rv-editor-wrap{border-radius:10px;overflow:hidden;border:2px solid #6366F1}
.rv-editor-header{padding:7px 12px;background:#EEF2FF;display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#4F46E5}
.rv-editor{width:100%;min-height:90px;border:none;outline:none;padding:11px 12px;font-size:12px;font-family:inherit;line-height:1.75;color:var(--cinza-900,#111827);resize:none;background:#fff}

/* ações */
.rv-acoes{display:flex;gap:8px;padding:12px 18px;background:#fff;border-top:1px solid var(--borda,#E5E7EB);flex-shrink:0}
.rv-btn-rejeitar{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;color:#DC2626;cursor:pointer}
.rv-btn-pular{background:#F9FAFB;border:1px solid var(--borda,#E5E7EB);border-radius:8px;padding:9px 14px;font-size:12px;color:var(--cinza-500,#6B7280);cursor:pointer}
.rv-btn-aceitar{flex:1;background:var(--verde-claro,#16A34A);border:none;border-radius:8px;padding:9px;font-size:12px;font-weight:700;color:#fff;cursor:pointer}
.rv-btn-aceitar-user{flex:1;background:#4F46E5;border:none;border-radius:8px;padding:9px;font-size:12px;font-weight:700;color:#fff;cursor:pointer}

/* nav pontos */
.rv-nav{padding:10px 18px;background:#fff;border-top:1px solid var(--borda,#E5E7EB);display:flex;align-items:center;gap:6px;flex-shrink:0;justify-content:center}
.rv-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--borda,#E5E7EB);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--cinza-400,#9CA3AF);cursor:pointer;transition:all .2s}
.rv-dot.ativo{border-color:#EAB308;background:#FEF9C3;color:#D97706}
.rv-dot.aceito-ia{border-color:#16A34A;background:#DCFCE7;color:#16A34A}
.rv-dot.aceito-user{border-color:#6366F1;background:#EEF2FF;color:#6366F1}
.rv-dot.rejeitado{border-color:#CBD5E1;background:#F8FAFC;color:#94A3B8}
.rv-dot-line{width:16px;height:1px;background:var(--cinza-200,#E5E7EB)}

/* autor tag */
.rv-autor{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;margin-left:auto}
.rv-autor.ia{background:#DCFCE7;color:#16A34A}
.rv-autor.user{background:#EEF2FF;color:#4F46E5}

/* loading */
.rv-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px}
.rv-loading-spinner{width:36px;height:36px;border:3px solid var(--borda,#E5E7EB);border-top-color:var(--verde-claro,#16A34A);border-radius:50%;animation:rv-spin .7s linear infinite}
@keyframes rv-spin{to{transform:rotate(360deg)}}

/* legenda */
.rv-legenda{display:flex;gap:10px;align-items:center}
.rv-legenda-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--cinza-500,#6B7280)}
.rv-legenda-dot{width:8px;height:8px;border-radius:50%}

/* toggle modo */
.rv-modo-toggle{display:flex;gap:2px;background:#F3F4F6;border-radius:7px;padding:2px}
.rv-modo-btn{border:none;background:transparent;border-radius:5px;padding:4px 10px;font-size:10px;font-weight:600;color:var(--cinza-500,#6B7280);cursor:pointer;transition:all .15s}
.rv-modo-btn.ativo{background:#fff;color:var(--cinza-900,#111827);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* scrollbar */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--borda,#E5E7EB);border-radius:99px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="rv-header">
  <a class="rv-back" id="rv-back-btn" href="tdrs.html">← Voltar ao TDR</a>
  <div>
    <div class="rv-title" id="rv-title">Modo Revisor</div>
    <div class="rv-sub" id="rv-sub">Carregando...</div>
  </div>
  <div class="rv-prog">
    <span class="rv-prog-label">Progresso da revisão</span>
    <div class="rv-prog-track"><div class="rv-prog-fill" id="rv-prog-fill"></div></div>
    <span class="rv-prog-count" id="rv-prog-count">— de —</span>
  </div>
  <div class="rv-actions">
    <button class="rv-btn-concluir" id="rv-btn-concluir" disabled onclick="concluirRevisao()">Concluir revisão</button>
  </div>
</div>

<!-- BODY -->
<div class="rv-body">

  <!-- PAINEL ESQUERDO -->
  <div class="rv-left">
    <div class="rv-left-top">
      <span class="rv-left-title">📄 Campos do TDR</span>
      <div class="rv-legenda" id="rv-legenda">
        <div class="rv-legenda-item"><div class="rv-legenda-dot" style="background:#EAB308"></div>Pendente</div>
        <div class="rv-legenda-item"><div class="rv-legenda-dot" style="background:#16A34A"></div>Aceito IA</div>
        <div class="rv-legenda-item"><div class="rv-legenda-dot" style="background:#6366F1"></div>Editado</div>
      </div>
    </div>
    <div class="rv-left-body" id="rv-doc">
      <div class="rv-loading">
        <div class="rv-loading-spinner"></div>
        <div style="font-size:12px;color:var(--cinza-500)">Carregando sugestões da IA...</div>
      </div>
    </div>
  </div>

  <!-- PAINEL DIREITO -->
  <div class="rv-right">
    <div class="rv-right-top" id="rv-right-top">
      <div class="rv-ponto-status" id="rv-ponto-status">
        <div class="rv-ponto-dot" style="background:#EAB308"></div>
        Aguardando...
      </div>
      <div class="rv-ponto-campo" id="rv-ponto-campo">—</div>
      <div class="rv-ponto-motivo" id="rv-ponto-motivo">—</div>
    </div>
    <div class="rv-right-body" id="rv-right-body">
      <div class="rv-loading">
        <div class="rv-loading-spinner"></div>
      </div>
    </div>
    <div class="rv-acoes" id="rv-acoes" style="display:none">
      <button class="rv-btn-rejeitar" onclick="rejeitar()">✕ Rejeitar</button>
      <button class="rv-btn-pular" onclick="pular()">⏭ Pular</button>
      <button class="rv-btn-aceitar" onclick="aceitarIA()">✅ Aceitar sugestão da IA</button>
      <button class="rv-btn-aceitar-user" onclick="aceitarUser()">✏️ Aceitar minha edição</button>
    </div>
    <div class="rv-nav" id="rv-nav"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script>
// ── ESTADO ────────────────────────────────────────────────────────
let sugestoes=[];
let pontoAtual=0;
let tdrInfo={};
let nomeUsuario='';
let conteudoDocumento=null;

// ── INIT ──────────────────────────────────────────────────────────
async function init(){
  const params=new URLSearchParams(location.search);
  const tdrId=params.get('tdr_id');
  if(!tdrId){mostrarErro('tdr_id não informado na URL.');return;}

  // Pegar nome do usuário
  try{
    const{data:{user}}=await db.auth.getUser();
    if(user){
      const{data:prof}=await db.from('usuarios').select('nome').eq('id',user.id).single();
      nomeUsuario=prof?.nome||user.email||'Usuário';
    }
  }catch(_){}

  // Chamar Edge Function
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/sugerir-correcoes-tdr`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
      body:JSON.stringify({tdr_id:tdrId})
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Erro ao carregar sugestões');

    tdrInfo=data.tdr;
    conteudoDocumento=data.conteudo_documento||null;
    sugestoes=(data.sugestoes||[]).map(s=>({...s,estado:'pendente',textoEditado:s.depois}));

    // Header
    document.getElementById('rv-title').textContent=`Modo Revisor — TDR ${tdrInfo.numero}`;
    document.getElementById('rv-sub').textContent=`${tdrInfo.atividade_codigo} — ${tdrInfo.atividade_nome}`;

    if(sugestoes.length===0){
      mostrarErro('Nenhuma sugestão de correção gerada. O TDR pode já estar completo.');
      return;
    }

    renderDoc();
    renderNav();
    renderPonto(0);
    document.getElementById('rv-acoes').style.display='flex';

  }catch(e){
    mostrarErro(e.message);
  }
}

// ── RENDERIZAR DOCUMENTO COMPLETO (painel esq) ────────────────────
let modoVisualizacao='campos'; // 'campos' | 'documento'

function toggleModo(modo){
  modoVisualizacao=modo;
  document.getElementById('rv-modo-campos').className='rv-modo-btn'+(modo==='campos'?' ativo':'');
  document.getElementById('rv-modo-doc').className='rv-modo-btn'+(modo==='documento'?' ativo':'');
  renderDoc();
}

function renderDoc(){
  const sugestaoPorCampo={};
  sugestoes.forEach((s,i)=>sugestaoPorCampo[s.campo]=i);

  function secao(label, valor, campo=null){
    const idx=campo!=null?sugestaoPorCampo[campo]:undefined;
    const hasSugestao=idx!==undefined;
    const s=hasSugestao?sugestoes[idx]:null;
    const estado=s?.estado||'';
    let textoExibir=valor||'';
    if(hasSugestao){
      if(estado==='aceito-ia')textoExibir=s.depois;
      else if(estado==='aceito-user')textoExibir=s.textoEditado;
    }
    const vazio=!textoExibir;
    let conteudo='';
    if(hasSugestao){
      conteudo=`<mark class="rv-mark ${estado}${idx===pontoAtual?' ativo':''}" id="mark-${idx}" onclick="irPonto(${idx})">
        <span class="rv-mark-num">${idx+1}</span>${vazio?'<em style="color:var(--cinza-400)">(campo vazio — sugestão disponível)</em>':escHtml(textoExibir)}
      </mark>`;
    }else{
      conteudo=vazio?`<em style="color:var(--cinza-300,#D1D5DB)">(não preenchido)</em>`:escHtml(textoExibir);
    }
    return `<div class="rv-doc-section"><div class="rv-doc-label">${label}</div><div class="rv-doc-text">${conteudo}</div></div>`;
  }

  function secaoGrid(...pares){
    return `<div class="rv-doc-section"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${pares.map(([label,val])=>`<div><div class="rv-doc-label">${label}</div><div class="rv-doc-text">${escHtml(val)||'<em style="color:var(--cinza-300)">(—)</em>'}</div></div>`).join('')}
    </div></div>`;
  }

  const t=tdrInfo;

  const cabecalho=`
    <div style="border-bottom:1px solid var(--borda,#E5E7EB);padding-bottom:14px;margin-bottom:16px">
      <div style="font-size:16px;font-weight:700;color:var(--cinza-900,#111827);margin-bottom:4px">TDR ${escHtml(t.numero||'')}</div>
      <div style="font-size:12px;color:var(--cinza-500,#6B7280)">${escHtml(t.atividade_codigo||'')} — ${escHtml(t.atividade_nome||'')}</div>
      ${t.tipo?`<div style="margin-top:6px"><span style="font-size:10px;font-weight:700;background:#E6F1FB;color:#0C447C;padding:2px 8px;border-radius:4px;text-transform:uppercase">${t.tipo}</span></div>`:''}
    </div>`;

  if(modoVisualizacao==='documento' && conteudoDocumento){
    // Vista do documento original completo com destaque nos campos com sugestão
    let docTexto=escHtml(conteudoDocumento);
    // Destaca trechos que aparecem nos "antes" das sugestões
    sugestoes.forEach((s,i)=>{
      if(s.antes && s.antes!=='(campo vazio)' && s.antes.length>20){
        const trecho=escHtml(s.antes.slice(0,80));
        const cor={pendente:'#FEF9C3','aceito-ia':'#DCFCE7','aceito-user':'#EEF2FF',rejeitado:'#F1F5F9'}[s.estado]||'#FEF9C3';
        docTexto=docTexto.replace(trecho,
          `<mark style="background:${cor};border-radius:3px;padding:1px 2px;cursor:pointer" onclick="irPonto(${i})" title="${escHtml(s.label)}">${trecho}</mark>`
        );
      }
    });
    document.getElementById('rv-doc').innerHTML=cabecalho+
      `<div style="font-size:11px;color:var(--cinza-500);margin-bottom:10px;display:flex;align-items:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:#EAB308;display:inline-block"></span>
        Trechos destacados = campos com sugestão da IA. Clique para revisar.
      </div>
      <div style="font-size:12px;line-height:1.9;color:var(--cinza-700,#374151);white-space:pre-wrap;word-break:break-word">${docTexto}</div>`;
    return;
  }

  // Vista de campos estruturados (padrão)
  const html=cabecalho+
    secao('Objeto do TDR', t.objeto_pt, 'objeto_pt')+
    secao('Escopo do trabalho / Metodologia', t.escopo_pt, 'escopo_pt')+
    secao('Formação mínima exigida', t.formacao_minima_pt, 'formacao_minima_pt')+
    secao('Experiência requerida', t.experiencia_requerida_pt, 'experiencia_requerida_pt')+
    secao('Área de atuação', t.area_atuacao_pt, 'area_atuacao_pt')+
    secao('Equipe mínima', t.equipe_minima_pt, 'equipe_minima_pt')+
    secao('Atestados requeridos', t.atestados_pt, 'atestados_pt')+
    `<div style="border-top:1px solid var(--borda,#E5E7EB);padding-top:14px;margin-top:4px">
      ${secaoGrid(
        ['Prazo limite', t.prazo_limite?new Date(t.prazo_limite).toLocaleDateString('pt-BR'):''],
        ['Data contratação prevista', t.dt_contratacao?new Date(t.dt_contratacao).toLocaleDateString('pt-BR'):''],
        ['Valor estimado (BRL)', t.valor_brl?`R$ ${Number(t.valor_brl).toLocaleString('pt-BR',{minimumFractionDigits:2})}`:''],
        ['Valor estimado (USD)', t.valor_usd?`US$ ${Number(t.valor_usd).toLocaleString('pt-BR',{minimumFractionDigits:2})}`:'']
      )}
      ${t.observacao?secao('Observações', t.observacao):''}
    </div>`;

  document.getElementById('rv-doc').innerHTML=html;
}

// ── RENDERIZAR PONTO (painel dir) ─────────────────────────────────
function renderPonto(idx){
  pontoAtual=idx;
  const s=sugestoes[idx];

  // Header
  const statusLabel={pendente:'Aguardando revisão','aceito-ia':'✅ Aceito pela IA','aceito-user':'✏️ Editado por você',rejeitado:'✕ Rejeitado'};
  const statusCor={pendente:'#EAB308','aceito-ia':'#16A34A','aceito-user':'#6366F1',rejeitado:'#94A3B8'};
  document.getElementById('rv-ponto-status').innerHTML=`<div class="rv-ponto-dot" style="background:${statusCor[s.estado]};animation:${s.estado==='pendente'?'rv-pulse 1.5s ease-in-out infinite':'none'}"></div><span style="color:${statusCor[s.estado]}">${statusLabel[s.estado]}</span>`;
  document.getElementById('rv-ponto-campo').textContent=`Campo: ${s.label}`;
  document.getElementById('rv-ponto-motivo').textContent=`⚠️ ${s.motivo}`;

  // Corpo
  const vazio=!s.antes||s.antes==='(campo vazio)';
  document.getElementById('rv-right-body').innerHTML=`
    <div class="rv-card antes">
      <div class="rv-card-header antes">✕ &nbsp;Texto original</div>
      <div class="rv-card-body${vazio?' vazio':''}">${vazio?'(campo vazio)':escHtml(s.antes)}</div>
    </div>
    <div class="rv-card depois">
      <div class="rv-card-header depois">✦ &nbsp;Sugestão do Agente IA <span class="rv-autor ia">🤖 Agente IA</span></div>
      <div class="rv-card-body">${escHtml(s.depois)}</div>
    </div>
    <div class="rv-editor-wrap">
      <div class="rv-editor-header">✏️ &nbsp;Editar antes de aceitar <span class="rv-autor user">👤 ${nomeUsuario||'Você'}</span></div>
      <textarea class="rv-editor" id="rv-editor-texto" rows="5">${escHtml(s.textoEditado||s.depois)}</textarea>
    </div>`;

  // Scroll para o mark no painel esq
  const mark=document.getElementById(`mark-${idx}`);
  if(mark)mark.scrollIntoView({behavior:'smooth',block:'center'});

  renderNav();
  atualizarProgresso();
  renderDoc();
}

// ── AÇÕES ─────────────────────────────────────────────────────────
function aceitarIA(){
  sugestoes[pontoAtual].estado='aceito-ia';
  proximo();
}
function aceitarUser(){
  const texto=document.getElementById('rv-editor-texto')?.value.trim();
  if(!texto){toast('Digite o texto corrigido.','error');return;}
  sugestoes[pontoAtual].textoEditado=texto;
  sugestoes[pontoAtual].estado='aceito-user';
  proximo();
}
function rejeitar(){
  sugestoes[pontoAtual].estado='rejeitado';
  proximo();
}
function pular(){
  const prox=(pontoAtual+1)%sugestoes.length;
  renderPonto(prox);
}
function irPonto(idx){renderPonto(idx);}

function proximo(){
  renderDoc();
  renderNav();
  atualizarProgresso();
  const prox=sugestoes.findIndex((s,i)=>i>pontoAtual&&s.estado==='pendente');
  if(prox>=0){renderPonto(prox);return;}
  const qualquer=sugestoes.findIndex(s=>s.estado==='pendente');
  if(qualquer>=0){renderPonto(qualquer);return;}
  // Todos revisados
  renderPonto(pontoAtual);
  toast('✅ Todos os pontos revisados! Clique em "Concluir revisão".','success');
}

// ── NAV DOTS ──────────────────────────────────────────────────────
function renderNav(){
  const nav=document.getElementById('rv-nav');
  if(!nav)return;
  nav.innerHTML=sugestoes.map((s,i)=>`
    ${i>0?'<div class="rv-dot-line"></div>':''}
    <div class="rv-dot ${s.estado}${i===pontoAtual?' ativo':''}" onclick="irPonto(${i})" title="${s.label}">${i+1}</div>
  `).join('');
}

// ── PROGRESSO ─────────────────────────────────────────────────────
function atualizarProgresso(){
  const total=sugestoes.length;
  const feitos=sugestoes.filter(s=>s.estado!=='pendente').length;
  document.getElementById('rv-prog-fill').style.width=(feitos/total*100)+'%';
  document.getElementById('rv-prog-count').textContent=`${feitos} de ${total}`;
  const btn=document.getElementById('rv-btn-concluir');
  const todosFeitos=feitos===total;
  btn.disabled=!todosFeitos;
  btn.className='rv-btn-concluir'+(todosFeitos?' ativo':'');
}

// ── CONCLUIR ──────────────────────────────────────────────────────
async function concluirRevisao(){
  const btn=document.getElementById('rv-btn-concluir');
  btn.disabled=true;btn.textContent='Salvando...';

  try{
    const tdrId=tdrInfo.id;
    const camposParaSalvar={};
    const camposAlterados=[];
    const logCampos=[];

    for(const s of sugestoes){
      if(s.estado==='aceito-ia'){
        camposParaSalvar[s.campo]=s.depois;
        camposAlterados.push(s.campo);
        logCampos.push({campo:s.campo,label:s.label,texto:s.depois,autor:'Agente IA',estado:'aceito-ia'});
      }else if(s.estado==='aceito-user'){
        camposParaSalvar[s.campo]=s.textoEditado;
        camposAlterados.push(s.campo);
        logCampos.push({campo:s.campo,label:s.label,texto:s.textoEditado,autor:nomeUsuario,estado:'aceito-user'});
      }else if(s.estado==='rejeitado'){
        logCampos.push({campo:s.campo,label:s.label,texto:s.antes,autor:nomeUsuario,estado:'rejeitado'});
      }
    }

    // Atualizar TDR
    if(Object.keys(camposParaSalvar).length>0){
      const{error}=await db.from('tdrs').update(camposParaSalvar).eq('id',tdrId);
      if(error)throw new Error(error.message);
    }

    // Buscar próximo número de versão
    const{data:ultimaVersao}=await db.from('tdr_versoes').select('numero_versao').eq('tdr_id',tdrId).order('numero_versao',{ascending:false}).limit(1).maybeSingle();
    const proximaVersao=((ultimaVersao?.numero_versao||0))+1;

    // Salvar versão
    const aceitosIA=logCampos.filter(l=>l.estado==='aceito-ia').map(l=>l.label);
    const aceitosUser=logCampos.filter(l=>l.estado==='aceito-user').map(l=>l.label);
    const rejeitados=logCampos.filter(l=>l.estado==='rejeitado').map(l=>l.label);

    let comentario='Revisão guiada concluída.';
    if(aceitosIA.length)comentario+=` IA aceita em: ${aceitosIA.join(', ')}.`;
    if(aceitosUser.length)comentario+=` Editado por ${nomeUsuario} em: ${aceitosUser.join(', ')}.`;
    if(rejeitados.length)comentario+=` Rejeitados: ${rejeitados.join(', ')}.`;

    await db.from('tdr_versoes').insert({
      tdr_id:tdrId,
      numero_versao:proximaVersao,
      usuario_id:null,
      fase:tdrInfo.status,
      snapshot_dados:{campos:logCampos},
      campos_alterados:camposAlterados,
      comentario,
      autor_nome:aceitosUser.length?nomeUsuario:'Agente IA',
    });

    toast('✅ Revisão salva! Redirecionando...','success');
    setTimeout(()=>{
      location.href=`tdrs.html?abrir=${tdrId}&aba=versoes`;
    },1500);

  }catch(e){
    toast('Erro ao salvar: '+e.message,'error');
    btn.disabled=false;btn.textContent='Concluir revisão';
    btn.className='rv-btn-concluir ativo';
  }
}

// ── UTILS ─────────────────────────────────────────────────────────
function escHtml(str){
  if(!str)return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mostrarErro(msg){
  document.getElementById('rv-doc').innerHTML=`<div style="padding:24px;text-align:center;color:var(--cinza-500)">${msg}</div>`;
  document.getElementById('rv-right-body').innerHTML=`<div style="padding:24px;text-align:center;color:var(--cinza-500)">${msg}</div>`;
}

init();
</script>
</body>
</html>
