<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Tarefas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<style>
/* ── Toolbar ─────────────────────────────────────────────── */
.tk-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tk-tabs{display:inline-flex;background:var(--cinza-100);border-radius:var(--raio);padding:3px}
.tk-tab{border:0;background:transparent;padding:7px 16px;border-radius:6px;font:inherit;font-size:13px;
  font-weight:600;color:var(--cinza-600);cursor:pointer;transition:all .12s}
.tk-tab.on{background:var(--branco);color:var(--verde-medio);box-shadow:var(--sombra)}
.tk-spacer{flex:1}
.tk-sel{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--borda);border-radius:var(--raio);
  background:var(--branco);color:var(--cinza-800);cursor:pointer}
.tk-btn{border:0;background:var(--verde-medio);color:#fff;font:inherit;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:var(--raio);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s}
.tk-btn:hover{background:var(--verde)}
.tk-btn svg{width:16px;height:16px}

/* ── Kanban ──────────────────────────────────────────────── */
.tk-board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}
.tk-col{background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio-lg);min-height:120px;display:flex;flex-direction:column}
.tk-col.drag-over{border-color:var(--verde-claro);background:var(--verde-bg)}
.tk-col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;position:sticky;top:0}
.tk-col-h .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tk-col-h .nm{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza-700)}
.tk-col-h .ct{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--cinza-500);
  background:var(--branco);border:1px solid var(--borda);border-radius:6px;padding:1px 7px}
.tk-col-body{padding:0 10px 12px;display:flex;flex-direction:column;gap:9px}
.tk-empty{text-align:center;color:var(--cinza-400);font-size:12px;padding:16px 8px}

/* ── Card ────────────────────────────────────────────────── */
.tk-card{background:var(--branco);border:1px solid var(--borda);border-radius:10px;padding:11px 12px;cursor:pointer;
  box-shadow:var(--sombra);transition:box-shadow .12s,transform .08s;position:relative}
.tk-card:hover{box-shadow:var(--sombra-md)}
.tk-card.dragging{opacity:.5}
.tk-card .code{font-family:var(--font-mono);font-size:10px;color:var(--cinza-400);letter-spacing:.03em}
.tk-card .ttl{font-size:13.5px;font-weight:600;color:var(--cinza-900);margin:3px 0 9px;line-height:1.35}
.tk-card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prio{font-family:var(--font-mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
.prio-urgente{color:#fff;background:var(--erro)}
.prio-alta{color:#fff;background:#EA580C}
.prio-media{color:var(--aviso);border:1px solid var(--aviso)}
.prio-baixa{color:var(--cinza-500);border:1px solid var(--borda-forte)}
.lnk{font-family:var(--font-mono);font-size:9.5px;color:var(--verde-medio);background:var(--verde-bg);padding:2px 7px;border-radius:5px}
.frn{font-family:var(--font-mono);font-size:9.5px;color:#7c3aed;background:#f3e8ff;padding:2px 7px;border-radius:5px}
.due{font-size:10.5px;color:var(--cinza-500);display:inline-flex;align-items:center;gap:3px;margin-left:auto}
.due.late{color:var(--erro);font-weight:700}
.due.today{color:var(--aviso);font-weight:700}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;font-family:var(--font-mono);flex-shrink:0;border:1.5px solid var(--branco)}
.av-stack{display:inline-flex}.av-stack .av+.av{margin-left:-7px}

/* ── Minhas Tarefas (lista) ──────────────────────────────── */
.tk-group{margin-bottom:22px}
.tk-group-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tk-group-h .g-nm{font-size:13px;font-weight:700;color:var(--cinza-800)}
.tk-group-h .g-ct{font-family:var(--font-mono);font-size:11px;color:var(--cinza-500)}
.tk-group-h .g-bar{flex:1;height:1px;background:var(--borda)}
.tk-row{display:flex;align-items:center;gap:12px;background:var(--branco);border:1px solid var(--borda);
  border-radius:var(--raio);padding:11px 14px;cursor:pointer;transition:box-shadow .12s}
.tk-row:hover{box-shadow:var(--sombra-md)}
.tk-row+.tk-row{margin-top:7px}
.tk-row .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tk-row .r-ttl{font-size:13.5px;font-weight:600;color:var(--cinza-900);flex:1;min-width:0}
.tk-row .r-code{font-family:var(--font-mono);font-size:10px;color:var(--cinza-400);margin-right:2px}

/* ── Modal (FORA do #app) ────────────────────────────────── */
.tk-overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:flex-start;
  justify-content:center;z-index:1000;padding:40px 16px;overflow-y:auto}
.tk-overlay.on{display:flex}
.tk-modal{background:var(--branco);border-radius:var(--raio-xl);width:100%;max-width:1120px;box-shadow:var(--sombra-lg);
  animation:tkpop .16s ease}
@keyframes tkpop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tk-modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--borda)}
.tk-modal-h h3{margin:0;font-size:16px;font-weight:600;color:var(--cinza-900)}
.tk-modal-h .code{font-family:var(--font-mono);font-size:11px;color:var(--cinza-400)}
.tk-x{margin-left:auto;border:0;background:transparent;font-size:22px;color:var(--cinza-400);cursor:pointer;line-height:1}
.tk-modal-b{padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 28px;align-items:start}
.tk-mcol,.tk-campos{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:900px){.tk-modal-b{grid-template-columns:minmax(0,1fr)}}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--cinza-700);margin-bottom:5px}
.fld input[type=text],.fld input[type=date],.fld textarea,.fld select{width:100%;font:inherit;font-size:13.5px;
  padding:9px 11px;border:1px solid var(--borda-forte);border-radius:var(--raio);background:var(--branco);color:var(--cinza-900)}
.fld textarea{resize:vertical;min-height:64px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-t{font:inherit;font-size:12px;padding:6px 11px;border:1px solid var(--borda-forte);border-radius:99px;
  background:var(--branco);color:var(--cinza-600);cursor:pointer}
.chip-t.on{background:var(--verde-medio);border-color:var(--verde-medio);color:#fff}
.multi{border:1px solid var(--borda-forte);border-radius:var(--raio);padding:6px;max-height:132px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.multi label{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 7px;border-radius:6px;cursor:pointer;margin:0;font-weight:400;color:var(--cinza-800)}
.multi label:hover{background:var(--cinza-50)}
.multi input{width:15px;height:15px;accent-color:var(--verde-medio)}
.hint{font-size:11px;color:var(--cinza-500);margin-top:4px}
.tk-modal-f{padding:16px 22px;border-top:1px solid var(--borda);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.btn-sec{border:1px solid var(--borda-forte);background:var(--branco);color:var(--cinza-700);font:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:var(--raio);cursor:pointer}
.btn-pri{border:0;background:var(--verde-medio);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--raio);cursor:pointer}
.btn-pri:hover{background:var(--verde)}
.btn-ok{border:0;background:var(--sucesso);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:var(--raio);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn-danger-ghost{border:0;background:transparent;color:var(--erro);font:inherit;font-size:12.5px;cursor:pointer;margin-right:auto}
.hist{border-top:1px solid var(--borda);padding-top:12px;margin-top:2px}
.hist h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza-500)}
.hist-i{display:flex;gap:8px;font-size:12px;color:var(--cinza-600);padding:3px 0}
.hist-i .hi-dot{width:6px;height:6px;border-radius:50%;background:var(--cinza-300);margin-top:6px;flex-shrink:0}

@media(max-width:640px){.fld-row{grid-template-columns:1fr}}

/* ── Lista (tabela) ──────────────────────────────────────── */
.tk-tbl-wrap{overflow-x:auto;border:1px solid var(--borda);border-radius:var(--raio-lg);background:var(--branco)}
.tk-tbl{width:100%;border-collapse:collapse;min-width:720px}
.tk-tbl thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza-500);
  font-weight:600;padding:11px 14px;background:var(--cinza-50);border-bottom:1px solid var(--borda)}
.tk-tbl tbody tr{border-top:1px solid var(--borda);cursor:pointer}
.tk-tbl tbody tr:hover{background:var(--cinza-50)}
.tk-tbl td{padding:11px 14px;font-size:13px;color:var(--cinza-800);vertical-align:middle}
.tk-tbl .mono-cell{font-family:var(--font-mono);font-size:11px;color:var(--cinza-400);white-space:nowrap}
.tk-tbl .st-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ── Calendário ──────────────────────────────────────────── */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-titulo{font-size:15px;font-weight:600;color:var(--cinza-900);text-transform:capitalize;min-width:160px}
.cal-nav{border:1px solid var(--borda);background:var(--branco);width:32px;height:32px;border-radius:var(--raio);font-size:18px;cursor:pointer;color:var(--cinza-700)}
.cal-hoje{border:1px solid var(--borda);background:var(--branco);padding:7px 13px;border-radius:var(--raio);font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--verde-medio)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{margin-bottom:6px}
.cal-dowc{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--cinza-500);text-align:center;padding:4px 0}
.cal-cell{background:var(--branco);border:1px solid var(--borda);border-radius:8px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px}
.cal-cell.fora{background:var(--cinza-50);opacity:.55}
.cal-cell.hoje{border-color:var(--verde-claro);box-shadow:0 0 0 1px var(--verde-claro) inset}
.cal-dia{font-size:11px;font-weight:600;color:var(--cinza-500);align-self:flex-end}
.cal-chip{font-size:10.5px;line-height:1.25;color:var(--cinza-800);background:var(--cinza-50);border-radius:4px;
  padding:2px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip:hover{background:var(--verde-bg)}
.cal-mais{font-size:10px;color:var(--cinza-400);padding-left:4px}
@media(max-width:640px){.cal-cell{min-height:64px}.cal-chip{font-size:9px}}

/* ── Detalhe do modal (sub-abas) ─────────────────────────── */
.det-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.det-tab{border:0;background:var(--cinza-100);color:var(--cinza-600);font:inherit;font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:99px;cursor:pointer}
.det-tab.on{background:var(--verde-medio);color:#fff}
.det-empty{color:var(--cinza-400);font-size:12.5px;padding:10px 2px}
.det-corpo{font-size:13px}
/* checklist */
.ck-bar{height:6px;background:var(--cinza-100);border-radius:99px;overflow:hidden;margin-bottom:10px}
.ck-fill{height:100%;background:var(--verde-claro);transition:width .2s}
.ck-item{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid var(--cinza-100)}
.ck-item input{width:16px;height:16px;accent-color:var(--verde-medio);flex-shrink:0}
.ck-item span{flex:1;color:var(--cinza-800)}
.ck-item span.done{text-decoration:line-through;color:var(--cinza-400)}
.ck-x{border:0;background:transparent;color:var(--cinza-300);font-size:18px;cursor:pointer;line-height:1}
.ck-x:hover{color:var(--erro)}
.ck-add{display:flex;gap:8px;margin-top:10px}
.ck-add input{flex:1;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--borda-forte);border-radius:var(--raio)}
.ck-add button{border:0;background:var(--verde-bg);color:var(--verde);font:inherit;font-size:12px;font-weight:600;padding:0 14px;border-radius:var(--raio);cursor:pointer}
/* comentários */
.cm-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--cinza-100)}
.cm-h{font-size:12px;color:var(--cinza-500)}
.cm-h b{color:var(--cinza-800);font-weight:600}
.cm-h span{margin-left:6px;font-size:10.5px;color:var(--cinza-400)}
.cm-b{font-size:13px;color:var(--cinza-800);margin-top:2px;white-space:pre-wrap}
.cm-add{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.cm-add textarea{flex:1;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--borda-forte);border-radius:var(--raio);resize:vertical;min-height:44px}
.cm-add button{border:0;background:var(--verde-medio);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:10px 16px;border-radius:var(--raio);cursor:pointer;white-space:nowrap}
/* anexos */
.ax-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--cinza-100);font-size:13px}
.ax-item a{flex:1;color:var(--verde-medio);text-decoration:none}
.ax-item a:hover{text-decoration:underline}
.ax-add{display:inline-block;margin-top:12px;border:1px dashed var(--borda-forte);border-radius:var(--raio);padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--cinza-600);cursor:pointer}
.ax-add:hover{border-color:var(--verde-claro);color:var(--verde-medio)}

/* ── Subtarefa qualificada / anexos em comentários ───────── */
.ck-item{align-items:flex-start}
.ck-item>input[type=checkbox]{margin-top:2px}
.ck-main{flex:1;min-width:0}
.ck-desc{color:var(--cinza-800)}
.ck-desc.done{text-decoration:line-through;color:var(--cinza-400)}
.ck-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px}
.ck-resp{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--cinza-600)}
.ck-resp .av{width:18px;height:18px;font-size:8px}
.ck-resp.frn{background:var(--cinza-100);border-radius:99px;padding:1px 8px}
.ck-ed{font-size:14px}
.ck-add{flex-direction:column;align-items:stretch}
.ck-form{flex:1;display:flex;flex-direction:column;gap:8px}
.ck-form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ck-form input[type=text],.ck-form-row select,.ck-form-row input[type=date]{font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--borda-forte);border-radius:var(--raio);background:var(--branco)}
.ck-form-row select{flex:1;min-width:150px}
.ck-add .ck-form-row button{padding:8px 14px}
.ck-add .ck-form-row input[type=date]{flex:0 0 auto}
.ck-edit{background:var(--cinza-50,#F9FAFB);border-radius:var(--raio);padding:10px}
.ck-edit .btn-sec,.ck-edit .btn-pri{padding:6px 12px;font-size:12px}
.ck-file{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--borda-forte);border-radius:var(--raio);padding:6px 10px;font-size:12px;font-weight:600;color:var(--cinza-600);cursor:pointer;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ck-file:hover{border-color:var(--verde-claro);color:var(--verde-medio)}
.ck-axs,.cm-axs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ax-chip{display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--verde-medio);background:var(--verde-bg);border-radius:99px;padding:2px 9px;text-decoration:none}
.ax-chip:hover{text-decoration:underline}
.ax-chip-w{display:inline-flex;align-items:center;gap:2px}
.ax-orig{font-size:10.5px;color:var(--cinza-500);margin-top:2px}
.cm-tag{font-style:normal;font-size:10px;font-weight:600;color:var(--cinza-600);background:var(--cinza-100);border-radius:99px;padding:1px 7px;margin-left:6px}
.cm-add-acoes{display:flex;flex-direction:column;gap:6px;align-items:stretch}
@media(max-width:640px){.cm-add{flex-direction:column;align-items:stretch}.cm-add-acoes{flex-direction:row;justify-content:space-between}}

/* ── Tarefa restrita ──────────────────────────────────────── */
.tk-lock{font-size:11px;margin-right:4px}
.tk-restr{border:1px solid var(--borda);border-radius:var(--raio);padding:10px 12px}
.tk-restr.on{border-color:#D97706;background:#FFFBEB}

/* ── Seletor de atividade (busca + nome completo) ─────────── */
.pk{position:relative}
.pk-btn{width:100%;display:flex;align-items:flex-start;gap:8px;text-align:left;font:inherit;font-size:13px;padding:9px 11px;
  border:1px solid var(--borda-forte);border-radius:var(--raio);background:var(--branco);color:var(--cinza-900);cursor:pointer}
.pk-btn .pk-nome{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.pk-seta{margin-left:auto;color:var(--cinza-400);flex-shrink:0}
.pk-cod{font-family:var(--font-mono);font-size:11.5px;color:var(--verde-medio);white-space:nowrap;flex-shrink:0;padding-top:1px}
.pk-ph{color:var(--cinza-400)}
.pk-pop{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--branco);border:1px solid var(--borda-forte);
  border-radius:var(--raio);box-shadow:var(--sombra-lg);padding:8px}
.pk-busca{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--borda-forte);border-radius:var(--raio);margin-bottom:6px}
.pk-lista{max-height:340px;overflow-y:auto}
.pk-it{display:flex;gap:10px;align-items:flex-start;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.4;color:var(--cinza-800)}
.pk-it.hl{background:var(--verde-bg)}
.pk-it.sel{box-shadow:inset 3px 0 0 var(--verde-medio);background:var(--cinza-50,#F9FAFB)}

/* ── TDRs vinculados ─────────────────────────────────────── */
.tdr-lista{border:1px solid var(--borda-forte);border-radius:var(--raio);padding:4px;max-height:260px;overflow-y:auto}
.tdr-lista .tdr-it{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:400;color:var(--cinza-800);margin:0}
.tdr-lista .tdr-it:hover{background:var(--cinza-50,#F9FAFB)}
.tdr-lista .tdr-it input{width:15px;height:15px;margin-top:2px;accent-color:var(--verde-medio);flex-shrink:0}
.tdr-txt{flex:1;min-width:0}
.tdr-st{color:var(--cinza-500)}
.tdr-obj{font-size:11.5px;color:var(--cinza-500);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tdr-abrir{margin-left:6px;font-size:11px;color:var(--verde-medio);text-decoration:none;pointer-events:auto}
.tdr-abrir:hover{text-decoration:underline}
.tdr-rest{cursor:default;color:var(--cinza-500)}

/* ── Tipos de tarefa ──────────────────────────────────────── */
.tipo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tipo-op{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-size:12.5px;font-weight:600;padding:10px 11px;
  border:1px solid var(--borda-forte);border-radius:var(--raio);background:var(--branco);color:var(--cinza-700);cursor:pointer;line-height:1.25}
.tipo-op:hover{border-color:var(--tc)}
.tipo-op.on{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc);background:color-mix(in srgb,var(--tc) 8%,#fff);color:var(--cinza-900)}
.tipo-op-ic{font-size:18px}
.tipo-bloco{border:1px solid var(--borda);border-left:4px solid var(--tc);border-radius:var(--raio);padding:12px 14px;
  background:color-mix(in srgb,var(--tc) 4%,#fff)}
.tipo-bloco-h{font-size:12.5px;font-weight:700;color:var(--cinza-800);margin-bottom:10px}
.tipo-campos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
.tipo-campos .full{grid-column:1/-1}
.tipo-campos .fld input[type=datetime-local],.tipo-campos .fld input[type=url]{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--borda-forte);border-radius:var(--raio);background:var(--branco);color:var(--cinza-900)}
.tipo-bool{align-self:end;padding-bottom:9px}
@media(max-width:640px){.tipo-campos{grid-template-columns:minmax(0,1fr)}}
.tipo-badge{font-size:11px;font-weight:600;color:var(--cinza-700);border:1px solid var(--tc);border-radius:99px;padding:2px 9px}
.tk-tipo-ic{font-size:12px}
.tk-hora{font-family:var(--font-mono);font-size:10.5px;color:#2563EB;font-weight:600}
input.ro{background:var(--cinza-50,#F9FAFB);color:var(--cinza-600)}
.tk-modal-b1{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.tt-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tt-tbl th{text-align:left;font-size:11px;color:var(--cinza-500);font-weight:600;padding:6px;border-bottom:1px solid var(--borda)}
.tt-tbl td{padding:6px;border-bottom:1px solid var(--cinza-100);vertical-align:middle}
.tt-tbl input[type=text],.tt-tbl input[type=number]{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--borda-forte);border-radius:var(--raio);width:100%}
.tt-tbl input.tt-ic{width:52px;text-align:center}
.tt-tbl td:first-child{width:64px}
.tt-tbl input[type=color],.tt-novo input[type=color]{width:38px;height:30px;border:1px solid var(--borda-forte);border-radius:6px;padding:2px;background:#fff}
.tt-cp{color:var(--cinza-500);font-size:11.5px;max-width:260px}
.tt-novo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--borda);padding-top:14px}
.tt-novo input[type=text]{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--borda-forte);border-radius:var(--raio)}
#tt-novo-ic{width:64px;text-align:center}
#tt-novo-nm{flex:1;min-width:200px}

.tk-criador{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--cinza-100);font-size:10.5px;color:var(--cinza-500)}
.tk-criador .av{width:16px;height:16px;font-size:7px}
.tk-criador b{font-weight:600;color:var(--cinza-700)}

/* ── Modo leitura / edição ───────────────────────────────── */
fieldset.tk-campos{border:0;padding:0;margin:0;min-width:0}
fieldset.tk-campos:disabled input,fieldset.tk-campos:disabled select,fieldset.tk-campos:disabled textarea,
fieldset.tk-campos:disabled .pk-btn{background:var(--cinza-50,#F9FAFB);color:var(--cinza-800);cursor:default;opacity:1}
fieldset.tk-campos:disabled .tipo-op:not(.on){opacity:.45}
fieldset.tk-campos:disabled .tipo-op,fieldset.tk-campos:disabled .chip-t{cursor:default}
fieldset.tk-campos:disabled .pk-seta{visibility:hidden}
.tk-edit-faixa{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;background:#FFFBEB;border:1px solid #F59E0B;
  border-radius:var(--raio);padding:10px 12px;font-size:12.5px;color:#92400E}
.hist-mais{color:var(--verde-medio);text-decoration:none;font-weight:600}
.hist-mais:hover{text-decoration:underline}
.hist-motivo{font-size:11.5px;color:#92400E;background:#FFFBEB;border-radius:6px;padding:2px 7px;margin:3px 0;display:inline-block}
.hist-det{margin:5px 0 3px;padding:6px 9px;border-left:2px solid var(--borda-forte);background:var(--cinza-50,#F9FAFB);border-radius:0 6px 6px 0}
.hd-i{font-size:11.5px;color:var(--cinza-700);padding:2px 0}
.hd-i s{color:var(--cinza-400)}
.hd-long{white-space:pre-wrap;font-size:11.5px;margin:3px 0;padding:4px 7px;background:#fff;border:1px solid var(--cinza-100);border-radius:6px;max-height:140px;overflow:auto}
.hd-long span{display:block;font-size:10px;font-weight:700;color:var(--cinza-400);text-transform:uppercase}

/* ── Barra de progresso (card + lista) ───────────────────── */
.tk-prog{display:flex;align-items:center;gap:6px}
.tk-prog.card{margin-top:9px}
.tk-prog-bar{flex:1;height:5px;background:var(--cinza-100);border-radius:99px;overflow:hidden}
.tk-prog-fill{height:100%;border-radius:99px;transition:width .25s ease}
.tk-prog-lbl{font-family:var(--font-mono);font-size:9.5px;color:var(--cinza-500);white-space:nowrap}
.tk-prog.lista{min-width:96px}
.tk-prog.lista .tk-prog-bar{height:6px}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh">
    <div style="text-align:center">
      <div style="width:32px;height:32px;border:3px solid #E5E7EB;border-top-color:#2D6A4F;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      Carregando...
    </div>
  </div>
</div>

<!-- Modal fica FORA do #app (evita conflito de z-index com a sidebar) -->
<div class="tk-overlay" id="tk-overlay" onclick="if(event.target===this)fecharModal()">
  <div class="tk-modal" id="tk-modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/tarefas.js"></script>
</body>
</html>
