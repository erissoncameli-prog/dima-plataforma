<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA/AC — Usuários</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../css/global.css" rel="stylesheet">
<!-- tema claro/escuro (mesmo 'diag_tema' da mesa do Diagnóstico), antes de pintar -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('diag_tema')==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<!-- design system da mesa (tokens + tema, escopo body.dgm) + componentes de Administração (prefixo ad-) -->
<link href="../css/diagnostico-mesa.css" rel="stylesheet">
<link href="../css/administracao.css" rel="stylesheet">
</head>
<body class="dgm">
<div id="app"><div class="ad-carrega" role="status"><span class="ad-spin"></span>Carregando…</div></div>

<!-- Janelas fora do #app (armadilha 11); .ad-ov = escopo do tema. -->
<div class="modal-overlay ad-ov" id="modal-usr" role="dialog" aria-modal="true" aria-labelledby="mu-titulo" data-fundo-fecha="nao">
  <div class="modal">
    <div class="modal-header">
      <div style="min-width:0"><div class="modal-title" id="mu-titulo">Usuário</div><div class="ad-sub" id="mu-sub"></div></div>
      <button type="button" class="modal-close" onclick="fecharModal()" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="ad-abas" role="tablist" id="mu-abas" hidden></div>
    <div class="modal-body" id="mu-body"></div>
    <div class="modal-footer" id="mu-footer"></div>
  </div>
</div>

<div class="modal-overlay ad-ov" id="modal-foto" role="dialog" aria-modal="true" aria-labelledby="modal-foto-nome">
  <div class="modal estreito">
    <div class="modal-header">
      <div style="min-width:0"><div class="modal-title" id="modal-foto-nome"></div><div class="ad-sub" id="modal-foto-cargo"></div></div>
      <button type="button" class="modal-close" onclick="adFechar('modal-foto')" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>
    <div class="modal-body"><div class="ad-foto-g"><img id="modal-foto-img" src="" alt="Foto de perfil"></div></div>
    <div class="modal-footer">
      <button type="button" class="btn ad-btn-perigo" onclick="removerFotoModal()"><i data-ic="lixo"></i>Remover</button>
      <span class="ad-sp"></span>
      <button type="button" class="btn btn-secondary" onclick="adFechar('modal-foto')">Fechar</button>
      <button type="button" class="btn btn-primary" onclick="trocarFotoModal()"><i data-ic="camera"></i>Trocar foto</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/logos.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/diag-tema.js"></script>
<script src="../js/ajuda.js"></script>
<script src="../js/administracao.js"></script>
<script src="../js/usuarios.js"></script>
</body>
</html>
